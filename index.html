<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Training</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Training">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  /* Palette alignée sur l'app GAS officielle (body #0f1117, .card #1a1d29,
     bordures/inputs #2d3142, texte secondaire #8892a4) */
  --bg: #0f1117; --bg2: #1a1d29; --bg3: #1e2235;
  --border: #2d3142; --text: #e8eaf0; --muted: #8892a4;
  --accent: #4f6ef7; --green: #1D9E75; --red: #e05c5c;
  --radius: 14px; --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
/* Largeur type téléphone, centrée — sans effet sur un vrai mobile (déjà plus
   étroit que 430px), mais évite que l'app s'étire sur toute la largeur d'un
   navigateur desktop (pratique pour filmer/présenter l'app). */
body { max-width: 430px; margin: 0 auto; position: relative; }
@media (min-width: 431px) {
  html { background: #05060a; }
  body { box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 70px rgba(0,0,0,.55); }
}
#app { min-height: 100dvh; display: flex; flex-direction: column; }

/* ── Spinner ── */
.spinner-full { display:flex; align-items:center; justify-content:center; height:100dvh; }
.spinner-inline { display:flex; align-items:center; justify-content:center; padding:50px 0; }
.spin { width:30px; height:30px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes fadeInModal { from { opacity:0; } to { opacity:1; } }
@keyframes popIn { 0% { transform:scale(0.2) rotate(-8deg); opacity:0; } 70% { transform:scale(1.08) rotate(2deg); } 100% { transform:scale(1) rotate(0); opacity:1; } }
@keyframes slideDown { from { transform:translateY(-18px); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes slideUp2 { from { transform:translateY(18px); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes pulseGlow { 0%,100% { transform:translate(-50%,-50%) scale(1); opacity:0.5; } 50% { transform:translate(-50%,-50%) scale(1.18); opacity:0.2; } }

/* ── Login ── */
.login-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; padding:24px; }
.login-logo { width:88px; height:88px; margin-bottom:16px; border-radius:20px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
.login-title { font-size:24px; font-weight:700; margin-bottom:4px; }
.login-sub { font-size:14px; color:var(--muted); margin-bottom:40px; }
.login-form { width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px; }
.login-form input {
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  color:var(--text); font-size:16px; padding:14px 16px; outline:none; width:100%;
  transition:border-color .2s;
}
.login-form input:focus { border-color:var(--accent); }
.login-form input::placeholder { color:var(--muted); }
.btn-primary {
  background:var(--accent); color:#fff; border:none; border-radius:var(--radius);
  font-size:16px; font-weight:600; padding:14px; cursor:pointer; transition:opacity .2s;
}
.btn-primary:active { opacity:.8; }
.btn-primary:disabled { opacity:.5; cursor:default; }
.login-error { color:var(--red); font-size:13px; text-align:center; min-height:18px; }

/* ── Header ── */
.header {
  background:var(--bg2); border-bottom:1px solid var(--border);
  padding:calc(var(--safe-top) + 12px) 16px 12px;
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100;
}
.header-back { background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; padding:4px 8px; }
.header-title { font-size:17px; font-weight:600; flex:1; }
.header-sub { font-size:12px; color:var(--muted); }

/* ── Nav bar ── */
.navbar {
  position:fixed; bottom:0; left:0; right:0; max-width:430px; margin:0 auto;
  background:var(--bg2); border-top:1px solid var(--border);
  display:flex; padding:8px 0 calc(8px + var(--safe-bottom));
  z-index:100;
}
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; padding:4px 0; transition:color .2s; color:var(--muted); border:none; background:none; }
.nav-item.active { color:var(--accent); }
.nav-icon { font-size:22px; }
.nav-label { font-size:10px; font-weight:500; }

/* ── Page container ── */
.page { flex:1; overflow-y:auto; padding:16px 16px calc(80px + var(--safe-bottom)); }

/* ── Cards ── */
.card { background:var(--bg2); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
.card-value { font-size:28px; font-weight:700; }
.card-sub { font-size:12px; color:var(--muted); margin-top:4px; }

/* ── Stats row ── */
.stats-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }

/* ── XP bar ── */
.xp-bar-bg { background:var(--bg3); border-radius:99px; height:8px; margin:8px 0 4px; overflow:hidden; }
.xp-bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),#7c3aed); transition:width .6s ease; }

/* ── List items ── */
.list-item { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.list-item:last-child { border-bottom:none; }
.list-icon { font-size:22px; width:36px; text-align:center; }
.list-text { flex:1; }
.list-title { font-size:15px; font-weight:500; }
.list-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.list-arrow { color:var(--muted); font-size:16px; }

/* ── Badge ── */
.badge { display:inline-block; background:var(--accent); color:#fff; border-radius:99px; font-size:11px; font-weight:700; padding:2px 8px; }
.badge-green { background:var(--green); }
.badge-red { background:var(--red); }

/* ── Empty state ── */
.empty { text-align:center; padding:48px 16px; color:var(--muted); }
.empty-icon { font-size:48px; margin-bottom:12px; }
.empty-text { font-size:14px; }

/* ── Bilan ── */
.section-title { font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:20px 0 8px; }
.field-label { font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;letter-spacing:.5px; }
.bilan-input { width:100%;padding:8px;background:#0f1117;color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:16px;font-family:inherit; }
.bilan-input[readonly] { opacity:.6; }
.bilan-textarea { width:100%;padding:10px;background:#0f1117;color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:16px;font-family:inherit;resize:vertical;min-height:70px; }
.bilan-textarea[readonly] { opacity:.6; }
.bilan-banner { font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px;padding:8px 12px;background:#1e2235;border-radius:8px; }
.btn-secondary { width:100%;background:#2d3142;color:var(--text);border:none;border-radius:var(--radius);font-size:14px;font-weight:600;padding:12px;cursor:pointer;margin-bottom:4px; }
.btn-blue { background:linear-gradient(135deg,#378ADD,#1a5ba0);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;padding:14px;cursor:pointer; }
.btn-green { background:linear-gradient(135deg,#1D9E75,#167a5a);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;padding:14px;cursor:pointer; }
.btn-disabled { background:#2d3142;color:var(--text);border:none;border-radius:var(--radius);font-size:14px;font-weight:600;padding:14px;opacity:.55;cursor:not-allowed; }

/* ── Training ── */
.t-select { width:100%;padding:10px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit; }
.set-row { display:flex;align-items:center;gap:6px;margin-bottom:6px; }
.set-num { font-size:12px;font-weight:700;color:var(--muted);width:24px;flex-shrink:0;text-align:center; }
.set-input { flex:1;padding:8px 4px;background:#0f1117;color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:16px;text-align:center;min-width:0; }
.chrono-btn { background:#1e2444;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;padding:6px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0; }

/* ── Diète ── */
.diete-item { background:#161b2e;border-radius:12px;border:1.5px solid #1e6648;padding:14px 16px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center; }
.diete-bar  { position:absolute;top:0;left:0;bottom:0;width:3px;background:linear-gradient(180deg,#3ecf8e,#1a7a52);border-radius:12px 0 0 12px; }
.diete-arrow { width:26px;height:26px;background:#3ecf8e22;border:1px solid #3ecf8e66;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:#3ecf8e;font-weight:600; }
.macro-label { font-size:10px;color:var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="api.js?v=4"></script>
<script src="bilan.js?v=6"></script>
<script src="training.js?v=2"></script>
<script src="diete.js?v=8"></script>
<script src="mensurations.js?v=4"></script>
<script src="recettes.js?v=3"></script>
<script src="progression.js?v=4"></script>
<script src="collection.js?v=2"></script>
<script src="coach.js?v=2"></script>
<script src="protocole.js?v=3"></script>
<script src="programme-client.js?v=6"></script>
<script src="roadmap.js?v=2"></script>
<script>
// ── État global ───────────────────────────────────────────────────────
const S = {
  page: 'loading',
  client:  localStorage.getItem('at_client')  || '',
  token:   localStorage.getItem('at_token')   || '',
  isCoach: localStorage.getItem('at_coach') === '1' || localStorage.getItem('at_client') === 'yohan',
  data: {}
};

// Client 100% Supabase (connexion + données, aucun Sheets) — première brique : la connexion.
// SUPABASE_URL/SUPABASE_ANON_KEY/supaHeaders() viennent déjà de programme-client.js (chargé avant ce script).
const sbAuth = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let _recoverySession = null;
sbAuth.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    _recoverySession = session;
    _loginStep = 'reset-password';
    setPage('login');
  } else if (event === 'USER_UPDATED') {
    (async () => {
      // session.user.email peut être encore l'ancienne valeur au moment précis de cet événement —
      // on relit l'utilisateur pour avoir l'email réellement en vigueur côté Auth.
      const { data } = await sbAuth.auth.getUser().catch(() => ({ data: null }));
      const email = data && data.user && data.user.email;
      if (!email || email.endsWith('@apptraining-users.com')) return; // pas encore basculé sur un vrai email
      let client = S.client;
      if (!client) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?email=eq.${encodeURIComponent(email)}&select=client_id`, { headers: supaHeaders() }).catch(() => null);
        const rows = res && res.ok ? await res.json() : [];
        client = rows[0] ? rows[0].client_id : '';
      }
      if (!client) return;
      fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
        method: 'POST',
        headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
        body: JSON.stringify({ client_id: client, email, email_confirme: true })
      }).catch(() => {});
      if (S.data && S.data.profil && S.client === client) { S.data.profil.email = email; S.data.profil.email_confirme = true; }
    })();
  }
});

function setPage(name) {
  S.page = name;
  // Pour les pages bilan, document.body peut avoir été remplacé — on s'assure que #app existe
  if (!document.getElementById('app')) {
    document.body.innerHTML = '<div id="app"></div>';
  }
  render();
  // Bandeau "Retour coach" persistant en mode vue-client
  if (_viewAsClientOverride && name !== 'loading') {
    if (!document.getElementById('coachRetourBanner')) {
      const nom = (_clientSelectionne && _clientSelectionne.nom) || _viewAsClientOverride;
      const banner = document.createElement('div');
      banner.id = 'coachRetourBanner';
      banner.style.cssText = 'position:fixed;bottom:calc(56px + env(safe-area-inset-bottom) + 8px);left:50%;transform:translateX(-50%);z-index:8000;background:linear-gradient(135deg,#E8A838,#c88010);color:#1a0e00;border-radius:20px;padding:8px 16px 8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap;';
      banner.innerHTML = `<span style="font-size:12px;font-weight:700;">👁️ Vue de <strong>${esc(nom)}</strong></span><button onclick="exitVueClient()" style="background:rgba(0,0,0,0.2);border:none;color:#1a0e00;font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px;cursor:pointer;">✕ Retour</button>`;
      document.body.appendChild(banner);
    }
  } else if (S.isCoach && name !== 'loading' && name !== 'login') {
    // Petit accès rapide "Vue console" pour le coach, visible sur toutes ses pages
    // mobile tant qu'il n'est pas en train de prévisualiser un client (banner ci-dessus).
    if (!document.getElementById('coachConsoleBanner')) {
      const banner = document.createElement('div');
      banner.id = 'coachConsoleBanner';
      banner.style.cssText = 'position:fixed;bottom:calc(56px + env(safe-area-inset-bottom) + 8px);left:50%;transform:translateX(-50%);z-index:8000;background:linear-gradient(135deg,#4f6ef7,#2d4bd6);color:#fff;border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap;cursor:pointer;font-size:12px;font-weight:700;';
      banner.innerHTML = `💻 Vue console`;
      // Cache-buster : évite qu'un PWA installé sur écran d'accueil (pas de
      // pull-to-refresh, pas de barre d'adresse) reste bloqué sur une version
      // de console.html mise en cache par le navigateur/CDN (10 min de TTL).
      banner.onclick = () => { window.location.href = 'console.html?t=' + Date.now(); };
      document.body.appendChild(banner);
    }
  }
}

// ── Vue client (coach simule un client) ───────────────────────────────
let _coachSavedState = null;
let _vueClientRetour = 'mes-clients';

// andThen : callback de navigation à exécuter une fois en vue client (défaut loadHome)
// retour : page à afficher au clic sur "Retour coach" (défaut 'mes-clients')
//
// Le mode API (Supabase vs GAS/PWA) est normalement déterminé par `at_auth_mode` dans
// localStorage, réglé au login du client. Un coach n'est jamais loggé en mode 'supabase'
// (son propre compte passe par le flux GAS classique) : sans la bascule ci-dessous, la
// vue client héritait toujours du mode GAS du coach, donc affichait les anciennes données
// PWA prod pour un client pourtant supabase_only (ex: recettes de la base PWA au lieu de
// la table Supabase `recettes` — bug constaté sur la fiche de Manon Besnier).
async function enterVueClient(clientId, andThen, retour) {
  const nom = (_clientSelectionne && _clientSelectionne.nom) || clientId;
  _coachSavedState = {
    client: S.client,
    isCoach: S.isCoach,
    data: S.data,
    journeeData: _journeeData,
    authMode: localStorage.getItem('at_auth_mode')
  };
  S.client = clientId;
  S.isCoach = false;
  S.data = {};
  _journeeData = null;
  _viewAsClientOverride = clientId;
  _vueClientRetour = retour || 'mes-clients';
  // Le préchargement est propre à une identité client : on le réinitialise à
  // chaque bascule pour ne jamais montrer les données préchargées d'un autre
  // client (loadHome() relance le préchargement, mais andThen peut ouvrir
  // bilan/mensurations directement sans repasser par l'accueil).
  _resetPrechargement();

  let supabaseOnly = false;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}&select=supabase_only`, { headers: supaHeaders() });
    const rows = res.ok ? await res.json() : [];
    supabaseOnly = !!(rows[0] && rows[0].supabase_only);
  } catch(e) {}
  if (supabaseOnly) localStorage.setItem('at_auth_mode', 'supabase');
  else localStorage.removeItem('at_auth_mode');

  if (typeof andThen === 'function') andThen();
  else if (supabaseOnly) loadHomeSupabase();
  else loadHome();
}

function exitVueClient() {
  if (!_coachSavedState) return;
  _viewAsClientOverride = null;
  S.client  = _coachSavedState.client;
  S.isCoach = _coachSavedState.isCoach;
  S.data    = _coachSavedState.data;
  _journeeData = _coachSavedState.journeeData;
  if (_coachSavedState.authMode) localStorage.setItem('at_auth_mode', _coachSavedState.authMode);
  else localStorage.removeItem('at_auth_mode');
  _coachSavedState = null;
  _resetPrechargement();
  const banner = document.getElementById('coachRetourBanner');
  if (banner) banner.remove();
  setPage(_vueClientRetour || 'mes-clients');
}

// ── Rendu principal ───────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  switch (S.page) {
    case 'loading':       app.innerHTML = renderFullSpinner(); break;
    case 'login':         app.innerHTML = renderLogin();   bindLogin(); break;
    case 'home':          document.body.innerHTML = renderHome(); break;
    case 'home-erreur':   document.body.innerHTML = renderHomeErreur(); break;
    case 'home-supabase': document.body.innerHTML = renderHomeSupabase(); break;
    case 'training':
    case 'training-loading': document.body.innerHTML = renderTrainingPage(); break;
    case 'bilan':
    case 'bilan-loading': document.body.innerHTML = renderBilanPage(); break;
    case 'diete':
    case 'diete-loading': document.body.innerHTML = renderDietePage();
      if (_dSubPage === 'detail') {
        initDieteSliders((_dDetail && _dDetail.repas || []).length);
        initDieteStickyMacros();
      } else if (_dSubPage === 'journal' && _dJournalDateOuverte) {
        initDieteStickyMacros();
      }
      break;
    case 'mensurations':
    case 'mens-loading':  document.body.innerHTML = renderMensurationsPage(); break;
    case 'recettes':
    case 'recettes-loading': document.body.innerHTML = renderRecettesPage(); break;
    case 'roadmap':
    case 'roadmap-loading': document.body.innerHTML = renderRoadmapPage(); break;
    case 'classement':           app.innerHTML = renderClassement();           break;
    case 'profil':               app.innerHTML = renderProfil(); setTimeout(_majStatutPushClient, 0); break;
    case 'progression':          document.body.innerHTML = renderProgressionPage();      break;
    case 'collection':           document.body.innerHTML = renderCollectionPage();       break;
    case 'centre-bilans':        document.body.innerHTML = renderCentreBilans();         break;
    case 'notifications-coach':  document.body.innerHTML = renderNotificationsCoach();   break;
    case 'rapports-bugs':        document.body.innerHTML = renderRapportsBugs();         break;
    case 'mes-clients':          document.body.innerHTML = renderMesClients();           break;
    case 'aliments-a-valider':   document.body.innerHTML = renderAlimentsAValider();     break;
    case 'protocole':            document.body.innerHTML = renderProtocolePage();        break;
    case 'programme-client':
    case 'programme-client-loading': document.body.innerHTML = renderProgrammeClientPage(); break;
  }
}

// ── Spinner ───────────────────────────────────────────────────────────
// Spinner léger utilisé À L'INTÉRIEUR d'une page déjà affichée (header/nav
// visibles), pas un remplacement plein écran.
function renderSpinner() {
  return `<div class="spinner-inline"><div class="spin"></div></div>`;
}

// Spinner plein écran, uniquement pour l'état initial avant tout rendu (S.page
// démarre à 'loading' avant la connexion) — ne doit plus être atteint en pratique.
function renderFullSpinner() {
  return `<div class="spinner-full"><div class="spin"></div></div>`;
}

// ── Overlay de chargement (façon GAS) ───────────────────────────────────
// Petite fenêtre pop-up centrée avec fond grisé, pour les actions/navigations
// courtes (verrouiller un client, changer de page coach, etc.) — la page en
// cours reste visible en arrière-plan, pas de flash plein écran.
function showLoadingOverlay(message) {
  hideLoadingOverlay();
  const el = document.createElement('div');
  el.id = 'loadingOverlay';
  el.style.cssText = 'position:fixed;inset:0;background:rgba(8,9,15,0.6);backdrop-filter:blur(1.5px);display:flex;align-items:center;justify-content:center;z-index:9997;animation:fadeInModal .15s ease;';
  el.innerHTML = `<div style="background:#1a1d29;border:1px solid var(--border);border-radius:18px;padding:26px 30px;text-align:center;min-width:180px;max-width:260px;box-shadow:0 16px 50px rgba(0,0,0,.5);">
    <div class="spin" style="margin:0 auto 14px;"></div>
    <div style="font-size:13px;font-weight:600;color:#e8eaf0;">${esc(message || 'Chargement…')}</div>
  </div>`;
  document.body.appendChild(el);
}
function hideLoadingOverlay() {
  const el = document.getElementById('loadingOverlay');
  if (el) el.remove();
}

// ── Login ─────────────────────────────────────────────────────────────
// Flux en 2 temps : on demande d'abord l'identifiant (verifierClient), puis
// TOUJOURS l'écran mot de passe classique — jamais de pré-aiguillage sur
// clientAMotDePasse avant la saisie, pour ne jamais court-circuiter l'accès
// coach (code maître comparé en premier côté serveur, indépendamment de tout
// mot de passe stocké). Côté GAS, c'est seulement si le login échoue ET que
// le serveur confirme qu'aucun mot de passe n'existe encore (erreur
// 'sans_mot_de_passe') qu'on bascule sur l'écran de création. Côté Supabase,
// client_profils.mdp_defini permet de le savoir dès l'étape identifiant (le
// serveur Supabase renvoie la même erreur générique pour "mauvais mot de
// passe" et "compte inexistant", donc on ne peut pas s'y fier après coup).
let _loginStep   = 'identifiant'; // 'identifiant' | 'password' | 'create' | 'reset-password'
let _loginClient = '';
let _loginAuthMode = 'gas'; // 'gas' | 'supabase' — détecté via client_profils.supabase_only à l'étape identifiant
let _loginAuthEmail = ''; // email réellement utilisé pour l'auth Supabase (fictif ou réel confirmé)
let _loginEmailConfirme = false;

function renderLogin() {
  if (_loginStep === 'password')       return renderLoginPassword();
  if (_loginStep === 'create')         return renderLoginCreate();
  if (_loginStep === 'reset-password') return renderLoginResetPassword();
  return renderLoginIdentifiant();
}

function renderLoginIdentifiant() {
  return `
  <div class="login-page">
    <img class="login-logo" src="icons/icon-192.png" alt="">
    <div class="login-title">Mon Suivi</div>
    <div class="login-sub">Connecte-toi pour accéder à ton suivi</div>
    <div class="login-form">
      <input id="l-client" type="text" placeholder="Ton prénom" autocomplete="username" autocapitalize="none">
      <button class="btn-primary" id="l-btn">Continuer →</button>
      <div class="login-error" id="l-err"></div>
    </div>
  </div>`;
}

  const oublieHtml = _loginAuthMode === 'supabase'

    : '';
  return `
  <div class="login-page">

}

  return `
  <div class="login-page">
    <img class="login-logo" src="icons/icon-192.png" alt="">

    <div class="login-sub">Pour sécuriser ton espace coaching</div>
    <div class="login-form">
      <input id="l-email-create" type="email" placeholder="Ton adresse e-mail" autocomplete="email" style="font-size:16px">
      <div class="login-hint" style="font-size:13px;color:#888;margin-top:-8px;">Pour récupérer ton mot de passe si besoin</div>
      <input id="l-mdp1" type="password" placeholder="Minimum 6 caractères" autocomplete="new-password">
      <input id="l-mdp2" type="password" placeholder="Répète ton mot de passe" autocomplete="new-password">
      <button class="btn-primary" id="l-btn">Créer mon mot de passe →</button>
      <div class="login-error" id="l-err"></div>
    </div>
  </div>`;

function bindLogin() {
  const btn = document.getElementById('l-btn');
  if (_loginStep === 'identifiant') {
    btn.addEventListener('click', doVerifierClient);
    document.getElementById('l-client').addEventListener('keydown', e => { if (e.key === 'Enter') doVerifierClient(); });
  } else if (_loginStep === 'password') {
    const handler = _loginAuthMode === 'supabase' ? doLoginSupabase : doLogin;
    btn.addEventListener('click', handler);
    document.getElementById('l-mdp').addEventListener('keydown', e => { if (e.key === 'Enter') handler(); });
  } else if (_loginStep === 'create') {
    const handler = _loginAuthMode === 'supabase' ? doCreerMotDePasseSupabase : doCreerMotDePasse;
    btn.addEventListener('click', handler);
    const emailCreate = document.getElementById('l-email-create');
    if (emailCreate) emailCreate.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('l-mdp1').focus(); });
    document.getElementById('l-mdp2').addEventListener('keydown', e => { if (e.key === 'Enter') handler(); });
  } else if (_loginStep === 'reset-password') {
    btn.addEventListener('click', doDefinirNouveauMotDePasse);
    document.getElementById('l-mdp2').addEventListener('keydown', e => { if (e.key === 'Enter') doDefinirNouveauMotDePasse(); });
  }
  const oublie = document.getElementById('l-oublie');
  if (oublie) oublie.addEventListener('click', doMotDePasseOublie);
}

async function doVerifierClient() {
  const client = document.getElementById('l-client').value.trim().toLowerCase();
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('l-err');
  if (!client) { err.textContent = 'Entre ton prénom.'; return; }
  btn.disabled = true; btn.textContent = '…';
  err.textContent = '';
  try {
    // Client 100% Supabase (marqué client_profils.supabase_only) : flux d'auth Supabase, jamais GAS.
    // Tous les autres identifiants suivent le flux GAS existant, inchangé.
    const resProfil = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(client)}&select=client_id,supabase_only,email,email_confirme,mdp_defini`, { headers: supaHeaders() });
    const profils = resProfil.ok ? await resProfil.json() : [];
    if (profils[0] && profils[0].supabase_only) {
      const p = profils[0];
      _loginClient = client;
      _loginAuthMode = 'supabase';
      _loginEmailConfirme = !!p.email_confirme;
      _loginAuthEmail = (p.email_confirme && p.email) ? p.email : (client + '@apptraining-users.com');
      // mdp_defini connu à l'avance : on ne devine plus depuis l'erreur générique de signInWithPassword.
      _loginStep = p.mdp_defini ? 'password' : 'create';
      setPage('login');
      return;
    }
    const res  = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'verifierClient', client }) });
    const json = await res.json();
    if (!json.ok || !json.existe) throw new Error('Identifiant inconnu.');
    _loginClient = client;
    _loginAuthMode = 'gas';
    _loginStep = 'password';
    setPage('login');
  } catch(e) {
    err.textContent = e.message || 'Erreur de connexion.';
    btn.disabled = false; btn.textContent = 'Continuer →';
  }
}

// ── Connexion 100% Supabase (aucun appel GAS) ──────────────────────────
async function doLoginSupabase() {
  const mdp = document.getElementById('l-mdp').value;
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('l-err');
  if (!mdp) { err.textContent = 'Entre ton mot de passe.'; return; }
  btn.disabled = true; btn.textContent = '…';
  err.textContent = '';
  try {
    const { data, error } = await sbAuth.auth.signInWithPassword({ email: _loginAuthEmail, password: mdp });
    if (error) {
      // mdp_defini est déjà connu (vérifié à l'étape identifiant) : une erreur ici ne peut être
      // qu'un mauvais mot de passe, jamais un compte inexistant — plus de redirection automatique.
      err.textContent = 'Mot de passe incorrect.';
      btn.disabled = false; btn.textContent = 'Se connecter';
      return;
    }
    await _completerConnexionSupabase(data.session);
  } catch(e) {
    err.textContent = e.message || 'Erreur de connexion.';
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
}

async function doMotDePasseOublie() {
  const err = document.getElementById('l-err');
  if (!_loginEmailConfirme || !_loginAuthEmail) {
    err.textContent = 'Ajoute et confirme ton email dans Paramètres une fois connecté pour activer la récupération. En attendant, contacte ton coach.';
    return;
  }
  err.style.color = '';
  err.textContent = '…';
  try {
    const { error } = await sbAuth.auth.resetPasswordForEmail(_loginAuthEmail, {
      redirectTo: window.location.origin + window.location.pathname
    });
    if (error) throw new Error(error.message);
    err.textContent = 'Email envoyé, vérifie ta boîte de réception.';
  } catch(e) {
    err.textContent = e.message || 'Erreur lors de l\'envoi.';
  }
}

async function doDefinirNouveauMotDePasse() {
  const mdp1 = document.getElementById('l-mdp1').value;
  const mdp2 = document.getElementById('l-mdp2').value;
  const btn  = document.getElementById('l-btn');
  const err  = document.getElementById('l-err');
  err.textContent = '';
  if (mdp1.length < 6) { err.textContent = 'Minimum 6 caractères.'; return; }
  if (mdp1 !== mdp2) { err.textContent = 'Les mots de passe ne correspondent pas.'; return; }
  if (!_recoverySession) { err.textContent = 'Session de récupération expirée, redemande un email.'; return; }
  btn.disabled = true; btn.textContent = '…';
  try {
    const { error } = await sbAuth.auth.updateUser({ password: mdp1 });
    if (error) throw new Error(error.message);
    const email = _recoverySession.user.email;
    let client = email.endsWith('@apptraining-users.com') ? email.split('@')[0] : '';
    if (!client) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?email=eq.${encodeURIComponent(email)}&select=client_id`, { headers: supaHeaders() });
      const rows = res.ok ? await res.json() : [];
      client = rows[0] ? rows[0].client_id : '';
    }
    _loginClient = client;
    await _completerConnexionSupabase(_recoverySession);
    _recoverySession = null;
  } catch(e) {
    err.textContent = e.message || 'Erreur serveur.';
    btn.disabled = false; btn.textContent = 'Valider →';
  }
}

async function doCreerMotDePasseSupabase() {
  const emailSaisi = (document.getElementById('l-email-create').value || '').trim().toLowerCase();
  const mdp1 = document.getElementById('l-mdp1').value;
  const mdp2 = document.getElementById('l-mdp2').value;
  const btn  = document.getElementById('l-btn');
  const err  = document.getElementById('l-err');
  err.textContent = '';
  if (!emailSaisi || !emailSaisi.includes('@')) { err.textContent = 'Entre une adresse e-mail valide.'; return; }
  if (mdp1.length < 6) { err.textContent = 'Minimum 6 caractères.'; return; }
  if (mdp1 !== mdp2) { err.textContent = 'Les mots de passe ne correspondent pas.'; return; }
  btn.disabled = true; btn.textContent = '…';
  try {
    const { data, error } = await sbAuth.auth.signUp({ email: emailSaisi, password: mdp1 });
    if (error) throw new Error(error.message);
    let session = data.session;
    if (!session) {
      const retry = await sbAuth.auth.signInWithPassword({ email: emailSaisi, password: mdp1 });
      if (retry.error) throw new Error(retry.error.message);
      session = retry.data.session;
    }
    await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: _loginClient, mdp_defini: true, email: emailSaisi, email_confirme: true })
    }).catch(() => {});
    await _completerConnexionSupabase(session);
  } catch(e) {
    err.textContent = e.message || 'Erreur serveur.';
    btn.disabled = false; btn.textContent = 'Créer mon mot de passe →';
  }
}

async function _completerConnexionSupabase(session) {
  // Verrouillage app (coach) — vérifié AVANT de finaliser la connexion, même avec
  // le bon mot de passe : un client verrouillé ne doit jamais atteindre l'accueil.
  let estCoach = false;
  try {
    const lockRes = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(_loginClient)}&select=verrouille_app,est_coach`, { headers: supaHeaders() });
    const lockRows = lockRes.ok ? await lockRes.json() : [];
    if (lockRows[0] && lockRows[0].verrouille_app) {
      await sbAuth.auth.signOut();
      const err = document.getElementById('l-err');
      if (err) err.textContent = 'Application verrouillée par le coach.';
      const btn = document.getElementById('l-btn');
      if (btn) { btn.disabled = false; btn.textContent = 'Se connecter'; }
      return;
    }
    estCoach = !!(lockRows[0] && lockRows[0].est_coach);
  } catch(e) { /* échec de la vérif réseau : on laisse passer plutôt que de bloquer tout le monde par erreur */ }

  localStorage.setItem('at_client', _loginClient);
  localStorage.setItem('at_token', session.access_token);
  localStorage.setItem('at_coach', estCoach ? '1' : '0');
  localStorage.setItem('at_auth_mode', 'supabase');
  S.client = _loginClient;
  S.token = session.access_token;
  S.isCoach = estCoach;
  _loginStep = 'identifiant';
  _loginClient = '';
  _loginAuthMode = 'gas';
  _loginAuthEmail = '';
  _loginEmailConfirme = false;
  // Trace la dernière connexion réelle (fire-and-forget, ne bloque jamais le login).
  fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(S.client)}`, {
    method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ derniere_connexion: new Date().toISOString() })
  }).catch(() => {});
  await loadHomeSupabase();
}

async function doLogin() {
  const mdp = document.getElementById('l-mdp').value;
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('l-err');
  if (!mdp) { err.textContent = 'Entre ton mot de passe.'; return; }
  btn.disabled = true; btn.textContent = '…';
  err.textContent = '';
  try {
    const res  = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'login', client: _loginClient, mdp })
    });
    const json = await res.json();
    if (!json.ok) {
      if (json.error === 'sans_mot_de_passe') { _loginStep = 'create'; setPage('login'); return; }
      throw new Error(json.error || 'Identifiants incorrects');
    }
    await _completerConnexion(json);
  } catch(e) {
    err.textContent = e.message === 'token_invalide' ? 'Identifiants incorrects.' : (e.message || 'Erreur de connexion.');
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
}

async function doCreerMotDePasse() {
  const mdp1 = document.getElementById('l-mdp1').value;
  const mdp2 = document.getElementById('l-mdp2').value;
  const btn  = document.getElementById('l-btn');
  const err  = document.getElementById('l-err');
  err.textContent = '';
  if (mdp1.length < 4) { err.textContent = 'Minimum 4 caractères.'; return; }
  if (mdp1 !== mdp2) { err.textContent = 'Les mots de passe ne correspondent pas.'; return; }
  btn.disabled = true; btn.textContent = '…';
  try {
    const res  = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'creerMotDePasse', client: _loginClient, mdp: mdp1 })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error === 'mdp_trop_court' ? 'Minimum 4 caractères.' : 'Erreur lors de la création.');
    await _completerConnexion(json);
  } catch(e) {
    err.textContent = e.message || 'Erreur serveur.';
    btn.disabled = false; btn.textContent = 'Créer mon mot de passe →';
  }
}

async function _completerConnexion(json) {
  localStorage.setItem('at_client', json.client);
  localStorage.setItem('at_token',  json.token);
  const isCoach = !!(json.coachMode || json.client === 'yohan');
  localStorage.setItem('at_coach',  isCoach ? '1' : '0');
  S.client  = json.client;
  S.token   = json.token;
  S.isCoach = isCoach;
  _loginStep = 'identifiant';
  _loginClient = '';
  _resetPrechargement();
  await loadHome();
}

// reconstruits côté Supabase, cet accueil n'affiche que ce qui existe déjà.
async function loadHomeSupabase(){
  try {
    const [profils, prog, journee] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(S.client)}&select=prenom,nom,chimie_actif,email,email_confirme,date_naissance,taille_cm,date_debut,jour_paiement,mode_simplifie`, { headers: supaHeaders() }).then(r => r.ok ? r.json() : []),
      chargerProgressionSupabase().catch(() => null),
      _loadJourneeDataSupabase().catch(() => ({ aucun: true }))
    ]);
    S.data.profil = profils[0] || {};
    // Le mode simplifié est réglé côté serveur (voir toggleModeSimplifie) — on
    // resynchronise le cache local à chaque chargement pour rester cohérent
    // si le client change d'appareil.
    try { localStorage.setItem('modeSimplifie', S.data.profil.mode_simplifie ? 'true' : 'false'); } catch(e) {}
    if (prog) {
      S.data.prog = prog;
      S.data.prog.nom = [S.data.profil.prenom, S.data.profil.nom].filter(Boolean).join(' ') || S.client;
    }
    _journeeData = journee;
  } catch(e) { S.data.profil = {}; _journeeData = { aucun: true }; }
  setPage('home-supabase');
  _apresChargementHome();
}

// ── Home ──────────────────────────────────────────────────────────────
let _journeeData = null;

// ── Préchargement (navigation instantanée vers Bilan/Programme/Diète/Mensurations) ──
// Se relance à CHAQUE retour à l'accueil (pas juste une fois par session) —
// donc quel que soit le nombre d'allers-retours, la prochaine page visitée
// est déjà prête. Chaque page consomme sa donnée préchargée une seule fois
// (setPage direct, sans spinner) puis repasse en fetch normal si on la
// revisite sans être repassé par l'accueil entre-temps — les validations et
// saisies restent, elles, toujours en direct.
let _pf = { home: null, bilan: null, tInfos: null, tFeuilles: null, tSemaines: null, tSeances: null, diete: null, mens: null };
let _pfInFlight = false;
let _pfSession  = 0; // incrémenté à chaque bascule d'identité (login, vue client) pour ignorer les résultats d'un préchargement lancé pour un autre client

function _resetPrechargement() {
  _pfSession++;
  _pf = { home: null, bilan: null, tInfos: null, tFeuilles: null, tSemaines: null, tSeances: null, diete: null, mens: null };
  _pfInFlight = false;
}

function schedulerPrechargement() {
  if (_pfInFlight) return;
  _pfInFlight = true;
  const maSession = _pfSession;
  setTimeout(() => { precharger(maSession).finally(() => { _pfInFlight = false; }); }, 400);
}

async function precharger(maSession) {
  // Les 5 chargements (accueil compris) sont indépendants entre eux et
  // peuvent tourner en parallèle. chargerBilan et chargerJourneeEnCours
  // passent par apiEtendreBilan (voir api.js) pour ne jamais tourner en
  // même temps l'une que l'autre.
  const pHome = Promise.all([
    api('chargerProgressionClient'),
    apiEtendreBilan('chargerJourneeEnCours')
  ]).then(([prog, journee]) => { if (_pfSession === maSession) _pf.home = { prog, journee }; }).catch(() => {});
  const pBilan = apiEtendreBilan('chargerBilan').then(d => { if (_pfSession === maSession) _pf.bilan = d; }).catch(() => {});
  const pTraining = (async () => {
    const [infos, feuilles] = await Promise.all([
      api('chargerInfosActivite'),
      api('lireFeuillesActives')
    ]);
    if (_pfSession !== maSession) return;
    _pf.tInfos = infos || {};
    _pf.tFeuilles = Array.isArray(feuilles) ? feuilles : [feuilles].filter(Boolean);
    const feuilleActive = _pf.tFeuilles[0];
    if (feuilleActive) {
      const [semaines, seances] = await Promise.all([
        api('listerSemaines', { nomFeuille: feuilleActive }),
        api('listerSeances',  { nomFeuille: feuilleActive })
      ]);
      if (_pfSession !== maSession) return;
      _pf.tSemaines = semaines || [];
      _pf.tSeances  = seances  || [];
    }
  })().catch(() => {});
  const pDiete = api('listerDietes').then(d => { if (_pfSession === maSession) _pf.diete = d; }).catch(() => {});
  const pMens  = api('chargerMensurations').then(d => { if (_pfSession === maSession) _pf.mens = d; }).catch(() => {});
  await Promise.allSettled([pHome, pBilan, pTraining, pDiete, pMens]);
}

async function loadHome() {
  if (_pf.home) {
    S.data.prog  = _pf.home.prog;
    _journeeData = _pf.home.journee;
    _pf.home = null;
    setPage('home');
    schedulerPrechargement();
    _apresChargementHome();
    return;
  }
  showLoadingOverlay('Chargement…');
  try {
    // Note : chargerBilan() n'est PAS appelée ici (comme en GAS, qui ne l'appelle
    // que sur la page Bilan) — chargerBilan et chargerJourneeEnCours appellent
    // toutes les deux etendreBilan() côté serveur ; apiEtendreBilan() (api.js)
    // les sérialise pour empêcher toute écriture concurrente.
    const [prog, journee] = await Promise.all([
      api('chargerProgressionClient'),
      apiEtendreBilan('chargerJourneeEnCours')
    ]);
    S.data.prog  = prog;
    _journeeData = journee;
    hideLoadingOverlay();
    setPage('home');
    schedulerPrechargement();
    _apresChargementHome();
  } catch(e) {
    hideLoadingOverlay();
    if (e.message === 'token_invalide') {
      // Session réellement invalide côté serveur (token expiré/rejeté) — là seulement on déconnecte.
      localStorage.removeItem('at_token');
      _loginStep = 'identifiant'; _loginClient = '';
      setPage('login');
    } else {
      // Erreur réseau/API transitoire (GAS lent, coupure...) : on garde la session intacte,
      // sinon un simple aléa réseau déconnecte silencieusement le client (bug observé après
      // un retour arrière qui relance le chargement de l'accueil).
      setPage('home-erreur');
    }
  }
}

function _apresChargementHome() {
  chargerNotificationsClient();
  chargerNotifPrefs();
  // Ouverture depuis une notification push (sw.js openWindow) sur un onglet
  // qui n'était pas encore ouvert — le cas "déjà ouvert" passe par le
  // postMessage écouté plus bas dans le fichier.
  if (new URLSearchParams(location.search).get('openNotif')) {
    history.replaceState(null, '', window.location.pathname);
    setTimeout(() => ouvrirNotificationsClient(), 300);
  }
  // Détection déblocages niveau/titres — le coach voit ses propres passages
  // de niveau/titres comme n'importe quel client (comme en GAS), seule la
  // vue client (coach qui consulte le profil d'un autre) est exclue.
  if (!_viewAsClientOverride) {
    setTimeout(() => verifierDeblocages(S.data.prog), 300);
  }
  // fire-and-forget classement — lit un spreadsheet séparé (LOG_SHEET_ID), safe en concurrent
  // Pas d'appel du tout en mode simplifié (comme le GAS : chargerTop5() n'est
  // même pas invoquée), pas juste un masquage visuel.
  if (!modeSimplifieActif()) {
    setTimeout(async () => {
      try {
        let cl;
        if (isSupabase()) {
          const [progRes, profilRes] = await Promise.all([
            fetch(`${SUPABASE_URL}/rest/v1/client_progression?select=client_id,xp_total,titre_actif&order=xp_total.desc&limit=10`, { headers: supaHeaders() }),
            fetch(`${SUPABASE_URL}/rest/v1/client_profils?supabase_only=eq.true&select=client_id,prenom,nom,mode_simplifie`, { headers: supaHeaders() }),
          ]);
          const progRows = progRes.ok ? await progRes.json() : [];
          const profils = profilRes.ok ? await profilRes.json() : [];
          const profilMap = {};
          // Mode simplifié = ne pas apparaître dans le classement des autres.
          profils.filter(p => !p.mode_simplifie).forEach(p => { profilMap[p.client_id] = [p.prenom, p.nom].filter(Boolean).join(' ') || p.client_id; });
          cl = progRows.filter(p => profilMap[p.client_id]).map(p => ({
            id: p.client_id, nom: profilMap[p.client_id],
            xpTotal: p.xp_total || 0, niveau: Math.max(1, Math.floor((p.xp_total || 0) / 50) + 1),
            titreActif: p.titre_actif || null,
          }));
        } else {
          const raw = await api('listerClassement');
          cl = typeof raw === 'string' ? JSON.parse(raw || '[]') : (Array.isArray(raw) ? raw : []);
        }
        S.data.classement = cl;
        const el = document.getElementById('top5Home');
        if (el) el.outerHTML = renderTop5Home(cl);
      } catch(e) {}
    }, 0);
  }
  // Badges coach : chargés en parallèle en arrière-plan, injectés dans le DOM
  // dès que dispo (au lieu de bloquer l'affichage de l'accueil comme avant)
  if (S.isCoach) {
    api('listerBilansCoach').then(bilans => {
      S.data.coachBilans = bilans;
      const n = (bilans || []).filter(b => !b.coachTraite).length;
      S.data.coachBilansCount = n;
      const el = document.getElementById('badgeCentreBilans');
      if (el) el.innerHTML = n > 0 ? `<div style="position:absolute;top:8px;right:8px;background:#1D9E75;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;">${n}</div>` : '';
    }).catch(() => { S.data.coachBilansCount = 0; });
    api('chargerRapportsBugs').then(rapports => {
      const n = rapports?.nonLus || 0;
      S.data.bugsNonLus = n;
      const el = document.getElementById('badgeRapports');
      if (el) el.innerHTML = n > 0 ? `<div style="position:absolute;top:8px;right:8px;background:#e74c3c;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;">${n}</div>` : '';
    }).catch(() => { S.data.bugsNonLus = 0; });
    api('chargerTousLesLogs').then(result => {
      const lastSeen = result?.lastSeen || 0;
      const n = (result?.logs || []).filter(l => l.tms > lastSeen).length;
      S.data.notifsNonLues = n;
      const el = document.getElementById('badgeNotifs');
      if (el) el.innerHTML = n > 0 ? `<div style="position:absolute;top:8px;right:8px;background:#e05c5c;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;">${n}</div>` : '';
    }).catch(() => { S.data.notifsNonLues = 0; });
  }
}

// ── Mode simplifié ───────────────────────────────────────────────────
// Cache l'affichage XP/progression/classement — l'XP continue de tourner
// normalement côté serveur, seul le rendu client est concerné (voir
// modeSimplifieActif() dans _showJourneeEnregistreeSupabase, _pcFlashSeanceValidee,
// _afficherXPValidationSupa, verifierDeblocages). Persisté dans
// client_profils.mode_simplifie (source de vérité, lu aussi par le classement
// pour exclure ces clients) ; localStorage sert de cache local synchrone
// (resynchronisé à chaque chargement de l'accueil, voir loadHomeSupabase).
function modeSimplifieActif() {
  try { return localStorage.getItem('modeSimplifie') === 'true'; } catch(e) { return false; }
}
async function toggleModeSimplifie() {
  const nouveau = !modeSimplifieActif();
  try { localStorage.setItem('modeSimplifie', nouveau ? 'true' : 'false'); } catch(e) {}
  ouvrirSettings();
  if (S.page === 'home') render();
  if (S.data.profil) S.data.profil.mode_simplifie = nouveau;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, mode_simplifie: nouveau })
    });
  } catch(e) {}
}

let _notifsClient = [];

async function chargerNotificationsClient() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_notifications?client_id=eq.${encodeURIComponent(S.client)}&order=created_at.desc&limit=50`, { headers: supaHeaders() });
    _notifsClient = res.ok ? await res.json() : [];

// ── Classement ────────────────────────────────────────────────────────
async function loadClassement() {
  showLoadingOverlay('Chargement…');
  try {
    if (isSupabase()) {
      // Classement Supabase : uniquement les clients supabase_only
      const [progRes, profilRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/client_progression?select=client_id,xp_total,titre_actif&order=xp_total.desc`, { headers: supaHeaders() }),
        fetch(`${SUPABASE_URL}/rest/v1/client_profils?supabase_only=eq.true&select=client_id,prenom,nom,mode_simplifie`, { headers: supaHeaders() }),
      ]);
      const progRows = progRes.ok ? await progRes.json() : [];
      const profils = profilRes.ok ? await profilRes.json() : [];
      const profilMap = {};
      // Mode simplifié = ne pas apparaître dans le classement des autres.
      profils.filter(p => !p.mode_simplifie).forEach(p => { profilMap[p.client_id] = [p.prenom, p.nom].filter(Boolean).join(' ') || p.client_id; });
      // Garde uniquement les clients supabase_only ayant une progression
      S.data.classement = progRows
        .filter(p => profilMap[p.client_id])
        .map(p => ({
          id: p.client_id,
          nom: profilMap[p.client_id],
          xpTotal: p.xp_total || 0,
          niveau: Math.max(1, Math.floor((p.xp_total || 0) / 50) + 1),
          titreActif: p.titre_actif || null,
        }));
    } else {
      const raw = await api('listerClassement');
      S.data.classement = typeof raw === 'string' ? JSON.parse(raw || '[]') : (Array.isArray(raw) ? raw : []);
    }
    hideLoadingOverlay();
    setPage('classement');
  } catch(e) { hideLoadingOverlay(); setPage('home'); }
}

function renderClassement() {
  const items = S.data.classement || [];

  const rows = items.map((c, i) => {
    const tier = typeof niveauToTier === 'function' ? niveauToTier(c.niveau) : 'debutant';
    const isMe = c.id === S.client;
    const tDef = (c.titreActif && typeof TITRES_DEF !== 'undefined') ? TITRES_DEF.find(t => t.id === c.titreActif) : null;

async function doSauverInfosProfil() {
  const msg = document.getElementById('pf-infos-msg');
  const dateNaissance = document.getElementById('pf-naissance').value || null;
  const tailleRaw = document.getElementById('pf-taille').value;
  const taille = tailleRaw ? parseInt(tailleRaw, 10) : null;
  msg.style.color = '';
  msg.textContent = '…';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, date_naissance: dateNaissance, taille_cm: taille })
    });
    if (!res.ok) throw new Error('Erreur serveur.');
    S.data.profil = S.data.profil || {};
    S.data.profil.date_naissance = dateNaissance;
    S.data.profil.taille_cm = taille;
    msg.textContent = 'Enregistré ✓';
  } catch(e) {
    msg.style.color = 'var(--red)';
    msg.textContent = e.message || 'Erreur serveur.';
  }
}

async function doSauverEmailProfil() {
  const input = document.getElementById('pf-email');
  const msg = document.getElementById('pf-email-msg');
  const email = input.value.trim();
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = 'Email invalide.'; msg.style.color = 'var(--red)'; return; }
  msg.style.color = '';
  msg.textContent = '…';
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, email })
    });
    S.data.profil = S.data.profil || {};
    // On retente updateUser tant que l'email Auth n'est pas confirmé (le champ peut déjà être
    // pré-rempli côté client_profils sans que le compte Supabase Auth n'ait jamais été basculé dessus).
    const needsAuthUpdate = email && !S.data.profil.email_confirme;
    S.data.profil.email = email;
    if (needsAuthUpdate) {
      const { error } = await sbAuth.auth.updateUser({ email });
      if (error) throw new Error(error.message);
      msg.textContent = 'Vérifie ta boîte mail pour confirmer cette adresse.';
    } else {
      msg.textContent = 'Enregistré ✓';
    }
  } catch(e) {
    msg.style.color = 'var(--red)';
    msg.textContent = e.message || 'Erreur serveur.';
  }
}

async function doChangerMotDePasse() {
  const mdp1 = document.getElementById('pf-mdp1').value;
  const mdp2 = document.getElementById('pf-mdp2').value;
  const msg = document.getElementById('pf-mdp-msg');
  msg.style.color = 'var(--red)';
  if (mdp1.length < 6) { msg.textContent = 'Minimum 6 caractères.'; return; }
  if (mdp1 !== mdp2) { msg.textContent = 'Les mots de passe ne correspondent pas.'; return; }
  msg.style.color = '';
  msg.textContent = '…';
  try {
    const { error } = await sbAuth.auth.updateUser({ password: mdp1 });
    if (error) throw new Error(error.message);
    document.getElementById('pf-mdp1').value = '';
    document.getElementById('pf-mdp2').value = '';
    msg.textContent = 'Mot de passe changé ✓';
  } catch(e) {
    msg.style.color = 'var(--red)';
    msg.textContent = e.message || 'Erreur serveur.';
  }
}

// ── Notifications push (Web Push natif, sans Firebase) ──────────────────
// Chaque client peut s'abonner pour recevoir les notifications envoyées par
// le coach (voir console.html → fiche client → "Envoyer une notification").
// Même mécanisme que côté coach (console.html) pour recevoir les alertes
// bilan/séance/journée — voir sql/2026-08-01_notifications_push.sql.
const VAPID_PUBLIC_KEY = 'BMATlCrbt_oBJLCMm3Yahc7gtCSa69t7d9tbzX1IIHimuaMD7rPZRNTkT09X6LQmVbJsMpplnbOdwld6ZLvDFmc';

function _urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function forcerMiseAJour(){
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch(e) {}
  window.location.href = window.location.pathname + '?t=' + Date.now();
}

async function _majStatutPushClient() {
  const el = document.getElementById('pushStatusClient');
  if (!el || !('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    el.textContent = sub ? '✓ Notifications activées sur cet appareil.' : '';
  } catch(e) {}
}

// Retourne true seulement si l'abonnement a réellement été créé — sert à
// toggleNotificationsGenerales() pour ne faire basculer la préférence que si
// l'activation a vraiment réussi (sinon le toggle mentirait sur l'état réel).
async function activerNotifications() {
  const btn = document.getElementById('btnActiverPushClient');
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
    showToast('Notifications non supportées sur cet appareil.', '#c0392b'); return false;
  }
  // iOS n'autorise les notifications web QUE pour une PWA installée à l'écran d'accueil
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (isIOS && !isStandalone) {
    showToast('Ajoute d\'abord l\'app à ton écran d\'accueil pour activer les notifications.', '#c0392b');
    return false;
  }
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') { showToast('Permission refusée.', '#c0392b'); return false; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: _urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    const j = sub.toJSON();
    const res = await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?on_conflict=endpoint`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth })
    });
    if (!res.ok) throw new Error(await res.text());
    showToast('🔔 Notifications activées', '#1D9E75');
    _majStatutPushClient();
    return true;
  } catch(e) {
    showToast(e.message || 'Erreur', '#c0392b');
    return false;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Activer les notifications'; }
  }
}

// Désinscrit réellement l'appareil (contrairement à l'ancien toggle qui ne
// faisait qu'écrire client_notif_prefs.push_actif sans jamais toucher à
// l'abonnement navigateur — l'appareil continuait donc à recevoir les push
// même "désactivées"). Supprime aussi la ligne push_subscriptions : les envois
// manuels du coach et l'edge function n'ont alors plus aucun endpoint à viser.
async function desactiverNotifications() {
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && await reg.pushManager.getSubscription();
      if (sub) {
        await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, { method: 'DELETE', headers: supaHeaders() });
        await sub.unsubscribe();
      }
    }
  } catch(e) {}
  _majStatutPushClient();
}

// Toggle "Notifications" des Paramètres : active/désactive réellement le push
// au moment du clic (abonnement navigateur + push_subscriptions), pas
// seulement la préférence en base.
async function toggleNotificationsGenerales() {
  const activerMaintenant = _notifPrefs.push_actif === false;
  if (activerMaintenant) {
    const ok = await activerNotifications();
    if (!ok) return; // permission refusée / non supporté : préférence inchangée
  } else {
    await desactiverNotifications();
  }
  _notifPrefs.push_actif = activerMaintenant;
  if (document.getElementById('settingsPanel')) ouvrirSettings();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_notif_prefs?on_conflict=client_id`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, push_actif: _notifPrefs.push_actif })
    });
  } catch(e) {}
}

// sql/2026-08-01_rappel_journee.sql).
let _notifPrefs = { push_actif: true, rappel_journee: true, rappel_bilan: true };

async function chargerNotifPrefs() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_notif_prefs?client_id=eq.${encodeURIComponent(S.client)}`, { headers: supaHeaders() });
    const rows = res.ok ? await res.json() : [];
    if (rows[0]) _notifPrefs = rows[0];
  } catch(e) {}
}

async function toggleNotifPref(key) {
  _notifPrefs[key] = !(_notifPrefs[key] !== false);
  if (document.getElementById('settingsPanel')) ouvrirSettings();
  if (document.getElementById('rappelsPanel')) ouvrirGererRappels();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_notif_prefs?on_conflict=client_id`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, [key]: _notifPrefs[key] })
    });
  } catch(e) {}
}

function ouvrirGererRappels() {
  const existing = document.getElementById('rappelsPanel');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'rappelsPanel';
  el.style.cssText = 'position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.82);display:flex;align-items:flex-end;';
  const toggleRow = (key, label, sub) => `
    <div style="background:#0f1117;border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div style="flex:1;min-width:0;padding-right:10px;"><div style="font-size:14px;font-weight:600;color:#e8eaf0;">${label}</div><div style="font-size:11px;color:#555e7a;margin-top:2px;">${sub}</div></div>
      <div onclick="toggleNotifPref('${key}')" style="width:48px;height:28px;border-radius:14px;background:${_notifPrefs[key]!==false?'#3ecf8e':'#2d3142'};border:1px solid #3a4060;cursor:pointer;position:relative;flex-shrink:0;">
        <div style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:${_notifPrefs[key]!==false?'#fff':'#555e7a'};transform:${_notifPrefs[key]!==false?'translateX(20px)':'none'};transition:transform 0.2s,background 0.2s;"></div>
      </div>
    </div>`;
  el.innerHTML = `
    <div style="background:#151a28;border-radius:20px 20px 0 0;width:100%;max-width:520px;margin:0 auto;max-height:82vh;display:flex;flex-direction:column;">
      <div style="width:36px;height:4px;background:#2d3142;border-radius:2px;margin:10px auto 0;flex-shrink:0;"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 20px;flex-shrink:0;">
        <div style="font-size:17px;font-weight:700;color:#fff;">🔔 Rappels automatiques</div>
        <button onclick="document.getElementById('rappelsPanel').remove()" style="width:30px;height:30px;background:#1e2235;border-radius:50%;padding:0;font-size:15px;margin:0;min-width:unset;line-height:30px;color:#8892a4;border:1px solid #2d3142;cursor:pointer;">✕</button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:4px 20px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;">
        ${toggleRow('rappel_journee', 'Rappel de journée', "Chaque soir à 21h30 si tu n'as pas encore validé ta journée")}
        ${toggleRow('rappel_bilan', 'Rappel de bilan', "Vers 10h le jour de ton bilan si tu ne l'as pas encore envoyé")}
        ${toggleRow('rappel_paiement', 'Rappel de paiement', "3 jours après la date de facturation de ton coach")}
      </div>
    </div>`;
  el.onclick = e => { if (e.target === el) el.remove(); };
  document.body.appendChild(el);
}

function renderSettingsBug() {
  return `
    <div style="font-size:14px;color:#8892a4;margin-bottom:14px;line-height:1.5;">Décris le problème rencontré et sur quelle page. Ton coach le recevra directement.</div>
    <textarea id="bugDesc" placeholder="Ex: Sur la page bilan, le bouton 'Valider' ne répond pas après avoir rempli les champs…"
      style="width:100%;padding:12px;background:#0f1117;color:#e8eaf0;border:1px solid #2d3142;border-radius:10px;font-size:16px;font-family:inherit;resize:none;height:120px;box-sizing:border-box;margin-bottom:12px;"></textarea>
    <button onclick="envoyerBugReport()" style="width:100%;padding:13px;background:linear-gradient(135deg,#4f8ef7,#2260c8);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;">Envoyer le rapport</button>`;
}

async function envoyerBugReport() {
  const desc = (document.getElementById('bugDesc')?.value || '').trim();
  if (!desc) return;
  const panel = document.getElementById('settingsPanel');
  const btn = panel?.querySelector('button[onclick="envoyerBugReport()"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Envoi...'; }
  try {
    await api('envoyerRapportBug', { message: desc });
    if (panel) panel.remove();
    showToast('✅ Rapport envoyé, ton coach a été prévenu.', '#1D9E75');
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Envoyer le rapport'; }
    showToast('Erreur : ' + e.message, '#c0392b');
  }
}

// ── Journée en cours modal ────────────────────────────────────────────
function ouvrirJourneeModal() {
  if (isSupabase()) { if (!_journeeData || _journeeData.aucun || _journeeData.valide) return; _afficherModalJourneeSupabase(); return; }
  if (!_journeeData || _journeeData.aucun) return;
  if (_journeeData.valide) return; // déjà validée, la carte l'affiche
  // La fenêtre s'ouvre tout de suite avec les données déjà connues (celles de
  // la carte accueil) ; on rafraîchit ensuite en arrière-plan sans bloquer.
  _afficherModalJournee(true);
  api('chargerDonneesJournee', { ligne: _journeeData.ligne }).then(fresh => {
    if (fresh) { _journeeData.diete = fresh.diete; _journeeData.steps = fresh.steps; _journeeData.training = fresh.training; _journeeData.cardio = fresh.cardio; }
  }).catch(() => {}).finally(() => {
    if (document.getElementById('modalJournee')) _afficherModalJournee(false);
  });
}

function _majCarteJournee() {
  const carte = document.getElementById('carteJourneeHome');
  if (carte) carte.outerHTML = renderCarteJournee(_journeeData);
}

function _afficherModalJournee(refreshing) {
  const existant = document.getElementById('modalJournee');
  if (existant) existant.remove();
  const d = _journeeData;
  const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const jourNom = JOURS[new Date(Date.now() - 2*3600*1000).getDay()];
  const modal = document.createElement('div');
  modal.id = 'modalJournee';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:flex-end;';
  modal.innerHTML = `
    <div style="position:relative;background:#1a1f35;border-radius:20px 20px 0 0;padding:24px 20px calc(32px + env(safe-area-inset-bottom));width:100%;max-width:500px;margin:0 auto;box-sizing:border-box;">
      ${refreshing ? `<div style="position:absolute;inset:0;background:rgba(26,31,53,0.85);border-radius:20px 20px 0 0;z-index:2;display:flex;align-items:center;justify-content:center;"><div class="spin"></div></div>` : ''}
      <div style="width:36px;height:4px;background:#2d3142;border-radius:2px;margin:0 auto 20px;"></div>
      <div style="font-size:11px;font-weight:600;color:#555e7a;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Journée en cours</div>
      <div style="font-size:18px;font-weight:700;color:#f0f2ff;margin-bottom:20px;">${jourNom}</div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button id="jTogDiete" onclick="toggleJourneeField('diete')" style="flex:1;padding:12px 6px;border:none;border-radius:10px;color:#e8eaf0;font-size:13px;font-weight:600;cursor:pointer;background:${d.diete?'#1D9E75':'#2d3142'};">${d.diete?'✓ ':''}Diète</button>
        <button id="jTogTraining" onclick="toggleJourneeField('training')" style="flex:1;padding:12px 6px;border:none;border-radius:10px;color:#e8eaf0;font-size:13px;font-weight:600;cursor:pointer;background:${d.training?'#1D9E75':'#2d3142'};">${d.training?'✓ ':''}Training</button>
        <button id="jTogCardio" onclick="toggleJourneeField('cardio')" style="flex:1;padding:12px 6px;border:none;border-radius:10px;color:#e8eaf0;font-size:13px;font-weight:600;cursor:pointer;background:${d.cardio?'#1D9E75':'#2d3142'};">${d.cardio?'✓ ':''}Cardio</button>
      </div>
      <div style="margin-bottom:20px;">
        <div style="font-size:11px;color:#8892a4;margin-bottom:6px;">STEPS</div>
        <input id="jSteps" type="text" inputmode="numeric" value="${fmtFR(d.steps)}" placeholder="ex: 10200"
          onchange="sauverStepsJournee(this.value)"
          style="width:100%;padding:12px;background:#0f1117;color:#e8eaf0;border:1px solid #2d3142;border-radius:10px;font-size:16px;box-sizing:border-box;">
        <div id="jStepsErr" style="display:none;font-size:11px;color:#e05252;margin-top:4px;">⚠️ Rentre tes steps en nombre entier (ex: 10200 pour 10 200 pas)</div>
      </div>
      <button id="btnValiderJournee" onclick="validerJourneeClient()" style="width:100%;padding:14px;background:linear-gradient(135deg,#1D9E75,#167a5a);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;">✅ Valider ma journée</button>
      <button onclick="document.getElementById('modalJournee').remove()" style="width:100%;margin-top:8px;padding:12px;background:#2d3142;border:none;border-radius:12px;color:#8892a4;font-size:14px;cursor:pointer;">Fermer</button>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

function toggleJourneeField(type) {
  if (isSupabase()) { toggleJourneeFieldSupabase(type); return; }
  if (!_journeeData) return;
  _journeeData[type] = !_journeeData[type];
  const cols = { diete: 14, training: 18, cardio: 19 };
  api('enregistrerValeur', { nomFeuille: 'Bilan', ligne: _journeeData.ligne, colonne: cols[type], valeur: _journeeData[type] }).catch(() => {});
  const labels = { diete: 'Diète', training: 'Training', cardio: 'Cardio' };
  const id = { diete: 'jTogDiete', training: 'jTogTraining', cardio: 'jTogCardio' };
  const btn = document.getElementById(id[type]);
  if (btn) { btn.style.background = _journeeData[type] ? '#1D9E75' : '#2d3142'; btn.textContent = (_journeeData[type] ? '✓ ' : '') + labels[type]; }
}

function sauverStepsJournee(val) {
  if (isSupabase()) { sauverStepsJourneeSupabase(val); return; }
  if (!_journeeData) return;
  const v = parseSteps(val);
  const errEl = document.getElementById('jStepsErr');
  if (errEl) errEl.style.display = (v !== '' && v > 0 && v < 1000) ? 'block' : 'none';
  _journeeData.steps = v;
  // pasTotal (chargerProgressionClient) compte les steps de la semaine en
  // cours même non validée — un titre "pas cumulés" peut donc se débloquer
  // dès la saisie, sans attendre "Valider ma journée".
  api('enregistrerValeur', { nomFeuille: 'Bilan', ligne: _journeeData.ligne, colonne: 17, valeur: v })
    .then(() => { if (typeof rafraichirProgressionEtDeblocages === 'function') rafraichirProgressionEtDeblocages(); })
    .catch(() => {});
}

async function validerJourneeClient() {
  if (isSupabase()) { await validerJourneeClientSupabase(); return; }
  if (!_journeeData) return;
  const stepsEl = document.getElementById('jSteps');
  if (stepsEl) sauverStepsJournee(stepsEl.value);
  const btn = document.getElementById('btnValiderJournee');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = 'Validation…'; }
  try {
    const res = await api('validerJournee', { ligne: _journeeData.ligne, semaine: _journeeData.semaine });
    _journeeData.valide = true;
    const modal = document.getElementById('modalJournee');
    if (modal) modal.remove();
    _majCarteJournee();
    setTimeout(() => rafraichirProgressionEtDeblocages(), 300);
    const xpBase = (res && typeof res === 'object') ? (res.xp || 0) : (res || 0);
    const bonusPas = (res && typeof res === 'object') ? (res.bonusPas || 0) : 0;
    const xpTotal = xpBase + bonusPas;
    if (xpTotal > 0) {
      const flash = document.createElement('div');
      flash.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1D9E75;color:#fff;padding:20px 32px;border-radius:18px;font-size:22px;font-weight:700;z-index:9999;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.4);';
      flash.innerHTML = '🎉 +' + xpTotal + ' XP'
        + (bonusPas > 0 ? '<div style="font-size:12px;margin-top:4px;opacity:.85;">🦶 Objectif pas atteint !</div>' : '')
        + '<div style="font-size:13px;margin-top:6px;font-weight:400;opacity:.85;">Journée validée !</div>';
      document.body.appendChild(flash);
      setTimeout(() => { flash.style.transition = 'opacity .5s'; flash.style.opacity = '0'; setTimeout(() => flash.remove(), 500); }, 2200);
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '✅ Valider ma journée'; }
    alert('Erreur lors de la validation.');
  }
}

// ── Journée en cours — mode Supabase ─────────────────────────────────
// La carte "Journée en cours" écrit directement dans jours[jourIdx] du
// bilan hebdo Supabase en cours (même source de vérité que la page Bilan
// complète, cf. sauverJourBilanSupa dans bilan.js) — jamais de compteur XP
// incrémenté séparément. Réécriture idempotente : cliquer plusieurs fois ne
// change rien de plus qu'un seul clic. Voir le plan de refonte XP.
function _jourIdxAujourdhui() {
  // Lundi=0 ... Dimanche=6, décalage -2h pour qu'une saisie après minuit
  // compte encore pour la veille (comme le reste de l'app).
  const jsDay = new Date(Date.now() - 2*3600*1000).getDay(); // 0=dim...6=sam
  return (jsDay + 6) % 7;
}
async function _loadJourneeDataSupabase() {
  const clientId = getClient ? getClient() : S.client;
  const { id, jours } = await _supaBilanNonEnvoye(clientId);
  const idx = _jourIdxAujourdhui();
  const j = jours[idx] || {};
  return { bilanId: id, jourIdx: idx, diete: !!j.diete, training: !!j.training, cardio: !!j.cardio, steps: j.steps ?? '', valide: !!j.valide, aucun: false };
}
async function _sauverJourneeSupabase(field, value) {
  if (!_journeeData || !_journeeData.bilanId) return;
  _journeeData[field] = value;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/bilans?id=eq.${_journeeData.bilanId}&select=jours`, { headers: supaHeaders() });
  const arr = res.ok ? await res.json() : [];
  const jours = (arr[0] && arr[0].jours) || [];
  const idx = _journeeData.jourIdx;
  jours[idx] = { ...(jours[idx] || {}), diete: _journeeData.diete, training: _journeeData.training, cardio: _journeeData.cardio, steps: _journeeData.steps || null, valide: !!_journeeData.valide };
  await _supaPatchJoursBilan(_journeeData.bilanId, jours);
}

function toggleJourneeFieldSupabase(type) {
  if (!_journeeData) return;
  _journeeData[type] = !_journeeData[type];
  const labels = { diete: 'Diète', training: 'Training', cardio: 'Cardio' };
  const id = { diete: 'jTogDiete', training: 'jTogTraining', cardio: 'jTogCardio' };
  const btn = document.getElementById(id[type]);
  if (btn) { btn.style.background = _journeeData[type] ? '#1D9E75' : '#2d3142'; btn.textContent = (_journeeData[type] ? '✓ ' : '') + labels[type]; }
  _sauverJourneeSupabase(type, _journeeData[type])
    .then(() => { if (typeof rafraichirProgressionEtDeblocages === 'function') rafraichirProgressionEtDeblocages(); })
    .catch(() => {});
}
function sauverStepsJourneeSupabase(val) {
  if (!_journeeData) return;
  const v = val ? parseInt(val.replace(/\s/g,'').replace(',','.')) : '';
  const steps = isNaN(v) ? '' : v;
  // pasTotal (chargerProgressionSupabase) compte les steps de la semaine en
  // cours même non envoyée — un titre "pas cumulés" peut donc se débloquer
  // dès la saisie, sans attendre "Valider ma journée".
  _sauverJourneeSupabase('steps', steps)
    .then(() => { if (typeof rafraichirProgressionEtDeblocages === 'function') rafraichirProgressionEtDeblocages(); })
    .catch(() => {});
}
const XP_JOURNEE_VALIDEE  = 5;
const BONUS_PAS_JOUR      = 10;

// Crédite l'XP de la journée — dédoublonné via jours[idx].valide (pas un
// flag localStorage) : si la journée était déjà validée avant cet appel,
// aucun XP n'est recrédité, même en cas de double-clic/relance.
async function _crediterXpJournee(dejaValideAvant, steps, clientId) {
  if (dejaValideAvant) return 0;
  let xp = XP_JOURNEE_VALIDEE;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}&select=steps_cible`, { headers: supaHeaders() });
    const arr = res.ok ? await res.json() : [];
    const stepsCible = arr[0] && arr[0].steps_cible;
    if (stepsCible && steps && Number(steps) >= stepsCible) xp += BONUS_PAS_JOUR;
  } catch(e) {}
  await _supaIncrementerXpTotal(clientId, xp);
  return xp;
}

async function validerJourneeClientSupabase() {
  if (!_journeeData) return;
  const stepsEl = document.getElementById('jSteps');
  if (stepsEl) {
    const v = stepsEl.value ? parseInt(stepsEl.value.replace(/\s/g,'').replace(',','.')) : '';
    _journeeData.steps = isNaN(v) ? '' : v;
  }
  const btn = document.getElementById('btnValiderJournee');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = 'Validation…'; }
  try {
    const dejaValideAvant = !!_journeeData.valide;
    await _sauverJourneeSupabase('valide', true);
    const xpGagne = await _crediterXpJournee(dejaValideAvant, _journeeData.steps, getClient());
    const modal = document.getElementById('modalJournee');
    if (modal) modal.remove();
    _majCarteJournee();
    _showJourneeEnregistreeSupabase(xpGagne);
    if (typeof rafraichirProgressionEtDeblocages === 'function') rafraichirProgressionEtDeblocages();
  } catch(e) {
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '✅ Valider ma journée'; }
    alert('Erreur lors de la validation.');
  }
}
function _showJourneeEnregistreeSupabase(xpGagne) {
  const flash = document.createElement('div');

}

function deconnexion() {
  if (localStorage.getItem('at_auth_mode') === 'supabase') { sbAuth.auth.signOut().catch(()=>{}); }

function renderNavBar(active) {
  const items = [
    { id:'home',         label:'Accueil'   },
    { id:'training',     label:'Programme' },
    { id:'bilan',        label:'Bilan'     },
    { id:'diete',        label:'Diète'     },
    { id:'mensurations', label:'Mensu.'    },
    { id:'recettes',     label:'Recettes'  },
    { id:'roadmap',      label:'Roadmap'   },
  ];
  return `<nav class="navbar">${items.map(it => `
    <button class="nav-item${it.id===active?' active':''}" onclick="goTo('${it.id}')">
      <span class="nav-icon" style="opacity:${it.id===active?'1':'0.55'};">${NAV_ICONS[it.id]}</span>
      <span class="nav-label">${it.label}</span>
    </button>`).join('')}
  </nav>`;
}

function bindNav() {}

function goTo(page) {
  if (isSupabase()) {
    if (page === 'home')     { loadHomeSupabase(); return; }
    if (page === 'training') { loadProgrammeClient(); return; }
  }
  if (page === 'home')        loadHome();
  else if (page === 'bilan')    loadBilan();
  else if (page === 'training') loadTraining();
  else if (page === 'diete')         loadDiete();
  else if (page === 'mensurations')  loadMensurations();
  else if (page === 'recettes')      loadRecettes();
  else if (page === 'roadmap')       loadRoadmap();
  else if (page === 'classement')   loadClassement();
  else if (page === 'progression')  loadProgression();
  else if (page === 'collection')   loadCollection();
  else if (page === 'programme-client') loadProgrammeClient();
  else setPage(page);
}

// ── Init ──────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
  // Clic sur une notification push alors que l'app est déjà ouverte (sw.js
  // ne peut pas la naviguer sans perdre son état en cours) : on reçoit un
  // postMessage à la place et on ouvre directement le panneau.
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'openNotifs' && S.client) ouvrirNotificationsClient();
  });
}

if (S.token && S.client) {
  if (localStorage.getItem('at_auth_mode') === 'supabase') {
    loadHomeSupabase();
  } else {
  const _urlParams = new URLSearchParams(window.location.search);
  const _viewAsParam = _urlParams.get('viewAs');
  const _forceMobile = _urlParams.get('mobile');
  if (_viewAsParam && S.isCoach) {
    history.replaceState(null, '', window.location.pathname);
    enterVueClient(_viewAsParam);
  } else if (S.isCoach && !_forceMobile && window.innerWidth >= 900) {
    // Coach sur grand écran → la console desktop est plus adaptée que l'appli mobile.
    // ?mobile=1 (utilisé par "Retour à l'app" depuis console.html) contourne cette redirection.
    window.location.replace('console.html?t=' + Date.now());
  } else {
    loadHome();
  }
  }
} else {
  setPage('login');
}
