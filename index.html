}
const XP_JOURNEE_VALIDEE  = 5;
const BONUS_PAS_JOUR      = 10;

// Crédite l'XP de la journée — dédoublonné via jours[idx].valide (pas un
// flag localStorage) : si la journée était déjà validée avant cet appel,
// aucun XP n'est recrédité, même en cas de double-clic/relance.
async function _crediterXpJournee(dejaValideAvant, steps, clientId) {
  if (dejaValideAvant) return 0;
  let xp = XP_JOURNEE_VALIDEE;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}&select=steps_cible`, { headers: supaHeaders() });
    const arr = res.ok ? await res.json() : [];
    const stepsCible = arr[0] && arr[0].steps_cible;
    if (stepsCible && steps && Number(steps) >= stepsCible) xp += BONUS_PAS_JOUR;
  } catch(e) {}
  await _supaIncrementerXpTotal(clientId, xp);
  return xp;
}

async function validerJourneeClientSupabase() {
  if (!_journeeData) return;
  const stepsEl = document.getElementById('jSteps');
  if (stepsEl) {
    const v = stepsEl.value ? parseInt(stepsEl.value.replace(/\s/g,'').replace(',','.')) : '';
    _journeeData.steps = isNaN(v) ? '' : v;
  }
  const btn = document.getElementById('btnValiderJournee');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = 'Validation…'; }
  try {
    const dejaValideAvant = !!_journeeData.valide;
    await _sauverJourneeSupabase('valide', true);
    const xpGagne = await _crediterXpJournee(dejaValideAvant, _journeeData.steps, getClient());
    const modal = document.getElementById('modalJournee');
    if (modal) modal.remove();
    _majCarteJournee();
    _showJourneeEnregistreeSupabase(xpGagne);
    if (typeof rafraichirProgressionEtDeblocages === 'function') rafraichirProgressionEtDeblocages();
  } catch(e) {
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '✅ Valider ma journée'; }
    alert('Erreur lors de la validation.');
  }
}
function _showJourneeEnregistreeSupabase(xpGagne) {
  const flash = document.createElement('div');
  flash.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1D9E75;color:#fff;padding:20px 32px;border-radius:18px;font-size:20px;font-weight:700;z-index:9999;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.4);pointer-events:none;';
  flash.innerHTML = (xpGagne && !modeSimplifieActif())
    ? '🎉 +' + xpGagne + ' XP<div style="font-size:13px;margin-top:6px;font-weight:400;opacity:.85;">Journée validée !</div>'
    : '✓ Journée enregistrée !';
  document.body.appendChild(flash);
  setTimeout(() => { flash.style.transition = 'opacity .5s'; flash.style.opacity = '0'; setTimeout(() => flash.remove(), 500); }, 2200);
}

function deconnexion() {
  sbAuth.auth.signOut().catch(()=>{});
  localStorage.removeItem('at_token');
  localStorage.removeItem('at_client');
  localStorage.removeItem('at_coach');
  localStorage.removeItem('at_auth_mode');
  S.client = ''; S.token = ''; S.isCoach = false; S.data = {};
  _loginStep = 'identifiant'; _loginClient = '';
  setPage('login');
}

function bindNav() {}

// deepLink { semaine, seanceId } (optionnel, chrono repos) : ne s'applique qu'aux pages
// 'training'/'programme-client' — voir loadProgrammeClient (programme-client.js).
function goTo(page, deepLink) {
  if (page === 'home')             loadHomeSupabase();
  else if (page === 'training')    loadProgrammeClient(deepLink);
  else if (page === 'bilan')       loadBilan();
  else if (page === 'diete')       loadDiete();
  else if (page === 'mensurations') loadMensurations();
  else if (page === 'recettes')    loadRecettes();
  else if (page === 'roadmap')     loadRoadmap();
  else if (page === 'chat')        _chatOuvrirDepuisHeader();
  else if (page === 'classement')  loadClassement();
  else if (page === 'progression') loadProgression();
  else if (page === 'collection')  loadCollection();
  else if (page === 'programme-client') loadProgrammeClient(deepLink);
  else setPage(page);
}

// ── Init ──────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
  // Clic sur une notification push alors que l'app est déjà ouverte (sw.js
  // ne peut pas la naviguer sans perdre son état en cours) : on reçoit un
  // postMessage à la place et on ouvre directement le panneau.
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'openNotifs' && S.client) ouvrirNotificationsClient();
    else if (e.data && e.data.type === 'openPage' && e.data.page && S.client) goTo(e.data.page, e.data.seanceId != null ? { semaine: e.data.semaine || 1, seanceId: e.data.seanceId } : undefined);
  });
}

if (S.token && S.client) {
  // ?viewAs= doit être vérifié EN PREMIER, avant at_auth_mode : sinon, si une
  // précédente session "vue client" a laissé at_auth_mode='supabase' en
  // localStorage (cas normal — la seule chose qui le restaure est le bouton
  // "✕ Retour", pas le bouton back du navigateur, voir exitVueClient), un
  // nouveau clic "Ouvrir en vue client" tombait dans loadHomeSupabase() avec
  // S.client = le compte du COACH lui-même (jamais mis à jour par
  // enterVueClient dans localStorage) au lieu du client visé — bug vécu.
  const _urlParams = new URLSearchParams(window.location.search);
  const _viewAsParam = _urlParams.get('viewAs');
  const _forceMobile = _urlParams.get('mobile');
  if (_viewAsParam && S.isCoach) {
    history.replaceState(null, '', window.location.pathname);
    enterVueClient(_viewAsParam);
  } else if (localStorage.getItem('at_auth_mode') === 'supabase') {
    // La session persiste dans localStorage : ce chemin est emprunté à CHAQUE
    // ouverture de l'app tant que le client ne se déconnecte pas, donc
    // derniere_connexion (écrite sinon uniquement à _completerConnexionSupabase,
    // qui ne tourne qu'au tout premier login) ne bougeait plus jamais ensuite —
    // presque tous les clients restaient à "Jamais connecté" côté console
    // malgré une utilisation réelle et récente.
    fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(S.client)}`, {
      method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ derniere_connexion: new Date().toISOString() })
    }).catch(() => {});
    // Même piège que derniere_connexion : S.isCoach/localStorage.at_coach
    // n'est écrit qu'au login complet, jamais réévalué tant que la session
    // persiste — un client promu coach en base (est_coach=true) restait donc
    // "non coach" sur un appareil déjà connecté, sans jamais revoir les
    // tuiles coach sur son téléphone (vécu : yohanp).
    fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(S.client)}&select=est_coach`, { headers: supaHeaders() })
      .then(r => r.ok ? r.json() : [])
      .then(rows => {
        const estCoachReel = !!(rows[0] && rows[0].est_coach);
        if (estCoachReel !== S.isCoach) {
          S.isCoach = estCoachReel;
          localStorage.setItem('at_coach', estCoachReel ? '1' : '0');
          if ((S.page === 'home-supabase' || S.page === 'home-supabase-v2')) loadHomeSupabase();
        }
      }).catch(() => {});
    loadHomeSupabase();
  } else if (S.isCoach && !_forceMobile && window.innerWidth >= 900) {
    // Coach sur grand écran → la console desktop est plus adaptée que l'appli mobile.
    // ?mobile=1 (utilisé par "Retour à l'app" depuis console.html) contourne cette redirection.
    window.location.replace('console.html?t=' + Date.now());
  } else {
    loadHome();
  }
} else {
  setPage('login');
}
