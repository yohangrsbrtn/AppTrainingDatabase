<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Training</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Training">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  /* Palette alignée sur l'app GAS officielle (body #0f1117, .card #1a1d29,
     bordures/inputs #2d3142, texte secondaire #8892a4) */
  --bg: #0f1117; --bg2: #1a1d29; --bg3: #1e2235;
  --border: #2d3142; --text: #e8eaf0; --muted: #8892a4;
  --accent: #4f6ef7; --green: #1D9E75; --red: #e05c5c;
  --radius: 14px; --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
/* Désactive la sélection de texte + le menu "Copier/Partager" au tap long,
   partout dans l'app (bouton du chat notamment, mais aussi le reste de
   l'interface) — sauf dans les champs de saisie, où l'utilisateur doit
   pouvoir sélectionner/éditer normalement. */
html, body, #app { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
/* Largeur type téléphone, centrée — sans effet sur un vrai mobile (déjà plus
   étroit que 430px), mais évite que l'app s'étire sur toute la largeur d'un
   navigateur desktop (pratique pour filmer/présenter l'app). */
body { max-width: 430px; margin: 0 auto; position: relative; }
@media (min-width: 431px) {
  html { background: #05060a; }
  body { box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 70px rgba(0,0,0,.55); }
}
#app { min-height: 100dvh; display: flex; flex-direction: column; }

/* ── Spinner ── */
.spinner-full { display:flex; align-items:center; justify-content:center; height:100dvh; }
.spinner-inline { display:flex; align-items:center; justify-content:center; padding:50px 0; }
.spin { width:30px; height:30px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes fadeInModal { from { opacity:0; } to { opacity:1; } }
@keyframes popIn { 0% { transform:scale(0.2) rotate(-8deg); opacity:0; } 70% { transform:scale(1.08) rotate(2deg); } 100% { transform:scale(1) rotate(0); opacity:1; } }
@keyframes slideDown { from { transform:translateY(-18px); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes slideUp2 { from { transform:translateY(18px); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes pulseGlow { 0%,100% { transform:translate(-50%,-50%) scale(1); opacity:0.5; } 50% { transform:translate(-50%,-50%) scale(1.18); opacity:0.2; } }

/* ── Login ── */
.login-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; padding:24px; }
.login-logo { width:88px; height:88px; margin-bottom:16px; border-radius:20px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
.login-title { font-size:24px; font-weight:700; margin-bottom:4px; }
.login-sub { font-size:14px; color:var(--muted); margin-bottom:40px; }
.login-form { width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px; }
.login-form input {
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  color:var(--text); font-size:16px; padding:14px 16px; outline:none; width:100%;
  transition:border-color .2s;
}
.login-form input:focus { border-color:var(--accent); }
.login-form input::placeholder { color:var(--muted); }
.btn-primary {
  background:var(--accent); color:#fff; border:none; border-radius:var(--radius);
  font-size:16px; font-weight:600; padding:14px; cursor:pointer; transition:opacity .2s;
}
.btn-primary:active { opacity:.8; }
.btn-primary:disabled { opacity:.5; cursor:default; }
.login-error { color:var(--red); font-size:13px; text-align:center; min-height:18px; }

/* ── Header ── */
.header {
  background:var(--bg2); border-bottom:1px solid var(--border);
  padding:calc(var(--safe-top) + 12px) 16px 12px;
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100;
}
.header-back { background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; padding:4px 8px; }
.header-title { font-size:17px; font-weight:600; flex:1; }
.header-sub { font-size:12px; color:var(--muted); }

/* ── Nav bar ── */
.navbar {
  position:fixed; bottom:0; left:0; right:0; max-width:430px; margin:0 auto;
  background:var(--bg2); border-top:1px solid var(--border);
  display:flex; padding:8px 0 calc(8px + var(--safe-bottom));
  z-index:100;
}
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; padding:4px 0; transition:color .2s; color:var(--muted); border:none; background:none; }
.nav-item.active { color:var(--accent); }
.nav-icon { font-size:22px; }
.nav-label { font-size:10px; font-weight:500; }

/* ── Page container ── */
.page { flex:1; overflow-y:auto; padding:16px 16px calc(80px + var(--safe-bottom)); }

/* ── Cards ── */
.card { background:var(--bg2); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
.card-value { font-size:28px; font-weight:700; }
.card-sub { font-size:12px; color:var(--muted); margin-top:4px; }

/* ── Stats row ── */
.stats-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }

/* ── XP bar ── */
.xp-bar-bg { background:var(--bg3); border-radius:99px; height:8px; margin:8px 0 4px; overflow:hidden; }
.xp-bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),#7c3aed); transition:width .6s ease; }

/* ── List items ── */
.list-item { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.list-item:last-child { border-bottom:none; }
.list-icon { font-size:22px; width:36px; text-align:center; }
.list-text { flex:1; }
.list-title { font-size:15px; font-weight:500; }
.list-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.list-arrow { color:var(--muted); font-size:16px; }

/* ── Badge ── */
.badge { display:inline-block; background:var(--accent); color:#fff; border-radius:99px; font-size:11px; font-weight:700; padding:2px 8px; }
.badge-green { background:var(--green); }
.badge-red { background:var(--red); }

/* ── Empty state ── */
.empty { text-align:center; padding:48px 16px; color:var(--muted); }
.empty-icon { font-size:48px; margin-bottom:12px; }
.empty-text { font-size:14px; }

/* ── Bilan ── */
.section-title { font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:20px 0 8px; }
.field-label { font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;letter-spacing:.5px; }
.bilan-input { width:100%;padding:8px;background:#0f1117;color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:16px;font-family:inherit; }
.bilan-input[readonly] { opacity:.6; }
.bilan-textarea { width:100%;padding:10px;background:#0f1117;color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:16px;font-family:inherit;resize:vertical;min-height:70px; }
.bilan-textarea[readonly] { opacity:.6; }
.bilan-banner { font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px;padding:8px 12px;background:#1e2235;border-radius:8px; }
.btn-secondary { width:100%;background:#2d3142;color:var(--text);border:none;border-radius:var(--radius);font-size:14px;font-weight:600;padding:12px;cursor:pointer;margin-bottom:4px; }
.btn-blue { background:linear-gradient(135deg,#378ADD,#1a5ba0);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;padding:14px;cursor:pointer; }
.btn-green { background:linear-gradient(135deg,#1D9E75,#167a5a);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;padding:14px;cursor:pointer; }
.btn-disabled { background:#2d3142;color:var(--text);border:none;border-radius:var(--radius);font-size:14px;font-weight:600;padding:14px;opacity:.55;cursor:not-allowed; }

/* ── Training ── */
.t-select { width:100%;padding:10px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit; }
.set-row { display:flex;align-items:center;gap:6px;margin-bottom:6px; }
.set-num { font-size:12px;font-weight:700;color:var(--muted);width:24px;flex-shrink:0;text-align:center; }
.set-input { flex:1;padding:8px 4px;background:#0f1117;color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:16px;text-align:center;min-width:0; }
.chrono-btn { background:#1e2444;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;padding:6px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0; }

/* ── Diète ── */
.diete-item { background:#161b2e;border-radius:12px;border:1.5px solid #1e6648;padding:14px 16px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center; }
.diete-bar  { position:absolute;top:0;left:0;bottom:0;width:3px;background:linear-gradient(180deg,#3ecf8e,#1a7a52);border-radius:12px 0 0 12px; }
.diete-arrow { width:26px;height:26px;background:#3ecf8e22;border:1px solid #3ecf8e66;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:#3ecf8e;font-weight:600; }
.macro-label { font-size:10px;color:var(--muted); }

/* Grammage diète : pas de flèches de spinner natives (pas pratique sur mobile) */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
input[type="number"] { -moz-appearance:textfield; }

/* ── Panneau Paramètres (☰) — cartes groupées + puces d'icônes ── */
.stg-card { background:#151824; border:1px solid #232840; border-radius:16px; overflow:hidden; margin-bottom:14px; }
.stg-row { display:flex; align-items:center; gap:12px; padding:13px 14px; }
.stg-row + .stg-row { border-top:1px solid #20243a; }
.stg-row.clickable { cursor:pointer; }
.stg-ic { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.stg-ic svg { width:17px; height:17px; }
.stg-title { font-size:14.5px; font-weight:600; color:#e8eaf0; }
.stg-sub { font-size:11.5px; color:#8892a4; margin-top:1px; }
.stg-val { font-size:13px; color:#8892a4; font-variant-numeric:tabular-nums; }
.stg-sec-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:#5b6479; margin:18px 2px 8px; }
.stg-sec-label:first-child { margin-top:0; }
.stg-switch { width:44px; height:26px; border-radius:13px; position:relative; flex-shrink:0; cursor:pointer; transition:background .15s; }
.stg-switch i { position:absolute; top:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .15s, background .15s; }
.stg-profile { margin:0 0 16px; padding:16px; border-radius:18px; background:linear-gradient(155deg,#1c2033,#151824); border:1px solid #232840; display:flex; align-items:center; gap:13px; }
.stg-avatar { width:52px; height:52px; border-radius:16px; flex-shrink:0; background:conic-gradient(from 200deg,#4f6ef7,#a78bfa,#4f6ef7); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; color:#fff; }
.stg-tabbtn { flex:1; padding:9px 2px; font-size:12px; font-weight:650; border-radius:10px; margin:0; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="api.js?v=15"></script>
<script src="bilan.js?v=27"></script>
<script src="diete.js?v=23"></script>
<script src="mensurations.js?v=9"></script>
<script src="recettes.js?v=4"></script>
<script src="progression.js?v=8"></script>
<script src="collection.js?v=3"></script>
<script src="coach.js?v=5"></script>
<script src="protocole.js?v=5"></script>
<script src="programme-client.js?v=19"></script>
<script src="training-perso.js?v=2"></script>
<script src="roadmap.js?v=6"></script>
<script src="chat.js?v=17"></script>
<script>
// ── État global ───────────────────────────────────────────────────────
const S = {
  page: 'loading',
  client:  localStorage.getItem('at_client')  || '',
  token:   localStorage.getItem('at_token')   || '',
  isCoach: localStorage.getItem('at_coach') === '1' || localStorage.getItem('at_client') === 'yohan',
  data: {}
};

// Client 100% Supabase (connexion + données, aucun Sheets) — première brique : la connexion.
// SUPABASE_URL/SUPABASE_ANON_KEY/supaHeaders() viennent déjà de programme-client.js (chargé avant ce script).
const sbAuth = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let _recoverySession = null;
sbAuth.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    _recoverySession = session;
    _loginStep = 'reset-password';
    setPage('login');
  } else if (event === 'USER_UPDATED') {
    (async () => {
      // session.user.email peut être encore l'ancienne valeur au moment précis de cet événement —
      // on relit l'utilisateur pour avoir l'email réellement en vigueur côté Auth.
      const { data } = await sbAuth.auth.getUser().catch(() => ({ data: null }));
      const email = data && data.user && data.user.email;
      if (!email || email.endsWith('@apptraining-users.com')) return; // pas encore basculé sur un vrai email
      let client = S.client;
      if (!client) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?email=eq.${encodeURIComponent(email)}&select=client_id`, { headers: supaHeaders() }).catch(() => null);
        const rows = res && res.ok ? await res.json() : [];
        client = rows[0] ? rows[0].client_id : '';
      }
      if (!client) return;
      fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
        method: 'POST',
        headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
        body: JSON.stringify({ client_id: client, email, email_confirme: true })
      }).catch(() => {});
      if (S.data && S.data.profil && S.client === client) { S.data.profil.email = email; S.data.profil.email_confirme = true; }
    })();
  }
});

function setPage(name) {
  S.page = name;
  // Pour les pages bilan, document.body peut avoir été remplacé — on s'assure que #app existe
  if (!document.getElementById('app')) {
    document.body.innerHTML = '<div id="app"></div>';
  }
  render();
  // Bandeau "Retour coach" persistant en mode vue-client
  if (_viewAsClientOverride && name !== 'loading') {
    if (!document.getElementById('coachRetourBanner')) {
      const nom = _viewAsClientOverride;
      const banner = document.createElement('div');
      banner.id = 'coachRetourBanner';
      banner.style.cssText = 'position:fixed;bottom:calc(56px + env(safe-area-inset-bottom) + 8px);left:50%;transform:translateX(-50%);z-index:8000;background:linear-gradient(135deg,#E8A838,#c88010);color:#1a0e00;border-radius:20px;padding:8px 16px 8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap;';
      banner.innerHTML = `<span style="font-size:12px;font-weight:700;">👁️ Vue de <strong>${esc(nom)}</strong></span><button onclick="exitVueClient()" style="background:rgba(0,0,0,0.2);border:none;color:#1a0e00;font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px;cursor:pointer;">✕ Retour</button>`;
      document.body.appendChild(banner);
    }
  } else if (S.isCoach && name !== 'loading' && name !== 'login') {
    // Petit accès rapide "Vue console" pour le coach, visible sur toutes ses pages
    // mobile tant qu'il n'est pas en train de prévisualiser un client (banner ci-dessus).
    if (!document.getElementById('coachConsoleBanner')) {
      const banner = document.createElement('div');
      banner.id = 'coachConsoleBanner';
      banner.style.cssText = 'position:fixed;bottom:calc(56px + env(safe-area-inset-bottom) + 8px);left:50%;transform:translateX(-50%);z-index:8000;background:linear-gradient(135deg,#4f6ef7,#2d4bd6);color:#fff;border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap;cursor:pointer;font-size:12px;font-weight:700;';
      banner.innerHTML = `💻 Vue console`;
      // Cache-buster : évite qu'un PWA installé sur écran d'accueil (pas de
      // pull-to-refresh, pas de barre d'adresse) reste bloqué sur une version
      // de console.html mise en cache par le navigateur/CDN (10 min de TTL).
      banner.onclick = () => { window.location.href = 'console.html?t=' + Date.now(); };
      document.body.appendChild(banner);
    }
  }
  // Bouton flottant du chat commun, ré-injecté après chaque page (voir chat.js) —
  // pas sur login/loading, ni tant qu'aucun client n'est identifié.
  if (name !== 'loading' && name !== 'login' && S.client && typeof _chatEnsureFab === 'function') _chatEnsureFab();
}

// ── Vue client (coach simule un client) ───────────────────────────────
let _coachSavedState = null;
let _vueClientRetour = 'mes-clients';

// andThen : callback de navigation à exécuter une fois en vue client (défaut loadHome)
// retour : page à afficher au clic sur "Retour coach" (défaut 'mes-clients')
//
// Le mode API (Supabase vs GAS/PWA) est normalement déterminé par `at_auth_mode` dans
// localStorage, réglé au login du client. Un coach n'est jamais loggé en mode 'supabase'
// (son propre compte passe par le flux GAS classique) : sans la bascule ci-dessous, la
// vue client héritait toujours du mode GAS du coach, donc affichait les anciennes données
// PWA prod pour un client pourtant supabase_only (ex: recettes de la base PWA au lieu de
// la table Supabase `recettes` — bug constaté sur la fiche de Manon Besnier).
async function enterVueClient(clientId, andThen, retour) {
  _coachSavedState = {
    client: S.client,
    isCoach: S.isCoach,
    data: S.data,
    journeeData: _journeeData,
    authMode: localStorage.getItem('at_auth_mode')
  };
  S.client = clientId;
  S.isCoach = false;
  S.data = {};
  _journeeData = null;
  _viewAsClientOverride = clientId;
  _vueClientRetour = retour || 'mes-clients';

  let supabaseOnly = false;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}&select=supabase_only`, { headers: supaHeaders() });
    const rows = res.ok ? await res.json() : [];
    supabaseOnly = !!(rows[0] && rows[0].supabase_only);
  } catch(e) {}
  if (supabaseOnly) localStorage.setItem('at_auth_mode', 'supabase');
  else localStorage.removeItem('at_auth_mode');

  if (typeof andThen === 'function') andThen();
  else if (supabaseOnly) loadHomeSupabase();
  else loadHome();
}

function exitVueClient() {
  if (!_coachSavedState) return;
  _viewAsClientOverride = null;
  S.client  = _coachSavedState.client;
  S.isCoach = _coachSavedState.isCoach;
  S.data    = _coachSavedState.data;
  _journeeData = _coachSavedState.journeeData;
  if (_coachSavedState.authMode) localStorage.setItem('at_auth_mode', _coachSavedState.authMode);
  else localStorage.removeItem('at_auth_mode');
  _coachSavedState = null;
  const banner = document.getElementById('coachRetourBanner');
  if (banner) banner.remove();
  setPage(_vueClientRetour || 'mes-clients');
}

// ── Rendu principal ───────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  switch (S.page) {
    case 'loading':       app.innerHTML = renderFullSpinner(); break;
    case 'login':         app.innerHTML = renderLogin();   bindLogin(); break;
    case 'home-supabase': document.body.innerHTML = renderHomeSupabase(); break;
    case 'home-supabase-v2': document.body.innerHTML = renderHomeSupabaseV2(); break;
    case 'training':
    case 'bilan':
    case 'bilan-loading': document.body.innerHTML = renderBilanPage(); break;
    case 'diete':
    case 'diete-loading': document.body.innerHTML = renderDietePage();
      if (_dSubPage === 'detail') {
        initDieteSliders((_dDetail && _dDetail.repas || []).length);
        initDieteStickyMacros();
      } else if (_dSubPage === 'journal' && _dJournalDateOuverte) {
        initDieteStickyMacros();
      }
      break;
    case 'mensurations':
    case 'mens-loading':  document.body.innerHTML = renderMensurationsPage(); break;
    case 'recettes':
    case 'recettes-loading': document.body.innerHTML = renderRecettesPage(); break;
    case 'roadmap':
    case 'roadmap-loading': document.body.innerHTML = renderRoadmapPage(); break;
    case 'classement':           app.innerHTML = renderClassement();           break;
    case 'progression':          document.body.innerHTML = renderProgressionPage();      break;
    case 'collection':           document.body.innerHTML = renderCollectionPage();       break;
    case 'rapports-bugs':        document.body.innerHTML = renderRapportsBugs();         break;
    case 'protocole':            document.body.innerHTML = renderProtocolePage();        break;

function bindLogin() {
  const btn = document.getElementById('l-btn');
  if (_loginStep === 'identifiant') {
    btn.addEventListener('click', doVerifierClient);
    document.getElementById('l-client').addEventListener('keydown', e => { if (e.key === 'Enter') doVerifierClient(); });
  } else if (_loginStep === 'password') {
    const handler = doLoginSupabase;
    btn.addEventListener('click', handler);
    document.getElementById('l-mdp').addEventListener('keydown', e => { if (e.key === 'Enter') handler(); });
  } else if (_loginStep === 'create') {
    const handler = doCreerMotDePasseSupabase;
    btn.addEventListener('click', handler);
    const emailCreate = document.getElementById('l-email-create');
    if (emailCreate) emailCreate.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('l-mdp1').focus(); });
    document.getElementById('l-mdp2').addEventListener('keydown', e => { if (e.key === 'Enter') handler(); });
  } else if (_loginStep === 'reset-password') {
    btn.addEventListener('click', doDefinirNouveauMotDePasse);
    document.getElementById('l-mdp2').addEventListener('keydown', e => { if (e.key === 'Enter') doDefinirNouveauMotDePasse(); });
  }
  const oublie = document.getElementById('l-oublie');
  if (oublie) oublie.addEventListener('click', doMotDePasseOublie);
}

async function doVerifierClient() {
  const client = document.getElementById('l-client').value.trim().toLowerCase();
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('l-err');
  if (!client) { err.textContent = 'Entre ton prénom.'; return; }
  btn.disabled = true; btn.textContent = '…';
  err.textContent = '';
  try {
    const resProfil = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(client)}&select=client_id,supabase_only,email,email_confirme,mdp_defini`, { headers: supaHeaders() });
    const profils = resProfil.ok ? await resProfil.json() : [];
    if (!profils[0] || !profils[0].supabase_only) throw new Error('Identifiant inconnu.');
    const p = profils[0];
    _loginClient = client;
    _loginEmailConfirme = !!p.email_confirme;
    _loginAuthEmail = (p.email_confirme && p.email) ? p.email : (client + '@apptraining-users.com');
    _loginKnownEmail = (!p.email_confirme && p.email) ? p.email : '';
    // mdp_defini connu à l'avance : on ne devine plus depuis l'erreur générique de signInWithPassword.
    _loginStep = p.mdp_defini ? 'password' : 'create';
    setPage('login');
  } catch(e) {
    err.textContent = e.message || 'Erreur de connexion.';
    btn.disabled = false; btn.textContent = 'Continuer →';
  }
}

// ── Connexion 100% Supabase (aucun appel GAS) ──────────────────────────
async function doLoginSupabase() {
  const mdp = document.getElementById('l-mdp').value;
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('l-err');
  if (!mdp) { err.textContent = 'Entre ton mot de passe.'; return; }
  btn.disabled = true; btn.textContent = '…';
  err.textContent = '';
  try {
    const { data, error } = await sbAuth.auth.signInWithPassword({ email: _loginAuthEmail, password: mdp });
    if (error) {
      // mdp_defini est déjà connu (vérifié à l'étape identifiant) : une erreur ici ne peut être
      // qu'un mauvais mot de passe, jamais un compte inexistant — plus de redirection automatique.
      err.textContent = 'Mot de passe incorrect.';
      btn.disabled = false; btn.textContent = 'Se connecter';
      return;
    }
    await _completerConnexionSupabase(data.session);
  } catch(e) {
    err.textContent = e.message || 'Erreur de connexion.';
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
}

async function doMotDePasseOublie() {
  const err = document.getElementById('l-err');
  if (!_loginEmailConfirme || !_loginAuthEmail) {
    err.textContent = 'Ajoute et confirme ton email dans Paramètres une fois connecté pour activer la récupération. En attendant, contacte ton coach.';
    return;
  }
  err.style.color = '';
  err.textContent = '…';
  try {
    const { error } = await sbAuth.auth.resetPasswordForEmail(_loginAuthEmail, {
      redirectTo: window.location.origin + window.location.pathname
    });
    if (error) throw new Error(error.message);
    err.textContent = 'Email envoyé, vérifie ta boîte de réception.';
  } catch(e) {
    err.textContent = e.message || 'Erreur lors de l\'envoi.';
  }
}

async function doDefinirNouveauMotDePasse() {
  const mdp1 = document.getElementById('l-mdp1').value;
  const mdp2 = document.getElementById('l-mdp2').value;
  const btn  = document.getElementById('l-btn');
  const err  = document.getElementById('l-err');
  err.textContent = '';
  if (mdp1.length < 6) { err.textContent = 'Minimum 6 caractères.'; return; }
  if (mdp1 !== mdp2) { err.textContent = 'Les mots de passe ne correspondent pas.'; return; }
  if (!_recoverySession) { err.textContent = 'Session de récupération expirée, redemande un email.'; return; }
  btn.disabled = true; btn.textContent = '…';
  try {
    const { error } = await sbAuth.auth.updateUser({ password: mdp1 });
    if (error) throw new Error(error.message);
    const email = _recoverySession.user.email;
    let client = email.endsWith('@apptraining-users.com') ? email.split('@')[0] : '';
    if (!client) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?email=eq.${encodeURIComponent(email)}&select=client_id`, { headers: supaHeaders() });
      const rows = res.ok ? await res.json() : [];
      client = rows[0] ? rows[0].client_id : '';
    }
    _loginClient = client;
    await _completerConnexionSupabase(_recoverySession);
    _recoverySession = null;
  } catch(e) {
    err.textContent = e.message || 'Erreur serveur.';
    btn.disabled = false; btn.textContent = 'Valider →';
  }
}

async function doCreerMotDePasseSupabase() {
  const emailSaisi = (document.getElementById('l-email-create').value || '').trim().toLowerCase();
  const mdp1 = document.getElementById('l-mdp1').value;
  const mdp2 = document.getElementById('l-mdp2').value;
  const btn  = document.getElementById('l-btn');
  const err  = document.getElementById('l-err');
  err.textContent = '';
  if (!emailSaisi || !emailSaisi.includes('@')) { err.textContent = 'Entre une adresse e-mail valide.'; return; }
  if (mdp1.length < 6) { err.textContent = 'Minimum 6 caractères.'; return; }
  if (mdp1 !== mdp2) { err.textContent = 'Les mots de passe ne correspondent pas.'; return; }
  btn.disabled = true; btn.textContent = '…';
  try {
    const { data, error } = await sbAuth.auth.signUp({ email: emailSaisi, password: mdp1 });
    if (error) throw new Error(error.message);
    let session = data.session;
    if (!session) {
      const retry = await sbAuth.auth.signInWithPassword({ email: emailSaisi, password: mdp1 });
      if (retry.error) throw new Error(retry.error.message);
      session = retry.data.session;
    }
    await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: _loginClient, mdp_defini: true, email: emailSaisi, email_confirme: true })
    }).catch(() => {});
    await _completerConnexionSupabase(session);
  } catch(e) {
    err.textContent = e.message || 'Erreur serveur.';
    btn.disabled = false; btn.textContent = 'Créer mon mot de passe →';
  }
}

// Date locale (Europe/Paris) au format YYYY-MM-DD — toISOString() convertit en
// UTC avant de trancher la date, ce qui la fait reculer d'un jour à certaines
// heures (même piège que _rmIsoLocal côté console.html, voir CLAUDE.md).
function _isoDateLocal(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

async function _completerConnexionSupabase(session) {
  // Verrouillage app (coach) — vérifié AVANT de finaliser la connexion, même avec
  // le bon mot de passe : un client verrouillé ne doit jamais atteindre l'accueil.
  let estCoach = false;
  try {
    const lockRes = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(_loginClient)}&select=verrouille_app,est_coach,date_creation_compte`, { headers: supaHeaders() });
    const lockRows = lockRes.ok ? await lockRes.json() : [];
    if (lockRows[0] && lockRows[0].verrouille_app) {
      await sbAuth.auth.signOut();
      const err = document.getElementById('l-err');
      if (err) err.textContent = 'Application verrouillée par le coach.';
      const btn = document.getElementById('l-btn');
      if (btn) { btn.disabled = false; btn.textContent = 'Se connecter'; }
      return;
    }
    estCoach = !!(lockRows[0] && lockRows[0].est_coach);
    // Date de première connexion — ancrée une seule fois, jamais réécrite
    // ensuite (reconnexions normales, changement de mot de passe, etc.). Sert
    // aussi de détection fiable de "toute première connexion réelle" pour
    // déclencher le message de bienvenue ci-dessous — le PATCH n'est envoyé
    // QUE si date_creation_compte était encore vide, donc ce bloc ne peut
    // s'exécuter qu'une seule fois par client dans toute la vie du compte.
    if (lockRows[0] && !lockRows[0].date_creation_compte) {
      fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(_loginClient)}`, {
        method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }),
        body: JSON.stringify({ date_creation_compte: _isoDateLocal(new Date()) })
      }).then(res => {
        // N'envoie le message de bienvenue que si le PATCH a réussi — si jamais
        // il échoue, date_creation_compte reste vide et cette branche retentera
        // proprement à la prochaine connexion, sans risque de double bienvenue.
        if (!res.ok) return;
        return fetch(`${SUPABASE_URL}/rest/v1/client_notifications`, {
          method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }),
          body: JSON.stringify({
            client_id: _loginClient,
            title: '👋 Bienvenue sur ton application de suivi !',
            body: "J'espère qu'elle te plaira ! N'hésite pas à faire un tour dans les Paramètres, tu y trouveras le fonctionnement global de l'app — et pense à activer les notifications, c'est important pour ne rien manquer. Si tu as des questions ou que tu repères un bug, n'hésite pas à en parler à ton coach 💪",
            plein_ecran: true,
            source: 'bienvenue',
          })
        });
      }).catch(() => {});
    }
  } catch(e) { /* échec de la vérif réseau : on laisse passer plutôt que de bloquer tout le monde par erreur */ }

  localStorage.setItem('at_client', _loginClient);
  localStorage.setItem('at_token', session.access_token);
  localStorage.setItem('at_coach', estCoach ? '1' : '0');
  localStorage.setItem('at_auth_mode', 'supabase');
  S.client = _loginClient;
  S.token = session.access_token;
  S.isCoach = estCoach;
  _loginStep = 'identifiant';
  _loginClient = '';
  _loginAuthEmail = '';
  _loginEmailConfirme = false;
  // Trace la dernière connexion réelle (fire-and-forget, ne bloque jamais le login).
  fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(S.client)}`, {
    method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ derniere_connexion: new Date().toISOString() })
  }).catch(() => {});
  await loadHomeSupabase();
}

// ── Home ────────────────────────────────────────────────────────────
async function loadHomeSupabase(){
  try {
    const [profils, prog, journee] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(S.client)}&select=prenom,nom,pseudo,photo_url,chimie_actif,email,email_confirme,date_naissance,taille_cm,date_debut,jour_paiement,mode_paiement,jour_bilan,mode_simplifie,steps_cible,seances_cible,cardio_consigne`, { headers: supaHeaders() }).then(r => r.ok ? r.json() : []),
      chargerProgressionSupabase().catch(() => null),
      _loadJourneeDataSupabase().catch(() => ({ aucun: true }))
    ]);
    S.data.profil = profils[0] || {};
    // Le mode simplifié est réglé côté serveur (voir toggleModeSimplifie) — on
    // resynchronise le cache local à chaque chargement pour rester cohérent
    // si le client change d'appareil.
    try { localStorage.setItem('modeSimplifie', S.data.profil.mode_simplifie ? 'true' : 'false'); } catch(e) {}
    if (prog) {
      S.data.prog = prog;
      S.data.prog.nom = [S.data.profil.prenom, S.data.profil.nom].filter(Boolean).join(' ') || S.client;
    }
    _journeeData = journee;
  } catch(e) { S.data.profil = {}; _journeeData = { aucun: true }; }
  // Nouvel accueil "briques" (2026-08-04) — en test sur le compte du coach
  // uniquement (_homeV2Actif), page Supabase séparée (home-supabase-v2),
  // renderHomeSupabase() d'origine jamais touché : retour arrière = juste
  // retirer le gate ci-dessous, rien à reconstruire.
  if (_homeV2Actif()) {
    await _chargerHomeV2Extra().catch(() => { _homeV2Data = null; });
    setPage('home-supabase-v2');
  } else {
    setPage('home-supabase');
  }
  _apresChargementHome();
}

async function _chargerHomeV2Extra() {

    _supaGetOrCreateBilanCourant(clientId).catch(() => null),
  ]);

  const roadmapArr = roadmapRes.ok ? await roadmapRes.json() : [];

let _journeeData = null;

// ── Préchargement (navigation instantanée vers Bilan/Programme/Diète/Mensurations) ──
// Se relance à CHAQUE retour à l'accueil (pas juste une fois par session) —
// donc quel que soit le nombre d'allers-retours, la prochaine page visitée
// est déjà prête. Chaque page consomme sa donnée préchargée une seule fois
// (setPage direct, sans spinner) puis repasse en fetch normal si on la
// revisite sans être repassé par l'accueil entre-temps — les validations et
// saisies restent, elles, toujours en direct.

// Extrait de _apresChargementHome pour pouvoir aussi être rappelé quand on
// désactive le mode simplifié en cours de session (toggleModeSimplifie),
// sans dupliquer la logique de fetch.
function _chargerTop5Home() {
  setTimeout(async () => {
    try {
      // limit=10 sur client_progression AVANT le filtrage (mode simplifié/coach exclus)
      // faisait perdre une place à chaque fois qu'un des 10 meilleurs XP tombait sur un
      // profil filtré (typiquement le coach lui-même, souvent bien classé) — le Top 10
      // affichait alors 9 lignes au lieu de 10. On sur-fetch large, puis on retaille à 10
      // APRÈS filtrage (même correctif que la page Classement complète, qui ne limite pas
      // du tout côté requête).
      const [progRes, profilRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/client_progression?select=client_id,xp_total,titre_actif&order=xp_total.desc&limit=50`, { headers: supaHeaders() }),
        fetch(`${SUPABASE_URL}/rest/v1/client_profils?supabase_only=eq.true&select=client_id,prenom,nom,pseudo,photo_url,mode_simplifie,est_coach`, { headers: supaHeaders() }),
      ]);
      const progRows = progRes.ok ? await progRes.json() : [];
      const profils = profilRes.ok ? await profilRes.json() : [];
      const profilMap = {};
      // Mode simplifié = ne pas apparaître dans le classement des autres. Le coach
      // (est_coach=true, ex: yohanp) n'apparaît pas non plus — le classement est
      // réservé aux vrais clients, pas au coach lui-même même s'il s'entraîne aussi.
      profils.filter(p => !p.mode_simplifie && !p.est_coach).forEach(p => { profilMap[p.client_id] = p; });
      const cl = progRows.filter(p => profilMap[p.client_id]).slice(0, 10).map(p => ({
        id: p.client_id, ...profilMap[p.client_id],
        xpTotal: p.xp_total || 0, niveau: _niveauDepuisXp(p.xp_total || 0),
        titreActif: p.titre_actif || null,
      }));
      S.data.classement = cl;
      const el = document.getElementById('top5Home');
      if (el) el.outerHTML = renderTop5Home(cl);
    } catch(e) {}
  }, 0);
}

function _apresChargementHome() {
  chargerNotificationsClient();
  chargerNotifPrefs();
  // Ouverture depuis une notification push (sw.js openWindow) sur un onglet
  // qui n'était pas encore ouvert — le cas "déjà ouvert" passe par le
  // postMessage écouté plus bas dans le fichier.
  if (new URLSearchParams(location.search).get('openNotif')) {
    history.replaceState(null, '', window.location.pathname);
    setTimeout(() => ouvrirNotificationsClient(), 300);
  }
  // Deep-link depuis une notification poussée (ex: "Ta roadmap a été mise à
  // jour !") sur un onglet qui n'était pas encore ouvert — amène directement
  // sur la page ciblée au lieu du panneau de notifications générique.
  const _openPage = new URLSearchParams(location.search).get('openPage');
  if (_openPage) {
    // semaine/seanceId (optionnels, chrono repos) : voir goTo/loadProgrammeClient.
    const _qs = new URLSearchParams(location.search);
    const _seanceId = _qs.get('seanceId');
    const _deepLink = _seanceId != null ? { semaine: parseInt(_qs.get('semaine')) || 1, seanceId: parseInt(_seanceId) } : undefined;
    history.replaceState(null, '', window.location.pathname);
    setTimeout(() => goTo(_openPage, _deepLink), 300);
  }
  // Détection déblocages niveau/titres — le coach voit ses propres passages
  // de niveau/titres comme n'importe quel client, seule la vue client (coach
  // qui consulte le profil d'un autre) est exclue.
  if (!_viewAsClientOverride) {
    setTimeout(() => verifierDeblocages(S.data.prog), 300);
  }
  // fire-and-forget classement, pas d'appel du tout en mode simplifié (le
  // client ne doit pas apparaître dans le classement des autres).
  if (!modeSimplifieActif()) _chargerTop5Home();
  // Badge coach "Rapports" : chargé en parallèle en arrière-plan, injecté
  // dans le DOM dès que dispo (au lieu de bloquer l'affichage de l'accueil).
  if (S.isCoach) {
    fetch(`${SUPABASE_URL}/rest/v1/rapports_bugs?lu=eq.false&select=id`, { headers: supaHeaders() })
      .then(r => r.ok ? r.json() : [])
      .then(rows => {
        const n = rows.length;
        S.data.bugsNonLus = n;
        const el = document.getElementById('badgeRapports');
        if (el) el.innerHTML = n > 0 ? `<div style="position:absolute;top:8px;right:8px;background:#e74c3c;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;">${n}</div>` : '';
      }).catch(() => { S.data.bugsNonLus = 0; });
  }
}

function renderTop5Home(liste) {
  if (!liste || liste.length === 0) return '<div id="top5Home"></div>';
  const _podium = [
    { bg:'linear-gradient(135deg,#1e1700,#3d2e00)', border:'1.5px solid #f59e0b', namec:'#fde68a' },
    { bg:'linear-gradient(135deg,#101420,#1e2838)', border:'1.5px solid #94a3b8', namec:'#d4d8e0' },
    { bg:'linear-gradient(135deg,#140e09,#271c0d)', border:'1px solid #b45309',   namec:'#d4956a' }
  ];
  const rows = liste.map((c, i) => {
    const tier = typeof niveauToTier === 'function' ? niveauToTier(c.niveau) : 'debutant';
    const tc = typeof getTierColors === 'function' ? getTierColors(tier) : {c1:'#a8b0c8',c2:'#404858'};
    const isMe = c.client === S.client || c.id === S.client;
    const { principal: nomComplet, secondaire } = _nomAffichage(c);
    // Widget compact : sans pseudo on abrège "Prénom Nom" en "Prénom N." (place limitée) ;
    // avec pseudo, celui-ci est déjà court, on l'affiche tel quel.
    const parts = nomComplet.trim().split(' ');
    const nom = secondaire ? nomComplet : parts[0] + (parts[1] ? ' ' + parts[1][0] + '.' : '');
    const initiales = ((c.prenom ? c.prenom[0] : '') + (c.nom ? c.nom[0] : '')).toUpperCase() || '?';
    let bg, border, namec;
    if (i < 3) { bg = _podium[i].bg; border = _podium[i].border; namec = isMe ? tc.c1 : _podium[i].namec; }
    else { bg = `linear-gradient(145deg,#0f1117,${tc.c2}aa,#0f1117)`; border = isMe ? `1px solid ${tc.c1}88` : '1px solid #1e2235'; namec = isMe ? tc.c1 : '#f0f2ff'; }
    const badgeSz = i === 0 ? 48 : 44;
    const tDef = (c.titreActif && typeof TITRES_DEF !== 'undefined') ? TITRES_DEF.find(t => t.id === c.titreActif) : null;
    const titreBadge = tDef ? `<span style="display:inline-flex;align-items:center;gap:3px;background:linear-gradient(90deg,${tDef.c2}cc,${tDef.c1}99);border:1px solid ${tDef.c1}55;border-radius:5px;padding:1px 6px 1px 4px;font-size:9px;font-weight:700;color:#f0f2ff;margin-left:6px;vertical-align:middle;">${tDef.icon} ${tDef.nom}</span>` : '';
    return `<div style="display:flex;align-items:center;gap:10px;padding:${i===0?'10px':'8px'} 12px;border-radius:10px;margin-bottom:5px;background:${bg};border:${border};">
      <div style="min-width:22px;display:flex;align-items:center;justify-content:center;font-size:16px;">${i < 3 ? _rangMedailleSvg(i+1, 26) : (i+1)+'.'}</div>
      <div style="flex-shrink:0;">${_avatarAvecBadge(c.photo_url, initiales, tier, badgeSz, Math.round(badgeSz*0.5), 't5'+i)}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:${i===0?'14':'13'}px;font-weight:700;color:${namec};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(nom)}${secondaire ? ` <span style="font-size:9px;font-weight:400;color:#8892a4;">(${esc(secondaire)})</span>` : ''}${isMe?' <span style="font-size:9px;opacity:0.7;">(toi)</span>':''}${titreBadge}</div>
        <div style="font-size:11px;color:#8892a4;margin-top:1px;">Niv. ${c.niveau} · ${(c.xpTotal||0).toLocaleString('fr')} XP</div>
      </div>
    </div>`;
  }).join('');
  return `<div id="top5Home" style="background:#161b2e;border-radius:12px;border:1px solid #1e2235;padding:14px 16px;margin-top:14px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #1e2235;">
      <span style="font-size:20px;">🏆</span>
      <div>
        <div style="font-size:14px;font-weight:800;background:linear-gradient(90deg,#fde68a,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Top 10</div>
        <div style="font-size:10px;color:#555e7a;text-transform:uppercase;letter-spacing:1.5px;">Classement</div>
      </div>
    </div>
    ${rows}
  </div>`;
}

// ── Mode simplifié ───────────────────────────────────────────────────
// Cache l'affichage XP/progression/classement — l'XP continue de tourner
// normalement côté serveur, seul le rendu client est concerné (voir
// modeSimplifieActif() dans _showJourneeEnregistreeSupabase, _pcFlashSeanceValidee,
// _afficherXPValidationSupa, verifierDeblocages). Persisté dans
// client_profils.mode_simplifie (source de vérité, lu aussi par le classement
// pour exclure ces clients) ; localStorage sert de cache local synchrone
// (resynchronisé à chaque chargement de l'accueil, voir loadHomeSupabase).
function modeSimplifieActif() {
  try { return localStorage.getItem('modeSimplifie') === 'true'; } catch(e) { return false; }
}
async function toggleModeSimplifie() {
  const nouveau = !modeSimplifieActif();
  try { localStorage.setItem('modeSimplifie', nouveau ? 'true' : 'false'); } catch(e) {}
  ouvrirSettings();
  // Rafraîchit l'accueil EN PLACE si on y est déjà — jamais render() ici, qui
  // réécrit document.body.innerHTML et détruirait le panneau réglages qu'on
  // vient de réafficher juste au-dessus (c'était le bug : le toggle semblait
  // ne prendre effet qu'après avoir rechargé l'app).
  if ((S.page === 'home-supabase' || S.page === 'home-supabase-v2')) {
    _majCarteHeader();
    const top5El = document.getElementById('top5Home');
    if (nouveau) { if (top5El) top5El.innerHTML = ''; }
    else if (top5El) _chargerTop5Home();
  }
  if (S.data.profil) S.data.profil.mode_simplifie = nouveau;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, mode_simplifie: nouveau })
    });
  } catch(e) {}
}

// Carte header (badge, nom, titre, XP, barre de niveau) — extraite pour

// page, dès que S.data.prog change (XP gagné) pendant qu'on est sur l'accueil.
function renderCarteHeader() {

  const titreHtml = titreDef ? renderTitrePill(titreDef, false) : '';

      border-radius:12px;border-top:4px solid ${tc.c1};

      padding:14px 16px;margin-bottom:16px;
      box-shadow:inset 0 1px 0 ${tc.c1}88,0 0 28px ${tc.c1}44,0 2px 14px rgba(0,0,0,0.45);">
      <div style="position:absolute;top:10px;right:12px;display:flex;align-items:center;gap:6px;z-index:2;">
        <button id="btnChatHeader" onclick="goTo('chat')" style="position:relative;width:36px;height:36px;background:transparent;border:1px solid #2a2f45;border-radius:9px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;">${ICONE_CHAT}${(typeof _chatNonLus !== 'undefined' && _chatNonLus > 0) ? `<span style="position:absolute;top:-5px;right:-5px;background:#e05c5c;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;">${_chatNonLus > 9 ? '9+' : _chatNonLus}</span>` : ''}</button>
        <button id="btnNotifsClient" onclick="ouvrirNotificationsClient()" style="position:relative;width:36px;height:36px;background:transparent;border:1px solid #2a2f45;border-radius:9px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;">${ICONE_CLOCHE}${_notifsClientCount > 0 ? `<span style="position:absolute;top:-5px;right:-5px;background:#e05c5c;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;">${_notifsClientCount}</span>` : ''}</button>
        <button onclick="ouvrirSettings()" style="width:36px;height:36px;background:transparent;border:1px solid #2a2f45;border-radius:9px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;">${ICONE_PARAMETRES}</button>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div ${simplifie ? '' : 'onclick="loadProgression()"'} style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding-right:118px;cursor:${simplifie ? 'default' : 'pointer'};" ${simplifie ? '' : `ontouchstart="this.style.opacity='.75'" ontouchend="this.style.opacity='1'"`}>
          ${simplifie ? '' : _avatarAvecBadge(profilData.photo_url, initialesHm, tier, sz, Math.round(sz*0.5), 'hm')}
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <span style="font-size:18px;font-weight:700;color:#f0f2ff;">${esc(nomAffichePrenom)}</span>
            </div>

function _majCarteHeader() {
  const carte = document.getElementById('carteHeaderHome');
  if (carte) carte.outerHTML = renderCarteHeader();
}

// ── Notifications reçues du coach (historique, indépendant du push) ────
let _notifsClient = [];
let _notifsClientCount = 0;

async function chargerNotificationsClient() {
  try {
    // source=neq.chat : les messages du chat ont leur propre badge dédié (bouton flottant
    // + header, cf. chat.js) — ils ne doivent pas polluer la cloche 🔔 de notifications.
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_notifications?client_id=eq.${encodeURIComponent(S.client)}&source=neq.chat&order=created_at.desc&limit=50`, { headers: supaHeaders() });
    _notifsClient = res.ok ? await res.json() : [];
    _notifsClientCount = _notifsClient.filter(n => !n.lu).length;
    _majCarteHeader();
    const pleinEcran = _notifsClient.find(n => n.plein_ecran && !n.lu);
    if (pleinEcran) afficherNotifPleinEcran(pleinEcran);
  } catch(e) {}
}

// Notification "plein écran" (en plus de la cloche) : le coach coche l'option
// à l'envoi. Affichée une seule fois à l'ouverture de l'app tant qu'elle n'a
// pas été fermée — la fermeture la marque lue (elle reste ensuite dans la
// cloche comme n'importe quelle autre notification, juste sans replay du popup).
function afficherNotifPleinEcran(n) {
  if (document.getElementById('notifPleinEcran')) return;
  const el = document.createElement('div');
  el.id = 'notifPleinEcran';
  el.style.cssText = 'position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;padding:24px;';
  el.innerHTML = `
    <div style="background:#151a28;border-radius:20px;max-width:420px;width:100%;padding:28px 24px;text-align:center;">
      <div style="margin-bottom:14px;"><svg width="38" height="40" viewBox="0 0 16 17" fill="none"><path d="M8 1.5c-2.3 0-4 1.9-4 4.2v2.6c0 .5-.2 1-.5 1.4L2.5 11.3c-.5.6-.1 1.5.7 1.5h9.6c.8 0 1.2-.9.7-1.5l-1-1.6c-.3-.4-.5-.9-.5-1.4V5.7c0-2.3-1.7-4.2-4-4.2z" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.2 14.5a1.9 1.9 0 0 0 3.6 0" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg></div>
      <div style="font-size:18px;font-weight:700;color:#fff;margin-bottom:10px;">${esc(n.title)}</div>
      <div style="font-size:14.5px;color:#c8d0e0;line-height:1.6;margin-bottom:22px;">${esc(n.body)}</div>
      <button onclick="_fermerNotifPleinEcran(${n.id})" style="width:100%;background:#4f8ef7;color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;">OK</button>
    </div>`;
  document.body.appendChild(el);
}
function _fermerNotifPleinEcran(id) {
  document.getElementById('notifPleinEcran')?.remove();
  fetch(`${SUPABASE_URL}/rest/v1/client_notifications?id=eq.${id}`, {
    method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ lu: true, lu_at: new Date().toISOString() })
  }).then(() => {
    const n = _notifsClient.find(x => x.id === id);
    if (n) n.lu = true;
    _notifsClientCount = _notifsClient.filter(x => !x.lu).length;
    _majCarteHeader();
  }).catch(() => {});
}

// Clic sur une notification de la cloche qui cible une page précise (ex: le
// coach a notifié une mise à jour de Roadmap) : marque lue puis amène
// directement sur cette page, comme un clic sur le push correspondant.
function _clicNotifClient(id, page) {
  document.getElementById('notifsClientPanel')?.remove();
  fetch(`${SUPABASE_URL}/rest/v1/client_notifications?id=eq.${id}`, {
    method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ lu: true, lu_at: new Date().toISOString() })
  }).then(() => {
    const n = _notifsClient.find(x => x.id === id);
    if (n) n.lu = true;
    _notifsClientCount = _notifsClient.filter(x => !x.lu).length;
    _majCarteHeader();
  }).catch(() => {});
  goTo(page);
}

function ouvrirNotificationsClient() {
  const existing = document.getElementById('notifsClientPanel');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'notifsClientPanel';
  el.style.cssText = 'position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.82);display:flex;align-items:flex-end;';
  const item = n => `
    <div ${n.page ? `onclick="_clicNotifClient(${n.id},'${n.page}')" style="cursor:pointer;` : 'style="'}background:${n.lu?'#0f1117':'#161c2c'};border-radius:12px;padding:14px 16px;margin-bottom:8px;border-left:3px solid ${n.lu?'transparent':'#4f8ef7'};">
      <div style="font-size:14px;font-weight:700;color:#e8eaf0;margin-bottom:3px;">${esc(n.title)}</div>
      <div style="font-size:13px;color:#c8d0e0;line-height:1.5;">${esc(n.body)}</div>
      <div style="font-size:10.5px;color:#555e7a;margin-top:6px;">${new Date(n.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})} à ${new Date(n.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}${n.page ? ' · toucher pour voir' : ''}</div>
    </div>`;
  el.innerHTML = `
    <div class="sheet-body" style="background:#151a28;border-radius:20px 20px 0 0;width:100%;max-width:520px;margin:0 auto;max-height:82vh;display:flex;flex-direction:column;">
      <div class="sheet-handle" style="width:36px;height:4px;background:#2d3142;border-radius:2px;margin:10px auto 0;flex-shrink:0;"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 20px;flex-shrink:0;">
        <div style="font-size:17px;font-weight:700;color:#fff;">🔔 Notifications</div>
        <button onclick="document.getElementById('notifsClientPanel').remove()" style="width:30px;height:30px;background:#1e2235;border-radius:50%;padding:0;font-size:15px;margin:0;min-width:unset;line-height:30px;color:#8892a4;border:1px solid #2d3142;cursor:pointer;">✕</button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:4px 20px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;">
        ${_notifsClient.length ? _notifsClient.map(item).join('') : `<div style="text-align:center;color:#555e7a;font-size:13px;padding:40px 0;">Aucune notification pour l'instant.</div>`}
      </div>
    </div>`;
  el.onclick = e => { if (e.target === el) el.remove(); };
  document.body.appendChild(el);
  attacherSwipeFermeture(el);
  if (_notifsClientCount > 0) {
    fetch(`${SUPABASE_URL}/rest/v1/client_notifications?client_id=eq.${encodeURIComponent(S.client)}&lu=eq.false`, {
      method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ lu: true, lu_at: new Date().toISOString() })
    }).then(() => {
      _notifsClient.forEach(n => n.lu = true);
      _notifsClientCount = 0;
      _majCarteHeader();
    }).catch(() => {});
  }
}

async function loadClassement() {
  showLoadingOverlay('Chargement…');
  try {
    // Classement : uniquement les clients supabase_only ayant une progression
    const [progRes, profilRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/client_progression?select=client_id,xp_total,titre_actif&order=xp_total.desc`, { headers: supaHeaders() }),
      fetch(`${SUPABASE_URL}/rest/v1/client_profils?supabase_only=eq.true&select=client_id,prenom,nom,pseudo,photo_url,mode_simplifie,est_coach`, { headers: supaHeaders() }),
    ]);
    const progRows = progRes.ok ? await progRes.json() : [];
    const profils = profilRes.ok ? await profilRes.json() : [];
    const profilMap = {};
    // Mode simplifié = ne pas apparaître dans le classement des autres. Le coach
    // (est_coach=true) n'apparaît pas non plus.
    profils.filter(p => !p.mode_simplifie && !p.est_coach).forEach(p => { profilMap[p.client_id] = p; });
    S.data.classement = progRows
      .filter(p => profilMap[p.client_id])
      .map(p => ({
        id: p.client_id,
        ...profilMap[p.client_id],
        xpTotal: p.xp_total || 0,
        niveau: _niveauDepuisXp(p.xp_total || 0),
        titreActif: p.titre_actif || null,
      }));
    hideLoadingOverlay();
    setPage('classement');
  } catch(e) { hideLoadingOverlay(); loadHomeSupabase(); }
}

function renderClassement() {
  const items = S.data.classement || [];
  const rows = items.map((c, i) => {

// Upload direct vers le bucket "profils-photos" (Supabase Storage, public) — même
// pattern que _ajouterBilanPhotoClient (bilan.js), une seule photo remplace l'ancienne.
// ── Recadrage circulaire de la photo de profil (zoom + déplacement) avant envoi ──
// Pas de librairie externe : un <img> en position absolue dans un cercle masqué
// (overflow:hidden + border-radius:50%), transform CSS translate+scale pour
// zoomer/déplacer, puis on reproduit exactement la même transformation sur un
// <canvas> (avec un clip circulaire) pour générer le blob final envoyé au serveur.
let _cropState = null;

function _choisirPhotoProfilFichier(e) {
  const file = (e.target.files || [])[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => _ouvrirCropPhotoModal(reader.result);
  reader.readAsDataURL(file);
}

function _ouvrirCropPhotoModal(dataUrl) {
  const existing = document.getElementById('cropPhotoModal');
  if (existing) existing.remove();
  const img = new Image();
  img.onload = () => {
    const vp = Math.min(280, window.innerWidth - 60);
    // "base" = échelle qui fait juste couvrir le cercle (comme background-size:cover) —
    // zoom 100% sur le slider = cette échelle, jusqu'à 300% pour zoomer davantage.
    const base = Math.max(vp / img.naturalWidth, vp / img.naturalHeight);
    _cropState = {
      img, vp, base, scale: base,
      offsetX: (vp - img.naturalWidth * base) / 2,
      offsetY: (vp - img.naturalHeight * base) / 2,
    };
    const el = document.createElement('div');
    el.id = 'cropPhotoModal';
    el.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;box-sizing:border-box;';
    el.innerHTML = `
      <div style="font-size:14px;color:#e8eaf0;font-weight:600;">Ajuste ta photo</div>
      <div id="cropViewport" style="position:relative;width:${vp}px;height:${vp}px;border-radius:50%;overflow:hidden;border:2px solid #4f6ef7;touch-action:none;background:#000;cursor:grab;">
        <img id="cropImg" src="${dataUrl}" draggable="false" style="position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-select:none;pointer-events:none;">
      </div>
      <div style="display:flex;align-items:center;gap:10px;width:${vp}px;">
        <span style="font-size:16px;color:#8892a4;">−</span>
        <input id="cropZoomSlider" type="range" min="100" max="300" value="100" style="flex:1;accent-color:#4f6ef7;">
        <span style="font-size:16px;color:#8892a4;">+</span>
      </div>
      <div style="display:flex;gap:12px;">
        <button onclick="document.getElementById('cropPhotoModal').remove();_cropState=null;" style="padding:11px 22px;background:#2d3142;border:none;border-radius:10px;color:#e8eaf0;font-size:14px;cursor:pointer;">Annuler</button>
        <button onclick="_validerCropPhoto()" style="padding:11px 26px;background:linear-gradient(135deg,#4f6ef7,#3559d8);border:none;border-radius:10px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;">Valider</button>
      </div>`;
    document.body.appendChild(el);
    _appliquerTransformCrop();
    _initDragCrop();
    document.getElementById('cropZoomSlider').addEventListener('input', (ev) => {
      const pct = parseFloat(ev.target.value) / 100;
      const oldScale = _cropState.scale;
      _cropState.scale = _cropState.base * pct;
      // Zoome en gardant le centre du cadre visuellement fixe (pas le coin de l'image).
      const c = _cropState.vp / 2;
      const ratio = _cropState.scale / oldScale;
      _cropState.offsetX = c - (c - _cropState.offsetX) * ratio;
      _cropState.offsetY = c - (c - _cropState.offsetY) * ratio;
      _clampCropOffset();
      _appliquerTransformCrop();
    });
  };
  img.src = dataUrl;
}

function _initDragCrop() {
  const vp = document.getElementById('cropViewport');
  if (!vp) return;
  let dragging = false, lastX = 0, lastY = 0;
  vp.addEventListener('pointerdown', (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    vp.setPointerCapture(e.pointerId);
    vp.style.cursor = 'grabbing';
  });
  vp.addEventListener('pointermove', (e) => {
    if (!dragging || !_cropState) return;
    _cropState.offsetX += e.clientX - lastX;
    _cropState.offsetY += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    _clampCropOffset();
    _appliquerTransformCrop();
  });
  const fin = () => { dragging = false; vp.style.cursor = 'grab'; };
  vp.addEventListener('pointerup', fin);
  vp.addEventListener('pointercancel', fin);
}

// Empêche de faire glisser l'image au-delà des bords du cercle (toujours plein cadre).
function _clampCropOffset() {
  const s = _cropState;
  const w = s.img.naturalWidth * s.scale, h = s.img.naturalHeight * s.scale;
  s.offsetX = Math.min(0, Math.max(s.vp - w, s.offsetX));
  s.offsetY = Math.min(0, Math.max(s.vp - h, s.offsetY));
}

function _appliquerTransformCrop() {
  const el = document.getElementById('cropImg');
  if (!el || !_cropState) return;
  el.style.width = _cropState.img.naturalWidth + 'px';
  el.style.height = _cropState.img.naturalHeight + 'px';
  el.style.transform = `translate(${_cropState.offsetX}px, ${_cropState.offsetY}px) scale(${_cropState.scale})`;
}

// Reproduit exactement le cadrage visuel (offset/scale) sur un canvas haute résolution
// avec un clip circulaire, pour obtenir le fichier final envoyé au serveur.
function _validerCropPhoto() {
  const s = _cropState;
  if (!s) return;
  const outSize = 500;
  const k = outSize / s.vp;
  const canvas = document.createElement('canvas');
  canvas.width = outSize; canvas.height = outSize;
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.beginPath(); ctx.arc(outSize / 2, outSize / 2, outSize / 2, 0, Math.PI * 2); ctx.clip();
  ctx.translate(s.offsetX * k, s.offsetY * k);
  ctx.scale(s.scale * k, s.scale * k);
  ctx.drawImage(s.img, 0, 0);
  ctx.restore();
  canvas.toBlob(blob => {
    document.getElementById('cropPhotoModal')?.remove();
    _cropState = null;
    _uploadPhotoProfilBlob(blob);
  }, 'image/jpeg', 0.92);
}

async function _uploadPhotoProfilBlob(blob) {
  if (!blob) return;
  const msg = document.getElementById('pf-photo-msg');
  if (msg) { msg.style.color = 'var(--muted)'; msg.textContent = 'Envoi…'; }
  try {
    const path = `${S.client}/${Date.now()}.jpg`;
    const upRes = await fetch(`${SUPABASE_URL}/storage/v1/object/profils-photos/${path}`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'image/jpeg' },
      body: blob
    });
    if (!upRes.ok) throw new Error('Erreur envoi photo.');
    const url = `${SUPABASE_URL}/storage/v1/object/public/profils-photos/${path}`;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, photo_url: url })
    });
    if (!res.ok) throw new Error('Erreur serveur.');
    S.data.profil = S.data.profil || {};
    S.data.profil.photo_url = url;
    if (msg) { msg.style.color = ''; msg.textContent = ''; }
    if (document.getElementById('settingsPanel')) ouvrirSettings('profil');
    if ((S.page === 'home-supabase' || S.page === 'home-supabase-v2')) _majCarteHeader();
  } catch(err) {
    if (msg) { msg.style.color = 'var(--red)'; msg.textContent = err.message || 'Erreur.'; }
  }
}

async function doSauverEmailProfil() {
  const input = document.getElementById('pf-email');
  const msg = document.getElementById('pf-email-msg');
  const email = input.value.trim();
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = 'Email invalide.'; msg.style.color = 'var(--red)'; return; }
  msg.style.color = '';
  msg.textContent = '…';
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, email })
    });
    S.data.profil = S.data.profil || {};
    // On retente updateUser tant que l'email Auth n'est pas confirmé (le champ peut déjà être
    // pré-rempli côté client_profils sans que le compte Supabase Auth n'ait jamais été basculé dessus).
    const needsAuthUpdate = email && !S.data.profil.email_confirme;
    S.data.profil.email = email;
    if (needsAuthUpdate) {
      const { error } = await sbAuth.auth.updateUser({ email });
      if (error) throw new Error(error.message);
      msg.textContent = 'Vérifie ta boîte mail pour confirmer cette adresse.';
    } else {
      msg.textContent = 'Enregistré ✓';
    }
  } catch(e) {
    msg.style.color = 'var(--red)';
    msg.textContent = e.message || 'Erreur serveur.';
  }
}

async function doChangerMotDePasse() {
  const mdp1 = document.getElementById('pf-mdp1').value;
  const mdp2 = document.getElementById('pf-mdp2').value;
  const msg = document.getElementById('pf-mdp-msg');
  msg.style.color = 'var(--red)';

  if (mdp1 !== mdp2) { msg.textContent = 'Les mots de passe ne correspondent pas.'; return; }
  msg.style.color = '';
  msg.textContent = '…';
  try {
    const { error } = await sbAuth.auth.updateUser({ password: mdp1 });
    if (error) throw new Error(error.message);
    document.getElementById('pf-mdp1').value = '';
    document.getElementById('pf-mdp2').value = '';
    msg.textContent = 'Mot de passe changé ✓';
  } catch(e) {
    msg.style.color = 'var(--red)';
    msg.textContent = e.message || 'Erreur serveur.';
  }
}

function _urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch(e) {}
  window.location.href = window.location.pathname + '?t=' + Date.now();
}

// État RÉEL de l'abonnement (indépendant de _notifPrefs.push_actif, qui n'est
// qu'une préférence en base valant `true` par défaut tant que le client n'a
// jamais rien enregistré). Piège vécu : le toggle des Paramètres se basait sur
// cette préférence par défaut et s'affichait déjà vert pour tout nouveau
// client, qui ne le touchait donc jamais → aucun abonnement navigateur créé
// malgré un toggle "activé" (cas Perrine, 2026-08-01). Le toggle doit refléter
// l'abonnement réel, jamais la préférence seule.
let _pushReellementActif = false;

async function _checkPushReel() {
  if (!('serviceWorker' in navigator)) return false;
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    _pushReellementActif = !!sub;
  } catch(e) { _pushReellementActif = false; }
  return _pushReellementActif;
}

async function _majStatutPushClient() {
  await _checkPushReel();
  const el = document.getElementById('pushStatusClient');
  if (el) el.textContent = _pushReellementActif ? '✓ Notifications activées sur cet appareil.' : '';
  _majToggleNotifDom();
}

// Met à jour uniquement le DOM du toggle des Paramètres (sans re-render complet
// du panneau, qui perdrait le scroll/état en cours).
function _majToggleNotifDom() {
  const sw = document.getElementById('notifGeneralesToggle');
  const kn = document.getElementById('notifGeneralesKnob');
  if (!sw || !kn) return;
  sw.style.background = _pushReellementActif ? '#3ecf8e' : '#2d3142';
  kn.style.background = _pushReellementActif ? '#fff' : '#555e7a';
  kn.style.transform = _pushReellementActif ? 'translateX(20px)' : 'none';
}

// Retourne true seulement si l'abonnement a réellement été créé — sert à
// toggleNotificationsGenerales() pour ne faire basculer la préférence que si
// l'activation a vraiment réussi (sinon le toggle mentirait sur l'état réel).
async function activerNotifications() {
  const btn = document.getElementById('btnActiverPushClient');
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
    showToast('Notifications non supportées sur cet appareil.', '#c0392b'); return false;
  }
  // iOS n'autorise les notifications web QUE pour une PWA installée à l'écran d'accueil
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (isIOS && !isStandalone) {
    showToast('Ajoute d\'abord l\'app à ton écran d\'accueil pour activer les notifications.', '#c0392b');
    return false;
  }
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') { showToast('Permission refusée.', '#c0392b'); return false; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: _urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    const j = sub.toJSON();
    const res = await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?on_conflict=endpoint`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth })
    });
    if (!res.ok) throw new Error(await res.text());
    showToast('🔔 Notifications activées', '#1D9E75');
    _majStatutPushClient();
    return true;
  } catch(e) {
    showToast(e.message || 'Erreur', '#c0392b');
    return false;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Activer les notifications'; }
  }
}

// Désinscrit réellement l'appareil (contrairement à l'ancien toggle qui ne
// faisait qu'écrire client_notif_prefs.push_actif sans jamais toucher à
// l'abonnement navigateur — l'appareil continuait donc à recevoir les push
// même "désactivées"). Supprime aussi la ligne push_subscriptions : les envois
// manuels du coach et l'edge function n'ont alors plus aucun endpoint à viser.
async function desactiverNotifications() {
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && await reg.pushManager.getSubscription();
      if (sub) {
        await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, { method: 'DELETE', headers: supaHeaders() });
        await sub.unsubscribe();
      }
    }
  } catch(e) {}
  _majStatutPushClient();
}

// Toggle "Notifications" des Paramètres : active/désactive réellement le push
// au moment du clic (abonnement navigateur + push_subscriptions), pas
// seulement la préférence en base.
async function toggleNotificationsGenerales() {
  // Basé sur l'état RÉEL de l'abonnement (_pushReellementActif), pas sur la
  // préférence _notifPrefs.push_actif qui peut valoir true par défaut sans
  // qu'aucun abonnement navigateur n'existe (voir _checkPushReel).
  const activerMaintenant = !_pushReellementActif;
  if (activerMaintenant) {
    const ok = await activerNotifications();
    if (!ok) return; // permission refusée / non supporté : rien ne change
  } else {
    await desactiverNotifications();
  }
  await _checkPushReel();
  _notifPrefs.push_actif = _pushReellementActif;
  _majToggleNotifDom();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_notif_prefs?on_conflict=client_id`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: S.client, push_actif: _notifPrefs.push_actif })
    });
  } catch(e) {}
}

// ── Pseudo & photo de profil ─────────────────────────────────────────────
// Le pseudo remplace le nom réel en affichage PRINCIPAL partout où un nom de client
// apparaît (accueil, classement) — le vrai prénom + initiale du nom reste toujours
// visible en plus petit à côté (jamais totalement caché, important pour le coach qui
// doit pouvoir identifier qui est qui). Sans pseudo, comportement inchangé (nom complet).
function _nomAffichage(p) {
  const prenom = p.prenom || '';
  const nom = p.nom || '';
  const reel = [prenom, nom].filter(Boolean).join(' ') || p.client_id || p.id || '';
  if (p.pseudo) {
    const initiale = nom ? nom.charAt(0).toUpperCase() + '.' : '';
    const reelCourt = [prenom, initiale].filter(Boolean).join(' ') || reel;
    return { principal: p.pseudo, secondaire: reelCourt };
  }
  return { principal: reel, secondaire: null };
}
// Médaille SVG pour les 3 premières places du classement (Top 10 accueil + page
// Classement) — remplace les emoji 🥇🥈🥉 par un badge sphérique dégradé (même
// esprit que les badges de tier collection.js, en plus simple), plus stylé.
function _rangMedailleSvg(rang, size) {
  size = size || 26;
  const PAL = {
    1: { c1:'#FFF2C4', c2:'#F5C542', c3:'#7a5600', ring:'#FFD966' },
    2: { c1:'#F5F6F8', c2:'#B7BEC9', c3:'#4d525a', ring:'#D4D9E0' },
    3: { c1:'#F3C696', c2:'#B5651D', c3:'#43250c', ring:'#D18A46' },
  }[rang];
  const id = 'rgmdl' + rang;
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="${id}" cx="35%" cy="26%" r="72%">
      <stop offset="0%" stop-color="${PAL.c1}"/><stop offset="55%" stop-color="${PAL.c2}"/><stop offset="100%" stop-color="${PAL.c3}"/>
    </radialGradient></defs>
    <circle cx="20" cy="20" r="18" fill="${PAL.c3}" opacity="0.35"/>
    <circle cx="20" cy="20" r="17" fill="url(#${id})" stroke="${PAL.ring}" stroke-width="1.4"/>
    <text x="20" y="27" text-anchor="middle" font-size="18" font-weight="800" fill="#1a1208" opacity="0.82">${rang}</text>
  </svg>`;
}
// Cercle avatar : photo si renseignée, sinon initiales sur fond dégradé (même dégradé
// que la carte profil des Paramètres, pour rester cohérent visuellement).
function _avatarCircleHtml(photoUrl, initiales, size) {

// La photo de profil est l'élément PRINCIPAL (grande), le badge de niveau devient un
// petit macaron en bas à droite — inverse de l'ancien affichage (badge en grand, rien

// la même chose, une seule source de vérité localStorage.
function chatFabActif() {
  try { return localStorage.getItem(_CHAT_FAB_HIDDEN_KEY) !== '1'; } catch(e) { return true; }

  if (chatFabActif()) {
    localStorage.setItem(_CHAT_FAB_HIDDEN_KEY, '1');

  const el = document.getElementById('stgChatFab');
  if (el) el.outerHTML = _stgSwitchHtml('stgChatFab', chatFabActif(), 'toggleChatFab()');
}

// ── Journée en cours — mode Supabase ─────────────────────────────────
// La carte "Journée en cours" écrit directement dans jours[jourIdx] du
// bilan hebdo Supabase en cours (même source de vérité que la page Bilan
// complète, cf. sauverJourBilanSupa dans bilan.js) — jamais de compteur XP
// incrémenté séparément. Réécriture idempotente : cliquer plusieurs fois ne
// change rien de plus qu'un seul clic. Voir le plan de refonte XP.
function _jourIdxAujourdhui() {
  // Lundi=0 ... Dimanche=6, décalage -2h pour qu'une saisie après minuit
  // compte encore pour la veille (comme le reste de l'app).
  const jsDay = new Date(Date.now() - 2*3600*1000).getDay(); // 0=dim...6=sam
  return (jsDay + 6) % 7;
}
async function _loadJourneeDataSupabase() {
  const clientId = getClient ? getClient() : S.client;
  const { id, jours } = await _supaBilanNonEnvoye(clientId);
  const idx = _jourIdxAujourdhui();
  const j = jours[idx] || {};
  return { bilanId: id, jourIdx: idx, diete: !!j.diete, training: !!j.training, cardio: !!j.cardio, steps: j.steps ?? '', valide: !!j.valide, aucun: false };
}
async function _sauverJourneeSupabase(field, value) {
  if (!_journeeData || !_journeeData.bilanId) return;
  _journeeData[field] = value;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/bilans?id=eq.${_journeeData.bilanId}&select=jours`, { headers: supaHeaders() });
  const arr = res.ok ? await res.json() : [];
  const jours = (arr[0] && arr[0].jours) || [];
  const idx = _journeeData.jourIdx;
  jours[idx] = { ...(jours[idx] || {}), diete: _journeeData.diete, training: _journeeData.training, cardio: _journeeData.cardio, steps: _journeeData.steps || null, valide: !!_journeeData.valide };

}

function toggleJourneeFieldSupabase(type) {

function sauverStepsJourneeSupabase(val) {
  if (!_journeeData) return;
  const v = val ? parseInt(val.replace(/\s/g,'').replace(',','.')) : '';
  const steps = isNaN(v) ? '' : v;
  // pasTotal (chargerProgressionSupabase) compte les steps de la semaine en
  // cours même non envoyée — un titre "pas cumulés" peut donc se débloquer
  // dès la saisie, sans attendre "Valider ma journée".
  _sauverJourneeSupabase('steps', steps)
    .then(() => { if (typeof rafraichirProgressionEtDeblocages === 'function') rafraichirProgressionEtDeblocages(); })
