function renderRepartitionInto(cont, blocs, selectedBlocIdx, context){
  if (!blocs || !blocs.length) { cont.innerHTML = ''; return; }
  const idx = Math.min(selectedBlocIdx ?? 0, blocs.length - 1);
  const multiBloc = blocs.length > 1;

  // Pills de sélection de bloc (si plusieurs blocs)
  const BLOCS_LABELS_SHORT = { metabolique: 'Méta', mecanique: 'Méca', force: 'Force' };
  const pills = multiBloc ? blocs.map((b, bi) => {
    const label = (b.type && BLOCS_LABELS_SHORT[b.type]) ? BLOCS_LABELS_SHORT[b.type] : `Bloc ${bi+1}`;
    const active = bi === idx;
    const fn = context === 'tpl'
      ? `_repartitionTplBlocIdx=${bi};renderRepartition()`
      : `_repartitionCpBlocIdx=${bi};_rerenderCpRepartition()`;
    return `<button onclick="${fn}" style="padding:3px 10px;border-radius:99px;border:1px solid ${active?'var(--accent)':'var(--hairline)'};background:${active?'var(--accent-soft)':'transparent'};color:${active?'var(--accent)':'var(--text-faint)'};font-size:11px;font-weight:${active?'700':'400'};cursor:pointer;">${esc(label)}</button>`;
  }).join('') : '';

  const bloc = blocs[idx];
  const map = {};
  (bloc.seances||[]).forEach(s => (s.exercices||[]).forEach(ex => {
    const g = ex.groupe_musculaire || 'Non défini';
    map[g] = (map[g]||0) + (parseInt(ex.series)||0);
  }));
  const total = Object.values(map).reduce((a,b)=>a+b,0);
  if (!total && !multiBloc) { cont.innerHTML = ''; return; }

  const sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  cont.innerHTML = `
    <div class="table-card" style="padding:16px;margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);">Répartition des séries</div>
        ${pills ? `<div style="display:flex;gap:4px;">${pills}</div>` : ''}
      </div>
      ${total ? sorted.map(([g,n])=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <div style="width:150px;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(g)}</div>
          <div style="flex:1;height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;">
            <div style="height:100%;width:${Math.round(n/total*100)}%;background:var(--accent);border-radius:4px;"></div>

function onDragEndExo(){
  dragExoSource = null;

function onDropExo(e, bi, si, ei){
  e.preventDefault();
  const src = dragExoSource;
  dragExoSource = null;
  if (!src || src.bi !== bi || src.si !== si || src.ei === ei) { renderBlocsTemplate(); return; }
  const arr = tplEnEdition.blocs[bi].seances[si].exercices;

  arr.splice(cible, 0, moved);
  renderBlocsTemplate();
}

async function assignerTemplateAuClient(templateId, clientId){
  if (exercicesData === null) exercicesData = await chargerExercices();
  if (templatesData === null) templatesData = await chargerTemplates();
  const tpl = templatesData.find(t => t.id === templateId);
  const blocsArbo = await chargerTemplateArbo(templateId);

  // Un seul programme actif à la fois pour ce client — on désactive les précédents plutôt que les supprimer
  // (garde l'historique de logs des anciens programmes accessible).
  await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true`, {
    method: 'PATCH', headers: supaHeaders(), body: JSON.stringify({ actif: false })
  });

  const resCp = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes`, {
    method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }),
    body: JSON.stringify({ client_id: clientId, nom: tpl.nom, actif: true })
  });
  if (!resCp.ok) throw new Error('supabase_' + resCp.status);
  const cp = (await resCp.json())[0];

  const blocsPayload = blocsArbo.map((b, bi) => ({ client_programme_id: cp.id, type: b.type || null, nombre_semaines: b.nombre_semaines || null, ordre: bi }));
  const resBlocs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(blocsPayload) });
  if (!resBlocs.ok) throw new Error('supabase_' + resBlocs.status);
  const blocsSaved = await resBlocs.json();
  const blocIdByOrdre = {};
  blocsSaved.forEach(b => { blocIdByOrdre[b.ordre] = b.id; });

  const seancesPayload = [];
  blocsArbo.forEach((b, bi) => {
    (b.programme_seances||[]).forEach((s, si) => {
      seancesPayload.push({ bloc_id: blocIdByOrdre[bi], titre: s.titre, ordre: si });
    });
  });
  let seancesSaved = [];
  if (seancesPayload.length) {
    const resSeances = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(seancesPayload) });
    if (!resSeances.ok) throw new Error('supabase_' + resSeances.status);
    seancesSaved = await resSeances.json();
  }
  const seanceIdByBlocOrdre = {};
  seancesSaved.forEach(s => { seanceIdByBlocOrdre[s.bloc_id + '|' + s.ordre] = s.id; });

  const exercicesPayload = [];
  blocsArbo.forEach((b, bi) => {
    const blocId = blocIdByOrdre[bi];
    (b.programme_seances||[]).forEach((s, si) => {
      const seanceId = seanceIdByBlocOrdre[blocId + '|' + si];
      (s.programme_seance_exercices||[]).forEach((ex, ei) => {
        const source = exercicesData.find(e => e.id === ex.exercice_id);
        exercicesPayload.push({
          seance_id: seanceId, exercice_id: ex.exercice_id, nom: source ? source.nom : '(exercice supprimé)',
          ordre: ei, series: ex.series, reps: ex.reps, repos: ex.repos, tempo: ex.tempo, rir: ex.rir, notes: ex.notes || null,
        });
      });
    });
  });
  if (exercicesPayload.length) {
    const resExo = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(exercicesPayload) });
    if (!resExo.ok) throw new Error('supabase_' + resExo.status);
  }
  return cp;
}

async function toggleChimie(id, actif){
  try { await apiAs('definirChimieActif', id, { actif: !actif }); await rafraichir(); if (state.nav==='clients') renderTable(); }
  catch(e) { alert('Erreur : ' + e.message); }
}
async function toggleVerrou(id, verrouille){
  try { await apiAs(verrouille ? 'deverrouilerAccesClient' : 'verrouilerAccesClient', id); await rafraichir(); if (state.nav==='clients') renderTable(); }
  catch(e) { alert('Erreur : ' + e.message); }
}
// Bascule client_profils.supabase_only à true — dernière étape de la migration : la
// connexion du client passera entièrement par Supabase (plus GAS). Upsert car un client
// tout juste migré peut ne pas encore avoir de ligne client_profils.
async function togglerSupabaseOnly(id){
  if (!confirm('Passer ce client en Supabase only ? Sa connexion utilisera désormais uniquement Supabase (plus GAS).')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=representation,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: id, supabase_only: true })
    });
    if (!res.ok) throw new Error('supabase_' + res.status);
    await rafraichir();
    if (state.nav==='clients') renderTable();
    if (state.nav==='fiche-client' && state.selected===id) openPanel(id);
  } catch(e) { alert('Erreur : ' + e.message); }
}

let panelTab = 'apercu';
let panelNotes = null; // null = pas encore chargées
let panelFiche = null;
async function openPanel(id){
  state.selected = id;
  ficheTab = 'profil';
  ficheData = { loaded:false, profil:null, tous_programmes:[], programme:null, tous_dietes:[], diete:null, progression:null, notes:null, xpData:null };
  state.nav = 'fiche-client';
  renderSidebar();
  renderMain();
  const c = data.clients.find(x=>x.id===id);
  if (!c) return;
  try {
    const [profil, tous_programmes, tous_dietes, progression, notes, xpData] = await Promise.all([
      chargerFiche(id).catch(()=>({})),
      chargerTousProgrammes(id).catch(()=>[]),
      chargerTousDietes(id).catch(()=>[]),
      chargerProgression(id).catch(()=>[]),
      chargerNotes(id).catch(()=>[]),
      chargerClientProgressionXP(id).catch(()=>null),
    ]);
    const programme = tous_programmes.find(p=>p.actif) || null;
    const diete = tous_dietes.find(d=>d.actif) || null;
    ficheData = { loaded:true, profil, tous_programmes, programme, tous_dietes, diete, progression, notes, xpData };
    if (state.nav==='fiche-client' && state.selected===id) renderMain();
  } catch(e) {
    ficheData = { loaded:true, profil:{}, tous_programmes:[], programme:null, tous_dietes:[], diete:null, progression:[], notes:[], xpData:null, error:e.message };
    if (state.nav==='fiche-client' && state.selected===id) renderMain();
  }
}

async function chargerProgrammeActif(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true&order=created_at.desc&limit=1`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const rows = await res.json();
  if (!rows.length) return null;
  const cp = rows[0];
  const resArbo = await fetch(
    `${SUPABASE_URL}/rest/v1/client_programme_blocs?client_programme_id=eq.${cp.id}&order=ordre.asc` +
    `&select=*,client_programme_seances(*,client_programme_exercices(*))` +
    `&client_programme_seances.order=ordre.asc&client_programme_seances.client_programme_exercices.order=ordre.asc`,
    { headers: supaHeaders() }
  );
  const blocs = resArbo.ok ? await resArbo.json() : [];
  const exIds = [];
  blocs.forEach(b => (b.client_programme_seances||[]).forEach(s => (s.client_programme_exercices||[]).forEach(ex => exIds.push(ex.id))));
  let logs = {};
  if (exIds.length) {
    const resLogs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exIds.join(',')})&order=semaine.asc,numero_serie.asc`, { headers: supaHeaders() });
    if (resLogs.ok) (await resLogs.json()).forEach(l => { logs[l.client_programme_exercice_id+'|'+l.semaine+'|'+l.numero_serie] = l; });
  }
  return Object.assign({}, cp, { blocs, logs });
}

// ── Mensuration charts — helpers partagés ────────────────────────────────────
window._mensCharts = {};
const MENS_COLS   = ['fessiers','cuisses','mollets','poitrine','epaules','bras'];
const MENS_COLORS = ['#f59e0b','#a78bfa','#3ecf8e','#f97316','#4f8ef7','#e05c5c'];
const MENS_LABELS = ['Fessiers','Cuisses','Mollets','Poitrine','Épaules','Bras'];

function _buildMensChart(id, rows, keys, colors, labels, unit) {
  const W=560,H=180,PL=44,PR=14,PT=16,PB=34,cw=W-PL-PR,ch=H-PT-PB;
  const allVals=keys.flatMap(k=>rows.map(r=>parseFloat(r[k])).filter(v=>!isNaN(v)&&v>0));
  if(allVals.length<2) return '';
  const rng=Math.max(...allVals)-Math.min(...allVals), pad=rng<2?1:Math.ceil(rng*0.1);
  const yMin=Math.floor(Math.min(...allVals)-pad), yMax=Math.ceil(Math.max(...allVals)+pad);
  const n=rows.length;
  const xS=i=>+(PL+(i/(n-1||1))*cw).toFixed(2);
  const yS=v=>+(PT+ch-((v-yMin)/((yMax-yMin)||1))*ch).toFixed(2);
  const xs=rows.map((_,i)=>xS(i));
  window._mensCharts[id]={rows,keys,colors,labels,xs,W,H,PL,PT,ch,unit:unit||''};
  const defs=keys.map((k,ki)=>`<linearGradient id="${id}_g${ki}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${colors[ki]}" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="${colors[ki]}" stop-opacity="0"/>
  </linearGradient>`).join('');
  const yGrid=[0.25,0.5,0.75].map(f=>{const v=yMin+f*(yMax-yMin);
    return `<line x1="${PL}" y1="${yS(v)}" x2="${PL+cw}" y2="${yS(v)}" stroke="var(--hairline)" stroke-width="0.5" stroke-dasharray="3 3"/>
      <text x="${PL-5}" y="${+(yS(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-faint)">${Math.round(v)}</text>`;
  }).join('');
  const maxL=Math.min(6,n), stepL=Math.floor((n-1)/(maxL-1||1));
  const xLabels=Array.from({length:maxL},(_,i)=>{
    const idx=i===maxL-1?n-1:i*stepL, d=(rows[idx].date||'').split('-');
    return `<text x="${xs[idx]}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--text-faint)">${d.length===3?d[2]+'/'+d[1]:''}</text>`;
  }).join('');
  const areas=keys.map((k,ki)=>{
    const pts=rows.map((r,i)=>{const v=parseFloat(r[k]);return isNaN(v)||v<=0?null:[xs[i],yS(v)];}).filter(Boolean);
    if(pts.length<2) return '';
    return `<path d="${pts.map((p,i)=>(i===0?'M':'L')+p[0]+','+p[1]).join(' ')} L${pts[pts.length-1][0]},${PT+ch} L${pts[0][0]},${PT+ch} Z" fill="url(#${id}_g${ki})"/>`;
  }).join('');
  const lines=keys.map((k,ki)=>{
    const pts=rows.map((r,i)=>{const v=parseFloat(r[k]);return isNaN(v)||v<=0?null:xs[i]+','+yS(v);}).filter(Boolean);
    return pts.length>=2?`<polyline points="${pts.join(' ')}" fill="none" stroke="${colors[ki]}" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  }).join('');
  const dots=keys.map((k,ki)=>rows.map((r,i)=>{const v=parseFloat(r[k]);
    return isNaN(v)||v<=0?'':`<circle id="${id}_d${ki}_${i}" cx="${xs[i]}" cy="${yS(v)}" r="1.8" fill="${colors[ki]}" stroke="var(--surface-1)" stroke-width="1.2"/>`;
  }).join('')).join('');
  const axes=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+ch}" stroke="var(--hairline)" stroke-width="1"/>
    <line x1="${PL}" y1="${PT+ch}" x2="${PL+cw}" y2="${PT+ch}" stroke="var(--hairline)" stroke-width="1"/>`;
  const vline=`<line id="${id}_vl" x1="${xs[0]}" y1="${PT}" x2="${xs[0]}" y2="${PT+ch}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 2" opacity="0.5" display="none"/>`;
  const ov=`<rect x="${PL}" y="${PT}" width="${cw}" height="${ch}" fill="transparent" onmousemove="_mensHover(event,'${id}')" onmouseleave="_mensHoverOut('${id}')"/>`;
  const tip=`<div id="${id}_tip" style="display:none;position:absolute;top:10px;left:10px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text);pointer-events:none;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.2);white-space:nowrap;"></div>`;
  const legend=`<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);margin-top:8px;margin-bottom:4px;">
    ${keys.map((k,i)=>`<span><span style="color:${colors[i]};margin-right:3px;">●</span>${labels[i]}</span>`).join('')}
  </div>`;
  return `<div style="position:relative;">${tip}<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${axes}${yGrid}${xLabels}${areas}${lines}${dots}${vline}${ov}</svg></div>${legend}`;
}

function _mensHover(evt, cid) {
  const d=window._mensCharts[cid]; if(!d) return;
  const svg=evt.currentTarget.closest('svg');
  const rect=svg.getBoundingClientRect();
  const mx=(evt.clientX-rect.left)*(d.W/rect.width);
  let ni=0, minDist=Infinity;
  d.xs.forEach((x,i)=>{const dist=Math.abs(x-mx);if(dist<minDist){minDist=dist;ni=i;}});
  const vl=document.getElementById(cid+'_vl');
  if(vl){vl.setAttribute('x1',d.xs[ni]);vl.setAttribute('x2',d.xs[ni]);vl.removeAttribute('display');}
  const row=d.rows[ni];
  const dateStr=(row.date||'').split('-').reverse().join('/');
  const vals=d.keys.map((k,ki)=>{
    const v=parseFloat(row[k]); if(isNaN(v)||v<=0) return '';
    return `<div style="margin-top:3px;"><span style="color:${d.colors[ki]};margin-right:4px;">●</span>${d.labels[ki]} : <strong>${v}</strong>${d.unit}</div>`;
  }).filter(Boolean).join('');
  const tip=document.getElementById(cid+'_tip');
  if(tip){
    tip.innerHTML=`<div style="font-size:10px;font-weight:700;color:var(--text-faint);margin-bottom:3px;">${dateStr}</div>${vals}`;
    const xRatio=rect.width/d.W;
    let lx=d.xs[ni]*xRatio+14;
    if(lx+160>rect.width) lx=d.xs[ni]*xRatio-170;
    tip.style.left=lx+'px'; tip.style.display='block';
  }
}

function _mensHoverOut(cid) {
  const vl=document.getElementById(cid+'_vl'); if(vl) vl.setAttribute('display','none');
  const tip=document.getElementById(cid+'_tip'); if(tip) tip.style.display='none';
}

// selKeys : Set des mensurations actives — multi-sélection, chaque pill toggle son
// appartenance au Set (au moins une reste sélectionnée) pour superposer plusieurs
// courbes sur le même graphique (_buildMensChart accepte déjà keys/colors/labels en tableau).
function _renderMens2Section(rows, idBase, selKeys, setterFn) {
  if(!rows||rows.length<2) return '';
  const actives=MENS_COLS.filter(k=>selKeys.has(k));
  if(!actives.length) return '';
  const pills=MENS_COLS.map((k,i)=>`<button onclick="${setterFn}('${k}')"
    style="padding:3px 11px;border-radius:99px;border:1px solid ${selKeys.has(k)?MENS_COLORS[i]:'var(--hairline)'};background:${selKeys.has(k)?MENS_COLORS[i]+'22':'transparent'};color:${selKeys.has(k)?MENS_COLORS[i]:'var(--text-faint)'};font-size:11px;font-weight:${selKeys.has(k)?'700':'400'};cursor:pointer;transition:all .15s;">${MENS_LABELS[i]}</button>`).join('');
  const colors=actives.map(k=>MENS_COLORS[MENS_COLS.indexOf(k)]);
  const labels=actives.map(k=>MENS_LABELS[MENS_COLS.indexOf(k)]);
  // _buildMensChart renvoie '' silencieusement si la sélection active n'a pas assez de
  // valeurs numériques (même si d'autres colonnes en ont) — sans ce filet la carte reste vide.
  const chart=_buildMensChart(idBase+'_'+actives.join('_'), rows, actives, colors, labels, ' cm')
    || `<div style="font-size:13px;color:var(--text-faint);text-align:center;padding:20px;">Pas assez de données pour ${actives.map(k=>MENS_LABELS[MENS_COLS.indexOf(k)]).join('/')}.</div>`;
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${pills}</div>${chart}`;
}

function _setFicheMensChart2(key) {
  if(_ficheMensChart2Keys.has(key)){ if(_ficheMensChart2Keys.size>1) _ficheMensChart2Keys.delete(key); }
  else _ficheMensChart2Keys.add(key);
  const el=document.getElementById('ficheMensChart2');
  if(el&&_ficheMensurations) el.innerHTML=_renderMens2Section(_ficheMensurations,'fiche_c2',_ficheMensChart2Keys,'_setFicheMensChart2');
}

function _setPageMensChart2(key) {
  if(_pageMensChart2Keys.has(key)){ if(_pageMensChart2Keys.size>1) _pageMensChart2Keys.delete(key); }
  else _pageMensChart2Keys.add(key);
  const el=document.getElementById('pageMensChart2');
  if(el&&_pageMensurationsRows.length) el.innerHTML=_renderMens2Section(_pageMensurationsRows,'page_c2',_pageMensChart2Keys,'_setPageMensChart2');
}

function renderFicheMensurationsTab(c){
  if (!c) return '';
  if (_ficheMensurationsClientId !== c.id) {
    _ficheMensurationsClientId = c.id;
    _ficheMensurations = null;
    _ficheMensurationsLoading = false;
  }
  if (_ficheMensurations === null) {
    if (!_ficheMensurationsLoading) {
      _ficheMensurationsLoading = true;
      fetch(`${SUPABASE_URL}/rest/v1/mensurations?client_id=eq.${encodeURIComponent(c.id)}&order=date.asc`, { headers: supaHeaders() })
        .then(r => r.json())
        .then(rows => {
          _ficheMensurations = Array.isArray(rows) ? rows : [];
          _ficheMensurationsLoading = false;
          const el = document.getElementById('ficheTabContent');
          if (el && ficheTab === 'mensurations') el.innerHTML = renderFicheMensurationsTab(c);
        })
        .catch(() => { _ficheMensurations = []; _ficheMensurationsLoading = false; });
    }
    return `<div style="padding:30px;text-align:center;color:var(--text-faint);">Chargement…</div>`;
  }
  const cm = (v) => v!=null ? v+' cm' : '—';
  const kg = (v) => v!=null ? v+' kg' : '—';

  if (!_ficheMensurations.length) {
    return `<div class="fiche-card">
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
        <button class="btn primary" onclick="ouvrirModalMensuration('${c.id}',null)">+ Ajouter</button>
      </div>
      <p style="color:var(--text-faint);">Aucune mensuration enregistrée dans Supabase.</p>
    </div>`;
  }

  const rows = _ficheMensurations;
  const chart1 = rows.length>=2 ? _buildMensChart('fiche_c1', rows, ['poids','mesure'], ['var(--accent)','#4caf50'], ['Poids (kg)','Tour de taille (cm)'], '') : '';
  const hasAutres = rows.some(r=>MENS_COLS.some(k=>parseFloat(r[k])>0));
  const chart2Section = hasAutres ? _renderMens2Section(rows,'fiche_c2',_ficheMensChart2Keys,'_setFicheMensChart2') : '';

  const tableRows = [...rows].reverse().map(r => {
    const dateFr = (r.date||'').split('-').reverse().join('/');
    return `<tr>
      <td class="mono">${esc(dateFr)}</td>
      <td>${esc(r.phase||'—')}</td>
      <td>${kg(r.poids)}</td>
      <td>${cm(r.mesure)}</td>
      <td>${cm(r.fessiers)}</td>
      <td>${cm(r.cuisses)}</td>
      <td>${cm(r.mollets)}</td>
      <td>${cm(r.poitrine)}</td>
      <td>${cm(r.epaules)}</td>
      <td>${cm(r.bras)}</td>
      <td style="white-space:nowrap;">
        <button class="btn" style="font-size:11px;padding:3px 8px;" onclick="ouvrirModalMensuration('${c.id}',${r.id})">Éditer</button>
        <button class="btn" style="font-size:11px;padding:3px 8px;color:var(--critical);margin-left:4px;" onclick="supprimerMensuration(${r.id},'${c.id}')">×</button>
      </td>
    </tr>`;
  }).join('');

  return `<div class="fiche-card">
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      <button class="btn primary" onclick="ouvrirModalMensuration('${c.id}',null)">+ Ajouter</button>
    </div>
    ${chart1 ? `<h4 style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin:0 0 10px;">Poids &amp; Tour de taille</h4>${chart1}` : ''}
    ${chart2Section ? `<h4 style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin:20px 0 10px;">Autres mensurations</h4><div id="ficheMensChart2">${chart2Section}</div>` : ''}
    <div class="table-scroll" style="margin-top:20px;"><table class="alim-table">
      <thead><tr><th>Date</th><th>Phase</th><th>Poids</th><th>Tour taille</th><th>Fessiers</th><th>Cuisses</th><th>Mollets</th><th>Poitrine</th><th>Épaules</th><th>Bras</th><th></th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table></div>
  </div>`;
}

function renderFicheProgressionTab(){
  const progression = Array.isArray(ficheData.progression) ? ficheData.progression : [];
  const poidsPts = progression.map(s=>parseFloat(s.poids_moyen)).filter(v=>!isNaN(v));
  const xp = ficheData.xpData || null;

  const xpCard = xp ? (() => {
    const sz = xp.tier==='legendaire'?56:xp.tier==='diamant'?50:xp.tier==='platine'?46:40;
    const badgeSvg = typeof getBadgeSVG==='function' ? getBadgeSVG(xp.tier, sz, 'fcp') : '';
    const titrePill = (xp.titreDef && typeof renderTitrePill==='function') ? renderTitrePill(xp.titreDef, false) : '';
    const gauge = (pct, color, label, val, tot) => {
      const r=36,cx=45,cy=50;
      const totalLen=Math.PI*r;
      const dash=totalLen*(1-Math.min(pct,100)/100);
      return `<div style="text-align:center;flex:1;">
        <svg viewBox="0 0 90 58" width="90" height="58">
          <path d="M 9 50 A ${r} ${r} 0 0 1 81 50" fill="none" stroke="#2a3550" stroke-width="3" stroke-linecap="round"/>
          <path d="M 9 50 A ${r} ${r} 0 0 1 81 50" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="${totalLen.toFixed(1)}" stroke-dashoffset="${dash.toFixed(1)}"/>
          <text x="${cx}" y="${cy-10}" font-size="11" font-weight="bold" fill="#f0f2ff" text-anchor="middle">${pct}%</text>
        </svg>
        <div style="font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin-top:-4px;">${label}</div>
        <div style="font-size:13px;font-weight:700;color:${color};margin-top:2px;">${val}${tot?` <span style="font-size:10px;color:var(--text-faint);">/ ${tot}</span>`:''}
        </div>
      </div>`;
    };
    return `<div class="fiche-card" style="margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
        <div style="flex-shrink:0;">${badgeSvg}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-size:15px;font-weight:700;color:var(--text);">Niveau ${xp.niveau}</span>
            <span style="font-size:11px;color:${xp.tc.c1};font-weight:600;background:${xp.tc.c2}33;border:1px solid ${xp.tc.c1}55;border-radius:6px;padding:2px 8px;">${xp.tier.charAt(0).toUpperCase()+xp.tier.slice(1)}</span>
            ${titrePill}
          </div>
          <div style="font-size:12px;color:var(--text-faint);margin-top:4px;">${(xp.xpTotal||0).toLocaleString('fr')} XP · ${xp.niveauMaxAtteint ? '👑 niveau max atteint' : 'encore ' + (xp.xpManquant||0).toLocaleString('fr') + ' XP → niv. ' + (xp.niveau+1)}</div>
          <div style="height:5px;background:#1e2235;border-radius:3px;overflow:hidden;margin-top:7px;">
            <div style="height:5px;border-radius:3px;width:${xp.pct}%;background:${xp.tc.bar||xp.tc.c1};transition:width .6s ease;"></div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;border-top:1px solid var(--hairline);padding-top:14px;">
        ${gauge(xp.pctSeances,'#3ecf8e','Séances',xp.seancesValidees,xp.seancesAttendues)}
        ${gauge(xp.pctBilans,'#a78bfa','Bilans',xp.bilansValidies,xp.bilansAttendus)}
        ${gauge(xp.assiduiteGlobale,'#f59e0b','Assiduité',xp.assiduiteGlobale+'%','')}
      </div>
      <div style="display:flex;gap:8px;align-items:center;border-top:1px solid var(--hairline);padding-top:14px;margin-top:14px;">
        <input id="xpAjoutInput" type="number" step="1" placeholder="ex: 20 ou -10" style="flex:1;padding:8px 10px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;color:var(--text);font-size:13px;">
        <button class="btn" id="xpAjoutBtn" onclick="ajouterXpClient('${esc(ficheData.profil.client_id || '')}')">+ Ajouter XP</button>
      </div>
    </div>`;
  })() : (ficheData.loaded ? `<div class="fiche-card" style="margin-bottom:12px;"><p style="color:var(--text-faint);font-size:12px;">Pas encore de données XP (aucun bilan validé).</p></div>` : `<div class="fiche-card" style="margin-bottom:12px;"><p style="color:var(--text-faint);font-size:12px;">Chargement XP…</p></div>`);

  return `
    ${xpCard}
    <div class="fiche-card">
      <h3>Progression poids (bilans)</h3>
      ${poidsPts.length >= 2 ? `
        ${progressionChart(poidsPts, 'var(--accent)')}
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-top:6px;">
          <span>${poidsPts[0].toFixed(1)} kg</span>
          <span>${(poidsPts[poidsPts.length-1]-poidsPts[0]>=0?'+':'')+(poidsPts[poidsPts.length-1]-poidsPts[0]).toFixed(1)} kg</span>
          <span>${poidsPts[poidsPts.length-1].toFixed(1)} kg</span>
        </div>` : `<div class="fiche-prog-empty">Pas encore de données (min. 2 bilans).</div>`}
      ${progression.length ? `
        <div style="margin-top:14px;">
          ${progression.slice().reverse().slice(0,8).map(s=>`
            <div class="fiche-hist-row">
              <span style="color:var(--text-muted);">Semaine ${esc(s.semaine||'?')}</span>
              <span>${s.poids_moyen ? parseFloat(s.poids_moyen).toFixed(1)+' kg' : '—'}${s.jours_diete_ok!=null?' · diète '+s.jours_diete_ok+'/7':''}</span>
            </div>`).join('')}
        </div>` : ''}
    </div>`;
}

const BLOC_LABELS_COACH = { metabolique:'Métabolique', mecanique:'Mécanique', force:'Force' };
let ficheSemaine = 1;

function renderFicheProgDetail(prog){
  const blocs = prog.blocs || [];
  const logs = prog.logs || {};
  const totalSemaines = blocs.reduce((s,b)=>s+(b.nombre_semaines||1),0)||1;
  const nbSeances = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).length,0);
  const nbExo = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).reduce((s2,se)=>s2+(se.client_programme_exercices||[]).length,0),0);
  return `
    <div class="fiche-prog">
      <div class="nom">${esc(prog.nom||'Programme sans nom')}</div>
      <div class="meta">${nbSeances} séance${nbSeances>1?'s':''} · ${nbExo} exercice${nbExo>1?'s':''} · assigné le ${prog.created_at?new Date(prog.created_at).toLocaleDateString('fr-FR'):'—'}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin:12px 0 10px;">
      <button class="btn" style="padding:5px 11px;" onclick="ficheSemaineChanger(-1)">‹</button>
      <span style="font-size:13px;font-weight:700;">Semaine ${ficheSemaine}${totalSemaines>1?' / '+totalSemaines:''}</span>
      <button class="btn" style="padding:5px 11px;" onclick="ficheSemaineChanger(1)">›</button>
    </div>
    ${blocs.map(b=>`
      ${b.type?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:10px 0 4px;">${esc(BLOC_LABELS_COACH[b.type]||b.type)}${b.nombre_semaines?' · '+b.nombre_semaines+' sem.':''}</div>`:''}
      ${(b.client_programme_seances||[]).map(s=>`
        <div style="background:var(--surface-2);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;">
          <div style="padding:9px 12px;font-weight:700;font-size:13px;border-bottom:1px solid var(--hairline);">${esc(s.titre)}</div>
          ${(s.client_programme_exercices||[]).map(ex=>{
            const nbSeries = ex.series||1;
            let seriesHtml='';
            for(let sr=1;sr<=nbSeries;sr++){
              const l=logs[ex.id+'|'+ficheSemaine+'|'+sr]||{};
              const hasLog = l.charge!=null||l.reps!=null;
              seriesHtml+=`<div style="display:flex;gap:8px;align-items:center;font-size:12px;padding:2px 0;">
                <span style="color:var(--text-faint);width:16px;">#${sr}</span>
                <span style="${hasLog?'color:var(--text);font-weight:600;':'color:var(--text-faint);'}">
                  ${hasLog?(l.charge!=null?l.charge+'kg ':'')+''+(l.reps!=null?l.reps+' reps ':'')+''+(l.rir?'RIR '+l.rir:''):'—'}
                </span>
              </div>`;
            }
            return `<div style="padding:8px 12px;border-top:1px solid var(--hairline);">
              <div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">${esc(ex.nom)}</div>
              <div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">Cible : ${ex.series||'—'}×${esc(ex.reps||'—')}${ex.repos?' · repos '+esc(ex.repos):''}${ex.rir?' · RIR '+esc(ex.rir):''}</div>
              ${seriesHtml}
              ${(()=>{const cl=logs[ex.id+'|'+ficheSemaine+'|1'];return cl&&cl.commentaire?`<div style="font-size:11px;color:var(--text-muted);margin-top:4px;font-style:italic;">${esc(cl.commentaire)}</div>`:'';})()}
            </div>`;
          }).join('')||`<div style="padding:8px 12px;font-size:12px;color:var(--text-faint);">Aucun exercice.</div>`}
        </div>`).join('')}
    `).join('')||`<div class="fiche-prog-empty">Aucune séance dans ce programme.</div>`}`;
}

function ficheSemaineChanger(delta){
  ficheSemaine = Math.max(1, ficheSemaine + delta);
  if (state.nav==='fiche-client') renderMain();
}

// ── Programmes assignés — actions ────────────────────────────────────
async function supprimerProgrammeClient(progId, clientId){
  if (!confirm('Supprimer ce programme et tous ses logs ?\n\nCette action est irréversible.')) return;
  try {
    const resArbo = await fetch(
      `${SUPABASE_URL}/rest/v1/client_programme_blocs?client_programme_id=eq.${progId}` +
      `&select=id,client_programme_seances(id,client_programme_exercices(id))`,
      { headers: supaHeaders() }
    );
    const blocs = resArbo.ok ? await resArbo.json() : [];
    const exoIds    = blocs.flatMap(b=>(b.client_programme_seances||[]).flatMap(s=>(s.client_programme_exercices||[]).map(ex=>ex.id)));
    const seanceIds = blocs.flatMap(b=>(b.client_programme_seances||[]).map(s=>s.id));
    const blocIds   = blocs.map(b=>b.id);
    if (exoIds.length) {
      await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exoIds.join(',')})`, { method:'DELETE', headers:supaHeaders() });
      await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices?id=in.(${exoIds.join(',')})`, { method:'DELETE', headers:supaHeaders() });
    }
    if (seanceIds.length) await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances?id=in.(${seanceIds.join(',')})`, { method:'DELETE', headers:supaHeaders() });
    if (blocIds.length)   await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs?id=in.(${blocIds.join(',')})`,   { method:'DELETE', headers:supaHeaders() });
    await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${progId}`, { method:'DELETE', headers:supaHeaders() });
    ficheData.tous_programmes = await chargerTousProgrammes(clientId);
    ficheData.programme = ficheData.tous_programmes.find(p=>p.actif) || null;
    setFicheTab('programmes');
  } catch(e){ alert('Erreur : ' + e.message); }
}

async function toggleProgrammeActif(progId, isActif, clientId){
  try {
    if (!isActif) {
      await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true`, {
        method:'PATCH', headers:supaHeaders(), body:JSON.stringify({ actif:false })

    await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${progId}`, {
      method:'PATCH', headers:supaHeaders(), body:JSON.stringify({ actif:!isActif })
    });

    ficheData.programme = ficheData.tous_programmes.find(p=>p.actif) || null;
    setFicheTab('programmes');
  } catch(e){ alert('Erreur : ' + e.message); }
}

// ── Logs d'un programme assigné ──────────────────────────────────────
function ouvrirLogsProgramme(progId){
  state.nav = 'prog-logs';
  state.progLogsId = progId;
  progLogsData = { loaded:false, programme:null, blocs:[], logs:{} };
  progLogsSemaine = 1;
  _progLogsView = 'semaine';
  renderSidebar();
  renderMain();
  const exLoad = exercicesData === null ? chargerExercices().then(d=>{ exercicesData=d; }).catch(()=>{}) : Promise.resolve();
  Promise.all([chargerProgrammeById(progId), exLoad]).then(([prog]) => {
    progLogsData = { loaded:true, programme:prog, blocs:prog?prog.blocs:[], logs:prog?prog.logs:{} };
    if (state.nav==='prog-logs' && state.progLogsId===progId) renderMain();
  }).catch(e => {
    progLogsData = { loaded:true, programme:null, blocs:[], logs:{}, error:e.message };
    if (state.nav==='prog-logs') renderMain();
  });
}

function progLogsSemaineChanger(delta){
  progLogsSemaine = Math.max(1, progLogsSemaine + delta);
  renderMain();
}

function renderProgLogsPage(el){
  const backClientId = state.selected;
  if (!progLogsData.loaded){
    el.innerHTML = `
      <button class="fiche-back" onclick="setNav('fiche-client')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        Retour à la fiche client
      </button>
      <div style="display:flex;align-items:center;justify-content:center;padding:80px;"><div class="spin"></div></div>`;
    return;
  }
  if (progLogsData.error || !progLogsData.programme){
    el.innerHTML = `<div class="empty-panel"><strong>Erreur</strong>${esc(progLogsData.error||'Programme introuvable')}</div>`;
    return;
  }
  const prog = progLogsData.programme;
  const blocs = progLogsData.blocs || [];
  const logs = progLogsData.logs || {};
  const totalSemaines = blocs.reduce((s,b)=>s+(b.nombre_semaines||1),0)||1;
  const nbSeances = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).length,0);

  // Trouver toutes les semaines qui ont au moins un log
  const semainesAvecLogs = new Set();
  Object.keys(logs).forEach(k => { const parts=k.split('|'); if(parts[1]) semainesAvecLogs.add(parseInt(parts[1])); });

  // Map exId → bloc index (pour offset chronologique)
  const exToBloc = {};
  blocs.forEach((b, bi) => {
    (b.client_programme_seances||[]).forEach(s => {
      (s.client_programme_exercices||[]).forEach(ex => { exToBloc[ex.id] = bi; });
    });
  });
  // Semaines réelles par bloc : nombre_semaines ou max des logs
  const blocMaxSem = blocs.map(b => b.nombre_semaines || 0);
  Object.entries(logs).forEach(([key]) => {
    const parts = key.split('|');
    const exId = parts[0], sem = parseInt(parts[1]);
    const bi = exToBloc[exId];
    if (bi !== undefined && sem > (blocMaxSem[bi]||0)) blocMaxSem[bi] = sem;
  });
  // Offset cumulatif par bloc (bloc 0 = 0, bloc 1 = sem bloc 0, etc.)
  const blocOffset = blocs.map((_, bi) => { let off=0; for(let i=0;i<bi;i++) off+=blocMaxSem[i]; return off; });

  // Build progression data cross-blocs avec semaines globales
  const progByEx = {};
  Object.entries(logs).forEach(([key, l]) => {
    const parts = key.split('|');
    const exId = parts[0], sem = parseInt(parts[1]);
    const charge = parseFloat(l.charge);
    if (!isNaN(charge) && charge > 0) {
      const bi = exToBloc[exId] ?? 0;
      const globalSem = sem + (blocOffset[bi] || 0);
      if (!progByEx[exId]) progByEx[exId] = {};
      if (!progByEx[exId][globalSem] || charge > progByEx[exId][globalSem]) progByEx[exId][globalSem] = charge;
    }
  });

  el.innerHTML = `
    <button class="fiche-back" onclick="retourFicheClient()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
      Retour à la fiche client
    </button>

    <div class="page-head" style="margin-bottom:16px;">
      <div>
        <div class="eyebrow">Logs du programme</div>
        <h1>${esc(prog.nom)}</h1>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        ${prog.actif ? '<span class="chip ok"><span class="dot"></span>Actif</span>' : '<span class="chip off">Inactif</span>'}
        <button class="btn" style="font-size:11px;padding:5px 10px;" onclick="ouvrirEditeurProgrammeClient(${prog.id})">Éditer</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
      <button class="btn ${_progLogsView==='semaine'?'primary':''}" style="font-size:12px;padding:5px 12px;" onclick="_progLogsView='semaine';renderMain()">Vue semaine</button>
      <button class="btn ${_progLogsView==='progression'?'primary':''}" style="font-size:12px;padding:5px 12px;" onclick="_progLogsView='progression';renderMain()">Progression</button>
      ${_progLogsView==='semaine' ? `
        <div style="display:flex;align-items:center;gap:8px;margin-left:8px;">
          <button class="btn" style="padding:5px 12px;" onclick="progLogsSemaineChanger(-1)">‹</button>
          <span style="font-size:14px;font-weight:700;min-width:120px;text-align:center;">Semaine ${progLogsSemaine} / ${totalSemaines}</span>
          <button class="btn" style="padding:5px 12px;" onclick="progLogsSemaineChanger(1)">›</button>
          ${semainesAvecLogs.size ? `<span style="font-size:11.5px;color:var(--text-faint);">${semainesAvecLogs.size} sem. avec données</span>` : ''}
        </div>` : ''}
    </div>

    ${_progLogsView === 'progression' ? (() => {
      const allEx = blocs.flatMap(b=>(b.client_programme_seances||[]).flatMap(s=>(s.client_programme_exercices||[])));
      const withData = allEx.filter(ex => progByEx[ex.id] && Object.keys(progByEx[ex.id]).length >= 1);
      if (!withData.length) return `<div class="empty-panel"><strong>Pas encore de données</strong>Le client n'a pas encore loggé de charges.</div>`;
      return withData.map(ex => {
        const exData = (exercicesData||[]).find(e=>e.id===ex.exercice_id);
        const groupe = exData ? exData.groupe_musculaire : null;
        const pts = Object.entries(progByEx[ex.id]||{}).sort((a,b)=>+a[0]-+b[0]);
        const charges = pts.map(p=>p[1]);
        const maxC = Math.max(...charges), minC = Math.min(...charges);
        const W=300, H=60, PL=6, PR=6, PT=8, PB=14;
        const iW=W-PL-PR, iH=H-PT-PB;
        const xs = pts.map((_,i)=>PL+(pts.length<2?iW/2:i/(pts.length-1)*iW));
        const ys = charges.map(c=>PT+(maxC===minC?iH/2:iH-(c-minC)/(maxC-minC)*iH));
        const polyline = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
        const first = charges[0], last = charges[charges.length-1];
        const delta = last - first;
        const deltaStr = (delta>=0?'+':'')+delta.toFixed(1)+' kg';
        const deltaColor = delta>0?'#4caf50':delta<0?'var(--critical)':'var(--text-faint)';
        return `<div style="background:var(--surface);border-radius:var(--radius);margin-bottom:12px;padding:12px 14px;box-shadow:var(--shadow-sm);">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
            <div>
              <div style="font-size:12.5px;font-weight:700;">${esc(ex.nom)}</div>
              ${groupe?`<div style="font-size:10.5px;color:var(--text-faint);">${esc(groupe)}</div>`:''}
            </div>
            <div style="text-align:right;">
              <div style="font-size:13px;font-weight:700;">${last} kg</div>
              <div style="font-size:11px;color:${deltaColor};">${deltaStr}</div>
            </div>
          </div>
          ${pts.length >= 2 ? `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
            <polyline points="${polyline}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            ${xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3" fill="var(--accent)"/>`).join('')}
            <text x="${xs[0]}" y="${H}" text-anchor="middle" style="font-size:10px;fill:var(--text-faint);">S${pts[0][0]}</text>
            <text x="${xs[xs.length-1]}" y="${H}" text-anchor="middle" style="font-size:10px;fill:var(--text-faint);">S${pts[pts.length-1][0]}</text>
          </svg>` : `<div style="font-size:12px;color:var(--text-faint);">1 donnée — sem. ${pts[0][0]} : ${charges[0]} kg</div>`}
        </div>`;
      }).join('');
    })() : blocs.map(b=>`
      ${b.type ? `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:16px 0 6px;">${esc(BLOC_LABELS_COACH[b.type]||b.type)}${b.nombre_semaines?' · '+b.nombre_semaines+' sem.':''}</div>` : ''}
      ${(b.client_programme_seances||[]).map(s=>`
        <div style="background:var(--surface);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm);">
          <div style="padding:10px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--hairline);">${esc(s.titre)}</div>
          ${(s.client_programme_exercices||[]).map(ex=>{
            const exData = (exercicesData||[]).find(e=>e.id===ex.exercice_id);
            const groupe = exData ? exData.groupe_musculaire : null;
            const nbSeries = ex.series||1;
            let setsHtml = '';
            for(let sr=1;sr<=nbSeries;sr++){
              const l = logs[ex.id+'|'+progLogsSemaine+'|'+sr]||{};
              const hasLog = l.charge!=null||l.reps!=null;
              setsHtml += `<div style="display:flex;gap:10px;align-items:center;font-size:12px;padding:3px 0;">
                <span style="color:var(--text-faint);width:18px;font-family:var(--font-mono);">#${sr}</span>
                <span style="${hasLog?'color:var(--text);font-weight:600;':'color:var(--text-faint);font-style:italic;'}">
                  ${hasLog ? [(l.charge!=null?l.charge+'kg':''), (l.reps!=null?l.reps+' reps':''), (l.rir?'RIR '+l.rir:'')].filter(Boolean).join(' · ') : '—'}
                </span>
              </div>`;
            }
            const firstLog = logs[ex.id+'|'+progLogsSemaine+'|1']||{};
            return `<div style="padding:10px 14px;border-top:1px solid var(--hairline);">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
                <div>
                  <div style="font-size:12.5px;font-weight:600;">${esc(ex.nom)}</div>
                  ${groupe?`<div style="font-size:10.5px;color:var(--text-faint);">${esc(groupe)}</div>`:''}
                </div>
                <div style="font-size:11px;color:var(--text-faint);">Cible: ${ex.series||'—'}×${esc(ex.reps||'—')}${ex.repos?' · '+esc(ex.repos):''}${ex.rir?' · RIR '+ex.rir:''}</div>
              </div>
              ${setsHtml}
              ${firstLog.commentaire ? `<div style="font-size:11px;color:var(--text-muted);margin-top:6px;font-style:italic;">"${esc(firstLog.commentaire)}"</div>` : ''}
            </div>`;
          }).join('')||`<div style="padding:10px 14px;font-size:12px;color:var(--text-faint);">Aucun exercice.</div>`}
        </div>`).join('')}
    `).join('') || `<div class="empty-panel"><strong>Programme vide</strong>Aucune séance dans ce programme.</div>`}`;
}

async function ouvrirEditeurProgrammeClient(progId){
  if (exercicesData === null) { try { exercicesData = await chargerExercices(); } catch(e) { exercicesData = []; } }
  const prog = await chargerProgrammeById(progId);
  if (!prog) { alert('Programme introuvable'); return; }
  clientProgEnEdition = {
    id: prog.id, client_id: prog.client_id, nom: prog.nom, actif: prog.actif, bloc_actif_id: prog.bloc_actif_id || null,
    blocs: (prog.blocs||[]).map(b => ({
      id: b.id, type: b.type||null, nombre_semaines: b.nombre_semaines||null,
      seances: (b.client_programme_seances||[]).map(s => ({
        id: s.id, titre: s.titre,
        exercices: (s.client_programme_exercices||[]).map(ex => {
          const exData = (exercicesData||[]).find(e=>e.id===ex.exercice_id) ||
                         (exercicesData||[]).find(e=>e.nom.toLowerCase()===(ex.nom||'').toLowerCase());
          return { id: ex.id, exercice_id: ex.exercice_id, nom: ex.nom||(exData?exData.nom:'?'), groupe_musculaire: exData?(exData.groupe_musculaire||null):null, series: ex.series, reps: ex.reps, repos: ex.repos, tempo: ex.tempo, rir: ex.rir, notes: ex.notes || '' };
        })
      }))
    }))
  };
  _origClientProgBlocIds = clientProgEnEdition.blocs.map(b=>b.id).filter(Boolean);
  _origClientProgSeanceIds = clientProgEnEdition.blocs.flatMap(b=>b.seances.map(s=>s.id)).filter(Boolean);
  _origClientProgExoIds = clientProgEnEdition.blocs.flatMap(b=>b.seances.flatMap(s=>s.exercices.map(ex=>ex.id))).filter(Boolean);
  state.nav = 'editeur-client-prog';
  renderSidebar();
  renderMain();
}

function cpDupliquerBloc(bi){
  const src = clientProgEnEdition.blocs[bi];
  const copie = JSON.parse(JSON.stringify(src));
  copie.id = null; // nouveau bloc Supabase
  copie.type = null; // le coach choisit le nouveau type
  copie.seances.forEach(s => { s.id = null; s.exercices.forEach(ex => { ex.id = null; }); });
  clientProgEnEdition.blocs.splice(bi + 1, 0, copie);
  _repartitionCpBlocIdx = bi + 1;
  renderBlocsClientProg();
}

function cpMonterBloc(bi){ if(bi===0) return; const b=clientProgEnEdition.blocs; [b[bi-1],b[bi]]=[b[bi],b[bi-1]]; renderBlocsClientProg(); }
function cpDescendreBloc(bi){ const b=clientProgEnEdition.blocs; if(bi>=b.length-1) return; [b[bi],b[bi+1]]=[b[bi+1],b[bi]]; renderBlocsClientProg(); }
function cpAjouterBloc(){ clientProgEnEdition.blocs.push(blocVide()); renderBlocsClientProg(); }
function cpRetirerBloc(bi){ clientProgEnEdition.blocs.splice(bi,1); renderBlocsClientProg(); }
function cpAjouterSeance(bi){ const s=clientProgEnEdition.blocs[bi].seances; s.push({id:null,titre:'Séance '+(s.length+1),exercices:[]}); renderBlocsClientProg(); }
function cpRetirerSeance(bi,si){ clientProgEnEdition.blocs[bi].seances.splice(si,1); renderBlocsClientProg(); }
function cpRetirerExo(bi,si,ei){ clientProgEnEdition.blocs[bi].seances[si].exercices.splice(ei,1); renderBlocsClientProg(); }
function cpOnDragStartExo(e,bi,si,ei){ _cpDragExoSource={bi,si,ei}; e.dataTransfer.effectAllowed='move'; }
function cpOnDragEndExo(){ _cpDragExoSource=null; }
function cpOnDropExo(e,bi,si,ei){
  e.preventDefault();
  const src=_cpDragExoSource; _cpDragExoSource=null;
  if(!src||src.bi!==bi||src.si!==si||src.ei===ei){ renderBlocsClientProg(); return; }
  const arr=clientProgEnEdition.blocs[bi].seances[si].exercices;
  const [moved]=arr.splice(src.ei,1);
  arr.splice(src.ei<ei?ei-1:ei,0,moved);
  renderBlocsClientProg();
}

async function sauvegarderProgrammeClient(){
  const cp=clientProgEnEdition;
  if(!cp) return;
  const btn=document.getElementById('clientProgSaveBtn');
  const errEl=document.getElementById('cpErr');
  if(btn){btn.disabled=true;btn.textContent='Enregistrement…';}
  if(errEl) errEl.style.display='none';
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${cp.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({nom:cp.nom,bloc_actif_id:cp.bloc_actif_id||null})});
    const newBlocIds=[],newSeanceIds=[],newExoIds=[];
    for(let bi=0;bi<cp.blocs.length;bi++){
      const b=cp.blocs[bi];
      if(b.id){
        await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs?id=eq.${b.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({type:b.type||null,nombre_semaines:b.nombre_semaines||null,ordre:bi})});
      } else {
        const r=await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs`,{method:'POST',headers:supaHeaders({Prefer:'return=representation'}),body:JSON.stringify({client_programme_id:cp.id,type:b.type||null,nombre_semaines:b.nombre_semaines||null,ordre:bi})});
        b.id=(await r.json())[0].id;
      }
      newBlocIds.push(b.id);
      for(let si=0;si<b.seances.length;si++){
        const s=b.seances[si];
        if(s.id){
          await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances?id=eq.${s.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({titre:s.titre,ordre:si})});
        } else {
          const r=await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances`,{method:'POST',headers:supaHeaders({Prefer:'return=representation'}),body:JSON.stringify({bloc_id:b.id,titre:s.titre,ordre:si})});
          s.id=(await r.json())[0].id;
        }
        newSeanceIds.push(s.id);
        for(let ei=0;ei<s.exercices.length;ei++){
          const ex=s.exercices[ei];
          if(ex.id){
            await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices?id=eq.${ex.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({exercice_id:ex.exercice_id,ordre:ei,series:parseInt(ex.series)||null,reps:ex.reps||null,repos:ex.repos||null,tempo:ex.tempo||null,rir:ex.rir||null,notes:ex.notes||null})});
          } else {
            const r=await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices`,{method:'POST',headers:supaHeaders({Prefer:'return=representation'}),body:JSON.stringify({seance_id:s.id,exercice_id:ex.exercice_id,nom:ex.nom,ordre:ei,series:parseInt(ex.series)||null,reps:ex.reps||null,repos:ex.repos||null,tempo:ex.tempo||null,rir:ex.rir||null,notes:ex.notes||null})});
            ex.id=(await r.json())[0].id;
          }
          newExoIds.push(ex.id);
        }
      }
    }
    const removedExos=_origClientProgExoIds.filter(id=>!newExoIds.includes(id));
    for(const id of removedExos) await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices?id=eq.${id}`,{method:'DELETE',headers:supaHeaders()});
    const removedSeances=_origClientProgSeanceIds.filter(id=>!newSeanceIds.includes(id));
    for(const id of removedSeances) await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances?id=eq.${id}`,{method:'DELETE',headers:supaHeaders()});
    const removedBlocs=_origClientProgBlocIds.filter(id=>!newBlocIds.includes(id));
    for(const id of removedBlocs) await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs?id=eq.${id}`,{method:'DELETE',headers:supaHeaders()});
    ficheData.tous_programmes=await chargerTousProgrammes(cp.client_id);
    ficheData.programme=ficheData.tous_programmes.find(p=>p.actif)||null;
    state.nav='fiche-client'; state.selected=cp.client_id; ficheTab='programmes';
    renderSidebar(); renderMain();
  } catch(e){
    if(btn){btn.disabled=false;btn.textContent='Enregistrer';}
    if(errEl){errEl.textContent='Erreur : '+e.message;errEl.style.display='block';}
  }
}

// Ajout/retrait manuel d'XP par le coach — action délibérée à chaque clic,
// pas besoin de dédoublonnage (contrairement au crédit automatique à
// l'envoi d'un bilan, voir bilan.js _crediterXpBilanEnvoye).
async function ajouterXpClient(clientId) {
  const input = document.getElementById('xpAjoutInput');
  const delta = parseInt(input && input.value);
  if (!clientId || isNaN(delta) || delta === 0) return;
  const btn = document.getElementById('xpAjoutBtn');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    const progRes = await fetch(`${SUPABASE_URL}/rest/v1/client_progression?client_id=eq.${encodeURIComponent(clientId)}&select=xp_total`, { headers: supaHeaders() });
    const progArr = progRes.ok ? await progRes.json() : [];
    const xpActuel = (progArr[0] && progArr[0].xp_total) || 0;
    const nouveauXp = Math.max(0, xpActuel + delta);
    await fetch(`${SUPABASE_URL}/rest/v1/client_progression?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: clientId, xp_total: nouveauXp, updated_at: new Date().toISOString() })
    });
    ficheData.xpData = await chargerClientProgressionXP(clientId);
    if (state.nav === 'fiche-client' && state.selected === clientId) renderMain();
  } catch(e) {
    alert('Erreur : ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '+ Ajouter XP'; }
  }
}

async function chargerClientProgressionXP(clientId){
  const [progRes, bilansRes, profilRes, seancesRes] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/client_progression?client_id=eq.${encodeURIComponent(clientId)}`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.asc`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}&select=date_debut,seances_cible`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?select=client_programme_exercice_id,semaine&client_programme_exercice_id=in.(select+id+from+client_programme_exercices+where+client_programme_id+in+(select+id+from+client_programmes+where+client_id%3Deq.${encodeURIComponent(clientId)}))`, { headers: supaHeaders() }).catch(()=>({ ok:false }))
  ]);
  const [progRows, bilans, profils] = await Promise.all([
    progRes.ok ? progRes.json() : Promise.resolve([]),
    bilansRes.ok ? bilansRes.json() : Promise.resolve([]),
    profilRes.ok ? profilRes.json() : Promise.resolve([])
  ]);
  const progRow = progRows[0] || {};
  const profil  = profils[0]  || {};
  // xp_total est un compteur stocké, incrémenté uniquement côté serveur à
  // l'envoi d'un bilan (bilan.js, _crediterXpBilanEnvoye), dédoublonné via
  // bilans.xp_credite — jamais recalculé ici. Voir progression.js.
  // XP_PAR_NIVEAU=50, pas de plafond : aligné sur le système GAS réel
  // (confirmé via Perrine, xp_total=747 → niveau 15 = floor(747/50)+1).
  const XP_PAR_NIVEAU = 50;
  const xpTotal = progRow.xp_total || 0;
  const bilansValidies = bilans.filter(b => b.envoye_coach && b.date_validation).length;
  let seancesValidees = 0;
  bilans.forEach(b => {
    if (!b.envoye_coach || !b.date_validation) return;
    seancesValidees += (b.jours || []).filter(j=>j.training).length;
  });
  const niveau = Math.max(1, Math.floor(xpTotal / XP_PAR_NIVEAU) + 1);
  const niveauMaxAtteint = false;
  const xpManquant = niveau * XP_PAR_NIVEAU - xpTotal;
  const pct = Math.round((xpTotal - (niveau-1)*XP_PAR_NIVEAU) / XP_PAR_NIVEAU * 100);
  // 4 = ancien comportement par défaut tant que le coach n'a pas encore
  // assigné d'objectif séances/semaine (client_profils.seances_cible).
  const nbSemaines = (typeof _semainesDepuisDebut === 'function' ? _semainesDepuisDebut(profil.date_debut) : 0) || bilans.length || 1;
  const seancesCible = profil.seances_cible || 4;
  const seancesAttendues = nbSemaines * seancesCible;
  const bilansAttendus = nbSemaines;
  const pctSeances = seancesAttendues > 0 ? Math.min(100, Math.round(seancesValidees / seancesAttendues * 100)) : 0;
  const pctBilans = bilansAttendus > 0 ? Math.min(100, Math.round(bilansValidies / bilansAttendus * 100)) : 0;
  const assiduiteGlobale = Math.round((pctSeances + pctBilans) / 2);
  const titreActif = progRow.titre_actif || null;
  const titreDef = titreActif && typeof TITRES_DEF !== 'undefined' ? TITRES_DEF.find(t=>t.id===titreActif) : null;
  const tier = typeof niveauToTier === 'function' ? niveauToTier(niveau) : 'debutant';
  const tc = typeof getTierColors === 'function' ? getTierColors(tier) : {c1:'#a8b0c8',c2:'#404858',bar:''};
  return { xpTotal, niveau, pct, xpManquant, niveauMaxAtteint, tier, tc, titreDef,
           seancesValidees, seancesAttendues, pctSeances,
           bilansValidies, bilansAttendus, pctBilans, assiduiteGlobale };
}
function progressionChart(vals, color){
  const w=560,h=100,min=Math.min(...vals),max=Math.max(...vals);
  const pts = vals.map((v,i)=>[ (i/(vals.length-1||1))*w, h - ((v-min)/((max-min)||1))*(h-10) - 4 ]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${h*f}" x2="${w}" y2="${h*f}" stroke="var(--hairline)" stroke-width="1"/>`).join('');
  return `<svg class="bigchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" opacity="0.18"/>
  </svg>`;
}
function renderProgressionTab(){
  const list = panelProgression || [];

  return `

function ageDepuisDate(dateStr){
  if (!dateStr) return null;
  const naissance = new Date(dateStr);
  if (isNaN(naissance)) return null;
  const auj = new Date();
  let age = auj.getFullYear() - naissance.getFullYear();
  const m = auj.getMonth() - naissance.getMonth();
  if (m < 0 || (m === 0 && auj.getDate() < naissance.getDate())) age--;
  return age;
}

async function chargerDieteTemplates(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?client_only=eq.false&order=nom.asc&select=*,repas(id,nom,ordre,repas_aliments(id,nom,quantite_g,kcal_par_gramme,prot_par_gramme,glu_par_gramme,lip_par_gramme))`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}

function macrosDiete(repasArr){
  let kcal=0, prot=0, glu=0, lip=0;
  (repasArr||[]).forEach(r => (r.repas_aliments||[]).forEach(a => {
    const q = parseFloat(a.quantite_g)||0;
    kcal += q * (parseFloat(a.kcal_par_gramme)||0);
    prot += q * (parseFloat(a.prot_par_gramme)||0);
    glu  += q * (parseFloat(a.glu_par_gramme)||0);
    lip  += q * (parseFloat(a.lip_par_gramme)||0);
  }));
  return { kcal:Math.round(kcal), prot:Math.round(prot), glu:Math.round(glu), lip:Math.round(lip) };
}

async function supprimerDieteTemplate(id){
  if (!confirm('Supprimer ce template de diète ?')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${id}`, { method:'DELETE', headers:supaHeaders() });
    if (!res.ok) throw new Error('supabase_' + res.status);
    dieteTemplatesData = dieteTemplatesData.filter(t=>t.id!==id);
    renderDieteTemplatesSub();
  } catch(e){ alert('Erreur : ' + e.message); }
}

// ── Éditeur de template diète ─────────────────────────────────────────
async function ouvrirEditeurDiete(id){
  _dietNavBack = 'dietes';
  if (id) {
    const tpl = dieteTemplatesData.find(t=>t.id===id);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${id}&order=ordre.asc,variante_index.asc&select=*,repas_aliments(*)`, { headers:supaHeaders() });
    const repasRaw = res.ok ? await res.json() : tpl.repas||[];
    dieteTplEnEdition = {
      id: tpl.id, nom: tpl.nom, description: tpl.description||'',
      repas: repasRaw.map(r=>({ id:r.id, nom:r.nom, ordre:r.ordre||0, variante_index:r.variante_index||0, aliments:(r.repas_aliments||[]).map(a=>({id:a.id,nom:a.nom,unite:a.unite||'g',quantite_g:a.quantite_g,kcal_par_gramme:a.kcal_par_gramme,prot_par_gramme:a.prot_par_gramme,glu_par_gramme:a.glu_par_gramme,lip_par_gramme:a.lip_par_gramme})) }))
    };
    if (!dieteTplEnEdition.repas.length) dieteTplEnEdition.repas = [{ nom:'Repas 1', ordre:0, variante_index:0, aliments:[] }];
  } else {
    dieteTplEnEdition = { id:null, nom:'', description:'', repas:[{ nom:'Repas 1', ordre:0, variante_index:0, aliments:[] }] };
  }
  setNav('editeur-diete');
}

function renderEditeurDiete() { setNav('editeur-diete'); }

        <div><div style="font-family:var(--font-mono);font-size:16px;font-weight:700;">${totalM.prot}g</div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;">prot</div></div>

function retourDepuisEditeurDiete() {
  if (_ficheEditClientId) { _ficheEditClientId = null; setNav('fiche-client'); }
  else if (_ficheCreateClientId) { _ficheCreateClientId = null; setNav('fiche-client'); }
  else { setNav(_dietNavBack || 'dietes'); }
}

function ajouterRepas(){
  const maxOrdre = dieteTplEnEdition.repas.reduce((m,r) => Math.max(m, r.ordre != null ? r.ordre : 0), -1);
  dieteTplEnEdition.repas.push({ nom:`Repas ${maxOrdre+2}`, ordre:maxOrdre+1, variante_index:0, aliments:[] });
  setNav('editeur-diete');
}

function ajouterVarianteRepas(ordre){
  ordre = parseInt(ordre);
  const existing = dieteTplEnEdition.repas.filter(r => (r.ordre != null ? r.ordre : 0) === ordre);
  const maxVariante = existing.reduce((m,r) => Math.max(m, r.variante_index||0), 0);
  const mainNom = (existing.find(r=>(r.variante_index||0)===0)||existing[0]||{}).nom || 'Repas';
  dieteTplEnEdition.repas.push({ nom:mainNom+' (variante)', ordre, variante_index:maxVariante+1, aliments:[] });
  setNav('editeur-diete');
}

function supprimerRepas(ri){
  dieteTplEnEdition.repas.splice(ri,1);
  setNav('editeur-diete');
}

function supprimerAlimentDiete(ri, ai){
  dieteTplEnEdition.repas[ri].aliments.splice(ai,1);
  _updateAlimentsDom(ri);
}

function _filtrerBaseAlim(q){
  const list = document.getElementById('aBaseList');
  if (!list || !alimentsCoachData) return;
  const ql = q.toLowerCase();
  const filtered = ql ? alimentsCoachData.filter(a=>a.nom.toLowerCase().includes(ql)) : alimentsCoachData;
  list.innerHTML = filtered.map(a => `
    <div class="alim-pick-row" onclick="_selectionnerAlimBase(${a.id})">
      <div>
        <div class="alim-pick-nom">${esc(a.nom)}</div>
        ${a.categorie?`<div style="font-size:10.5px;color:var(--text-faint);">${esc(a.categorie)}</div>`:''}
      </div>
      <div class="alim-pick-macros">${Math.round((a.kcal_par_gramme||0)*100)} kcal · P${Math.round((a.prot_par_gramme||0)*100)} G${Math.round((a.glu_par_gramme||0)*100)} L${Math.round((a.lip_par_gramme||0)*100)}</div>
    </div>`).join('') || `<div style="text-align:center;padding:20px;color:var(--text-faint);">Aucun résultat.</div>`;
}

function _selectionnerAlimBase(id){
  const a = alimentsCoachData.find(x=>x.id===id);
  if (!a) return;
  _ouvrirSaisieQuantite(a.nom, a.kcal_par_gramme, a.prot_par_gramme, a.glu_par_gramme, a.lip_par_gramme, a.unite||'g');
}

async function _rechercherOFF(){
  const q = document.getElementById('aOffSearch').value.trim();
  if (!q) return;
  const listEl = document.getElementById('aOffList');
  listEl.innerHTML = `<div style="text-align:center;padding:20px;"><div class="spin" style="margin:auto;"></div></div>`;
  try {
    const results = await rechercherOpenFoodFacts(q);
    if (!results.length){ listEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-faint);">Aucun résultat.</div>`; return; }
    listEl.innerHTML = results.map((r,i) => `
      <div class="alim-pick-row" onclick="_selectionnerOFF(${i})" data-off-idx="${i}">
        <div class="alim-pick-nom">${esc(r.nom)}</div>
        <div class="alim-pick-macros">${Math.round((r.kcal||0)*100)} kcal · P${Math.round((r.prot||0)*100)} G${Math.round((r.glu||0)*100)} L${Math.round((r.lip||0)*100)}</div>
      </div>`).join('');
    listEl._offResults = results;
  } catch(e){ listEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--critical);">Erreur : ${esc(e.message)}</div>`; }
}

function _selectionnerOFF(idx){
  const listEl = document.getElementById('aOffList');
  const r = listEl?._offResults?.[idx];
  if (!r) return;
  _ouvrirSaisieQuantite(r.nom, r.kcal, r.prot, r.glu, r.lip);
}

function _ouvrirSaisieQuantite(nom, kcal_pg, prot_pg, glu_pg, lip_pg, unite){
  unite = unite || 'g';
  const isG = unite === 'g';
  const refMult = isG ? 100 : 1;
  const refLabel = isG ? '/ 100g' : '/ ' + unite;
  const qteLabel = isG ? 'Quantité (g)' : 'Nombre de ' + unite + 's';
  const qteDefault = isG ? 100 : 1;
  const modal = document.getElementById('modal-ajout-aliment');
  const box = modal.querySelector('.modal-box');
  box.innerHTML = `
    <h3 style="margin-bottom:4px;">${esc(nom)}</h3>
    ${_ajoutAlimCount > 0 ? `<div style="font-size:11px;color:var(--success);margin-bottom:10px;">✓ ${_ajoutAlimCount} aliment${_ajoutAlimCount>1?'s':''} ajouté${_ajoutAlimCount>1?'s':''} à ce repas</div>` : ''}
    <div class="macro-band" style="border-radius:var(--radius-sm);margin-bottom:16px;">
      <div><div class="mk">Kcal</div><div class="mn">${Math.round(kcal_pg*refMult)}</div><div class="mu">${refLabel}</div></div>
      <div><div class="mk">Prot</div><div class="mn">${Math.round(prot_pg*refMult*10)/10}g</div><div class="mu">${refLabel}</div></div>
      <div><div class="mk">Gluc</div><div class="mn">${Math.round(glu_pg*refMult*10)/10}g</div><div class="mu">${refLabel}</div></div>
      <div><div class="mk">Lip</div><div class="mn">${Math.round(lip_pg*refMult*10)/10}g</div><div class="mu">${refLabel}</div></div>
    </div>
    <div class="field-row"><label>${qteLabel}</label><input id="aQteSelected" type="number" min="1" value="${qteDefault}" style="font-size:16px;" onkeydown="if(event.key==='Enter')_confirmerAlimSelectionne('${esc(nom)}',${kcal_pg},${prot_pg},${glu_pg},${lip_pg},'${unite}')"></div>
    <div class="modal-actions">
      <button class="btn" onclick="ajoutAlimTab='base';_renderModalAjoutAliment()">← Retour</button>
      <button class="btn primary" onclick="_confirmerAlimSelectionne('${esc(nom)}',${kcal_pg},${prot_pg},${glu_pg},${lip_pg},'${unite}')">Ajouter</button>
    </div>`;
  setTimeout(()=>document.getElementById('aQteSelected')?.select(), 50);
}

function _confirmerAlimSelectionne(nom, kcal_pg, prot_pg, glu_pg, lip_pg, unite){
  unite = unite || 'g';
  const qte = parseFloat(document.getElementById('aQteSelected').value)||0;
  dieteTplEnEdition.repas[ajoutAlimRI].aliments.push({ nom, unite, quantite_g:qte, kcal_par_gramme:kcal_pg, prot_par_gramme:prot_pg, glu_par_gramme:glu_pg, lip_par_gramme:lip_pg });
  _ajoutAlimCount++;
  _updateAlimentsDom(ajoutAlimRI);
  // Retour à la recherche avec flash de confirmation
  ajoutAlimTab = 'base';
  _renderModalAjoutAliment();
  setTimeout(() => {
    const flash = document.getElementById('picker-flash');
    if (flash) { flash.textContent = `✓ ${nom} ajouté`; flash.style.opacity = '1'; setTimeout(()=>{ if(flash) flash.style.opacity='0'; }, 2500); }
  }, 30);
}

function confirmerAjoutAliment(){
  const nom = document.getElementById('aNom').value.trim();
  const errEl = document.getElementById('aErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  const qte = parseFloat(document.getElementById('aQte').value)||0;
  const kcal = (parseFloat(document.getElementById('aKcal').value)||0) / 100;
  const prot = (parseFloat(document.getElementById('aProt').value)||0) / 100;
  const glu  = (parseFloat(document.getElementById('aGlu').value)||0) / 100;
  const lip  = (parseFloat(document.getElementById('aLip').value)||0) / 100;
  dieteTplEnEdition.repas[ajoutAlimRI].aliments.push({ nom, quantite_g:qte, kcal_par_gramme:kcal, prot_par_gramme:prot, glu_par_gramme:glu, lip_par_gramme:lip });
  _ajoutAlimCount++;
  _updateAlimentsDom(ajoutAlimRI);
  // Reset le formulaire pour un autre ajout manuel
  document.getElementById('aNom').value = '';
  document.getElementById('aQte').value = '100';
  ['aKcal','aProt','aGlu','aLip'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
  const flash = document.getElementById('picker-flash');
  if (flash) { flash.textContent = `✓ ${nom} ajouté`; flash.style.opacity = '1'; setTimeout(()=>{ if(flash) flash.style.opacity='0'; }, 2500); }
  setTimeout(()=>document.getElementById('aNom')?.focus(), 30);
}

async function sauvegarderDieteTemplate(){
  if (_ficheCreateClientId) { await sauvegarderDietePourClient(); return; }
  const nom = document.getElementById('dNom').value.trim();
  const errEl = document.getElementById('dErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  dieteTplEnEdition.nom = nom;
  dieteTplEnEdition.description = document.getElementById('dDesc').value.trim();
  try {
    const method = dieteTplEnEdition.id ? 'PATCH' : 'POST';
    const url = dieteTplEnEdition.id ? `${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${dieteTplEnEdition.id}` : `${SUPABASE_URL}/rest/v1/diete_templates`;
    const res = await fetch(url, { method, headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ nom:dieteTplEnEdition.nom, description:dieteTplEnEdition.description||null }) });
    if (!res.ok) throw new Error('supabase_'+res.status);
    const saved = (await res.json())[0];
    const tplId = saved.id;
    if (dieteTplEnEdition.id) {
      await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tplId}`, { method:'DELETE', headers:supaHeaders() });
    }
    for (let ri=0; ri<dieteTplEnEdition.repas.length; ri++){
      const r = dieteTplEnEdition.repas[ri];
      const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`, { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id:tplId, nom:r.nom, ordre:r.ordre!=null?r.ordre:ri, variante_index:r.variante_index||0 }) });
      if (!rRes.ok) throw new Error('supabase_repas_'+rRes.status);
      const savedR = (await rRes.json())[0];
      if (r.aliments.length){
        const alimPayload = r.aliments.map((a,ai)=>({ repas_id:savedR.id, nom:a.nom, unite:a.unite||'g', quantite_g:a.quantite_g, kcal_par_gramme:a.kcal_par_gramme, prot_par_gramme:a.prot_par_gramme, glu_par_gramme:a.glu_par_gramme, lip_par_gramme:a.lip_par_gramme, ordre:ai }));
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`, { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(alimPayload) });
      }
    }
    dieteTemplatesData = null;
    dieteTemplatesData = await chargerDieteTemplates();
    if (_ficheEditClientId) {
      const cid = _ficheEditClientId;
      _ficheEditClientId = null;
      await openPanel(cid);
      setFicheTab('diete');
      setNav('fiche-client');
    } else {
      setNav('dietes');
    }
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

async function confirmerAssignerDiete(templateId, templateNom){
  const clientId = document.getElementById('fAssignDieteClient').value;
  const errEl = document.getElementById('assignDieteErr');
  if (!clientId){ errEl.textContent='Sélectionne un client.'; errEl.style.display='block'; return; }
  try {
    await assignerDieteAuClient(templateId, templateNom, clientId);
    document.getElementById('modal-assigner-diete').remove();
    alert('Diète assignée.');
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

async function confirmerAssignerDieteDepuisFiche(clientId){
  const val = document.getElementById('fAssignDieteTpl').value;
  const errEl = document.getElementById('assignDieteErr');
  if (!val){ errEl.textContent='Sélectionne un template.'; errEl.style.display='block'; return; }
  const [tplId, tplNom] = val.split('|');
  try {
    await assignerDieteAuClient(parseInt(tplId), tplNom, clientId);
    document.getElementById('modal-assigner-diete').remove();
    ficheData.tous_dietes = await chargerTousDietes(clientId);
    ficheData.diete = ficheData.tous_dietes.find(d=>d.actif) || null;
    setFicheTab('diete');
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

async function assignerDieteAuClient(templateId, templateNom, clientId){
  // Plusieurs diètes simultanées autorisées — pas de désactivation des autres
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes`, {
    method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
    body:JSON.stringify({ client_id:clientId, nom:templateNom, diete_template_id:templateId, actif:true })
  });
  if (!res.ok) throw new Error('supabase_'+res.status);
  return (await res.json())[0];
}

async function retirerDieteClient(dieteId, clientId){
  if (!confirm('Retirer cette diète du client ?')) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?id=eq.${dieteId}`, { method:'DELETE', headers:supaHeaders() });
    ficheData.tous_dietes = await chargerTousDietes(clientId);
    ficheData.diete = ficheData.tous_dietes.find(d=>d.actif) || null;
    setFicheTab('diete');
  } catch(e){ alert('Erreur : '+e.message); }
}

async function supprimerRecette(id) {
  if (!confirm('Supprimer cette recette ?')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/recettes?id=eq.${id}`, { method:'DELETE', headers:supaHeaders() });
    if (!res.ok) throw new Error('supabase_' + res.status);
    recettesCoachData = recettesCoachData.filter(r=>r.id!==id);
    renderRecettesCoachSub();
  } catch(e){ alert('Erreur : ' + e.message); }
}

async function exporterRecetteVersBase(id) {
  const r = (recettesCoachData||[]).find(x=>x.id===id);
  if (!r || !r.kcal_par_portion) return;
  const nom = `${r.emoji||'🍽️'} ${r.nom}`;
  const body = {
    nom, categorie: 'Recettes', unite: 'portion',
    kcal_par_gramme: r.kcal_par_portion,
    prot_par_gramme: r.prot_par_portion || 0,
    glu_par_gramme:  r.glu_par_portion  || 0,
    lip_par_gramme:  r.lip_par_portion  || 0
  };
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/aliments_coach`, {
      method:'POST', headers: supaHeaders({ Prefer:'return=representation' }), body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('supabase_' + res.status);
    const saved = (await res.json())[0];
    alimentsCoachData = alimentsCoachData ? [...alimentsCoachData, saved].sort((a,b)=>a.nom.localeCompare(b.nom,'fr')) : [saved];
    alert(`"${nom}" ajouté à la base alimentaire (1 portion = ${Math.round(r.kcal_par_portion)} kcal) !`);
  } catch(e) { alert('Erreur : ' + e.message); }
}

      glu_par_portion: r.glu_par_portion||'',

        { method:'PATCH', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(payload) });

      res = await fetch(`${SUPABASE_URL}/rest/v1/recettes`,

    }
    if (!res.ok) throw new Error('Supabase ' + res.status + ' : ' + await res.text());

async function sauvegarderMensuration(clientId, rowId) {
  const v = id => { const el = document.getElementById('mm-'+id); return el ? el.value : null; };
  const num = s => s !== '' && s != null ? parseFloat(s) : null;
  const body = {
    client_id: clientId,
    date: v('date'),
    phase: v('phase') || null,
    poids: num(v('poids')), mesure: num(v('mesure')),
    fessiers: num(v('fessiers')), cuisses: num(v('cuisses')), mollets: num(v('mollets')),
    poitrine: num(v('poitrine')), epaules: num(v('epaules')), bras: num(v('bras')),
  };
  if (!body.date) { alert('La date est obligatoire.'); return; }
  try {
    let res;
    if (rowId) {
      res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?id=eq.${rowId}`,
        { method: 'PATCH', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(body) });
    } else {
      res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?on_conflict=client_id,date`,
        { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation,resolution=merge-duplicates' }), body: JSON.stringify(body) });
    }
    if (!res.ok) throw new Error('Supabase ' + res.status + ' — ' + await res.text().catch(()=>''));
    document.querySelector('.modal-overlay')?.remove();
    // Invalide le cache et re-charge
    _ficheMensurationsClientId = null; _ficheMensurations = null;
    _pageMensurationsRows = [];
    if (state.nav === 'fiche-client') { const el = document.getElementById('ficheTabContent'); if (el) el.innerHTML = renderFicheMensurationsTab({id:clientId}); }
    else if (state.nav === 'mensurations') chargerMensurationsSupabase(clientId);
  } catch(e) { alert('Erreur : ' + e.message); }

async function supprimerMensuration(rowId, clientId) {
  if (!confirm('Supprimer cette entrée ?')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?id=eq.${rowId}`,
      { method: 'DELETE', headers: supaHeaders({ Prefer: 'return=minimal' }) });

const GAS_PROD_URL = 'https://script.google.com/macros/s/AKfycbwQiM6ixf-CTIWwcuNHoosFbvrDzWmC056yRUGhTaWv0Nwxbm0dLeK3d5QVgqmS7P9G7A/exec';

// Mapping ID Supabase → ID GAS quand ils diffèrent
// (ex: compte test "yohanp" utilise la feuille réelle "yohan")
const GAS_ID_MAP = { 'yohanp': 'yohan' };
function _gasId(clientId) { return GAS_ID_MAP[clientId] || clientId; }

async function apiGasProd(action, clientId, params = {}) {
  const body = { action, token: getToken(), client: _gasId(clientId), params };
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(GAS_PROD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(body),
      signal: ctrl.signal,
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'erreur_gas');
    return json.data;
  } finally {
    clearTimeout(tid);
  }
}

function _parseDateFr(s) {
  s = (s||'').toString().trim();
  if (!s) return null;
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : null;
}

// La date lue sur une feuille GAS historique correspond au jour où le client a
// rempli son bilan (souvent le dimanche, mais dépend de jour_bilan) — c'est donc
// exactement la date de fin de semaine. On en déduit un semaine_label "Du … au …"
// cohérent avec _supaGetSemaineLabel (bilan.js), au lieu du texte "SEMAINE" brut
// remonté par GAS pour les vieilles feuilles.
function _semaineLabelFromSheetDate(iso, jourBilanNom) {
  if (!iso) return null;
  const { debut, fin } = _bilanWeekBounds(jourBilanNom, new Date(iso + 'T12:00:00'));
  const MOIS = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
  const fmt = d => d.getDate() + ' ' + MOIS[d.getMonth()];
  return 'Du ' + fmt(debut) + ' au ' + fmt(fin);
}
