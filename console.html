    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('modal-import-sheets').remove()">Annuler</button>
      <button class="btn primary" id="btnLancerImport" onclick="executerImportSheets(window._importCoach, window._importCommunaute)">Importer ${total} aliments</button>
    </div>
  </div>`;
}

async function executerImportSheets(coach, communaute){
  document.getElementById('btnLancerImport').disabled = true;
  const prog = document.getElementById('importSheetsProgress');
  const bar  = document.getElementById('importSheetsBar');
  const msg  = document.getElementById('importSheetsMsg');
  const errEl= document.getElementById('importSheetsErr');
  prog.style.display = 'block';

  // a.kcal/prot/glu/lip proviennent du Sheet import, nativement "pour 100g" —
  // stockage direct désormais (plus de division, colonnes _par_100g).
  const tous = [
    ...coach.map(a => ({
      nom: a.nom,
      categorie: null,
      kcal_par_100g: a.kcal||0,
      prot_par_100g: a.prot||0,
      glu_par_100g:  a.glu ||0,
      lip_par_100g:  a.lip ||0,
    })),
    ...communaute.map(a => ({
      nom: a.nom,
      categorie: null,
      kcal_par_100g: a.kcal||0,
      prot_par_100g: a.prot||0,
      glu_par_100g:  a.glu ||0,
      lip_par_100g:  a.lip ||0,
    })),
  ];

  const BATCH = 50;
  let importes = 0;
  let erreurs = 0;

  for (let i = 0; i < tous.length; i += BATCH) {
    const chunk = tous.slice(i, i + BATCH);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/aliments_coach`, {
        method: 'POST',
        headers: supaHeaders({ Prefer: 'return=minimal,resolution=ignore-duplicates' }),
        body: JSON.stringify(chunk),
      });
      if (!res.ok && res.status !== 409) throw new Error('supabase_' + res.status);
      importes += chunk.length;
    } catch(e) {
      erreurs += chunk.length;
    }
    const pct = Math.round(((i + chunk.length) / tous.length) * 100);
    bar.style.width = pct + '%';
    msg.textContent = `${Math.min(i + BATCH, tous.length)} / ${tous.length} traités…`;
  }

  bar.style.width = '100%';
  msg.textContent = `Import terminé : ${importes} ajoutés${erreurs ? `, ${erreurs} erreurs` : ''}.`;

  if (erreurs) { errEl.textContent = `${erreurs} aliments n'ont pas pu être insérés.`; errEl.style.display='block'; }

  // Recharger la base locale
  alimentsCoachData = null;
  alimentsCoachErr = null;
  try { alimentsCoachData = await chargerAlimentsCoach(); } catch(e) { alimentsCoachErr = e.message; }

  document.getElementById('btnLancerImport').textContent = 'Fermer';
  document.getElementById('btnLancerImport').onclick = () => { document.getElementById('modal-import-sheets').remove(); renderBaseSub(); };
  document.getElementById('btnLancerImport').disabled = false;
}

async function rechercherOFFBase(){
  const q = document.getElementById('offBaseSearch').value.trim();
  if (!q) return;

async function sauvegarderAlimentCoach(id){
  const nom = document.getElementById('afNom').value.trim();
  const errEl = document.getElementById('afErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  const categorie = document.getElementById('afCat').value || null;
  const unite = document.getElementById('afUnite').value || 'g';

async function rechercherOpenFoodFacts(query){
  const params = new URLSearchParams({
    search_terms: query,
    action: 'process',
    json: '1',
    page_size: '30',
    sort_by: 'unique_scans_n',
    fields: 'product_name,nutriments',
    lc: 'fr',
  });
  const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?${params}`);
  if (!res.ok) throw new Error('OFF ' + res.status);
  const json = await res.json();
  const seen = new Set();
  return (json.products||[])
    .map(p => {
      const nom = (p.product_name||'').trim();
      const kcal = (p.nutriments?.['energy-kcal_100g'] ?? p.nutriments?.['energy-kcal_serving'] ?? null);
      const prot = (p.nutriments?.proteins_100g ?? null);
      const glu  = (p.nutriments?.carbohydrates_100g ?? null);
      const lip  = (p.nutriments?.fat_100g ?? null);
      // Valeurs gardées telles quelles (nativement "pour 100g" chez Open Food
      // Facts) — plus de division, cohérent avec le stockage _par_100g.
      return { nom, kcal, prot, glu, lip };
    })
    .filter(p => {
      if (!p.nom || p.nom.length < 2) return false;       // pas de nom
      if (p.kcal == null && p.prot == null) return false;  // pas de macros du tout
      const key = p.nom.toLowerCase();
      if (seen.has(key)) return false;                     // dédoublonnage
      seen.add(key);
      return true;
    })
    .slice(0, 20);
}

// ── Éditeur de protocole chimie (Supabase) ─────────────────────────────
// Réplique les fonctions de création de cycle/molécules de la feuille Google
// Sheets "Protocol" (genererProtocole/genererPlanning) — même logique de
// calcul (_protocoleCalculer, api.js), partagée avec le rendu côté client
// (protocole.js).
let protocoleEnEdition = null; // { id, client_id, clientNom, date_debut, duree_semaines, objectif, molecules:[...] }
let _protocolePreview  = null; // résultat de _protocoleCalculer après génération/enregistrement
let _protocoleNavBack  = 'protocole'; // où revenir après l'éditeur : 'protocole' | 'fiche-client'

async function ouvrirEditeurProtocole(clientId, clientNom, navBack){
  // protocoleEnEdition doit être assigné AVANT setNav : setNav déclenche renderMain()
  // synchronement, et renderEditeurProtocolePage rebondit vers 'protocole' si l'état
  // est encore vide (garde anti-crash) — l'inverser cassait l'ouverture de l'éditeur.
  _protocoleNavBack = navBack || 'protocole';
  protocoleEnEdition = { id: null, client_id: clientId, clientNom: clientNom || clientId, date_debut: new Date().toISOString().slice(0,10), duree_semaines: 12, objectif: '', molecules: [] };
  _protocolePreview = null;
  setNav('editeur-protocole');
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/client_protocoles?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc&limit=1&select=*,client_protocole_molecules(*)`,
      { headers: supaHeaders() }
    );
    const arr = res.ok ? await res.json() : [];
    if (arr.length > 0) {
      const row = arr[0];
      protocoleEnEdition = {
        id: row.id, client_id: clientId, clientNom: clientNom || clientId,
        date_debut: row.date_debut, duree_semaines: row.duree_semaines, objectif: row.objectif || '',
        molecules: (row.client_protocole_molecules || []).slice().sort((a,b)=>(a.ordre||0)-(b.ordre||0)),
      };
      _protocolePreview = _protocoleCalculer(row, protocoleEnEdition.molecules);
    }
  } catch(e) {}
  renderMain();
}

async function sauvegarderProtocole(){
  const p = protocoleEnEdition;
  if (!p.date_debut || !p.duree_semaines) { alert('Date de début et durée du cycle requises.'); return; }
  if (p.molecules.some(m => !(m.nom||'').trim())) { alert('Chaque molécule doit avoir un nom.'); return; }
  try {
    const body = { client_id: p.client_id, date_debut: p.date_debut, duree_semaines: parseInt(p.duree_semaines)||12, objectif: p.objectif || null };
    let protocoleId = p.id;
    if (protocoleId) {
      await fetch(`${SUPABASE_URL}/rest/v1/client_protocoles?id=eq.${protocoleId}`, { method:'PATCH', headers: supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify(body) });
    } else {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_protocoles`, { method:'POST', headers: supaHeaders({ Prefer:'return=representation' }), body: JSON.stringify(body) });
      const arr = await res.json();
      protocoleId = arr[0].id;
      p.id = protocoleId;
    }

    // Delete-all puis recreate (même pattern que sauvegarderDieteTemplate) —
    // plus simple qu'un diff ligne par ligne pour une poignée de molécules.
    await fetch(`${SUPABASE_URL}/rest/v1/client_protocole_molecules?protocole_id=eq.${protocoleId}`, { method:'DELETE', headers: supaHeaders() });
    const dureeSemaines = parseInt(p.duree_semaines) || 12;
    const molsBody = p.molecules.map((m,i) => ({
      protocole_id: protocoleId, nom: m.nom.trim(), categorie: m.categorie, unite: m.unite || null,
      par_jour_semaine: m.par_jour_semaine,
      dosage_produit: m.dosage_produit !== '' && m.dosage_produit != null ? Number(m.dosage_produit) : null,
      dosage_prise: m.dosage_prise !== '' && m.dosage_prise != null ? Number(m.dosage_prise) : null,
      semaine_debut: m.categorie === 'GH' ? 1 : (parseInt(m.semaine_debut) || 1),
      semaine_fin: m.categorie === 'GH' ? dureeSemaines : (parseInt(m.semaine_fin) || parseInt(m.semaine_debut) || 1),
      intervalle: m.intervalle !== '' && m.intervalle != null ? Number(m.intervalle) : 1,
      ordre: i,
    }));
    if (molsBody.length > 0) {
      await fetch(`${SUPABASE_URL}/rest/v1/client_protocole_molecules`, { method:'POST', headers: supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify(molsBody) });
    }

    _protocolePreview = _protocoleCalculer(body, molsBody);
    _ficheProtocole = undefined; // force rechargement de l'onglet fiche client au retour
    renderMain();
  } catch(e) { alert('Erreur : ' + e.message); }
}

// Dernier jour du cycle = date début + (durée en semaines × 7 − 1) jours,
// même convention que la feuille Google Sheets (C8 "Date de fin du cycle").
function _protocoleDateFinFmt(dateDebut, dureeSemaines){
  if (!dateDebut || !dureeSemaines) return '—';
  const [y, m, j] = dateDebut.split('-').map(Number);
  if (!y || !m || !j) return '—';
  const d = new Date(y, m - 1, j); // évite le décalage de fuseau horaire d'un new Date("YYYY-MM-DD")
  d.setDate(d.getDate() + (parseInt(dureeSemaines) * 7 - 1));
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function renderProtocolePreviewHtml(preview){

  const fmtDate = d => new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' });
  const rowStyle = s => s==='passee' ? 'opacity:.4;text-decoration:line-through;' : s==='encours' ? 'background:#0d1a13;color:#3ddc84;font-weight:600;' : '';

  const rows = preview.semaines.map(s => `

      ${s.doses.map(d => `<td style="padding:6px 10px;font-size:12px;white-space:nowrap;">${esc(d.texte)}</td>`).join('')}
    </tr>`).join('');

  return `
    <div class="table-card" style="margin-top:14px;">
      <div class="table-toolbar"><div class="title">Totaux du cycle</div></div>
      ${totalsHtml || '<div style="padding:16px;color:var(--text-faint);">Aucune molécule.</div>'}
    </div>
    <div class="table-card" style="margin-top:14px;">
      <div class="table-toolbar"><div class="title">Planning hebdomadaire</div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Sem.</th><th>Date</th>${preview.molecules.map(m=>`<th>${esc(m.nom)}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
}

// Portage depuis AppTrainingPWA/console.html (code identique, même Supabase) — cf. CLAUDE.md du bac à sable.
const GROUPES_MUSCULAIRES = ['Pectoraux','Dos (dorsaux)','Dos (trapèzes)','Dos (global)','Epaules (anterieur)','Epaules (latéral)','Epaules (posterieur)','Biceps','Triceps','Abdos','Lombaires','Quadriceps','Ischios','Fessiers','Adducteurs','Abducteurs','Mollets','Cardio'];
let progTab = 'exercices'; // 'exercices' | 'templates'

let templatesData = null;
let exoGroupeFiltre = 'all';
let exoRecherche = '';

async function chargerExercices(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/exercices?order=nom.asc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function sauvegarderExercice(ex){
  const method = ex.id ? 'PATCH' : 'POST';
  const url = ex.id ? `${SUPABASE_URL}/rest/v1/exercices?id=eq.${ex.id}` : `${SUPABASE_URL}/rest/v1/exercices`;
  const body = { nom: ex.nom, groupe_musculaire: ex.groupe_musculaire || null, groupe_secondaire: ex.groupe_secondaire || null, equipement: ex.equipement || null, video_url: ex.video_url || null, notes: ex.notes || null,
    reps_metabolique: ex.reps_metabolique || null, repos_metabolique: ex.repos_metabolique || null,
    reps_mecanique: ex.reps_mecanique || null, repos_mecanique: ex.repos_mecanique || null,
    reps_force: ex.reps_force || null, repos_force: ex.repos_force || null };
  const res = await fetch(url, { method, headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(body) });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return (await res.json())[0];
}
async function supprimerExercice(id){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/exercices?id=eq.${id}`, { method: 'DELETE', headers: supaHeaders() });
  if (!res.ok) {
    if (res.status === 409) throw new Error("Cet exercice est utilisé dans un template — retire-le du template d'abord.");
    throw new Error('supabase_' + res.status);
  }
}

async function chargerTemplates(){
  // Compte imbriqué léger (ids seulement) pour afficher séances/exercices sur les cartes sans requête séparée.
  const res = await fetch(`${SUPABASE_URL}/rest/v1/programme_templates?order=nom.asc&select=*,programme_blocs(id,programme_seances(id,programme_seance_exercices(id)))`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function chargerTemplateArbo(templateId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs?template_id=eq.${templateId}&order=ordre.asc&select=*,programme_seances(*,programme_seance_exercices(*))&programme_seances.order=ordre.asc&programme_seances.programme_seance_exercices.order=ordre.asc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function sauvegarderTemplateComplet(tpl){
  const method = tpl.id ? 'PATCH' : 'POST';
  const url = tpl.id ? `${SUPABASE_URL}/rest/v1/programme_templates?id=eq.${tpl.id}` : `${SUPABASE_URL}/rest/v1/programme_templates`;
  const res = await fetch(url, { method, headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify({ nom: tpl.nom, categorie: tpl.categorie || null, description: tpl.description || null }) });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const saved = (await res.json())[0];
  const templateId = saved.id;
  if (tpl.id) {
    // Remplacement complet de l'arborescence (comme modifierMenu côté GAS) plutôt qu'un diff fin —
    // cascade sur programme_seances puis programme_seance_exercices.
    await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs?template_id=eq.${templateId}`, { method: 'DELETE', headers: supaHeaders() });
  }
  const blocsPayload = tpl.blocs.map((b, bi) => ({ template_id: templateId, type: b.type || null, nombre_semaines: b.nombre_semaines || null, ordre: bi }));
  const resBlocs = await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(blocsPayload) });
  if (!resBlocs.ok) throw new Error('supabase_' + resBlocs.status);
  const blocsSaved = await resBlocs.json();
  // Lookup par 'ordre' (qu'on a nous-même assigné = bi) plutôt que par position du tableau retourné —
  // l'ordre de retour d'un insert multi-lignes n'est pas garanti par Postgres.
  const blocIdByOrdre = {};
  blocsSaved.forEach(b => { blocIdByOrdre[b.ordre] = b.id; });

  const seancesPayload = [];
  tpl.blocs.forEach((b, bi) => {
    b.seances.forEach((s, si) => {
      seancesPayload.push({ bloc_id: blocIdByOrdre[bi], titre: s.titre || ('Séance ' + (si + 1)), ordre: si });
    });
  });
  let seancesSaved = [];
  if (seancesPayload.length) {
    const resSeances = await fetch(`${SUPABASE_URL}/rest/v1/programme_seances`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(seancesPayload) });
    if (!resSeances.ok) throw new Error('supabase_' + resSeances.status);
    seancesSaved = await resSeances.json();
  }
  const seanceIdByBlocOrdre = {};
  seancesSaved.forEach(s => { seanceIdByBlocOrdre[s.bloc_id + '|' + s.ordre] = s.id; });

  const exercicesPayload = [];
  tpl.blocs.forEach((b, bi) => {
    const blocId = blocIdByOrdre[bi];
    b.seances.forEach((s, si) => {
      const seanceId = seanceIdByBlocOrdre[blocId + '|' + si];
      s.exercices.forEach((ex, ei) => {
        exercicesPayload.push({ seance_id: seanceId, exercice_id: ex.exercice_id, ordre: ei, series: parseInt(ex.series) || null, reps: ex.reps || '', repos: ex.repos || '', tempo: ex.tempo || '', rir: ex.rir || '', notes: ex.notes || '' });
      });
    });
  });
  if (exercicesPayload.length) {
    const resExo = await fetch(`${SUPABASE_URL}/rest/v1/programme_seance_exercices`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(exercicesPayload) });
    if (!resExo.ok) throw new Error('supabase_' + resExo.status);
  }
  return saved;
}
async function supprimerTemplate(id){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/programme_templates?id=eq.${id}`, { method: 'DELETE', headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
}

async function confirmerFormExercice(id){
  const nom = document.getElementById('fExoNom').value.trim();
  const errEl = document.getElementById('fExoErr');
  if (!nom) { errEl.textContent = 'Le nom est obligatoire.'; errEl.style.display = 'block'; return; }
  const payload = {
    id: id || null,
    nom,
    groupe_musculaire: document.getElementById('fExoGroupe').value,
    groupe_secondaire: document.getElementById('fExoGroupeSec').value,
    equipement: document.getElementById('fExoEquip').value.trim(),
    video_url: document.getElementById('fExoVideo').value.trim(),
    notes: document.getElementById('fExoNotes').value.trim(),
    reps_metabolique: document.getElementById('fExoRepsMeta').value.trim(),
    repos_metabolique: document.getElementById('fExoReposMeta').value.trim(),
    reps_mecanique: document.getElementById('fExoRepsMeca').value.trim(),
    repos_mecanique: document.getElementById('fExoReposMeca').value.trim(),
    reps_force: document.getElementById('fExoRepsForce').value.trim(),
    repos_force: document.getElementById('fExoReposForce').value.trim(),
  };
  try {
    const saved = await sauvegarderExercice(payload);
    if (id) { const i = exercicesData.findIndex(e=>e.id===id); if (i>=0) exercicesData[i] = saved; }
    else exercicesData.push(saved);
    document.getElementById('modal-exercice').remove();
    renderExercicesSub();
  } catch(e) { errEl.textContent = 'Erreur : ' + e.message; errEl.style.display = 'block'; }
}

async function retirerExercice(id){
  if (!confirm('Supprimer cet exercice ?')) return;
  try {
    await supprimerExercice(id);
    exercicesData = exercicesData.filter(e => e.id !== id);
    renderExercicesSub();
  } catch(e) { alert(e.message); }
}

let tplEnEdition = null;
let tplPickerCible = null; // { bi, si }
const BLOCS_TYPES = [{value:'',label:'Générique'},{value:'metabolique',label:'Métabolique'},{value:'mecanique',label:'Mécanique'},{value:'force',label:'Force'}];
const RIR_PAR_TYPE  = { metabolique:'0-1',  mecanique:'1-2',  force:'2-3' };
const REPS_PAR_TYPE = { metabolique:'15-20', mecanique:'10-15', force:'6-10' };
const REPOS_PAR_TYPE= { metabolique:"1'",   mecanique:"1'30",  force:"2'" };

function blocVide(){ return { type: null, nombre_semaines: null, seances: [{ titre: 'Séance 1', exercices: [] }] }; }

// Applique reps/repos (depuis la bibliothèque d'exercices, selon le type) + RIR (défaut par type)
// à tous les exercices déjà présents dans un bloc — appelé quand on change le type du bloc,
// pour que le contenu déjà rempli reste cohérent avec Métabolique/Mécanique/Force.
function _appliquerTypeAuxExercicesDuBloc(bloc, exercicesLib){
  const type = bloc.type;
  if (!type) return;
  bloc.seances.forEach(seance => {
    seance.exercices.forEach(ex => {
      const lib = ex.exercice_id != null ? (exercicesLib||[]).find(e => e.id === ex.exercice_id) : null;
      ex.reps  = (lib && lib['reps_'+type])  ? lib['reps_'+type]  : (REPS_PAR_TYPE[type]  || ex.reps);
      ex.repos = (lib && lib['repos_'+type]) ? lib['repos_'+type] : (REPOS_PAR_TYPE[type] || ex.repos);
      ex.rir   = RIR_PAR_TYPE[type] || ex.rir;
    });
  });
}

async function ouvrirEditeurTemplate(id){
  if (exercicesData === null) { try { exercicesData = await chargerExercices(); } catch(e) { exercicesData = []; } }
  if (id) {
    const tpl = templatesData.find(t => t.id === id);
    const blocsRaw = await chargerTemplateArbo(id);
    tplEnEdition = {
      id: tpl.id, nom: tpl.nom, categorie: tpl.categorie || '', description: tpl.description || '',
      blocs: blocsRaw.map(b => ({
        type: b.type || null,
        nombre_semaines: b.nombre_semaines || null,
        seances: (b.programme_seances || []).map(s => ({
          titre: s.titre,
          exercices: (s.programme_seance_exercices || []).map(l => {
            const ex = exercicesData.find(e=>e.id===l.exercice_id);
            return { exercice_id: l.exercice_id, nom: ex ? ex.nom : '(exercice supprimé)', groupe_musculaire: ex ? (ex.groupe_musculaire||null) : null, series: l.series, reps: l.reps, repos: l.repos, tempo: l.tempo, rir: l.rir, notes: l.notes || '' };
          })
        }))
      }))
    };
    if (!tplEnEdition.blocs.length) tplEnEdition.blocs = [blocVide()];
    tplEnEdition.blocs.forEach(b => { if (!b.seances.length) b.seances.push({ titre: 'Séance 1', exercices: [] }); });
  } else {
    tplEnEdition = { id: null, nom: '', categorie: '', description: '', blocs: [blocVide()] };

  renderEditeurTemplate();
}

function renderRepartitionInto(cont, blocs, selectedBlocIdx, context){
  if (!blocs || !blocs.length) { cont.innerHTML = ''; return; }
  const idx = Math.min(selectedBlocIdx ?? 0, blocs.length - 1);
  const multiBloc = blocs.length > 1;

  // Pills de sélection de bloc (si plusieurs blocs)
  const BLOCS_LABELS_SHORT = { metabolique: 'Méta', mecanique: 'Méca', force: 'Force' };
  const pills = multiBloc ? blocs.map((b, bi) => {
    const label = (b.type && BLOCS_LABELS_SHORT[b.type]) ? BLOCS_LABELS_SHORT[b.type] : `Bloc ${bi+1}`;
    const active = bi === idx;
    const fn = context === 'tpl'
      ? `_repartitionTplBlocIdx=${bi};renderRepartition()`
      : `_repartitionCpBlocIdx=${bi};_rerenderCpRepartition()`;
    return `<button onclick="${fn}" style="padding:3px 10px;border-radius:99px;border:1px solid ${active?'var(--accent)':'var(--hairline)'};background:${active?'var(--accent-soft)':'transparent'};color:${active?'var(--accent)':'var(--text-faint)'};font-size:11px;font-weight:${active?'700':'400'};cursor:pointer;">${esc(label)}</button>`;
  }).join('') : '';

  const bloc = blocs[idx];
  const map = {};
  (bloc.seances||[]).forEach(s => (s.exercices||[]).forEach(ex => {
    const g = ex.groupe_musculaire || 'Non défini';
    map[g] = (map[g]||0) + (parseInt(ex.series)||0);
  }));
  const total = Object.values(map).reduce((a,b)=>a+b,0);
  if (!total && !multiBloc) { cont.innerHTML = ''; return; }

  const sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  cont.innerHTML = `
    <div class="table-card" style="padding:16px;margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);">Répartition des séries</div>
        ${pills ? `<div style="display:flex;gap:4px;">${pills}</div>` : ''}
      </div>
      ${total ? sorted.map(([g,n])=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <div style="width:150px;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(g)}</div>
          <div style="flex:1;height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;">
            <div style="height:100%;width:${Math.round(n/total*100)}%;background:var(--accent);border-radius:4px;"></div>
          </div>
          <div style="width:50px;font-size:12px;font-weight:700;text-align:right;">${n} sér.</div>
        </div>`).join('')
      : `<div style="font-size:12px;color:var(--text-faint);">Aucun exercice dans ce bloc.</div>`}
    </div>`;
}

let dragExoSource = null;
function onDragStartExo(e, bi, si, ei){
  dragExoSource = { bi, si, ei };
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEndExo(){
  dragExoSource = null;
}
function onDropExo(e, bi, si, ei){
  e.preventDefault();
  const src = dragExoSource;
  dragExoSource = null;
  if (!src || src.bi !== bi || src.si !== si || src.ei === ei) { renderBlocsTemplate(); return; }
  const arr = tplEnEdition.blocs[bi].seances[si].exercices;
  const [moved] = arr.splice(src.ei, 1);
  const cible = src.ei < ei ? ei - 1 : ei;
  arr.splice(cible, 0, moved);
  renderBlocsTemplate();
}

function ajouterExerciceASeance(exerciceId){
  const ex = exercicesData.find(e => e.id === exerciceId);
  const { bi, si } = tplPickerCible;

  const blocType = tplEnEdition.blocs[bi].type;

  tplEnEdition.blocs[bi].seances[si].exercices.push({
    exercice_id: exerciceId, nom: ex.nom, groupe_musculaire: ex.groupe_musculaire||null,
    series: null, reps: reps || REPS_PAR_TYPE[blocType] || '', repos: repos || REPOS_PAR_TYPE[blocType] || '', tempo: '', rir: RIR_PAR_TYPE[blocType] || '', notes: '',

  } catch(e) { errEl.textContent = 'Erreur : ' + e.message; errEl.style.display = 'block'; }
}
async function assignerTemplateAuClient(templateId, clientId){
  if (exercicesData === null) exercicesData = await chargerExercices();
  if (templatesData === null) templatesData = await chargerTemplates();
  const tpl = templatesData.find(t => t.id === templateId);
  const blocsArbo = await chargerTemplateArbo(templateId);

  // Un seul programme actif à la fois pour ce client — on désactive les précédents plutôt que les supprimer
  // (garde l'historique de logs des anciens programmes accessible).
  await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true`, {
    method: 'PATCH', headers: supaHeaders(), body: JSON.stringify({ actif: false })
  });

  const resCp = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes`, {
    method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }),
    body: JSON.stringify({ client_id: clientId, nom: tpl.nom, actif: true })
  });
  if (!resCp.ok) throw new Error('supabase_' + resCp.status);
  const cp = (await resCp.json())[0];

  const blocsPayload = blocsArbo.map((b, bi) => ({ client_programme_id: cp.id, type: b.type || null, nombre_semaines: b.nombre_semaines || null, ordre: bi }));
  const resBlocs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(blocsPayload) });
  if (!resBlocs.ok) throw new Error('supabase_' + resBlocs.status);
  const blocsSaved = await resBlocs.json();
  const blocIdByOrdre = {};
  blocsSaved.forEach(b => { blocIdByOrdre[b.ordre] = b.id; });

  const seancesPayload = [];
  blocsArbo.forEach((b, bi) => {
    (b.programme_seances||[]).forEach((s, si) => {
      seancesPayload.push({ bloc_id: blocIdByOrdre[bi], titre: s.titre, ordre: si });
    });
  });
  let seancesSaved = [];
  if (seancesPayload.length) {
    const resSeances = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(seancesPayload) });
    if (!resSeances.ok) throw new Error('supabase_' + resSeances.status);
    seancesSaved = await resSeances.json();
  }
  const seanceIdByBlocOrdre = {};
  seancesSaved.forEach(s => { seanceIdByBlocOrdre[s.bloc_id + '|' + s.ordre] = s.id; });

  const exercicesPayload = [];
  blocsArbo.forEach((b, bi) => {
    const blocId = blocIdByOrdre[bi];
    (b.programme_seances||[]).forEach((s, si) => {
      const seanceId = seanceIdByBlocOrdre[blocId + '|' + si];
      (s.programme_seance_exercices||[]).forEach((ex, ei) => {
        const source = exercicesData.find(e => e.id === ex.exercice_id);
        exercicesPayload.push({
          seance_id: seanceId, exercice_id: ex.exercice_id, nom: source ? source.nom : '(exercice supprimé)',
          ordre: ei, series: ex.series, reps: ex.reps, repos: ex.repos, tempo: ex.tempo, rir: ex.rir, notes: ex.notes || null,
        });
      });
    });
  });
  if (exercicesPayload.length) {
    const resExo = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(exercicesPayload) });
    if (!resExo.ok) throw new Error('supabase_' + resExo.status);
  }
  return cp;
}

async function reparerDietesPartagees(){
  const statusEl = document.getElementById('reparationDietesStatus');
  const btn = document.getElementById('btnReparerDietes');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Réparation en cours…'; }
  const resultats = [];
  for (const { client, nom } of DIETES_A_REPARER_20260801) {
    if (statusEl) statusEl.innerHTML = resultats.map(r=>`<div>${esc(r)}</div>`).join('') + `<div style="color:var(--text-faint);">⏳ ${esc(client)} — "${esc(nom)}"…</div>`;
    try {
      const dietesRaw = await apiGasProd('listerDietes', client);
      const dietes = typeof dietesRaw === 'string' ? JSON.parse(dietesRaw) : (dietesRaw || []);
      const d = dietes.find(x => (x.nom || '').trim().toUpperCase() === nom.toUpperCase());
      if (!d) { resultats.push(`❌ ${client} — "${nom}" introuvable dans GAS (vérifier le nom exact)`); continue; }

      const detailRaw = await apiGasProd('chargerDieteParPosition', client, { ligneTitre: d.ligne, colTitre: d.col });
      const detail = typeof detailRaw === 'string' ? JSON.parse(detailRaw) : detailRaw;
      const repasGAS = detail.repas || [];

      // Toujours un nouveau template dédié — c'est justement l'objet de la réparation.
      const tplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ nom, client_only: true }) });
      if (!tplRes.ok) throw new Error('template ' + tplRes.status);
      const tpl = (await tplRes.json())[0];

      const saveAliments = async (repasId, aliments) => {
        if (!aliments || !aliments.length) return;
        const payload = aliments.map((a, ai) => {
          const q = a.qte || 1;
          return {
            repas_id: repasId, nom: a.nom, quantite_g: q, ordre: ai,
            kcal_par_100g: q > 0 ? (a.cals||0)/q*100 : 0,
            prot_par_100g: q > 0 ? (a.prot||0)/q*100 : 0,
            glu_par_100g:  q > 0 ? (a.glu||0)/q*100  : 0,
            lip_par_100g:  q > 0 ? (a.lip||0)/q*100  : 0,
          };
        });
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`,
          { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(payload) });
      };
      for (let ri = 0; ri < repasGAS.length; ri++) {
        const r = repasGAS[ri];
        const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
          { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id: tpl.id, nom: r.nom, ordre: ri, variante_index: 0 }) });
        if (!rRes.ok) continue;
        const savedR = (await rRes.json())[0];
        await saveAliments(savedR.id, r.aliments);
        const equivs = r.equivalences || [];
        for (let vi = 0; vi < equivs.length; vi++) {
          const eq = equivs[vi];
          const eqRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
            { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id: tpl.id, nom: eq.nom, ordre: ri, variante_index: vi + 1 }) });
          if (!eqRes.ok) continue;
          const savedEq = (await eqRes.json())[0];
          await saveAliments(savedEq.id, eq.aliments);
        }
      }

      await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(client)}&nom=eq.${encodeURIComponent(nom)}`,
        { method:'PATCH', headers:supaHeaders(), body:JSON.stringify({ diete_template_id: tpl.id }) });

      resultats.push(`✅ ${client} — "${nom}" réparée (${repasGAS.length} repas restaurés depuis GAS)`);
    } catch(e) {
      resultats.push(`❌ ${client} — "${nom}" — erreur : ${e.message}`);
    }
    if (statusEl) statusEl.innerHTML = resultats.map(r=>`<div>${esc(r)}</div>`).join('');
  }
  dieteTemplatesData = null;
  if (btn) { btn.disabled = false; btn.textContent = '🔧 Relancer'; }
  if (statusEl) statusEl.innerHTML += `<div style="margin-top:6px;color:var(--text-faint);">Terminé.</div>`;
}

async function marquerTraite(){
  if (!bilanDetailState._supabaseBilanId) return;
  try {
    const traiteAt = new Date().toISOString();
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/bilans?id=eq.${bilanDetailState._supabaseBilanId}`,
      { method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ coach_traite: true, coach_traite_at: traiteAt }) }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    bilanDetailState.coachTraite = true;
    if (_ficheBilans) {
      const b = _ficheBilans.find(x => x.id === bilanDetailState._supabaseBilanId);
      if (b) { b.coach_traite = true; b.coach_traite_at = traiteAt; }

    const ba = (data.bilansAll || []).find(b => b.id === bilanDetailState._supabaseBilanId);
    if (ba) { ba.coach_traite = true; ba.coach_traite_at = traiteAt; }
    if (state.nav === 'bilan-detail') renderMain();
  } catch(e) { alert('Erreur : ' + e.message); }
}

// Dernière connexion : pour un client basculé en Supabase only, on affiche sa
// vraie dernière connexion Supabase (écrite à chaque login réussi côté client_profils.derniere_connexion)
// plutôt que l'ancienne donnée GAS (obsolète dès qu'il ne se connecte plus via l'app GAS).
function _fmtDerniereConnexion(c){
  if (c.supabaseOnlyActif) {
    if (!c.derniereConnexionSupa) return 'Jamais connecté';
    const d = new Date(c.derniereConnexionSupa);
    return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }
  return c.dernConnexion || 'Jamais connecté';
}

// Pour un client supabase_only, "Verrouiller l'accès" coupe désormais sa connexion à
// l'app (client_profils.verrouille_app) — plus la même chose que l'ancien verrouillage
// GAS (verrouilerAccesClient), qui touche les Google Sheets et reste utilisé tel quel
// pour les clients encore sur l'ancien système. Bascule manuelle, client par client.
async function toggleVerrou(id, verrouille){
  const c = (data.clients||[]).find(cl => cl.id === id);
  try {
    if (c && c.supabaseOnlyActif) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(id)}`, {
        method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ verrouille_app: !verrouille })
      });
      if (!res.ok) throw new Error('supabase_' + res.status);
    } else {
      await apiAs(verrouille ? 'deverrouilerAccesClient' : 'verrouilerAccesClient', id);
    }
    await rafraichir(); if (state.nav==='clients') renderTable();
  } catch(e) { alert('Erreur : ' + e.message); }
}
// Bascule client_profils.supabase_only à true — dernière étape de la migration : la
// connexion du client passera entièrement par Supabase (plus GAS). Upsert car un client
// tout juste migré peut ne pas encore avoir de ligne client_profils.
async function togglerSupabaseOnly(id){
  if (!confirm('Passer ce client en Supabase only ? Sa connexion utilisera désormais uniquement Supabase (plus GAS).')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=representation,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: id, supabase_only: true })
    });
    if (!res.ok) throw new Error('supabase_' + res.status);
    await rafraichir();
    if (state.nav==='clients') renderTable();
    if (state.nav==='fiche-client' && state.selected===id) openPanel(id);
  } catch(e) { alert('Erreur : ' + e.message); }
}

  state.selected = id;

  ficheData = { loaded:false, profil:null, tous_programmes:[], programme:null, tous_dietes:[], diete:null, progression:null, suivi:null, roadmap:null, xpData:null };
  state.nav = 'fiche-client';

      chargerProgression(id).catch(()=>[]),
      chargerSuivi(id).catch(()=>[]),
      chargerRoadmap(id).catch(()=>[]),

async function chargerProgrammeActif(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true&order=created_at.desc&limit=1`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const rows = await res.json();
  if (!rows.length) return null;
  const cp = rows[0];
  const resArbo = await fetch(
    `${SUPABASE_URL}/rest/v1/client_programme_blocs?client_programme_id=eq.${cp.id}&order=ordre.asc` +
    `&select=*,client_programme_seances(*,client_programme_exercices(*))` +
    `&client_programme_seances.order=ordre.asc&client_programme_seances.client_programme_exercices.order=ordre.asc`,
    { headers: supaHeaders() }
  );
  const blocs = resArbo.ok ? await resArbo.json() : [];
  const exIds = [];
  blocs.forEach(b => (b.client_programme_seances||[]).forEach(s => (s.client_programme_exercices||[]).forEach(ex => exIds.push(ex.id))));
  let logs = {};
  if (exIds.length) {
    const resLogs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exIds.join(',')})&order=semaine.asc,numero_serie.asc`, { headers: supaHeaders() });
    if (resLogs.ok) (await resLogs.json()).forEach(l => { logs[l.client_programme_exercice_id+'|'+l.semaine+'|'+l.numero_serie] = l; });
  }
  return Object.assign({}, cp, { blocs, logs });
}

    _ficheProtocoleClientId = c.id;
    _ficheProtocole = undefined;
    _ficheProtocoleLoading = false;
  }
  if (_ficheProtocole === undefined) {
    if (!_ficheProtocoleLoading) {
      _ficheProtocoleLoading = true;
      fetch(`${SUPABASE_URL}/rest/v1/client_protocoles?client_id=eq.${encodeURIComponent(c.id)}&order=created_at.desc&limit=1&select=*,client_protocole_molecules(*)`, { headers: supaHeaders() })
        .then(r => r.json())
        .then(rows => {
          _ficheProtocole = Array.isArray(rows) && rows.length ? rows[0] : null;

          const el = document.getElementById('ficheTabContent');
          if (el && ficheTab === 'protocole') el.innerHTML = renderFicheProtocoleTab(c);

// Plage de dates de la semaine couverte par un bilan : bornée par date_validation (fin réelle)
// quand disponible, sinon par la prochaine échéance jour_bilan calculée depuis created_at (bilan
// encore en cours) — cohérent avec _weekRange (page de détail) et le libellé semaine_label
// auto-corrigé côté client (bilan.js). Ne dépend PAS de jour_bilan quand date_validation est
// connue (fin - 6 jours suffit, indépendant du jour de la semaine).
function _bilanPeriodeLabel(b, jourBilanNom) {
  let fin;
  if (b.date_validation) {
    fin = new Date(b.date_validation + 'T12:00:00');
  } else if (b.created_at) {
    fin = _bilanWeekBounds(jourBilanNom, new Date(b.created_at)).fin;
  } else {
    return b.semaine_label || '—';
  }
  const debut = new Date(fin); debut.setDate(fin.getDate() - 6);
  const fmt = d => d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
  return `${fmt(debut)} → ${fmt(fin)}`;
}

// ── Mensuration charts — helpers partagés ────────────────────────────────────
window._mensCharts = {};
const MENS_COLS   = ['fessiers','cuisses','mollets','poitrine','epaules','bras'];
const MENS_COLORS = ['#f59e0b','#a78bfa','#3ecf8e','#f97316','#4f8ef7','#e05c5c'];
const MENS_LABELS = ['Fessiers','Cuisses','Mollets','Poitrine','Épaules','Bras'];

function _buildMensChart(id, rows, keys, colors, labels, unit) {
  const W=560,H=180,PL=44,PR=14,PT=16,PB=34,cw=W-PL-PR,ch=H-PT-PB;
  const allVals=keys.flatMap(k=>rows.map(r=>parseFloat(r[k])).filter(v=>!isNaN(v)&&v>0));
  if(allVals.length<2) return '';
  const rng=Math.max(...allVals)-Math.min(...allVals), pad=rng<2?1:Math.ceil(rng*0.1);
  const yMin=Math.floor(Math.min(...allVals)-pad), yMax=Math.ceil(Math.max(...allVals)+pad);
  const n=rows.length;
  const xS=i=>+(PL+(i/(n-1||1))*cw).toFixed(2);
  const yS=v=>+(PT+ch-((v-yMin)/((yMax-yMin)||1))*ch).toFixed(2);
  const xs=rows.map((_,i)=>xS(i));
  window._mensCharts[id]={rows,keys,colors,labels,xs,W,H,PL,PT,ch,unit:unit||''};
  const defs=keys.map((k,ki)=>`<linearGradient id="${id}_g${ki}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${colors[ki]}" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="${colors[ki]}" stop-opacity="0"/>
  </linearGradient>`).join('');
  const yGrid=[0.25,0.5,0.75].map(f=>{const v=yMin+f*(yMax-yMin);
    return `<line x1="${PL}" y1="${yS(v)}" x2="${PL+cw}" y2="${yS(v)}" stroke="var(--hairline)" stroke-width="0.5" stroke-dasharray="3 3"/>
      <text x="${PL-5}" y="${+(yS(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-faint)">${Math.round(v)}</text>`;
  }).join('');
  const maxL=Math.min(6,n), stepL=Math.floor((n-1)/(maxL-1||1));
  const xLabels=Array.from({length:maxL},(_,i)=>{
    const idx=i===maxL-1?n-1:i*stepL, d=(rows[idx].date||'').split('-');
    return `<text x="${xs[idx]}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--text-faint)">${d.length===3?d[2]+'/'+d[1]:''}</text>`;
  }).join('');
  const areas=keys.map((k,ki)=>{
    const pts=rows.map((r,i)=>{const v=parseFloat(r[k]);return isNaN(v)||v<=0?null:[xs[i],yS(v)];}).filter(Boolean);
    if(pts.length<2) return '';
    return `<path d="${pts.map((p,i)=>(i===0?'M':'L')+p[0]+','+p[1]).join(' ')} L${pts[pts.length-1][0]},${PT+ch} L${pts[0][0]},${PT+ch} Z" fill="url(#${id}_g${ki})"/>`;
  }).join('');
  const lines=keys.map((k,ki)=>{
    const pts=rows.map((r,i)=>{const v=parseFloat(r[k]);return isNaN(v)||v<=0?null:xs[i]+','+yS(v);}).filter(Boolean);
    return pts.length>=2?`<polyline points="${pts.join(' ')}" fill="none" stroke="${colors[ki]}" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  }).join('');
  const dots=keys.map((k,ki)=>rows.map((r,i)=>{const v=parseFloat(r[k]);
    return isNaN(v)||v<=0?'':`<circle id="${id}_d${ki}_${i}" cx="${xs[i]}" cy="${yS(v)}" r="1.8" fill="${colors[ki]}" stroke="var(--surface-1)" stroke-width="1.2"/>`;
  }).join('')).join('');
  const axes=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+ch}" stroke="var(--hairline)" stroke-width="1"/>
    <line x1="${PL}" y1="${PT+ch}" x2="${PL+cw}" y2="${PT+ch}" stroke="var(--hairline)" stroke-width="1"/>`;
  const vline=`<line id="${id}_vl" x1="${xs[0]}" y1="${PT}" x2="${xs[0]}" y2="${PT+ch}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 2" opacity="0.5" display="none"/>`;
  const ov=`<rect x="${PL}" y="${PT}" width="${cw}" height="${ch}" fill="transparent" onmousemove="_mensHover(event,'${id}')" onmouseleave="_mensHoverOut('${id}')"/>`;
  const tip=`<div id="${id}_tip" style="display:none;position:absolute;top:10px;left:10px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text);pointer-events:none;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.2);white-space:nowrap;"></div>`;
  const legend=`<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);margin-top:8px;margin-bottom:4px;">
    ${keys.map((k,i)=>`<span><span style="color:${colors[i]};margin-right:3px;">●</span>${labels[i]}</span>`).join('')}
  </div>`;
  return `<div style="position:relative;">${tip}<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${axes}${yGrid}${xLabels}${areas}${lines}${dots}${vline}${ov}</svg></div>${legend}`;
}

function _mensHover(evt, cid) {
  const d=window._mensCharts[cid]; if(!d) return;
  const svg=evt.currentTarget.closest('svg');
  const rect=svg.getBoundingClientRect();
  const mx=(evt.clientX-rect.left)*(d.W/rect.width);
  let ni=0, minDist=Infinity;
  d.xs.forEach((x,i)=>{const dist=Math.abs(x-mx);if(dist<minDist){minDist=dist;ni=i;}});
  const vl=document.getElementById(cid+'_vl');
  if(vl){vl.setAttribute('x1',d.xs[ni]);vl.setAttribute('x2',d.xs[ni]);vl.removeAttribute('display');}
  const row=d.rows[ni];
  const dateStr=(row.date||'').split('-').reverse().join('/');
  const vals=d.keys.map((k,ki)=>{
    const v=parseFloat(row[k]); if(isNaN(v)||v<=0) return '';
    return `<div style="margin-top:3px;"><span style="color:${d.colors[ki]};margin-right:4px;">●</span>${d.labels[ki]} : <strong>${v}</strong>${d.unit}</div>`;
  }).filter(Boolean).join('');
  const tip=document.getElementById(cid+'_tip');
  if(tip){
    tip.innerHTML=`<div style="font-size:10px;font-weight:700;color:var(--text-faint);margin-bottom:3px;">${dateStr}</div>${vals}`;
    const xRatio=rect.width/d.W;
    let lx=d.xs[ni]*xRatio+14;
    if(lx+160>rect.width) lx=d.xs[ni]*xRatio-170;
    tip.style.left=lx+'px'; tip.style.display='block';
  }
}

function _mensHoverOut(cid) {
  const vl=document.getElementById(cid+'_vl'); if(vl) vl.setAttribute('display','none');
  const tip=document.getElementById(cid+'_tip'); if(tip) tip.style.display='none';
}

// selKeys : Set des mensurations actives — multi-sélection, chaque pill toggle son
// appartenance au Set (au moins une reste sélectionnée) pour superposer plusieurs
// courbes sur le même graphique (_buildMensChart accepte déjà keys/colors/labels en tableau).
function _renderMens2Section(rows, idBase, selKeys, setterFn) {
  if(!rows||rows.length<2) return '';
  const actives=MENS_COLS.filter(k=>selKeys.has(k));
  if(!actives.length) return '';
  const pills=MENS_COLS.map((k,i)=>`<button onclick="${setterFn}('${k}')"
    style="padding:3px 11px;border-radius:99px;border:1px solid ${selKeys.has(k)?MENS_COLORS[i]:'var(--hairline)'};background:${selKeys.has(k)?MENS_COLORS[i]+'22':'transparent'};color:${selKeys.has(k)?MENS_COLORS[i]:'var(--text-faint)'};font-size:11px;font-weight:${selKeys.has(k)?'700':'400'};cursor:pointer;transition:all .15s;">${MENS_LABELS[i]}</button>`).join('');
  const colors=actives.map(k=>MENS_COLORS[MENS_COLS.indexOf(k)]);
  const labels=actives.map(k=>MENS_LABELS[MENS_COLS.indexOf(k)]);
  // _buildMensChart renvoie '' silencieusement si la sélection active n'a pas assez de
  // valeurs numériques (même si d'autres colonnes en ont) — sans ce filet la carte reste vide.
  const chart=_buildMensChart(idBase+'_'+actives.join('_'), rows, actives, colors, labels, ' cm')
    || `<div style="font-size:13px;color:var(--text-faint);text-align:center;padding:20px;">Pas assez de données pour ${actives.map(k=>MENS_LABELS[MENS_COLS.indexOf(k)]).join('/')}.</div>`;
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${pills}</div>${chart}`;
}

function _setFicheMensChart2(key) {
  if(_ficheMensChart2Keys.has(key)){ if(_ficheMensChart2Keys.size>1) _ficheMensChart2Keys.delete(key); }
  else _ficheMensChart2Keys.add(key);
  const el=document.getElementById('ficheMensChart2');
  if(el&&_ficheMensurations) el.innerHTML=_renderMens2Section(_ficheMensurations,'fiche_c2',_ficheMensChart2Keys,'_setFicheMensChart2');
}

function _setPageMensChart2(key) {
  if(_pageMensChart2Keys.has(key)){ if(_pageMensChart2Keys.size>1) _pageMensChart2Keys.delete(key); }
  else _pageMensChart2Keys.add(key);
  const el=document.getElementById('pageMensChart2');
  if(el&&_pageMensurationsRows.length) el.innerHTML=_renderMens2Section(_pageMensurationsRows,'page_c2',_pageMensChart2Keys,'_setPageMensChart2');
}

function renderFicheMensurationsTab(c){

  if (_ficheMensurations === null) {

      fetch(`${SUPABASE_URL}/rest/v1/mensurations?client_id=eq.${encodeURIComponent(c.id)}&order=date.asc`, { headers: supaHeaders() })
        .then(r => r.json())

          const el = document.getElementById('ficheTabContent');

    </div>`;
  }

  const rows = _ficheMensurations;
  const chart1 = rows.length>=2 ? _buildMensChart('fiche_c1', rows, ['poids','mesure'], ['var(--accent)','#4caf50'], ['Poids (kg)','Tour de taille (cm)'], '') : '';
  const hasAutres = rows.some(r=>MENS_COLS.some(k=>parseFloat(r[k])>0));

      <td>${cm(r.fessiers)}</td>
      <td>${cm(r.cuisses)}</td>
      <td>${cm(r.mollets)}</td>
      <td>${cm(r.poitrine)}</td>
      <td>${cm(r.epaules)}</td>
      <td>${cm(r.bras)}</td>
      <td style="white-space:nowrap;">
        <button class="btn" style="font-size:11px;padding:3px 8px;" onclick="ouvrirModalMensuration('${c.id}',${r.id})">Éditer</button>
        <button class="btn" style="font-size:11px;padding:3px 8px;color:var(--critical);margin-left:4px;" onclick="supprimerMensuration(${r.id},'${c.id}')">×</button>
      </td>

  return `<div class="fiche-card">
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      <button class="btn primary" onclick="ouvrirModalMensuration('${c.id}',null)">+ Ajouter</button>
    </div>

    ${chart2Section ? `<h4 style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin:20px 0 10px;">Autres mensurations</h4><div id="ficheMensChart2">${chart2Section}</div>` : ''}
    <div class="table-scroll" style="margin-top:20px;"><table class="alim-table">
      <thead><tr><th>Date</th><th>Phase</th><th>Poids</th><th>Tour taille</th><th>Fessiers</th><th>Cuisses</th><th>Mollets</th><th>Poitrine</th><th>Épaules</th><th>Bras</th><th></th></tr></thead>
      <tbody>${tableRows}</tbody>

const _MOIS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
function _ficheMoisCourantKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function _ficheRenderStatutPaiement(p, clientId){
  const moisKey = _ficheMoisCourantKey();
  const [y, m] = moisKey.split('-');
  const moisLabel = `${_MOIS_FR[+m-1]} ${y}`;
  const dejaPaye = p.dernier_mois_paye === moisKey;
  return `
    <div class="fiche-field" style="background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div>
        <div style="font-size:13px;font-weight:600;">Paiement de ${moisLabel}</div>
        <div style="font-size:11.5px;color:${dejaPaye?'var(--success)':'var(--text-faint)'};margin-top:2px;">${dejaPaye ? '✓ Marqué payé' : 'Pas encore marqué payé'}</div>
      </div>
      <button class="btn ${dejaPaye?'':'primary'}" style="flex-shrink:0;" onclick="toggleMoisPaye('${clientId}',${dejaPaye})">${dejaPaye ? 'Annuler' : 'Marquer payé'}</button>
    </div>`;
}
async function toggleMoisPaye(clientId, dejaPaye){
  const nouveauMois = dejaPaye ? null : _ficheMoisCourantKey();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}`, {
      method:'PATCH', headers:supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify({ dernier_mois_paye: nouveauMois })
    });
    if (ficheData.profil && state.selected === clientId) ficheData.profil.dernier_mois_paye = nouveauMois;
    const c = data.clients && data.clients.find(x => x.id === clientId);
    if (c) c.dernier_mois_paye = nouveauMois;
    if (state.nav==='fiche-client') renderMain();
    else if (state.nav==='clients') renderTable();
  } catch(e){ alert('Erreur : ' + e.message); }
}

// Calendrier mensuel : un bloc par mois couvert par les phases (déborde sur le mois
// suivant → bloc supplémentaire à côté), chaque jour coloré selon la phase qui le couvre.
const RM_JOURS_SEMAINE = ['L','M','M','J','V','S','D'];
function _rmCalendarMonths(phasesAvecDates){
  const min = phasesAvecDates.reduce((a,p)=> p.date_debut<a?p.date_debut:a, phasesAvecDates[0].date_debut);
  const max = phasesAvecDates.reduce((a,p)=> p.date_fin>a?p.date_fin:a, phasesAvecDates[0].date_fin);
  const [y0,m0] = min.split('-').map(Number);
  const [y1,m1] = max.split('-').map(Number);
  const months = [];
  let y=y0, m=m0;
  while (y<y1 || (y===y1 && m<=m1)) { months.push([y,m]); m++; if (m>12){ m=1; y++; } }
  return months;
}
function _rmCalendrierHtml(phases, typeFn){
  const withDates = phases.filter(p => p.date_debut && p.date_fin);
  if (!withDates.length) return '';
  const months = _rmCalendarMonths(withDates);
  const todayStr = _rmIsoLocal(new Date());
  const moisNoms = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const monthsHtml = months.map(([y,m]) => {
    const daysInMonth = new Date(y, m, 0).getDate();
    const firstWeekday = (new Date(y, m-1, 1).getDay() + 6) % 7; // lundi=0
    const cells = [];
    for (let i=0;i<firstWeekday;i++) cells.push('<div></div>');
    for (let d=1; d<=daysInMonth; d++) {
      const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const phase = withDates.find(p => p.date_debut<=dateStr && dateStr<=p.date_fin);
      const t = phase ? typeFn(phase.type) : null;
      const isToday = dateStr===todayStr;
      cells.push(`<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;${t?`background:${t.color}26;color:${t.color};font-weight:700;`:'color:var(--text-faint);'}${isToday?`box-shadow:inset 0 0 0 2px ${t?t.color:'var(--accent)'};`:''}" title="${t?esc(t.label):''}">${d}</div>`);
    }
    return `<div style="flex:0 0 auto;width:168px;">
      <div style="font-size:11px;font-weight:700;margin-bottom:6px;text-align:center;">${moisNoms[m-1]} ${y}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px;">
        ${RM_JOURS_SEMAINE.map(j=>`<div style="text-align:center;font-size:8px;color:var(--text-faint);">${j}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">${cells.join('')}</div>
    </div>`;
  }).join('');
  return `<div style="margin-top:20px;">
    <div style="font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Calendrier</div>
    <div style="display:flex;flex-wrap:wrap;gap:14px;">${monthsHtml}</div>
  </div>`;
}

// Auto-grandissement du textarea au fil de la frappe (pas de scrollbar interne).
function rmAutoGrow(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

// Appelé une fois après chaque (re)render de l'onglet Roadmap pour donner leur
// hauteur initiale aux textarea déjà remplis (sinon ils restent à min-height).
function rmAutoGrowAll(){
  document.querySelectorAll('[data-rm-objectif]').forEach(rmAutoGrow);
}

function _rmJoursConsole(p){
  const d = new Date(p.date_debut), f = new Date(p.date_fin);
  return Math.max(1, Math.round((f-d)/86400000) + 1);
}
// Affiche la durée d'une phase en semaines/mois si elle tombe exactement pile
// (mois = mois calendaire réel via setMonth, pas une approximation 30 jours —
// cohérent avec _rmComputeFin/_rmAppliquerDuree), sinon en jours.
function _rmFmtDuree(dateDebut, dateFin){
  if (!dateDebut || !dateFin) return '';
  const jours = Math.round((new Date(dateFin) - new Date(dateDebut))/86400000) + 1;
  if (jours <= 0) return '';
  for (let n = 1; n <= 24; n++) {
    const fin = _rmAddDays(_rmAddMonths(dateDebut, n), -1);
    if (fin === dateFin) return n === 1 ? '1 mois' : n + ' mois';
    if (fin > dateFin) break;
  }
  if (jours % 7 === 0) { const s = jours / 7; return s === 1 ? '1 semaine' : s + ' semaines'; }
  return jours + (jours === 1 ? ' jour' : ' jours');
}
// toISOString() convertit en UTC avant de trancher la date : à minuit heure
// locale (Europe/Paris, UTC+1/+2), ça fait reculer la date d'un jour (ex :
// 4 semaines depuis le 01/08 donnait le 27/08 au lieu du 28/08). On reconstruit
// la date depuis les composants locaux du Date pour éviter ce décalage.
function _rmIsoLocal(d){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function _rmAddDays(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return _rmIsoLocal(d);
}
function _rmAddMonths(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setMonth(d.getMonth()+n);
  return _rmIsoLocal(d);
}
const RM_DUREES_JOURS = { '7j':7, '2sem':14, '3sem':21, '4sem':28 };
const RM_DUREES_MOIS = { '1mois':1, '2mois':2 };
const RM_DUREE_OPTIONS = [
  { key:'7j',    label:'7 jours' },
  { key:'2sem',  label:'2 semaines' },
  { key:'3sem',  label:'3 semaines' },
  { key:'4sem',  label:'4 semaines' },
  { key:'1mois', label:'1 mois' },
  { key:'2mois', label:'2 mois' },
];
// Date de fin par défaut pour une durée donnée : toujours `durée - 1 jour` après
// le début (pas de calage forcé sur un dimanche) — si la phase démarre un lundi,
// une durée en semaines tombera donc naturellement un dimanche. Le coach peut
// ensuite modifier la date de fin à la main.
function _rmComputeFin(dateDebut, dureeKey){
  if (RM_DUREES_JOURS[dureeKey]) return _rmAddDays(dateDebut, RM_DUREES_JOURS[dureeKey] - 1);
  return _rmAddDays(_rmAddMonths(dateDebut, RM_DUREES_MOIS[dureeKey]||1), -1);
}

// Ajoute une phase directement (pas de dialogue) : enchaînée juste après la
// dernière phase existante (durée par défaut 4 semaines), le coach ajuste
// ensuite à la main sur le bloc — champs date, boutons ‹7j/7j›, ou les
// boutons de durée rapide (rmAppliquerDuree) qui recalculent la date de fin.
async function rmAjouterPhase(clientId){
  const phases = (Array.isArray(ficheData.roadmap)?ficheData.roadmap:[]).slice().sort((a,b)=>(a.date_debut||'').localeCompare(b.date_debut||''));
  const last = phases[phases.length-1];
  const date_debut = last ? _rmAddDays(last.date_fin,1) : _rmIsoLocal(new Date());
  const date_fin = _rmComputeFin(date_debut, '4sem');
  try {
    await sauverRoadmapApi(clientId, null, { type: last?last.type:'cut', date_debut, date_fin, objectif:'' });
    ficheData.roadmap = await chargerRoadmap(clientId);
    setFicheTab('roadmap');
    rmAutoGrowAll();
  } catch(e){ alert('Erreur : ' + e.message); }
}

// Boutons de durée rapide sur un bloc de phase : recalcule la date de fin à
// partir de la date de début actuelle du bloc et sauvegarde immédiatement.
function rmAppliquerDuree(id, clientId, dureeKey){
  const phases = Array.isArray(ficheData.roadmap) ? ficheData.roadmap : [];
  const p = phases.find(x=>x.id===id);
  if (!p) return;
  rmChangerChamp(id, clientId, 'date_fin', _rmComputeFin(p.date_debut, dureeKey));
}

// Recolle les phases suivantes (par ordre chronologique) après modification
// des dates de la phase `phaseId` : chaque phase après elle doit commencer
// exactement le lendemain de la fin de celle qui la précède (pas de trou, pas
// de chevauchement), en conservant sa propre durée. S'arrête dès qu'une phase
// est déjà correctement positionnée (tout ce qui suit l'est forcément aussi).
async function rmCascaderSuite(clientId, phaseId){
  const phases = (Array.isArray(ficheData.roadmap) ? ficheData.roadmap : []).slice().sort((a,b)=>(a.date_debut||'').localeCompare(b.date_debut||''));
  const idx = phases.findIndex(p => p.id === phaseId);
  if (idx === -1) return;
  let ancre = phases[idx];
  for (let i = idx + 1; i < phases.length; i++) {
    const p = phases[i];
    const nouveauDebut = _rmAddDays(ancre.date_fin, 1);
    if (nouveauDebut === p.date_debut) { ancre = p; continue; }
    const dureeJours = Math.round((new Date(p.date_fin) - new Date(p.date_debut)) / 86400000);
    const nouveauFin = _rmAddDays(nouveauDebut, dureeJours);
    await sauverRoadmapApi(clientId, p.id, Object.assign({}, p, { date_debut: nouveauDebut, date_fin: nouveauFin }));
    p.date_debut = nouveauDebut; p.date_fin = nouveauFin;
    ancre = p;
  }
}

// Type/dates : sauvegarde immédiate + re-render (met à jour timeline + tri).
async function rmChangerChamp(id, clientId, champ, valeur){
  const phases = Array.isArray(ficheData.roadmap) ? ficheData.roadmap : [];
  const p = phases.find(x=>x.id===id);
  if (!p) return;
  const maj = Object.assign({}, p, { [champ]: valeur });
  if (maj.date_fin < maj.date_debut) { alert('La date de fin doit être après la date de début.'); setFicheTab('roadmap'); return; }
  try {
    await sauverRoadmapApi(clientId, id, maj);
    ficheData.roadmap = await chargerRoadmap(clientId);
    if (champ === 'date_debut' || champ === 'date_fin') {
      await rmCascaderSuite(clientId, id);
      ficheData.roadmap = await chargerRoadmap(clientId);
    }
    setFicheTab('roadmap');
    rmAutoGrowAll();
  } catch(e){ alert('Erreur : ' + e.message); }
}

// Décale toute la phase (début + fin) de `deltaJours` — pratique pour repousser
// une phase suite à un bilan sans avoir à retoucher les deux dates à la main.
async function rmDecaler(id, clientId, deltaJours){
  const phases = Array.isArray(ficheData.roadmap) ? ficheData.roadmap : [];
  const p = phases.find(x=>x.id===id);
  if (!p) return;
  const maj = Object.assign({}, p, { date_debut:_rmAddDays(p.date_debut,deltaJours), date_fin:_rmAddDays(p.date_fin,deltaJours) });
  try {
    await sauverRoadmapApi(clientId, id, maj);
    ficheData.roadmap = await chargerRoadmap(clientId);
    await rmCascaderSuite(clientId, id);
    ficheData.roadmap = await chargerRoadmap(clientId);
    setFicheTab('roadmap');
    rmAutoGrowAll();
  } catch(e){ alert('Erreur : ' + e.message); }
}

// Objectif : sauvegarde debounced SANS re-render (sinon le curseur/focus saute
// à chaque frappe) — on met juste à jour le cache local une fois la requête ok.
let _rmObjectifTimers = {};
function rmObjectifChange(id, clientId, valeur){
  clearTimeout(_rmObjectifTimers[id]);
  _rmObjectifTimers[id] = setTimeout(async () => {
    const phases = Array.isArray(ficheData.roadmap) ? ficheData.roadmap : [];
    const p = phases.find(x=>x.id===id);
    if (!p) return;
    try {
      await sauverRoadmapApi(clientId, id, Object.assign({}, p, { objectif: valeur }));
      p.objectif = valeur;
    } catch(e) { /* échec silencieux : la valeur reste affichée, retentera au prochain champ modifié */ }
  }, 700);
}

async function supprimerRoadmapPhase(id, clientId) {
  if (!confirm('Supprimer cette phase de roadmap ?')) return;
  try {

    ficheData.roadmap = await chargerRoadmap(clientId);
    if (state.nav==='fiche-client' && state.selected===clientId) { renderMain(); rmAutoGrowAll(); }
  } catch(e) { alert('Erreur : ' + e.message); }
}

function renderFicheProgDetail(prog){
  const blocs = prog.blocs || [];
  const logs = prog.logs || {};
  const totalSemaines = blocs.reduce((s,b)=>s+(b.nombre_semaines||1),0)||1;
  const nbSeances = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).length,0);
  const nbExo = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).reduce((s2,se)=>s2+(se.client_programme_exercices||[]).length,0),0);
  // ficheSemaine est une semaine GLOBALE (1..totalSemaines, cumulée sur tous les blocs) ;
  // les logs sont stockés avec une semaine LOCALE au bloc — même conversion que
  // renderProgLogsPage, sinon les blocs après le premier ne retrouvent jamais leurs logs.
  const blocOffset = blocs.map((_, bi) => { let off=0; for(let i=0;i<bi;i++) off += (blocs[i].nombre_semaines||1); return off; });
  return `
    <div class="fiche-prog">
      <div class="nom">${esc(prog.nom||'Programme sans nom')}</div>
      <div class="meta">${nbSeances} séance${nbSeances>1?'s':''} · ${nbExo} exercice${nbExo>1?'s':''} · assigné le ${prog.created_at?new Date(prog.created_at).toLocaleDateString('fr-FR'):'—'}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin:12px 0 10px;">
      <button class="btn" style="padding:5px 11px;" onclick="ficheSemaineChanger(-1)">‹</button>
      <span style="font-size:13px;font-weight:700;">Semaine ${ficheSemaine}${totalSemaines>1?' / '+totalSemaines:''}</span>
      <button class="btn" style="padding:5px 11px;" onclick="ficheSemaineChanger(1)">›</button>
    </div>
    ${blocs.map((b,bi)=>{
      const semLocale = ficheSemaine - (blocOffset[bi]||0);
      return `
      ${b.type?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:10px 0 4px;">${esc(BLOC_LABELS_COACH[b.type]||b.type)}${b.nombre_semaines?' · '+b.nombre_semaines+' sem.':''}</div>`:''}
      ${(b.client_programme_seances||[]).map(s=>`
        <div style="background:var(--surface-2);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;">
          <div style="padding:9px 12px;font-weight:700;font-size:13px;border-bottom:1px solid var(--hairline);">${esc(s.titre)}</div>
          ${(s.client_programme_exercices||[]).map(ex=>{
            const nbSeries = ex.series||1;
            let seriesHtml='';
            for(let sr=1;sr<=nbSeries;sr++){
              const l=logs[ex.id+'|'+semLocale+'|'+sr]||{};
              const hasLog = l.charge!=null||l.reps!=null;
              seriesHtml+=`<div style="display:flex;gap:8px;align-items:center;font-size:12px;padding:2px 0;">
                <span style="color:var(--text-faint);width:16px;">#${sr}</span>
                <span style="${hasLog?'color:var(--text);font-weight:600;':'color:var(--text-faint);'}">
                  ${hasLog?(l.charge!=null?l.charge+'kg ':'')+''+(l.reps!=null?l.reps+' reps ':'')+''+(l.rir?'RIR '+l.rir:''):'—'}
                </span>
              </div>`;
            }
            return `<div style="padding:8px 12px;border-top:1px solid var(--hairline);">
              <div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">${esc(ex.nom)}</div>
              <div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">Cible : ${ex.series||'—'}×${esc(ex.reps||'—')}${ex.repos?' · repos '+esc(ex.repos):''}${ex.rir?' · RIR '+esc(ex.rir):''}</div>
              ${seriesHtml}
              ${(()=>{const cl=logs[ex.id+'|'+semLocale+'|1'];return cl&&cl.commentaire?`<div style="font-size:11px;color:var(--text-muted);margin-top:4px;font-style:italic;">${esc(cl.commentaire)}</div>`:'';})()}
            </div>`;
          }).join('')||`<div style="padding:8px 12px;font-size:12px;color:var(--text-faint);">Aucun exercice.</div>`}
        </div>`).join('')}
    `;
    }).join('')||`<div class="fiche-prog-empty">Aucune séance dans ce programme.</div>`}`;
}

function ficheSemaineChanger(delta){
  ficheSemaine = Math.max(1, ficheSemaine + delta);
  if (state.nav==='fiche-client') renderMain();
}

// ── Logs d'un programme assigné ──────────────────────────────────────
function ouvrirLogsProgramme(progId){
  state.nav = 'prog-logs';
  state.progLogsId = progId;
  progLogsData = { loaded:false, programme:null, blocs:[], logs:{} };
  progLogsSemaineParBloc = {};
  _progLogsView = 'semaine';
  _progLogsCollapsed = new Set();
  renderSidebar();
  renderMain();
  const exLoad = exercicesData === null ? chargerExercices().then(d=>{ exercicesData=d; }).catch(()=>{}) : Promise.resolve();
  Promise.all([chargerProgrammeById(progId), exLoad]).then(([prog]) => {
    const blocs = prog ? prog.blocs : [];
    const logs = prog ? prog.logs : {};
    // Nb de semaines "réelles" par bloc pour capper la navigation ‹›: nombre_semaines
    // déclaré, ou le max effectivement loggué s'il le dépasse (log au-delà du prévu).
    const exToBloc = {};
    blocs.forEach((b,bi) => (b.client_programme_seances||[]).forEach(s => (s.client_programme_exercices||[]).forEach(ex => { exToBloc[ex.id]=bi; })));
    const blocMaxSem = blocs.map(b => b.nombre_semaines || 1);
    Object.keys(logs).forEach(key => {
      const parts = key.split('|'); const exId = parts[0], sem = parseInt(parts[1]);
      const bi = exToBloc[exId];
      if (bi !== undefined && sem > (blocMaxSem[bi]||0)) blocMaxSem[bi] = sem;
    });
    progLogsData = { loaded:true, programme:prog, blocs, logs, blocMaxSem, equivalents: (prog && prog.equivalents) || {}, equivLogs: (prog && prog.equivLogs) || {} };
    if (state.nav==='prog-logs' && state.progLogsId===progId) renderMain();
  }).catch(e => {
    progLogsData = { loaded:true, programme:null, blocs:[], logs:{}, error:e.message };
    if (state.nav==='prog-logs') renderMain();
  });
}

function progLogsSemaineChangerBloc(bi, delta){
  const max = (progLogsData.blocMaxSem && progLogsData.blocMaxSem[bi]) || 1;
  const cur = progLogsSemaineParBloc[bi] || 1;
  progLogsSemaineParBloc[bi] = Math.max(1, Math.min(max, cur + delta));
  renderMain();
}

function renderProgLogsPage(el){
  const backClientId = state.selected;
  if (!progLogsData.loaded){
    el.innerHTML = `
      <button class="fiche-back" onclick="setNav('fiche-client')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        Retour à la fiche client
      </button>
      <div style="display:flex;align-items:center;justify-content:center;padding:80px;"><div class="spin"></div></div>`;
    return;
  }
  if (progLogsData.error || !progLogsData.programme){
    el.innerHTML = `<div class="empty-panel"><strong>Erreur</strong>${esc(progLogsData.error||'Programme introuvable')}</div>`;
    return;
  }
  const prog = progLogsData.programme;
  const blocs = progLogsData.blocs || [];
  const logs = progLogsData.logs || {};
  const nbSeances = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).length,0);

  // Map exId → bloc index (pour offset chronologique)
  const exToBloc = {};
  blocs.forEach((b, bi) => {
    (b.client_programme_seances||[]).forEach(s => {
      (s.client_programme_exercices||[]).forEach(ex => { exToBloc[ex.id] = bi; });
    });
  });
  // Semaines réelles par bloc : nombre_semaines ou max des logs
  const blocMaxSem = blocs.map(b => b.nombre_semaines || 0);
  Object.entries(logs).forEach(([key]) => {
    const parts = key.split('|');
    const exId = parts[0], sem = parseInt(parts[1]);
    const bi = exToBloc[exId];
    if (bi !== undefined && sem > (blocMaxSem[bi]||0)) blocMaxSem[bi] = sem;
  });
  // Offset cumulatif par bloc (bloc 0 = 0, bloc 1 = sem bloc 0, etc.)
  const blocOffset = blocs.map((_, bi) => { let off=0; for(let i=0;i<bi;i++) off+=blocMaxSem[i]; return off; });

  // Build progression data cross-blocs avec semaines globales
  const progByEx = {};
  Object.entries(logs).forEach(([key, l]) => {
    const parts = key.split('|');
    const exId = parts[0], sem = parseInt(parts[1]);
    const charge = parseFloat(l.charge);
    if (!isNaN(charge) && charge > 0) {
      const bi = exToBloc[exId] ?? 0;
      const globalSem = sem + (blocOffset[bi] || 0);
      if (!progByEx[exId]) progByEx[exId] = {};
      if (!progByEx[exId][globalSem] || charge > progByEx[exId][globalSem]) progByEx[exId][globalSem] = charge;
    }
  });

  el.innerHTML = `
    <button class="fiche-back" onclick="retourFicheClient()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
      Retour à la fiche client
    </button>

    <div class="page-head" style="margin-bottom:16px;">
      <div>
        <div class="eyebrow">Logs du programme</div>
        <h1>${esc(prog.nom)}</h1>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        ${prog.actif ? '<span class="chip ok"><span class="dot"></span>Actif</span>' : '<span class="chip off">Inactif</span>'}
        <button class="btn" style="font-size:11px;padding:5px 10px;" onclick="ouvrirEditeurProgrammeClient(${prog.id})">Éditer</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
      <button class="btn ${_progLogsView==='semaine'?'primary':''}" style="font-size:12px;padding:5px 12px;" onclick="_progLogsView='semaine';renderMain()">Vue semaine</button>
      <button class="btn ${_progLogsView==='progression'?'primary':''}" style="font-size:12px;padding:5px 12px;" onclick="_progLogsView='progression';renderMain()">Progression</button>
      ${_progLogsView==='semaine' && blocs.length>1 ? `<span style="font-size:11.5px;color:var(--text-faint);margin-left:4px;">${blocs.length} blocs · chacun a sa propre navigation semaine ci-dessous</span>` : ''}
    </div>

    ${_progLogsView === 'progression' ? (() => {
      const allEx = blocs.flatMap(b=>(b.client_programme_seances||[]).flatMap(s=>(s.client_programme_exercices||[])));
      const withData = allEx.filter(ex => progByEx[ex.id] && Object.keys(progByEx[ex.id]).length >= 1);
      if (!withData.length) return `<div class="empty-panel"><strong>Pas encore de données</strong>Le client n'a pas encore loggé de charges.</div>`;
      return withData.map(ex => {
        const exData = (exercicesData||[]).find(e=>e.id===ex.exercice_id);
        const groupe = exData ? exData.groupe_musculaire : null;
        const pts = Object.entries(progByEx[ex.id]||{}).sort((a,b)=>+a[0]-+b[0]);
        const charges = pts.map(p=>p[1]);
        const maxC = Math.max(...charges), minC = Math.min(...charges);
        const W=300, H=60, PL=6, PR=6, PT=8, PB=14;
        const iW=W-PL-PR, iH=H-PT-PB;
        const xs = pts.map((_,i)=>PL+(pts.length<2?iW/2:i/(pts.length-1)*iW));
        const ys = charges.map(c=>PT+(maxC===minC?iH/2:iH-(c-minC)/(maxC-minC)*iH));
        const polyline = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
        const first = charges[0], last = charges[charges.length-1];
        const delta = last - first;
        const deltaStr = (delta>=0?'+':'')+delta.toFixed(1)+' kg';
        const deltaColor = delta>0?'#4caf50':delta<0?'var(--critical)':'var(--text-faint)';
        return `<div style="background:var(--surface);border-radius:var(--radius);margin-bottom:12px;padding:12px 14px;box-shadow:var(--shadow-sm);">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
            <div>
              <div style="font-size:12.5px;font-weight:700;">${esc(ex.nom)}</div>
              ${groupe?`<div style="font-size:10.5px;color:var(--text-faint);">${esc(groupe)}</div>`:''}
            </div>
            <div style="text-align:right;">
              <div style="font-size:13px;font-weight:700;">${last} kg</div>
              <div style="font-size:11px;color:${deltaColor};">${deltaStr}</div>
            </div>
          </div>
          ${pts.length >= 2 ? `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
            <polyline points="${polyline}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            ${xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3" fill="var(--accent)"/>`).join('')}
            <text x="${xs[0]}" y="${H}" text-anchor="middle" style="font-size:10px;fill:var(--text-faint);">S${pts[0][0]}</text>
            <text x="${xs[xs.length-1]}" y="${H}" text-anchor="middle" style="font-size:10px;fill:var(--text-faint);">S${pts[pts.length-1][0]}</text>
          </svg>` : `<div style="font-size:12px;color:var(--text-faint);">1 donnée — sem. ${pts[0][0]} : ${charges[0]} kg</div>`}
        </div>`;
      }).join('');
    })() : blocs.map((b,bi)=>{
      const color = BLOC_COLOR[b.type] || 'var(--hairline)';
      // Navigation indépendante par bloc — les logs sont stockés en semaine LOCALE
      // au bloc, donc la semaine affichée ici EST directement la clé de lookup
      // (plus de conversion globale→locale, chaque bloc a son propre curseur).
      const maxSem = (progLogsData.blocMaxSem && progLogsData.blocMaxSem[bi]) || 1;
      const semLocale = Math.min(maxSem, progLogsSemaineParBloc[bi] || 1);
      return `
      <div style="margin-bottom:18px;border-left:3px solid ${color};border-radius:0 var(--radius) var(--radius) 0;overflow:hidden;">
        <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;background:${color}14;flex-wrap:wrap;">
          <div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;"></div>
          <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:${color};">${esc(BLOC_LABELS_COACH[b.type]||b.type||'Générique')}</span>
          ${b.nombre_semaines ? `<span style="font-size:11px;color:var(--text-faint);">· ${b.nombre_semaines} sem.</span>` : ''}
          <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">

                  </span>
                </div>`;

              const firstLog = logs[ex.id+'|'+semLocale+'|1']||{};
              const equiv = progLogsData.equivalents && progLogsData.equivalents[ex.id];
              let equivHtml = '';

                for (let sr=1; sr<=nbSeries; sr++){
                  const l = (progLogsData.equivLogs||{})[equiv.id+'|'+semLocale+'|'+sr]||{};

                    </span>

                equivHtml = `<div style="margin-top:8px;padding:8px 10px;background:#a78bfa14;border:1px solid #a78bfa33;border-radius:8px;">

              return `<div style="padding:10px 14px;border-top:1px solid var(--hairline);">

async function ouvrirEditeurProgrammeClient(progId){
  if (exercicesData === null) { try { exercicesData = await chargerExercices(); } catch(e) { exercicesData = []; } }
  const prog = await chargerProgrammeById(progId);
  if (!prog) { alert('Programme introuvable'); return; }
  clientProgEnEdition = {
    id: prog.id, client_id: prog.client_id, nom: prog.nom, objectif: prog.objectif || '', actif: prog.actif, bloc_actif_id: prog.bloc_actif_id || null,
    blocs: (prog.blocs||[]).map(b => ({
      id: b.id, type: b.type||null, nombre_semaines: b.nombre_semaines||null,
      seances: (b.client_programme_seances||[]).map(s => ({
        id: s.id, titre: s.titre,
        exercices: (s.client_programme_exercices||[]).map(ex => {
          const exData = (exercicesData||[]).find(e=>e.id===ex.exercice_id) ||
                         (exercicesData||[]).find(e=>e.nom.toLowerCase()===(ex.nom||'').toLowerCase());
          return { id: ex.id, exercice_id: ex.exercice_id, nom: ex.nom||(exData?exData.nom:'?'), groupe_musculaire: exData?(exData.groupe_musculaire||null):null, series: ex.series, reps: ex.reps, repos: ex.repos, tempo: ex.tempo, rir: ex.rir, notes: ex.notes || '' };
        })
      }))
    }))
  };
  _origClientProgBlocIds = clientProgEnEdition.blocs.map(b=>b.id).filter(Boolean);
  _origClientProgSeanceIds = clientProgEnEdition.blocs.flatMap(b=>b.seances.map(s=>s.id)).filter(Boolean);
  _origClientProgExoIds = clientProgEnEdition.blocs.flatMap(b=>b.seances.flatMap(s=>s.exercices.map(ex=>ex.id))).filter(Boolean);
  state.nav = 'editeur-client-prog';
  renderSidebar();
  renderMain();
}
