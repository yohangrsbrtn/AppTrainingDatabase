function cpDupliquerBloc(bi){
  const src = clientProgEnEdition.blocs[bi];
  const copie = JSON.parse(JSON.stringify(src));
  copie.id = null; // nouveau bloc Supabase
  copie.type = null; // le coach choisit le nouveau type
  copie.seances.forEach(s => { s.id = null; s.exercices.forEach(ex => { ex.id = null; }); });
  clientProgEnEdition.blocs.splice(bi + 1, 0, copie);
  _repartitionCpBlocIdx = bi + 1;
  renderBlocsClientProg();
}

function cpMonterBloc(bi){ if(bi===0) return; const b=clientProgEnEdition.blocs; [b[bi-1],b[bi]]=[b[bi],b[bi-1]]; renderBlocsClientProg(); }
function cpDescendreBloc(bi){ const b=clientProgEnEdition.blocs; if(bi>=b.length-1) return; [b[bi],b[bi+1]]=[b[bi+1],b[bi]]; renderBlocsClientProg(); }
function cpAjouterBloc(){ clientProgEnEdition.blocs.push(blocVide()); renderBlocsClientProg(); }
function cpRetirerBloc(bi){ clientProgEnEdition.blocs.splice(bi,1); renderBlocsClientProg(); }
function cpAjouterSeance(bi){ const s=clientProgEnEdition.blocs[bi].seances; s.push({id:null,titre:'Séance '+(s.length+1),exercices:[]}); renderBlocsClientProg(); }
function cpRetirerSeance(bi,si){ clientProgEnEdition.blocs[bi].seances.splice(si,1); renderBlocsClientProg(); }
function cpRetirerExo(bi,si,ei){ clientProgEnEdition.blocs[bi].seances[si].exercices.splice(ei,1); renderBlocsClientProg(); }
function cpOnDragStartExo(e,bi,si,ei){ _cpDragExoSource={bi,si,ei}; e.dataTransfer.effectAllowed='move'; }
function cpOnDragEndExo(){ _cpDragExoSource=null; }
function cpOnDropExo(e,bi,si,ei){
  e.preventDefault();
  const src=_cpDragExoSource; _cpDragExoSource=null;
  if(!src||src.bi!==bi||src.si!==si||src.ei===ei){ renderBlocsClientProg(); return; }
  const arr=clientProgEnEdition.blocs[bi].seances[si].exercices;
  const [moved]=arr.splice(src.ei,1);
  arr.splice(src.ei<ei?ei-1:ei,0,moved);
  renderBlocsClientProg();
}

function cpOuvrirPicker(bi,si){
  _cpPickerCible={bi,si}; pickerGroupeFiltre='all'; pickerRecherche='';

  overlay.className='modal-overlay'; overlay.id='modal-picker-cp';
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.innerHTML=`
    <div class="modal-box">
      <h3>Choisir un exercice</h3>
      <div class="field-row"><input type="text" id="cpPickerSearch" placeholder="Rechercher…" oninput="pickerRecherche=this.value;cpRenderPickerListe()"></div>

function cpRenderPickerListe(){
  const el=document.getElementById('cpPickerListe');
  if(!el) return;
  const q=(pickerRecherche||'').toLowerCase();
  const list=(exercicesData||[]).filter(e=>pickerGroupeFiltre==='all'||e.groupe_musculaire===pickerGroupeFiltre).filter(e=>!q||e.nom.toLowerCase().includes(q));
  el.innerHTML=list.length?list.map(e=>`
    <div class="exo-row" style="cursor:pointer;" onclick="cpAjouterExo(${e.id})">
      <span class="nom">${esc(e.nom)}</span>
      <span class="stat">${esc(e.groupe_musculaire||'')}</span>
    </div>`).join(''):`<div style="padding:16px;text-align:center;color:var(--text-faint);">Aucun exercice.</div>`;
}

function cpAjouterExo(exerciceId){
  const ex=(exercicesData||[]).find(e=>e.id===exerciceId);
  if(!ex||!_cpPickerCible) return;
  const {bi,si}=_cpPickerCible;
  const blocType=clientProgEnEdition.blocs[bi].type;
  clientProgEnEdition.blocs[bi].seances[si].exercices.push({
    id:null, exercice_id:exerciceId, nom:ex.nom, groupe_musculaire:ex.groupe_musculaire||null,
    series:null, reps:(blocType&&ex['reps_'+blocType]?ex['reps_'+blocType]:'')||(REPS_PAR_TYPE[blocType]||''),
    repos:(blocType&&ex['repos_'+blocType]?ex['repos_'+blocType]:'')||(REPOS_PAR_TYPE[blocType]||''), tempo:'', rir:RIR_PAR_TYPE[blocType]||'', notes:''
  });
  document.getElementById('modal-picker-cp').remove();
  renderBlocsClientProg();
}

async function sauvegarderProgrammeClient(){
  const cp=clientProgEnEdition;
  if(!cp) return;
  const btn=document.getElementById('clientProgSaveBtn');
  const errEl=document.getElementById('cpErr');
  if(btn){btn.disabled=true;btn.textContent='Enregistrement…';}
  if(errEl) errEl.style.display='none';
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${cp.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({nom:cp.nom,objectif:cp.objectif||null,bloc_actif_id:cp.bloc_actif_id||null})});
    const newBlocIds=[],newSeanceIds=[],newExoIds=[];
    for(let bi=0;bi<cp.blocs.length;bi++){
      const b=cp.blocs[bi];
      if(b.id){
        await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs?id=eq.${b.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({type:b.type||null,nombre_semaines:b.nombre_semaines||null,ordre:bi})});
      } else {
        const r=await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs`,{method:'POST',headers:supaHeaders({Prefer:'return=representation'}),body:JSON.stringify({client_programme_id:cp.id,type:b.type||null,nombre_semaines:b.nombre_semaines||null,ordre:bi})});
        b.id=(await r.json())[0].id;
      }
      newBlocIds.push(b.id);
      for(let si=0;si<b.seances.length;si++){
        const s=b.seances[si];
        if(s.id){
          await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances?id=eq.${s.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({titre:s.titre,ordre:si})});
        } else {
          const r=await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances`,{method:'POST',headers:supaHeaders({Prefer:'return=representation'}),body:JSON.stringify({bloc_id:b.id,titre:s.titre,ordre:si})});
          s.id=(await r.json())[0].id;
        }
        newSeanceIds.push(s.id);
        for(let ei=0;ei<s.exercices.length;ei++){
          const ex=s.exercices[ei];
          if(ex.id){
            await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices?id=eq.${ex.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({exercice_id:ex.exercice_id,ordre:ei,series:parseInt(ex.series)||null,reps:ex.reps||null,repos:ex.repos||null,tempo:ex.tempo||null,rir:ex.rir||null,notes:ex.notes||null})});
          } else {
            const r=await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices`,{method:'POST',headers:supaHeaders({Prefer:'return=representation'}),body:JSON.stringify({seance_id:s.id,exercice_id:ex.exercice_id,nom:ex.nom,ordre:ei,series:parseInt(ex.series)||null,reps:ex.reps||null,repos:ex.repos||null,tempo:ex.tempo||null,rir:ex.rir||null,notes:ex.notes||null})});
            ex.id=(await r.json())[0].id;
          }
          newExoIds.push(ex.id);
        }
      }
    }
    const removedExos=_origClientProgExoIds.filter(id=>!newExoIds.includes(id));
    for(const id of removedExos) await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices?id=eq.${id}`,{method:'DELETE',headers:supaHeaders()});
    const removedSeances=_origClientProgSeanceIds.filter(id=>!newSeanceIds.includes(id));
    for(const id of removedSeances) await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances?id=eq.${id}`,{method:'DELETE',headers:supaHeaders()});
    const removedBlocs=_origClientProgBlocIds.filter(id=>!newBlocIds.includes(id));
    for(const id of removedBlocs) await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs?id=eq.${id}`,{method:'DELETE',headers:supaHeaders()});
    ficheData.tous_programmes=await chargerTousProgrammes(cp.client_id);
    ficheData.programme=ficheData.tous_programmes.find(p=>p.actif)||null;
    state.nav='fiche-client'; state.selected=cp.client_id; ficheTab='programmes';
    renderSidebar(); renderMain();
  } catch(e){
    if(btn){btn.disabled=false;btn.textContent='Enregistrer';}
    if(errEl){errEl.textContent='Erreur : '+e.message;errEl.style.display='block';}
  }
}

// Ajout/retrait manuel d'XP par le coach — action délibérée à chaque clic,
// pas besoin de dédoublonnage (contrairement au crédit automatique à
// l'envoi d'un bilan, voir bilan.js _crediterXpBilanEnvoye).
async function ajouterXpClient(clientId) {
  const input = document.getElementById('xpAjoutInput');
  const delta = parseInt(input && input.value);
  if (!clientId || isNaN(delta) || delta === 0) return;
  const btn = document.getElementById('xpAjoutBtn');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    const progRes = await fetch(`${SUPABASE_URL}/rest/v1/client_progression?client_id=eq.${encodeURIComponent(clientId)}&select=xp_total`, { headers: supaHeaders() });
    const progArr = progRes.ok ? await progRes.json() : [];
    const xpActuel = (progArr[0] && progArr[0].xp_total) || 0;
    const nouveauXp = Math.max(0, xpActuel + delta);
    await fetch(`${SUPABASE_URL}/rest/v1/client_progression?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: clientId, xp_total: nouveauXp, updated_at: new Date().toISOString() })
    });
    ficheData.xpData = await chargerClientProgressionXP(clientId);
    if (state.nav === 'fiche-client' && state.selected === clientId) renderMain();
  } catch(e) {
    alert('Erreur : ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '+ Ajouter XP'; }
  }
}

async function chargerClientProgressionXP(clientId){
  const [progRes, bilansRes, profilRes, seancesRes] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/client_progression?client_id=eq.${encodeURIComponent(clientId)}`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.asc`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}&select=date_debut,seances_cible`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?select=client_programme_exercice_id,semaine&client_programme_exercice_id=in.(select+id+from+client_programme_exercices+where+client_programme_id+in+(select+id+from+client_programmes+where+client_id%3Deq.${encodeURIComponent(clientId)}))`, { headers: supaHeaders() }).catch(()=>({ ok:false }))
  ]);
  const [progRows, bilans, profils] = await Promise.all([
    progRes.ok ? progRes.json() : Promise.resolve([]),
    bilansRes.ok ? bilansRes.json() : Promise.resolve([]),
    profilRes.ok ? profilRes.json() : Promise.resolve([])
  ]);
  const progRow = progRows[0] || {};
  const profil  = profils[0]  || {};
  // xp_total est un compteur stocké, incrémenté uniquement côté serveur à
  // l'envoi d'un bilan (bilan.js, _crediterXpBilanEnvoye), dédoublonné via
  // bilans.xp_credite — jamais recalculé ici. Voir progression.js.
  // XP_PAR_NIVEAU=50, pas de plafond : aligné sur le système GAS réel
  // (confirmé via Perrine, xp_total=747 → niveau 15 = floor(747/50)+1).
  const XP_PAR_NIVEAU = 50;
  const xpTotal = progRow.xp_total || 0;
  const bilansValidies = bilans.filter(b => b.envoye_coach && b.date_validation).length;
  let seancesValidees = 0;
  bilans.forEach(b => {
    if (!b.envoye_coach || !b.date_validation) return;
    seancesValidees += (b.jours || []).filter(j=>j.training).length;
  });
  const niveau = Math.max(1, Math.floor(xpTotal / XP_PAR_NIVEAU) + 1);
  const niveauMaxAtteint = false;
  const xpManquant = niveau * XP_PAR_NIVEAU - xpTotal;
  const pct = Math.round((xpTotal - (niveau-1)*XP_PAR_NIVEAU) / XP_PAR_NIVEAU * 100);
  // 4 = ancien comportement par défaut tant que le coach n'a pas encore
  // assigné d'objectif séances/semaine (client_profils.seances_cible).
  const nbSemaines = (typeof _semainesDepuisDebut === 'function' ? _semainesDepuisDebut(profil.date_debut) : 0) || bilans.length || 1;
  const seancesCible = profil.seances_cible || 4;
  const seancesAttendues = nbSemaines * seancesCible;
  const bilansAttendus = nbSemaines;
  const pctSeances = seancesAttendues > 0 ? Math.min(100, Math.round(seancesValidees / seancesAttendues * 100)) : 0;
  const pctBilans = bilansAttendus > 0 ? Math.min(100, Math.round(bilansValidies / bilansAttendus * 100)) : 0;
  const assiduiteGlobale = Math.round((pctSeances + pctBilans) / 2);
  const titreActif = progRow.titre_actif || null;
  const titreDef = titreActif && typeof TITRES_DEF !== 'undefined' ? TITRES_DEF.find(t=>t.id===titreActif) : null;
  const tier = typeof niveauToTier === 'function' ? niveauToTier(niveau) : 'debutant';
  const tc = typeof getTierColors === 'function' ? getTierColors(tier) : {c1:'#a8b0c8',c2:'#404858',bar:''};
  return { xpTotal, niveau, pct, xpManquant, niveauMaxAtteint, tier, tc, titreDef,
           seancesValidees, seancesAttendues, pctSeances,
           bilansValidies, bilansAttendus, pctBilans, assiduiteGlobale };
}
function progressionChart(vals, color){
  const w=560,h=100,min=Math.min(...vals),max=Math.max(...vals);
  const pts = vals.map((v,i)=>[ (i/(vals.length-1||1))*w, h - ((v-min)/((max-min)||1))*(h-10) - 4 ]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${h*f}" x2="${w}" y2="${h*f}" stroke="var(--hairline)" stroke-width="1"/>`).join('');
  return `<svg class="bigchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" opacity="0.18"/>
  </svg>`;
}
function renderProgressionTab(){
  const list = panelProgression || [];

function ageDepuisDate(dateStr){
  if (!dateStr) return null;
  const naissance = new Date(dateStr);
  if (isNaN(naissance)) return null;
  const auj = new Date();
  let age = auj.getFullYear() - naissance.getFullYear();
  const m = auj.getMonth() - naissance.getMonth();
  if (m < 0 || (m === 0 && auj.getDate() < naissance.getDate())) age--;
  return age;
}

function toggleMenu(ev, id){
  ev.stopPropagation();
  const target = document.getElementById('menu-'+id);
  const wasOpen = target.classList.contains('open');
  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  if (!wasOpen) target.classList.add('open');
}
document.addEventListener('click', () => document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')));

// Le badge de la cloche ne doit pas rester bloqué à un chiffre qui ne baisse
// jamais tant que les bilans/retards sous-jacents ne sont pas réellement
// traités par le coach — "ouvrir la cloche" doit pouvoir la faire disparaître
// (comme n'importe quelle appli), sans pour autant modifier l'état réel des
// bilans (ça, c'est le rôle du bouton "Marquer traité" dans le détail bilan).
// On distingue donc deux choses : la liste (toujours le vrai "à traiter" actuel)
// et le badge (compte seulement les éléments jamais encore "vus" en ouvrant la
// cloche, mémorisé par clé stable dans localStorage).
function _notifSeenKeys(){
  try { return new Set(JSON.parse(localStorage.getItem('at_notif_seen_keys') || '[]')); } catch(e) { return new Set(); }
}
function _notifMarquerVues(keys){
  const seen = _notifSeenKeys();
  keys.forEach(k => seen.add(k));
  try { localStorage.setItem('at_notif_seen_keys', JSON.stringify([...seen])); } catch(e) {}
}

function renderNotifMenu(){
  const bilans = data.bilansCoach.filter(b=>!b.coachTraite).slice(0,3);
  const retards = data.clients.filter(c=>c.enRetard).slice(0,3);
  const items = [
    ...bilans.map(b => `<div class="menu-item" style="align-items:flex-start;flex-direction:column;gap:1px;"><b>${esc(b.nom)}</b><span style="color:var(--text-faint);font-size:11.5px;">bilan à traiter · semaine ${esc(b.semaine||'')}</span></div>`),
    ...retards.map(c => `<div class="menu-item" style="align-items:flex-start;flex-direction:column;gap:1px;"><b>${esc(c.nom)}</b><span style="color:var(--text-faint);font-size:11.5px;">bilan en retard</span></div>`),
  ];
  const menu = document.getElementById('menu-notif');
  menu.innerHTML = `<div class="menu-label">À traiter</div>` + (items.length ? items.join('') : `<div class="menu-item" style="color:var(--text-faint);">Rien à signaler.</div>`);
  const keys = [...bilans.map(b => 'bilan:'+b.client+'|'+b.ts), ...retards.map(c => 'retard:'+c.id)];
  menu.dataset.keys = JSON.stringify(keys);
  const seen = _notifSeenKeys();
  const nonVus = keys.filter(k => !seen.has(k)).length;
  const badge = document.getElementById('notifCount');
  if (nonVus) { badge.style.display='flex'; badge.textContent = nonVus; } else { badge.style.display='none'; }
}

function ouvrirClocheNotifConsole(ev){
  toggleMenu(ev, 'notif');
  const menu = document.getElementById('menu-notif');
  let keys = [];
  try { keys = JSON.parse(menu.dataset.keys || '[]'); } catch(e) {}
  if (keys.length) {
    _notifMarquerVues(keys);
    const badge = document.getElementById('notifCount');
    if (badge) badge.style.display = 'none';
  }
}

async function chargerDieteTemplates(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?client_only=eq.false&order=nom.asc&select=*,repas(id,nom,ordre,repas_aliments(id,nom,unite,quantite_g,kcal_par_100g,prot_par_100g,glu_par_100g,lip_par_100g))`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}

// Colonnes stockées "pour 100g" (2026-08-02) — diviseur 100 pour les
// aliments au poids (unite='g', défaut), 1 pour les aliments par
// unité/portion (jamais multipliés par 100 en base).
function macrosDiete(repasArr){
  let kcal=0, prot=0, glu=0, lip=0;
  (repasArr||[]).forEach(r => (r.repas_aliments||[]).forEach(a => {
    const q = parseFloat(a.quantite_g)||0;
    const d = (a.unite||'g')==='g' ? 100 : 1;
    kcal += q * (parseFloat(a.kcal_par_100g)||0) / d;
    prot += q * (parseFloat(a.prot_par_100g)||0) / d;
    glu  += q * (parseFloat(a.glu_par_100g)||0) / d;
    lip  += q * (parseFloat(a.lip_par_100g)||0) / d;
  }));
  return { kcal:Math.round(kcal), prot:Math.round(prot), glu:Math.round(glu), lip:Math.round(lip) };
}

function retourDepuisEditeurDiete() {
  if (_ficheEditClientId) { _ficheEditClientId = null; _ficheEditClientDieteId = null; setNav('fiche-client'); }
  else if (_ficheCreateClientId) { _ficheCreateClientId = null; setNav('fiche-client'); }
  else { setNav(_dietNavBack || 'dietes'); }
}

function ajouterRepas(){
  const maxOrdre = dieteTplEnEdition.repas.reduce((m,r) => Math.max(m, r.ordre != null ? r.ordre : 0), -1);
  dieteTplEnEdition.repas.push({ nom:`Repas ${maxOrdre+2}`, ordre:maxOrdre+1, variante_index:0, aliments:[] });
  setNav('editeur-diete');
}

function ajouterVarianteRepas(ordre){
  ordre = parseInt(ordre);
  const existing = dieteTplEnEdition.repas.filter(r => (r.ordre != null ? r.ordre : 0) === ordre);
  const maxVariante = existing.reduce((m,r) => Math.max(m, r.variante_index||0), 0);
  const mainNom = (existing.find(r=>(r.variante_index||0)===0)||existing[0]||{}).nom || 'Repas';
  dieteTplEnEdition.repas.push({ nom:mainNom+' (variante)', ordre, variante_index:maxVariante+1, aliments:[] });
  setNav('editeur-diete');
}

function supprimerRepas(ri){
  dieteTplEnEdition.repas.splice(ri,1);
  setNav('editeur-diete');
}

// Réordonner les repas (groupes ordre, variantes comprises) par glisser-déposer
// de la poignée du repas principal. gi = index dans le tableau `ordres` trié au
// moment du render — recalculé ici à l'identique pour rester valide après un drop.
let _dietDragRepasSource = null;
function repasOnDragStart(e, gi){ _dietDragRepasSource = gi; e.dataTransfer.effectAllowed = 'move'; }
function repasOnDragEnd(){ _dietDragRepasSource = null; }
function repasOnDrop(e, targetGi){
  e.preventDefault();
  const srcGi = _dietDragRepasSource; _dietDragRepasSource = null;
  if (srcGi == null || srcGi === targetGi) { setNav('editeur-diete'); return; }
  const tpl = dieteTplEnEdition;
  const grouped = {};
  tpl.repas.forEach((r,ri) => { const o = r.ordre != null ? r.ordre : ri; (grouped[o]=grouped[o]||[]).push(ri); });
  const ordres = Object.keys(grouped).map(Number).sort((a,b)=>a-b);
  const [movedOrdre] = ordres.splice(srcGi, 1);
  ordres.splice(srcGi < targetGi ? targetGi - 1 : targetGi, 0, movedOrdre);
  // Renumérote 0..N-1 dans le nouvel ordre — tous les repas d'un même groupe
  // (variantes incluses) reçoivent le même nouvel ordre pour rester ensemble.
  ordres.forEach((oldOrdre, i) => { grouped[oldOrdre].forEach(ri => { tpl.repas[ri].ordre = i; }); });
  setNav('editeur-diete');
}

function supprimerAlimentDiete(ri, ai){
  dieteTplEnEdition.repas[ri].aliments.splice(ai,1);
  _updateAlimentsDom(ri);
}

// Grammage éditable inline — parseFloat avec remplacement virgule→point (clavier
// iOS en locale FR insère une virgule comme séparateur décimal, cf. programme-client.js).
function alimChangerQuantite(ri, ai, valeur){
  const q = parseFloat((valeur+'').replace(',','.'));
  const a = dieteTplEnEdition.repas[ri].aliments[ai];
  const ancien = a.quantite_g;
  a.quantite_g = isNaN(q) ? 0 : q;
  // Aliment déjà existant (a un id) dont le grammage change réellement : on
  // coche automatiquement "modifié" — le coach peut décocher s'il ne veut pas
  // afficher la pastille côté client.
  if (a.id != null && ancien !== a.quantite_g) a.modifie = true;
  _updateAlimentsDom(ri);
}

function alimToggleModifie(ri, ai, checked){
  dieteTplEnEdition.repas[ri].aliments[ai].modifie = checked;
}

// Réordonner les aliments d'un repas par glisser-déposer — même pattern que
// cpOnDragStartExo/cpOnDropExo (éditeur programme), limité à l'intérieur d'un
// même repas (pas de drag entre deux repas différents).
let _dietDragAlimSource = null;
function alimOnDragStart(e, ri, ai){ _dietDragAlimSource = {ri, ai}; e.dataTransfer.effectAllowed = 'move'; }
function alimOnDragEnd(){ _dietDragAlimSource = null; }
function alimOnDrop(e, ri, ai){
  e.preventDefault();
  const src = _dietDragAlimSource; _dietDragAlimSource = null;
  if (!src || src.ri !== ri || src.ai === ai) { _updateAlimentsDom(ri); return; }
  const arr = dieteTplEnEdition.repas[ri].aliments;
  const [moved] = arr.splice(src.ai, 1);
  arr.splice(src.ai < ai ? ai - 1 : ai, 0, moved);
  _updateAlimentsDom(ri);
}

function _filtrerBaseAlim(q){
  const list = document.getElementById('aBaseList');
  if (!list || !alimentsCoachData) return;
  const ql = q.toLowerCase();
  const filtered = ql ? alimentsCoachData.filter(a=>a.nom.toLowerCase().includes(ql)) : alimentsCoachData;
  list.innerHTML = filtered.map(a => `
    <div class="alim-pick-row" onclick="_selectionnerAlimBase(${a.id})">
      <div>
        <div class="alim-pick-nom">${esc(a.nom)}</div>
        ${a.categorie?`<div style="font-size:10.5px;color:var(--text-faint);">${esc(a.categorie)}</div>`:''}
      </div>
      <div class="alim-pick-macros">${Math.round(a.kcal_par_100g||0)} kcal · P${Math.round((a.prot_par_100g||0)*10)/10} G${Math.round((a.glu_par_100g||0)*10)/10} L${Math.round((a.lip_par_100g||0)*10)/10}</div>
    </div>`).join('') || `<div style="text-align:center;padding:20px;color:var(--text-faint);">Aucun résultat.</div>`;
}

function _selectionnerAlimBase(id){
  const a = alimentsCoachData.find(x=>x.id===id);
  if (!a) return;
  _ouvrirSaisieQuantite(a.nom, a.kcal_par_100g, a.prot_par_100g, a.glu_par_100g, a.lip_par_100g, a.unite||'g');
}

async function _rechercherOFF(){
  const q = document.getElementById('aOffSearch').value.trim();
  if (!q) return;
  const listEl = document.getElementById('aOffList');
  listEl.innerHTML = `<div style="text-align:center;padding:20px;"><div class="spin" style="margin:auto;"></div></div>`;
  try {
    const results = await rechercherOpenFoodFacts(q);
    if (!results.length){ listEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-faint);">Aucun résultat.</div>`; return; }

      </div>`).join('');

  } catch(e){ listEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--critical);">Erreur : ${esc(e.message)}</div>`; }

function _selectionnerOFF(idx){
  const listEl = document.getElementById('aOffList');
  const r = listEl?._offResults?.[idx];
  if (!r) return;
  _ouvrirSaisieQuantite(r.nom, r.kcal, r.prot, r.glu, r.lip);
}

// Bande de macros pour LA QUANTITÉ SAISIE (pas une référence statique "/100g"
// figée) — recalculée à chaque frappe dans le champ quantité (voir
// _majMacroBandSelection) : demande explicite du coach, "je change le
// chiffre, les calories ne bougent pas".
// kcal100/prot100/glu100/lip100 : valeurs "pour 100g" (aliment au poids) ou
// "par portion" (aliment unité) selon `unite` — jamais "par gramme" — c'est
// exactement le format stocké en base (colonnes _par_100g), donc aucune
// conversion à l'écriture (voir _confirmerAlimSelectionne).
function _macroBandSelectionHtml(kcal100, prot100, glu100, lip100, qte, diviseur, uniteLabel){
  const f = v => (v||0)*qte/diviseur;
  return `
    <div><div class="mk">Kcal</div><div class="mn">${Math.round(f(kcal100))}</div><div class="mu">${uniteLabel}</div></div>
    <div><div class="mk">Prot</div><div class="mn">${Math.round(f(prot100)*10)/10}g</div><div class="mu">${uniteLabel}</div></div>
    <div><div class="mk">Gluc</div><div class="mn">${Math.round(f(glu100)*10)/10}g</div><div class="mu">${uniteLabel}</div></div>
    <div><div class="mk">Lip</div><div class="mn">${Math.round(f(lip100)*10)/10}g</div><div class="mu">${uniteLabel}</div></div>`;
}

function _majMacroBandSelection(kcal100, prot100, glu100, lip100, diviseur, uniteLabel){
  const band = document.getElementById('aSelMacroBand');
  if (!band) return;
  const qte = parseFloat(document.getElementById('aQteSelected')?.value) || 0;
  band.innerHTML = _macroBandSelectionHtml(kcal100, prot100, glu100, lip100, qte, diviseur, uniteLabel);
}

function _ouvrirSaisieQuantite(nom, kcal100, prot100, glu100, lip100, unite){
  unite = unite || 'g';
  const isG = unite === 'g';
  const diviseur = isG ? 100 : 1;
  const qteLabel = unite === 'unite' ? "Nombre d'unités" : unite === 'portion' ? 'Nombre de portions' : (isG ? 'Quantité (g)' : 'Nombre de ' + unite + 's');
  const qteDefault = isG ? 100 : 1;
  const uniteLabel = 'pour cette quantité';
  // Nom JS-échappé (apostrophes) une seule fois — un aliment comme "Huile
  // d'olive" cassait silencieusement les boutons Ajouter/Entrée sans cet
  // échappement (l'apostrophe fermait prématurément la chaîne JS de l'attribut
  // onclick), symptôme signalé : "je ne peux rien faire, ça ne fait rien".
  const nomJs = esc(nom).replace(/'/g, "\\'");
  const modal = document.getElementById('modal-ajout-aliment');
  const box = modal.querySelector('.modal-box');
  box.innerHTML = `
    <h3 style="margin-bottom:4px;">${esc(nom)}</h3>
    ${_ajoutAlimCount > 0 ? `<div style="font-size:11px;color:var(--success);margin-bottom:10px;">✓ ${_ajoutAlimCount} aliment${_ajoutAlimCount>1?'s':''} ajouté${_ajoutAlimCount>1?'s':''} à ce repas</div>` : ''}
    <div class="macro-band" id="aSelMacroBand" style="border-radius:var(--radius-sm);margin-bottom:16px;">
      ${_macroBandSelectionHtml(kcal100, prot100, glu100, lip100, qteDefault, diviseur, uniteLabel)}
    </div>
    <div class="field-row"><label>${qteLabel}</label><input id="aQteSelected" type="number" min="1" value="${qteDefault}" style="font-size:16px;"
      oninput="_majMacroBandSelection(${kcal100},${prot100},${glu100},${lip100},${diviseur},'${uniteLabel}')"
      onkeydown="if(event.key==='Enter')_confirmerAlimSelectionne('${nomJs}',${kcal100},${prot100},${glu100},${lip100},'${unite}')"></div>
    <div class="modal-actions">
      <button class="btn" onclick="ajoutAlimTab='base';_renderModalAjoutAliment()">← Retour</button>
      <button class="btn primary" onclick="_confirmerAlimSelectionne('${nomJs}',${kcal100},${prot100},${glu100},${lip100},'${unite}')">Ajouter</button>
    </div>`;
  setTimeout(()=>document.getElementById('aQteSelected')?.select(), 50);
}

function _confirmerAlimSelectionne(nom, kcal100, prot100, glu100, lip100, unite){
  unite = unite || 'g';
  const qte = parseFloat(document.getElementById('aQteSelected').value)||0;
  dieteTplEnEdition.repas[ajoutAlimRI].aliments.push({ nom, unite, quantite_g:qte, kcal_par_100g:kcal100, prot_par_100g:prot100, glu_par_100g:glu100, lip_par_100g:lip100 });
  _ajoutAlimCount++;
  _updateAlimentsDom(ajoutAlimRI);
  // Retour à la recherche avec flash de confirmation
  ajoutAlimTab = 'base';
  _renderModalAjoutAliment();
  setTimeout(() => {
    const flash = document.getElementById('picker-flash');
    if (flash) { flash.textContent = `✓ ${nom} ajouté`; flash.style.opacity = '1'; setTimeout(()=>{ if(flash) flash.style.opacity='0'; }, 2500); }
  }, 30);
}

  const qte = parseFloat(document.getElementById('aQte').value)||0;
  // Saisie déjà "pour 100g" (label au-dessus des champs) — stockage direct.
  const kcal = parseFloat(document.getElementById('aKcal').value)||0;
  const prot = parseFloat(document.getElementById('aProt').value)||0;
  const glu  = parseFloat(document.getElementById('aGlu').value)||0;
  const lip  = parseFloat(document.getElementById('aLip').value)||0;
  dieteTplEnEdition.repas[ajoutAlimRI].aliments.push({ nom, unite:'g', quantite_g:qte, kcal_par_100g:kcal, prot_par_100g:prot, glu_par_100g:glu, lip_par_100g:lip });

async function sauvegarderDieteTemplate(){
  if (_ficheCreateClientId) { await sauvegarderDietePourClient(); return; }
  const nom = document.getElementById('dNom').value.trim();
  const errEl = document.getElementById('dErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  dieteTplEnEdition.nom = nom;
  dieteTplEnEdition.description = document.getElementById('dDesc').value.trim();
  try {
    const method = dieteTplEnEdition.id ? 'PATCH' : 'POST';
    const url = dieteTplEnEdition.id ? `${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${dieteTplEnEdition.id}` : `${SUPABASE_URL}/rest/v1/diete_templates`;
    const res = await fetch(url, { method, headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ nom:dieteTplEnEdition.nom, description:dieteTplEnEdition.description||null }) });
    if (!res.ok) throw new Error('supabase_'+res.status);
    const saved = (await res.json())[0];
    const tplId = saved.id;
    if (dieteTplEnEdition.id) {
      await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tplId}`, { method:'DELETE', headers:supaHeaders() });
    }
    for (let ri=0; ri<dieteTplEnEdition.repas.length; ri++){
      const r = dieteTplEnEdition.repas[ri];
      const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`, { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id:tplId, nom:r.nom, ordre:r.ordre!=null?r.ordre:ri, variante_index:r.variante_index||0 }) });
      if (!rRes.ok) throw new Error('supabase_repas_'+rRes.status);
      const savedR = (await rRes.json())[0];
      if (r.aliments.length){
        const alimPayload = r.aliments.map((a,ai)=>({ repas_id:savedR.id, nom:a.nom, unite:a.unite||'g', quantite_g:a.quantite_g, kcal_par_100g:a.kcal_par_100g, prot_par_100g:a.prot_par_100g, glu_par_100g:a.glu_par_100g, lip_par_100g:a.lip_par_100g, ordre:ai, modifie:!!a.modifie }));
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`, { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(alimPayload) });
      }
    }
    dieteTemplatesData = null;
    dieteTemplatesData = await chargerDieteTemplates();
    if (_ficheEditClientId) {
      const cid = _ficheEditClientId;
      const cdid = _ficheEditClientDieteId;
      _ficheEditClientId = null;
      _ficheEditClientDieteId = null;
      // client_dietes.nom est une copie indépendante du nom du template au
      // moment de l'assignation (pas une référence live) — un renommage
      // depuis l'éditeur ne se répercutait jamais dessus, la fiche client
      // continuait d'afficher l'ancien nom. Resynchronise ici.
      try {
        if (cdid) {
          await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?id=eq.${cdid}`, { method:'PATCH', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify({ nom }) });
        } else {
          await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(cid)}&diete_template_id=eq.${tplId}`, { method:'PATCH', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify({ nom }) });
        }
      } catch(e) {}
      await openPanel(cid);
      setFicheTab('diete');
      setNav('fiche-client');
    } else {
      setNav('dietes');
    }
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

async function assignerDieteAuClient(templateId, templateNom, clientId){
  // Chaque assignation doit être une COPIE indépendante du template, jamais un
  // lien direct dessus — sinon éditer la diète de CE client (editerDieteClient,
  // qui écrit sur repas/repas_aliments via diete_template_id) modifierait
  // silencieusement le template partagé, donc la diète de tous les autres
  // clients assignés au même template. Bug vécu 2026-08-01. Voir aussi le
  // même principe côté migration GAS (migrerDieteGAS) : jamais de repas
  // partagé entre deux clients différents, sauf template explicitement coché
  // "réutilisable" au moment de sa création dans la bibliothèque.
  const dieteTemplateId = await _dupliquerTemplateDiete(templateId, templateNom);
  // Plusieurs diètes simultanées autorisées — pas de désactivation des autres
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes`, {
    method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
    body:JSON.stringify({ client_id:clientId, nom:templateNom, diete_template_id:dieteTemplateId, actif:true })
  });
  if (!res.ok) throw new Error('supabase_'+res.status);
  return (await res.json())[0];
}

// Duplique un template diète (+ ses repas/variantes + leurs aliments) dans un
// nouveau template dédié (client_only=true) — jamais réutilisé, jamais partagé.
async function _dupliquerTemplateDiete(sourceTemplateId, nom){
  const tplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${sourceTemplateId}&select=description`, { headers: supaHeaders() });
  const tplArr = tplRes.ok ? await tplRes.json() : [];
  const description = (tplArr[0] && tplArr[0].description) || null;

  const newTplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates`, {
    method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
    body: JSON.stringify({ nom, description, client_only: true })
  });
  if (!newTplRes.ok) throw new Error('duplication_template_' + newTplRes.status);
  const newTpl = (await newTplRes.json())[0];

  const repasRes = await fetch(
    `${SUPABASE_URL}/rest/v1/repas?template_id=eq.${sourceTemplateId}&order=ordre.asc,variante_index.asc&select=*,repas_aliments(*)`,
    { headers: supaHeaders() });
  const repasArr = repasRes.ok ? await repasRes.json() : [];
  for (const r of repasArr) {
    const newRepasRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`, {
      method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
      body: JSON.stringify({ template_id: newTpl.id, nom: r.nom, ordre: r.ordre || 0, variante_index: r.variante_index || 0 })
    });
    if (!newRepasRes.ok) continue;
    const newRepas = (await newRepasRes.json())[0];
    const aliments = r.repas_aliments || [];
    if (aliments.length) {
      const payload = aliments.map((a, ai) => ({
        repas_id: newRepas.id, nom: a.nom, unite: a.unite || 'g', quantite_g: a.quantite_g, ordre: a.ordre != null ? a.ordre : ai,
        kcal_par_100g: a.kcal_par_100g, prot_par_100g: a.prot_par_100g,
        glu_par_100g: a.glu_par_100g, lip_par_100g: a.lip_par_100g,
      }));
      await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`, {
        method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify(payload)
      });
    }
  }
  return newTpl.id;
}

// Duplique une diète déjà assignée à un client → nouvelle copie indépendante
// (client_only, jamais partagée) assignée au même client, sous le nom
// "X (copie)". Réutilise _dupliquerTemplateDiete (même mécanique que
// l'assignation d'un template depuis la bibliothèque).
async function dupliquerDieteClient(clientDieteId, clientId){
  const d = (ficheData.tous_dietes||[]).find(x=>x.id===clientDieteId);
  if (!d) return;
  if (!confirm(`Dupliquer la diète "${d.nom}" pour ce client ?`)) return;
  try {
    let tplId = d.diete_template_id;
    if (!tplId) {
      // Fallback par nom pour les diètes assignées avant l'ajout de la colonne
      // diete_template_id — même limite documentée qu'ailleurs (editerDieteClient).
      const res = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?nom=eq.${encodeURIComponent(d.nom)}&order=id.desc&limit=1&select=id`, { headers: supaHeaders() });
      const tpls = res.ok ? await res.json() : [];
      if (!tpls.length) { alert('Template introuvable pour cette diète.'); return; }
      tplId = tpls[0].id;
    }
    const nomCopie = d.nom + ' (copie)';
    const newTplId = await _dupliquerTemplateDiete(tplId, nomCopie);
    await fetch(`${SUPABASE_URL}/rest/v1/client_dietes`, {
      method:'POST', headers: supaHeaders({ Prefer:'return=minimal' }),
      body: JSON.stringify({ client_id: clientId, nom: nomCopie, diete_template_id: newTplId, actif: true })
    });
    ficheData.tous_dietes = await chargerTousDietes(clientId);
    setFicheTab('diete');
  } catch(e){ alert('Erreur : '+e.message); }
}

  if (id) {
    const r = recettesCoachData.find(x=>x.id===id);
    recetteEnEdition = {
      id: r.id,
      nom: r.nom||'',
      description: r.description||'',
      categorie: r.categorie||'',
      emoji: r.emoji||'🍽️',
      temps_prep_min: r.temps_prep_min||'',
      portions: r.portions||1,
      kcal_par_portion: r.kcal_par_portion||'',
      prot_par_portion: r.prot_par_portion||'',

    categorie: document.getElementById('rCat').value.trim()||null,

    prot_par_portion: parseFloat(document.getElementById('rProt').value)||null,
    glu_par_portion: parseFloat(document.getElementById('rGlu').value)||null,
    lip_par_portion: parseFloat(document.getElementById('rLip').value)||null,

    etapes: r.etapes.filter(x=>(typeof x==='string'?x:(x.texte||'')).trim())
  };
  if (!payload.nom) { alert('Le nom est obligatoire.'); return; }
  try {
    let res;
    if (r.id) {
      res = await fetch(`${SUPABASE_URL}/rest/v1/recettes?id=eq.${r.id}`,
        { method:'PATCH', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(payload) });
    } else {
      res = await fetch(`${SUPABASE_URL}/rest/v1/recettes`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(payload) });
    }
    if (!res.ok) throw new Error('Supabase ' + res.status + ' : ' + await res.text());
    const saved = (await res.json())[0];
    if (r.id) {
      recettesCoachData = recettesCoachData.map(x=>x.id===r.id?saved:x);
    } else {
      recettesCoachData = [...(recettesCoachData||[]), saved];
    }
    document.getElementById('modal-editeur-recette').remove();
    renderRecettesCoachSub();
  } catch(e){ alert('Erreur : ' + e.message); }
}

async function sauvegarderMensuration(clientId, rowId) {
  const v = id => { const el = document.getElementById('mm-'+id); return el ? el.value : null; };
  const num = s => s !== '' && s != null ? parseFloat(s) : null;
  const body = {
    client_id: clientId,
    date: v('date'),
    phase: v('phase') || null,
    poids: num(v('poids')), mesure: num(v('mesure')),
    fessiers: num(v('fessiers')), cuisses: num(v('cuisses')), mollets: num(v('mollets')),
    poitrine: num(v('poitrine')), epaules: num(v('epaules')), bras: num(v('bras')),
  };
  if (!body.date) { alert('La date est obligatoire.'); return; }
  try {
    let res;
    if (rowId) {
      res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?id=eq.${rowId}`,
        { method: 'PATCH', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(body) });
    } else {
      res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?on_conflict=client_id,date`,
        { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation,resolution=merge-duplicates' }), body: JSON.stringify(body) });
    }
    if (!res.ok) throw new Error('Supabase ' + res.status + ' — ' + await res.text().catch(()=>''));
    document.querySelector('.modal-overlay')?.remove();
    // Invalide le cache et re-charge
    _ficheMensurationsClientId = null; _ficheMensurations = null;
    _pageMensurationsRows = [];
    if (state.nav === 'fiche-client') { const el = document.getElementById('ficheTabContent'); if (el) el.innerHTML = renderFicheMensurationsTab({id:clientId}); }
    else if (state.nav === 'mensurations') chargerMensurationsSupabase(clientId);
  } catch(e) { alert('Erreur : ' + e.message); }
}

async function supprimerMensuration(rowId, clientId) {
  if (!confirm('Supprimer cette entrée ?')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?id=eq.${rowId}`,
      { method: 'DELETE', headers: supaHeaders({ Prefer: 'return=minimal' }) });
    if (!res.ok) throw new Error('Supabase ' + res.status);
    _ficheMensurationsClientId = null; _ficheMensurations = null;
    _pageMensurationsRows = [];

    else if (state.nav === 'mensurations') chargerMensurationsSupabase(clientId);
  } catch(e) { alert('Erreur : ' + e.message); }
}

// URL du GAS de production (indépendant du sandbox)
const GAS_PROD_URL = 'https://script.google.com/macros/s/AKfycbwQiM6ixf-CTIWwcuNHoosFbvrDzWmC056yRUGhTaWv0Nwxbm0dLeK3d5QVgqmS7P9G7A/exec';

// Mapping ID Supabase → ID GAS quand ils diffèrent
// (ex: compte test "yohanp" utilise la feuille réelle "yohan")
const GAS_ID_MAP = { 'yohanp': 'yohan' };
function _gasId(clientId) { return GAS_ID_MAP[clientId] || clientId; }

async function apiGasProd(action, clientId, params = {}) {
  const body = { action, token: getToken(), client: _gasId(clientId), params };
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(GAS_PROD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(body),
      signal: ctrl.signal,
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'erreur_gas');
    return json.data;
  } finally {
    clearTimeout(tid);
  }
}

const _MOIS_EN = { Jan:'01', Feb:'02', Mar:'03', Apr:'04', May:'05', Jun:'06', Jul:'07', Aug:'08', Sep:'09', Oct:'10', Nov:'11', Dec:'12' };

function _parseDateFr(s) {
  s = (s||'').toString().trim();
  if (!s) return null;
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  // Format Date.toString() natif JS renvoyé par le GAS historique bilans,
  // ex: "Sun Jul 26 2026 09:00:00 GMT+0200 (heure d'été d'Europe centrale)"
  // — on extrait le jour/mois/année en texte, pas de conversion de fuseau.
  const en = s.match(/^\w{3} (\w{3}) (\d{1,2}) (\d{4})/);
  if (en && _MOIS_EN[en[1]]) return `${en[3]}-${_MOIS_EN[en[1]]}-${en[2].padStart(2,'0')}`;
  return null;
}

// La date lue sur une feuille GAS historique correspond au jour où le client a
// rempli son bilan (souvent le dimanche, mais dépend de jour_bilan) — c'est donc
// exactement la date de fin de semaine. On en déduit un semaine_label "Du … au …"
// cohérent avec _supaGetSemaineLabel (bilan.js), au lieu du texte "SEMAINE" brut
// remonté par GAS pour les vieilles feuilles.
function _semaineLabelFromSheetDate(iso, jourBilanNom) {
  if (!iso) return null;
  const { debut, fin } = _bilanWeekBounds(jourBilanNom, new Date(iso + 'T12:00:00'));
  const MOIS = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
  const fmt = d => d.getDate() + ' ' + MOIS[d.getMonth()];
  return 'Du ' + fmt(debut) + ' au ' + fmt(fin);
}

async function migrerMensurations(clientId, rafraichirPage) {
  const statusEl = document.getElementById('migStatus_' + clientId) || document.getElementById('mensurationsContent');
  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;"><div class="spin"></div> Lecture GAS prod (${_gasId(clientId)})…</div>`;
  try {
    const raw = await apiGasProd('chargerMensurations', clientId);
    const releves = (typeof raw === 'string' ? JSON.parse(raw) : raw) || [];
    if (!releves.length) {
      if (statusEl) statusEl.innerHTML = `<span style="color:var(--text-muted);">Aucune mensuration dans GAS.</span>`;
      return;
    }
    const rowsRaw = releves
      .map(r => ({
        client_id: clientId,
        date: _parseDateFr(r.date),
        phase: r.phase || null,
        poids: r.poids != null ? r.poids : null,
        mesure: r.taille != null ? r.taille : null,
        fessiers: r.fessiers != null ? r.fessiers : null,
        cuisses: r.cuisses != null ? r.cuisses : null,
        mollets: r.mollets != null ? r.mollets : null,
        poitrine: r.poitrine != null ? r.poitrine : null,
        epaules: r.epaules != null ? r.epaules : null,
        bras: r.bras != null ? r.bras : null,
      }))
      .filter(r => r.date);
    // Dédoublonnage par date — voir commentaire dans migrerSelectionMensu
    // (même bug : deux lignes GAS sur la même date font planter l'upsert en 500).
    const rowsByDate = new Map();
    rowsRaw.forEach(r => rowsByDate.set(r.date, r));
    const rows = [...rowsByDate.values()];

    const res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?on_conflict=client_id,date`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify(rows),
    });
    if (!res.ok && res.status !== 409) {
      const errBody = await res.text().catch(() => '');
      throw new Error('supabase_' + res.status + (errBody ? ' — ' + errBody.slice(0, 300) : ''));
    }
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--success,#4caf50);">✓ ${rows.length} relevés importés.</span>`;
    if (rafraichirPage) setTimeout(() => chargerMensurationsSupabase(clientId), 600);
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--critical);">Erreur : ${esc(e.message)}</span>`;
  }
}

// Jour du bilan (Dashboard!D11 de la feuille client) + date de début (Clients!D de la
// feuille de logs GAS — le seul "premier repère" jamais conservé, la vraie dernière
// connexion étant écrasée à chaque login). Upsert ciblé : n'écrase pas un champ
// existant côté Supabase si GAS ne renvoie rien pour lui.
async function migrerInfosClient(clientId) {
  const statusEl = document.getElementById('migStatus_' + clientId);
  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;"><div class="spin"></div> Lecture GAS prod (${_gasId(clientId)})…</div>`;
  try {
    const infos = await apiGasProd('chargerInfosMigrationClient', clientId);
    if (!infos || (!infos.jourBilan && !infos.dateDebut && !infos.taille && !infos.dateNaissance && !infos.stepsCible && !infos.dateCreationCompte)) {
      if (statusEl) statusEl.innerHTML = `<span style="color:var(--text-muted);">Rien à migrer depuis GAS.</span>`;
      return;
    }
    const body = { client_id: clientId };
    if (infos.prenom)             body.prenom                = infos.prenom;
    if (infos.nom)                body.nom                   = infos.nom;
    if (infos.jourBilan)          body.jour_bilan            = infos.jourBilan;
    if (infos.dateDebut)          body.date_debut            = infos.dateDebut;
    if (infos.dateCreationCompte) body.date_creation_compte  = infos.dateCreationCompte;
    if (infos.taille)             body.taille_cm             = infos.taille;
    if (infos.dateNaissance)      body.date_naissance        = infos.dateNaissance;
    if (infos.stepsCible)         body.steps_cible           = infos.stepsCible;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const errBody = await res.text().catch(() => '');
      throw new Error('supabase_' + res.status + (errBody ? ' — ' + errBody.slice(0, 200) : ''));
    }
    const champs = [
      infos.jourBilan          ? 'jour bilan'         : null,
      infos.dateDebut          ? 'début coaching'     : null,
      infos.dateCreationCompte ? 'création compte'    : null,
      infos.taille             ? 'taille'             : null,
      infos.dateNaissance      ? 'date naissance'     : null,
      infos.stepsCible         ? 'pas/jour'           : null,
    ].filter(Boolean).join(', ');
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--success,#4caf50);">✓ ${champs} importé(s).</span>`;
    await rafraichir();
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--critical);">Erreur : ${esc(e.message)}</span>`;
  }
}

// Découpe grossièrement "Prénom Nom" (source : nom affiché du dashboard, lui-même
// issu de la feuille GAS) — premier mot = prénom, reste = nom. Le coach peut corriger
// depuis la fiche client si un nom composé casse mal.
async function _autoCreerProfilMinimal(clientId) {
  const c = (data.clients||[]).find(cl => cl.id === clientId);
  const nomComplet = ((c && c.nom) || '').trim();
  if (!nomComplet) return null;
  const parts = nomComplet.split(/\s+/);
  const prenom = parts[0] || null;
  const nom = parts.slice(1).join(' ') || null;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=representation,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: clientId, prenom, nom }),
    });
    if (!res.ok) return null;
    const rows = await res.json();
    return rows[0] || null;
  } catch(e) { return null; }
}

async function _chargerMigPreviewData(clientId) {
  try {
    const [profRes, supaMenuRes, supaCliDietesRes, supaCliProgsRes, gasMenuRaw, gasSaisiesRaw, gasDietesRaw, gasFeuilles, gasBilansRaw, supaBilansRes, gasProgressionRaw, supaProgRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}`, { headers: supaHeaders() }),
      fetch(`${SUPABASE_URL}/rest/v1/mensurations?client_id=eq.${encodeURIComponent(clientId)}&order=date.desc`, { headers: supaHeaders() }),
      fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc`, { headers: supaHeaders() }),
      fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc`, { headers: supaHeaders() }),
      apiGasProd('chargerMensurations', clientId).catch(() => []),
      apiGasProd('listerSaisiesMensurations', clientId).catch(() => []),
      apiGasProd('listerDietes', clientId).catch(() => []),
      apiGasProd('listerFeuilles', clientId).catch(() => []),
      apiGasProd('chargerHistoriqueBilans', clientId).catch(() => []),
      fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(clientId)}&select=gas_ligne_titre`, { headers: supaHeaders() }).catch(() => null),
      apiGasProd('chargerProgressionClient', clientId).catch(() => null),
      fetch(`${SUPABASE_URL}/rest/v1/client_progression?client_id=eq.${encodeURIComponent(clientId)}&limit=1`, { headers: supaHeaders() }).catch(() => null),
    ]);
    const profRows        = profRes.ok        ? await profRes.json()        : [];
    const supaMensurations = supaMenuRes.ok   ? await supaMenuRes.json()    : [];
    const supaClientDietes = supaCliDietesRes.ok ? await supaCliDietesRes.json() : [];
    const supaClientProgs  = supaCliProgsRes.ok  ? await supaCliProgsRes.json()  : [];
    const gasMensurations       = (typeof gasMenuRaw    === 'string' ? JSON.parse(gasMenuRaw)    : gasMenuRaw)    || [];
    const gasSaisiesMensurations = (typeof gasSaisiesRaw === 'string' ? JSON.parse(gasSaisiesRaw) : gasSaisiesRaw) || [];
    const gasDietes              = (typeof gasDietesRaw  === 'string' ? JSON.parse(gasDietesRaw)  : gasDietesRaw)  || [];
    const _gasBilansUnwrap = (typeof gasBilansRaw === 'string') ? (() => { try { return JSON.parse(gasBilansRaw); } catch { return []; } })() : gasBilansRaw;
    const gasBilans        = Array.isArray(_gasBilansUnwrap) ? _gasBilansUnwrap : [];
    const supaBilansRows   = supaBilansRes?.ok ? (await supaBilansRes.json().catch(() => [])) : [];
    const supaBilanLignes  = new Set(supaBilansRows.map(r => r.gas_ligne_titre));
    let supaProfile = profRows[0] || null;
    // Auto-crée une fiche minimale (prénom/nom depuis le nom affiché du dashboard) plutôt
    // que d'afficher "Aucun profil Supabase" à chaque ouverture pour chaque nouveau client —
    // le coach peut compléter le reste (email, jour bilan…) depuis la fiche client ensuite.
    if (!supaProfile) supaProfile = await _autoCreerProfilMinimal(clientId);

    const supaDateSet = new Set(supaMensurations.map(r => r.date));
    migPreviewSel = new Set(gasMensurations.map(r => _parseDateFr(r.date)).filter(d => d && !supaDateSet.has(d)));
    migBilanSel = new Set(gasBilans.filter(b => !supaBilanLignes.has(b.ligneTitre)).map(b => b.ligneTitre));
    const gasProgression = gasProgressionRaw ? (typeof gasProgressionRaw === 'string' ? (() => { try { return JSON.parse(gasProgressionRaw); } catch { return null; } })() : gasProgressionRaw) : null;
    const supaProgRows   = supaProgRes?.ok ? (await supaProgRes.json().catch(() => [])) : [];
    const supaProgression = supaProgRows[0] || null;
    migPreviewData = { loaded: true, error: null, supaProfile, gasMensurations, gasSaisiesMensurations, gasMensurationsDetail: {}, supaMensurations, gasDietes, gasFeuilles, supaClientDietes, supaClientProgs, gasBilans, supaBilanLignes, gasProgression, supaProgression };
    if (state.nav === 'migration-preview' && migPreviewClientId === clientId) renderMain();

    // Charger les détails complets (fessiers, cuisses, etc.) en arrière-plan
    if (gasSaisiesMensurations.length) {
      const details = {};
      await Promise.all(gasSaisiesMensurations.map(async s => {
        if (s.ligne == null) return;
        try {
          const raw = await apiGasProd('chargerSaisieMensuration', clientId, { ligne: s.ligne });
          const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (d && s.date) details[s.date] = d;
        } catch(e) {}
      }));
      if (migPreviewClientId === clientId) {
        migPreviewData.gasMensurationsDetail = details;
        if (state.nav === 'migration-preview' && migPreviewTab === 'mensurations') {
          const content = document.getElementById('migPreviewContent');
          if (content) content.innerHTML = _renderMigPreviewTabContent();
        }
      }
    }
  } catch(e) {
    migPreviewData = { loaded: true, error: e.message, supaProfile: null, gasMensurations: [], supaMensurations: [], gasDietes: [], gasFeuilles: [], supaClientDietes: [], supaClientProgs: [] };
    if (state.nav === 'migration-preview' && migPreviewClientId === clientId) renderMain();
  }
}

function _renderMigPreviewMensurations() {

  if (!gasRows.length) return `<div style="color:var(--text-faint);padding:24px;">Aucune mensuration dans GAS pour ce client.</div>`;

  const details = migPreviewData.gasMensurationsDetail || {};
  const detailsLoaded = Object.keys(details).length > 0 || (migPreviewData.gasSaisiesMensurations||[]).length === 0;
  const rows = gasRows.map(r => {
    const isoDate = _parseDateFr(r.date);
    const exists = isoDate && supaDateSet.has(isoDate);
    const checked = isoDate && migPreviewSel.has(isoDate);
    const statusColor = exists ? 'var(--text-faint)' : 'var(--success)';
    const statusLabel = exists ? 'Déjà migré' : 'Nouveau';
    const d = details[r.date] || {};
    const _cm = v => v!=null&&v!==''?v+' cm':'—';
    return `<tr style="opacity:${exists&&!checked?'0.5':'1'};">
      <td style="padding:6px 12px;width:36px;">
        ${isoDate ? `<input type="checkbox" ${checked?'checked':''} onchange="toggleMigPreviewSel('${isoDate}',this.checked)" style="accent-color:var(--accent);">` : ''}
      </td>
      <td class="mono" style="font-size:12px;padding:6px 12px;">${esc(r.date||'')}</td>
      <td style="font-size:12px;padding:6px 12px;color:var(--text-faint);">${esc(r.phase||d.phase||'—')}</td>
      <td style="font-size:12px;padding:6px 12px;">${r.poids!=null?r.poids+' kg':(d.poids!=null?d.poids+' kg':'—')}</td>
      <td style="font-size:12px;padding:6px 12px;">${_cm(r.taille??d.taille)}</td>
      <td style="font-size:12px;padding:6px 12px;">${detailsLoaded?_cm(d.fessiers):'…'}</td>
      <td style="font-size:12px;padding:6px 12px;">${detailsLoaded?_cm(d.cuisses):'…'}</td>
      <td style="font-size:12px;padding:6px 12px;">${detailsLoaded?_cm(d.mollets):'…'}</td>
      <td style="font-size:12px;padding:6px 12px;">${detailsLoaded?_cm(d.poitrine):'…'}</td>
      <td style="font-size:12px;padding:6px 12px;">${detailsLoaded?_cm(d.epaules):'…'}</td>
      <td style="font-size:12px;padding:6px 12px;">${detailsLoaded?_cm(d.bras):'…'}</td>
      <td style="font-size:11px;padding:6px 12px;color:${statusColor};">${statusLabel}</td>
    </tr>`;
  }).join('');

  return `
    <div class="table-card">
      <div class="table-toolbar" style="flex-wrap:wrap;gap:10px;">
        <div class="title">Mensurations GAS → Supabase</div>
        <div style="display:flex;align-items:center;gap:12px;margin-left:auto;">
          <label style="font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" ${allSelected?'checked':''} onchange="toggleMigPreviewSelAll(this.checked)" style="accent-color:var(--accent);">
            Tout sélectionner
          </label>
          <span style="font-size:12px;color:var(--text-faint);">${migPreviewSel.size} sélectionné${migPreviewSel.size>1?'s':''}</span>
          <button class="btn primary" style="padding:6px 14px;font-size:12px;" onclick="migrerSelectionMensu()" ${migPreviewSel.size===0?'disabled':''}>
            ⬇ Migrer ${migPreviewSel.size > 0 ? migPreviewSel.size + ' ligne' + (migPreviewSel.size>1?'s':'') : ''}
          </button>
        </div>
      </div>
      <div id="migMenuStatus" style="padding:0 20px;"></div>
      <div class="table-scroll">
        <table class="alim-table" style="width:100%;">
          <thead><tr>
            <th style="width:36px;"></th>
            <th>Date (GAS)</th>
            <th>Phase</th>
            <th>Poids</th>
            <th>Tour taille</th>
            <th>Fessiers</th>
            <th>Cuisses</th>
            <th>Mollets</th>
            <th>Poitrine</th>
            <th>Épaules</th>
            <th>Bras</th>
            <th>Statut</th>
          </tr></thead>
          <tbody id="migMenuBody">${rows}</tbody>

}

function toggleMigPreviewSel(isoDate, checked) {
  if (checked) migPreviewSel.add(isoDate);
  else migPreviewSel.delete(isoDate);
  // Met à jour le compteur et le bouton sans re-render toute la page
  const countEl = document.querySelector('#migPreviewContent span[style*="text-faint"]');
  document.querySelectorAll('#migPreviewContent .btn.primary').forEach(b => {
    b.disabled = migPreviewSel.size === 0;
    b.textContent = `⬇ Migrer ${migPreviewSel.size > 0 ? migPreviewSel.size + ' ligne' + (migPreviewSel.size > 1 ? 's' : '') : ''}`;
  });
  // Met à jour "tout sélectionner"
  const gasRows = migPreviewData.gasMensurations || [];
  const allSelectable = gasRows.map(r => _parseDateFr(r.date)).filter(Boolean);
  const allSelected = allSelectable.length > 0 && allSelectable.every(d => migPreviewSel.has(d));
  document.querySelectorAll('#migPreviewContent input[type=checkbox][onchange*="SelAll"]').forEach(cb => cb.checked = allSelected);
}

function toggleMigPreviewSelAll(checked) {
  const gasRows = migPreviewData.gasMensurations || [];
  gasRows.forEach(r => {
    const d = _parseDateFr(r.date);
    if (!d) return;
    if (checked) migPreviewSel.add(d);
    else migPreviewSel.delete(d);
  });
  // Re-render l'onglet pour mettre à jour toutes les checkboxes
  const content = document.getElementById('migPreviewContent');
  if (content) content.innerHTML = _renderMigPreviewTabContent();
}

async function migrerSelectionMensu() {
  const statusEl = document.getElementById('migMenuStatus');
  if (!migPreviewSel.size) return;
  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;"><div class="spin"></div> Migration en cours…</div>`;
  document.querySelectorAll('#migPreviewContent .btn.primary').forEach(b => b.disabled = true);
  try {
    const gasRows = migPreviewData.gasMensurations || [];
    const saisies = migPreviewData.gasSaisiesMensurations || [];
    // Index saisies par date FR pour retrouver la ligne GAS
    const saisieByDate = {};
    saisies.forEach(s => { if (s.date) saisieByDate[s.date] = s; });

    const selected = gasRows
      .map(r => ({ isoDate: _parseDateFr(r.date), raw: r }))
      .filter(({ isoDate }) => isoDate && migPreviewSel.has(isoDate));

    // Charger le détail complet pour chaque entrée sélectionnée (fessiers, cuisses, etc.)
    const detailResults = await Promise.all(selected.map(async ({ raw }) => {
      const saisie = saisieByDate[raw.date];
      if (saisie && saisie.ligne != null) {
        try {
          const detail = await apiGasProd('chargerSaisieMensuration', migPreviewClientId, { ligne: saisie.ligne });
          return typeof detail === 'string' ? JSON.parse(detail) : detail;
        } catch(e) { return null; }
      }
      return null;
    }));

    // Convertit string FR ("65,5") ou number → float ou null
    const _num = v => {
      if (v == null || v === '') return null;
      const n = parseFloat(String(v).replace(',', '.'));
      return isNaN(n) ? null : n;
    };

    const rowsRaw = selected.map(({ isoDate, raw }, i) => {
      const d = detailResults[i] || {};
      return {
        client_id: migPreviewClientId,
        date: isoDate,
        phase: raw.phase || d.phase || null,
        poids:    _num(raw.poids   ?? d.poids),
        mesure:   _num(raw.taille  ?? d.taille),
        fessiers: _num(d.fessiers  ?? raw.fessiers),
        cuisses:  _num(d.cuisses   ?? raw.cuisses),
        mollets:  _num(d.mollets   ?? raw.mollets),
        poitrine: _num(d.poitrine  ?? raw.poitrine),
        epaules:  _num(d.epaules   ?? raw.epaules),
        bras:     _num(d.bras      ?? raw.bras),
      };
    });
    // Deux lignes GAS peuvent tomber sur la même date (double saisie) — un
    // upsert avec deux lignes de même (client_id,date) dans le même batch
    // fait planter Postgres ("ON CONFLICT DO UPDATE command cannot affect
    // row a second time", HTTP 500). On dédoublonne par date, la dernière
    // ligne du sheet gagne (généralement la plus à jour).
    const rowsByDate = new Map();
    rowsRaw.forEach(r => rowsByDate.set(r.date, r));
    const rows = [...rowsByDate.values()];
    const res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?on_conflict=client_id,date`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify(rows),
    });
    if (!res.ok && res.status !== 409) {
      const errBody = await res.text().catch(() => '');
      throw new Error('supabase_' + res.status + (errBody ? ' — ' + errBody.slice(0, 300) : ''));
    }
    // Recharger les données Supabase et re-render
    const supaRes = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?client_id=eq.${encodeURIComponent(migPreviewClientId)}&order=date.desc`, { headers: supaHeaders() });
    migPreviewData.supaMensurations = supaRes.ok ? await supaRes.json() : migPreviewData.supaMensurations;
    // Vider la sélection des dates maintenant migrées
    rows.forEach(r => migPreviewSel.delete(r.date));
    const content = document.getElementById('migPreviewContent');
    if (content) content.innerHTML = _renderMigPreviewTabContent();
    // Mettre à jour les compteurs dans le hero
    const supaCount = migPreviewData.supaMensurations.length;
    document.querySelectorAll('.table-card .fiche-hero-name').forEach(() => {});
    // Re-render complet pour mettre à jour les chips stats
    renderMain();
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--critical);padding:8px 0;display:block;">Erreur : ${esc(e.message)}</span>`;
    document.querySelectorAll('#migPreviewContent .btn.primary').forEach(b => b.disabled = false);
  }
}

function _renderDieteGASDetail(detail, supaClientDietes) {
  const nom = migPreviewDieteSel ? migPreviewDieteSel.nom : (detail.nom||'');
  const repas = detail.repas || [];

  const dejaMigree = supaClientDietes.some(d => d.nom === nom);

  let kcalTotal = 0, protTotal = 0, gluTotal = 0, lipTotal = 0;
  repas.forEach(r => (r.aliments||[]).forEach(a => {
    kcalTotal += a.cals||0; protTotal += a.prot||0; gluTotal += a.glu||0; lipTotal += a.lip||0;
  }));

  const renderAlims = aliments => (aliments||[]).map(a =>
    `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--hairline);">
      <span style="color:var(--text);">${esc(a.nom)}</span>
      <span style="color:var(--text-faint);font-family:var(--font-mono);">${a.qte}g · ${Math.round(a.cals)}kcal · P${Math.round(a.prot)}g</span>
    </div>`).join('');

  const repasHtml = repas.map(r => {
    const equivs = r.equivalences || [];

        <div style="font-size:10px;font-weight:700;color:var(--accent);margin-bottom:4px;">≡ ${esc(eq.nom)}</div>
        ${renderAlims(eq.aliments) || '<div style="font-size:11px;color:var(--text-faint);">Aucun aliment</div>'}
      </div>`).join('');
    return `<div style="margin-bottom:12px;">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--accent);margin-bottom:6px;">${esc(r.nom)}${equivs.length ? ` <span style="font-weight:400;color:var(--text-faint);">(${equivs.length} équiv.)</span>` : ''}</div>
      ${renderAlims(r.aliments) || '<div style="font-size:12px;color:var(--text-faint);">Aucun aliment</div>'}
      ${equivsHtml}
    </div>`;
  }).join('');

  return `
    <div class="table-card" style="padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px;">
        <div style="flex:1;min-width:220px;">
          <label style="display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:4px;">Nom dans Supabase</label>
          <input id="migDieteNomInput" type="text" value="${esc(nom)}" style="font-size:14px;font-weight:700;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);width:100%;max-width:320px;margin-bottom:6px;">
          <div style="font-size:11px;color:var(--text-faint);">${repas.length} repas · ${Math.round(kcalTotal)} kcal · P ${Math.round(protTotal)}g · G ${Math.round(gluTotal)}g · L ${Math.round(lipTotal)}g</div>
        </div>
        ${dejaMigree
          ? `<span style="font-size:11px;color:var(--text-faint);white-space:nowrap;">Déjà une diète "${esc(nom)}" dans Supabase</span>`
          : ''}
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;">
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);cursor:pointer;white-space:nowrap;">

async function migrerDieteGAS() {
  const statusEl = document.getElementById('migDieteStatus');
  if (!migPreviewDieteDetail || !migPreviewDieteSel) return;
  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-size:12px;"><div class="spin"></div> Import en cours…</div>`;
  document.querySelectorAll('#migDieteDetail .btn.primary').forEach(b => b.disabled = true);
  try {
    const nom = document.getElementById('migDieteNomInput')?.value.trim() || migPreviewDieteSel.nom;
    const repasGAS = migPreviewDieteDetail.repas || [];

    // 1. Réutiliser ou créer le template diète.
    //
    // PIÈGE CORRIGÉ (2026-08-01, bug vécu — 5 clients affectés : hugosaubusse,
    // ericdelorenzo, matthieuesnouf, mathisleray, perrineayot) : la recherche
    // de template existant se faisait par NOM SEUL, sur TOUTE la base, sans
    // filtrer par client. Beaucoup de clients ont, chacun de leur côté dans
    // leur propre feuille GAS, une diète personnelle nommée de façon générique
    // ("DIETE JOUR ON", "DIETE JOUR OFF TRAINING"...) — la recherche globale
    // retombait donc sur LE TEMPLATE D'UN AUTRE CLIENT, dont le contenu était
    // silencieusement supprimé et remplacé par celui du client en cours de
    // migration. Résultat : migrer N'IMPORTE LEQUEL de ces clients cassait la
    // diète de tous les autres partageant le même nom, sans toucher à leur
    // propre fiche — d'où le bug qui "revenait" après chaque nouvelle
    // migration, même pour des clients qu'on ne pensait pas avoir touchés.
    //
    // Fix : ne réutiliser un template existant que dans deux cas précis —
    // (a) CE client a déjà cette diète (réimport idempotent de SA PROPRE
    //     diète, jamais celle d'un autre) ;
    // (b) le coach a explicitement coché "template réutilisable" ET un
    //     template PUBLIC (client_only=false) de ce nom existe déjà.
    // Dans tous les autres cas (diète privée, nom pas encore utilisé par ce
    // client) : toujours créer un NOUVEAU template dédié, jamais de partage
    // par coïncidence de nom.
    const commeTemplate = document.getElementById('cbMigAsTemplate')?.checked;
    const existCdPourClientRes = await fetch(
      `${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(migPreviewClientId)}&nom=eq.${encodeURIComponent(nom)}&select=diete_template_id`,
      { headers: supaHeaders() });
    const existCdPourClient = existCdPourClientRes.ok ? await existCdPourClientRes.json() : [];
    const tplDejaLieAuClient = existCdPourClient[0] && existCdPourClient[0].diete_template_id;

    let tpl = null;
    if (tplDejaLieAuClient) {
      tpl = { id: tplDejaLieAuClient };
    } else if (commeTemplate) {
      const existTplRes = await fetch(
        `${SUPABASE_URL}/rest/v1/diete_templates?nom=eq.${encodeURIComponent(nom)}&client_only=eq.false&order=id.desc&limit=1&select=id`,
        { headers: supaHeaders() });
      const existTpls = existTplRes.ok ? await existTplRes.json() : [];
      tpl = existTpls[0] || null;
    }

    if (tpl) {
      // Réécriture du contenu — soit le propre template de ce client (réimport),
      // soit un template public volontairement partagé (case cochée par le coach).
      const oldRepasRes = await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tpl.id}&select=id`, { headers: supaHeaders() });
      const oldRepas = oldRepasRes.ok ? await oldRepasRes.json() : [];
      if (oldRepas.length) {
        const ids = oldRepas.map(r => r.id).join(',');
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments?repas_id=in.(${ids})`, { method:'DELETE', headers: supaHeaders() });
        await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tpl.id}`, { method:'DELETE', headers: supaHeaders() });
      }
      await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${tpl.id}`,
        { method:'PATCH', headers: supaHeaders(), body: JSON.stringify({ nom, client_only: !commeTemplate }) });
    } else {
      const tplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ nom, client_only: !commeTemplate }) });
      if (!tplRes.ok) throw new Error('template ' + tplRes.status);
      tpl = (await tplRes.json())[0];
    }

    // 2. Créer les repas + aliments (+ équivalences comme variantes)
    const saveAliments = async (repasId, aliments) => {
      if (!aliments || !aliments.length) return;
      const payload = aliments.map((a, ai) => {
        const q = a.qte || 1;
        return {
          repas_id: repasId, nom: a.nom, quantite_g: q, ordre: ai,
          kcal_par_100g: q > 0 ? (a.cals||0)/q*100 : 0,
          prot_par_100g: q > 0 ? (a.prot||0)/q*100 : 0,
          glu_par_100g:  q > 0 ? (a.glu||0)/q*100  : 0,
          lip_par_100g:  q > 0 ? (a.lip||0)/q*100  : 0,
        };
      });
      await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(payload) });
    };
    for (let ri = 0; ri < repasGAS.length; ri++) {
      const r = repasGAS[ri];
      const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id: tpl.id, nom: r.nom, ordre: ri, variante_index: 0 }) });
      if (!rRes.ok) throw new Error('repas ' + rRes.status);
      const savedR = (await rRes.json())[0];
      await saveAliments(savedR.id, r.aliments);
      // Équivalences → variantes du même repas (variante_index 1, 2, …)
      const equivs = r.equivalences || [];
      for (let vi = 0; vi < equivs.length; vi++) {
        const eq = equivs[vi];
        const eqRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
          { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id: tpl.id, nom: eq.nom, ordre: ri, variante_index: vi + 1 }) });
        if (!eqRes.ok) continue;
        const savedEq = (await eqRes.json())[0];
        await saveAliments(savedEq.id, eq.aliments);
      }
    }

    // 3. Assigner / mettre à jour diete_template_id (idempotent)
    const existCdRes = await fetch(
      `${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(migPreviewClientId)}&nom=eq.${encodeURIComponent(nom)}&select=id,diete_template_id`,
      { headers: supaHeaders() });
    const existCd = existCdRes.ok ? await existCdRes.json() : [];
    if (!existCd.length) {
      const assignRes = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify({ client_id: migPreviewClientId, nom, diete_template_id: tpl.id, actif: true }) });
      if (!assignRes.ok) throw new Error('assign ' + assignRes.status);
    } else if (!existCd[0].diete_template_id || existCd[0].diete_template_id !== tpl.id) {
      // Mettre à jour diete_template_id si null ou incorrect (migration initiale avant ce fix)
      await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?id=eq.${existCd[0].id}`,
        { method:'PATCH', headers:supaHeaders(), body:JSON.stringify({ diete_template_id: tpl.id }) });
    }

    // 4. Invalider le cache templates
    dieteTemplatesData = null;

    // 5. Recharger supaClientDietes
    const r2 = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(migPreviewClientId)}&order=created_at.desc`, { headers: supaHeaders() });
    migPreviewData.supaClientDietes = r2.ok ? await r2.json() : migPreviewData.supaClientDietes;

    migPreviewDieteSel.nom = nom; // garde le nom personnalisé affiché après import
    if (statusEl) statusEl.innerHTML = `<div style="color:var(--success);font-size:12px;padding:6px 0;">✓ Diète importée et assignée au client.</div>`;
    document.querySelectorAll('#migDieteDetail .btn.primary').forEach(b => b.disabled = false);
    const c = document.getElementById('migDieteDetail');
    if (c && migPreviewDieteDetail) c.innerHTML = _renderDieteGASDetail(migPreviewDieteDetail, migPreviewData.supaClientDietes);
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<div style="color:var(--critical);font-size:12px;">Erreur : ${esc(e.message)}</div>`;
    document.querySelectorAll('#migDieteDetail .btn.primary').forEach(b => b.disabled = false);
  }
}

  const feuilles = migPreviewData.gasFeuilles || [];
  const supaProgs = migPreviewData.supaClientProgs || [];

  if (!feuilles.length) return `<div style="color:var(--text-faint);padding:24px;">Aucun programme trouvé dans GAS pour ce client.</div>`;

  const listHtml = feuilles.map(f => {
    const selected = migPreviewFeuilleSelected === f;
    const dejaMigre = supaProgs.some(p => p.nom === f);
    return `<div onclick="migSelectFeuille('${esc(f)}')"
      style="padding:12px 16px;background:${selected?'var(--accent-soft)':'var(--surface)'};border-radius:var(--radius);margin-bottom:8px;cursor:pointer;border:1.5px solid ${selected?'var(--accent)':'var(--hairline)'};display:flex;align-items:center;gap:12px;">
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:600;">${esc(f)}</div>
        ${dejaMigre ? `<div style="font-size:11px;color:var(--text-faint);">Déjà dans Supabase</div>` : ''}
      </div>
      ${selected ? `<span style="font-size:11px;color:var(--accent);font-weight:700;">Sélectionné</span>` : ''}
    </div>`;
  }).join('');

  const detailHtml = migPreviewFeuilleLoading
    ? `<div style="display:flex;align-items:center;gap:10px;padding:20px;"><div class="spin"></div> Chargement depuis GAS…</div>`
    : migPreviewFeuilleData ? _renderProgGASDetail(migPreviewFeuilleData, supaProgs)
    : `<div style="color:var(--text-faint);font-size:13px;padding:20px;">Sélectionne un programme pour voir son contenu avant import.</div>`;

  return `
    <div style="display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;">
      <div class="table-card" style="padding:16px;">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:12px;">Programmes GAS (${feuilles.length})</div>

    seancesData.forEach(sd => (sd.exercices||[]).forEach(ex =>
      (ex.sets||[]).forEach(set => { if (set.charge !== '' || set.reps !== '') totalLogs++; })

  const supaProgsOpts = (supaProgs||[]).map(p => `<option value="${p.id}">${esc(p.nom)}</option>`).join('');
  const ajoutBlocHtml = (supaProgs||[]).length === 0 ? '' : `

      <select id="migBlocProgSel" style="font-size:12px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:4px 8px;color:var(--text);">${supaProgsOpts}</select>

  return `

        <span style="font-size:13px;font-weight:700;min-width:100px;text-align:center;">Semaine ${sem ?? '—'} <span style="font-size:11px;font-weight:400;color:var(--text-faint);">(${migPreviewSemaineIdx+1}/${semaines.length})</span></span>

      </div>
      ${seancesHtml || '<div style="color:var(--text-faint);font-size:13px;">Aucune séance.</div>'}
