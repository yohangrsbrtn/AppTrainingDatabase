<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppTraining — Console Coach</title>
<style>
  :root {
    --bg: #0b0b0c;
    --surface: #151514;
    --surface-2: #1c1c1a;
    --surface-3: #262524;
    --hairline: rgba(255,255,255,0.055);
    --text: #f5f2ec;
    --text-muted: #9d968a;
    --text-faint: #656055;
    --accent: #f2ba3e;
    --accent-soft: #f2ba3e17;
    --accent-2: #f5a83c;
    --accent-2-soft: #f5a83c14;
    --success: #3ecf8e;
    --success-soft: #3ecf8e17;
    --warning: #e08a3c;
    --warning-soft: #e08a3c17;
    --critical: #e2615c;
    --critical-soft: #e2615c17;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg: 0 20px 44px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body);
    font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  ::selection { background: var(--accent-soft); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .shell { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 58px 1fr; height: 100vh; background: var(--bg); }

  .gate { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 20px; }
  .gate .mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .gate h1 { font-family: var(--font-display); font-size: 18px; margin: 0; }
  .gate p { color: var(--text-muted); font-size: 13px; margin: 0; max-width: 320px; }
  .gate a.btn { text-decoration: none; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface-3); border-top-color: var(--accent); animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Topbar ── */
  .topbar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 20px;
    border-bottom: 1px solid var(--hairline); background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.02em; width: 212px; flex-shrink: 0; }
  .brand .mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); flex-shrink: 0; }
  .brand .sub { color: var(--text-faint); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin-left: 2px; }

  .search { position: relative; flex: 1; max-width: 420px; }
  .search input {
    width: 100%; background: var(--surface); border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 8px 12px 8px 32px; color: var(--text); font-size: 12.5px; font-family: inherit;
  }
  .search input:focus { border-color: var(--hairline); }
  .search input::placeholder { color: var(--text-faint); }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }

  .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: var(--surface);
    color: var(--text); font-size: 12px; font-weight: 600; padding: 8px 13px; border-radius: var(--radius-sm); cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: #1a1408; }
  .btn.primary:hover { filter: brightness(1.08); }
  .icon-btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    border: none; background: var(--surface); border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .badge-dot { position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--critical); color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); }

  .avatar {
    width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--text);
  }

  /* ── Dropdowns ── */
  .dropdown { position: relative; }
  .menu {
    position: absolute; top: calc(100% + 8px); right: 0; min-width: 210px; background: var(--surface-2);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 6px;
    display: none; z-index: 60;
  }
  .menu.open { display: block; }
  .menu-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 9px; border-radius: 7px;
    border: none; background: none; color: var(--text); font-size: 12.5px; cursor: pointer;
  }
  .menu-item:hover { background: var(--surface-3); }
  .menu-item.danger { color: var(--critical); }
  .menu-item svg { color: var(--text-faint); flex-shrink: 0; }
  .menu-item.danger svg { color: var(--critical); }
  .menu-sep { height: 1px; background: var(--hairline); margin: 5px 4px; }
  .menu-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); padding: 6px 9px 3px; font-weight: 600; }

  /* ── Sidebar ── */
  .sidebar { border-right: 1px solid var(--hairline); background: var(--bg); display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto; }
  .nav-group { margin-bottom: 4px; }
  .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); font-weight: 700; padding: 14px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; text-align: left;
    padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .nav-item svg { flex-shrink: 0; color: var(--text-faint); }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); }
  .nav-item.active svg { color: var(--accent); }
  .nav-count { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; background: var(--surface-2); color: var(--text-muted); padding: 1px 6px; border-radius: 999px; }
  .sidebar-footer { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--hairline); display: flex; align-items: center; gap: 9px; }
  .sidebar-footer .name { font-size: 12px; font-weight: 700; }
  .sidebar-footer .role { font-size: 10.5px; color: var(--text-faint); }

  /* ── Main ── */
  .main { overflow-y: auto; padding: 24px 28px 40px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  .page-head .eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); font-weight: 700; margin-bottom: 4px; }
  .page-head h1 { font-family: var(--font-display); font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .page-head .meta { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

  /* ── Dashboard grid ── */
  .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: min-content; gap: 14px; }
  .card { background: var(--surface); border-radius: var(--radius); display: flex; flex-direction: column; box-shadow: var(--shadow-sm); }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 15px 16px 12px; }
  .card-head svg { color: var(--accent); flex-shrink: 0; }
  .card-head .t { font-weight: 700; font-size: 12.5px; margin-right: auto; }
  .card-head .link { font-size: 11.5px; color: var(--text-faint); cursor: pointer; font-weight: 600; }
  .card-head .link:hover { color: var(--accent); }
  .card-list { padding: 2px 8px 10px; overflow-y: auto; }
  .card-list-row { display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: 10px; cursor: pointer; }
  .card-list-row:hover { background: var(--surface-2); }
  .card-list-row .t { font-size: 12.5px; font-weight: 600; }
  .card-list-row .s { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .card-list-row .time { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); white-space: nowrap; }
  .card-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 12px; flex: 1; }
  .card-empty svg { color: var(--success); }

  .chart-card .chart-top { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px; }
  .chart-card .big-value { font-family: var(--font-mono); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .chart-card .period { font-size: 11.5px; color: var(--text-faint); border-radius: 999px; padding: 4px 10px; background: var(--surface-2); }
  .chart-card svg.bigchart { width: 100%; height: 108px; display: block; padding: 10px 8px 6px; }

  .timeline-card .card-list { padding: 4px 16px 14px; }
  .tl-row { display: flex; gap: 10px; padding: 9px 0; cursor: default; border-radius: 0; }
  .tl-row.clickable { cursor: pointer; }
  .tl-row.clickable:hover { background: var(--surface-2); }
  .tl-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: var(--accent); }
  .tl-row .t { font-size: 12.5px; }
  .tl-row .t b { font-weight: 700; }
  .tl-row .d { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); margin-top: 1px; }

  .table-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
  .table-toolbar { display: flex; align-items: center; gap: 8px; padding: 14px 16px; }
  .table-toolbar .title { font-weight: 700; font-size: 13px; margin-right: auto; }
  .chip-filter { display: flex; gap: 6px; }
  .chip-filter button {
    border: none; background: var(--surface-2); color: var(--text-muted); font-size: 11.5px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .chip-filter button.active { background: var(--accent); color: #1a1408; }

  .table-scroll { overflow-x: auto; }
  table.clients { width: 100%; border-collapse: collapse; min-width: 780px; }
  table.clients thead th {
    position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; padding: 8px 16px 12px;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  table.clients thead th:hover { color: var(--text); }
  table.clients thead th .sort-arrow { margin-left: 3px; opacity: 0.5; font-size: 9px; }
  table.clients thead th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  table.clients tbody tr { cursor: pointer; }
  table.clients tbody tr:hover td { background: var(--surface-2); }
  table.clients tbody tr.selected td { background: var(--accent-soft); }
  table.clients td { padding: 11px 16px; font-size: 12.5px; vertical-align: middle; border-top: 1px solid var(--hairline); }
  table.clients tbody tr:first-child td { border-top: none; }
  .cell-name { display: flex; align-items: center; gap: 9px; font-weight: 600; }
  .mini-avatar { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .level-pill { display: inline-flex; align-items: center; gap: 3px; background: var(--accent-2-soft); color: var(--accent-2); font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; }
  .chip.ok { background: var(--success-soft); color: var(--success); }
  .chip.ok .dot { background: var(--success); }
  .chip.late { background: var(--warning-soft); color: var(--warning); }
  .chip.late .dot { background: var(--warning); }
  .chip.off { background: var(--surface-3); color: var(--text-faint); }
  .chip.off .dot { background: var(--text-faint); }

  .row-actions { display: flex; justify-content: flex-end; }
  .row-actions .icon-btn { width: 28px; height: 28px; }

  .empty-panel { background: var(--surface); border-radius: var(--radius); padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 12.5px; }
  .empty-panel strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 6px; font-family: var(--font-display); }

  /* ── Detail slide-over ── */
  .overlay { position: fixed; inset: 58px 0 0 0; background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.16s ease; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 58px; right: 0; bottom: 0; width: 400px; background: var(--surface);
    box-shadow: var(--shadow-lg); z-index: 50; transform: translateX(100%); transition: transform 0.18s ease; display: flex; flex-direction: column;
    border-radius: 20px 0 0 0;
  }
  .panel.open { transform: translateX(0); }
  .panel-head { padding: 20px 20px 0; }
  .panel-head-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .panel-avatar { width: 46px; height: 46px; border-radius: var(--radius-sm); background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .panel-close { border: none; background: var(--surface-2); width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-muted); }
  .panel-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 10px 0 2px; }
  .panel-sub { font-size: 12px; color: var(--text-muted); }
  .panel-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .panel-stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 9px 10px; }
  .panel-stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; }
  .panel-stat .v { font-family: var(--font-mono); font-size: 15px; font-weight: 700; margin-top: 2px; }
  .panel-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--hairline); padding: 0 20px; }
  .panel-tab { border: none; background: none; padding: 9px 4px; margin-right: 16px; font-size: 12px; font-weight: 600; color: var(--text-faint); cursor: pointer; border-bottom: 2px solid transparent; }
  .panel-tab:hover { color: var(--text); }
  .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .note-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
  .note-item .txt { font-size: 12.5px; white-space: pre-wrap; }
  .note-item .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .note-item .date { font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono); }
  .note-item .del { border: none; background: none; color: var(--text-faint); cursor: pointer; font-size: 11px; }
  .note-item .del:hover { color: var(--critical); }
  .note-form textarea { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-size: 12.5px; font-family: inherit; resize: vertical; min-height: 64px; }
  .note-form textarea:focus { border-color: var(--hairline); }
  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .field-row input, .field-row select, .field-row textarea {
    width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 9px 11px; color: var(--text); font-size: 13px; font-family: inherit; box-sizing: border-box;
  }
  .field-row input:focus, .field-row select:focus, .field-row textarea:focus { border-color: var(--hairline); }
  .field-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-box { background: var(--surface); border-radius: var(--radius); padding: 22px; width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-box h3 { margin: 0 0 16px; font-family: var(--font-display); font-size: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; justify-content: center; }
  .day-block { background: var(--surface); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .day-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-weight: 700; font-size: 13px; }
  .day-head .del { margin-left: auto; }
  .exo-row { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-top: 1px solid var(--hairline); font-size: 12.5px; overflow-x: auto; }
  .exo-row .nom { flex: 1 1 110px; min-width: 90px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exo-row .stat { color: var(--text-muted); font-family: var(--font-mono); font-size: 11.5px; white-space: nowrap; }
  .exo-row .mini-btn { border: none; background: var(--surface-2); color: var(--text-muted); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; font-size: 11px; flex-shrink: 0; }
  .exo-row .mini-btn:hover { color: var(--text); }
  .exo-champ { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .exo-champ label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); }
  .exo-champ input { width: 52px; background: var(--surface-2); border: 1px solid transparent; border-radius: 6px; padding: 5px 7px; color: var(--text); font-size: 12px; font-family: inherit; box-sizing: border-box; }
  .exo-champ input:focus { border-color: var(--hairline); }
  .drag-handle { cursor: grab; color: var(--text-faint); font-size: 14px; padding: 0 2px; flex-shrink: 0; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .exo-row.drag-over { box-shadow: inset 0 2px 0 var(--accent); }
  .tpl-card { background: var(--surface); border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: var(--shadow-sm); }
  .tpl-card .nom { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .tpl-card .meta { font-size: 11.5px; color: var(--text-faint); }
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .panel-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  .panel-row:last-child { border-bottom: none; }

  /* ── Fiche client — page dédiée ── */
  .fiche-back { display:inline-flex; align-items:center; gap:7px; color:var(--text-muted); font-size:12.5px; font-weight:600; background:none; border:none; cursor:pointer; padding:0; margin-bottom:18px; }
  .fiche-back:hover { color:var(--text); }
  .fiche-hero { display:flex; align-items:center; gap:16px; padding:0 0 20px; border-bottom:1px solid var(--hairline); margin-bottom:22px; }
  .fiche-avatar { width:54px; height:54px; border-radius:14px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; flex-shrink:0; }
  .fiche-hero-name { font-family:var(--font-display); font-size:20px; font-weight:700; }
  .fiche-hero-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .fiche-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media(max-width:960px){ .fiche-grid { grid-template-columns:1fr; } }
  .fiche-card { background:var(--surface); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow-sm); }
  .fiche-card h3 { font-family:var(--font-display); font-size:14px; font-weight:700; margin:0 0 14px; }
  .fiche-field { margin-bottom:12px; }

}

function bigChart(data, color){
  const w=560,h=100,max=Math.max(1,...data),min=Math.min(...data,0);
  const pts = data.map((v,i)=>[ (i/(data.length-1||1))*w, h - ((v-min)/((max-min)||1))*(h-10) - 4 ]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${h*f}" x2="${w}" y2="${h*f}" stroke="var(--hairline)" stroke-width="1"/>`).join('');
  return `<svg class="bigchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" opacity="0.18"/>
  </svg>`;
}

const SUPABASE_URL = 'https://sfacjbwiczwkcjpwneyg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmYWNqYndpY3p3a2NqcHduZXlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MjgzNTAsImV4cCI6MjEwMDIwNDM1MH0.mrjPbOuQROMihzxZWrUNbncQIos0jK2VexpQDoRZXzY';

async function chargerNotes(clientId){

function filteredSortedClients(){

  list = list.slice().sort((a,b) => {

    if (typeof av === 'string') return (av||'').localeCompare(bv||'','fr') * state.sortDir;
    return ((av||0)-(bv||0)) * state.sortDir;

}

// ── Chargement des données réelles ────────────────────────────────────
async function chargerDonnees(){
  const [clientsRaw, bilansCoach, logsRes, aValider] = await Promise.all([
    api('listerClientsAvecNiveaux').catch(()=>[]),
    api('listerBilansCoach').catch(()=>[]),
    api('chargerTousLesLogs').catch(()=>({logs:[]})),
    api('listerAlimentsCommunauteAValider').catch(()=>[]),
  ]);
  const clients = (typeof clientsRaw === 'string' ? JSON.parse(clientsRaw) : clientsRaw).filter(c => c.id !== 'yohan');
  const retards = await Promise.all(
    clients.map(c => apiAs('verifierRetardBilan', c.id).catch(()=>({enRetard:false})))
  );
  // verifierRetardBilan() répond "si j'envoyais MAINTENANT, serait-ce en retard ?" — utile au moment
  // de l'envoi côté client (bilan.js), mais ça dit "en retard" pour tout le monde une fois la fenêtre
  // de la semaine passée, MÊME si le client a déjà envoyé son bilan à temps. On corrige ici en
  // vérifiant si un envoi (listerBilansCoach) existe déjà dans les ~6 derniers jours pour ce client.
  const parseTsFr = s => { const m = (s||'').match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/); return m ? new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]) : null; };
  const dernierEnvoi = {};
  bilansCoach.forEach(b => { const d = parseTsFr(b.ts); if (d && (!dernierEnvoi[b.client] || d > dernierEnvoi[b.client])) dernierEnvoi[b.client] = d; });
  const maintenant = new Date();
  clients.forEach((c,i) => {
    const raw = !!(retards[i] && retards[i].enRetard);
    const dernier = dernierEnvoi[c.id];
    const soumisRecemment = dernier && (maintenant - dernier) < 6*24*60*60*1000;
    c.enRetard = raw && !soumisRecemment;
  });

  // Fusionne les fiches Supabase (client_profils) — un client peut n'exister que dans Supabase
  // (créé depuis la console, pas encore dans la feuille Clients) : on l'ajoute comme entrée
  // synthétique pour qu'il apparaisse dans le tableau/panneau, avec un badge "pas de connexion possible".
  let profils = [];
  try {
    const resProfils = await fetch(`${SUPABASE_URL}/rest/v1/client_profils`, { headers: supaHeaders() });
    if (resProfils.ok) profils = await resProfils.json();
  } catch(e) {}
  const idsExistants = new Set(clients.map(c=>c.id));
  profils.forEach(p => {
    if (!idsExistants.has(p.client_id)) {
      clients.push({
        id: p.client_id,
        nom: [p.prenom, p.nom].filter(Boolean).join(' ') || p.client_id,
        niveau: null, enRetard: false, chimieActif: false, verrouile: false,
        dernConnexion: null, titreActif: null,
        _supabaseOnly: true,
      });
    }
  });

  data = { clients, bilansCoach, logs: (logsRes && logsRes.logs) || [], aValider };
}

async function rafraichir(){
  try {
    await chargerDonnees();
    renderSidebar();
    renderMain();

    document.getElementById('main').innerHTML = `<div class="empty-panel"><strong>Erreur de chargement</strong>${esc(e.message)}<br><br><button class="btn primary" onclick="rafraichir()" style="margin-top:10px;">Réessayer</button></div>`;

const GROUPES_MUSCULAIRES = ['Pectoraux','Dos (dorsaux)','Dos (trapèzes)','Dos (global)','Epaules (anterieur)','Epaules (latéral)','Epaules (posterieur)','Biceps','Triceps','Abdos','Lombaires','Quadriceps','Ischios','Fessiers','Adducteurs','Abducteurs','Mollets','Cardio'];

async function chargerExercices(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/exercices?order=nom.asc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function sauvegarderExercice(ex){
  const method = ex.id ? 'PATCH' : 'POST';
  const url = ex.id ? `${SUPABASE_URL}/rest/v1/exercices?id=eq.${ex.id}` : `${SUPABASE_URL}/rest/v1/exercices`;
  const body = { nom: ex.nom, groupe_musculaire: ex.groupe_musculaire || null, groupe_secondaire: ex.groupe_secondaire || null, equipement: ex.equipement || null, video_url: ex.video_url || null, notes: ex.notes || null,
    reps_metabolique: ex.reps_metabolique || null, repos_metabolique: ex.repos_metabolique || null,
    reps_mecanique: ex.reps_mecanique || null, repos_mecanique: ex.repos_mecanique || null,
    reps_force: ex.reps_force || null, repos_force: ex.repos_force || null };
  const res = await fetch(url, { method, headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(body) });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return (await res.json())[0];
}
async function supprimerExercice(id){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/exercices?id=eq.${id}`, { method: 'DELETE', headers: supaHeaders() });
  if (!res.ok) {
    if (res.status === 409) throw new Error("Cet exercice est utilisé dans un template — retire-le du template d'abord.");
    throw new Error('supabase_' + res.status);
  }
}

async function chargerTemplates(){
  // Compte imbriqué léger (ids seulement) pour afficher séances/exercices sur les cartes sans requête séparée.
  const res = await fetch(`${SUPABASE_URL}/rest/v1/programme_templates?order=nom.asc&select=*,programme_blocs(id,programme_seances(id,programme_seance_exercices(id)))`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function chargerTemplateArbo(templateId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs?template_id=eq.${templateId}&order=ordre.asc&select=*,programme_seances(*,programme_seance_exercices(*))&programme_seances.order=ordre.asc&programme_seances.programme_seance_exercices.order=ordre.asc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function sauvegarderTemplateComplet(tpl){
  const method = tpl.id ? 'PATCH' : 'POST';
  const url = tpl.id ? `${SUPABASE_URL}/rest/v1/programme_templates?id=eq.${tpl.id}` : `${SUPABASE_URL}/rest/v1/programme_templates`;
  const res = await fetch(url, { method, headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify({ nom: tpl.nom, categorie: tpl.categorie || null, description: tpl.description || null }) });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const saved = (await res.json())[0];
  const templateId = saved.id;
  if (tpl.id) {
    // Remplacement complet de l'arborescence (comme modifierMenu côté GAS) plutôt qu'un diff fin —
    // cascade sur programme_seances puis programme_seance_exercices.
    await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs?template_id=eq.${templateId}`, { method: 'DELETE', headers: supaHeaders() });
  }
  const blocsPayload = tpl.blocs.map((b, bi) => ({ template_id: templateId, type: b.type || null, nombre_semaines: b.nombre_semaines || null, ordre: bi }));
  const resBlocs = await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(blocsPayload) });
  if (!resBlocs.ok) throw new Error('supabase_' + resBlocs.status);
  const blocsSaved = await resBlocs.json();
  // Lookup par 'ordre' (qu'on a nous-même assigné = bi) plutôt que par position du tableau retourné —
  // l'ordre de retour d'un insert multi-lignes n'est pas garanti par Postgres.
  const blocIdByOrdre = {};
  blocsSaved.forEach(b => { blocIdByOrdre[b.ordre] = b.id; });

  const seancesPayload = [];
  tpl.blocs.forEach((b, bi) => {
    b.seances.forEach((s, si) => {
      seancesPayload.push({ bloc_id: blocIdByOrdre[bi], titre: s.titre || ('Séance ' + (si + 1)), ordre: si });
    });
  });
  let seancesSaved = [];
  if (seancesPayload.length) {
    const resSeances = await fetch(`${SUPABASE_URL}/rest/v1/programme_seances`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(seancesPayload) });
    if (!resSeances.ok) throw new Error('supabase_' + resSeances.status);
    seancesSaved = await resSeances.json();
  }
  const seanceIdByBlocOrdre = {};
  seancesSaved.forEach(s => { seanceIdByBlocOrdre[s.bloc_id + '|' + s.ordre] = s.id; });

  const exercicesPayload = [];
  tpl.blocs.forEach((b, bi) => {
    const blocId = blocIdByOrdre[bi];
    b.seances.forEach((s, si) => {
      const seanceId = seanceIdByBlocOrdre[blocId + '|' + si];
      s.exercices.forEach((ex, ei) => {
        exercicesPayload.push({ seance_id: seanceId, exercice_id: ex.exercice_id, ordre: ei, series: parseInt(ex.series) || null, reps: ex.reps || '', repos: ex.repos || '', tempo: ex.tempo || '', rir: ex.rir || '', notes: ex.notes || '' });
      });
    });
  });
  if (exercicesPayload.length) {
    const resExo = await fetch(`${SUPABASE_URL}/rest/v1/programme_seance_exercices`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(exercicesPayload) });
    if (!resExo.ok) throw new Error('supabase_' + resExo.status);
  }
  return saved;
}

}

async function confirmerFormExercice(id){
  const nom = document.getElementById('fExoNom').value.trim();
  const errEl = document.getElementById('fExoErr');
  if (!nom) { errEl.textContent = 'Le nom est obligatoire.'; errEl.style.display = 'block'; return; }
  const payload = {
    id: id || null,
    nom,
    groupe_musculaire: document.getElementById('fExoGroupe').value,
    groupe_secondaire: document.getElementById('fExoGroupeSec').value,
    equipement: document.getElementById('fExoEquip').value.trim(),
    video_url: document.getElementById('fExoVideo').value.trim(),
    notes: document.getElementById('fExoNotes').value.trim(),
    reps_metabolique: document.getElementById('fExoRepsMeta').value.trim(),
    repos_metabolique: document.getElementById('fExoReposMeta').value.trim(),
    reps_mecanique: document.getElementById('fExoRepsMeca').value.trim(),
    repos_mecanique: document.getElementById('fExoReposMeca').value.trim(),
    reps_force: document.getElementById('fExoRepsForce').value.trim(),
    repos_force: document.getElementById('fExoReposForce').value.trim(),
  };
  try {
    const saved = await sauvegarderExercice(payload);
    if (id) { const i = exercicesData.findIndex(e=>e.id===id); if (i>=0) exercicesData[i] = saved; }
    else exercicesData.push(saved);
    document.getElementById('modal-exercice').remove();
    renderExercicesSub();
  } catch(e) { errEl.textContent = 'Erreur : ' + e.message; errEl.style.display = 'block'; }
}

}

function blocVide(){ return { type: null, nombre_semaines: null, seances: [{ titre: 'Séance 1', exercices: [] }] }; }

async function ouvrirEditeurTemplate(id){
  if (exercicesData === null) { try { exercicesData = await chargerExercices(); } catch(e) { exercicesData = []; } }
  if (id) {
    const tpl = templatesData.find(t => t.id === id);
    const blocsRaw = await chargerTemplateArbo(id);
    tplEnEdition = {
      id: tpl.id, nom: tpl.nom, categorie: tpl.categorie || '', description: tpl.description || '',
      blocs: blocsRaw.map(b => ({
        type: b.type || null,
        nombre_semaines: b.nombre_semaines || null,
        seances: (b.programme_seances || []).map(s => ({
          titre: s.titre,
          exercices: (s.programme_seance_exercices || []).map(l => {
            const ex = exercicesData.find(e=>e.id===l.exercice_id);
            return { exercice_id: l.exercice_id, nom: ex ? ex.nom : '(exercice supprimé)', series: l.series, reps: l.reps, repos: l.repos, tempo: l.tempo, rir: l.rir };
          })
        }))
      }))
    };
    if (!tplEnEdition.blocs.length) tplEnEdition.blocs = [blocVide()];
    tplEnEdition.blocs.forEach(b => { if (!b.seances.length) b.seances.push({ titre: 'Séance 1', exercices: [] }); });
  } else {
    tplEnEdition = { id: null, nom: '', categorie: '', description: '', blocs: [blocVide()] };
  }
  renderEditeurTemplate();
}

let dragExoSource = null;
function onDragStartExo(e, bi, si, ei){
  dragExoSource = { bi, si, ei };
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEndExo(){
  dragExoSource = null;
}
function onDropExo(e, bi, si, ei){
  e.preventDefault();
  const src = dragExoSource;
  dragExoSource = null;
  if (!src || src.bi !== bi || src.si !== si || src.ei === ei) { renderBlocsTemplate(); return; }
  const arr = tplEnEdition.blocs[bi].seances[si].exercices;
  const [moved] = arr.splice(src.ei, 1);
  const cible = src.ei < ei ? ei - 1 : ei;
  arr.splice(cible, 0, moved);
  renderBlocsTemplate();
}

  const blocType = tplEnEdition.blocs[bi].type;

async function assignerTemplateAuClient(templateId, clientId){
  if (exercicesData === null) exercicesData = await chargerExercices();
  if (templatesData === null) templatesData = await chargerTemplates();
  const tpl = templatesData.find(t => t.id === templateId);
  const blocsArbo = await chargerTemplateArbo(templateId);

  // Un seul programme actif à la fois pour ce client — on désactive les précédents plutôt que les supprimer
  // (garde l'historique de logs des anciens programmes accessible).
  await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true`, {
    method: 'PATCH', headers: supaHeaders(), body: JSON.stringify({ actif: false })
  });

  const resCp = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes`, {
    method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }),
    body: JSON.stringify({ client_id: clientId, nom: tpl.nom, source_template_id: templateId, actif: true })
  });
  if (!resCp.ok) throw new Error('supabase_' + resCp.status);
  const cp = (await resCp.json())[0];

  const blocsPayload = blocsArbo.map((b, bi) => ({ client_programme_id: cp.id, type: b.type || null, nombre_semaines: b.nombre_semaines || null, ordre: bi }));
  const resBlocs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(blocsPayload) });
  if (!resBlocs.ok) throw new Error('supabase_' + resBlocs.status);
  const blocsSaved = await resBlocs.json();
  const blocIdByOrdre = {};
  blocsSaved.forEach(b => { blocIdByOrdre[b.ordre] = b.id; });

  const seancesPayload = [];
  blocsArbo.forEach((b, bi) => {
    (b.programme_seances||[]).forEach((s, si) => {
      seancesPayload.push({ bloc_id: blocIdByOrdre[bi], titre: s.titre, ordre: si });
    });
  });
  let seancesSaved = [];
  if (seancesPayload.length) {
    const resSeances = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(seancesPayload) });
    if (!resSeances.ok) throw new Error('supabase_' + resSeances.status);
    seancesSaved = await resSeances.json();
  }
  const seanceIdByBlocOrdre = {};
  seancesSaved.forEach(s => { seanceIdByBlocOrdre[s.bloc_id + '|' + s.ordre] = s.id; });

  const exercicesPayload = [];
  blocsArbo.forEach((b, bi) => {
    const blocId = blocIdByOrdre[bi];
    (b.programme_seances||[]).forEach((s, si) => {
      const seanceId = seanceIdByBlocOrdre[blocId + '|' + si];
      (s.programme_seance_exercices||[]).forEach((ex, ei) => {
        const source = exercicesData.find(e => e.id === ex.exercice_id);
        exercicesPayload.push({
          seance_id: seanceId, exercice_id: ex.exercice_id, nom: source ? source.nom : '(exercice supprimé)',
          ordre: ei, series: ex.series, reps: ex.reps, repos: ex.repos, tempo: ex.tempo, rir: ex.rir,
        });
      });
    });
  });
  if (exercicesPayload.length) {
    const resExo = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(exercicesPayload) });
    if (!resExo.ok) throw new Error('supabase_' + resExo.status);
  }
  return cp;
}

async function chargerProgrammeActif(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true&order=created_at.desc&limit=1`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const rows = await res.json();
  if (!rows.length) return null;
  const cp = rows[0];
  const resArbo = await fetch(
    `${SUPABASE_URL}/rest/v1/client_programme_blocs?client_programme_id=eq.${cp.id}&order=ordre.asc` +
    `&select=*,client_programme_seances(*,client_programme_exercices(*))` +
    `&client_programme_seances.order=ordre.asc&client_programme_seances.client_programme_exercices.order=ordre.asc`,
    { headers: supaHeaders() }
  );
  const blocs = resArbo.ok ? await resArbo.json() : [];
  const exIds = [];
  blocs.forEach(b => (b.client_programme_seances||[]).forEach(s => (s.client_programme_exercices||[]).forEach(ex => exIds.push(ex.id))));
  let logs = {};
  if (exIds.length) {
    const resLogs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exIds.join(',')})&order=semaine.asc,numero_serie.asc`, { headers: supaHeaders() });
    if (resLogs.ok) (await resLogs.json()).forEach(l => { logs[l.client_programme_exercice_id+'|'+l.semaine+'|'+l.numero_serie] = l; });
  }
  return Object.assign({}, cp, { blocs, logs });
}

const BLOC_LABELS_COACH = { metabolique:'Métabolique', mecanique:'Mécanique', force:'Force' };
let ficheSemaine = 1;

function renderFicheProgDetail(prog){
  const blocs = prog.blocs || [];
  const logs = prog.logs || {};
  const totalSemaines = blocs.reduce((s,b)=>s+(b.nombre_semaines||1),0)||1;
  const nbSeances = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).length,0);
  const nbExo = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).reduce((s2,se)=>s2+(se.client_programme_exercices||[]).length,0),0);
  return `
    <div class="fiche-prog">
      <div class="nom">${esc(prog.nom||'Programme sans nom')}</div>
      <div class="meta">${nbSeances} séance${nbSeances>1?'s':''} · ${nbExo} exercice${nbExo>1?'s':''} · assigné le ${prog.created_at?new Date(prog.created_at).toLocaleDateString('fr-FR'):'—'}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin:12px 0 10px;">
      <button class="btn" style="padding:5px 11px;" onclick="ficheSemaineChanger(-1)">‹</button>
      <span style="font-size:13px;font-weight:700;">Semaine ${ficheSemaine}${totalSemaines>1?' / '+totalSemaines:''}</span>
      <button class="btn" style="padding:5px 11px;" onclick="ficheSemaineChanger(1)">›</button>
    </div>
    ${blocs.map(b=>`
      ${b.type?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:10px 0 4px;">${esc(BLOC_LABELS_COACH[b.type]||b.type)}${b.nombre_semaines?' · '+b.nombre_semaines+' sem.':''}</div>`:''}
      ${(b.client_programme_seances||[]).map(s=>`
        <div style="background:var(--surface-2);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;">
          <div style="padding:9px 12px;font-weight:700;font-size:13px;border-bottom:1px solid var(--hairline);">${esc(s.titre)}</div>
          ${(s.client_programme_exercices||[]).map(ex=>{
            const nbSeries = ex.series||1;
            let seriesHtml='';
            for(let sr=1;sr<=nbSeries;sr++){
              const l=logs[ex.id+'|'+ficheSemaine+'|'+sr]||{};
              const hasLog = l.charge!=null||l.reps!=null;
              seriesHtml+=`<div style="display:flex;gap:8px;align-items:center;font-size:12px;padding:2px 0;">
                <span style="color:var(--text-faint);width:16px;">#${sr}</span>
                <span style="${hasLog?'color:var(--text);font-weight:600;':'color:var(--text-faint);'}">
                  ${hasLog?(l.charge!=null?l.charge+'kg ':'')+''+(l.reps!=null?l.reps+' reps ':'')+''+(l.rir?'RIR '+l.rir:''):'—'}
                </span>
              </div>`;
            }
            return `<div style="padding:8px 12px;border-top:1px solid var(--hairline);">
              <div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">${esc(ex.nom)}</div>
              <div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">Cible : ${ex.series||'—'}×${esc(ex.reps||'—')}${ex.repos?' · repos '+esc(ex.repos):''}${ex.rir?' · RIR '+esc(ex.rir):''}</div>
              ${seriesHtml}
              ${(()=>{const cl=logs[ex.id+'|'+ficheSemaine+'|1'];return cl&&cl.commentaire?`<div style="font-size:11px;color:var(--text-muted);margin-top:4px;font-style:italic;">${esc(cl.commentaire)}</div>`:'';})()}
            </div>`;
          }).join('')||`<div style="padding:8px 12px;font-size:12px;color:var(--text-faint);">Aucun exercice.</div>`}
        </div>`).join('')}
    `).join('')||`<div class="fiche-prog-empty">Aucune séance dans ce programme.</div>`}`;
}

async function sauvegarderFicheSandbox(clientId){
  const btn = document.getElementById('ficheSaveBtn');
  if (btn){ btn.disabled=true; btn.textContent='Enregistrement…'; }
  const body = {
    client_id: clientId,
    prenom: document.getElementById('fPrenom').value.trim(),
    nom: document.getElementById('fNom').value.trim(),
    date_naissance: document.getElementById('fNaissance').value || null,
    email: document.getElementById('fEmail').value.trim(),
    date_debut: document.getElementById('fDebut').value || null,
    jour_bilan: document.getElementById('fJourBilan').value || null,
    taille_cm: parseInt(document.getElementById('fTaille').value)||null,
    objectif: document.getElementById('fObjectif').value.trim() || null,
    updated_at: new Date().toISOString(),
  };
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method:'POST', headers:supaHeaders({ Prefer:'return=representation,resolution=merge-duplicates' }), body:JSON.stringify(body)
    });

    ficheData.profil = (await res.json())[0];
    if (btn){ btn.textContent='Enregistré ✓'; setTimeout(()=>{ btn.textContent='Enregistrer les informations'; btn.disabled=false; },2000); }
  } catch(e){ alert('Erreur : '+e.message); if (btn){ btn.textContent='Enregistrer les informations'; btn.disabled=false; } }
}

  if (t === 'progression') return renderProgressionTab();
  if (t === 'fiche') return renderFicheTab();
  return `
    <div class="panel-row"><span class="l">Statut bilan</span><span class="chip ${c.enRetard?'late':'ok'}"><span class="dot"></span>${c.enRetard?'En retard':'À jour'}</span></div>
    <div class="panel-row"><span class="l">Dernière connexion</span><span class="v mono" style="font-size:11px;">${esc(c.dernConnexion||'Jamais connecté')}</span></div>
    <div class="panel-row"><span class="l">Accès feuille</span><span class="v">${c.verrouile ? '🔒 Verrouillé' : 'Libre'}</span></div>
    <div class="panel-row"><span class="l">Protocole chimie</span><span class="v">${c.chimieActif ? 'Actif' : 'Inactif'}</span></div>`;
}

function renderNotesTab(){
  const notes = panelNotes || [];
  return `
    <div class="note-form" style="margin-bottom:14px;">
      <textarea id="noteInput" placeholder="Écrire une note privée sur ce client…"></textarea>
      <button class="btn primary" style="margin-top:8px;width:100%;justify-content:center;" onclick="soumettreNote()">Ajouter la note</button>
    </div>
    ${notes.length ? notes.map(n => `
      <div class="note-item">
        <div class="txt">${esc(n.contenu)}</div>
        <div class="meta"><span class="date">${fmtDateNote(n.created_at)}</span><button class="del" onclick="retirerNote(${n.id})">Supprimer</button></div>
      </div>`).join('') : `<div class="empty-panel" style="padding:24px 12px;">Aucune note pour ce client.</div>`}`;
}

async function soumettreNote(){
  const el = document.getElementById('noteInput');
  const contenu = (el.value || '').trim();
  if (!contenu) return;
  const c = data.clients.find(x=>x.id===state.selected);
  if (!c) return;
  try {
    await ajouterNote(c.id, contenu);
    panelNotes = await chargerNotes(c.id);
    document.getElementById('panelBody').innerHTML = renderNotesTab();
  } catch(e) { alert('Erreur : ' + e.message); }
}
async function retirerNote(id){
  const c = data.clients.find(x=>x.id===state.selected);
  if (!c) return;
  try {
    await supprimerNoteApi(id);
    panelNotes = await chargerNotes(c.id);
    document.getElementById('panelBody').innerHTML = renderNotesTab();
  } catch(e) { alert('Erreur : ' + e.message); }
}

// ── Progression (bilan_snapshots, Supabase) ───────────────────────────────
let panelProgression = null;
async function chargerProgression(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/bilan_snapshots?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.asc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
function progressionChart(vals, color){
  const w=560,h=100,min=Math.min(...vals),max=Math.max(...vals);
  const pts = vals.map((v,i)=>[ (i/(vals.length-1||1))*w, h - ((v-min)/((max-min)||1))*(h-10) - 4 ]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${h*f}" x2="${w}" y2="${h*f}" stroke="var(--hairline)" stroke-width="1"/>`).join('');
  return `<svg class="bigchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" opacity="0.18"/>
  </svg>`;
}
function renderProgressionTab(){
  const list = panelProgression || [];
  const poids = list.map(s => parseFloat(s.poids_moyen)).filter(v => !isNaN(v));
  return `
    ${poids.length >= 2 ? `
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-faint);margin-bottom:6px;">Poids moyen par bilan</div>
      ${progressionChart(poids, 'var(--accent)')}
    ` : `<div class="empty-panel" style="padding:20px 12px;margin-bottom:12px;">Pas assez de bilans validés pour tracer un graphique (minimum 2).</div>`}
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-faint);margin:14px 0 6px;">Historique</div>
    ${list.length ? list.slice().reverse().map(s => `
      <div class="note-item">
        <div class="txt"><b>Semaine ${esc(s.semaine||'?')}</b>${s.poids_moyen ? ' · ' + parseFloat(s.poids_moyen).toFixed(1) + ' kg' : ''}${s.jours_diete_ok != null ? ' · diète ' + s.jours_diete_ok + '/7' : ''}</div>
        ${s.commentaire_jour ? `<div class="txt" style="color:var(--text-faint);margin-top:4px;">${esc(s.commentaire_jour)}</div>` : ''}
        <div class="meta"><span class="date">${esc(s.date_validation||'')}</span></div>
      </div>`).join('') : `<div class="empty-panel" style="padding:24px 12px;">Aucun bilan enregistré pour ce client.</div>`}`;
}

// ── Fiche client (client_profils, Supabase) ────────────────────────────
async function chargerFiche(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const rows = await res.json();
  return rows[0] || { client_id: clientId, prenom:'', nom:'', date_naissance:null, email:'' };
}
function ageDepuisDate(dateStr){
  if (!dateStr) return null;
  const naissance = new Date(dateStr);
  if (isNaN(naissance)) return null;
  const auj = new Date();
  let age = auj.getFullYear() - naissance.getFullYear();
  const m = auj.getMonth() - naissance.getMonth();
  if (m < 0 || (m === 0 && auj.getDate() < naissance.getDate())) age--;
  return age;
}
function renderFicheTab(){
  const f = panelFiche || {};
  const age = ageDepuisDate(f.date_naissance);
  return `
    <div class="field-row"><label>Prénom</label><input id="fFichePrenom" type="text" value="${esc(f.prenom||'')}"></div>
    <div class="field-row"><label>Nom</label><input id="fFicheNom" type="text" value="${esc(f.nom||'')}"></div>
    <div class="field-row"><label>Date de naissance${age!=null?' ('+age+' ans)':''}</label><input id="fFicheNaissance" type="date" value="${esc(f.date_naissance||'')}"></div>
    <div class="field-row"><label>Email</label><input id="fFicheEmail" type="email" value="${esc(f.email||'')}"></div>
    <div id="ficheMsg" style="font-size:11.5px;color:var(--accent);height:16px;margin-bottom:6px;"></div>
    <button class="btn primary" style="width:100%;justify-content:center;" onclick="sauvegarderFiche('${(panelFiche||{}).client_id||state.selected}')">Enregistrer</button>`;
}
async function sauvegarderFiche(clientId){
  const body = {
    client_id: clientId,
    prenom: document.getElementById('fFichePrenom').value.trim(),
    nom: document.getElementById('fFicheNom').value.trim(),
    date_naissance: document.getElementById('fFicheNaissance').value || null,
    email: document.getElementById('fFicheEmail').value.trim(),
    updated_at: new Date().toISOString(),
  };
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=representation,resolution=merge-duplicates' }), body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('supabase_' + res.status);
    panelFiche = (await res.json())[0];
    const msg = document.getElementById('ficheMsg');
    if (msg) { msg.textContent = 'Enregistré ✓'; setTimeout(()=>{ if (msg) msg.textContent=''; }, 2000); }
  } catch(e) { alert('Erreur : ' + e.message); }
}

function ouvrirNouveauClient(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-nouveau-client';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Nouveau client (Supabase)</h3>
      <div class="empty-panel" style="margin-bottom:14px;font-size:11.5px;padding:12px;">Ce client existera uniquement dans la base de données — il ne pourra pas se connecter à l'app tant qu'un développeur ne l'a pas aussi ajouté dans la liste <code>CLIENTS</code> codée en dur du fichier <code>Code.js</code> (GAS) et redéployé (l'authentification n'est pas encore migrée hors Sheets).</div>
      <div class="field-row"><label>Identifiant (unique, sans espace)</label><input id="fNewClientId" type="text" placeholder="ex: marie-d"></div>
      <div class="field-row"><label>Prénom</label><input id="fNewClientPrenom" type="text"></div>
      <div class="field-row"><label>Nom</label><input id="fNewClientNom" type="text"></div>
      <div class="field-row"><label>Date de naissance</label><input id="fNewClientNaissance" type="date"></div>
      <div class="field-row"><label>Email</label><input id="fNewClientEmail" type="email"></div>
      <div id="newClientErr" style="display:none;color:var(--critical);font-size:12px;margin-bottom:8px;"></div>
      <div class="modal-actions">
        <button class="btn" onclick="document.getElementById('modal-nouveau-client').remove()">Annuler</button>
        <button class="btn primary" onclick="confirmerNouveauClient()">Créer</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}
async function confirmerNouveauClient(){
  const id = document.getElementById('fNewClientId').value.trim();
  const errEl = document.getElementById('newClientErr');
  if (!id) { errEl.textContent = "L'identifiant est obligatoire."; errEl.style.display = 'block'; return; }
  if (data.clients.some(c => c.id === id)) { errEl.textContent = 'Cet identifiant existe déjà.'; errEl.style.display = 'block'; return; }
  const body = {
    client_id: id,
    prenom: document.getElementById('fNewClientPrenom').value.trim(),
    nom: document.getElementById('fNewClientNom').value.trim(),
    date_naissance: document.getElementById('fNewClientNaissance').value || null,
    email: document.getElementById('fNewClientEmail').value.trim(),
    supabase_only: true,
  };
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(body) });
    if (!res.ok) throw new Error('supabase_' + res.status);
    document.getElementById('modal-nouveau-client').remove();
    await rafraichir();
  } catch(e) { errEl.textContent = 'Erreur : ' + e.message; errEl.style.display = 'block'; }
}

function panelHTML(c){
  return `
    <div class="panel-head">
      <div class="panel-head-top">
        <div class="panel-avatar">${initials(c.nom)}</div>
        <button class="panel-close" onclick="closePanel()">✕</button>
      </div>
      <div class="panel-name">${esc(c.nom)}</div>
      <div class="panel-sub">${esc(c.titreActif || 'Aucun titre actif')}</div>
      ${c._supabaseOnly ? `<div class="empty-panel" style="margin:10px 0 0;padding:10px 12px;font-size:11px;">⚠️ Client Supabase uniquement — pas encore de connexion possible (n'existe pas dans la feuille Clients).</div>` : ''}
      <div class="panel-stats">
        <div class="panel-stat"><div class="l">Niveau</div><div class="v">${c.niveau||1}</div></div>
        <div class="panel-stat"><div class="l">Statut</div><div class="v" style="font-size:12px;">${c.enRetard?'En retard':'À jour'}</div></div>
        <div class="panel-stat"><div class="l">Chimie</div><div class="v" style="font-size:12px;">${c.chimieActif?'Actif':'Inactif'}</div></div>
      </div>
    </div>
    <div class="panel-tabs">
      <button class="panel-tab active" data-tab="apercu" onclick="setPanelTab('apercu')">Aperçu</button>
      <button class="panel-tab" data-tab="fiche" onclick="setPanelTab('fiche')">Fiche</button>
      <button class="panel-tab" data-tab="progression" onclick="setPanelTab('progression')">Progression</button>
      <button class="panel-tab" data-tab="notes" onclick="setPanelTab('notes')">Notes</button>
    </div>
    <div class="panel-body" id="panelBody">${panelTabContent(c, 'apercu')}</div>
    <div class="panel-footer">
      ${c._supabaseOnly ? `<button class="btn" style="flex:1;justify-content:center;" disabled title="Pas de connexion possible pour ce client">Ouvrir en vue client (indisponible)</button>` : `<a class="btn primary" href="index.html?viewAs=${encodeURIComponent(c.id)}">Ouvrir en vue client</a>`}
    </div>`;
}

// ── Dropdowns génériques ──────────────────────────────────────────────────
function toggleMenu(ev, id){
  ev.stopPropagation();
  const target = document.getElementById('menu-'+id);
  const wasOpen = target.classList.contains('open');
  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  if (!wasOpen) target.classList.add('open');
}
document.addEventListener('click', () => document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')));

function renderNotifMenu(){
  const bilans = data.bilansCoach.filter(b=>!b.coachTraite).slice(0,3);
  const retards = data.clients.filter(c=>c.enRetard).slice(0,3);
  const items = [
    ...bilans.map(b => `<div class="menu-item" style="align-items:flex-start;flex-direction:column;gap:1px;"><b>${esc(b.nom)}</b><span style="color:var(--text-faint);font-size:11.5px;">bilan à traiter · semaine ${esc(b.semaine||'')}</span></div>`),
    ...retards.map(c => `<div class="menu-item" style="align-items:flex-start;flex-direction:column;gap:1px;"><b>${esc(c.nom)}</b><span style="color:var(--text-faint);font-size:11.5px;">bilan en retard</span></div>`),
  ];
  const menu = document.getElementById('menu-notif');
  menu.innerHTML = `<div class="menu-label">À traiter</div>` + (items.length ? items.join('') : `<div class="menu-item" style="color:var(--text-faint);">Rien à signaler.</div>`);
  const count = bilans.length + retards.length;
  const badge = document.getElementById('notifCount');
  if (count) { badge.style.display='flex'; badge.textContent = count; } else { badge.style.display='none'; }
}

// ── Boot ───────────────────────────────────────────────────────────────
(async function boot(){
  await rafraichir();
  renderNotifMenu();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('shell').style.display = 'grid';
})();
</script>
