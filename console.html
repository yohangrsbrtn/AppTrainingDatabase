}
// Si un exercice retiré/déplacé laisse son groupe superset à un seul membre, on délie ce
// dernier aussi — un "superset" à un seul exercice n'a pas de sens.
function _nettoyerSupersetOrphelin(seance, groupe){
  if (groupe == null) return;
  const membres = seance.exercices.filter(e => e.superset_groupe === groupe);
  if (membres.length <= 2) membres.forEach(e => { e.superset_groupe = null; });
}

let dragExoSource = null;
function onDragStartExo(e, bi, si, ei){
  dragExoSource = { bi, si, ei };
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEndExo(){
  dragExoSource = null;
}
function onDropExo(e, bi, si, ei){
  e.preventDefault();
  const src = dragExoSource;
  dragExoSource = null;
  if (!src || src.bi !== bi || src.si !== si || src.ei === ei) { renderBlocsTemplate(); return; }
  const arr = tplEnEdition.blocs[bi].seances[si].exercices;
  const [moved] = arr.splice(src.ei, 1);
  const cible = src.ei < ei ? ei - 1 : ei;
  arr.splice(cible, 0, moved);
  renderBlocsTemplate();
}

// Repère d'insertion précis (ligne en haut ou en bas de la séance survolée, selon la
// moitié où se trouve le curseur) — partagé par l'éditeur template et l'éditeur client,
// sans quoi le drop insérait toujours "avant" la séance survolée, peu importe où on
// relâchait, ce qui rendait le point d'insertion exact difficile à prévoir.
function _dragOverInsertionLine(e, el){
  e.preventDefault();
  const r = el.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height / 2;
  el.classList.toggle('drag-over-top', !after);
  el.classList.toggle('drag-over-bottom', after);
}
function _dragOverInsertionLineOut(el){
  el.classList.remove('drag-over-top', 'drag-over-bottom');
}
// Position d'insertion finale, en tenant compte du décalage causé par le retrait de
// l'élément déplacé (splice) — cible = index d'insertion DANS LE TABLEAU D'ORIGINE
// (avant/après la séance survolée), reconverti pour le tableau une fois l'élément retiré.
function _dragInsertionIndex(arr, srcIdx, cible){
  arr.splice(srcIdx < cible ? cible - 1 : cible, 0, arr.splice(srcIdx, 1)[0]);
}

let dragSeanceSource = null;
function onDragStartSeance(e, bi, si){
  dragSeanceSource = { bi, si };
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEndSeance(){
  dragSeanceSource = null;
}
function onDropSeance(e, bi, si){
  e.preventDefault();
  const el = e.currentTarget;
  const r = el.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height / 2;
  _dragOverInsertionLineOut(el);
  const src = dragSeanceSource;
  dragSeanceSource = null;
  if (!src || src.bi !== bi) { renderBlocsTemplate(); return; }
  _dragInsertionIndex(tplEnEdition.blocs[bi].seances, src.si, si + (after ? 1 : 0));
  _renumeroterSeances(tplEnEdition.blocs[bi].seances);
  renderBlocsTemplate();
}

async function assignerTemplateAuClient(templateId, clientId){
  if (exercicesData === null) exercicesData = await chargerExercices();
  if (templatesData === null) templatesData = await chargerTemplates();
  const tpl = templatesData.find(t => t.id === templateId);
  const blocsArbo = await chargerTemplateArbo(templateId);

  // Un seul programme actif à la fois pour ce client — on désactive les précédents plutôt que les supprimer
  // (garde l'historique de logs des anciens programmes accessible).
  await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true`, {
    method: 'PATCH', headers: supaHeaders(), body: JSON.stringify({ actif: false })
  });

  const resCp = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes`, {
    method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }),
    body: JSON.stringify({ client_id: clientId, nom: tpl.nom, actif: true, source_template_id: templateId, brouillon: true })
  });
  if (!resCp.ok) throw new Error('supabase_' + resCp.status);
  const cp = (await resCp.json())[0];

  const blocsPayload = blocsArbo.map((b, bi) => ({ client_programme_id: cp.id, type: b.type || null, nombre_semaines: b.nombre_semaines || null, ordre: bi }));
  const resBlocs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(blocsPayload) });
  if (!resBlocs.ok) throw new Error('supabase_' + resBlocs.status);
  const blocsSaved = await resBlocs.json();
  const blocIdByOrdre = {};
  blocsSaved.forEach(b => { blocIdByOrdre[b.ordre] = b.id; });

  const seancesPayload = [];
  blocsArbo.forEach((b, bi) => {
    (b.programme_seances||[]).forEach((s, si) => {
      seancesPayload.push({ bloc_id: blocIdByOrdre[bi], titre: s.titre, ordre: si });
    });
  });
  let seancesSaved = [];
  if (seancesPayload.length) {
    const resSeances = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(seancesPayload) });
    if (!resSeances.ok) throw new Error('supabase_' + resSeances.status);
    seancesSaved = await resSeances.json();
  }
  const seanceIdByBlocOrdre = {};
  seancesSaved.forEach(s => { seanceIdByBlocOrdre[s.bloc_id + '|' + s.ordre] = s.id; });

  const exercicesPayload = [];
  blocsArbo.forEach((b, bi) => {
    const blocId = blocIdByOrdre[bi];
    (b.programme_seances||[]).forEach((s, si) => {
      const seanceId = seanceIdByBlocOrdre[blocId + '|' + si];
      (s.programme_seance_exercices||[]).forEach((ex, ei) => {
        const source = exercicesData.find(e => e.id === ex.exercice_id);
        exercicesPayload.push({
          seance_id: seanceId, exercice_id: ex.exercice_id, nom: source ? source.nom : '(exercice supprimé)',
          ordre: ei, series: ex.series, reps: ex.reps, repos: ex.repos, tempo: ex.tempo, rir: ex.rir, notes: ex.notes || null,
          superset_groupe: ex.superset_groupe ?? null,
        });
      });
    });
  });
  if (exercicesPayload.length) {
    const resExo = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(exercicesPayload) });
    if (!resExo.ok) throw new Error('supabase_' + resExo.status);
  }
  return cp;
}

async function reparerDietesPartagees(){
  const statusEl = document.getElementById('reparationDietesStatus');
  const btn = document.getElementById('btnReparerDietes');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Réparation en cours…'; }
  const resultats = [];
  for (const { client, nom } of DIETES_A_REPARER_20260801) {
    if (statusEl) statusEl.innerHTML = resultats.map(r=>`<div>${esc(r)}</div>`).join('') + `<div style="color:var(--text-faint);">⏳ ${esc(client)} — "${esc(nom)}"…</div>`;
    try {
      const dietesRaw = await apiGasProd('listerDietes', client);
      const dietes = typeof dietesRaw === 'string' ? JSON.parse(dietesRaw) : (dietesRaw || []);
      const d = dietes.find(x => (x.nom || '').trim().toUpperCase() === nom.toUpperCase());
      if (!d) { resultats.push(`❌ ${client} — "${nom}" introuvable dans GAS (vérifier le nom exact)`); continue; }

      const detailRaw = await apiGasProd('chargerDieteParPosition', client, { ligneTitre: d.ligne, colTitre: d.col });
      const detail = typeof detailRaw === 'string' ? JSON.parse(detailRaw) : detailRaw;
      const repasGAS = detail.repas || [];

      // Toujours un nouveau template dédié — c'est justement l'objet de la réparation.
      const tplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ nom, client_only: true }) });
      if (!tplRes.ok) throw new Error('template ' + tplRes.status);
      const tpl = (await tplRes.json())[0];

      const saveAliments = async (repasId, aliments) => {
        if (!aliments || !aliments.length) return;
        const payload = aliments.map((a, ai) => {
          const q = a.qte || 1;
          return {
            repas_id: repasId, nom: a.nom, quantite_g: q, ordre: ai,
            kcal_par_100g: q > 0 ? (a.cals||0)/q*100 : 0,
            prot_par_100g: q > 0 ? (a.prot||0)/q*100 : 0,
            glu_par_100g:  q > 0 ? (a.glu||0)/q*100  : 0,
            lip_par_100g:  q > 0 ? (a.lip||0)/q*100  : 0,
          };
        });
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`,
          { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(payload) });
      };
      for (let ri = 0; ri < repasGAS.length; ri++) {
        const r = repasGAS[ri];
        const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
          { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id: tpl.id, nom: r.nom, ordre: ri, variante_index: 0 }) });
        if (!rRes.ok) continue;
        const savedR = (await rRes.json())[0];
        await saveAliments(savedR.id, r.aliments);
        const equivs = r.equivalences || [];
        for (let vi = 0; vi < equivs.length; vi++) {
          const eq = equivs[vi];
          const eqRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
            { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id: tpl.id, nom: eq.nom, ordre: ri, variante_index: vi + 1 }) });
          if (!eqRes.ok) continue;
          const savedEq = (await eqRes.json())[0];
          await saveAliments(savedEq.id, eq.aliments);
        }
      }

      await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(client)}&nom=eq.${encodeURIComponent(nom)}`,
        { method:'PATCH', headers:supaHeaders(), body:JSON.stringify({ diete_template_id: tpl.id }) });

      resultats.push(`✅ ${client} — "${nom}" réparée (${repasGAS.length} repas restaurés depuis GAS)`);
    } catch(e) {
      resultats.push(`❌ ${client} — "${nom}" — erreur : ${e.message}`);
    }
    if (statusEl) statusEl.innerHTML = resultats.map(r=>`<div>${esc(r)}</div>`).join('');
  }
  dieteTemplatesData = null;
  if (btn) { btn.disabled = false; btn.textContent = '🔧 Relancer'; }
  if (statusEl) statusEl.innerHTML += `<div style="margin-top:6px;color:var(--text-faint);">Terminé.</div>`;
}

function renderDashboard(el){
  const bilansATraiter = data.bilansCoach.filter(b=>!b.coachTraite).sort((a,b)=> (b.ts||'').localeCompare(a.ts||''));
  const bilansSupaATrait = _bilansATraiterListe().map(b => {
    const c = data.clients.find(x=>x.id===b.client_id);
    // semaine_label est figé à la création du bilan et peut être faux (bug vécu : bilan
    // validé le 2 août affichant "3 août → 9 août") — recalculé ici via _bilanPeriodeLabel
    // (même logique jour_bilan-aware que la fiche client, cf. son commentaire pour le piège
    // "envoyé avant le jour_bilan" que l'ancienne version dv-6j ratait — ex: Hugo Saubusse,
    // jour_bilan=Dimanche, envoyé le samedi : "26 Juil→1 Août" au lieu de "27 Juil→2 Août").
    const labelFrais = _bilanPeriodeLabel(b, c ? c.jour_bilan : null);
    return { ...b, _supa:true, clientNom: c ? c.nom : b.client_id, semaine_label: labelFrais || b.semaine_label, _envoiRetard: _bilanEnvoiEnRetard(b, c ? c.jour_bilan : null) };
  });
  const bilansEnRetard = data.clients.filter(c=>c.enRetard);

  // Clients sans jour_bilan configuré : invisibles pour tous les mécanismes basés sur
  // ce champ (rappel automatique, calcul de retard, semaine de bilan) — un client dans
  // ce cas ne remontera JAMAIS dans "Bilans en retard" ci-dessus, il faut donc un
  // repérage actif et séparé (demande coach 2026-08-04).
  const clientsSansJourBilan = data.clients.filter(c => !c.estCoach && c.statut !== 'ancien' && !c.jour_bilan);

  // Fins de coaching à venir (GoCardless) : offre 6 mois/1 an payée d'avance,
  // aucun rappel de paiement mensuel n'existe pour ces clients (prélèvement
  // déjà fait) — le coach doit être alerté à J-15 pour éventuellement mettre
  // en place un nouveau prélèvement s'ils reconduisent. Reste affiché tant que
  // la date n'est pas mise à jour (y compris si déjà dépassée), comme "Bilans
  // en retard".
  const _joursRestants = dStr => Math.ceil((new Date(dStr+'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
  const finsCoachingProches = data.clients
    .filter(c => c.mode_paiement === 'gocardless' && c.date_fin_coaching && _joursRestants(c.date_fin_coaching) <= 15)
    .sort((a,b) => a.date_fin_coaching.localeCompare(b.date_fin_coaching));

  // Activité 7 jours : nombre de logs par jour calendaire (à partir de tms)
  const jourKey = tms => { const d = new Date(tms); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };
  const counts = {};
  data.logs.forEach(l => { const k = jourKey(l.tms); counts[k] = (counts[k]||0) + 1; });
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate()-i); days.push(counts[d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()] || 0); }
  const totalActivite = data.logs.length;

  el.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Console coach</div><h1>Accueil</h1></div>
      <div class="meta">${data.clients.length} client${data.clients.length>1?'s':''}</div>
    </div>
    <div class="dash-grid">
      <div class="card">

        ${(bilansATraiter.length+bilansSupaATrait.length) ? `<div class="card-list">
          ${bilansSupaATrait.map(b => `
            <div class="card-list-row" onclick="ouvrirBilanDashboard(${b.id})">
              <div class="mini-avatar">${initials(b.clientNom)}</div>
              <div><div class="t">${esc(b.clientNom)}${b._envoiRetard?' <span style="color:var(--critical);font-size:10px;font-weight:700;" title="Envoyé après la deadline (jour de bilan à midi)">⏰ retard</span>':''}</div><div class="s">${esc(b.semaine_label||'Supabase')} · validé le ${_fmtDateHeureBilan(b)} · clic pour voir le bilan</div></div>
              <button class="btn" style="font-size:10px;padding:3px 8px;" onclick="event.stopPropagation();marquerBilanSupaTraite(${b.id})">✓ Traité</button>
            </div>`).join('')}
          ${bilansATraiter.map(b => `
            <div class="card-list-row" onclick="marquerTraite('${b.client}','${esc(b.ts)}')">
              <div class="mini-avatar">${initials(b.nom)}</div>
              <div><div class="t">${esc(b.nom)}</div><div class="s">Semaine ${esc(b.semaine||'')} · clic pour marquer traité</div></div>
              <div class="time">${esc(b.ts||'')}</div>
            </div>`).join('')}
        </div>` : `<div class="card-empty">${iCheckCircle()}Aucun bilan à traiter.</div>`}
      </div>
      <div class="card">
        <div class="card-head">${iClipboard()}<span class="t">Bilans en retard</span></div>
        ${bilansEnRetard.length ? `<div class="card-list">
          ${bilansEnRetard.map(c => `
            <div class="card-list-row" onclick="ouvrirBilanEnRetardDashboard('${c.id}')">
              <div class="mini-avatar">${initials(c.nom)}</div>
              <div><div class="t">${esc(c.nom)}</div><div class="s">Niveau ${c.niveau||1} · clic pour voir le bilan</div></div>
              <span class="chip late"><span class="dot"></span>Retard</span>
            </div>`).join('')}
        </div>` : `<div class="card-empty">${iCheckCircle()}Tous vos clients sont à jour.</div>`}
      </div>
      <div class="card">
        ${(() => { const enAttente = _bilansEnAttenteListe(); return `
        <div class="card-head">${iClipboard()}<span class="t">Bilans en attente</span>${enAttente.length?`<span style="margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;">${enAttente.length}</span>`:''}</div>
        ${enAttente.length ? `<div class="card-list">
          ${enAttente.map(b => { const c = data.clients.find(x=>x.id===b.client_id); const nom = c ? c.nom : b.client_id; return `
            <div class="card-list-row" onclick="ouvrirBilanDashboard(${b.id})">
              <div class="mini-avatar">${initials(nom)}</div>
              <div><div class="t">${esc(nom)}</div><div class="s">${esc(_bilanPeriodeLabel(b, c ? c.jour_bilan : null) || b.semaine_label || '')} · en attente d'info</div></div>
              <button class="btn" style="font-size:10px;padding:3px 8px;" onclick="event.stopPropagation();toggleBilanEnAttente(${b.id}, false)">↩ À traiter</button>
            </div>`; }).join('')}

        `; })()}
      </div>
      <div class="card timeline-card" style="grid-row: span 2;">
        <div class="card-head">${iGrid()}<span class="t">Activité récente</span></div>
        <div class="card-list">
          ${data.logs.length ? data.logs.slice(0,25).map(l => { const lib = libelleLog(l); return `
            <div class="tl-row"><div class="tl-dot"></div><div><div class="t">${lib.icon} <b>${esc(l.nom)}</b> — ${esc(lib.txt)}</div><div class="d">${esc(l.ts)}</div></div></div>`; }).join('')

      </div>
      <div class="card chart-card" style="grid-column: span 2;">
        <div class="card-head" style="padding-bottom:0;">${iTrophy()}<span class="t">Activité (7 jours)</span></div>
        <div class="chart-top"><div class="big-value">${totalActivite} <span style="font-size:13px;color:var(--text-faint);font-family:var(--font-body);font-weight:600;">événements</span></div></div>
        ${bigChart(days,'var(--accent)')}
      </div>
      <div class="card">
        <div class="card-head">${iDatabase()}<span class="t">Aliments à valider</span></div>
        ${data.aValider.length ? `<div class="card-list">
          ${data.aValider.slice(0,4).map(a => `
            <div class="card-list-row">
              <div><div class="t">${esc(a.nom)}</div><div class="s">ajouté par ${esc(a.ajoutePar||'?')}</div></div>

      </div>

async function marquerTraite(){
  if (!bilanDetailState._supabaseBilanId) return;
  try {
    const traiteAt = new Date().toISOString();
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/bilans?id=eq.${bilanDetailState._supabaseBilanId}`,
      { method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ coach_traite: true, coach_traite_at: traiteAt }) }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    bilanDetailState.coachTraite = true;
    if (_ficheBilans) {
      const b = _ficheBilans.find(x => x.id === bilanDetailState._supabaseBilanId);
      if (b) { b.coach_traite = true; b.coach_traite_at = traiteAt; }
    }
    const ba = (data.bilansAll || []).find(b => b.id === bilanDetailState._supabaseBilanId);
    if (ba) { ba.coach_traite = true; ba.coach_traite_at = traiteAt; }
    if (state.nav === 'bilan-detail') renderMain();
  } catch(e) { alert('Erreur : ' + e.message); }
}

// Bascule le statut "en attente" (info manquante, ex: mensurations) d'un bilan envoyé —
// disponible depuis le dashboard, la page Bilans et la page de détail d'un bilan.
// Un bilan mis en attente sort de "Bilans à traiter" (mais reste envoyé, pas "traité")
// jusqu'à ce qu'il soit repassé "à traiter" ou marqué traité directement.
async function toggleBilanEnAttente(bilanId, enAttente) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/bilans?id=eq.${bilanId}`, {
      method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ en_attente: enAttente })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const ba = (data.bilansAll || []).find(b => b.id === bilanId);
    if (ba) ba.en_attente = enAttente;
    if (_ficheBilans) {
      const b = _ficheBilans.find(x => x.id === bilanId);
      if (b) b.en_attente = enAttente;
    }
    if (bilanDetailState && bilanDetailState._supabaseBilanId === bilanId) bilanDetailState.enAttente = enAttente;
    renderMain();
  } catch(e) { alert('Erreur : ' + e.message); }
}

async function changerStatutClient(clientId, statut) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: clientId, statut })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const c = data.clients.find(x => x.id === clientId);
    if (c) c.statut = statut;
    if (c && clientId !== COACH_CLIENT_ID) syncClientVersCompta(clientId, c.prenom || '', c.nom, statut);
    document.querySelectorAll('.menu').forEach(m => m.classList.remove('open'));
    renderTable();
  } catch(e) { alert('Erreur : ' + e.message); }
}

// Dernière connexion : pour un client basculé en Supabase only, on affiche sa
// vraie dernière connexion Supabase (écrite à chaque login réussi côté client_profils.derniere_connexion)
// plutôt que l'ancienne donnée GAS (obsolète dès qu'il ne se connecte plus via l'app GAS).
function _fmtDerniereConnexion(c){
  if (c.supabaseOnlyActif) {
    if (!c.derniereConnexionSupa) return 'Jamais connecté';
    const d = new Date(c.derniereConnexionSupa);
    return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }
  return c.dernConnexion || 'Jamais connecté';
}

// Pour un client supabase_only, "Verrouiller l'accès" coupe désormais sa connexion à
// l'app (client_profils.verrouille_app) — plus la même chose que l'ancien verrouillage
// GAS (verrouilerAccesClient), qui touche les Google Sheets et reste utilisé tel quel
// pour les clients encore sur l'ancien système. Bascule manuelle, client par client.
async function toggleVerrou(id, verrouille){
  const c = (data.clients||[]).find(cl => cl.id === id);
  try {
    if (c && c.supabaseOnlyActif) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(id)}`, {
        method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ verrouille_app: !verrouille })
      });
      if (!res.ok) throw new Error('supabase_' + res.status);
    } else {
      await apiAs(verrouille ? 'deverrouilerAccesClient' : 'verrouilerAccesClient', id);
    }
    await rafraichir(); if (state.nav==='clients') renderTable();
  } catch(e) { alert('Erreur : ' + e.message); }
}
// Bascule client_profils.supabase_only à true — dernière étape de la migration : la
// connexion du client passera entièrement par Supabase (plus GAS). Upsert car un client
// tout juste migré peut ne pas encore avoir de ligne client_profils.
async function togglerSupabaseOnly(id){
  if (!confirm('Passer ce client en Supabase only ? Sa connexion utilisera désormais uniquement Supabase (plus GAS).')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=representation,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: id, supabase_only: true })
    });
    if (!res.ok) throw new Error('supabase_' + res.status);
    await rafraichir();
    if (state.nav==='clients') renderTable();
    if (state.nav==='fiche-client' && state.selected===id) openPanel(id);
  } catch(e) { alert('Erreur : ' + e.message); }
}

async function chargerProgrammeActif(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true&order=created_at.desc&limit=1`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const rows = await res.json();
  if (!rows.length) return null;
  const cp = rows[0];
  const resArbo = await fetch(
    `${SUPABASE_URL}/rest/v1/client_programme_blocs?client_programme_id=eq.${cp.id}&order=ordre.asc` +
    `&select=*,client_programme_seances(*,client_programme_exercices(*))` +
    `&client_programme_seances.order=ordre.asc&client_programme_seances.client_programme_exercices.order=ordre.asc`,
    { headers: supaHeaders() }
  );
  const blocs = resArbo.ok ? await resArbo.json() : [];
  const exIds = [];
  blocs.forEach(b => (b.client_programme_seances||[]).forEach(s => (s.client_programme_exercices||[]).forEach(ex => exIds.push(ex.id))));
  let logs = {};
  if (exIds.length) {
    const resLogs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exIds.join(',')})&order=semaine.asc,numero_serie.asc`, { headers: supaHeaders() });
    if (resLogs.ok) (await resLogs.json()).forEach(l => { logs[l.client_programme_exercice_id+'|'+l.semaine+'|'+l.numero_serie] = l; });
  }
  return Object.assign({}, cp, { blocs, logs });
}

function _chargerAnalyses(clientId){
  if (_ficheAnalysesClientId !== clientId) {
    _ficheAnalysesClientId = clientId;
    _ficheAnalyses = undefined;
  }
  if (_ficheAnalyses !== undefined || _ficheAnalysesLoading) return;
  _ficheAnalysesLoading = true;
  fetch(`${SUPABASE_URL}/rest/v1/client_analyses_sante?client_id=eq.${encodeURIComponent(clientId)}&order=date.desc,nom.asc&select=*`, { headers: supaHeaders() })
    .then(r => r.json())
    .then(rows => {
      _ficheAnalyses = Array.isArray(rows) ? rows : [];
      _ficheAnalysesLoading = false;
      const el = document.getElementById('ficheTabContent');
      const c = data.clients.find(x=>x.id===state.selected);
      if (el && ficheTab === 'protocole' && _ficheProtocoleSubTab === 'analyses') el.innerHTML = renderFicheProtocoleTab(c);
    })
    .catch(() => { _ficheAnalyses = []; _ficheAnalysesLoading = false; });
}

function renderFicheAnalysesSubTab(c){
  if (_analyseEnEdition) return renderFormAnalyseHtml(c);

  _chargerAnalyses(c.id);
  if (_ficheAnalyses === undefined) {
    return `<div style="padding:30px;text-align:center;color:var(--text-faint);">Chargement…</div>`;
  }

  const parDate = new Map();
  _ficheAnalyses.forEach(r => {
    if (!parDate.has(r.date)) parDate.set(r.date, []);
    parDate.get(r.date).push(r);
  });
  const dates = [...parDate.keys()].sort((a,b) => b.localeCompare(a));

  const listeHtml = dates.length ? dates.map(date => {
    const marqueurs = parDate.get(date);
    return `<div class="fiche-card" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong>${new Date(date+'T00:00:00').toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' })}</strong>
        <div style="display:flex;gap:6px;">
          <button class="btn" style="font-size:11.5px;padding:4px 10px;" onclick="ouvrirFormAnalyse('${c.id}','${date}')">✎ Éditer</button>
          <button class="icon-btn del" style="width:24px;height:24px;" onclick="supprimerPriseDeSang('${c.id}','${date}')" title="Supprimer">${iTrash()}</button>
        </div>
      </div>
      ${marqueurs.map(m => `
        <div class="panel-row">
          <span class="l">${esc(m.nom)}</span>
          <span class="v">${m.valeur}${m.unite?' '+esc(m.unite):''}${(m.ref_min!==null&&m.ref_max!==null)?` <span style="color:var(--text-faint);">(réf. ${m.ref_min}–${m.ref_max})</span>`:''}</span>
        </div>`).join('')}
    </div>`;
  }).join('') : `<p style="color:var(--text-faint);margin-bottom:14px;">Aucune prise de sang enregistrée.</p>`;

  return `${listeHtml}<button class="btn primary" onclick="ouvrirFormAnalyse('${c.id}')">+ Nouvelle prise de sang</button>`;
}

// (ajout/suppression de ligne) — les inputs ne sont pas contrôlés en React-style,
// donc un re-render perdrait la saisie en cours sans ça.
function _lireLignesMarqueursDom(){
  if (!_analyseEnEdition) return;
  _analyseEnEdition.marqueurs.forEach((m, i) => {
    const nom = document.getElementById(`am-nom-${i}`);
    const valeur = document.getElementById(`am-valeur-${i}`);
    const unite = document.getElementById(`am-unite-${i}`);
    const refMin = document.getElementById(`am-refmin-${i}`);
    const refMax = document.getElementById(`am-refmax-${i}`);
    if (nom) m.nom = nom.value;
    if (valeur) m.valeur = valeur.value;
    if (unite) m.unite = unite.value;
    if (refMin) m.ref_min = refMin.value;
    if (refMax) m.ref_max = refMax.value;
  });
  const dateEl = document.getElementById('am-date');
  if (dateEl) _analyseEnEdition.date = dateEl.value;
}

        <input id="am-unite-${i}" type="text" placeholder="Unité" value="${esc(m.unite)}" style="font-size:13px;padding:6px 8px;border-radius:var(--radius-sm);border:1px solid var(--hairline);background:var(--surface-2);color:var(--text);">
        <input id="am-refmin-${i}" type="number" step="any" placeholder="Réf. min" value="${m.ref_min===null||m.ref_min===undefined?'':m.ref_min}" style="font-size:13px;padding:6px 8px;border-radius:var(--radius-sm);border:1px solid var(--hairline);background:var(--surface-2);color:var(--text);">
        <input id="am-refmax-${i}" type="number" step="any" placeholder="Réf. max" value="${m.ref_max===null||m.ref_max===undefined?'':m.ref_max}" style="font-size:13px;padding:6px 8px;border-radius:var(--radius-sm);border:1px solid var(--hairline);background:var(--surface-2);color:var(--text);">
        <button class="icon-btn del" style="width:24px;height:24px;" onclick="supprimerLigneMarqueur(${i})" title="Retirer">${iTrash()}</button>
      </div>`).join('')}
    <button class="btn" style="font-size:12px;margin-bottom:14px;" onclick="ajouterLigneMarqueur()">+ Marqueur</button>
    <div style="display:flex;gap:8px;">
      <button class="btn" onclick="fermerFormAnalyse()">Annuler</button>
      <button class="btn primary" onclick="sauverAnalyse('${c.id}')">Enregistrer</button>
    </div>
  </div>`;
}

async function sauverAnalyse(clientId){
  _lireLignesMarqueursDom();
  const a = _analyseEnEdition;
  const date = a.date;
  if (!date) { alert('Merci de renseigner une date.'); return; }
  const lignes = a.marqueurs
    .map(m => ({
      client_id: clientId, date,
      nom: (m.nom||'').trim(),
      valeur: parseFloat(m.valeur),
      unite: (m.unite||'').trim() || null,
      ref_min: m.ref_min === '' || m.ref_min === null || m.ref_min === undefined ? null : parseFloat(m.ref_min),
      ref_max: m.ref_max === '' || m.ref_max === null || m.ref_max === undefined ? null : parseFloat(m.ref_max),
    }))
    .filter(m => m.nom && !isNaN(m.valeur));
  if (!lignes.length) { alert('Merci de renseigner au moins un marqueur avec un nom et une valeur.'); return; }
  try {
    // Remplace toutes les lignes existantes pour ce (client, date) — même pattern
    // delete-all/recreate que la diète et le protocole (pas de diff ligne par ligne).
    await fetch(`${SUPABASE_URL}/rest/v1/client_analyses_sante?client_id=eq.${encodeURIComponent(clientId)}&date=eq.${date}`, { method:'DELETE', headers:supaHeaders() });
    await fetch(`${SUPABASE_URL}/rest/v1/client_analyses_sante`, { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify(lignes) });
    _ficheAnalyses = undefined;
    _analyseEnEdition = null;
    const el = document.getElementById('ficheTabContent');
    const c = data.clients.find(x=>x.id===state.selected);
    if (el) el.innerHTML = renderFicheProtocoleTab(c);
  } catch(e) { alert("Erreur : la prise de sang n'a pas pu être enregistrée."); }
}

async function supprimerPriseDeSang(clientId, date){
  if (!confirm('Supprimer cette prise de sang et tous ses marqueurs ?')) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_analyses_sante?client_id=eq.${encodeURIComponent(clientId)}&date=eq.${date}`, { method:'DELETE', headers:supaHeaders() });
    _ficheAnalyses = (_ficheAnalyses||[]).filter(r => r.date !== date);
    const el = document.getElementById('ficheTabContent');
    const c = data.clients.find(x=>x.id===state.selected);
    if (el) el.innerHTML = renderFicheProtocoleTab(c);
  } catch(e) { alert("Erreur : la suppression a échoué."); }
}

function renderFicheTabContent(c){
  if (!c) c = data.clients.find(x=>x.id===state.selected);
  if (ficheTab === 'profil')      return renderFicheProfilTab(c);
  if (ficheTab === 'programmes')  return renderFicheProgTab(c);
  if (ficheTab === 'diete')       return renderFicheDieteTab(c);
  if (ficheTab === 'progression') return renderFicheProgressionTab();
  if (ficheTab === 'notes')       return renderFicheSuiviTab(c);
  if (ficheTab === 'bilans')        return renderFicheBilansTab(c);
  if (ficheTab === 'mensurations')  return renderFicheMensurationsTab(c);
  if (ficheTab === 'photos')        return renderFichePhotosTab(c);
  if (ficheTab === 'roadmap')       return renderFicheRoadmapTab(c);
  if (ficheTab === 'protocole')     return renderFicheProtocoleTab(c);
  return '';
}

// Charge (si besoin) la galerie photo unifiée (bilans + mensurations) + toutes les mensurations
// du client — partagé entre l'onglet Bilans (galerie en tête de liste + rapprochement par
// semaine) et l'onglet Photos dédié, pour ne charger qu'une seule fois peu importe l'ordre de
// visite des deux onglets.
function _assurerGaleriePhotos(c){
  if (!c) return;
  if (_ficheBilanPhotosClientId !== c.id) {
    _ficheBilanPhotosClientId = c.id;
    _ficheBilanPhotosGallery = null;
    _ficheBilanPhotosSel = [];
    _fichePhotosDelSel = new Set();
    _fichePhotosSlotL = null;
    _fichePhotosSlotR = null;
    _ficheBilansMensurations = null;
  }
  if (_ficheBilanPhotosGallery !== null) return;
  // Galerie unifiée, toutes sources confondues (bilans + mensurations), triée par la
  // vraie date représentée par la photo (date_validation du bilan / date de la
  // mensuration) — PAS par date d'upload, pour une chronologie fidèle. _key
  // (préfixe 'b'/'m' + id) évite toute collision entre les deux séquences d'id
  // distinctes (bilan_photos.id et mensuration_photos.id ne sont pas liées). Charge aussi,
  // en même temps, TOUTES les mensurations du client (pas juste celles avec photo) — sert
  // au rapprochement bilan↔mensurations par plage de dates de la semaine (pas date exacte).
  Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/bilan_photos?client_id=eq.${encodeURIComponent(c.id)}&select=*,bilans(date_validation)&order=created_at.desc`, { headers: supaHeaders() }).then(r => r.ok ? r.json() : []),
    fetch(`${SUPABASE_URL}/rest/v1/mensuration_photos?client_id=eq.${encodeURIComponent(c.id)}&select=*,mensurations(date)&order=created_at.desc`, { headers: supaHeaders() }).then(r => r.ok ? r.json() : []),
    fetch(`${SUPABASE_URL}/rest/v1/mensurations?client_id=eq.${encodeURIComponent(c.id)}&order=date.asc&select=id,date,poids,mesure,fessiers,cuisses,mollets,poitrine,epaules,bras`, { headers: supaHeaders() }).then(r => r.ok ? r.json() : []),
  ]).then(([bilanRows, mensRows, mensurations]) => {
    const a = (Array.isArray(bilanRows) ? bilanRows : []).map(p => ({ ...p, _source: 'bilan', _manuelle: !p.bilan_id, _date: (p.bilans && p.bilans.date_validation) || p.date || null, _key: 'b' + p.id }));
    const b = (Array.isArray(mensRows) ? mensRows : []).map(p => ({ ...p, _source: 'mensuration', _date: (p.mensurations && p.mensurations.date) || null, _key: 'm' + p.id }));
    _ficheBilanPhotosGallery = [...a, ...b].sort((x, y) => {
      if (!x._date && !y._date) return 0;
      if (!x._date) return -1; // pas de date connue (bilan en cours non validé) : en tête
      if (!y._date) return 1;
      return y._date.localeCompare(x._date);
    });
    _ficheBilansMensurations = Array.isArray(mensurations) ? mensurations : [];
    const el = document.getElementById('ficheTabContent');
    if (el && (ficheTab === 'bilans' || ficheTab === 'photos')) el.innerHTML = renderFicheTabContent(c);
  }).catch(() => { _ficheBilanPhotosGallery = []; _ficheBilansMensurations = []; });
}

// Onglet dédié "Photos" — même galerie unifiée que celle affichée en tête de l'onglet Bilans
// (bilans + mensurations, triée par date réelle), présentée ici en grand format plein écran
// plutôt qu'en bandeau compact. Sur chaque vignette :
// - clic sur la PHOTO elle-même → ouvre la galerie plein écran (ouvrirPhotoLightbox), navigable
//   au clavier/flèches, avec un bouton "🆚 Comparer" intégré (voir _renderLightboxDom) ;
// - l'icône 🆚 (coin bas-gauche, stopPropagation) → place/retire la photo dans le comparatif
//   (remplit GAUCHE puis DROITE, une 3e photo remplace la plus ancienne des deux — FIFO) ;
// - la CASE À COCHER (coin haut-droit, stopPropagation) → sélection multiple pour suppression groupée.
// Chaque vignette est aussi draggable : glisser-déposer directement sur le slot GAUCHE ou DROITE
// du comparatif ci-dessous permet de choisir précisément quel côté elle occupe.
function renderFichePhotosTab(c){
  if (!c) return '';
  _assurerGaleriePhotos(c);
  if (_ficheBilanPhotosGallery === null) {
    return `<div style="padding:30px;text-align:center;color:var(--text-faint);">Chargement…</div>`;
  }
  if (!_ficheBilanPhotosGallery.length) {
    return `<div class="fiche-card"><p style="color:var(--text-faint);">Aucune photo enregistrée (bilans ou mensurations) pour ce client.</p></div>`;
  }
  const dateOf = p => p._date ? new Date(p._date+'T00:00:00').toLocaleDateString('fr-FR') : '—';
  const findPhoto = key => _ficheBilanPhotosGallery.find(p => p._key === key);
  const compareSlotHtml = (key, slot) => {
    const p = key ? findPhoto(key) : null;
    if (!p) return `
      <div ondragover="event.preventDefault();" ondrop="_fichePhotosDropSlot(event,'${slot}')"
           style="flex:1;min-width:0;max-width:320px;aspect-ratio:9/16;border:2px dashed var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text-faint);font-size:11.5px;padding:10px;">
        Glisse une photo ici<br>ou clique sur 🆚 (${slot==='L'?'gauche':'droite'})
      </div>`;
    return `
      <div ondragover="event.preventDefault();" ondrop="_fichePhotosDropSlot(event,'${slot}')" style="flex:1;text-align:center;min-width:0;max-width:320px;position:relative;">
        <button onclick="_fichePhotosClearSlot('${slot}')" title="Retirer" style="position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:12px;cursor:pointer;z-index:1;">✕</button>
        <img src="${esc(p.url)}" style="width:100%;aspect-ratio:9/16;object-fit:contain;border-radius:var(--radius-sm);background:var(--surface-2);cursor:pointer;" onclick="ouvrirPhotoLightbox(_ficheBilanPhotosGallery,_ficheBilanPhotosGallery.findIndex(x=>x._key==='${p._key}'),true)">
        <div style="font-size:12px;color:var(--text-faint);margin-top:6px;">${dateOf(p)} · ${p._manuelle?'🖼️ Ajoutée':(p._source==='bilan'?'📋 Bilan':'📏 Mensuration')}</div>
      </div>`;
  };
  const hasCompare = _fichePhotosSlotL || _fichePhotosSlotR;
  const compareHtml = `
    <div class="fiche-card" style="margin-bottom:14px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        Comparaison
        ${hasCompare ? `<button class="btn" style="font-size:11px;padding:4px 9px;" onclick="_fichePhotosSlotL=null;_fichePhotosSlotR=null;_reRenderFichePhotosTab()">✕ Réinitialiser</button>` : ''}
      </div>
      <div style="display:flex;gap:12px;">
        ${compareSlotHtml(_fichePhotosSlotL,'L')}
        ${compareSlotHtml(_fichePhotosSlotR,'R')}
      </div>
      <div style="font-size:11px;color:var(--text-faint);margin-top:8px;">Clique sur 🆚 pour ajouter une photo à la comparaison (gauche puis droite), ou glisse-la directement dans le slot voulu.</div>
    </div>`;
  const delCount = _fichePhotosDelSel.size;
  const toutesCoches = _ficheBilanPhotosGallery.length > 0 && _ficheBilanPhotosGallery.every(p => _fichePhotosDelSel.has(p._key));
  return `${compareHtml}<div class="fiche-card">
    <div class="table-toolbar" style="padding:0 0 12px;flex-wrap:wrap;gap:8px;">
      <div class="title">${_ficheBilanPhotosGallery.length} photo${_ficheBilanPhotosGallery.length>1?'s':''}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn primary" style="font-size:11.5px;" onclick="ouvrirModalAjoutPhotoManuelle('${c.id}')">+ Ajouter une photo</button>
        <button class="btn" style="font-size:11.5px;" onclick="_fichePhotosToggleTous()">${toutesCoches ? 'Tout désélectionner' : 'Tout sélectionner'}</button>
        <button class="btn primary" style="font-size:11.5px;background:var(--critical);border-color:var(--critical);" ${delCount?'':'disabled'} onclick="_fichePhotosSupprimerSelection('${c.id}')">🗑 Supprimer la sélection (${delCount})</button>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;">
      ${_ficheBilanPhotosGallery.map((p, idx) => {
        const isCmp = p._key === _fichePhotosSlotL || p._key === _fichePhotosSlotR;
        const isDel = _fichePhotosDelSel.has(p._key);
        return `<div style="width:130px;" draggable="true" ondragstart="_fichePhotosDragStart(event,'${p._key}')">
          <div style="position:relative;width:130px;aspect-ratio:9/16;border-radius:var(--radius-sm);overflow:hidden;${isCmp?'box-shadow:0 0 0 3px var(--accent);':''}">
            <img src="${esc(p.url)}" style="width:100%;height:100%;object-fit:cover;cursor:pointer;" onclick="ouvrirPhotoLightbox(_ficheBilanPhotosGallery,${idx},true)">
            <span style="position:absolute;top:4px;left:4px;background:rgba(0,0,0,.65);color:#fff;font-size:9px;padding:2px 6px;border-radius:999px;">${p._manuelle?'🖼️ Ajoutée':(p._source==='bilan'?'📋 Bilan':'📏 Mensuration')}</span>
            <label style="position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(0,0,0,.55);border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="event.stopPropagation();">
              <input type="checkbox" ${isDel?'checked':''} onchange="_fichePhotosToggleDelSel('${p._key}')" style="width:15px;height:15px;margin:0;">
            </label>
            <button onclick="event.stopPropagation();_fichePhotosToggleCompare('${p._key}')" title="Ajouter à la comparaison" style="position:absolute;bottom:4px;left:4px;width:24px;height:24px;border-radius:6px;background:${isCmp?'var(--accent)':'rgba(0,0,0,.55)'};border:none;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;">🆚</button>
          </div>
          <div style="font-size:10.5px;color:var(--text-faint);text-align:center;margin-top:4px;">${dateOf(p)}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function _reRenderFichePhotosTab(){
  const c = (data.clients||[]).find(cl => cl.id === _ficheBilanPhotosClientId);
  const el = document.getElementById('ficheTabContent');
  if (el && ficheTab === 'photos') el.innerHTML = renderFichePhotosTab(c);
}

// Icône 🆚 sur une vignette : retire la photo si elle est déjà dans un slot, sinon la place dans
// le premier slot libre (gauche en priorité) ; si les deux sont déjà occupés, remplace le plus
// ancien des deux (gauche) et décale l'ancien "droite" — cohérent avec le clic répété sur une 3e
// photo qui "change" la comparaison plutôt que de la bloquer.
function _fichePhotosToggleCompare(key){
  if (_fichePhotosSlotL === key) { _fichePhotosSlotL = null; }
  else if (_fichePhotosSlotR === key) { _fichePhotosSlotR = null; }
  else if (!_fichePhotosSlotL) { _fichePhotosSlotL = key; }
  else if (!_fichePhotosSlotR) { _fichePhotosSlotR = key; }
  else { _fichePhotosSlotL = _fichePhotosSlotR; _fichePhotosSlotR = key; }
  _reRenderFichePhotosTab();
}

function _fichePhotosClearSlot(slot){
  if (slot === 'L') _fichePhotosSlotL = null; else _fichePhotosSlotR = null;
  _reRenderFichePhotosTab();
}

function _fichePhotosDragStart(e, key){
  e.dataTransfer.setData('text/plain', key);
  e.dataTransfer.effectAllowed = 'copy';
}

// Glisser-déposer une vignette directement sur le slot gauche ou droite du comparatif — si la
// photo occupait déjà l'autre slot, on la déplace (pas de doublon des deux côtés).
function _fichePhotosDropSlot(e, slot){
  e.preventDefault();
  const key = e.dataTransfer.getData('text/plain');
  if (!key) return;
  if (_fichePhotosSlotL === key) _fichePhotosSlotL = null;
  if (_fichePhotosSlotR === key) _fichePhotosSlotR = null;
  if (slot === 'L') _fichePhotosSlotL = key; else _fichePhotosSlotR = key;
  _reRenderFichePhotosTab();
}

function _fichePhotosToggleDelSel(key){
  if (_fichePhotosDelSel.has(key)) _fichePhotosDelSel.delete(key); else _fichePhotosDelSel.add(key);
  _reRenderFichePhotosTab();
}

function _fichePhotosToggleTous(){
  const toutesCoches = _ficheBilanPhotosGallery.length > 0 && _ficheBilanPhotosGallery.every(p => _fichePhotosDelSel.has(p._key));
  _fichePhotosDelSel = toutesCoches ? new Set() : new Set(_ficheBilanPhotosGallery.map(p => p._key));
  _reRenderFichePhotosTab();
}

// Supprime chaque photo sélectionnée depuis sa vraie table d'origine (bilan_photos ou
// mensuration_photos, selon _source/_key) — la galerie mélange les deux, jamais de suppression
// en masse par une seule requête possible ici.
async function _fichePhotosSupprimerSelection(clientId){
  const keys = [..._fichePhotosDelSel];
  if (!keys.length) return;
  if (!confirm(`Supprimer définitivement ${keys.length} photo${keys.length>1?'s':''} ?`)) return;
  const photos = keys.map(k => _ficheBilanPhotosGallery.find(p => p._key === k)).filter(Boolean);
  let erreurs = 0;
  for (const p of photos) {
    try {
      if (p._source === 'bilan') await supprimerBilanPhotoApi(p.id, p.url);
      else await supprimerMensurationPhotoApi(p.id, p.url);
    } catch(e) { erreurs++; }
  }
  _fichePhotosDelSel = new Set();
  _ficheBilanPhotosSel = _ficheBilanPhotosSel.filter(k => !keys.includes(k));
  if (keys.includes(_fichePhotosSlotL)) _fichePhotosSlotL = null;
  if (keys.includes(_fichePhotosSlotR)) _fichePhotosSlotR = null;
  _ficheBilanPhotosGallery = null; // force un rechargement propre de la galerie
  if (erreurs) alert(`${erreurs} photo(s) n'ont pas pu être supprimées.`);
  const c = (data.clients||[]).find(cl => cl.id === clientId);
  _assurerGaleriePhotos(c);
  _reRenderFichePhotosTab();
}

// Modale "+ Ajouter une photo" (onglet Photos) — une date choisie par le coach, plusieurs
// fichiers possibles d'un coup (tous rattachés à la même date).
function ouvrirModalAjoutPhotoManuelle(clientId){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-ajout-photo-manuelle';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  const today = new Date().toISOString().slice(0,10);
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:380px;">
      <h3 style="margin:0 0 16px;">+ Ajouter une photo</h3>
      <div class="fiche-field"><label>Date de la photo</label><input id="apmDate" type="date" value="${today}" style="font-size:16px;"></div>
      <div class="fiche-field"><label>Photo(s)</label><input id="apmFiles" type="file" accept="image/*" multiple style="font-size:14px;"></div>
      <div id="apmErr" style="display:none;color:var(--critical);font-size:12px;margin-bottom:6px;"></div>
      <div class="modal-actions" style="margin-top:16px;">
        <button class="btn" onclick="this.closest('.modal-overlay').remove()">Annuler</button>
        <button class="btn primary" id="apmBtn" onclick="confirmerAjoutPhotoManuelle('${clientId}')">Ajouter</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

async function confirmerAjoutPhotoManuelle(clientId){
  const dateStr = document.getElementById('apmDate').value;
  const files = Array.from(document.getElementById('apmFiles').files || []);
  const err = document.getElementById('apmErr');
  const btn = document.getElementById('apmBtn');
  if (!dateStr) { err.textContent = 'Choisis une date.'; err.style.display = 'block'; return; }
  if (!files.length) { err.textContent = 'Choisis au moins une photo.'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Envoi…';
  try {
    for (const file of files) await uploaderPhotoManuelle(clientId, file, dateStr);
    document.getElementById('modal-ajout-photo-manuelle')?.remove();
    _ficheBilanPhotosGallery = null;
    const c = (data.clients||[]).find(cl => cl.id === clientId);
    _assurerGaleriePhotos(c);
    _reRenderFichePhotosTab();
  } catch(e) {
    err.textContent = 'Erreur : ' + e.message; err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Ajouter';
  }
}

// Série actuelle de bilans consécutifs envoyés ET ponctuels (badge 🔥, demande coach 2026-08-09
// suite à une question sur la visibilité du bonus d'assiduité) — même calcul EXACT que le
// crédit XP (_calculerStreakBilans, api.js), pour que le badge affiché corresponde toujours au
// bonus qui serait réellement obtenu au prochain bilan ponctuel.
function _assurerStreakBilans(c){
  if (!c) return;
  if (_ficheStreakClientId !== c.id) { _ficheStreakClientId = c.id; _ficheStreak = null; }
  if (_ficheStreak !== null) return;
  _calculerStreakBilans(c.id, c.jour_bilan).then(n => {
    _ficheStreak = n;
    const el = document.getElementById('ficheTabContent');
    if (el && ficheTab === 'bilans') el.innerHTML = renderFicheTabContent(c);
  }).catch(() => { _ficheStreak = 0; });
}

function _streakChipHtml(){
  if (_ficheStreak === null) return '';
  if (!_ficheStreak) return `<div style="margin-bottom:10px;font-size:11.5px;color:var(--text-faint);">Aucune série de bilans ponctuels en cours.</div>`;
  const prochain = STREAK_BONUS[3] && _ficheStreak < 3 ? 3 : _ficheStreak < 6 ? 6 : _ficheStreak < 10 ? 10 : null;
  return `<div style="margin-bottom:10px;font-size:12px;display:flex;align-items:center;gap:6px;">
    <span class="chip off" title="Bilans consécutifs envoyés ET ponctuels — même série que le bonus XP">🔥 ${_ficheStreak} bilan${_ficheStreak>1?'s':''} d'affilée à l'heure</span>
    ${prochain ? `<span style="color:var(--text-faint);">encore ${prochain-_ficheStreak} pour le palier ${prochain} (+${STREAK_BONUS[prochain]} XP)</span>` : ''}
  </div>`;
}

function renderFicheBilansTab(c){
  if (!c) return '';
  if (_ficheBilansClientId !== c.id) {
    _ficheBilansClientId = c.id;
    _ficheBilans = null;
    _ficheBilansLoading = false;
    _ficheBilansSel = new Set();
    _ficheBilansVoirCorbeille = false;
    _ficheBilansCorbeille = null;
    _ficheBilansCorbeilleSel = new Set();
  }
  _assurerGaleriePhotos(c);
  _assurerStreakBilans(c);
  if (_ficheBilansVoirCorbeille) return _renderFicheBilansCorbeille(c);
  if (_ficheBilans === null) {
    if (!_ficheBilansLoading) {
      _ficheBilansLoading = true;
      fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(c.id)}&archive=eq.false&order=envoye_coach.asc,date_validation.desc.nullslast,created_at.desc`, { headers: supaHeaders() })
        .then(r => r.json())
        .then(rows => {
          // Re-tri côté client par vraie semaine (date de FIN de période, calculée comme
          // partout ailleurs via _bilanDetailBornes) plutôt que par l'ordre SQL brut
          // (envoye_coach.asc d'abord) — sinon un bilan non-envoyé orphelin d'une semaine
          // ancienne se retrouvait affiché AU-DESSUS d'un bilan bien plus récent juste parce
          // qu'il n'a jamais été envoyé, ce qui n'a aucun sens dans une liste chronologique
          // (vécu chez Manon Besnier : "27 Juil→2 Août" non-envoyé affiché avant "3→9 Août"
          // pourtant son tout dernier bilan réellement validé).
          _ficheBilans = _bilanTrierParPeriode(Array.isArray(rows) ? rows : [], c.jour_bilan);
          _ficheBilansLoading = false;
          const el = document.getElementById('ficheTabContent');
          if (el && ficheTab === 'bilans') el.innerHTML = renderFicheBilansTab(c);
        })
        .catch(() => { _ficheBilans = []; _ficheBilansLoading = false; });
    }
    return `<div style="padding:30px;text-align:center;color:var(--text-faint);">Chargement…</div>`;
  }
  const corbeilleLinkHtml = `<div style="margin-bottom:10px;"><button class="btn" style="font-size:11px;padding:4px 10px;" onclick="_ficheBilansVoirCorbeille=true;setFicheTab('bilans')">🗑 Voir la corbeille</button></div>`;
  if (_ficheBilans.length === 0) {
    return `${_renderFicheBilanPhotosGallery(c)}${_streakChipHtml()}${corbeilleLinkHtml}<div class="fiche-card"><p style="color:var(--text-faint);">Aucun bilan enregistré dans Supabase.</p></div>`;
  }
  const allSelected = _ficheBilans.length > 0 && _ficheBilans.every(b => _ficheBilansSel.has(b.id));
  const selCount = _ficheBilansSel.size;
  const _periodeLabels = _bilanPeriodeLabelsList(_ficheBilans, c.jour_bilan);
  // Une ligne dont le calcul (bornes/mensurations/photos liées) échoue ne doit JAMAIS faire
  // planter tout le tableau — sinon aucun bilan de ce client (même ceux avant la ligne fautive)
  // ne serait cliquable puisque .map() lève avant que `rows` soit construit. Chaque ligne est
  // donc calculée indépendamment ; en cas d'erreur elle reste affichée et cliquable, juste sans
  // les colonnes enrichies (📷/mensurations/badge retard).
  const rows = _ficheBilans.map((b, idx) => {
    const periode = _periodeLabels[idx];
    let chip = '', aPhoto = false, mensLiees = [];
    try {
      const traite = b.coach_traite;
      // Un bilan non-envoyé n'est le bilan "En cours" que si sa propre semaine n'est pas
      // encore terminée (cf. _supaGetOrCreateBilanCourant, bilan.js) — sinon c'est un ancien
      // bilan resté non rempli/non envoyé, orphelin, remplacé depuis par un nouveau "en cours" :
      // l'afficher comme "En cours" était trompeur (deux bilans "En cours" en même temps).
      const stillCurrent = b.created_at && new Date() <= _bilanDeadline(c.jour_bilan, new Date(b.created_at));
      chip = (b.envoye_coach
        ? (traite ? `<span class="chip ok"><span class="dot"></span>Traité</span>` : `<span class="chip late"><span class="dot"></span>À traiter</span>`)
        : (stillCurrent ? `<span class="chip off"><span class="dot"></span>En cours</span>` : `<span class="chip late"><span class="dot"></span>Non validé</span>`))
        + ' ' + _badgeEnvoiRetard(b, c.jour_bilan);
      const bornesLigne = _bilanDetailBornes(b.date_validation, b.created_at, c.jour_bilan, b.envoye_coach);
      const bornesLigneGrace = _bilanBornesAvecGraceMens(bornesLigne);
      mensLiees = _mensurationsDansPeriode(bornesLigneGrace, _ficheBilansMensurations || []);
      // 📷 : photo propre au bilan OU photo d'une mensuration liée (même fenêtre avec grâce
      // jour_bilan+1, cf. _bilanBornesAvecGraceMens) — cohérent avec la carte Photos du détail.
      aPhoto = (_ficheBilanPhotosGallery || []).some(p =>
        (p._source === 'bilan' && p.bilan_id === b.id) ||
        (p._source === 'mensuration' && mensLiees.some(m => m.id === p.mensuration_id)));
    } catch(e) { console.error('Erreur ligne bilan', b.id, e); }
    const checked = _ficheBilansSel.has(b.id);
    return `<tr style="cursor:pointer;" onclick="openFicheBilanDetail(${idx})">
      <td style="width:32px;text-align:center;" onclick="event.stopPropagation();">
        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleFicheBilanSel(${b.id}, this.checked)">
      </td>
      <td>${esc(periode)}</td>
      <td>${_fmtDateHeureBilan(b)}</td>
      <td>${chip}</td>
      <td style="text-align:center;" title="${aPhoto ? 'Photo(s) liée(s)' : ''}">${aPhoto ? '📷' : ''}</td>
      <td style="font-size:11px;color:var(--text-faint);" title="${mensLiees.map(m=>m.date).join(', ')}">${mensLiees.length ? `📏 ${mensLiees.length}` : ''}</td>
    </tr>`;
  }).join('');
  return `${_renderFicheBilanPhotosGallery(c)}${_streakChipHtml()}${corbeilleLinkHtml}<div class="fiche-card" style="overflow-x:auto;">
    <div class="table-toolbar" style="padding:10px 8px;">
      <label style="font-size:12px;color:var(--text-faint);cursor:pointer;display:flex;align-items:center;gap:5px;">
        <input type="checkbox" ${allSelected ? 'checked' : ''} onchange="toggleAllFicheBilanSel(this.checked)">
        Tout sélectionner
      </label>
      <button class="btn" style="font-size:12px;margin-left:auto;" ${selCount === 0 ? 'disabled' : ''}
        onclick="marquerFicheBilansSelTraite('${esc(c.id)}')">
        ✓ Marquer traité (${selCount})
      </button>
      <button class="btn" style="font-size:12px;color:var(--critical);" ${selCount === 0 ? 'disabled' : ''}
        onclick="supprimerFicheBilansSel('${esc(c.id)}')">
        🗑 Mettre à la corbeille (${selCount})
      </button>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="color:var(--text-faint);font-size:11px;text-transform:uppercase;">
        <th></th>
        <th style="text-align:left;padding:6px 8px;">Période</th>
        <th style="text-align:left;padding:6px 8px;">Validé le</th>
        <th style="text-align:left;padding:6px 8px;">Statut</th>
        <th style="text-align:center;padding:6px 8px;" title="Photos liées">📷</th>
        <th style="text-align:left;padding:6px 8px;" title="Mensurations prises dans la semaine du bilan">Mensurations</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// Plage de dates de la semaine couverte par un bilan — TOUJOURS via _bilanWeekBounds
// (prochaine échéance jour_bilan à partir d'une date de référence), jamais un simple
// "date_validation - 6 jours". Piège corrigé : un client peut envoyer AVANT son jour_bilan
// (ex: jour_bilan=Dimanche, envoyé le samedi) — "fin - 6 jours" prend alors le samedi comme
// fin de semaine et rate le dimanche suivant (bug vécu : bilan de Hugo Saubusse affiché
// "26 Juil → 1 Août" au lieu de "27 Juil → 2 Août", le vrai dimanche de fin). En cherchant la
// PROCHAINE occurrence du jour_bilan à partir de la référence (comme le fait déjà
// _supaGetSemaineLabel côté client), les deux cas (envoyé pile le jour, envoyé en avance)
// tombent juste. Référence : date_validation (fin réelle) si connue, sinon created_at (bilan
// encore en cours).
// Variante de _bilanWeekBounds qui cherche l'occurrence de jour_bilan la plus PROCHE de
// la référence (en avant OU en arrière), au lieu de toujours chercher en avant. Utilisée
// UNIQUEMENT ici, jamais dans _bilanWeekBounds elle-même (bilan.js/api.js) qui doit rester
// strictement "prochaine occurrence" pour ses propres usages (calcul de fenêtre d'un bilan
// encore en cours depuis sa date de création — toujours en avant, jamais en arrière).
// Nécessaire pour un envoi tardif : un client dont jour_bilan=Dimanche mais qui valide le
// lundi (un jour de retard) doit voir "27 Juil→2 Août" (le dimanche qui vient de passer),
// pas "3 Août→9 Août" (le prochain dimanche, que donnerait une recherche uniquement en avant).
// createdAtDate (optionnel) désambiguïse le cas exactement "à égalité d'un jour" (validé pile
// le jour_bilan lui-même, avant=6/arriere=1 ou l'inverse selon le jour) : si le bilan a été CRÉÉ
// après le début de la semaine "en avant", il ne peut pas s'agir d'un envoi tardif de la semaine
// "en arrière" (déjà terminée avant même sa création) — on force alors la semaine en avant même
// si elle est numériquement plus loin. Bug vécu (Jean-Baptiste Bernard) : bilan CRÉÉ ET validé
// le dimanche jour_bilan lui-même pour la semaine qui démarre ce jour — la recherche "plus
// proche" le collait par erreur sur la semaine précédente, déjà occupée par un vrai bilan
// orphelin (deux bilans distincts affichant la même plage de dates "2 Août → 8 Août").
function _bilanWeekBoundsNearest(jourBilanNom, refDate, createdAtDate) {
  jourBilanNom = typeof _normJourBilan === 'function' ? _normJourBilan(jourBilanNom) : jourBilanNom;
  const rawIdx = (jourBilanNom && jourBilanNom in _JOURS_IDX_FR) ? _JOURS_IDX_FR[jourBilanNom] : 6;
  const cibleIdx = (rawIdx - 1 + 7) % 7; // veille du jour_bilan — cohérent avec _bilanWeekBounds (api.js)
  const curIdx = (refDate.getDay() + 6) % 7;
  const avant = (cibleIdx - curIdx + 7) % 7;
  const arriere = (curIdx - cibleIdx + 7) % 7;
  let preferForward = avant <= arriere;
  if (!preferForward && createdAtDate) {
    const finForward = new Date(refDate); finForward.setDate(refDate.getDate() + avant); finForward.setHours(23, 59, 59, 999);
    const debutForward = new Date(finForward); debutForward.setDate(finForward.getDate() - 6); debutForward.setHours(0, 0, 0, 0);
    if (createdAtDate.getTime() >= debutForward.getTime()) preferForward = true;
  }
  const fin = new Date(refDate);
  fin.setDate(refDate.getDate() + (preferForward ? avant : -arriere));
  fin.setHours(23, 59, 59, 999);
  const debut = new Date(fin); debut.setDate(fin.getDate() - 6); debut.setHours(0, 0, 0, 0);
  return { debut, fin };
}

function _bilanPeriodeLabel(b, jourBilanNom) {
  const fmt = d => d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
  if (b.date_validation) {
    // date_validation est un fait déjà connu (fin réelle, à un jour de retard/avance près) —
    // recherche la plus proche, pas uniquement en avant.
    const { debut, fin } = _bilanWeekBoundsNearest(jourBilanNom, new Date(b.date_validation + 'T12:00:00'), b.created_at ? new Date(b.created_at) : null);
    return `${fmt(debut)} → ${fmt(fin)}`;
  }
  if (b.created_at && !b.envoye_coach) {
    // Bilan encore en cours (pas envoyé, pas de date_validation) : on projette l'échéance à
    // venir depuis la création, toujours en avant (cohérent avec _supaGetOrCreateBilanCourant
    // côté client).
    const { debut, fin } = _bilanWeekBounds(jourBilanNom, new Date(b.created_at));
    return `${fmt(debut)} → ${fmt(fin)}`;
  }
  // Bilan envoyé sans date_validation = résidu de migration (import groupé, created_at = date
  // de migration et non la vraie semaine) — utiliser created_at donnerait la même semaine à
  // tous les bilans migrés le même jour (bug vécu : 14 bilans de Mathis Le Ray tous affichés
  // "27 Juil → 2 Août" en doublon). semaine_label brut, même imprécis, évite l'illusion de doublon.
  return b.semaine_label || '—';
}

// Variante liste de _bilanPeriodeLabel : désambiguïse les bilans migrés sans date_validation
// qui partagent le même semaine_label brut (souvent le texte générique "SEMAINE" recopié tel
// quel depuis les toutes premières lignes de la feuille GAS, avant que le suivi par date
// n'existe). Sans ça plusieurs bilans réels et distincts s'affichent avec un libellé identique
// et donnent l'illusion de doublons (vécu chez Mathis Le Ray, Manon Besnier, Nesher Carsin).
// Ordonnés par gas_ligne_titre (ordre chronologique réel dans la feuille d'origine) à défaut
// de date connue — pas de vrais doublons trouvés en base (vérifié : aucune paire (client,
// gas_ligne_titre) répétée), donc jamais d'archivage/suppression ici, seulement un libellé
// plus lisible.
function _bilanPeriodeLabelsList(bilansList, jourBilanNom) {
  const labels = bilansList.map(b => _bilanPeriodeLabel(b, jourBilanNom));
  const groups = new Map();
  bilansList.forEach((b, i) => {
    if (b.date_validation) return;
    const key = labels[i];
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });
  groups.forEach(idxs => {
    if (idxs.length < 2) return;
    const sorted = [...idxs].sort((a, b2) => (bilansList[a].gas_ligne_titre||0) - (bilansList[b2].gas_ligne_titre||0));
    sorted.forEach((idx, pos) => { labels[idx] = `${labels[idx]} (${pos+1}/${sorted.length}, sans date)`; });
  });
  return labels;
}

function _renderFicheBilansCorbeille(c){
  if (_ficheBilansCorbeille === null) {
    fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(c.id)}&archive=eq.true&order=envoye_coach.asc,date_validation.desc.nullslast,created_at.desc`, { headers: supaHeaders() })
      .then(r => r.ok ? r.json() : [])
      .then(rows => {
        _ficheBilansCorbeille = Array.isArray(rows) ? rows : [];
        const el = document.getElementById('ficheTabContent');
        if (el && ficheTab === 'bilans') el.innerHTML = renderFicheBilansTab(c);
      })
      .catch(() => { _ficheBilansCorbeille = []; });
    return `<div style="padding:30px;text-align:center;color:var(--text-faint);">Chargement…</div>`;
  }
  const backBtn = `<button class="btn" style="font-size:11px;padding:4px 10px;margin-bottom:10px;" onclick="_ficheBilansVoirCorbeille=false;setFicheTab('bilans')">← Retour aux bilans</button>`;
  if (!_ficheBilansCorbeille.length) {
    return `${backBtn}<div class="fiche-card"><p style="color:var(--text-faint);">Corbeille vide.</p></div>`;
  }
  const allSelected = _ficheBilansCorbeille.every(b => _ficheBilansCorbeilleSel.has(b.id));
  const selCount = _ficheBilansCorbeilleSel.size;
  const rows = _ficheBilansCorbeille.map(b => {
    const checked = _ficheBilansCorbeilleSel.has(b.id);
    return `<tr>
      <td style="width:32px;text-align:center;">
        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleFicheBilanCorbeilleSel(${b.id}, this.checked)">
      </td>
      <td>${_fmtDateHeureBilan(b)}</td>
    </tr>`;
  }).join('');
  return `${backBtn}<div class="fiche-card" style="overflow-x:auto;">
    <div class="table-toolbar" style="padding:10px 8px;">
      <label style="font-size:12px;color:var(--text-faint);cursor:pointer;display:flex;align-items:center;gap:5px;">
        <input type="checkbox" ${allSelected ? 'checked' : ''} onchange="toggleAllFicheBilanCorbeilleSel(this.checked)">
        Tout sélectionner
      </label>
      <button class="btn" style="font-size:12px;margin-left:auto;" ${selCount === 0 ? 'disabled' : ''}
        onclick="restaurerFicheBilansSel('${esc(c.id)}')">
        ↩ Restaurer (${selCount})
      </button>
      <button class="btn" style="font-size:12px;color:var(--critical);" ${selCount === 0 ? 'disabled' : ''}
        onclick="supprimerDefinitivementFicheBilansSel('${esc(c.id)}')">
        🗑 Supprimer définitivement (${selCount})
      </button>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="color:var(--text-faint);font-size:11px;text-transform:uppercase;">
        <th></th>
        <th style="text-align:left;padding:6px 8px;">Date</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function toggleFicheBilanCorbeilleSel(id, checked) {
  if (checked) _ficheBilansCorbeilleSel.add(id);
  else _ficheBilansCorbeilleSel.delete(id);
  const el = document.getElementById('ficheTabContent');
  const c = (data.clients||[]).find(cl => cl.id === _ficheBilansClientId);
  if (el && ficheTab === 'bilans') el.innerHTML = renderFicheBilansTab(c);
}

function toggleAllFicheBilanCorbeilleSel(checked) {
  _ficheBilansCorbeilleSel = checked ? new Set((_ficheBilansCorbeille||[]).map(b => b.id)) : new Set();
  const el = document.getElementById('ficheTabContent');
  const c = (data.clients||[]).find(cl => cl.id === _ficheBilansClientId);
  if (el && ficheTab === 'bilans') el.innerHTML = renderFicheBilansTab(c);
}

async function restaurerFicheBilansSel(clientId) {
  const ids = [..._ficheBilansCorbeilleSel];
  if (!ids.length) return;
  const el = document.getElementById('ficheTabContent');
  if (el) el.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-faint);">Restauration…</div>`;
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/bilans?id=in.(${ids.join(',')})`,
      { method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ archive: false }) }
    );
    if (!res.ok) { const t = await res.text(); alert(`Erreur : ${res.status} — ${t}`); }
  } catch(e) { alert(`Erreur : ${e.message}`); }
  _ficheBilansCorbeilleSel = new Set();
  _ficheBilansCorbeille = null;
  _ficheBilans = null;
  const c = (data.clients||[]).find(cl => cl.id === clientId);
  if (el) el.innerHTML = renderFicheBilansTab(c);
}

async function supprimerDefinitivementFicheBilansSel(clientId) {
  const ids = [..._ficheBilansCorbeilleSel];
  if (!ids.length) return;
  if (!confirm(`Supprimer définitivement ${ids.length} bilan(s) ? Cette action est IRRÉVERSIBLE.`)) return;
  const el = document.getElementById('ficheTabContent');
  if (el) el.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-faint);">Suppression…</div>`;
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/bilans?id=in.(${ids.join(',')})`,
      { method: 'DELETE', headers: supaHeaders({ Prefer: 'return=minimal' }) }
    );
    if (!res.ok) { const t = await res.text(); alert(`Erreur suppression : ${res.status} — ${t}`); }
  } catch(e) { alert(`Erreur suppression : ${e.message}`); }
  _ficheBilansCorbeilleSel = new Set();
  _ficheBilansCorbeille = null;
  const c = (data.clients||[]).find(cl => cl.id === clientId);
  if (el) el.innerHTML = renderFicheBilansTab(c);
}

// Galerie de toutes les photos du client, toutes bilans confondus — clique sur
// 2 photos pour les comparer côte à côte (utile pour comparer la progression
// physique entre deux dates, indépendamment du bilan qui a "reçu" chaque photo).
function _renderFicheBilanPhotosGallery(c){
  if (_ficheBilanPhotosGallery === null) return `<div class="fiche-card" style="margin-bottom:14px;"><div style="color:var(--text-faint);font-size:12px;">Chargement des photos…</div></div>`;
  if (!_ficheBilanPhotosGallery.length) return '';
  const sel = _ficheBilanPhotosSel;
  const findPhoto = key => _ficheBilanPhotosGallery.find(p => p._key === key);
  const dateOf = p => p._date ? p._date.split('-').reverse().join('/') : '—';
  const compareHtml = sel.length === 2 ? `
    <div class="fiche-card" style="margin-bottom:14px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        Comparaison
        <button class="btn" style="font-size:11px;padding:4px 9px;" onclick="_ficheBilanPhotosSel=[];setFicheTab('bilans')">✕ Réinitialiser</button>
      </div>
      <div style="display:flex;gap:12px;">
        ${sel.map(key => { const p = findPhoto(key); if (!p) return ''; return `
          <div style="flex:1;text-align:center;min-width:0;max-width:280px;">
            <img src="${esc(p.url)}" style="width:100%;aspect-ratio:9/16;object-fit:contain;border-radius:var(--radius-sm);background:var(--surface-2);cursor:pointer;" onclick="ouvrirPhotoLightbox(_ficheBilanPhotosGallery,_ficheBilanPhotosGallery.findIndex(x=>x._key==='${p._key}'))">
            <div style="font-size:12px;color:var(--text-faint);margin-top:6px;">${dateOf(p)}</div>
          </div>`; }).join('')}
      </div>
    </div>` : '';
  return `${compareHtml}<div class="fiche-card" style="margin-bottom:14px;">
    <div style="font-weight:700;font-size:13px;margin-bottom:8px;">Photos <span style="font-weight:400;color:var(--text-faint);font-size:11px;">— clique sur 2 photos pour les comparer côte à côte</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;">
      ${_ficheBilanPhotosGallery.map(p => {
        const isSel = sel.includes(p._key);
        return `<div style="width:84px;cursor:pointer;" onclick="toggleFicheBilanPhotoSel('${p._key}')">
          <div style="position:relative;width:84px;aspect-ratio:9/16;border-radius:var(--radius-sm);overflow:hidden;${isSel?'box-shadow:0 0 0 3px var(--accent);':''}">
            <img src="${esc(p.url)}" style="width:100%;height:100%;object-fit:cover;">
            ${p._source === 'mensuration' ? `<div style="position:absolute;top:3px;left:3px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;padding:1px 4px;border-radius:4px;">📏</div>` : ''}
            ${isSel?`<div style="position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;">✓</div>`:''}
          </div>
          <div style="font-size:10px;color:var(--text-faint);text-align:center;margin-top:3px;">${dateOf(p)}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
