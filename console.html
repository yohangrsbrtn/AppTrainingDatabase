// ── Mensuration charts — helpers partagés ────────────────────────────────────
window._mensCharts = {};
// Les phases de mensurations s'appuient sur les types de phase de la Roadmap
// (ROADMAP_TYPES, définis plus bas dans ce fichier — référencé uniquement à l'intérieur de
// fonctions, jamais au chargement du script, donc l'ordre de déclaration n'a pas d'importance)
// : mêmes libellés, mêmes couleurs. De nombreuses mensurations portent une valeur de phase
// libre héritée de la migration (CUT, PDM, REFEED, REVERSE...) — MENS_PHASE_ALIASES les fait
// correspondre au bon type Roadmap (ex: "CUT" → type 'cut' → libellé "Cut", couleur rouge)
// au lieu de rester une valeur orpheline sans couleur ni correspondance dans le sélecteur.
const MENS_PHASE_ALIASES = { PDM:'prise_masse', MAINTIEN:'maintenance', STABILISATION:'maintenance' };
function _mensPhaseRoadmapType(phase) {
  if (!phase) return null;
  const upper = phase.trim().toUpperCase();
  const aliasKey = MENS_PHASE_ALIASES[upper];
  if (aliasKey) return _roadmapType(aliasKey);
  return ROADMAP_TYPES.find(t => t.label.toUpperCase() === upper || t.key.toUpperCase() === upper) || null;
}
function _mensPhaseColor(p) { const t = _mensPhaseRoadmapType(p); return t ? t.color : '#8892a4'; }
const MENS_COLS   = ['fessiers','cuisses','mollets','poitrine','epaules','bras'];
const MENS_COLORS = ['#f59e0b','#a78bfa','#3ecf8e','#f97316','#4f8ef7','#e05c5c'];
const MENS_LABELS = ['Fessiers','Cuisses','Mollets','Poitrine','Épaules','Bras'];

function _buildMensChart(id, rows, keys, colors, labels, unit) {
  const W=560,H=180,PL=44,PR=14,PT=16,PB=34,cw=W-PL-PR,ch=H-PT-PB;
  const allVals=keys.flatMap(k=>rows.map(r=>parseFloat(r[k])).filter(v=>!isNaN(v)&&v>0));
  if(allVals.length<2) return '';
  const rng=Math.max(...allVals)-Math.min(...allVals), pad=rng<2?1:Math.ceil(rng*0.1);
  const yMin=Math.floor(Math.min(...allVals)-pad), yMax=Math.ceil(Math.max(...allVals)+pad);
  const n=rows.length;
  const xS=i=>+(PL+(i/(n-1||1))*cw).toFixed(2);
  const yS=v=>+(PT+ch-((v-yMin)/((yMax-yMin)||1))*ch).toFixed(2);
  const xs=rows.map((_,i)=>xS(i));
  window._mensCharts[id]={rows,keys,colors,labels,xs,W,H,PL,PT,ch,unit:unit||''};
  const defs=keys.map((k,ki)=>`<linearGradient id="${id}_g${ki}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${colors[ki]}" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="${colors[ki]}" stop-opacity="0"/>
  </linearGradient>`).join('');
  const yGrid=[0.25,0.5,0.75].map(f=>{const v=yMin+f*(yMax-yMin);
    return `<line x1="${PL}" y1="${yS(v)}" x2="${PL+cw}" y2="${yS(v)}" stroke="var(--hairline)" stroke-width="0.5" stroke-dasharray="3 3"/>
      <text x="${PL-5}" y="${+(yS(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-faint)">${Math.round(v)}</text>`;
  }).join('');
  const maxL=Math.min(6,n), stepL=Math.floor((n-1)/(maxL-1||1));
  const xLabels=Array.from({length:maxL},(_,i)=>{
    const idx=i===maxL-1?n-1:i*stepL, d=(rows[idx].date||'').split('-');
    return `<text x="${xs[idx]}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--text-faint)">${d.length===3?d[2]+'/'+d[1]:''}</text>`;
  }).join('');
  const areas=keys.map((k,ki)=>{
    const pts=rows.map((r,i)=>{const v=parseFloat(r[k]);return isNaN(v)||v<=0?null:[xs[i],yS(v)];}).filter(Boolean);
    if(pts.length<2) return '';
    return `<path d="${pts.map((p,i)=>(i===0?'M':'L')+p[0]+','+p[1]).join(' ')} L${pts[pts.length-1][0]},${PT+ch} L${pts[0][0]},${PT+ch} Z" fill="url(#${id}_g${ki})"/>`;
  }).join('');
  const lines=keys.map((k,ki)=>{
    const pts=rows.map((r,i)=>{const v=parseFloat(r[k]);return isNaN(v)||v<=0?null:xs[i]+','+yS(v);}).filter(Boolean);
    return pts.length>=2?`<polyline points="${pts.join(' ')}" fill="none" stroke="${colors[ki]}" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  }).join('');
  const dots=keys.map((k,ki)=>rows.map((r,i)=>{const v=parseFloat(r[k]);
    return isNaN(v)||v<=0?'':`<circle id="${id}_d${ki}_${i}" cx="${xs[i]}" cy="${yS(v)}" r="1.8" fill="${colors[ki]}" stroke="var(--surface-1)" stroke-width="1.2"/>`;
  }).join('')).join('');
  const axes=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+ch}" stroke="var(--hairline)" stroke-width="1"/>
    <line x1="${PL}" y1="${PT+ch}" x2="${PL+cw}" y2="${PT+ch}" stroke="var(--hairline)" stroke-width="1"/>`;
  // Phases : un trait fin vertical à chaque changement de phase entre deux relevés
  // consécutifs, + une fine bande colorée collée à l'axe des dates indiquant la phase
  // couvrant chaque segment (regroupe les relevés consécutifs de même phase).
  // La phase inscrite sur un relevé décrit l'état du client DEPUIS le relevé précédent
  // (pas à partir de sa propre date) — demande coach 2026-08-04 : quand une nouvelle
  // phase apparaît sur une ligne, elle a en réalité commencé au moment du relevé
  // d'avant. La bande d'un segment démarre donc à la date du relevé PRÉCÉDENT le
  // premier relevé du segment (sauf tout premier segment, sans relevé antérieur connu).
  let phaseBand = '', phaseTransitions = '';
  const phasesPresentes = new Set();
  if (rows.some(r => r.phase)) {
    const bandY = PT + ch - 4, bandH = 4;
    let start = 0;
    for (let i = 1; i <= n; i++) {
      if (i === n || (rows[i].phase || '') !== (rows[start].phase || '')) {
        const p = rows[start].phase;
        if (p) {
          phasesPresentes.add(p);
          const x1 = xs[start > 0 ? start - 1 : start], x2 = xs[i - 1];
          phaseBand += `<rect x="${x1}" y="${bandY}" width="${Math.max(x2 - x1, 3)}" height="${bandH}" rx="1" fill="${_mensPhaseColor(p)}" opacity="0.85"/>`;
        }
        if (i < n) {
          const xt = xs[i - 1];
          phaseTransitions += `<line x1="${xt}" y1="${PT}" x2="${xt}" y2="${PT+ch}" stroke="var(--text-faint)" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.45"/>`;
        }
        start = i;
      }
    }
  }
  const vline=`<line id="${id}_vl" x1="${xs[0]}" y1="${PT}" x2="${xs[0]}" y2="${PT+ch}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 2" opacity="0.5" display="none"/>`;
  const ov=`<rect x="${PL}" y="${PT}" width="${cw}" height="${ch}" fill="transparent" onmousemove="_mensHover(event,'${id}')" onmouseleave="_mensHoverOut('${id}')"/>`;
  const tip=`<div id="${id}_tip" style="display:none;position:absolute;top:10px;left:10px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text);pointer-events:none;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.2);white-space:nowrap;"></div>`;
  const legend=`<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);margin-top:8px;margin-bottom:4px;">
    ${keys.map((k,i)=>`<span><span style="color:${colors[i]};margin-right:3px;">●</span>${labels[i]}</span>`).join('')}
  </div>`;
  const phaseLegend = phasesPresentes.size ? `<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--text-faint);margin-bottom:4px;">
    ${[...phasesPresentes].map(p=>`<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${_mensPhaseColor(p)};margin-right:4px;vertical-align:middle;"></span>${esc(p)}</span>`).join('')}
  </div>` : '';
  return `<div style="position:relative;">${tip}<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${axes}${yGrid}${xLabels}${phaseTransitions}${phaseBand}${areas}${lines}${dots}${vline}${ov}</svg></div>${phaseLegend}${legend}`;
}

function _mensHover(evt, cid) {
  const d=window._mensCharts[cid]; if(!d) return;
  const svg=evt.currentTarget.closest('svg');
  const rect=svg.getBoundingClientRect();
  const mx=(evt.clientX-rect.left)*(d.W/rect.width);
  let ni=0, minDist=Infinity;
  d.xs.forEach((x,i)=>{const dist=Math.abs(x-mx);if(dist<minDist){minDist=dist;ni=i;}});
  const vl=document.getElementById(cid+'_vl');
  if(vl){vl.setAttribute('x1',d.xs[ni]);vl.setAttribute('x2',d.xs[ni]);vl.removeAttribute('display');}
  const row=d.rows[ni];
  const dateStr=(row.date||'').split('-').reverse().join('/');
  const vals=d.keys.map((k,ki)=>{
    const v=parseFloat(row[k]); if(isNaN(v)||v<=0) return '';
    return `<div style="margin-top:3px;"><span style="color:${d.colors[ki]};margin-right:4px;">●</span>${d.labels[ki]} : <strong>${v}</strong>${d.unit}</div>`;
  }).filter(Boolean).join('');
  const tip=document.getElementById(cid+'_tip');
  if(tip){
    tip.innerHTML=`<div style="font-size:10px;font-weight:700;color:var(--text-faint);margin-bottom:3px;">${dateStr}</div>${vals}`;
    const xRatio=rect.width/d.W;
    let lx=d.xs[ni]*xRatio+14;
    if(lx+160>rect.width) lx=d.xs[ni]*xRatio-170;
    tip.style.left=lx+'px'; tip.style.display='block';
  }
}

function _mensHoverOut(cid) {
  const vl=document.getElementById(cid+'_vl'); if(vl) vl.setAttribute('display','none');
  const tip=document.getElementById(cid+'_tip'); if(tip) tip.style.display='none';
}

// ── Filtre période (phase ou plage de dates libre) — fiche client Mensurations ──────────
// rows doit être trié par date croissante. Ne filtre QUE ce qui alimente graphes/écart —
// le tableau d'historique en dessous reste complet (édition toujours possible sur tout
// l'historique, indépendamment du filtre d'affichage).
function _mensFiltrerParPeriode(rows, filtre) {
  if (!filtre || filtre.mode === 'tout') return rows;
  if (filtre.mode === 'phase') return rows.filter(r => (r.phase || null) === filtre.phase);
  if (filtre.mode === 'custom') {
    return rows.filter(r => r.date && (!filtre.debut || r.date >= filtre.debut) && (!filtre.fin || r.date <= filtre.fin));
  }
  return rows;
}

// Liste des phases distinctes présentes dans l'historique complet (pas le filtré), les plus
// récentes d'abord — sert à peupler le sélecteur de période.
function _mensPhasesDisponibles(rowsAsc) {
  const seen = new Set(); const out = [];
  for (let i = rowsAsc.length - 1; i >= 0; i--) {
    const p = rowsAsc[i].phase;
    if (p && !seen.has(p)) { seen.add(p); out.push(p); }
  }
  return out;
}

// Premier/dernier point non-null (chronologique) pour chaque métrique disponible dans la
// sélection — "écart de poids et des autres mensurations" sur la période choisie.
function _mensEcartHtml(rowsFiltres) {
  if (!rowsFiltres || rowsFiltres.length < 2) return '';
  const metriques = [{ k:'poids', label:'Poids', unit:' kg' }, { k:'mesure', label:'Tour de taille', unit:' cm' }]
    .concat(MENS_COLS.map((k,i) => ({ k, label: MENS_LABELS[i], unit:' cm' })));
  const cards = metriques.map(m => {
    const pts = rowsFiltres.map(r => parseFloat(r[m.k])).map((v,i) => ({ v, date: rowsFiltres[i].date })).filter(p => !isNaN(p.v) && p.v > 0);
    if (pts.length < 2) return '';
    const debut = pts[0].v, fin = pts[pts.length-1].v;
    const delta = Math.round((fin - debut) * 10) / 10;
    const signe = delta > 0 ? '+' : '';
    const col = delta === 0 ? 'var(--text-faint)' : (delta < 0 ? 'var(--success)' : 'var(--critical)');
    return `<div class="table-card" style="flex:1;min-width:130px;padding:10px 14px;">
      <div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;">${esc(m.label)}</div>
      <div style="font-size:13px;color:var(--text-muted);">${debut}${m.unit} → ${fin}${m.unit}</div>
      <div style="font-size:16px;font-weight:700;color:${col};">${signe}${delta}${m.unit}</div>
    </div>`;
  }).filter(Boolean).join('');
  if (!cards) return '';
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">${cards}</div>`;
}

// Select inline dans la ligne du tableau — édite la phase sans ouvrir la modale complète.
// Les options viennent des types de phase de la Roadmap (ROADMAP_TYPES) — une valeur libre
// existante (migrée) comme "CUT" est reconnue via _mensPhaseRoadmapType (alias/casse) et
// sélectionne directement "Cut" ; seule une valeur vraiment inconnue (ex: "TEST DIGESTION",
// sans équivalent Roadmap) est ajoutée comme option à part pour ne jamais perdre l'affichage
// d'une valeur existante en base.
function _mensPhaseSelectHtml(rowId, clientId, currentPhase) {
  const matched = _mensPhaseRoadmapType(currentPhase);
  const opts = `<option value="" ${!currentPhase?'selected':''}>—</option>`
    + (currentPhase && !matched ? `<option value="${esc(currentPhase)}" selected>${esc(currentPhase)}</option>` : '')
    + ROADMAP_TYPES.map(t => `<option value="${esc(t.label)}" ${matched && matched.key===t.key?'selected':''}>${esc(t.label)}</option>`).join('');
  return `<select onclick="event.stopPropagation();" onchange="event.stopPropagation();changerPhaseMensurationInline(${rowId},'${esc(clientId)}',this.value)"
    style="font-size:12px;background:var(--surface-2);color:var(--text);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:3px 6px;">${opts}</select>`;
}

// Sélecteur de période (dropdown phase/plage + inputs date si 'custom') — mode et setter
// paramétrés pour être réutilisable sur la fiche client comme sur la page Mensurations autonome.
function _renderMensPeriodeFiltre(rowsAsc, filtre, onChangeFnName) {
  const phases = _mensPhasesDisponibles(rowsAsc);
  const opts = `<option value="tout" ${filtre.mode==='tout'?'selected':''}>Tout l'historique</option>`
    + phases.map(p => `<option value="phase:${esc(p)}" ${filtre.mode==='phase'&&filtre.phase===p?'selected':''}>Phase : ${esc(p)}</option>`).join('')
    + `<option value="custom" ${filtre.mode==='custom'?'selected':''}>Plage de dates…</option>`;
  const dateInputs = filtre.mode === 'custom' ? `
    <input type="date" value="${esc(filtre.debut||'')}" onchange="${onChangeFnName}('custom:debut:'+this.value)" style="font-size:13px;background:var(--surface-2);color:var(--text);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:5px 8px;">
    <span style="color:var(--text-faint);font-size:12px;">→</span>
    <input type="date" value="${esc(filtre.fin||'')}" onchange="${onChangeFnName}('custom:fin:'+this.value)" style="font-size:13px;background:var(--surface-2);color:var(--text);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:5px 8px;">` : '';
  return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
    <label style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;">Période</label>
    <select onchange="${onChangeFnName}(this.value)" style="font-size:13px;background:var(--surface-2);color:var(--text);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:5px 8px;">${opts}</select>
    ${dateInputs}
  </div>`;
}

function _setFicheMensPeriode(val) {
  if (val.startsWith('custom:debut:')) _ficheMensPeriode = { ..._ficheMensPeriode, mode:'custom', debut: val.slice(13) || null };
  else if (val.startsWith('custom:fin:')) _ficheMensPeriode = { ..._ficheMensPeriode, mode:'custom', fin: val.slice(11) || null };
  else if (val === 'custom') _ficheMensPeriode = { mode:'custom', phase:null, debut:_ficheMensPeriode.debut||null, fin:_ficheMensPeriode.fin||null };
  else if (val.startsWith('phase:')) _ficheMensPeriode = { mode:'phase', phase: val.slice(6), debut:null, fin:null };
  else _ficheMensPeriode = { mode:'tout', phase:null, debut:null, fin:null };
  const c = data.clients.find(x => x.id === _ficheMensurationsClientId);
  const el = document.getElementById('ficheTabContent');
  if (el && ficheTab === 'mensurations') el.innerHTML = renderFicheMensurationsTab(c);
}

// selKeys : Set des mensurations actives — multi-sélection, chaque pill toggle son
// appartenance au Set (au moins une reste sélectionnée) pour superposer plusieurs
// courbes sur le même graphique (_buildMensChart accepte déjà keys/colors/labels en tableau).
function _renderMens2Section(rows, idBase, selKeys, setterFn) {
  if(!rows||rows.length<2) return '';
  const actives=MENS_COLS.filter(k=>selKeys.has(k));
  if(!actives.length) return '';
  const pills=MENS_COLS.map((k,i)=>`<button onclick="${setterFn}('${k}')"
    style="padding:3px 11px;border-radius:99px;border:1px solid ${selKeys.has(k)?MENS_COLORS[i]:'var(--hairline)'};background:${selKeys.has(k)?MENS_COLORS[i]+'22':'transparent'};color:${selKeys.has(k)?MENS_COLORS[i]:'var(--text-faint)'};font-size:11px;font-weight:${selKeys.has(k)?'700':'400'};cursor:pointer;transition:all .15s;">${MENS_LABELS[i]}</button>`).join('');
  const colors=actives.map(k=>MENS_COLORS[MENS_COLS.indexOf(k)]);
  const labels=actives.map(k=>MENS_LABELS[MENS_COLS.indexOf(k)]);
  // _buildMensChart renvoie '' silencieusement si la sélection active n'a pas assez de
  // valeurs numériques (même si d'autres colonnes en ont) — sans ce filet la carte reste vide.
  const chart=_buildMensChart(idBase+'_'+actives.join('_'), rows, actives, colors, labels, ' cm')
    || `<div style="font-size:13px;color:var(--text-faint);text-align:center;padding:20px;">Pas assez de données pour ${actives.map(k=>MENS_LABELS[MENS_COLS.indexOf(k)]).join('/')}.</div>`;
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${pills}</div>${chart}`;
}

// Sélection unique (pas de superposition de courbes) — même comportement que l'app mobile
// (_toggleMChart2 dans mensurations.js) : la multi-sélection était peu pratique (courbes qui
// se chevauchent, légende encombrée).
function _setFicheMensChart2(key) {
  _ficheMensChart2Keys = new Set([key]);
  const el=document.getElementById('ficheMensChart2');
  if(el&&_ficheMensurations) el.innerHTML=_renderMens2Section(_ficheMensurations,'fiche_c2',_ficheMensChart2Keys,'_setFicheMensChart2');

function _setPageMensChart2(key) {
  _pageMensChart2Keys = new Set([key]);
  const el=document.getElementById('pageMensChart2');
  if(el&&_pageMensurationsRows.length) el.innerHTML=_renderMens2Section(_pageMensurationsRows,'page_c2',_pageMensChart2Keys,'_setPageMensChart2');
}

function renderFicheMensurationsTab(c){
  if (!c) return '';
  if (_ficheMensurationsClientId !== c.id) {
    _ficheMensurationsClientId = c.id;
    _ficheMensurations = null;
    _ficheMensurationsLoading = false;
    _ficheMensPeriode = { mode: 'tout', phase: null, debut: null, fin: null };
    _ficheMensPhotosIds = null;
    _ficheMensPhotosIdsLoading = false;
  }
  if (_ficheMensPhotosIds === null && !_ficheMensPhotosIdsLoading) {
    _ficheMensPhotosIdsLoading = true;
    fetch(`${SUPABASE_URL}/rest/v1/mensuration_photos?client_id=eq.${encodeURIComponent(c.id)}&select=mensuration_id`, { headers: supaHeaders() })
      .then(r => r.ok ? r.json() : [])
      .then(rows => {
        _ficheMensPhotosIds = new Set((rows||[]).map(r => r.mensuration_id));
        _ficheMensPhotosIdsLoading = false;
        const el = document.getElementById('ficheTabContent');
        if (el && ficheTab === 'mensurations') el.innerHTML = renderFicheMensurationsTab(c);
      })
      .catch(() => { _ficheMensPhotosIds = new Set(); _ficheMensPhotosIdsLoading = false; });
  }
  if (_ficheMensurations === null) {
    if (!_ficheMensurationsLoading) {
      _ficheMensurationsLoading = true;
      fetch(`${SUPABASE_URL}/rest/v1/mensurations?client_id=eq.${encodeURIComponent(c.id)}&order=date.asc`, { headers: supaHeaders() })
        .then(r => r.json())
        .then(rows => {
          _ficheMensurations = Array.isArray(rows) ? rows : [];
          _ficheMensurationsLoading = false;
          const el = document.getElementById('ficheTabContent');
          if (el && ficheTab === 'mensurations') el.innerHTML = renderFicheMensurationsTab(c);
        })
        .catch(() => { _ficheMensurations = []; _ficheMensurationsLoading = false; });
    }
    return `<div style="padding:30px;text-align:center;color:var(--text-faint);">Chargement…</div>`;
  }
  const cm = (v) => v!=null ? v+' cm' : '—';
  const kg = (v) => v!=null ? v+' kg' : '—';

  if (!_ficheMensurations.length) {
    return `<div class="fiche-card">
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;">
        <button class="btn" onclick="_ouvrirDernierBilanEnvoye('${c.id}')">📋 Dernier bilan envoyé</button>
        <button class="btn primary" onclick="ouvrirModalMensuration('${c.id}',null)">+ Ajouter</button>
      </div>
      <p style="color:var(--text-faint);">Aucune mensuration enregistrée dans Supabase.</p>
    </div>`;
  }

  const rows = _ficheMensurations;
  const rowsFiltres = _mensFiltrerParPeriode(rows, _ficheMensPeriode);
  const periodeFiltreHtml = _renderMensPeriodeFiltre(rows, _ficheMensPeriode, '_setFicheMensPeriode');
  const ecartHtml = _mensEcartHtml(rowsFiltres);
  const chart1 = rowsFiltres.length>=2 ? _buildMensChart('fiche_c1', rowsFiltres, ['poids','mesure'], ['var(--accent)','#4caf50'], ['Poids (kg)','Tour de taille (cm)'], '') : '';
  const hasAutres = rowsFiltres.some(r=>MENS_COLS.some(k=>parseFloat(r[k])>0));
  const chart2Section = hasAutres ? _renderMens2Section(rowsFiltres,'fiche_c2',_ficheMensChart2Keys,'_setFicheMensChart2') : '';
  const chartsVides = !chart1 && !chart2Section
    ? `<div style="font-size:13px;color:var(--text-faint);text-align:center;padding:20px;">Pas assez de données sur cette période.</div>` : '';

  const tableRows = [...rows].reverse().map(r => {
    const dateFr = (r.date||'').split('-').reverse().join('/');
    const aPhoto = _ficheMensPhotosIds && _ficheMensPhotosIds.has(r.id);
    return `<tr>
      <td class="mono">${esc(dateFr)}${aPhoto ? ' <span title="Photo liée">📷</span>' : ''}${r.note ? `<div style="font-size:10px;font-weight:600;color:var(--accent);white-space:normal;margin-top:2px;">📝 ${esc(r.note)}</div>` : ''}${r.commentaire ? `<div style="font-size:10px;color:var(--text-muted);white-space:normal;margin-top:2px;font-style:italic;">💬 ${esc(r.commentaire)}</div>` : ''}</td>
      <td onclick="event.stopPropagation();">${_mensPhaseSelectHtml(r.id, c.id, r.phase)}</td>
      <td>${kg(r.poids)}</td>
      <td>${cm(r.mesure)}</td>
      <td>${cm(r.fessiers)}</td>
      <td>${cm(r.cuisses)}</td>
      <td>${cm(r.mollets)}</td>
      <td>${cm(r.poitrine)}</td>
      <td>${cm(r.epaules)}</td>
      <td>${cm(r.bras)}</td>
      <td style="white-space:nowrap;">
        <button class="btn" style="font-size:11px;padding:3px 8px;" onclick="ouvrirModalMensuration('${c.id}',${r.id})">Éditer</button>
        <button class="btn" style="font-size:11px;padding:3px 8px;color:var(--critical);margin-left:4px;" onclick="supprimerMensuration(${r.id},'${c.id}')">×</button>
      </td>
    </tr>`;
  }).join('');

  return `<div class="fiche-card">
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;">
      <button class="btn" onclick="_ouvrirDernierBilanEnvoye('${c.id}')">📋 Dernier bilan envoyé</button>
      <button class="btn primary" onclick="ouvrirModalMensuration('${c.id}',null)">+ Ajouter</button>
    </div>
    ${periodeFiltreHtml}
    ${ecartHtml}
    ${chart1 ? `<h4 style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin:0 0 10px;">Poids &amp; Tour de taille</h4>${chart1}` : ''}
    ${chart2Section ? `<h4 style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin:20px 0 10px;">Autres mensurations</h4><div id="ficheMensChart2">${chart2Section}</div>` : ''}
    ${chartsVides}
    <div class="table-scroll" style="margin-top:20px;"><table class="alim-table">
      <thead><tr><th>Date</th><th>Phase</th><th>Poids</th><th>Tour taille</th><th>Fessiers</th><th>Cuisses</th><th>Mollets</th><th>Poitrine</th><th>Épaules</th><th>Bras</th><th></th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table></div>
  </div>`;
}

// PATCH steps_cible seul depuis l'input inline de l'onglet Programme — évite de passer
// par sauvegarderFicheSandbox (formulaire complet, onglet Profil) pour ce seul champ,
// demandé éditable directement là où il est affiché (voir aussi le bouton Notifier juste
// à côté, pour prévenir le client du changement).
async function _ficheChangerStepsCible(clientId, value){
  const steps = parseInt(value) || null;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}`, {
      method:'PATCH', headers:supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify({ steps_cible: steps })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (ficheData.profil) ficheData.profil.steps_cible = steps;
  } catch(e) { alert('Erreur : ' + e.message); }
}

    </div>
    ${actives.length ? actives.map(d=>`
      <div class="prog-row" style="cursor:default;margin-bottom:8px;">
        <div style="flex:1;min-width:0;">
          <div class="p-nom">${esc(d.nom||'Diète sans nom')} ${d.brouillon ? '<span class="chip" style="font-size:9.5px;padding:1px 6px;background:#f5a62318;color:#f5a623;border:1px solid #f5a62340;">🟡 Brouillon</span>' : ''}</div>
          <div class="p-meta">Assignée le ${d.created_at ? new Date(d.created_at).toLocaleDateString('fr-FR') : '—'}${_dieteMacrosBadge(d)}</div>
        </div>
        ${d.brouillon ? `<button class="btn primary" style="font-size:11px;padding:5px 9px;flex-shrink:0;" onclick="publierDieteClient(${d.id},'${c.id}')" title="Rend cette diète visible pour le client">✅ Publier</button>` : ''}
        <button class="btn" style="font-size:11px;padding:5px 9px;flex-shrink:0;" onclick="editerDieteClient('${esc(d.nom)}','${c.id}',${d.id})">Éditer</button>
        <button class="btn" style="font-size:11px;padding:5px 9px;flex-shrink:0;" onclick="dupliquerDieteClient(${d.id},'${c.id}')" title="Créer une copie indépendante de cette diète pour ce client">Dupliquer</button>
        <button class="btn" style="font-size:11px;padding:5px 9px;flex-shrink:0;" onclick="ouvrirModalNotifier('${c.id}','${esc(c.nom).replace(/'/g, "\\'")}','Ta diète a été mise à jour !','Va jeter un œil à ta diète « ${esc(d.nom).replace(/'/g, "\\'")} », elle vient d\\'être mise à jour.')" title="Notifier">🔔</button>
        <button class="btn" style="font-size:11px;padding:5px 9px;flex-shrink:0;" onclick="retirerDieteClient(${d.id},'${c.id}')">Retirer</button>
      </div>`).join('') : `
      <div class="fiche-prog-empty" style="text-align:center;padding:24px;margin-bottom:16px;">
        <div style="font-size:14px;color:var(--text-muted);margin-bottom:12px;">Aucune diète assignée</div>
        <button class="btn primary" onclick="ouvrirAssignerDiete('${c.id}')">→ Assigner une diète</button>
      </div>`}
    ${archives.length ? `
      <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin-bottom:8px;margin-top:8px;">Archives</div>
      ${archives.map(d=>`
        <div class="prog-row inactif" style="cursor:default;">
          <div style="flex:1;min-width:0;">
            <div class="p-nom">${esc(d.nom||'Diète sans nom')}</div>
            <div class="p-meta">${d.created_at ? new Date(d.created_at).toLocaleDateString('fr-FR') : '—'}${_dieteMacrosBadge(d)}</div>
          </div>
          <button class="btn" style="font-size:11px;padding:5px 9px;flex-shrink:0;" onclick="retirerDieteClient(${d.id},'${c.id}')">Supprimer</button>
        </div>`).join('')}` : ''}
    ${_renderFicheMenusEtJournal(c)}`;

// Menus perso + journal alimentaire du client (lecture seule côté coach) — lazy-load, même
// pattern que l'historique XP (state réinitialisé quand le client change, chargé une seule fois
// par ouverture d'onglet). "Mes menus"/"Mon journal" sont des fonctionnalités 100% côté client
// (diete.js) sans aucune vue coach avant ça.
function _renderFicheMenusEtJournal(c){
  const clientId = c.id;
  if (_ficheMenusJournalClientId !== clientId) {
    _ficheMenusJournalClientId = clientId;
    _ficheMenus = null; _ficheMenusLoading = false;
    _ficheJournal = null; _ficheJournalLoading = false;
    _ficheMenusOuverts = new Set(); _ficheJournalOuverts = new Set();
  }
  const refresh = () => { const el = document.getElementById('ficheTabContent'); if (el && ficheTab === 'diete') el.innerHTML = renderFicheDieteTab(c); };
  if (_ficheMenus === null && !_ficheMenusLoading) {
    _ficheMenusLoading = true;
    fetch(`${SUPABASE_URL}/rest/v1/client_menus?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc&select=id,nom,client_menu_aliments(nom,quantite_g,kcal,prot,glu,lip,ordre)`, { headers: supaHeaders() })
      .then(r => r.ok ? r.json() : [])
      .then(rows => { _ficheMenus = rows; _ficheMenusLoading = false; refresh(); })
      .catch(() => { _ficheMenus = []; _ficheMenusLoading = false; });
  }
  if (_ficheJournal === null && !_ficheJournalLoading) {
    _ficheJournalLoading = true;
    fetch(`${SUPABASE_URL}/rest/v1/client_journal?client_id=eq.${encodeURIComponent(clientId)}&order=date.desc&select=id,date,slot,type,label`, { headers: supaHeaders() })
      .then(r => r.ok ? r.json() : [])
      .then(rows => { _ficheJournal = rows; _ficheJournalLoading = false; refresh(); })
      .catch(() => { _ficheJournal = []; _ficheJournalLoading = false; });
  }

  const chevron = ouvert => `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;transition:transform .15s;transform:rotate(${ouvert?'0':'-90'}deg)"><polyline points="6 9 12 15 18 9"/></svg>`;

  const menusHtml = _ficheMenus === null
    ? `<div class="fiche-prog-empty">Chargement…</div>`
    : !_ficheMenus.length ? `<div class="fiche-prog-empty">Aucun menu créé.</div>`
    : _ficheMenus.map(m => {
        const aliments = (m.client_menu_aliments||[]).slice().sort((a,b)=>(a.ordre||0)-(b.ordre||0));
        const kcal = aliments.reduce((s,a)=>s+(a.kcal||0),0), prot = aliments.reduce((s,a)=>s+(a.prot||0),0), glu = aliments.reduce((s,a)=>s+(a.glu||0),0), lip = aliments.reduce((s,a)=>s+(a.lip||0),0);
        const ouvert = _ficheMenusOuverts.has(m.id);
        const detail = aliments.length ? aliments.map(a=>`
          <div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;">
            <span>${esc(a.nom)}</span>
            <span style="color:var(--text-faint);flex-shrink:0;">${a.quantite_g||'?'}g · ${Math.round(a.kcal||0)} kcal</span>
          </div>`).join('') : `<div style="font-size:12px;color:var(--text-faint);padding:3px 0;">Aucun aliment.</div>`;
        return `<div class="prog-row" style="cursor:pointer;flex-direction:column;align-items:stretch;margin-bottom:8px;" onclick="_toggleFicheMenu(${m.id},'${c.id}')">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div style="display:flex;align-items:center;gap:6px;min-width:0;">${chevron(ouvert)}<div class="p-nom">${esc(m.nom||'Menu sans nom')}</div></div>
            <div class="p-meta" style="flex-shrink:0;">${Math.round(kcal)} kcal · P${Math.round(prot)} G${Math.round(glu)} L${Math.round(lip)}</div>
          </div>
          ${ouvert ? `<div style="margin-top:6px;padding-left:18px;border-top:1px solid var(--hairline);padding-top:6px;">${detail}</div>` : ''}
        </div>`;
      }).join('');

  const JOURNAL_TYPE_LABEL = { cible: 'Diète cible du jour', menu: 'Menu perso' };
  const journalHtml = _ficheJournal === null
    ? `<div class="fiche-prog-empty">Chargement…</div>`
    : !_ficheJournal.length ? `<div class="fiche-prog-empty">Aucune entrée de journal.</div>`
    : (() => {
        const parDate = {};
        _ficheJournal.forEach(r => { (parDate[r.date] = parDate[r.date] || []).push(r); });
        return Object.keys(parDate).sort().reverse().slice(0, 30).map(date => {
          const entries = parDate[date].slice().sort((a,b)=>(a.slot||0)-(b.slot||0));
          const ouvert = _ficheJournalOuverts.has(date);
          const dateLabel = new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
          const detail = entries.map(r => {
            const label = r.type === 'cible' || r.type === 'menu' ? JOURNAL_TYPE_LABEL[r.type] : `Repas ${r.slot!=null?r.slot+1:'?'}`;
            return `<div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;">
              <span style="color:var(--text-faint);flex-shrink:0;">${label}</span>
              <span style="text-align:right;">${esc(r.label||'—')}</span>
            </div>`;
          }).join('');
          return `<div class="prog-row" style="cursor:pointer;flex-direction:column;align-items:stretch;margin-bottom:6px;" onclick="_toggleFicheJournalDate('${date}','${c.id}')">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div style="display:flex;align-items:center;gap:6px;"><span style="color:var(--text-faint);">${chevron(ouvert)}</span><div class="p-nom" style="text-transform:capitalize;">${esc(dateLabel)}</div></div>
              <div class="p-meta">${entries.length} entrée${entries.length>1?'s':''}</div>
            </div>
            ${ouvert ? `<div style="margin-top:6px;padding-left:18px;border-top:1px solid var(--hairline);padding-top:6px;">${detail}</div>` : ''}
          </div>`;
        }).join('');
      })();

  return `
    <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin-bottom:8px;margin-top:20px;">Menus personnels du client</div>
    ${menusHtml}
    <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin-bottom:8px;margin-top:20px;">Journal alimentaire (30 derniers jours renseignés)</div>
    ${journalHtml}`;
}

function _toggleFicheMenu(menuId, clientId){
  if (_ficheMenusOuverts.has(menuId)) _ficheMenusOuverts.delete(menuId); else _ficheMenusOuverts.add(menuId);
  const c = data.clients.find(x=>x.id===clientId);
  const el = document.getElementById('ficheTabContent');
  if (el && c) el.innerHTML = renderFicheDieteTab(c);
}
function _toggleFicheJournalDate(date, clientId){
  if (_ficheJournalOuverts.has(date)) _ficheJournalOuverts.delete(date); else _ficheJournalOuverts.add(date);
  const c = data.clients.find(x=>x.id===clientId);
  const el = document.getElementById('ficheTabContent');
  if (el && c) el.innerHTML = renderFicheDieteTab(c);
}

// Résumé kcal/macros affiché directement dans le bandeau de la diète (fiche
// client), sans avoir besoin de l'ouvrir — calculé une fois dans chargerTousDietes().
function _dieteMacrosBadge(d){
  if (!d._macros) return '';
  const m = d._macros;
  return ` · <span style="color:var(--text);font-weight:600;">${Math.round(m.kcal)} kcal</span> · P${Math.round(m.prot)} G${Math.round(m.glu)} L${Math.round(m.lip)}`;
}

function renderFicheProgressionTab(){
  const xp = ficheData.xpData || null;

  const xpCard = xp ? (() => {
    const sz = xp.tier==='legendaire'?56:xp.tier==='diamant'?50:xp.tier==='platine'?46:40;
    const badgeSvg = typeof getBadgeSVG==='function' ? getBadgeSVG(xp.tier, sz, 'fcp') : '';
    const titrePill = (xp.titreDef && typeof renderTitrePill==='function') ? renderTitrePill(xp.titreDef, false) : '';
    const gauge = (pct, color, label, val, tot) => {
      const r=36,cx=45,cy=50;
      const totalLen=Math.PI*r;
      const dash=totalLen*(1-Math.min(pct,100)/100);
      return `<div style="text-align:center;flex:1;">
        <svg viewBox="0 0 90 58" width="90" height="58">
          <path d="M 9 50 A ${r} ${r} 0 0 1 81 50" fill="none" stroke="#2a3550" stroke-width="3" stroke-linecap="round"/>
          <path d="M 9 50 A ${r} ${r} 0 0 1 81 50" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="${totalLen.toFixed(1)}" stroke-dashoffset="${dash.toFixed(1)}"/>
          <text x="${cx}" y="${cy-10}" font-size="11" font-weight="bold" fill="#f0f2ff" text-anchor="middle">${pct}%</text>
        </svg>
        <div style="font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin-top:-4px;">${label}</div>
        <div style="font-size:13px;font-weight:700;color:${color};margin-top:2px;">${val}${tot?` <span style="font-size:10px;color:var(--text-faint);">/ ${tot}</span>`:''}
        </div>
      </div>`;
    };
    return `<div class="fiche-card" style="margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
        <div style="flex-shrink:0;">${badgeSvg}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-size:15px;font-weight:700;color:var(--text);">Niveau ${xp.niveau}</span>
            <span style="font-size:11px;color:${xp.tc.c1};font-weight:600;background:${xp.tc.c2}33;border:1px solid ${xp.tc.c1}55;border-radius:6px;padding:2px 8px;">${xp.tier.charAt(0).toUpperCase()+xp.tier.slice(1)}</span>
            ${titrePill}
          </div>
          <div style="font-size:12px;color:var(--text-faint);margin-top:4px;">${(xp.xpTotal||0).toLocaleString('fr')} XP · ${xp.niveauMaxAtteint ? '👑 niveau max atteint' : 'encore ' + (xp.xpManquant||0).toLocaleString('fr') + ' XP → niv. ' + (xp.niveau+1)}</div>
          <div style="height:5px;background:#1e2235;border-radius:3px;overflow:hidden;margin-top:7px;">
            <div style="height:5px;border-radius:3px;width:${xp.pct}%;background:${xp.tc.bar||xp.tc.c1};transition:width .6s ease;"></div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;border-top:1px solid var(--hairline);padding-top:14px;">
        ${gauge(xp.pctSeances,'#3ecf8e','Séances',xp.seancesValidees,xp.seancesAttendues)}
        ${gauge(xp.pctBilans,'#a78bfa','Bilans',xp.bilansValidies,xp.bilansAttendus)}
        ${gauge(xp.assiduiteGlobale,'#f59e0b','Assiduité',xp.assiduiteGlobale+'%','')}
      </div>
      <div style="display:flex;gap:8px;align-items:center;border-top:1px solid var(--hairline);padding-top:14px;margin-top:14px;">
        <input id="xpAjoutInput" type="number" step="1" placeholder="ex: 20 ou -10" style="flex:1;padding:8px 10px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;color:var(--text);font-size:13px;">
        <button class="btn" id="xpAjoutBtn" onclick="ajouterXpClient('${esc(ficheData.profil.client_id || '')}')">+ Ajouter XP</button>
      </div>
      ${_ficheRecalageAssiduiteHtml(xp)}
    </div>`;
  })() : (ficheData.loaded ? `<div class="fiche-card" style="margin-bottom:12px;"><p style="color:var(--text-faint);font-size:12px;">Pas encore de données XP (aucun bilan validé).</p></div>` : `<div class="fiche-card" style="margin-bottom:12px;"><p style="color:var(--text-faint);font-size:12px;">Chargement XP…</p></div>`);

  // Historique XP : reprend les mêmes événements réels (activite_events) que "Activité
  // récente" du dashboard (bilan envoyé, séance validée, journée validée), mais pour CE
  // client et sans limite de 7 jours — tout l'historique. Remplace l'ancienne "Progression
  // poids" (doublon de la courbe déjà présente dans l'onglet Mensurations, jugée inutile ici).
  const clientId = ficheData.profil && ficheData.profil.client_id;
  if (_ficheXpHistoClientId !== clientId) {
    _ficheXpHistoClientId = clientId;
    _ficheXpHistorique = null;
    _ficheXpHistoLoading = false;
  }
  // XP par ligne (2026-08-03) : activite_events ne stocke aucun montant — bilan_envoye est
  // remplacé par une lecture directe de bilans.xp_credite (montant exact, déjà calculé et
  // dédoublonné par bilan.js). seance_validee est un montant FIXE (XP_SEANCE_VALIDEE, bilan.js/
  // programme-client.js) — toujours exact. journee_validee affiche le montant de BASE garanti
  // (XP_JOURNEE_VALIDEE) — le bonus pas éventuel (+BONUS_PAS_JOUR si objectif atteint ce jour-là)
  // n'est PAS reconstruit ici : il faudrait retrouver, pour la date exacte de l'événement, quel
  // bilan et quelle position du tableau jours[] elle correspondait — fragile à travers le
  // changement de convention de semaine (voir plus haut dans ce fichier, "décalée à la veille de
  // jour_bilan"), risque de ressortir un chiffre faux plutôt qu'utile. Constantes dupliquées ici
  // (console.html ne charge pas bilan.js) — à resynchroniser si elles changent côté client.
  const XP_SEANCE_VALIDEE_CONST = 10;
  const XP_JOURNEE_VALIDEE_CONST = 5;
  if (clientId && _ficheXpHistorique === null && !_ficheXpHistoLoading) {
    _ficheXpHistoLoading = true;
    const fmtTs = iso => { const d = new Date(iso); return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); };
    Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/activite_events?client_id=eq.${encodeURIComponent(clientId)}&type=in.(seance_validee,journee_validee)&order=created_at.desc&limit=300&select=type,meta,created_at`, { headers: supaHeaders() }).then(r => r.ok ? r.json() : []),
      fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(clientId)}&xp_credite=gt.0&order=created_at.desc&limit=300&select=semaine_label,xp_credite,envoye_at,created_at`, { headers: supaHeaders() }).then(r => r.ok ? r.json() : []),
    ]).then(([events, bilans]) => {
      const evRows = events.map(r => ({ type: r.type, semaine: r.meta && r.meta.semaine_label, tms: r.created_at, xp: r.type === 'seance_validee' ? XP_SEANCE_VALIDEE_CONST : XP_JOURNEE_VALIDEE_CONST, approx: r.type === 'journee_validee' }));
      const bilanRows = bilans.map(b => ({ type: 'bilan_envoye', semaine: b.semaine_label, tms: b.envoye_at || b.created_at, xp: b.xp_credite, approx: false }));
      _ficheXpHistorique = [...evRows, ...bilanRows]
        .sort((a, b) => (b.tms || '').localeCompare(a.tms || ''))
        .slice(0, 300)
        .map(r => ({ ...r, ts: fmtTs(r.tms) }));
      _ficheXpHistoLoading = false;
      const el = document.getElementById('ficheTabContent');
      if (el && ficheTab === 'progression') el.innerHTML = renderFicheProgressionTab();
    }).catch(() => { _ficheXpHistorique = []; _ficheXpHistoLoading = false; });
  }
  const xpHistoRows = (_ficheXpHistorique || []).map(l => {
    const info = libelleLog(l);
    return `<div class="fiche-hist-row">
      <span style="color:var(--text-muted);">${info.icon} ${esc(info.txt)}${info.sub ? ' · ' + esc(info.sub) : ''}</span>
      <span style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <span style="font-size:12px;font-weight:700;color:#4f8ef7;">+${l.xp}${l.approx?'+':''} XP</span>
        <span style="color:var(--text-faint);font-size:11px;">${esc(l.ts)}</span>
      </span>
    </div>`;
  }).join('');
  const xpHistoContent = _ficheXpHistorique === null
    ? `<div class="fiche-prog-empty">Chargement…</div>`
    : (_ficheXpHistorique.length ? xpHistoRows : `<div class="fiche-prog-empty">Aucun événement enregistré.</div>`);

  return `
    ${xpCard}
    <div class="fiche-card">
      <h3>Historique XP</h3>
      <div style="font-size:11px;color:var(--text-faint);margin-bottom:10px;">Tout ce qui fait gagner de l'XP : bilans envoyés, séances et journées validées.</div>
      ${xpHistoContent}
    </div>`;
}

const SUIVI_CHAMPS = [
  { key:'calories', label:'Calories', icon:'🔥' },
  { key:'nutrition', label:'Nutrition', icon:'🥗' },
  { key:'entrainement', label:'Entraînement', icon:'🏋️' },
  { key:'commentaire_general', label:'Commentaire général', icon:'📝' },
];

      <div style="display:flex;gap:8px;">

      </div>

      <div class="fiche-card" style="margin-bottom:10px;">

          </div>

      </div>`).join('')

async function ouvrirModalSuivi(clientId, id) {
  const entries = Array.isArray(ficheData.suivi) ? ficheData.suivi : [];
  const row = id ? (entries.find(x=>x.id===id) || {}) : {};
  // Phase auto-dérivée de la Roadmap à la date de l'entrée — plus besoin de la sélectionner
  // à la main (même logique que la modale mensuration, voir _roadmapPhaseLabelAtDate).
  let roadmap = [];
  try {

// Import idempotent de l'historique Suivi (GAS) — clé stable gas_row (numéro de
// ligne dans la feuille), pour ne jamais dupliquer un import déjà fait. Une entrée
// créée à la main dans la console a gas_row=NULL, jamais touchée par cet import.
async function migrerSuiviClient(clientId) {
  const btn = document.getElementById('btn-migrer-suivi');
  if (!confirm('Importer l\'historique Suivi depuis GAS pour ce client ?')) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Import…'; }
  try {
    const rows = await apiGasProd('listerSuivi', clientId);
    if (!Array.isArray(rows) || !rows.length) { alert('Aucune entrée Suivi trouvée dans GAS pour ce client.'); return; }
    // La toute première ligne ("Début coaching") n'a souvent pas de date dans GAS —
    // client_suivi.date est NOT NULL, on ne peut pas l'importer sans date fiable.
    const sansDate = rows.filter(r => !r.date);
    const body = rows.filter(r => r.date).map(r => {
      // Normalise la phase brute GAS (CUT/REFEED/REVERSE…) vers le libellé Roadmap
      // canonique — même logique que la normalisation déjà faite sur les mensurations.
      const matched = r.phase ? _mensPhaseRoadmapType(r.phase) : null;
      return {
        client_id: clientId,
        gas_row: r.row,
        date: r.date,
        phase: matched ? matched.label : (r.phase || null),
        calories: r.calories || null,
        nutrition: r.nutrition || null,
        entrainement: r.entrainement || null,
        commentaire_general: r.commentaire || null,
      };
    });
    if (!body.length) { alert('Aucune ligne avec une date exploitable.'); return; }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_suivi?on_conflict=client_id,gas_row`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=representation,resolution=merge-duplicates' }),
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(await res.text());
    ficheData.suivi = await chargerSuivi(clientId);
    if (state.nav==='fiche-client' && state.selected===clientId) renderMain();
    alert(`${body.length} entrée(s) de suivi importée(s)/mise(s) à jour.` + (sansDate.length ? `\n${sansDate.length} ligne(s) ignorée(s) faute de date.` : ''));
  } catch(e) { alert('Erreur migration Suivi : ' + e.message); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '⬇ Migrer depuis GAS'; } }
}

// Calendrier mensuel : un bloc par mois couvert par les phases (déborde sur le mois
// suivant → bloc supplémentaire à côté), chaque jour coloré selon la phase qui le couvre.
const RM_JOURS_SEMAINE = ['L','M','M','J','V','S','D'];
function _rmCalendarMonths(phasesAvecDates){
  const min = phasesAvecDates.reduce((a,p)=> p.date_debut<a?p.date_debut:a, phasesAvecDates[0].date_debut);
  const max = phasesAvecDates.reduce((a,p)=> p.date_fin>a?p.date_fin:a, phasesAvecDates[0].date_fin);
  const [y0,m0] = min.split('-').map(Number);
  const [y1,m1] = max.split('-').map(Number);
  const months = [];
  let y=y0, m=m0;
  while (y<y1 || (y===y1 && m<=m1)) { months.push([y,m]); m++; if (m>12){ m=1; y++; } }
  return months;
}
function _rmCalendrierHtml(phases, typeFn){
  const withDates = phases.filter(p => p.date_debut && p.date_fin);
  if (!withDates.length) return '';
  const months = _rmCalendarMonths(withDates);
  const todayStr = _rmIsoLocal(new Date());
  const moisNoms = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const monthsHtml = months.map(([y,m]) => {
    const daysInMonth = new Date(y, m, 0).getDate();
    const firstWeekday = (new Date(y, m-1, 1).getDay() + 6) % 7; // lundi=0
    const cells = [];
    for (let i=0;i<firstWeekday;i++) cells.push('<div></div>');
    for (let d=1; d<=daysInMonth; d++) {
      const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const phase = withDates.find(p => p.date_debut<=dateStr && dateStr<=p.date_fin);
      const t = phase ? typeFn(phase.type) : null;
      const isToday = dateStr===todayStr;
      cells.push(`<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;${t?`background:${t.color}26;color:${t.color};font-weight:700;`:'color:var(--text-faint);'}${isToday?`box-shadow:inset 0 0 0 2px ${t?t.color:'var(--accent)'};`:''}" title="${t?esc(t.label):''}">${d}</div>`);
    }
    return `<div style="flex:0 0 auto;width:168px;">
      <div style="font-size:11px;font-weight:700;margin-bottom:6px;text-align:center;">${moisNoms[m-1]} ${y}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px;">
        ${RM_JOURS_SEMAINE.map(j=>`<div style="text-align:center;font-size:8px;color:var(--text-faint);">${j}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">${cells.join('')}</div>
    </div>`;
  }).join('');
  return `<div style="margin-top:20px;">
    <div style="font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Calendrier</div>
    <div style="display:flex;flex-wrap:wrap;gap:14px;">${monthsHtml}</div>
  </div>`;
}

// Auto-grandissement du textarea au fil de la frappe (pas de scrollbar interne).
function rmAutoGrow(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

// Appelé une fois après chaque (re)render de l'onglet Roadmap pour donner leur
// hauteur initiale aux textarea déjà remplis (sinon ils restent à min-height).
function rmAutoGrowAll(){
  document.querySelectorAll('[data-rm-objectif]').forEach(rmAutoGrow);
}

function _rmJoursConsole(p){
  const d = new Date(p.date_debut), f = new Date(p.date_fin);
  return Math.max(1, Math.round((f-d)/86400000) + 1);
}
// Affiche la durée d'une phase en semaines/mois si elle tombe exactement pile
// (mois = mois calendaire réel via setMonth, pas une approximation 30 jours —
// cohérent avec _rmComputeFin/_rmAppliquerDuree), sinon en jours.
function _rmFmtDuree(dateDebut, dateFin){
  if (!dateDebut || !dateFin) return '';
  const jours = Math.round((new Date(dateFin) - new Date(dateDebut))/86400000) + 1;
  if (jours <= 0) return '';
  for (let n = 1; n <= 24; n++) {
    const fin = _rmAddDays(_rmAddMonths(dateDebut, n), -1);
    if (fin === dateFin) return n === 1 ? '1 mois' : n + ' mois';
    if (fin > dateFin) break;
  }
  if (jours % 7 === 0) { const s = jours / 7; return s === 1 ? '1 semaine' : s + ' semaines'; }
  return jours + (jours === 1 ? ' jour' : ' jours');
}
// toISOString() convertit en UTC avant de trancher la date : à minuit heure
// locale (Europe/Paris, UTC+1/+2), ça fait reculer la date d'un jour (ex :
// 4 semaines depuis le 01/08 donnait le 27/08 au lieu du 28/08). On reconstruit
// la date depuis les composants locaux du Date pour éviter ce décalage.
function _rmIsoLocal(d){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function _rmAddDays(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return _rmIsoLocal(d);
}
function _rmAddMonths(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setMonth(d.getMonth()+n);
  return _rmIsoLocal(d);
}
const RM_DUREES_JOURS = { '7j':7, '2sem':14, '3sem':21, '4sem':28 };
const RM_DUREES_MOIS = { '1mois':1, '2mois':2 };
const RM_DUREE_OPTIONS = [
  { key:'7j',    label:'7 jours' },
  { key:'2sem',  label:'2 semaines' },
  { key:'3sem',  label:'3 semaines' },
  { key:'4sem',  label:'4 semaines' },
  { key:'1mois', label:'1 mois' },
  { key:'2mois', label:'2 mois' },
];
// Date de fin par défaut pour une durée donnée : toujours `durée - 1 jour` après
// le début (pas de calage forcé sur un dimanche) — si la phase démarre un lundi,
// une durée en semaines tombera donc naturellement un dimanche. Le coach peut
// ensuite modifier la date de fin à la main.
function _rmComputeFin(dateDebut, dureeKey){
  if (RM_DUREES_JOURS[dureeKey]) return _rmAddDays(dateDebut, RM_DUREES_JOURS[dureeKey] - 1);
  return _rmAddDays(_rmAddMonths(dateDebut, RM_DUREES_MOIS[dureeKey]||1), -1);
}

// Ajoute une phase directement (pas de dialogue) : enchaînée juste après la
// dernière phase existante (durée par défaut 4 semaines), le coach ajuste
// ensuite à la main sur le bloc — champs date, boutons ‹7j/7j›, ou les
// boutons de durée rapide (rmAppliquerDuree) qui recalculent la date de fin.
async function rmAjouterPhase(clientId){
  const phases = (Array.isArray(ficheData.roadmap)?ficheData.roadmap:[]).slice().sort((a,b)=>(a.date_debut||'').localeCompare(b.date_debut||''));
  const last = phases[phases.length-1];
  const date_debut = last ? _rmAddDays(last.date_fin,1) : _rmIsoLocal(new Date());
  const date_fin = _rmComputeFin(date_debut, '4sem');
  try {
    await sauverRoadmapApi(clientId, null, { type: last?last.type:'cut', date_debut, date_fin, objectif:'' });
    ficheData.roadmap = await chargerRoadmap(clientId);
    setFicheTab('roadmap');
    rmAutoGrowAll();
  } catch(e){ alert('Erreur : ' + e.message); }
}

// Boutons de durée rapide sur un bloc de phase : recalcule la date de fin à
// partir de la date de début actuelle du bloc et sauvegarde immédiatement.
function rmAppliquerDuree(id, clientId, dureeKey){
  const phases = Array.isArray(ficheData.roadmap) ? ficheData.roadmap : [];
  const p = phases.find(x=>x.id===id);
  if (!p) return;
  rmChangerChamp(id, clientId, 'date_fin', _rmComputeFin(p.date_debut, dureeKey));
}

// Recolle les phases suivantes (par ordre chronologique) après modification
// des dates de la phase `phaseId` : chaque phase après elle doit commencer
// exactement le lendemain de la fin de celle qui la précède (pas de trou, pas
// de chevauchement), en conservant sa propre durée. S'arrête dès qu'une phase
// est déjà correctement positionnée (tout ce qui suit l'est forcément aussi).
async function rmCascaderSuite(clientId, phaseId){
  const phases = (Array.isArray(ficheData.roadmap) ? ficheData.roadmap : []).slice().sort((a,b)=>(a.date_debut||'').localeCompare(b.date_debut||''));
  const idx = phases.findIndex(p => p.id === phaseId);
  if (idx === -1) return;
  let ancre = phases[idx];
  for (let i = idx + 1; i < phases.length; i++) {
    const p = phases[i];
    const nouveauDebut = _rmAddDays(ancre.date_fin, 1);
    if (nouveauDebut === p.date_debut) { ancre = p; continue; }
    const dureeJours = Math.round((new Date(p.date_fin) - new Date(p.date_debut)) / 86400000);
    const nouveauFin = _rmAddDays(nouveauDebut, dureeJours);
    await sauverRoadmapApi(clientId, p.id, Object.assign({}, p, { date_debut: nouveauDebut, date_fin: nouveauFin }));
    p.date_debut = nouveauDebut; p.date_fin = nouveauFin;
    ancre = p;
  }
}

// Type/dates : sauvegarde immédiate + re-render (met à jour timeline + tri).
async function rmChangerChamp(id, clientId, champ, valeur){
  const phases = Array.isArray(ficheData.roadmap) ? ficheData.roadmap : [];
  const p = phases.find(x=>x.id===id);
  if (!p) return;
  const maj = Object.assign({}, p, { [champ]: valeur });
  if (maj.date_fin < maj.date_debut) { alert('La date de fin doit être après la date de début.'); setFicheTab('roadmap'); return; }
  try {
    await sauverRoadmapApi(clientId, id, maj);
    ficheData.roadmap = await chargerRoadmap(clientId);
    if (champ === 'date_debut' || champ === 'date_fin') {
      await rmCascaderSuite(clientId, id);
      ficheData.roadmap = await chargerRoadmap(clientId);
    }
    setFicheTab('roadmap');
    rmAutoGrowAll();
  } catch(e){ alert('Erreur : ' + e.message); }
}

// Décale toute la phase (début + fin) de `deltaJours` — pratique pour repousser
// une phase suite à un bilan sans avoir à retoucher les deux dates à la main.
async function rmDecaler(id, clientId, deltaJours){
  const phases = Array.isArray(ficheData.roadmap) ? ficheData.roadmap : [];
  const p = phases.find(x=>x.id===id);
  if (!p) return;
  const maj = Object.assign({}, p, { date_debut:_rmAddDays(p.date_debut,deltaJours), date_fin:_rmAddDays(p.date_fin,deltaJours) });
  try {
    await sauverRoadmapApi(clientId, id, maj);
    ficheData.roadmap = await chargerRoadmap(clientId);
    await rmCascaderSuite(clientId, id);
    ficheData.roadmap = await chargerRoadmap(clientId);
    setFicheTab('roadmap');
    rmAutoGrowAll();
  } catch(e){ alert('Erreur : ' + e.message); }
}

// Objectif : sauvegarde debounced SANS re-render (sinon le curseur/focus saute
// à chaque frappe) — on met juste à jour le cache local une fois la requête ok.
let _rmObjectifTimers = {};
function rmObjectifChange(id, clientId, valeur){
  clearTimeout(_rmObjectifTimers[id]);
  _rmObjectifTimers[id] = setTimeout(async () => {
    const phases = Array.isArray(ficheData.roadmap) ? ficheData.roadmap : [];
    const p = phases.find(x=>x.id===id);
    if (!p) return;
    try {
      await sauverRoadmapApi(clientId, id, Object.assign({}, p, { objectif: valeur }));
      p.objectif = valeur;
    } catch(e) { /* échec silencieux : la valeur reste affichée, retentera au prochain champ modifié */ }
  }, 700);
}

function renderFicheProgDetail(prog){
  const blocs = prog.blocs || [];

  const nbSeances = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).length,0);
  const nbExo = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).reduce((s2,se)=>s2+(se.client_programme_exercices||[]).length,0),0);
  // ficheSemaine est une semaine GLOBALE (1..totalSemaines, cumulée sur tous les blocs) ;
  // les logs sont stockés avec une semaine LOCALE au bloc — même conversion que
  // renderProgLogsPage, sinon les blocs après le premier ne retrouvent jamais leurs logs.
  const blocOffset = blocs.map((_, bi) => { let off=0; for(let i=0;i<bi;i++) off += (blocs[i].nombre_semaines||1); return off; });
  return `
    <div class="fiche-prog">
      <div class="nom">${esc(prog.nom||'Programme sans nom')}</div>
      <div class="meta">${nbSeances} séance${nbSeances>1?'s':''} · ${nbExo} exercice${nbExo>1?'s':''} · assigné le ${prog.created_at?new Date(prog.created_at).toLocaleDateString('fr-FR'):'—'}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin:12px 0 10px;">
      <button class="btn" style="padding:5px 11px;" onclick="ficheSemaineChanger(-1)">‹</button>
      <span style="font-size:13px;font-weight:700;">Semaine ${ficheSemaine}${totalSemaines>1?' / '+totalSemaines:''}</span>
      <button class="btn" style="padding:5px 11px;" onclick="ficheSemaineChanger(1)">›</button>
    </div>
    ${blocs.map((b,bi)=>{
      const semLocale = ficheSemaine - (blocOffset[bi]||0);
      return `
      ${b.type?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:10px 0 4px;">${esc(BLOC_LABELS_COACH[b.type]||b.type)}${b.nombre_semaines?' · '+b.nombre_semaines+' sem.':''}</div>`:''}
      ${(b.client_programme_seances||[]).map(s=>`
        <div style="background:var(--surface-2);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;">
          <div style="padding:9px 12px;font-weight:700;font-size:13px;border-bottom:1px solid var(--hairline);">${esc(s.titre)}</div>
          ${(s.client_programme_exercices||[]).map(ex=>{
            const nbSeries = ex.series||1;
            let seriesHtml='';
            for(let sr=1;sr<=nbSeries;sr++){
              const l=logs[ex.id+'|'+semLocale+'|'+sr]||{};
              const hasLog = l.charge!=null||l.reps!=null;
              seriesHtml+=`<div style="display:flex;gap:8px;align-items:center;font-size:12px;padding:2px 0;">
                <span style="color:var(--text-faint);width:16px;">#${sr}</span>
                <span style="${hasLog?'color:var(--text);font-weight:600;':'color:var(--text-faint);'}">
                  ${hasLog?(l.charge!=null?l.charge+'kg ':'')+''+(l.reps!=null?l.reps+' reps ':'')+''+(l.rir?'RIR '+l.rir:''):'—'}
                </span>
              </div>`;
            }
            return `<div style="padding:8px 12px;border-top:1px solid var(--hairline);">
              <div style="font-size:12.5px;font-weight:600;margin-bottom:4px;">${esc(ex.nom)}</div>
              <div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">Cible : ${ex.series||'—'}×${esc(ex.reps||'—')}${ex.repos?' · repos '+esc(ex.repos):''}${ex.rir?' · RIR '+esc(ex.rir):''}</div>
              ${seriesHtml}
              ${(()=>{const cl=logs[ex.id+'|'+semLocale+'|1'];return cl&&cl.commentaire?`<div style="font-size:11px;color:var(--text-muted);margin-top:4px;font-style:italic;">${esc(cl.commentaire)}</div>`:'';})()}
            </div>`;
          }).join('')||`<div style="padding:8px 12px;font-size:12px;color:var(--text-faint);">Aucun exercice.</div>`}
        </div>`).join('')}
    `;
    }).join('')||`<div class="fiche-prog-empty">Aucune séance dans ce programme.</div>`}`;
}

// ── Logs d'un programme assigné ──────────────────────────────────────
function ouvrirLogsProgramme(progId){
  state.nav = 'prog-logs';
  state.progLogsId = progId;
  progLogsData = { loaded:false, programme:null, blocs:[], logs:{} };
  progLogsSemaineParBloc = {};
  _progLogsView = 'semaine';
  _progLogsCollapsed = new Set();
  renderSidebar();
  renderMain();
  const exLoad = exercicesData === null ? chargerExercices().then(d=>{ exercicesData=d; }).catch(()=>{}) : Promise.resolve();
  Promise.all([chargerProgrammeById(progId), exLoad]).then(([prog]) => {
    const blocs = prog ? prog.blocs : [];
    const logs = prog ? prog.logs : {};
    // Nb de semaines "réelles" par bloc pour capper la navigation ‹›: nombre_semaines
    // déclaré, ou le max effectivement loggué s'il le dépasse (log au-delà du prévu).
    const exToBloc = {};
    blocs.forEach((b,bi) => (b.client_programme_seances||[]).forEach(s => (s.client_programme_exercices||[]).forEach(ex => { exToBloc[ex.id]=bi; })));
    const blocMaxSem = blocs.map(b => b.nombre_semaines || 1);
    Object.keys(logs).forEach(key => {
      const parts = key.split('|'); const exId = parts[0], sem = parseInt(parts[1]);
      const bi = exToBloc[exId];
      if (bi !== undefined && sem > (blocMaxSem[bi]||0)) blocMaxSem[bi] = sem;
    });
    progLogsData = { loaded:true, programme:prog, blocs, logs, blocMaxSem, equivalents: (prog && prog.equivalents) || {}, equivLogs: (prog && prog.equivLogs) || {} };
    if (state.nav==='prog-logs' && state.progLogsId===progId) renderMain();
  }).catch(e => {
    progLogsData = { loaded:true, programme:null, blocs:[], logs:{}, error:e.message };
    if (state.nav==='prog-logs') renderMain();
  });
}

function progLogsSemaineChangerBloc(bi, delta){
  const max = (progLogsData.blocMaxSem && progLogsData.blocMaxSem[bi]) || 1;
  const cur = progLogsSemaineParBloc[bi] || 1;
  progLogsSemaineParBloc[bi] = Math.max(1, Math.min(max, cur + delta));
  renderMain();
}

// Vue "tableur" — un exercice par ligne, une semaine par colonne (scroll horizontal),
// pour lire toute l'évolution d'un coup d'œil sans naviguer semaine par semaine.
// Réutilise progByEx (charge max retenue par semaine, cross-blocs) déjà calculé dans
// renderProgLogsPage — même source de données que la vue "Progression" (sparklines),
// juste présentée en grille dense au lieu d'une carte par exercice.
// Groupée par séance (bandeau de titre coloré, même code couleur BLOC_COLOR que
// l'éditeur de programme) avec un espacement discret entre chaque bloc.
function renderProgLogsGrille(blocs, progByEx, progByExReps){
  // Regroupe séance par séance (dans l'ordre du programme) en ne gardant que les
  // exercices ayant au moins une donnée de charge — une séance sans aucune donnée
  // n'apparaît pas du tout (pas de bandeau vide).
  const groupes = []; // [{ blocIdx, color, blocLabel, seanceTitre, exos:[ex,...] }]
  blocs.forEach((b, bi) => {
    const color = BLOC_COLOR[b.type] || 'var(--hairline)';
    const blocLabel = BLOC_LABELS_COACH[b.type] || b.type || 'Générique';
    (b.client_programme_seances||[]).forEach(s => {
      const exos = (s.client_programme_exercices||[]).filter(ex => progByEx[ex.id] && Object.keys(progByEx[ex.id]).length >= 1);
      if (exos.length) groupes.push({ blocIdx: bi, color, blocLabel, seanceTitre: s.titre, exos });
    });
  });
  if (!groupes.length) return `<div class="empty-panel"><strong>Pas encore de données</strong>Le client n'a pas encore loggé de charges.</div>`;
  const maxSem = Math.max(...groupes.flatMap(g => g.exos.flatMap(ex => Object.keys(progByEx[ex.id]).map(Number))));
  const semaines = Array.from({length:maxSem}, (_,i)=>i+1);
  const nbCols = semaines.length + 2; // exercice + semaines + delta

  let lastBlocIdx = null;
  const rows = groupes.map(g => {
    const spacer = (lastBlocIdx !== null && g.blocIdx !== lastBlocIdx)
      ? `<tr><td colspan="${nbCols}" style="padding:0;border:none;height:10px;background:transparent;"></td></tr>` : '';
    lastBlocIdx = g.blocIdx;
    const header = `<tr>
      <td colspan="${nbCols}" style="position:sticky;left:0;background:${g.color}14;border-left:3px solid ${g.color};padding:6px 12px;">
        <span style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:${g.color};">${esc(g.blocLabel)}</span>
        <span style="font-size:12px;font-weight:600;color:var(--text);margin-left:8px;">${esc(g.seanceTitre)}</span>
        <span style="font-size:11px;color:var(--text-faint);margin-left:6px;">${g.exos.length} exo${g.exos.length>1?'s':''}</span>
      </td>
    </tr>`;
    const exRows = g.exos.map(ex => {
      const exData = (exercicesData||[]).find(e=>e.id===ex.exercice_id);
      const groupe = exData ? exData.groupe_musculaire : null;
      const pts = progByEx[ex.id]||{};
      const semRenseignees = semaines.filter(s=>pts[s]!=null);
      const first = semRenseignees.length ? pts[semRenseignees[0]] : null;
      const last = semRenseignees.length ? pts[semRenseignees[semRenseignees.length-1]] : null;
      const delta = (first!=null && last!=null) ? last-first : null;
      const deltaStr = delta==null ? '—' : (delta>=0?'+':'')+delta.toFixed(1)+' kg';
      const deltaColor = delta>0?'#4caf50':delta<0?'var(--critical)':'var(--text-faint)';
      const cells = semaines.map(s => {
        const c = pts[s];
        if (c==null) return `<td style="text-align:center;color:var(--text-faint);font-size:12px;">—</td>`;
        const r = (progByExReps[ex.id]||{})[s];
        return `<td style="text-align:center;white-space:nowrap;">
          <div style="font-size:12.5px;font-weight:700;">${c}kg</div>
          ${r!=null?`<div style="font-size:10px;color:var(--text-faint);">${esc(String(r))} reps</div>`:''}
        </td>`;
      }).join('');
      return `<tr>
        <td style="position:sticky;left:0;background:var(--surface);border-left:3px solid ${g.color}55;z-index:1;white-space:nowrap;padding:6px 14px 6px 11px;">
          <div style="font-size:12.5px;font-weight:600;">${esc(ex.nom)}</div>
          ${groupe?`<div style="font-size:10.5px;color:var(--text-faint);">${esc(groupe)}</div>`:''}
        </td>
        ${cells}
        <td style="text-align:center;white-space:nowrap;font-weight:700;font-size:12.5px;color:${deltaColor};">${deltaStr}</td>
      </tr>`;
    }).join('');
    return spacer + header + exRows;
  }).join('');
  const headCells = semaines.map(s=>`<th style="text-align:center;font-size:11px;">S${s}</th>`).join('');
  return `<div class="table-card">
    <div class="table-scroll"><table class="alim-table" style="width:auto;">
      <thead><tr><th style="position:sticky;left:0;background:var(--surface);z-index:1;">Exercice</th>${headCells}<th style="text-align:center;">Δ</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderProgLogsPage(el){
  const backClientId = state.selected;
  if (!progLogsData.loaded){
    el.innerHTML = `
      <button class="fiche-back" onclick="setNav('fiche-client')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        Retour à la fiche client
      </button>
      <div style="display:flex;align-items:center;justify-content:center;padding:80px;"><div class="spin"></div></div>`;
    return;
  }
  if (progLogsData.error || !progLogsData.programme){
    el.innerHTML = `<div class="empty-panel"><strong>Erreur</strong>${esc(progLogsData.error||'Programme introuvable')}</div>`;
    return;
  }
  const prog = progLogsData.programme;
  const blocs = progLogsData.blocs || [];
  const logs = progLogsData.logs || {};
  const nbSeances = blocs.reduce((s,b)=>s+(b.client_programme_seances||[]).length,0);

  // Map exId → bloc index (pour offset chronologique)
  const exToBloc = {};
  blocs.forEach((b, bi) => {
    (b.client_programme_seances||[]).forEach(s => {
      (s.client_programme_exercices||[]).forEach(ex => { exToBloc[ex.id] = bi; });
    });
  });
  // Semaines réelles par bloc : nombre_semaines ou max des logs
  const blocMaxSem = blocs.map(b => b.nombre_semaines || 0);
  Object.entries(logs).forEach(([key]) => {
    const parts = key.split('|');
    const exId = parts[0], sem = parseInt(parts[1]);
    const bi = exToBloc[exId];
    if (bi !== undefined && sem > (blocMaxSem[bi]||0)) blocMaxSem[bi] = sem;
  });
  // Offset cumulatif par bloc (bloc 0 = 0, bloc 1 = sem bloc 0, etc.)
  const blocOffset = blocs.map((_, bi) => { let off=0; for(let i=0;i<bi;i++) off+=blocMaxSem[i]; return off; });

  // Build progression data cross-blocs avec semaines globales
  const progByEx = {};
  const progByExReps = {}; // exId → globalSem → reps du set qui porte la charge max retenue (pour la grille)
  Object.entries(logs).forEach(([key, l]) => {
    const parts = key.split('|');
    const exId = parts[0], sem = parseInt(parts[1]);
    const charge = parseFloat(l.charge);
    if (!isNaN(charge) && charge > 0) {
      const bi = exToBloc[exId] ?? 0;
      const globalSem = sem + (blocOffset[bi] || 0);
      if (!progByEx[exId]) progByEx[exId] = {};
      if (!progByEx[exId][globalSem] || charge > progByEx[exId][globalSem]) {
        progByEx[exId][globalSem] = charge;
        if (!progByExReps[exId]) progByExReps[exId] = {};
        progByExReps[exId][globalSem] = l.reps != null ? l.reps : null;
      }
    }
  });

  el.innerHTML = `
    <button class="fiche-back" onclick="retourFicheClient()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
      Retour à la fiche client
    </button>

    <div class="page-head" style="margin-bottom:16px;">
      <div>
        <div class="eyebrow">Logs du programme</div>
        <h1>${esc(prog.nom)}</h1>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        ${prog.actif ? '<span class="chip ok"><span class="dot"></span>Actif</span>' : '<span class="chip off">Inactif</span>'}
        <button class="btn" style="font-size:11px;padding:5px 10px;" onclick="ouvrirEditeurProgrammeClient(${prog.id})">Éditer</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
      <button class="btn ${_progLogsView==='semaine'?'primary':''}" style="font-size:12px;padding:5px 12px;" onclick="_progLogsView='semaine';renderMain()">Vue semaine</button>
      <button class="btn ${_progLogsView==='progression'?'primary':''}" style="font-size:12px;padding:5px 12px;" onclick="_progLogsView='progression';renderMain()">Progression</button>
      <button class="btn ${_progLogsView==='grille'?'primary':''}" style="font-size:12px;padding:5px 12px;" onclick="_progLogsView='grille';renderMain()">Grille</button>
      ${_progLogsView==='semaine' && blocs.length>1 ? `<span style="font-size:11.5px;color:var(--text-faint);margin-left:4px;">${blocs.length} blocs · chacun a sa propre navigation semaine ci-dessous</span>` : ''}
    </div>

    ${_progLogsView === 'grille' ? renderProgLogsGrille(blocs, progByEx, progByExReps) : _progLogsView === 'progression' ? (() => {
      const allEx = blocs.flatMap(b=>(b.client_programme_seances||[]).flatMap(s=>(s.client_programme_exercices||[])));
      const withData = allEx.filter(ex => progByEx[ex.id] && Object.keys(progByEx[ex.id]).length >= 1);
      if (!withData.length) return `<div class="empty-panel"><strong>Pas encore de données</strong>Le client n'a pas encore loggé de charges.</div>`;
      return withData.map(ex => {
        const exData = (exercicesData||[]).find(e=>e.id===ex.exercice_id);
        const groupe = exData ? exData.groupe_musculaire : null;
        const pts = Object.entries(progByEx[ex.id]||{}).sort((a,b)=>+a[0]-+b[0]);
        const charges = pts.map(p=>p[1]);
        const maxC = Math.max(...charges), minC = Math.min(...charges);
        const W=300, H=60, PL=6, PR=6, PT=8, PB=14;
        const iW=W-PL-PR, iH=H-PT-PB;
        const xs = pts.map((_,i)=>PL+(pts.length<2?iW/2:i/(pts.length-1)*iW));
        const ys = charges.map(c=>PT+(maxC===minC?iH/2:iH-(c-minC)/(maxC-minC)*iH));
        const polyline = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
        const first = charges[0], last = charges[charges.length-1];
        const delta = last - first;
        const deltaStr = (delta>=0?'+':'')+delta.toFixed(1)+' kg';
        const deltaColor = delta>0?'#4caf50':delta<0?'var(--critical)':'var(--text-faint)';
        return `<div style="background:var(--surface);border-radius:var(--radius);margin-bottom:12px;padding:12px 14px;box-shadow:var(--shadow-sm);">

              let equivHtml = '';
              if (equiv) {

                for (let sr=1; sr<=nbSeries; sr++){

                  </div>`;
                }

                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
                  <div>
                    <div style="font-size:12.5px;font-weight:600;">${esc(ex.nom)}</div>
                    ${groupe?`<div style="font-size:10.5px;color:var(--text-faint);">${esc(groupe)}</div>`:''}
                  </div>
                  <div style="font-size:11px;color:var(--text-faint);">Cible: ${ex.series||'—'}×${esc(ex.reps||'—')}${ex.repos?' · '+esc(ex.repos):''}${ex.rir?' · RIR '+ex.rir:''}</div>
                </div>
                ${setsHtml}
                ${firstLog.commentaire ? `<div style="font-size:11px;color:var(--text-muted);margin-top:6px;font-style:italic;">"${esc(firstLog.commentaire)}"</div>` : ''}
                ${equivHtml}

            }).join('')||`<div style="padding:10px 14px;font-size:12px;color:var(--text-faint);">Aucun exercice.</div>`}
            </div>
          </div>`;
        }).join('')}
        </div>
      </div>`;
    }).join('') || `<div class="empty-panel"><strong>Programme vide</strong>Aucune séance dans ce programme.</div>`}`;
}

async function ouvrirEditeurProgrammeClient(progId){
  if (exercicesData === null) { try { exercicesData = await chargerExercices(); } catch(e) { exercicesData = []; } }
  const prog = await chargerProgrammeById(progId);
  if (!prog) { alert('Programme introuvable'); return; }
  clientProgEnEdition = {
    id: prog.id, client_id: prog.client_id, nom: prog.nom, objectif: prog.objectif || '', actif: prog.actif, bloc_actif_id: prog.bloc_actif_id || null,
    blocs: (prog.blocs||[]).map(b => ({
      id: b.id, type: b.type||null, nombre_semaines: b.nombre_semaines||null,
      seances: (b.client_programme_seances||[]).map(s => ({
        id: s.id, titre: s.titre,
        exercices: (s.client_programme_exercices||[]).map(ex => {
          const exData = (exercicesData||[]).find(e=>e.id===ex.exercice_id) ||
                         (exercicesData||[]).find(e=>e.nom.toLowerCase()===(ex.nom||'').toLowerCase());
          return { id: ex.id, exercice_id: ex.exercice_id, nom: ex.nom||(exData?exData.nom:'?'), groupe_musculaire: exData?(exData.groupe_musculaire||null):null, gif_url: exData?(exData.gif_url||null):null, series: ex.series, reps: ex.reps, repos: ex.repos, tempo: ex.tempo, rir: ex.rir, notes: ex.notes || '', superset_groupe: ex.superset_groupe ?? null };
        })
      }))
    }))
  };
  _origClientProgBlocIds = clientProgEnEdition.blocs.map(b=>b.id).filter(Boolean);
  _origClientProgSeanceIds = clientProgEnEdition.blocs.flatMap(b=>b.seances.map(s=>s.id)).filter(Boolean);
  _origClientProgExoIds = clientProgEnEdition.blocs.flatMap(b=>b.seances.flatMap(s=>s.exercices.map(ex=>ex.id))).filter(Boolean);
  state.nav = 'editeur-client-prog';
  renderSidebar();
  renderMain();
}

async function cpSetBlocActif(bi){
  const cp = clientProgEnEdition;

  if (!bloc || !bloc.id) { showToast('Enregistrez le programme d\'abord.', '#f0a500'); return; }
  cp.bloc_actif_id = bloc.id;
  await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${cp.id}`,
    { method:'PATCH', headers:supaHeaders(), body:JSON.stringify({bloc_actif_id: bloc.id}) });

// Volume (nb de séries) par groupe musculaire d'UNE séance — affiché sur la ligne
// du titre dans l'éditeur programme client (demande coach : voir le volume par
// groupe sans ouvrir le panneau "Répartition des séries" global au bloc).
function _cpSeanceVolumeLabel(seance){
  const map = {};
  (seance.exercices||[]).forEach(ex => {
    const g = ex.groupe_musculaire || 'Non défini';
    map[g] = (map[g]||0) + (parseInt(ex.series)||0);
  });
  const sorted = Object.entries(map).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);
  if (!sorted.length) return '';
  return sorted.map(([g,n])=>`${esc(g)} ${n}`).join(' · ');
}
