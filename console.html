function bilanNavGo(delta) {
  if (!_bilanNavList) return;
  const newIdx = _bilanNavIdx + delta;
  if (newIdx < 0 || newIdx >= _bilanNavList.length) return;
  _bilanNavIdx = newIdx;
  openBilanDetailSupabase(_bilanNavList[newIdx]);
}

function _fmtJourMois(d) { return d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' }); }

// Bornes réelles (debut/fin, objets Date) de la semaine d'un bilan, quel que soit son état :
// - validé/envoyé (date_validation connue) → occurrence de jour_bilan la plus PROCHE de cette
//   date (_bilanWeekBoundsNearest, gère un envoi en retard sans décaler d'une semaine entière)
// - encore en cours (pas de date_validation) → projection en avant depuis created_at
//   (_bilanWeekBounds, api.js — même logique que _bilanPeriodeLabel utilisée dans les listes).
// Avant ce fix, un bilan en cours n'avait NI plage de dates NI réordonnancement des jours
// (weekRange retombait sur semaine_label, jours restait dans l'ordre stocké Lundi…Dimanche),
// ce qui donnait l'impression trompeuse d'une semaine lundi→dimanche même quand jour_bilan
// décale la semaine sur un autre jour (ex: Perrine, jour_bilan=Dimanche, semaine dimanche→samedi).
function _bilanDetailBornes(dateValidationIso, createdAtIso, jourBilanNom, envoyeCoach) {
  if (dateValidationIso) return _bilanWeekBoundsNearest(jourBilanNom, new Date(dateValidationIso + 'T12:00:00'), createdAtIso ? new Date(createdAtIso) : null);
  // Le fallback sur created_at ne vaut que pour un bilan encore EN COURS (projection en avant
  // de sa semaine depuis sa création) — un bilan déjà envoyé sans date_validation est un résidu
  // de migration (voir project_architecture_bilans.md) : created_at = date de MIGRATION, pas de
  // validation. Sans ce garde-fou, un vieux bilan migré affiche une plage de dates fabriquée à
  // partir du jour de migration au lieu de "sans date" — incohérent avec le libellé de la liste
  // (_bilanPeriodeLabel a le même garde-fou depuis l'origine).
  if (createdAtIso && !envoyeCoach) return _bilanWeekBounds(jourBilanNom, new Date(createdAtIso));
  return null;
}

// Trie une liste de bilans par vraie semaine (date de FIN de période, la plus récente en
// premier) plutôt que par état envoyé/non-envoyé — un bilan non-envoyé orphelin d'une semaine
// ancienne ne doit jamais passer devant un bilan plus récent juste parce qu'il traîne encore
// sans réponse. Résidu de migration sans aucune borne calculable (envoyé sans date_validation
// ET sans le garde-fou created_at) : repli sur created_at pour rester grossièrement à sa place
// plutôt que de planter le tri.
function _bilanTrierParPeriode(rows, jourBilanNom){
  const finDe = b => {
    const bornes = _bilanDetailBornes(b.date_validation, b.created_at, jourBilanNom, b.envoye_coach);
    if (bornes) return bornes.fin.getTime();
    return b.created_at ? new Date(b.created_at).getTime() : 0;
  };
  return rows.slice().sort((a, b) => finDe(b) - finDe(a));
}

function _weekRange(debut, fin) {
  if (!debut || !fin) return '';
  return `${_fmtJourMois(debut)} → ${_fmtJourMois(fin)}`;
}

// Réordonne jours[] (toujours stocké Lundi(0)…Dimanche(6) en base) selon les vraies dates
// calendaires de la semaine du bilan (debut = objet Date, cf. _bilanDetailBornes), et attache
// la date de chaque jour pour affichage.
function _bilanJoursAvecDates(joursArr, debut) {
  if (!joursArr.length || !debut) return joursArr;
  return Array.from({ length: 7 }, (_, i) => {
    const dt = new Date(debut); dt.setDate(debut.getDate() + i);
    const wIdx = (dt.getDay() + 6) % 7; // Lundi=0…Dimanche=6
    return { ...(joursArr[wIdx] || {}), _dateLabel: _fmtJourMois(dt) };
  });
}

function renderBilansPage(el) {
  const pendingCount = _bilansATraiterListe().length;
  const attenteCount = _bilansEnAttenteListe().length;
  el.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Console coach</div><h1>Bilans</h1></div>
      <div class="meta">${pendingCount > 0 ? `<span style="color:var(--critical);">${pendingCount} à traiter</span>` : 'À jour'}</div>
    </div>
    <div class="fiche-tabs">
      <button class="fiche-tab${bilansTab==='recents'?' active':''}" onclick="setBilansTab('recents')">
        Récents${pendingCount > 0 ? ` <span class="nav-count" style="margin-left:6px;">${pendingCount}</span>` : ''}
      </button>
      <button class="fiche-tab${bilansTab==='attente'?' active':''}" onclick="setBilansTab('attente')">
        En attente${attenteCount > 0 ? ` <span class="nav-count" style="margin-left:6px;">${attenteCount}</span>` : ''}
      </button>
      <button class="fiche-tab${bilansTab==='historique'?' active':''}" onclick="setBilansTab('historique')">Historique</button>
    </div>
    <div id="bilansContent">${_renderBilansTabContent()}</div>`;
}

function _renderBilansTabContent() {
  return bilansTab === 'recents' ? _renderBilansRecents() : bilansTab === 'attente' ? _renderBilansEnAttente() : _renderBilansHistorique();
}

// Badge distinct de "À traiter"/"Traité" pour un bilan qui A ÉTÉ envoyé mais après sa deadline
// (jour_bilan à midi) — ne pas confondre avec le statut "En retard" des clients dans la liste
// Clients, qui lui désigne un bilan jamais envoyé du tout (_supaCalculerRetard).
function _badgeEnvoiRetard(b, jourBilanNom) {
  let enRetard = false;
  try { enRetard = _bilanEnvoiEnRetard(b, jourBilanNom); } catch(e) { console.error('_badgeEnvoiRetard:', e); }
  return enRetard ? `<span class="chip off" style="color:var(--critical);border-color:var(--critical);" title="Envoyé après la deadline (jour de bilan à midi)">⏰ Envoyé en retard</span>` : '';
}

function _renderBilansEnAttente() {
  const list = _bilansEnAttenteListe();
  const nomOf = clientId => { const c = data.clients.find(x=>x.id===clientId); return c ? c.nom : clientId; };
  const dateFrOf = b => _fmtDateHeureBilan(b);
  const rows = list.map(b => `
    <tr style="cursor:pointer;" onclick="openBilanByIdFromRecents(${b.id})">
      <td><div class="cell-name"><div class="mini-avatar">${initials(nomOf(b.client_id))}</div>${esc(nomOf(b.client_id))}</div></td>
      <td style="color:var(--text-faint);font-size:12px;">${esc(_bilanPeriodeLabel(b, (data.clients.find(x=>x.id===b.client_id)||{}).jour_bilan) || b.semaine_label || '')}</td>
      <td class="mono" style="color:var(--text-faint);font-size:12px;">${dateFrOf(b)}</td>
      <td class="row-actions" onclick="event.stopPropagation();"><button class="btn" onclick="toggleBilanEnAttente(${b.id}, false)">↩ Repasser à traiter</button></td>
    </tr>`).join('');
  return `
    <div class="table-card">
      <div class="table-toolbar"><div class="title">En attente d'info ${list.length ? `<span style="color:var(--text-faint);font-size:11px;margin-left:6px;">${list.length}</span>` : ''}</div></div>
      ${list.length ? `<div class="table-scroll"><table class="clients">
        <thead><tr><th>Client</th><th>Semaine</th><th>Envoyé le</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>` : `<div style="padding:20px 24px;color:var(--text-faint);">Aucun bilan en attente.</div>`}
    </div>`;
}

function _renderBilansRecents() {
  const now = Date.now();
  const all = data.bilansAll || [];
  const envoyes = all.filter(b => b.envoye_coach);
  const pending = envoyes.filter(b => !b.coach_traite && !b.en_attente).sort((a,b) => (b.created_at||'').localeCompare(a.created_at||''));
  const recentTraited = envoyes.filter(b => {
    if (!b.coach_traite) return false;
    const iso = b.coach_traite_at || b.date_validation || b.created_at;
    const t = iso ? new Date(iso).getTime() : null;
    return t && (now - t) <= 15*24*60*60*1000;
  }).sort((a,b) => ((b.coach_traite_at||b.date_validation||b.created_at||'')).localeCompare(a.coach_traite_at||a.date_validation||a.created_at||''));

  const nomOf = clientId => { const c = data.clients.find(x=>x.id===clientId); return c ? c.nom : clientId; };
  const jbOf = clientId => { const c = data.clients.find(x=>x.id===clientId); return c ? c.jour_bilan : null; };
  const dateFrOf = b => _fmtDateHeureBilan(b);
  const dateHeureFrOf = iso => iso ? new Date(iso).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
  const rowHtml = (b, showBtn) => `
    <tr style="cursor:pointer;" onclick="openBilanByIdFromRecents(${b.id})">
      <td><div class="cell-name"><div class="mini-avatar">${initials(nomOf(b.client_id))}</div>${esc(nomOf(b.client_id))}</div></td>
      <td style="color:var(--text-faint);font-size:12px;">${esc(b.semaine_label||'')}</td>
      <td class="mono" style="color:var(--text-faint);font-size:12px;">${dateFrOf(b)}</td>
      <td>${b.coach_traite ? `<span class="chip ok"><span class="dot"></span>Traité</span>` : `<span class="chip late"><span class="dot"></span>À traiter</span>`} ${_badgeEnvoiRetard(b, jbOf(b.client_id))}</td>
      <td class="row-actions" onclick="event.stopPropagation();">${showBtn ? `<button class="btn" onclick="marquerBilanSupaTraite(${b.id})">Marquer traité</button>` : ''}</td>
    </tr>`;
  // Pas de colonne "Statut" ici : tout ce qui apparaît dans cette table est par
  // définition déjà traité — la colonne serait toujours identique et n'apporte
  // rien. À la place, "Traité le" reflète l'ordre de tri (plus récent en haut).
  const rowHtmlTraite = b => `
    <tr style="cursor:pointer;" onclick="openBilanByIdFromRecents(${b.id})">
      <td><div class="cell-name"><div class="mini-avatar">${initials(nomOf(b.client_id))}</div>${esc(nomOf(b.client_id))}</div></td>
      <td style="color:var(--text-faint);font-size:12px;">${esc(b.semaine_label||'')} ${_badgeEnvoiRetard(b, jbOf(b.client_id))}</td>
      <td class="mono" style="color:var(--text-faint);font-size:12px;">${dateFrOf(b)}</td>
      <td class="mono" style="color:var(--text-faint);font-size:12px;">${dateHeureFrOf(b.coach_traite_at)}</td>
    </tr>`;

  return `
    ${pending.length ? `
    <div class="table-card" style="margin-bottom:16px;">
      <div class="table-toolbar"><div class="title">À traiter <span style="color:var(--critical);font-size:11px;margin-left:6px;">${pending.length}</span></div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Client</th><th>Semaine</th><th>Envoyé le</th><th>Statut</th><th></th></tr></thead>
        <tbody>${pending.map(b => rowHtml(b, true)).join('')}</tbody>
      </table></div>
    </div>` : `<div class="table-card" style="margin-bottom:16px;padding:20px 24px;"><span style="color:var(--success);">✓ Tous les bilans sont traités.</span></div>`}
    ${recentTraited.length ? `
    <div class="table-card">
      <div class="table-toolbar"><div class="title">Traités · 15 derniers jours</div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Client</th><th>Semaine</th><th>Envoyé le</th><th>Traité le</th></tr></thead>
        <tbody>${recentTraited.map(rowHtmlTraite).join('')}</tbody>
      </table></div>
    </div>` : ''}`;
}

function _renderBilansHistorique() {
  if (!bilansHistoClientId) {
    const all = data.bilansAll || [];
    const clientBilanCount = {}, clientLastDate = {};
    all.forEach(b => {
      clientBilanCount[b.client_id] = (clientBilanCount[b.client_id]||0) + 1;
      const d = b.date_validation || (b.created_at ? b.created_at.slice(0,10) : null);
      if (d && (!clientLastDate[b.client_id] || d > clientLastDate[b.client_id])) clientLastDate[b.client_id] = d;
    });
    const rows = data.clients.map(c => {
      const nb = clientBilanCount[c.id]||0;
      const lastFr = clientLastDate[c.id] ? clientLastDate[c.id].split('-').reverse().join('/') : '';
      return `<tr style="cursor:pointer;" onclick="openBilanHistoClient('${c.id}')">
        <td><div class="cell-name"><div class="mini-avatar">${initials(c.nom)}</div>${esc(c.nom)}</div></td>
        <td style="font-size:12px;">${nb} bilan${nb>1?'s':''}</td>
        <td class="mono" style="color:var(--text-faint);font-size:12px;">${esc(lastFr)}</td>
        <td style="color:var(--text-faint);font-size:18px;text-align:right;padding-right:16px;">›</td>
      </tr>`;
    }).join('');
    return `<div class="table-card">
      <div class="table-toolbar"><div class="title">Tous les clients</div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Client</th><th>Bilans envoyés</th><th>Dernier envoi</th><th></th></tr></thead>
        <tbody>${rows||`<tr><td colspan="4" style="text-align:center;color:var(--text-faint);padding:26px;">Aucun bilan.</td></tr>`}</tbody>
      </table></div>
    </div>`;
  }

  const c = data.clients.find(x => x.id === bilansHistoClientId);
  const nom = c ? c.nom : bilansHistoClientId;
  const backBtn = `<button class="fiche-back" style="margin-bottom:16px;" onclick="bilansHistoClientId=null;bilansHistoData={loaded:false,error:null,bilans:[]};renderMain()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    Retour à la liste
  </button>`;
  if (!bilansHistoData.loaded) return `${backBtn}<div style="display:flex;justify-content:center;padding:40px;"><div class="spin"></div></div>`;
  if (bilansHistoData.error) return `${backBtn}<div style="color:var(--critical);padding:16px;">Erreur : ${esc(bilansHistoData.error)}</div>`;
  if (!bilansHistoData.bilans.length) return `${backBtn}<div class="table-card" style="padding:20px 24px;color:var(--text-faint);">Aucun bilan validé pour ${esc(nom)}.</div>`;

  const _histoLabels = _bilanPeriodeLabelsList(bilansHistoData.bilans, c ? c.jour_bilan : null);
  const rows = bilansHistoData.bilans.map((h, idx) => {
    const dateFr = h.date_validation ? h.date_validation.split('-').reverse().join('/') : '—';
    return `<tr style="cursor:pointer;" onclick="openBilanFromHistorique(${idx})">
      <td class="mono" style="font-size:12px;">${esc(_histoLabels[idx]||dateFr)}</td>
      <td class="mono" style="font-size:12px;color:var(--text-faint);">${_fmtDateHeureBilan(h)}</td>
      <td>${h.coach_traite?`<span class="chip ok"><span class="dot"></span>Traité</span>`:(h.envoye_coach?`<span class="chip late"><span class="dot"></span>À traiter</span>`:`<span class="chip off">Non envoyé</span>`)} ${_badgeEnvoiRetard(h, c ? c.jour_bilan : null)}</td>
      <td style="color:var(--text-faint);font-size:18px;text-align:right;padding-right:16px;">›</td>
    </tr>`;
  }).join('');

  return `${backBtn}
    <div class="fiche-hero" style="margin-bottom:16px;">
      <div class="fiche-avatar">${initials(nom)}</div>
      <div><div class="fiche-hero-name">${esc(nom)}</div>
        <div style="font-size:12px;color:var(--text-faint);">${bilansHistoData.bilans.length} bilan${bilansHistoData.bilans.length>1?'s':''} validés</div>
      </div>
    </div>
    <div class="table-card">
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Semaine</th><th>Validé le</th><th>Statut</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
}

function renderBilanDetailPage(el) {
  const c = data.clients.find(x => x.id === bilanDetailState.client);
  const nom = c ? c.nom : bilanDetailState.client;
  const isFiche = _bilanNavSource === 'fiche';
  // Toujours repasser par allerFicheTab (→ openPanel) plutôt que de juste
  // basculer state.nav/ficheTab à la main : un bilan ouvert depuis le
  // dashboard d'accueil n'a jamais chargé ficheData pour ce client, un simple
  // changement d'onglet afficherait une fiche vide/périmée.
  const backAction = isFiche
    ? `allerFicheTab('${bilanDetailState.client}','bilans')`
    : `state.nav='bilans';renderSidebar();renderMain()`;
  const backLabel = isFiche ? 'Retour à la fiche client' : 'Retour aux bilans';
  const svgBack = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>`;
  const svgFwd  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>`;

  const _navDateLabel = (b) => {
    if (!b) return '';
    const iso = b.date_validation || '';
    const dateFr = iso ? iso.split('-').reverse().join('/') : '';
    return dateFr || b.semaine_label || '';
  };
  const hasPrev = _bilanNavList && _bilanNavIdx < _bilanNavList.length - 1;
  const hasNext = _bilanNavList && _bilanNavIdx > 0;
  const prevBilan = hasPrev ? _bilanNavList[_bilanNavIdx + 1] : null;
  const nextBilan = hasNext ? _bilanNavList[_bilanNavIdx - 1] : null;

  const navHtml = (hasPrev || hasNext) ? `
    <div style="display:flex;gap:8px;margin-bottom:4px;">
      ${hasPrev ? `<button class="btn" onclick="bilanNavGo(1)" style="font-size:12px;padding:5px 10px;">${svgBack} ${_navDateLabel(prevBilan)}</button>` : `<div style="flex:1;"></div>`}
      <div style="flex:1;"></div>
      ${hasNext ? `<button class="btn" onclick="bilanNavGo(-1)" style="font-size:12px;padding:5px 10px;">${_navDateLabel(nextBilan)} ${svgFwd}</button>` : ''}
    </div>` : '';

  const backHtml = `<button class="fiche-back" onclick="${backAction}">${svgBack} ${backLabel}</button>`;

  // Fil de navigation rapide : sauter directement vers un autre onglet de la
  // fiche de ce client (Profil, Mensurations, Diète…) sans repasser par
  // "Retour" puis recliquer l'onglet. Affiché quelle que soit l'origine
  // (dashboard ET page Bilans) — bilanDetailState.client est toujours connu,
  // allerFicheTab (→ openPanel) charge la fiche même si elle n'était pas déjà
  // en mémoire. Avant 2026-08-03 : masqué si ouvert depuis la page Bilans
  // (_bilanNavSource==='bilans'), incohérent avec l'ouverture depuis le
  // dashboard qui l'affichait déjà — corrigé sur demande du coach.
  const quickNavHtml = `
    <div class="fiche-tabs" style="border-bottom:none;padding:0;gap:4px;margin:8px 0 4px;flex-wrap:wrap;">
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','profil')">Profil</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','programmes')">Programmes</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','diete')">Diète</button>
      <button class="fiche-tab active" onclick="allerFicheTab('${bilanDetailState.client}','bilans')">Bilans</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','mensurations')">Mensurations</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','photos')">Photos</button>
      ${c && c.chimieActifSupa ? `<button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','protocole')">Protocole</button>` : ''}
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','roadmap')">Roadmap</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','notes')">Suivi</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','progression')">Progression</button>
    </div>`;

  if (!bilanDetailState.loaded) {
    el.innerHTML = `${backHtml}${quickNavHtml}
      <div class="fiche-hero"><div class="fiche-avatar">${initials(nom)}</div>
        <div><div class="fiche-hero-name">${esc(nom)}</div><div style="font-size:12px;color:var(--text-faint);">Chargement…</div></div>
      </div>
      <div style="display:flex;justify-content:center;padding:60px;"><div class="spin"></div></div>`;
    return;
  }
  if (bilanDetailState.error) {
    el.innerHTML = `${backHtml}${quickNavHtml}<div style="color:var(--critical);padding:24px;">Erreur : ${esc(bilanDetailState.error)}</div>`;
    return;
  }

  // Toute la construction du détail est protégée : si quoi que ce soit lève ici (donnée
  // inattendue sur un vieux bilan/orphelin), on affiche un message d'erreur récupérable plutôt
  // que de laisser el.innerHTML intact (symptôme vécu : clic sans effet visible, state.nav déjà
  // basculé sur 'bilan-detail' en coulisses, page qui semble "figée" jusqu'au rechargement).
  try {
  const d = bilanDetailState.data || {};
  const repas = d.repas || [];
  const dateValidation = d.dateValidation || '';
  const semaineLabel = d.semaineLabel || '';
  // Bornes réelles de la semaine (debut/fin), valables aussi bien pour un bilan déjà validé
  // que pour un bilan encore en cours (pas de date_validation) — voir _bilanDetailBornes.
  const bornes = _bilanDetailBornes(bilanDetailState.dateIso, d.createdAt, c ? c.jour_bilan : null, d.envoyeCoach);
  const weekRange = (bornes ? _weekRange(bornes.debut, bornes.fin) : '') || semaineLabel;
  // d.jours est toujours stocké Lundi(0)…Dimanche(6) — mais la semaine du bilan se termine
  // le jour_bilan du client, pas forcément dimanche. Sans ça, le tableau affichait toujours
  // "Lundi…Dimanche" alors que l'entête montrait la vraie plage de dates (ex: jeudi→mercredi),
  // ce qui semblait incohérent. On réordonne selon les vraies dates calendaires de la semaine
  // et on attache la date de chaque jour pour affichage.
  const jours = _bilanJoursAvecDates(d.jours || [], bornes ? bornes.debut : null);

  const poidsVals = jours.map(j=>parseFloat(j.poids)).filter(v=>!isNaN(v)&&v>0);
  const avgPoids = poidsVals.length ? (poidsVals.reduce((a,b)=>a+b,0)/poidsVals.length).toFixed(1) : null;
  const eauVals = jours.map(j=>parseFloat(j.eau)).filter(v=>!isNaN(v)&&v>0);
  const avgEau = eauVals.length ? (eauVals.reduce((a,b)=>a+b,0)/eauVals.length).toFixed(1) : null;
  // Moyenne (pas total) — cohérent avec l'objectif steps_cible qui est un pas/JOUR, et avec
  // "Moyenne steps/jour" déjà affiché côté client (bilan.js) : ne compte que les jours où le
  // client a réellement saisi des pas, pas /7 (sinon une semaine mal remplie fausse la moyenne).
  const stepsVals = jours.map(j=>parseInt(j.steps)).filter(v=>!isNaN(v)&&v>0);
  const avgSteps = stepsVals.length ? Math.round(stepsVals.reduce((a,b)=>a+b,0)/stepsVals.length) : 0;
  const joursOkDiete = jours.filter(j=>j.diete).length;
  const joursOkTraining = jours.filter(j=>j.training).length;
  const joursOkCardio = jours.filter(j=>j.cardio).length;
  const repasAvgAdh = repas.length ? Math.round(repas.reduce((s,r)=>s+(r.adhesion||0),0)/repas.length) : null;
  const repasAvgDig = repas.length ? Math.round(repas.reduce((s,r)=>s+(r.digestion||0),0)/repas.length) : null;
  const repasAvgApp = repas.length ? Math.round(repas.reduce((s,r)=>s+(r.appetit||0),0)/repas.length) : null;

  const statCard = (label, val, unit='') => `
    <div class="table-card" style="flex:1;min-width:110px;padding:12px 16px;">
      <div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">${label}</div>
      <div style="font-size:20px;font-weight:700;color:var(--accent);">${val!==null?val+unit:'<span style="color:var(--text-faint);">—</span>'}</div>
    </div>`;
  const tick = v => v ? `<span style="color:var(--success);">✓</span>` : `<span style="color:var(--text-faint);">—</span>`;
  const score = v => { const n=parseInt(v)||0; const col=n>=4?'var(--success)':n>=2?'var(--accent)':'var(--critical)'; return `<span style="font-weight:600;color:${col};">${n}/5</span>`; };

  el.innerHTML = `
    ${backHtml}
    ${quickNavHtml}
    ${navHtml}
    <div class="fiche-hero">
      <div class="fiche-avatar">${initials(nom)}</div>
      <div style="flex:1;min-width:0;">
        <div class="fiche-hero-name">${esc(nom)}</div>
        <div class="fiche-hero-meta">
          <span class="chip off">${weekRange || _semaineFromDate(dateValidation)}</span>
          ${bilanDetailState.coachTraite?`<span class="chip ok"><span class="dot"></span>Traité</span>`:bilanDetailState.enAttente?`<span class="chip off"><span class="dot"></span>En attente</span>`:`<span class="chip late"><span class="dot"></span>À traiter</span>`}
          ${_badgeEnvoiRetard({ envoye_coach: d.envoyeCoach, created_at: d.createdAt, envoye_at: d.envoyeAt, date_validation: bilanDetailState.dateIso }, c ? c.jour_bilan : null)}
          ${bilanDetailState.objectifs && (bilanDetailState.objectifs.steps_cible || bilanDetailState.objectifs.seances_cible) ? `<span class="chip off" title="Objectifs assignés par le coach">🎯 ${[
            bilanDetailState.objectifs.steps_cible ? bilanDetailState.objectifs.steps_cible.toLocaleString('fr-FR')+' pas/j' : null,
            bilanDetailState.objectifs.seances_cible ? bilanDetailState.objectifs.seances_cible+' séances/sem' : null,
          ].filter(Boolean).join(' · ')}</span>` : ''}
        </div>
        ${dateValidation?`<div style="font-size:11px;color:var(--text-faint);margin-top:4px;">Validé le ${esc(_fmtDateHeureBilan({ envoye_at: d.envoyeAt, date_validation: bilanDetailState.dateIso }))}</div>`:''}
        ${bilanDetailState.ts?`<div style="font-size:11px;color:var(--text-faint);">Envoyé le ${esc(bilanDetailState.ts)}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">
        ${bilanDetailState._supabaseBilanId ? (bilanDetailState.coachTraite
          ? `<button class="btn" onclick="marquerNonTraite()">↩ Repasser à traiter</button>`
          : `<button class="btn primary" onclick="marquerTraite()">✓ Marquer comme traité</button>`) : ''}
        ${bilanDetailState._supabaseBilanId && !bilanDetailState.coachTraite ? (bilanDetailState.enAttente
          ? `<button class="btn" onclick="toggleBilanEnAttente(${bilanDetailState._supabaseBilanId}, false)">↩ Sortir de l'attente</button>`
          : `<button class="btn" onclick="toggleBilanEnAttente(${bilanDetailState._supabaseBilanId}, true)">⏸ Mettre en attente</button>`) : ''}
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">
      ${statCard('Poids moy.', avgPoids, ' kg')}
      ${statCard('Eau moy.', avgEau, ' L')}
      ${statCard('Diète OK', joursOkDiete, '/7j')}
      ${statCard('Training', joursOkTraining, '/7j')}
      ${statCard('Cardio', joursOkCardio, '/7j')}
      ${avgSteps>0?statCard('Pas moy./j',avgSteps.toLocaleString('fr-FR'),''):''}
    </div>

    ${d.xpCredite > 0 ? (() => {
      const lignes = _lignesDetailXp(d.xpDetail);
      return `<div class="table-card" style="margin-bottom:16px;">
        <div class="table-toolbar"><div class="title">XP gagné — ${d.xpCredite}</div></div>
        ${lignes.length ? `<div style="padding:6px 20px 14px;display:flex;flex-direction:column;gap:2px;">
          ${lignes.map(([label,val]) => `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;"><span style="color:var(--text-muted);">${label}</span><span style="font-weight:700;color:var(--success);">+${val}</span></div>`).join('')}
        </div>` : `<div style="padding:10px 20px 14px;font-size:11.5px;color:var(--text-faint);">Détail non disponible (bilan crédité avant l'ajout de ce suivi).</div>`}
        ${d.xpDetail && d.xpDetail.ponctuel === false ? `<div style="padding:0 20px 14px;font-size:11.5px;color:var(--warning);">⏰ Envoyé après la deadline — bonus ponctualité et série non obtenus cette semaine-là.</div>` : ''}
      </div>`;
    })() : ''}

    <div class="table-card" style="margin-bottom:16px;">
      <div class="table-toolbar"><div class="title">Suivi journalier</div></div>
      <div class="table-scroll"><table class="alim-table" style="width:100%;">
        <thead><tr><th>Jour</th><th>Poids</th><th>Eau</th><th>Diète</th><th>Steps</th><th>Training</th><th>Cardio</th></tr></thead>
        <tbody>
          ${jours.map(j=>`<tr>
            <td style="font-weight:600;font-size:12px;">${j._dateLabel?`<span style="color:var(--text-faint);font-weight:400;margin-right:5px;">${esc(j._dateLabel)}</span>`:''}${esc(j.nom||'')}${j.commentaire?`<div style="font-size:10.5px;color:var(--text-muted);white-space:normal;margin-top:2px;font-style:italic;">💬 ${esc(j.commentaire)}</div>`:''}</td>
            <td style="font-size:12px;">${j.poids!==''&&j.poids!=null?j.poids+' kg':'—'}</td>
            <td style="font-size:12px;">${j.eau!==''&&j.eau!=null?j.eau+' L':'—'}</td>
            <td>${tick(j.diete)}</td>
            <td style="font-size:12px;">${j.steps!==''&&j.steps!=null?(parseInt(j.steps)||0).toLocaleString('fr-FR'):'—'}</td>
            <td>${tick(j.training)}</td>
            <td>${tick(j.cardio)}</td>
          </tr>`).join('')||`<tr><td colspan="7" style="text-align:center;color:var(--text-faint);padding:16px;">Aucune donnée.</td></tr>`}
          ${(poidsVals.length>1||stepsVals.length>1||eauVals.length>1)?`<tr style="background:var(--surface-2);font-style:italic;">
            <td style="font-size:11px;color:var(--text-faint);">Moyenne</td>
            <td style="font-size:12px;">${avgPoids!=null?avgPoids+' kg':'—'}</td>
            <td style="font-size:12px;">${avgEau?avgEau+' L':'—'}</td>
            <td style="font-size:12px;">${joursOkDiete}/7</td>
            <td style="font-size:12px;">${avgSteps>0?avgSteps.toLocaleString('fr-FR')+' moy.':'—'}</td>
            <td style="font-size:12px;">${joursOkTraining}/7</td>
            <td style="font-size:12px;">${joursOkCardio}/7</td>
          </tr>`:''}
        </tbody>
      </table></div>
    </div>

    ${repas.length?`<div class="table-card" style="margin-bottom:16px;">
      <div class="table-toolbar"><div class="title">Nutrition · Évaluations repas</div></div>
      <div class="table-scroll"><table class="alim-table" style="width:100%;">
        <thead><tr><th>Repas</th><th>Adhésion</th><th>Digestion</th><th>Appétit</th></tr></thead>
        <tbody>
          ${repas.map(r=>`<tr>
            <td style="font-weight:600;font-size:12px;">Repas ${r.num}</td>
            <td>${score(r.adhesion)}</td><td>${score(r.digestion)}</td><td>${score(r.appetit)}</td>
          </tr>`).join('')}
          ${repasAvgAdh!==null?`<tr style="background:var(--surface-2);font-style:italic;">
            <td style="font-size:11px;color:var(--text-faint);">Moyenne</td>
            <td>${score(repasAvgAdh)}</td><td>${score(repasAvgDig)}</td><td>${score(repasAvgApp)}</td>
          </tr>`:''}
        </tbody>
      </table></div>
    </div>`:''}

    ${(d.fatigueGenerale||d.qualiteSommeil)?`<div class="table-card" style="margin-bottom:16px;">
      <div class="table-toolbar"><div class="title">Ressenti</div></div>
      <div style="padding:0 20px 16px;display:flex;gap:24px;flex-wrap:wrap;">
        ${d.fatigueGenerale?`<div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Fatigue générale</div>${score(d.fatigueGenerale)}</div>`:''}
        ${d.qualiteSommeil?`<div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Qualité du sommeil</div>${score(d.qualiteSommeil)}</div>`:''}
      </div>
    </div>`:''}

    ${(d.commentaireAlim||d.commentaireJour||d.commentaireActivite||d.commentaireFatigue||d.commentaireSommeil)?`<div class="table-card">
      <div class="table-toolbar"><div class="title">Commentaires client</div></div>
      <div style="padding:0 20px 16px;display:flex;flex-direction:column;gap:12px;">
        ${d.commentaireAlim?`<div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Nutrition</div><div style="font-size:13px;white-space:pre-wrap;">${esc(d.commentaireAlim)}</div></div>`:''}
        ${d.commentaireJour?`<div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Journée</div><div style="font-size:13px;white-space:pre-wrap;">${esc(d.commentaireJour)}</div></div>`:''}
        ${d.commentaireActivite?`<div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Activité</div><div style="font-size:13px;white-space:pre-wrap;">${esc(d.commentaireActivite)}</div></div>`:''}
        ${d.commentaireFatigue?`<div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Fatigue</div><div style="font-size:13px;white-space:pre-wrap;">${esc(d.commentaireFatigue)}</div></div>`:''}
        ${d.commentaireSommeil?`<div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Sommeil</div><div style="font-size:13px;white-space:pre-wrap;">${esc(d.commentaireSommeil)}</div></div>`:''}
      </div>
    </div>`:''}

    ${bilanDetailState._supabaseBilanId && bornes ? (() => { try {
      if (bilanDetailState.mensurations === null) return `<div class="table-card" style="margin-bottom:16px;"><div class="table-toolbar"><div class="title">Mensurations</div></div><div style="padding:14px 20px;color:var(--text-faint);font-size:12px;">Chargement…</div></div>`;
      // Semaine du bilan + 4 semaines précédentes (comparaison directe demandée par le coach) —
      // bornes de la fenêtre étendue calculées à partir de bornes.debut, jamais date_validation
      // brute (cohérent avec le reste du fichier, cf. _bilanDetailBornes).
      const finGrace = _bilanBornesAvecGraceMens(bornes).fin;
      const debutEtendu = new Date(bornes.debut); debutEtendu.setDate(debutEtendu.getDate() - 4*7);
      const mens = _mensurationsDansPeriode({ debut: debutEtendu, fin: finGrace }, bilanDetailState.mensurations || []).reverse(); // plus récent en premier
      if (!mens.length) return '';
      const cm = v => v!=null ? v+' cm' : '—', kg = v => v!=null ? v+' kg' : '—';
      const dansSemaine = m => { const t = new Date(m.date+'T12:00:00').getTime(); return t >= bornes.debut.getTime() && t <= finGrace.getTime(); };
      return `<div class="table-card" style="margin-bottom:16px;">
        <div class="table-toolbar"><div class="title">Mensurations — semaine du bilan (${_weekRange(bornes.debut, bornes.fin)}) + 4 précédentes</div></div>
        <div class="table-scroll"><table class="alim-table" style="width:100%;">
          <thead><tr><th>Date</th><th>Poids</th><th>Tour taille</th><th>Fessiers</th><th>Cuisses</th><th>Mollets</th><th>Poitrine</th><th>Épaules</th><th>Bras</th></tr></thead>
          <tbody>${mens.map(m => `<tr style="${dansSemaine(m) ? 'background:var(--surface-2);font-weight:600;' : ''}">
            <td class="mono" style="${dansSemaine(m) ? 'color:#1D9E75;' : ''}">${esc((m.date||'').split('-').reverse().join('/'))}</td>
            <td>${kg(m.poids)}</td><td>${cm(m.mesure)}</td><td>${cm(m.fessiers)}</td><td>${cm(m.cuisses)}</td>
            <td>${cm(m.mollets)}</td><td>${cm(m.poitrine)}</td><td>${cm(m.epaules)}</td><td>${cm(m.bras)}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>`;
    } catch(e) { console.error('Erreur rendu mensurations bilan-detail:', e); return ''; } })() : ''}

    ${bilanDetailState._supabaseBilanId ? (() => { try {
      const mProche = _mensurationLaPlusProche(bilanDetailState.dateIso, bilanDetailState.mensurations);
      // Photos prises depuis une mensuration mais tombant dans la semaine de CE bilan (bornes,
      // calculées plus haut) — remontées ici en plus des photos propres au bilan, avec un badge
      // pour distinguer la source (pas de suppression possible d'ici, ça se gère depuis Mensurations).
      const finGrace = bornes ? _bilanBornesAvecGraceMens(bornes).fin : null;
      const mensPhotosSemaine = (bornes && bilanDetailState.mensPhotos) ? bilanDetailState.mensPhotos.filter(p => {
        const d = p.mensurations && p.mensurations.date;
        if (!d) return false;
        const t = new Date(d+'T12:00:00').getTime();
        return t >= bornes.debut.getTime() && t <= finGrace.getTime();
      }).map(p => ({ ...p, _source:'mensuration', _date: p.mensurations.date })) : [];
      const bilanPhotosArr = (bilanDetailState.photos||[]).map(p => ({ ...p, _source:'bilan' }));
      const allPhotos = [...bilanPhotosArr, ...mensPhotosSemaine];
      // Exposée sur bilanDetailState (global) car l'onclick ci-dessous est évalué dans le
      // scope global — une const locale à cette IIFE lui serait invisible (ReferenceError
      // silencieuse au clic, la lightbox ne s'ouvrait jamais).
      bilanDetailState._photosLightbox = allPhotos;
      return `<div class="table-card" style="margin-bottom:16px;">
        <div class="table-toolbar">
          <div class="title">Photos</div>
          <label class="btn" style="font-size:11px;padding:5px 10px;cursor:pointer;">
            ${_bilanDetailPhotosUploading?'Envoi…':'+ Ajouter'}
            <input type="file" accept="image/*" multiple style="display:none;" ${_bilanDetailPhotosUploading?'disabled':''} onchange="onBilanDetailPhotosSelected(event)">
          </label>
        </div>
        <div style="padding:14px 20px;">
          ${bilanDetailState.photos === null ? `<div style="color:var(--text-faint);font-size:12px;">Chargement…</div>`
            : allPhotos.length === 0 ? `<div style="color:var(--text-faint);font-size:12px;">Aucune photo.</div>`
            : `<div style="display:flex;flex-wrap:wrap;gap:14px;">
                ${allPhotos.map((p, idx) => `
                  <div style="width:100px;">
                    <div style="position:relative;width:100px;aspect-ratio:9/16;">
                      <img src="${esc(p.url)}" style="width:100%;height:100%;object-fit:cover;border-radius:var(--radius-sm);cursor:pointer;" onclick="ouvrirPhotoLightbox(bilanDetailState._photosLightbox,${idx})">
                      ${p._source==='mensuration'
                        ? `<span style="position:absolute;top:2px;left:2px;background:rgba(0,0,0,.65);color:#fff;font-size:8.5px;padding:2px 5px;border-radius:999px;">📏 ${esc((p._date||'').split('-').reverse().join('/'))}</span>`
                        : `<button class="icon-btn del" style="position:absolute;top:2px;right:2px;width:20px;height:20px;background:rgba(0,0,0,.6);" onclick="supprimerBilanDetailPhoto(${p.id},'${esc(p.url)}')" title="Supprimer">${iTrash()}</button>`}
                    </div>
                    ${_renderMensurationSousPhoto(mProche)}
                  </div>`).join('')}
              </div>`}
        </div>
      </div>`;
    } catch(e) { console.error('Erreur rendu photos bilan-detail:', e); return ''; } })() : ''}`;
  } catch(e) {
    console.error('Erreur rendu détail bilan:', e);
    el.innerHTML = `${backHtml}${quickNavHtml}<div style="color:var(--critical);padding:24px;">Erreur d'affichage de ce bilan : ${esc(e.message)}<br><small>Détails dans la console navigateur (F12).</small></div>`;

async function executerImportSheets(coach, communaute){
  document.getElementById('btnLancerImport').disabled = true;
  const prog = document.getElementById('importSheetsProgress');
  const bar  = document.getElementById('importSheetsBar');
  const msg  = document.getElementById('importSheetsMsg');
  const errEl= document.getElementById('importSheetsErr');
  prog.style.display = 'block';

  // a.kcal/prot/glu/lip proviennent du Sheet import, nativement "pour 100g" —
  // stockage direct désormais (plus de division, colonnes _par_100g).
  const tous = [
    ...coach.map(a => ({
      nom: a.nom,
      categorie: null,
      kcal_par_100g: a.kcal||0,
      prot_par_100g: a.prot||0,
      glu_par_100g:  a.glu ||0,
      lip_par_100g:  a.lip ||0,
    })),
    ...communaute.map(a => ({
      nom: a.nom,
      categorie: null,
      kcal_par_100g: a.kcal||0,
      prot_par_100g: a.prot||0,
      glu_par_100g:  a.glu ||0,
      lip_par_100g:  a.lip ||0,
    })),
  ];

  const BATCH = 50;
  let importes = 0;
  let erreurs = 0;

  for (let i = 0; i < tous.length; i += BATCH) {
    const chunk = tous.slice(i, i + BATCH);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/aliments_coach`, {
        method: 'POST',
        headers: supaHeaders({ Prefer: 'return=minimal,resolution=ignore-duplicates' }),
        body: JSON.stringify(chunk),
      });
      if (!res.ok && res.status !== 409) throw new Error('supabase_' + res.status);
      importes += chunk.length;
    } catch(e) {
      erreurs += chunk.length;
    }
    const pct = Math.round(((i + chunk.length) / tous.length) * 100);
    bar.style.width = pct + '%';
    msg.textContent = `${Math.min(i + BATCH, tous.length)} / ${tous.length} traités…`;
  }

  bar.style.width = '100%';
  msg.textContent = `Import terminé : ${importes} ajoutés${erreurs ? `, ${erreurs} erreurs` : ''}.`;

  if (erreurs) { errEl.textContent = `${erreurs} aliments n'ont pas pu être insérés.`; errEl.style.display='block'; }

  // Recharger la base locale
  alimentsCoachData = null;
  alimentsCoachErr = null;
  try { alimentsCoachData = await chargerAlimentsCoach(); } catch(e) { alimentsCoachErr = e.message; }

  document.getElementById('btnLancerImport').textContent = 'Fermer';
  document.getElementById('btnLancerImport').onclick = () => { document.getElementById('modal-import-sheets').remove(); renderBaseSub(); };
  document.getElementById('btnLancerImport').disabled = false;
}

async function _confirmerImportOFF(idx){
  const r = alimOffResults[idx];
  const nom = document.getElementById('offNom').value.trim();
  const categorie = document.getElementById('offCat').value || null;
  const errEl = document.getElementById('offErr');
  if (!nom){ errEl.textContent='Nom obligatoire.'; errEl.style.display='block'; return; }
  try {
    // r.kcal/prot/glu/lip sont "par gramme" en interne (cf. affichage ×100
    // juste au-dessus) — reconverti en "pour 100g" pour le stockage.
    const res = await fetch(`${SUPABASE_URL}/rest/v1/aliments_coach`, {
      method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
      body:JSON.stringify({ nom, categorie, kcal_par_100g:(r.kcal||0)*100, prot_par_100g:(r.prot||0)*100, glu_par_100g:(r.glu||0)*100, lip_par_100g:(r.lip||0)*100 })

    if (!res.ok) throw new Error('supabase_' + res.status);
    const saved = (await res.json())[0];
    alimentsCoachData = alimentsCoachData ? [...alimentsCoachData, saved].sort((a,b)=>a.nom.localeCompare(b.nom,'fr')) : [saved];
    document.getElementById('modal-import-off').remove();
    alert(`"${nom}" ajouté à ta base coach !`);
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

async function sauvegarderAlimentCoach(id){
  const nom = document.getElementById('afNom').value.trim();
  const errEl = document.getElementById('afErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  const categorie = document.getElementById('afCat').value || null;
  const unite = document.getElementById('afUnite').value || 'g';
  // Colonnes "pour 100g" désormais — saisie déjà dans cette unité (grammes)
  // ou par portion, stockage direct sans conversion.
  const kcal = parseFloat(document.getElementById('afKcal').value)||0;
  const prot = parseFloat(document.getElementById('afProt').value)||0;
  const glu  = parseFloat(document.getElementById('afGlu').value)||0;
  const lip  = parseFloat(document.getElementById('afLip').value)||0;
  const payload = { nom, categorie, unite, kcal_par_100g:kcal, prot_par_100g:prot, glu_par_100g:glu, lip_par_100g:lip };
  try {
    const method = id ? 'PATCH' : 'POST';
    const url = id ? `${SUPABASE_URL}/rest/v1/aliments_coach?id=eq.${id}` : `${SUPABASE_URL}/rest/v1/aliments_coach`;
    const res = await fetch(url, { method, headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(payload) });
    if (!res.ok) throw new Error('supabase_' + res.status);
    const saved = (await res.json())[0];
    if (id) {
      alimentsCoachData = alimentsCoachData.map(a => a.id===id ? saved : a);
    } else {
      alimentsCoachData = [...alimentsCoachData, saved].sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
    }
    document.getElementById('modal-alim-form').remove();
    renderBaseSub();
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

async function supprimerAlimentCoach(id){

async function rechercherOpenFoodFacts(query){
  const params = new URLSearchParams({
    search_terms: query,
    action: 'process',
    json: '1',
    page_size: '30',
    sort_by: 'unique_scans_n',
    fields: 'product_name,nutriments',
    lc: 'fr',
  });
  const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?${params}`);
  if (!res.ok) throw new Error('OFF ' + res.status);
  const json = await res.json();
  const seen = new Set();
  return (json.products||[])
    .map(p => {
      const nom = (p.product_name||'').trim();
      const kcal = (p.nutriments?.['energy-kcal_100g'] ?? p.nutriments?.['energy-kcal_serving'] ?? null);
      const prot = (p.nutriments?.proteins_100g ?? null);
      const glu  = (p.nutriments?.carbohydrates_100g ?? null);
      const lip  = (p.nutriments?.fat_100g ?? null);
      // Valeurs gardées telles quelles (nativement "pour 100g" chez Open Food
      // Facts) — plus de division, cohérent avec le stockage _par_100g.
      return { nom, kcal, prot, glu, lip };
    })
    .filter(p => {
      if (!p.nom || p.nom.length < 2) return false;       // pas de nom
      if (p.kcal == null && p.prot == null) return false;  // pas de macros du tout
      const key = p.nom.toLowerCase();
      if (seen.has(key)) return false;                     // dédoublonnage
      seen.add(key);
      return true;
    })
    .slice(0, 20);
}

// Réplique les fonctions de création de cycle/molécules de la feuille Google
// Sheets "Protocol" (genererProtocole/genererPlanning) — même logique de
// calcul (_protocoleCalculer, api.js), partagée avec le rendu côté client
// (protocole.js).
let protocoleEnEdition = null; // { id, client_id, clientNom, date_debut, duree_semaines, objectif, molecules:[...] }
let _protocolePreview  = null; // résultat de _protocoleCalculer après génération/enregistrement

async function ouvrirEditeurProtocole(clientId, clientNom, navBack){
  // protocoleEnEdition doit être assigné AVANT setNav : setNav déclenche renderMain()
  // synchronement, et renderEditeurProtocolePage rebondit vers 'protocole' si l'état
  // est encore vide (garde anti-crash) — l'inverser cassait l'ouverture de l'éditeur.
  _protocoleNavBack = navBack || 'protocole';
  protocoleEnEdition = { id: null, client_id: clientId, clientNom: clientNom || clientId, date_debut: new Date().toISOString().slice(0,10), duree_semaines: 12, objectif: '', molecules: [] };
  _protocolePreview = null;
  setNav('editeur-protocole');
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/client_protocoles?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc&limit=1&select=*,client_protocole_molecules(*)`,
      { headers: supaHeaders() }
    );
    const arr = res.ok ? await res.json() : [];
    if (arr.length > 0) {
      const row = arr[0];
      protocoleEnEdition = {
        id: row.id, client_id: clientId, clientNom: clientNom || clientId,
        date_debut: row.date_debut, duree_semaines: row.duree_semaines, objectif: row.objectif || '',
        molecules: (row.client_protocole_molecules || []).slice().sort((a,b)=>(a.ordre||0)-(b.ordre||0)),
      };
      _protocolePreview = _protocoleCalculer(row, protocoleEnEdition.molecules);
    }
  } catch(e) {}
  renderMain();
}

async function sauvegarderProtocole(){
  const p = protocoleEnEdition;
  if (!p.date_debut || !p.duree_semaines) { alert('Date de début et durée du cycle requises.'); return; }
  if (p.molecules.some(m => !(m.nom||'').trim())) { alert('Chaque molécule doit avoir un nom.'); return; }
  try {
    const body = { client_id: p.client_id, date_debut: p.date_debut, duree_semaines: parseInt(p.duree_semaines)||12, objectif: p.objectif || null };
    let protocoleId = p.id;
    if (protocoleId) {
      await fetch(`${SUPABASE_URL}/rest/v1/client_protocoles?id=eq.${protocoleId}`, { method:'PATCH', headers: supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify(body) });
    } else {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_protocoles`, { method:'POST', headers: supaHeaders({ Prefer:'return=representation' }), body: JSON.stringify(body) });
      const arr = await res.json();
      protocoleId = arr[0].id;
      p.id = protocoleId;
    }

    // Delete-all puis recreate (même pattern que sauvegarderDieteTemplate) —
    // plus simple qu'un diff ligne par ligne pour une poignée de molécules.
    await fetch(`${SUPABASE_URL}/rest/v1/client_protocole_molecules?protocole_id=eq.${protocoleId}`, { method:'DELETE', headers: supaHeaders() });
    const dureeSemaines = parseInt(p.duree_semaines) || 12;
    const molsBody = p.molecules.map((m,i) => ({
      protocole_id: protocoleId, nom: m.nom.trim(), categorie: m.categorie, unite: m.unite || null,
      par_jour_semaine: m.par_jour_semaine,
      dosage_produit: m.dosage_produit !== '' && m.dosage_produit != null ? Number(m.dosage_produit) : null,
      dosage_prise: m.dosage_prise !== '' && m.dosage_prise != null ? Number(m.dosage_prise) : null,
      semaine_debut: m.categorie === 'GH' ? 1 : (parseInt(m.semaine_debut) || 1),
      semaine_fin: m.categorie === 'GH' ? dureeSemaines : (parseInt(m.semaine_fin) || parseInt(m.semaine_debut) || 1),
      intervalle: m.intervalle !== '' && m.intervalle != null ? Number(m.intervalle) : 1,
      ordre: i,
    }));
    if (molsBody.length > 0) {
      await fetch(`${SUPABASE_URL}/rest/v1/client_protocole_molecules`, { method:'POST', headers: supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify(molsBody) });
    }

    _protocolePreview = _protocoleCalculer(body, molsBody);
    _ficheProtocole = undefined; // force rechargement de l'onglet fiche client au retour
    renderMain();
  } catch(e) { alert('Erreur : ' + e.message); }
}

// Dernier jour du cycle = date début + (durée en semaines × 7 − 1) jours,
// même convention que la feuille Google Sheets (C8 "Date de fin du cycle").
function _protocoleDateFinFmt(dateDebut, dureeSemaines){
  if (!dateDebut || !dureeSemaines) return '—';
  const [y, m, j] = dateDebut.split('-').map(Number);
  if (!y || !m || !j) return '—';
  const d = new Date(y, m - 1, j); // évite le décalage de fuseau horaire d'un new Date("YYYY-MM-DD")
  d.setDate(d.getDate() + (parseInt(dureeSemaines) * 7 - 1));
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

// Signature de contenu d'un ensemble de séances (mêmes exercices, même ordre, mêmes séries —
// règle de dédoublonnage/comparaison choisie par le coach). Prend une forme normalisée
// [{ exercices: [{ nom, series }] }] — le nom du repas/séance n'entre PAS dans la signature
// (deux séances au contenu identique mais renommées restent "identiques"). Réutilisée pour :
// dédoublonner le recensement (_recensementMetaItems), et détecter si le programme d'un client
// a divergé de son template d'origine (_progDivergeDuTemplate).
function _progContentSignature(seances){
  return (seances||[]).map(s => (s.exercices||[]).map(ex => (ex.nom||'').trim().toLowerCase()+':'+(parseInt(ex.series)||0)).join(',')).join('||');
}

async function chargerTemplates(){
  // Compte imbriqué léger (ids seulement) pour afficher séances/exercices sur les cartes sans requête séparée.
  const res = await fetch(`${SUPABASE_URL}/rest/v1/programme_templates?order=nom.asc&select=*,programme_blocs(id,programme_seances(id,programme_seance_exercices(id)))`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
// Recensement des blocs MÉTABOLIQUE de TOUS les programmes de TOUS les clients (actifs ET
// inactifs — demande coach 2026-08-10), en une seule requête imbriquée plutôt qu'une boucle par
// client. exercice_id peut être null sur des exercices migrés depuis GAS (pas de fallback par
// nom possible côté PostgREST) — le fallback par nom est fait en JS ensuite, même pattern que
// ouvrirEditeurProgrammeClient (ex.groupe_musculaire n'existe pas directement sur
// client_programme_exercices, il faut toujours repasser par exercicesData).
async function chargerRecensementMeta(){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/client_programme_blocs?type=eq.metabolique` +
    // FK explicite requise : 2 relations existent entre ces 2 tables (bloc_actif_id ET
    // client_programme_id) — PostgREST refuse sinon avec PGRST201 "ambiguous embedding".
    `&select=id,client_programme_id,nombre_semaines,client_programmes!client_programme_blocs_client_programme_id_fkey(id,nom,actif,client_id),` +
    `client_programme_seances(id,titre,ordre,client_programme_exercices(id,exercice_id,nom,series,reps,repos,tempo,rir,notes,ordre))` +
    `&client_programme_seances.order=ordre.asc&client_programme_seances.client_programme_exercices.order=ordre.asc`,
    { headers: supaHeaders() }
  );
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}

// Charge le contenu de tous les templates déjà créés en catégorie "Métabolique" et renvoie
// l'ensemble de leurs signatures — permet au recensement de savoir QUELS programmes uniques ont
// déjà un template, de façon PERSISTANTE (contrairement à _recensementMetaCrees qui ne couvre que
// les clics faits dans la session en cours) : sans ça, recharger la page faisait réapparaître
// "+ Créer ce template" sur des programmes déjà générés, risque de doublons en base.
async function chargerRecensementMetaTemplatesSignatures(){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/programme_templates?categorie=eq.${encodeURIComponent('Métabolique')}` +
    `&select=id,programme_blocs(id,programme_seances(id,programme_seance_exercices(id,exercice_id,series)))`,
    { headers: supaHeaders() }
  );
  if (!res.ok) throw new Error('supabase_' + res.status);
  const templates = await res.json();
  const set = new Set();
  templates.forEach(t => set.add(_progSignatureFromTemplateBlocs(t.programme_blocs)));
  return set;
}

// Retrouve l'exercice de la bibliothèque coach correspondant à un exercice de programme client —
// par exercice_id si présent, sinon par nom (exercices migrés depuis GAS, exercice_id null,
// même pattern que ouvrirEditeurProgrammeClient). Renvoie null si introuvable (l'exercice sera
// alors ignoré à la génération du template, programme_seance_exercices exige un exercice_id valide).
function _resoudreExerciceBiblio(ex){
  return (exercicesData || []).find(e => e.id === ex.exercice_id) ||
         (exercicesData || []).find(e => e.nom && e.nom.toLowerCase() === (ex.nom || '').toLowerCase()) || null;
}

// Transforme les lignes brutes (chargerRecensementMeta) en une liste plate d'items par bloc
// métabolique trouvé, avec un "signature" de contenu (mêmes exercices, même ordre, mêmes séries —
// règle de dédoublonnage demandée par le coach) permettant à _recensementMetaGroupes() de fusionner
// les programmes strictement identiques appartenant à plusieurs clients. Exclut le compte coach (yohanp).
function _recensementMetaItems(){
  return (recensementMetaData || []).map(b => {
    const cp = b.client_programmes;
    if (!cp || cp.client_id === 'yohanp') return null;
    const client = (data.clients || []).find(c => c.id === cp.client_id);
    const nomClient = client ? `${client.prenom || ''} ${client.nom || ''}`.trim() : cp.client_id;
    const seances = (b.client_programme_seances || []).map(s => ({
      titre: s.titre,
      exercices: (s.client_programme_exercices || []).map(ex => ({
        exercice_id: ex.exercice_id, nom: ex.nom, series: ex.series, reps: ex.reps, repos: ex.repos,
        tempo: ex.tempo, rir: ex.rir, notes: ex.notes,
      })),
    }));
    const map = {};
    seances.forEach(s => s.exercices.forEach(ex => {
      const exData = _resoudreExerciceBiblio(ex);
      const g = (exData && exData.groupe_musculaire) || 'Non défini';
      map[g] = (map[g] || 0) + (parseInt(ex.series) || 0);
    }));
    const repartition = Object.entries(map).sort((a, b) => b[1] - a[1]);
    const maxSeries = repartition.length ? repartition[0][1] : 0;
    const groupesPrio = maxSeries > 0 ? repartition.filter(([,n]) => n === maxSeries).map(([g]) => g) : ['Non défini'];
    const signature = _progContentSignature(seances);
    return {
      clientId: cp.client_id, nomClient, progId: cp.id, progNom: cp.nom, progActif: !!cp.actif, blocId: b.id,
      nombreSemaines: b.nombre_semaines || null, nbSeances: seances.length, seances, repartition, groupesPrio, signature,
    };
  }).filter(Boolean);
}

// Fusionne les items par signature de contenu — un seul "programme unique" par signature, avec la
// liste de tous les clients/programmes qui le partagent (demande coach : "je ne veux pas de doublon,
// si deux personnes ont le même programme on ne fait qu'un seul template et on identifie qui l'a").
function _recensementMetaGroupes(){
  const items = _recensementMetaItems();
  const parSignature = {};
  items.forEach(it => {
    if (!parSignature[it.signature]) {
      parSignature[it.signature] = {
        signature: it.signature, nbSeances: it.nbSeances, seances: it.seances, repartition: it.repartition,
        groupesPrio: it.groupesPrio, nombreSemaines: it.nombreSemaines, assignations: [],
      };
    }
    parSignature[it.signature].assignations.push({ clientId: it.clientId, nomClient: it.nomClient, progId: it.progId, progNom: it.progNom, progActif: it.progActif });
    if (recensementMetaNoms[it.signature] == null) {
      const suggestion = 'Focus ' + it.groupesPrio.join(' + ');
      recensementMetaNoms[it.signature] = suggestion;
    }
  });
  return Object.values(parSignature);
}

// Crée réellement UN template (programme_templates + blocs + séances + exercices, catégorie
// "Métabolique") pour un programme unique du recensement. Les exercices sans correspondance dans
// la bibliothèque coach (nom introuvable, ni exercice_id ni nom qui matche) sont ignorés —
// programme_seance_exercices exige un exercice_id valide, contrairement au programme client
// d'origine qui tolère les résidus de migration. Une fois créé, retro-lie TOUS les
// client_programmes d'origine (les "assignations" de ce groupe — ils sont byte-identiques au
// template qu'on vient de créer à partir d'eux) via source_template_id, pour qu'ils apparaissent
// immédiatement dans "Assignés" sans badge "modifié".
async function _recensementMetaGenererUn(g){
  const exercicesIgnores = [];
  const seances = g.seances.map(s => ({
    titre: s.titre,
    exercices: s.exercices.map(ex => {
      const exData = _resoudreExerciceBiblio(ex);
      if (!exData) { exercicesIgnores.push(ex.nom); return null; }
      return { exercice_id: exData.id, series: ex.series, reps: ex.reps || '', repos: ex.repos || '', tempo: ex.tempo || '', rir: ex.rir || '', notes: ex.notes || '' };
    }).filter(Boolean),
  }));
  const nom = (recensementMetaNoms[g.signature] || ('Focus ' + g.groupesPrio.join(' + '))).trim() || 'Focus';
  const saved = await sauvegarderTemplateComplet({
    id: null, nom, categorie: 'Métabolique',
    description: 'Généré automatiquement depuis le recensement des programmes clients le ' + new Date().toLocaleDateString('fr-FR') + '.',
    blocs: [{ type: 'metabolique', nombre_semaines: g.nombreSemaines, seances }],
  });
  await Promise.all(g.assignations.map(a =>
    fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${a.progId}`, { method: 'PATCH', headers: supaHeaders(), body: JSON.stringify({ source_template_id: saved.id }) })
  ));
  _recensementMetaCrees.add(g.signature);
  templatesData = null; // force un rechargement du catalogue de templates (nouveau venu)
  return { templateId: saved.id, exercicesIgnores };
}

async function _recensementMetaGenererUnDepuisBouton(signature){
  const g = _recensementMetaGroupes().find(gr => gr.signature === signature);
  if (!g || _recensementMetaCrees.has(g.signature)) return;
  try {
    const { exercicesIgnores } = await _recensementMetaGenererUn(g);
    alert(`Template "${recensementMetaNoms[g.signature]}" créé dans "Templates" (catégorie "Métabolique").${exercicesIgnores.length ? `\n\n${exercicesIgnores.length} exercice(s) ignoré(s) (introuvable(s) dans la bibliothèque) : ${[...new Set(exercicesIgnores)].join(', ')}` : ''}`);
  } catch(e) { alert('Erreur : ' + e.message); }
  renderRecensementMetaSub();
}

async function _recensementMetaGenererTous(){
  const groupes = _recensementMetaGroupes().filter(g => !_recensementMetaCrees.has(g.signature));
  if (!groupes.length) { alert('Rien à générer — tous les templates ont déjà été créés cette session.'); return; }
  const btn = document.getElementById('btnGenererTemplatesMeta');
  if (btn) { btn.disabled = true; btn.textContent = 'Génération…'; }
  let crees = 0, ignores = [];
  for (const g of groupes) {
    try {
      const { exercicesIgnores } = await _recensementMetaGenererUn(g);
      crees++;
      if (exercicesIgnores.length) ignores.push(...exercicesIgnores);
    } catch(e) { /* on continue les autres même si celui-ci échoue */ }
  }
  if (btn) { btn.disabled = false; btn.textContent = '🏗️ Générer tous les templates'; }
  alert(`${crees} template${crees>1?'s':''} créé${crees>1?'s':''} dans "Templates" (catégorie "Métabolique").${ignores.length ? `\n\n${ignores.length} exercice(s) ignoré(s) (introuvable(s) dans la bibliothèque) : ${[...new Set(ignores)].join(', ')}` : ''}`);
  renderRecensementMetaSub();
}

async function chargerTemplateArbo(templateId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs?template_id=eq.${templateId}&order=ordre.asc&select=*,programme_seances(*,programme_seance_exercices(*))&programme_seances.order=ordre.asc&programme_seances.programme_seance_exercices.order=ordre.asc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function sauvegarderTemplateComplet(tpl){
  const method = tpl.id ? 'PATCH' : 'POST';
  const url = tpl.id ? `${SUPABASE_URL}/rest/v1/programme_templates?id=eq.${tpl.id}` : `${SUPABASE_URL}/rest/v1/programme_templates`;
  const res = await fetch(url, { method, headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify({ nom: tpl.nom, categorie: tpl.categorie || null, description: tpl.description || null }) });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const saved = (await res.json())[0];
  const templateId = saved.id;
  if (tpl.id) {
    // Remplacement complet de l'arborescence (comme modifierMenu côté GAS) plutôt qu'un diff fin —
    // cascade sur programme_seances puis programme_seance_exercices.
    await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs?template_id=eq.${templateId}`, { method: 'DELETE', headers: supaHeaders() });
  }
  const blocsPayload = tpl.blocs.map((b, bi) => ({ template_id: templateId, type: b.type || null, nombre_semaines: b.nombre_semaines || null, ordre: bi }));
  const resBlocs = await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(blocsPayload) });
  if (!resBlocs.ok) throw new Error('supabase_' + resBlocs.status);
  const blocsSaved = await resBlocs.json();
  // Lookup par 'ordre' (qu'on a nous-même assigné = bi) plutôt que par position du tableau retourné —
  // l'ordre de retour d'un insert multi-lignes n'est pas garanti par Postgres.
  const blocIdByOrdre = {};
  blocsSaved.forEach(b => { blocIdByOrdre[b.ordre] = b.id; });

  const seancesPayload = [];
  tpl.blocs.forEach((b, bi) => {
    b.seances.forEach((s, si) => {
      seancesPayload.push({ bloc_id: blocIdByOrdre[bi], titre: s.titre || ('Séance ' + (si + 1)), ordre: si });
    });
  });
  let seancesSaved = [];
  if (seancesPayload.length) {
    const resSeances = await fetch(`${SUPABASE_URL}/rest/v1/programme_seances`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(seancesPayload) });
    if (!resSeances.ok) throw new Error('supabase_' + resSeances.status);
    seancesSaved = await resSeances.json();
  }
  const seanceIdByBlocOrdre = {};
  seancesSaved.forEach(s => { seanceIdByBlocOrdre[s.bloc_id + '|' + s.ordre] = s.id; });

  const exercicesPayload = [];
  tpl.blocs.forEach((b, bi) => {
    const blocId = blocIdByOrdre[bi];
    b.seances.forEach((s, si) => {
      const seanceId = seanceIdByBlocOrdre[blocId + '|' + si];
      s.exercices.forEach((ex, ei) => {
        exercicesPayload.push({ seance_id: seanceId, exercice_id: ex.exercice_id, ordre: ei, series: parseInt(ex.series) || null, reps: ex.reps || '', repos: ex.repos || '', tempo: ex.tempo || '', rir: ex.rir || '', notes: ex.notes || '', superset_groupe: ex.superset_groupe ?? null });
      });
    });
  });
  if (exercicesPayload.length) {
    const resExo = await fetch(`${SUPABASE_URL}/rest/v1/programme_seance_exercices`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(exercicesPayload) });
    if (!resExo.ok) throw new Error('supabase_' + resExo.status);
  }
  return saved;
}

// ── Sous-onglet "Recensement Métabolique" ─────────────────────────────────
// Objectif (demande coach 2026-08-10) : PAS juste un inventaire — une fabrique de templates
// réutilisables. Tous les blocs MÉTABOLIQUE de tous les programmes clients (actifs ET inactifs)
// sont dédoublonnés par contenu strict (mêmes exercices, même ordre, mêmes séries — deux clients
// avec le même programme = un seul "programme unique"), rangés en dossiers par groupe musculaire
// priorisé (un programme peut apparaître dans PLUSIEURS dossiers en cas d'égalité au sommet,
// ex: Pectoraux/Trapèzes/Ischios à 12 séries chacun), avec un nom de template éditable
// ("Focus X" ou "Focus X + Y" par défaut) et la liste des clients qui l'ont déjà. Le bouton
// "Générer tous les templates" crée réellement les programme_templates (catégorie "Métabolique"),
// visibles ensuite dans l'onglet "Templates" normal pour être réassignés à d'autres clients.
function renderRecensementMetaSub(){
  const sub = document.getElementById('progrSub');
  const groupesUniques = _recensementMetaGroupes();
  if (!groupesUniques.length) {
    sub.innerHTML = `<div class="empty-panel"><strong>Aucun bloc métabolique trouvé</strong>Aucun programme client (actif ou non) ne contient de bloc de type "Métabolique" pour l'instant.</div>`;
    return;
  }
  const estCree = g => _recensementMetaCrees.has(g.signature) || (recensementMetaTemplatesSignatures && recensementMetaTemplatesSignatures.has(g.signature));
  const nbNonCrees = groupesUniques.filter(g => !estCree(g)).length;
  // Dossier = la combinaison COMPLÈTE des groupes prioritaires (pas un dossier par groupe
  // individuel) — sinon un programme à égalité entre 3 groupes apparaîtrait dans 3 dossiers
  // différents, donnant l'impression (à tort) d'un doublon. Un programme = un seul dossier.
  const parGroupe = {};
  groupesUniques.forEach(g => { const nomGroupe = g.groupesPrio.join(' + '); (parGroupe[nomGroupe] = parGroupe[nomGroupe] || []).push(g); });
  const nomsGroupes = Object.keys(parGroupe).sort((a, b) => parGroupe[b].length - parGroupe[a].length);
  nomsGroupes.forEach(nomGroupe => parGroupe[nomGroupe].sort((a, b) => b.nbSeances - a.nbSeances));
  const nbClientsTotal = new Set(groupesUniques.flatMap(g => g.assignations.map(a => a.clientId))).size;

const EXO_BLOC_LABEL = { metabolique:'Méta', mecanique:'Méca', force:'Force' };
function _exoResumeBlocsHtml(e){
  const lignes = ['metabolique','mecanique','force'].map(type => {
    const reps = e['reps_'+type], repos = e['repos_'+type], rir = e['rir_'+type], tempo = e['tempo_'+type];
    if (!reps && !repos && !rir && !tempo) return '';
    const parts = [reps, repos ? '⏱'+repos : '', rir ? 'RIR '+rir : '', tempo ? 'tempo '+tempo : ''].filter(Boolean);
    return `<div style="font-size:11px;color:${BLOC_COLOR[type]};white-space:nowrap;"><b>${EXO_BLOC_LABEL[type]}</b> ${parts.join(' · ')}</div>`;

}

// Recherche visuelle dans le dépôt gratuit de gifs (ExerciseGymGifsDB, hébergé CDN jsDelivr).
// Le fichier tree.json est chargé une seule fois par session console (~1300 entrées, mis en cache).
// Préfixe ExoGif dédié pour ne pas entrer en collision avec le picker GIF du chat (Giphy, plus haut dans le fichier).
const EXO_GIF_CDN_BASE = 'https://cdn.jsdelivr.net/gh/JahelCuadrado/ExerciseGymGifsDB@main/';
const EXO_GIF_CATEGORIES = ['abductors','abs','adductors','biceps','calves','cardio','delts','forearms','glutes','hamstrings','lats','levator-scapulae','pectorals','quads','serratus-anterior','spine','traps','triceps','upper-back'];
let _exoGifCatalogCache = null;
let _exoGifCategorie = 'all';
let _exoGifRecherche = '';
let _exoImgSource = 'gif'; // 'gif' (ExerciseGymGifsDB, animé) | 'wger' (photos, catalogue plus large mais couverture image partielle)
let _wgerCatalogCache = null;

async function _chargerExoGifCatalog(){
  if (_exoGifCatalogCache) return _exoGifCatalogCache;
  const res = await fetch('https://api.github.com/repos/JahelCuadrado/ExerciseGymGifsDB/git/trees/main?recursive=1');
  if (!res.ok) throw new Error('github_' + res.status);
  const data = await res.json();
  _exoGifCatalogCache = (data.tree || []).filter(t => t.path.endsWith('.gif')).map(t => t.path);
  return _exoGifCatalogCache;
}

// wger : catalogue communautaire plus large (belt squat, hip thrust, bulgares…) mais sans gif animé
// et avec une couverture image partielle (beaucoup d'exercices du dataset n'ont aucune photo).
async function _chargerWgerCatalog(){
  if (_wgerCatalogCache) return _wgerCatalogCache;
  const out = [];
  let url = 'https://wger.de/api/v2/exerciseinfo/?limit=100&format=json';
  while (url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('wger_' + res.status);
    const data = await res.json();
    for (const item of data.results) {
      const img = (item.images || []).find(im => im.is_main) || (item.images || [])[0];
      if (!img) continue;
      const trFr = (item.translations || []).find(t => t.language === 12);
      const trEn = (item.translations || []).find(t => t.language === 2);
      const nom = (trFr || trEn || item.translations[0] || {}).name;
      if (!nom) continue;
      out.push({ nom, url: img.image });
    }
    url = data.next;
  }
  _wgerCatalogCache = out;
  return _wgerCatalogCache;
}

let tplEnEdition = null;
let tplPickerCible = null; // { bi, si }
const BLOCS_TYPES = [{value:'',label:'Générique'},{value:'metabolique',label:'Métabolique'},{value:'mecanique',label:'Mécanique'},{value:'force',label:'Force'}];
const RIR_PAR_TYPE  = { metabolique:'3',  mecanique:'2-3',  force:'1-2' };
const REPS_PAR_TYPE = { metabolique:'15-20', mecanique:'10-15', force:'6-10' };
const REPOS_PAR_TYPE= { metabolique:"1'",   mecanique:"1'30",  force:"2'" };

function blocVide(){ return { type: null, nombre_semaines: null, seances: [{ titre: 'Séance 1', exercices: [] }] }; }

// Applique reps/repos (depuis la bibliothèque d'exercices, selon le type) + RIR (défaut par type)
// à tous les exercices déjà présents dans un bloc — appelé quand on change le type du bloc,
// pour que le contenu déjà rempli reste cohérent avec Métabolique/Mécanique/Force.
// Ne JAMAIS écraser une valeur déjà renseignée quand l'exercice n'a pas de correspondance dans
// la bibliothèque (exercice_id null — cas de tous les exercices migrés depuis GAS, juste un nom) :
// avant ce fix, ces exercices retombaient systématiquement sur la valeur générique par type
// (ex: "10-15"/"1'30" pour Mécanique) IDENTIQUE pour tous, écrasant leurs vraies valeurs
// individuelles migrées depuis la base Excel d'origine (bug vécu : 200 exercices écrasés chez
// 5 clients à chaque changement de type de bloc). Le générique par type ne sert plus qu'à
// remplir un champ vraiment VIDE (nouvel exercice jamais renseigné), jamais à remplacer une
// valeur existante sans correspondance en bibliothèque.
// Lookup par nom en fallback (`exercice_id` null pour tout exercice migré — la migration
// n'insère que le nom, jamais de FK) : sans ce fallback, changer le type d'un bloc ne faisait
// plus RIEN sur les exercices migrés (aucun match par id → ni écrasement ni mise à jour), ce
// qui semblait figer tous les blocs sur les valeurs Métabolique d'origine — même piège que
// documenté plus haut dans ce fichier pour le groupe musculaire (toujours prévoir les deux
// lookups id puis nom).
function _appliquerTypeAuxExercicesDuBloc(bloc, exercicesLib){
  const type = bloc.type;
  if (!type) return;
  bloc.seances.forEach(seance => {
    seance.exercices.forEach(ex => {
      const lib = ex.exercice_id != null
        ? (exercicesLib||[]).find(e => e.id === ex.exercice_id)
        : (exercicesLib||[]).find(e => e.nom.toLowerCase() === (ex.nom||'').toLowerCase());
      if (lib && lib['reps_'+type])       ex.reps  = lib['reps_'+type];
      else if (!ex.reps)                  ex.reps  = REPS_PAR_TYPE[type]  || ex.reps;
      if (lib && lib['repos_'+type])      ex.repos = lib['repos_'+type];
      else if (!ex.repos)                 ex.repos = REPOS_PAR_TYPE[type] || ex.repos;
      // RIR : contrairement à reps/repos, il n'existe aucune donnée migrée individuelle par
      // exercice à protéger (GAS ne remonte jamais de RIR) — donc pas de mode "combler si vide
      // seulement" ici. Une correspondance bibliothèque (rir_<type>) est prioritaire ; sinon on
      // suit TOUJOURS le générique du type sélectionné, sans condition — sinon changer de type
      // ne faisait plus rien dès que `ex.rir` avait déjà une valeur (ex: restée du type
      // précédent), ce qui semblait figer le RIR peu importe le type choisi.
      ex.rir = (lib && lib['rir_'+type]) ? lib['rir_'+type] : (RIR_PAR_TYPE[type] || ex.rir);
      // Tempo : aucune valeur générique par type n'existe (jamais de donnée source) — seule une
      // correspondance bibliothèque explicite le renseigne, sinon il reste vide.
      if (lib && lib['tempo_'+type])       ex.tempo = lib['tempo_'+type];
    });
  });
}

async function ouvrirEditeurTemplate(id){
  if (exercicesData === null) { try { exercicesData = await chargerExercices(); } catch(e) { exercicesData = []; } }
  if (id) {

    const blocsRaw = await chargerTemplateArbo(id);
    tplEnEdition = {
      id: tpl.id, nom: tpl.nom, categorie: tpl.categorie || '', description: tpl.description || '',
      blocs: blocsRaw.map(b => ({
        type: b.type || null,
        nombre_semaines: b.nombre_semaines || null,
        seances: (b.programme_seances || []).map(s => ({
          titre: s.titre,
          exercices: (s.programme_seance_exercices || []).map(l => {
            const ex = exercicesData.find(e=>e.id===l.exercice_id);

      }))
    };
    if (!tplEnEdition.blocs.length) tplEnEdition.blocs = [blocVide()];
    tplEnEdition.blocs.forEach(b => { if (!b.seances.length) b.seances.push({ titre: 'Séance 1', exercices: [] }); });
  } else {
    tplEnEdition = { id: null, nom: '', categorie: '', description: '', blocs: [blocVide()] };

  renderEditeurTemplate();
}

let _repartitionTplBlocIdx = 0;
let _repartitionCpBlocIdx  = 0;
let _tplCollapsed = new Set();
let _cpCollapsed  = new Set();
// ── Supersets ─────────────────────────────────────────────────────────
let _tplSupersetPending = null; // {bi,si,ei} en attente de liaison (template)
let _cpSupersetPending  = null; // idem, éditeur programme client
let _supersetIdCounter  = Date.now(); // id de groupe interne, jamais affiché tel quel

// Clic sur 🔗 : délie si déjà lié, sinon entre/sort du mode "choisir le partenaire", sinon lie
// à l'exercice en attente (même séance uniquement). `edition`/`get`/`render` abstraient template vs client.
function _toggleSupersetGenerique(bi, si, ei, get, render, pendingGetSet) {
  const seance = get(bi, si);
  const ex = seance.exercices[ei];
  if (ex.superset_groupe != null) {
    const g = ex.superset_groupe;
    ex.superset_groupe = null;
    const reste = seance.exercices.filter(e => e.superset_groupe === g);
    if (reste.length === 1) reste[0].superset_groupe = null;
    pendingGetSet(null);
    render();
    return;
  }
  const pend = pendingGetSet();
  if (pend && pend.bi === bi && pend.si === si) {
    if (pend.ei === ei) { pendingGetSet(null); render(); return; }
    const partenaire = seance.exercices[pend.ei];
    let groupe = partenaire.superset_groupe;
    if (groupe == null) { groupe = _supersetIdCounter++; partenaire.superset_groupe = groupe; }
    ex.superset_groupe = groupe;
    pendingGetSet(null);
    render();
    return;
  }
  pendingGetSet({ bi, si, ei });
  render();
}
function tplToggleSuperset(bi, si, ei) {
  _toggleSupersetGenerique(bi, si, ei,
    (bi, si) => tplEnEdition.blocs[bi].seances[si],
    renderBlocsTemplate,
    (v) => { if (v === undefined) return _tplSupersetPending; _tplSupersetPending = v; });
}

  _toggleSupersetGenerique(bi, si, ei,
    (bi, si) => clientProgEnEdition.blocs[bi].seances[si],
    renderBlocsClientProg,
    (v) => { if (v === undefined) return _cpSupersetPending; _cpSupersetPending = v; });
}

// scrollant une liste de séances repliées dans l'éditeur, distincte de BLOC_COLOR (celle-ci
// colore le bloc entier, celle-là chaque séance individuellement à l'intérieur).
const SEANCE_COLOR_PALETTE = ['#6366f1','#ec4899','#14b8a6','#f59e0b','#8b5cf6','#06b6d4','#ef4444','#84cc16'];

function renderRepartitionInto(cont, blocs, selectedBlocIdx, context){
  if (!blocs || !blocs.length) { cont.innerHTML = ''; return; }
  const idx = Math.min(selectedBlocIdx ?? 0, blocs.length - 1);
  const multiBloc = blocs.length > 1;

  // Pills de sélection de bloc (si plusieurs blocs)
  const BLOCS_LABELS_SHORT = { metabolique: 'Méta', mecanique: 'Méca', force: 'Force' };
  const pills = multiBloc ? blocs.map((b, bi) => {
    const label = (b.type && BLOCS_LABELS_SHORT[b.type]) ? BLOCS_LABELS_SHORT[b.type] : `Bloc ${bi+1}`;
    const active = bi === idx;
    const fn = context === 'tpl'
      ? `_repartitionTplBlocIdx=${bi};renderRepartition()`
      : `_repartitionCpBlocIdx=${bi};_rerenderCpRepartition()`;
    return `<button onclick="${fn}" style="padding:3px 10px;border-radius:99px;border:1px solid ${active?'var(--accent)':'var(--hairline)'};background:${active?'var(--accent-soft)':'transparent'};color:${active?'var(--accent)':'var(--text-faint)'};font-size:11px;font-weight:${active?'700':'400'};cursor:pointer;">${esc(label)}</button>`;
  }).join('') : '';

  const bloc = blocs[idx];
  const map = {};
  (bloc.seances||[]).forEach(s => (s.exercices||[]).forEach(ex => {
    const g = ex.groupe_musculaire || 'Non défini';
    map[g] = (map[g]||0) + (parseInt(ex.series)||0);
  }));
  const total = Object.values(map).reduce((a,b)=>a+b,0);
  if (!total && !multiBloc) { cont.innerHTML = ''; return; }

// Renomme chaque séance "Séance N" (+ suffixe éventuel après un tiret, ex: "Séance 2 —
// Dos, Biceps") pour refléter sa position réelle après un réordonnancement/ajout/
// suppression — ne touche que le numéro, jamais le suffixe personnalisé du coach. Un titre
// qui ne suit pas du tout ce motif (renommé librement, "Push Day"...) est laissé intact.
function _renumeroterSeances(seances){
  (seances||[]).forEach((s, i) => {
    const m = /^Séance\s+\d+\s*(?:[—–-]\s*(.*))?$/i.exec((s.titre||'').trim());
    if (!m) return;
    const suffixe = (m[1]||'').trim();
    s.titre = 'Séance ' + (i+1) + (suffixe ? ' — ' + suffixe : '');
  });
}

function retirerExoDeSeance(bi, si, ei){
  const seance = tplEnEdition.blocs[bi].seances[si];
