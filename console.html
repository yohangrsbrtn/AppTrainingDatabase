<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppTraining — Console Coach</title>
<style>
  :root {
    --bg: #0b0b0c;
    --surface: #151514;
    --surface-2: #1c1c1a;
    --surface-3: #262524;
    --hairline: rgba(255,255,255,0.055);
    --text: #f5f2ec;
    --text-muted: #9d968a;
    --text-faint: #656055;
    --accent: #f2ba3e;
    --accent-soft: #f2ba3e17;
    --accent-2: #f5a83c;
    --accent-2-soft: #f5a83c14;
    --success: #3ecf8e;
    --success-soft: #3ecf8e17;
    --warning: #e08a3c;
    --warning-soft: #e08a3c17;
    --critical: #e2615c;
    --critical-soft: #e2615c17;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg: 0 20px 44px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body);
    font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  ::selection { background: var(--accent-soft); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .shell { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 58px 1fr; height: 100vh; background: var(--bg); }

  .gate { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 20px; }
  .gate .mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .gate h1 { font-family: var(--font-display); font-size: 18px; margin: 0; }
  .gate p { color: var(--text-muted); font-size: 13px; margin: 0; max-width: 320px; }
  .gate a.btn { text-decoration: none; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface-3); border-top-color: var(--accent); animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Topbar ── */
  .topbar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 20px;
    border-bottom: 1px solid var(--hairline); background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.02em; width: 212px; flex-shrink: 0; }
  .brand .mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); flex-shrink: 0; }
  .brand .sub { color: var(--text-faint); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin-left: 2px; }

  .search { position: relative; flex: 1; max-width: 420px; }
  .search input {
    width: 100%; background: var(--surface); border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 8px 12px 8px 32px; color: var(--text); font-size: 12.5px; font-family: inherit;
  }
  .search input:focus { border-color: var(--hairline); }
  .search input::placeholder { color: var(--text-faint); }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }

  .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: var(--surface);
    color: var(--text); font-size: 12px; font-weight: 600; padding: 8px 13px; border-radius: var(--radius-sm); cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: #1a1408; }
  .btn.primary:hover { filter: brightness(1.08); }
  .icon-btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    border: none; background: var(--surface); border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .badge-dot { position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--critical); color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); }

  .avatar {
    width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--text);
  }

  /* ── Dropdowns ── */
  .dropdown { position: relative; }
  .menu {
    position: absolute; top: calc(100% + 8px); right: 0; min-width: 210px; background: var(--surface-2);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 6px;
    display: none; z-index: 60;
  }
  .menu.open { display: block; }
  .menu-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 9px; border-radius: 7px;
    border: none; background: none; color: var(--text); font-size: 12.5px; cursor: pointer;
  }
  .menu-item:hover { background: var(--surface-3); }
  .menu-item.danger { color: var(--critical); }
  .menu-item svg { color: var(--text-faint); flex-shrink: 0; }
  .menu-item.danger svg { color: var(--critical); }
  .menu-sep { height: 1px; background: var(--hairline); margin: 5px 4px; }
  .menu-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); padding: 6px 9px 3px; font-weight: 600; }

  /* ── Sidebar ── */
  .sidebar { border-right: 1px solid var(--hairline); background: var(--bg); display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto; }
  .nav-group { margin-bottom: 4px; }
  .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); font-weight: 700; padding: 14px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; text-align: left;
    padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .nav-item svg { flex-shrink: 0; color: var(--text-faint); }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); }
  .nav-item.active svg { color: var(--accent); }
  .nav-count { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; background: var(--surface-2); color: var(--text-muted); padding: 1px 6px; border-radius: 999px; }
  .sidebar-footer { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--hairline); display: flex; align-items: center; gap: 9px; }
  .sidebar-footer .name { font-size: 12px; font-weight: 700; }
  .sidebar-footer .role { font-size: 10.5px; color: var(--text-faint); }

  /* ── Sidebar repliée (icônes seules) — bouton en haut à gauche ── */
  .shell.sidebar-collapsed { grid-template-columns: 64px 1fr; }
  .shell.sidebar-collapsed .brand { width: 64px; gap: 0; }
  .shell.sidebar-collapsed .brand .brand-text,
  .shell.sidebar-collapsed .brand .sub { display: none; }
  .shell.sidebar-collapsed .sidebar { padding: 16px 8px; align-items: center; }
  .shell.sidebar-collapsed .nav-label { display: none; }
  .shell.sidebar-collapsed .nav-item { justify-content: center; padding: 9px; gap: 0; width: 44px; }
  .shell.sidebar-collapsed .nav-item span:not(.nav-count) { display: none; }
  .shell.sidebar-collapsed .nav-count { position: absolute; top: 4px; right: 4px; font-size: 8px; padding: 0 4px; line-height: 1.4; }
  .shell.sidebar-collapsed .nav-item { position: relative; }
  .shell.sidebar-collapsed .sidebar-footer { justify-content: center; padding: 12px 4px 4px; }
  .shell.sidebar-collapsed .sidebar-footer .name,
  .shell.sidebar-collapsed .sidebar-footer .role { display: none; }

  /* ── Main ── */
  .main { overflow-y: auto; padding: 24px 28px 40px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  .page-head .eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); font-weight: 700; margin-bottom: 4px; }
  .page-head h1 { font-family: var(--font-display); font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .page-head .meta { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

  /* ── Dashboard grid ── */
  .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: min-content; gap: 14px; }
  .card { background: var(--surface); border-radius: var(--radius); display: flex; flex-direction: column; box-shadow: var(--shadow-sm); }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 15px 16px 12px; }
  .card-head svg { color: var(--accent); flex-shrink: 0; }
  .card-head .t { font-weight: 700; font-size: 12.5px; margin-right: auto; }
  .card-head .link { font-size: 11.5px; color: var(--text-faint); cursor: pointer; font-weight: 600; }
  .card-head .link:hover { color: var(--accent); }
  .card-list { padding: 2px 8px 10px; overflow-y: auto; }
  .card-list-row { display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: 10px; cursor: pointer; }
  .card-list-row:hover { background: var(--surface-2); }
  .card-list-row .t { font-size: 12.5px; font-weight: 600; }
  .card-list-row .s { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .card-list-row .time { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); white-space: nowrap; }
  .card-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 12px; flex: 1; }
  .card-empty svg { color: var(--success); }

  .chart-card .chart-top { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px; }
  .chart-card .big-value { font-family: var(--font-mono); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .chart-card .period { font-size: 11.5px; color: var(--text-faint); border-radius: 999px; padding: 4px 10px; background: var(--surface-2); }
  .chart-card svg.bigchart { width: 100%; height: 108px; display: block; padding: 10px 8px 6px; }

  .timeline-card .card-list { padding: 4px 16px 14px; }
  .tl-row { display: flex; gap: 10px; padding: 9px 0; cursor: default; border-radius: 0; }
  .tl-row.clickable { cursor: pointer; }
  .tl-row.clickable:hover { background: var(--surface-2); }
  .tl-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: var(--accent); }
  .tl-row .t { font-size: 12.5px; }
  .tl-row .t b { font-weight: 700; }
  .tl-row .d { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); margin-top: 1px; }

  .table-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
  .table-toolbar { display: flex; align-items: center; gap: 8px; padding: 14px 16px; }
  .table-toolbar .title { font-weight: 700; font-size: 13px; margin-right: auto; }
  .chip-filter { display: flex; gap: 6px; }
  .chip-filter button {
    border: none; background: var(--surface-2); color: var(--text-muted); font-size: 11.5px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .chip-filter button.active { background: var(--accent); color: #1a1408; }

  .table-scroll { overflow-x: auto; }
  table.clients { width: 100%; border-collapse: collapse; min-width: 780px; }
  table.clients thead th {
    position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; padding: 8px 16px 12px;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  table.clients thead th:hover { color: var(--text); }
  table.clients thead th .sort-arrow { margin-left: 3px; opacity: 0.5; font-size: 9px; }
  table.clients thead th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  table.clients tbody tr { cursor: pointer; }
  table.clients tbody tr:hover td { background: var(--surface-2); }
  table.clients tbody tr.selected td { background: var(--accent-soft); }
  table.clients td { padding: 11px 16px; font-size: 12.5px; vertical-align: middle; border-top: 1px solid var(--hairline); }
  table.clients tbody tr:first-child td { border-top: none; }
  .cell-name { display: flex; align-items: center; gap: 9px; font-weight: 600; }
  .mini-avatar { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .level-pill { display: inline-flex; align-items: center; gap: 3px; background: var(--accent-2-soft); color: var(--accent-2); font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; }
  .chip.ok { background: var(--success-soft); color: var(--success); }
  .chip.ok .dot { background: var(--success); }
  .chip.late { background: var(--warning-soft); color: var(--warning); }
  .chip.late .dot { background: var(--warning); }
  .chip.off { background: var(--surface-3); color: var(--text-faint); }
  .chip.off .dot { background: var(--text-faint); }

  .row-actions { display: flex; justify-content: flex-end; }
  .row-actions .icon-btn { width: 28px; height: 28px; }

  .empty-panel { background: var(--surface); border-radius: var(--radius); padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 12.5px; }
  .empty-panel strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 6px; font-family: var(--font-display); }

  /* ── Detail slide-over ── */
  .overlay { position: fixed; inset: 58px 0 0 0; background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.16s ease; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 58px; right: 0; bottom: 0; width: 400px; background: var(--surface);
    box-shadow: var(--shadow-lg); z-index: 50; transform: translateX(100%); transition: transform 0.18s ease; display: flex; flex-direction: column;
    border-radius: 20px 0 0 0;
  }
  .panel.open { transform: translateX(0); }
  .panel-head { padding: 20px 20px 0; }
  .panel-head-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .panel-avatar { width: 46px; height: 46px; border-radius: var(--radius-sm); background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .panel-close { border: none; background: var(--surface-2); width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-muted); }
  .panel-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 10px 0 2px; }
  .panel-sub { font-size: 12px; color: var(--text-muted); }
  .panel-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .panel-stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 9px 10px; }
  .panel-stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; }
  .panel-stat .v { font-family: var(--font-mono); font-size: 15px; font-weight: 700; margin-top: 2px; }
  .panel-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--hairline); padding: 0 20px; }
  .panel-tab { border: none; background: none; padding: 9px 4px; margin-right: 16px; font-size: 12px; font-weight: 600; color: var(--text-faint); cursor: pointer; border-bottom: 2px solid transparent; }
  .panel-tab:hover { color: var(--text); }
  .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .note-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
  .note-item .txt { font-size: 12.5px; white-space: pre-wrap; }
  .note-item .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .note-item .date { font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono); }
  .note-item .del { border: none; background: none; color: var(--text-faint); cursor: pointer; font-size: 11px; }
  .note-item .del:hover { color: var(--critical); }
  .note-form textarea { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-size: 12.5px; font-family: inherit; resize: vertical; min-height: 64px; }
  .note-form textarea:focus { border-color: var(--hairline); }
  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .field-row input, .field-row select, .field-row textarea {
    width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 9px 11px; color: var(--text); font-size: 13px; font-family: inherit; box-sizing: border-box;
  }
  .field-row input:focus, .field-row select:focus, .field-row textarea:focus { border-color: var(--hairline); }
  .field-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-box { background: var(--surface); border-radius: var(--radius); padding: 22px; width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-box h3 { margin: 0 0 16px; font-family: var(--font-display); font-size: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; justify-content: center; }
  .day-block { background: var(--surface); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .day-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-weight: 700; font-size: 13px; }
  .day-head .del { margin-left: auto; }
  .exo-row { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-top: 1px solid var(--hairline); font-size: 12.5px; overflow-x: auto; }
  .exo-row .nom { flex: 1 1 110px; min-width: 90px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exo-row .stat { color: var(--text-muted); font-family: var(--font-mono); font-size: 11.5px; white-space: nowrap; }
  .exo-row .mini-btn { border: none; background: var(--surface-2); color: var(--text-muted); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; font-size: 11px; flex-shrink: 0; }
  .exo-row .mini-btn:hover { color: var(--text); }
  .exo-champ { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .exo-champ label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); }
  .exo-champ input { width: 52px; background: var(--surface-2); border: 1px solid transparent; border-radius: 6px; padding: 5px 7px; color: var(--text); font-size: 12px; font-family: inherit; box-sizing: border-box; }
  .exo-champ input:focus { border-color: var(--hairline); }
  .drag-handle { cursor: grab; color: var(--text-faint); font-size: 14px; padding: 0 2px; flex-shrink: 0; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .exo-row.drag-over { box-shadow: inset 0 2px 0 var(--accent); }
  .tpl-card { background: var(--surface); border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: var(--shadow-sm); }
  .tpl-card .nom { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .tpl-card .meta { font-size: 11.5px; color: var(--text-faint); }
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .panel-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  .panel-row:last-child { border-bottom: none; }

  /* ── Fiche client — page dédiée ── */
  .fiche-back { display:inline-flex; align-items:center; gap:7px; color:var(--text-muted); font-size:12.5px; font-weight:600; background:none; border:none; cursor:pointer; padding:0; margin-bottom:18px; }
  .fiche-back:hover { color:var(--text); }

// ── getTierColors (progression.js non chargé en console) ────────────────
function getTierColors(tier) {
  switch(tier) {
    case 'bronze':     return {c1:'#d08040', c2:'#6a3010', bar:'linear-gradient(90deg,#6a3010,#d08040,#e8b060)'};
    case 'argent':     return {c1:'#c0c0c0', c2:'#585858', bar:'linear-gradient(90deg,#606060,#d0d0d0,#b0b0b0)'};
    case 'or':         return {c1:'#d4a820', c2:'#7a5000', bar:'linear-gradient(90deg,#7a5000,#d4a820,#f0d040)'};
    case 'platine':    return {c1:'#9090e8', c2:'#282870', bar:'linear-gradient(90deg,#282870,#9090e8,#b0b0ff)'};
    case 'diamant':    return {c1:'#00c8e8', c2:'#004860', bar:'linear-gradient(90deg,#004860,#00c8e8,#60e0ff)'};
    case 'legendaire': return {c1:'#c040e0', c2:'#500080', bar:'linear-gradient(90deg,#500080,#c040e0,#e060ff)'};
    default:           return {c1:'#a8b0c8', c2:'#404858', bar:'linear-gradient(90deg,#808898,#c0c8d8,#a8b0c8)'};
  }
}
// Semaines écoulées depuis le début du coaching — sert de dénominateur aux
// jauges séances/bilans dans chargerClientProgressionXP (voir progression.js
// pour la version client, identique).
function _semainesDepuisDebut(dateDebutStr) {
  if (!dateDebutStr) return 0;
  const debut = new Date(dateDebutStr);
  if (isNaN(debut)) return 0;
  const jours = Math.floor((new Date() - debut) / 86400000);
  return Math.max(1, Math.ceil((jours + 1) / 7));
}

// ── Icônes ─────────────────────────────────────────────────────────────

function svgIcon(paths){ return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`; }

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function initials(nom){ return (nom||'?').split(" ").map(w=>w[0]).filter(Boolean).join("").slice(0,2).toUpperCase(); }

// Même mapping que renderNotificationsCoach() (coach.js) — à garder synchro si un type est ajouté là-bas.
function libelleLog(l){
  if (l.type === 'bilan_envoye') return { icon:'📤', txt:'Bilan envoyé au coach', sub: l.semaine ? 'Semaine ' + l.semaine : '' };
  if (l.type === 'seance_validee') return { icon:'💪', txt:'Séance validée', sub: '' };
  if (l.type === 'journee_validee') return { icon:'✅', txt:'Journée validée', sub: '' };
  if (l.type === 'bilan') return { icon:'📋', txt:'Bilan clôturé', sub: l.semaine ? 'Semaine ' + l.semaine : '' };
  if (l.type === 'journee') return { icon:'✅', txt:'Journée validée', sub: l.semaine || '' };
  if (l.type === 'bilanEnvoye') return { icon:'📤', txt:'Bilan envoyé au coach', sub: l.semaine ? 'Semaine ' + l.semaine : '' };
  if (l.type === 'bonus_ponctualite') return { icon:'🎯', txt:'Bonus de ponctualité du bilan', sub: l.semaine ? 'Semaine ' + l.semaine : '' };
  if (l.type === 'bonus_streak') return { icon:'🔥', txt:'Bonus série de bilans', sub: l.semaine ? 'Semaine ' + l.semaine : '' };
  if (l.type === 'bonus_pas') return { icon:'🦶', txt:'Objectif pas atteint', sub: l.semaine || '' };
  const progParts = (l.programme || '').split('|');
  return { icon:'✅', txt: (l.semaine ? 'S' + l.semaine : '') + (progParts[1] ? ' · ' + progParts[1] : ' · Séance validée'), sub: progParts[0] || '' };
}

function bigChart(data, color){
  const w=560,h=100,max=Math.max(1,...data),min=Math.min(...data,0);
  const pts = data.map((v,i)=>[ (i/(data.length-1||1))*w, h - ((v-min)/((max-min)||1))*(h-10) - 4 ]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${h*f}" x2="${w}" y2="${h*f}" stroke="var(--hairline)" stroke-width="1"/>`).join('');
  return `<svg class="bigchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" opacity="0.18"/>
  </svg>`;
}

// Trouve l'entrée mensurations la plus proche dans le temps d'une date donnée —
// sert à afficher poids/tour de taille/mensurations sous une photo de bilan.
function _mensurationLaPlusProche(dateIso, mensurations){
  if (!dateIso || !mensurations || !mensurations.length) return null;
  const target = new Date(dateIso).getTime();
  let best = null, bestDiff = Infinity;
  mensurations.forEach(m => {
    if (!m.date) return;
    const diff = Math.abs(new Date(m.date).getTime() - target);
    if (diff < bestDiff) { bestDiff = diff; best = m; }
  });
  return best;
}
const _MENS_LABELS_COURT = { fessiers:'Fess.', cuisses:'Cuis.', mollets:'Moll.', poitrine:'Poit.', epaules:'Ép.', bras:'Bras' };
function _renderMensurationSousPhoto(m){
  if (!m) return '';
  const parts = [];
  if (m.poids != null) parts.push(`${m.poids}kg`);
  if (m.mesure != null) parts.push(`Taille ${m.mesure}cm`);
  Object.keys(_MENS_LABELS_COURT).forEach(k => { if (m[k] != null) parts.push(`${_MENS_LABELS_COURT[k]} ${m[k]}`); });
  return parts.length ? `<div style="font-size:9px;color:var(--text-faint);text-align:center;margin-top:4px;line-height:1.3;">${parts.join(' · ')}</div>` : '';
}

// ── Lightbox photo — carrousel plein écran (overlay, pas de nouvel onglet) ──
// Usage : ouvrirPhotoLightbox(tableauDePhotos, indexDeDepart) où chaque photo a
// au moins { url } (un champ date_validation ou created_at optionnel sert de légende).
let _photoLightbox = null; // { photos, index } ou null si fermé

function ouvrirPhotoLightbox(photos, startIndex){
  _photoLightbox = { photos: photos || [], index: startIndex || 0 };
  document.addEventListener('keydown', _lightboxKeyHandler);
  _renderLightboxDom();
}
function fermerPhotoLightbox(){
  _photoLightbox = null;
  document.removeEventListener('keydown', _lightboxKeyHandler);
  _renderLightboxDom();
}
function lightboxNav(delta){
  if (!_photoLightbox) return;
  const ni = _photoLightbox.index + delta;
  if (ni < 0 || ni >= _photoLightbox.photos.length) return;
  _photoLightbox.index = ni;
  _renderLightboxDom();
}
function lightboxGoto(i){
  if (!_photoLightbox) return;
  _photoLightbox.index = i;
  _renderLightboxDom();
}
function _lightboxKeyHandler(e){
  if (e.key === 'Escape') fermerPhotoLightbox();
  else if (e.key === 'ArrowLeft') lightboxNav(-1);
  else if (e.key === 'ArrowRight') lightboxNav(1);
}
function _lightboxDateLabel(p){
  const iso = (p.bilans && p.bilans.date_validation) || p.date_validation || p.created_at;
  if (!iso) return '';
  return iso.slice(0,10).split('-').reverse().join('/');
}
function _renderLightboxDom(){
  const existing = document.getElementById('photoLightboxOverlay');
  if (!_photoLightbox) { if (existing) existing.remove(); return; }
  const { photos, index } = _photoLightbox;
  const label = _lightboxDateLabel(photos[index] || {});
  const html = `<div id="photoLightboxOverlay" style="position:fixed;inset:0;background:rgba(5,6,10,.94);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;" onclick="if(event.target===this)fermerPhotoLightbox()">
    <button onclick="fermerPhotoLightbox()" title="Fermer" style="position:absolute;top:16px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:16px;cursor:pointer;">✕</button>
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:960px;padding:0 16px;">
      <button onclick="event.stopPropagation();lightboxNav(-1)" ${index<=0?'disabled':''} style="background:none;border:none;color:#fff;font-size:30px;cursor:pointer;flex-shrink:0;padding:8px;opacity:${index<=0?'.2':'.8'};">‹</button>
      <div style="display:flex;align-items:center;justify-content:center;gap:14px;overflow:hidden;flex:1;min-width:0;">
        ${photos.map((p,i) => {
          const dist = i - index;
          if (Math.abs(dist) > 2) return '';
          const isCur = dist === 0;
          const scale = isCur ? 1 : (Math.abs(dist)===1 ? 0.7 : 0.5);
          const opac = isCur ? 1 : (Math.abs(dist)===1 ? 0.4 : 0.18);
          return `<img src="${esc(p.url)}" onclick="event.stopPropagation();lightboxGoto(${i})"
            style="max-height:${isCur?'70vh':'46vh'};aspect-ratio:9/16;object-fit:cover;border-radius:12px;cursor:pointer;transform:scale(${scale});opacity:${opac};transition:transform .25s ease,opacity .25s ease;flex-shrink:0;box-shadow:${isCur?'0 12px 40px rgba(0,0,0,.6)':'none'};">`;
        }).join('')}
      </div>
      <button onclick="event.stopPropagation();lightboxNav(1)" ${index>=photos.length-1?'disabled':''} style="background:none;border:none;color:#fff;font-size:30px;cursor:pointer;flex-shrink:0;padding:8px;opacity:${index>=photos.length-1?'.2':'.8'};">›</button>
    </div>
    ${label ? `<div style="color:#fff;font-size:13px;margin-top:18px;opacity:.75;">${esc(label)} · ${index+1}/${photos.length}</div>` : `<div style="color:#fff;font-size:13px;margin-top:18px;opacity:.75;">${index+1}/${photos.length}</div>`}
  </div>`;
  if (existing) existing.outerHTML = html;
  else document.body.insertAdjacentHTML('beforeend', html);
}

async function chargerTousDietes(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc`, { headers: supaHeaders() });
  if (!res.ok) return [];
  const rows = await res.json();
  // Macros totales par diète (bandeau fiche client) — calculées sur le repas
  // "de base" de chaque emplacement (variante_index=0), pas ses équivalences,
  // pour donner un ordre de grandeur représentatif sans compter plusieurs fois.
  const tplIds = [...new Set(rows.map(d => d.diete_template_id).filter(Boolean))];
  if (tplIds.length) {
    try {
      const repasRes = await fetch(
        `${SUPABASE_URL}/rest/v1/repas?template_id=in.(${tplIds.join(',')})&variante_index=eq.0&select=template_id,repas_aliments(quantite_g,unite,kcal_par_100g,prot_par_100g,glu_par_100g,lip_par_100g)`,
        { headers: supaHeaders() });
      const repasRows = repasRes.ok ? await repasRes.json() : [];
      const macrosParTpl = {};
      repasRows.forEach(r => {
        const m = macrosParTpl[r.template_id] || (macrosParTpl[r.template_id] = { kcal:0, prot:0, glu:0, lip:0 });
        (r.repas_aliments || []).forEach(a => {
          const q = a.quantite_g || 0;
          const d = (a.unite||'g')==='g' ? 100 : 1; // colonnes stockées "pour 100g"
          m.kcal += q * (a.kcal_par_100g || 0) / d;
          m.prot += q * (a.prot_par_100g || 0) / d;
          m.glu  += q * (a.glu_par_100g  || 0) / d;
          m.lip  += q * (a.lip_par_100g  || 0) / d;
        });
      });
      rows.forEach(d => { if (d.diete_template_id) d._macros = macrosParTpl[d.diete_template_id] || null; });
    } catch(e) {}
  }
  return rows;
}

async function chargerProgrammeById(progId){
  const res1 = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${progId}`, { headers: supaHeaders() });
  if (!res1.ok) throw new Error('supabase_' + res1.status);
  const rows = await res1.json();
  if (!rows.length) return null;
  const cp = rows[0];
  const resArbo = await fetch(
    `${SUPABASE_URL}/rest/v1/client_programme_blocs?client_programme_id=eq.${cp.id}&order=ordre.asc` +
    `&select=*,client_programme_seances(*,client_programme_exercices(*))` +
    `&client_programme_seances.order=ordre.asc&client_programme_seances.client_programme_exercices.order=ordre.asc`,
    { headers: supaHeaders() }
  );
  const blocs = resArbo.ok ? await resArbo.json() : [];
  const exIds = [];
  blocs.forEach(b => (b.client_programme_seances||[]).forEach(s => (s.client_programme_exercices||[]).forEach(ex => exIds.push(ex.id))));
  let logs = {};
  let equivalents = {};
  let equivLogs = {};
  if (exIds.length) {
    const [resLogs, resEquiv] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exIds.join(',')})&order=semaine.asc,numero_serie.asc`, { headers: supaHeaders() }),
      fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices_equivalents?programme_exercice_id=in.(${exIds.join(',')})`, { headers: supaHeaders() })
    ]);
    if (resLogs.ok) (await resLogs.json()).forEach(l => { logs[l.client_programme_exercice_id+'|'+l.semaine+'|'+l.numero_serie] = l; });
    if (resEquiv.ok) {
      const equivRows = await resEquiv.json();
      equivRows.forEach(r => { equivalents[r.programme_exercice_id] = r; });
      const eqIds = equivRows.map(r => r.id);
      if (eqIds.length) {
        const resEquivLogs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs_equivalents?equivalent_id=in.(${eqIds.join(',')})&order=semaine.asc,numero_serie.asc`, { headers: supaHeaders() });
        if (resEquivLogs.ok) (await resEquivLogs.json()).forEach(l => { equivLogs[l.equivalent_id+'|'+l.semaine+'|'+l.numero_serie] = l; });
      }
    }
  }
  return Object.assign({}, cp, { blocs, logs, equivalents, equivLogs });
}

function filteredSortedClients(){
  let list = data.clients.filter(c => (c.nom||'').toLowerCase().includes(state.search.toLowerCase()));
  // Filtre par onglet statut (actif / pause / ancien)
  list = list.filter(c => (c.statut || 'actif') === state.clientTab);
  if (state.statusFilter === 'late') list = list.filter(c => c.enRetard);
  if (state.statusFilter === 'locked') list = list.filter(c => c.verrouile);
  list = list.slice().sort((a,b) => {
    let av=a[state.sortKey], bv=b[state.sortKey];
    if (typeof av === 'string') return (av||'').localeCompare(bv||'','fr') * state.sortDir;
    return ((av||0)-(bv||0)) * state.sortDir;
  });
  return list;
}

  const [profilsRes, progressionRes, pushRes] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/client_profils`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/client_progression`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?select=client_id`, { headers: supaHeaders() }),
  ]);
  const profils = profilsRes.ok ? await profilsRes.json() : [];
  const progressionRows = progressionRes.ok ? await progressionRes.json() : [];
  const pushRows = pushRes.ok ? await pushRes.json() : [];
  const clientsAvecPush = new Set(pushRows.map(r => r.client_id));
  const progByClient = {};
  progressionRows.forEach(p => { progByClient[p.client_id] = p; });

  const clients = profils.filter(p => p.client_id !== 'yohan').map(p => {
    const prog = progByClient[p.client_id] || {};
    const xpTotal = prog.xp_total || 0;
    return {
      id: p.client_id,
      nom: [p.prenom, p.nom].filter(Boolean).join(' ') || p.client_id,
      niveau: Math.max(1, Math.floor(xpTotal/50) + 1),
      titreActif: prog.titre_actif || null,
      chimieActif: !!p.chimie_actif,
      chimieActifSupa: !!p.chimie_actif,
      verrouile: false,
      verrouilleApp: !!p.verrouille_app,
      dernConnexion: null,
      derniereConnexionSupa: p.derniere_connexion || null,
      _hasSupaProfil: true,
      supabaseOnlyActif: !!p.supabase_only,
      statut: p.statut || 'actif',
      enRetard: false,
      dernier_mois_paye: p.dernier_mois_paye || null,
      mode_paiement: p.mode_paiement || null,
      jour_paiement: p.jour_paiement || null,
      date_fin_coaching: p.date_fin_coaching || null,
      jour_bilan: p.jour_bilan || null,
      pushActif: clientsAvecPush.has(p.client_id),
    };
  });

  // Retard : même logique de ponctualité que côté client (_supaCalculerRetard, déjà
  // Supabase-native) pour tout le monde désormais, plus de distinction GAS/Supabase.
  const retards = await Promise.all(clients.map(c => _supaCalculerRetard(c.id).catch(()=>false)));
  clients.forEach((c,i) => { c.enRetard = retards[i]; });

  const clientsById = {};
  clients.forEach(c => { clientsById[c.id] = c.nom; });

  let bilansAll = [];
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/bilans?order=created_at.desc&limit=500`, { headers: supaHeaders() });
    if (res.ok) bilansAll = await res.json();
  } catch(e) {}
  // Trié par date d'ENVOI réelle (envoye_at), pas par date de création de la
  // semaine du bilan (created_at) — sinon un bilan tout juste envoyé reste
  // noyé au milieu des bilans migrés en masse (created_at ancien, envoye_at
  // absent) au lieu de remonter en tête de liste comme attendu. Fallback sur
  // created_at pour les bilans migrés (envoye_at jamais renseigné côté GAS).
  const bilansSupa = bilansAll.filter(b => b.envoye_coach && !b.coach_traite)
    .sort((a,b)=>((b.envoye_at||b.created_at)||'').localeCompare((a.envoye_at||a.created_at)||''));

  let aValiderRows = [];
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/aliments_communaute?valide=eq.false&order=created_at.desc`, { headers: supaHeaders() });
    if (res.ok) aValiderRows = await res.json();
  } catch(e) {}
  const aValider = aValiderRows.map(a => ({ nom: a.nom, ajoutePar: clientsById[a.created_by] || a.created_by || '?' }));

  const logs = await _chargerActiviteRecente(clientsById).catch(()=>[]);

  // bilansCoach (ancien format GAS ts/client/coachTraite) conservé vide pour compat —
  // tout ce qui l'utilisait lit maintenant bilansAll/bilansSupa directement.
  data = { clients, bilansCoach: [], bilansSupa, bilansAll, logs, aValider };
  // Persist pour stale-while-revalidate au prochain chargement
  try {
    localStorage.setItem('at_console_cache_v2', JSON.stringify({ ts: Date.now(), data }));
  } catch(e) {
    // QuotaExceeded : réessayer sans les logs/bilans (potentiellement volumineux)
    try {
      localStorage.setItem('at_console_cache_v2', JSON.stringify({ ts: Date.now(), data: { ...data, logs: data.logs.slice(0, 50), bilansAll: data.bilansAll.slice(0, 100) } }));
    } catch(e2) {}
  }
}

// Activité récente (dashboard) : événements réels (bilan envoyé, séance
// validée, journée validée) depuis activite_events, alimentée par les
// triggers Postgres sur `bilans` (voir sql/2026-08-01_coach_notif_prefs.sql).
// Ne contient PLUS les logs individuels de charge/reps (client_programme_logs) :
// chaque série sauvegardée y apparaissait comme "Séance validée" (fallback
// trompeur de libelleLog), noyant les vrais événements sous du bruit.
async function _chargerActiviteRecente(clientsById){
  const fmtTs = iso => { const d = new Date(iso); return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); };
  const depuis7j = new Date(Date.now() - 7 * 86400000).toISOString();
  const res = await fetch(`${SUPABASE_URL}/rest/v1/activite_events?created_at=gte.${depuis7j}&order=created_at.desc&limit=100&select=client_id,type,meta,created_at`, { headers: supaHeaders() }).catch(()=>null);
  const rows = (res && res.ok) ? await res.json() : [];
  return rows.map(r => ({
    nom: clientsById[r.client_id] || r.client_id,
    tms: r.created_at, ts: fmtTs(r.created_at),
    type: r.type, semaine: r.meta && r.meta.semaine_label,
  }));
}

// Même sémantique que _bilanEstPonctuel côté client : "si ce bilan était envoyé
// maintenant, serait-ce en retard ?" — vérifie TOUS les bilans non-envoyés (pas
// seulement le plus récent) : un client qui a sauté une semaine peut avoir un
// vieux bilan resté ouvert et non-envoyé pendant qu'un nouveau a démarré pour
// la semaine en cours (cf. _supaGetOrCreateBilanCourant, bilan.js) — le plus
// récent n'est alors pas encore en retard, mais l'ancien l'est toujours.
async function _supaCalculerRetard(clientId) {
  try {
    const profilRes = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}&select=jour_bilan`, { headers: supaHeaders() });
    const profilArr = profilRes.ok ? await profilRes.json() : [];
    const jourBilan = profilArr[0] && profilArr[0].jour_bilan;
    const bilanRes = await fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(clientId)}&envoye_coach=eq.false&order=created_at.desc&select=created_at`, { headers: supaHeaders() });
    const bilanArr = bilanRes.ok ? await bilanRes.json() : [];
    if (!bilanArr.length) return false;
    return bilanArr.some(b => !_bilanEstPonctuel(b.created_at, new Date().toISOString(), jourBilan));
  } catch(e) { return false; }
}

function _urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

// Cœur d'un envoi : trace l'envoi groupé (notif_envois), ses destinataires
// (notif_envoi_destinataires, conservés même si l'inbox client est vidée),
// écrit dans l'inbox vivante du client (client_notifications) puis pousse le
// push. Réutilisé par le modal manuel ET par "Renvoyer" depuis l'historique.
async function _envoyerNotifCore(clientIdOuIds, titre, corps, pleinEcran, source){
  const estTous = clientIdOuIds === 'all';
  const cibles = estTous ? data.clients.map(c => c.id) : (Array.isArray(clientIdOuIds) ? clientIdOuIds : [clientIdOuIds]);
  const resEnvoi = await fetch(`${SUPABASE_URL}/rest/v1/notif_envois`, {
    method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }),
    body: JSON.stringify({ title: titre, body: corps, plein_ecran: !!pleinEcran, source: source || 'manuel' })
  });
  if (!resEnvoi.ok) throw new Error('Erreur création envoi (' + resEnvoi.status + ')');
  const envoi = (await resEnvoi.json())[0];
  await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/notif_envoi_destinataires`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }),
      body: JSON.stringify(cibles.map(id => ({ envoi_id: envoi.id, client_id: id })))
    }),
    fetch(`${SUPABASE_URL}/rest/v1/client_notifications`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }),
      body: JSON.stringify(cibles.map(id => ({ client_id: id, title: titre, body: corps, envoi_id: envoi.id, plein_ecran: !!pleinEcran })))
    })
  ]);
  // send-push (fonction Edge) ne prend qu'un client_id unique ou "all" — pour
  // une sélection multiple on l'appelle une fois par client ciblé.
  let sent = 0;
  if (estTous) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/send-push`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ title: titre, body: corps, client_id: 'all' })
    });
    const j = await res.json();
    if (!res.ok || !j.ok) throw new Error(j.error || 'Erreur serveur');
    sent = j.sent;
  } else {
    const resultats = await Promise.all(cibles.map(id => fetch(`${SUPABASE_URL}/functions/v1/send-push`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ title: titre, body: corps, client_id: id })
    }).then(async r => ({ ok: r.ok, j: await r.json().catch(() => ({})) }))));
    for (const { ok, j } of resultats) {
      if (!ok || !j.ok) throw new Error(j.error || 'Erreur serveur');
      sent += j.sent || 0;
    }
  }
  return { sent };
}

async function envoyerNotification(clientId){
  const titre = document.getElementById('ntf-titre').value.trim();
  const corps = document.getElementById('ntf-corps').value.trim();
  const pleinEcran = document.getElementById('ntf-plein-ecran')?.checked || false;
  const err = document.getElementById('ntf-err');
  const btn = document.getElementById('ntf-btn');
  if (!titre || !corps) { err.textContent = 'Titre et message obligatoires.'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Envoi…';
  try {
    const j = await _envoyerNotifCore(clientId, titre, corps, pleinEcran, 'manuel');
    document.querySelector('.modal-overlay')?.remove();
    alert(j.sent > 0 ? `Notification envoyée (${j.sent} appareil${j.sent>1?'s':''}).` : "Enregistrée dans l'app — aucun appareil abonné au push pour l'instant.");
    if (state.nav === 'notifications') { await chargerHistoriqueNotifs(); renderMain(); }
  } catch(e) {
    err.textContent = 'Erreur : ' + e.message; err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Envoyer';
  }
}

async function activerNotificationsPush(){
  const btn = document.getElementById('btnActiverPush');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { alert("Permission refusée — tu pourras la réactiver dans les réglages du navigateur."); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: _urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    const j = sub.toJSON();
    const res = await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?on_conflict=endpoint`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ client_id: COACH_CLIENT_ID, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth })
    });
    if (!res.ok) throw new Error(await res.text());
    if (state.nav === 'parametres') renderMain();
  } catch(e) {
    alert('Erreur : ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Activer les notifications sur cet appareil'; }
  }
}

let notifHistoData = { loaded:false, envois:[] };

function _nomClient(id){
  const c = data.clients.find(x => x.id === id);
  return c ? c.nom : id;
}

async function chargerHistoriqueNotifs(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/notif_envois?select=*,notif_envoi_destinataires(client_id,supprime)&order=created_at.desc&limit=200`, { headers: supaHeaders() });
  const envois = res.ok ? await res.json() : [];
  const ids = envois.map(e => e.id);
  let luByKey = {};
  if (ids.length) {
    const resLu = await fetch(`${SUPABASE_URL}/rest/v1/client_notifications?envoi_id=in.(${ids.join(',')})&select=envoi_id,client_id,lu,lu_at`, { headers: supaHeaders() });
    if (resLu.ok) (await resLu.json()).forEach(r => { luByKey[r.envoi_id + '|' + r.client_id] = { lu: r.lu, lu_at: r.lu_at }; });
  }
  notifHistoData = { loaded: true, envois: envois.map(e => ({
    ...e,
    destinataires: (e.notif_envoi_destinataires || []).map(d => {
      const info = luByKey[e.id + '|' + d.client_id] || {};
      return { client_id: d.client_id, supprime: d.supprime, lu: info.lu === true, lu_at: info.lu_at || null };
    })
  })) };
}

// Fusionne les événements réellement poussés au coach (activite_events —
// bilan reçu / séance validée / journée validée, cf. coach_notif_prefs) et les
// rappels de paiement envoyés aux clients (utile au coach comme journal :
// "tel client a été relancé tel jour"), triés par date desc.
let notifCoachData = { loaded:false, rows:[] };

async function chargerNotifsCoach(){
  const [resEvents, resPaiement] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/activite_events?order=created_at.desc&limit=200&select=client_id,type,meta,created_at`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/client_notifications?source=eq.rappel_paiement&order=created_at.desc&limit=100&select=client_id,title,body,created_at`, { headers: supaHeaders() }),
  ]);
  const events = resEvents.ok ? await resEvents.json() : [];
  const paiements = resPaiement.ok ? await resPaiement.json() : [];
  const rows = [
    ...events.map(e => ({ kind:'event', client_id:e.client_id, type:e.type, meta:e.meta, created_at:e.created_at })),
    ...paiements.map(p => ({ kind:'paiement', client_id:p.client_id, title:p.title, body:p.body, created_at:p.created_at })),
  ].sort((a,b) => (b.created_at||'').localeCompare(a.created_at||''));
  notifCoachData = { loaded:true, rows };
}

// "Tout sélectionner" ne porte que sur les clients du filtre statut actuellement
// affiché (actif/pause/ancien) — ne touche pas à la sélection déjà faite dans
// les autres filtres (permet de cumuler ex: quelques actifs + quelques en pause).
function _notifSelToggleTous(){
  const clientsDuFiltre = _notifSelClientsDuFiltre();
  const toutesCoches = clientsDuFiltre.length > 0 && clientsDuFiltre.every(c => _notifSelClients.has(c.id));
  clientsDuFiltre.forEach(c => { if (toutesCoches) _notifSelClients.delete(c.id); else _notifSelClients.add(c.id); });
  if (state.nav === 'notifications') renderMain();
}

async function envoyerNotificationSelection(){
  const titre = _notifSelTitre.trim();
  const corps = _notifSelCorps.trim();
  const err = document.getElementById('ntfsel-err');
  const btn = document.getElementById('ntfsel-btn');
  if (!_notifSelClients.size) { err.textContent = 'Sélectionne au moins un client.'; err.style.display = 'block'; return; }
  if (!titre || !corps) { err.textContent = 'Titre et message obligatoires.'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Envoi…';
  try {
    const j = await _envoyerNotifCore(Array.from(_notifSelClients), titre, corps, _notifSelPlein, 'manuel');
    _notifSelClients = new Set(); _notifSelTitre = ''; _notifSelCorps = ''; _notifSelPlein = false;
    alert(j.sent > 0 ? `Notification envoyée (${j.sent} appareil${j.sent>1?'s':''}).` : "Enregistrée dans l'app — aucun appareil abonné au push pour l'instant.");
    await chargerHistoriqueNotifs();

    err.textContent = 'Erreur : ' + ex.message; err.style.display = 'block';

async function supprimerNotifEnvoi(envoiId){
  if (!confirm("Supprimer cette notification chez tous les clients qui l'ont reçue ? Elle disparaîtra de leur cloche, mais restera dans cet historique.")) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_notifications?envoi_id=eq.${envoiId}`, { method:'DELETE', headers: supaHeaders({ Prefer:'return=minimal' }) });
    await fetch(`${SUPABASE_URL}/rest/v1/notif_envoi_destinataires?envoi_id=eq.${envoiId}`, {
      method:'PATCH', headers: supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify({ supprime:true })
    });
    await chargerHistoriqueNotifs();
    if (state.nav === 'notifications') renderMain();
  } catch(e){ alert('Erreur : ' + e.message); }
}

function ouvrirRenvoyerNotif(envoiId){
  const e = notifHistoData.envois.find(x => x.id === envoiId);
  if (!e) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:400px;width:100%;">
      <h3 style="margin:0 0 16px;">↻ Renvoyer « ${esc(e.title)} »</h3>
      <div class="fiche-field">
        <label>Destinataire</label>
        <select id="rnv-cible" style="font-size:16px;">
          <option value="all">Tous les clients</option>
          ${data.clients.slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr')).map(c => `<option value="${c.id}">${esc(c.nom)}</option>`).join('')}
        </select>
      </div>
      <div id="rnv-err" style="color:var(--critical);font-size:12px;display:none;margin-bottom:6px;"></div>
      <div class="modal-actions" style="margin-top:16px;">
        <button class="btn" onclick="this.closest('.modal-overlay').remove()">Annuler</button>
        <button class="btn primary" id="rnv-btn" onclick="renvoyerNotif('${envoiId}')">Renvoyer</button>
      </div>
    </div>`;
  overlay.addEventListener('click', ev => { if (ev.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

async function renvoyerNotif(envoiId){
  const e = notifHistoData.envois.find(x => x.id === envoiId);
  const cible = document.getElementById('rnv-cible').value;
  const err = document.getElementById('rnv-err');
  const btn = document.getElementById('rnv-btn');
  btn.disabled = true; btn.textContent = 'Envoi…';

    await _envoyerNotifCore(cible, e.title, e.body, e.plein_ecran, e.source);

    await chargerHistoriqueNotifs();
    if (state.nav === 'notifications') renderMain();
  } catch(ex){
    err.textContent = 'Erreur : ' + ex.message; err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Renvoyer';
  }
}

function _parseTsMs(ts) {
  const m = (ts||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]).getTime() : null;
}
function _semaineFromDate(dateStr) {
  const m = (dateStr||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (!m) return dateStr;
  const sunMs = new Date(+m[3], +m[2]-1, +m[1]).getTime();
  const monMs = sunMs - 6*86400000;
  const mon = new Date(monMs), sun = new Date(sunMs);
  const p = n => ('0'+n).slice(-2);
  return `${p(mon.getDate())}/${p(mon.getMonth()+1)} → ${p(sun.getDate())}/${p(sun.getMonth()+1)}/${sun.getFullYear()}`;
}

function setBilansTab(tab) {

    .then(r => r.ok ? r.json() : Promise.reject(new Error('supabase_' + r.status)))

      bilansHistoData = { loaded: true, error: null, bilans: rows || [] };

      bilansHistoData = { loaded: true, error: e.message, bilans: [] };
      if (state.nav === 'bilans') renderMain();
    });
}

// dans le contexte complet du client, pas dans un cul-de-sac isolé.
function ouvrirBilanDashboard(bilanId) {
  const b = (data.bilansAll||[]).find(x=>x.id===bilanId);
  if (!b) return;
  _bilanNavSource = 'fiche'; _bilanNavList = null; _bilanNavIdx = -1;
  openBilanDetailSupabase(b);
}

// "Bilans en retard" ne porte que le client (pas de bilan précis) — on va
// chercher son bilan non-envoyé le plus ancien (le plus en retard) avant
// d'ouvrir le détail. Fallback sur la fiche client si rien n'est trouvé.
async function ouvrirBilanEnRetardDashboard(clientId) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(clientId)}&envoye_coach=eq.false&order=created_at.asc&limit=1`, { headers: supaHeaders() });
    const rows = res.ok ? await res.json() : [];
    if (rows[0]) { _bilanNavSource = 'fiche'; _bilanNavList = null; _bilanNavIdx = -1; openBilanDetailSupabase(rows[0]); return; }
  } catch(e) {}
  openPanel(clientId);
}

// Fil de navigation rapide (bilan-detail, ouvert depuis la fiche/le dashboard) :
// sauter directement vers un autre onglet de la fiche de ce même client, sans
// repasser par "Retour" puis re-cliquer l'onglet.
function allerFicheTab(clientId, tab){
  openPanel(clientId).then(() => setFicheTab(tab));
}

function openBilanDetailSupabase(bilan) {
  const dateIso = bilan.date_validation || '';
  const dateFr  = dateIso ? dateIso.split('-').reverse().join('/') : '';
  bilanDetailState = {
    loaded: true,
    client: bilan.client_id,
    ligneTitre: bilan.gas_ligne_titre || null,
    ts: null,
    coachTraite: !!bilan.coach_traite,
    data: {
      dateValidation: dateFr,
      semaineLabel: bilan.semaine_label || '',
      jours: bilan.jours || [],
      repas: bilan.repas_eval || [],
      commentaireAlim: bilan.commentaire_alim || '',
      commentaireJour: bilan.commentaire_jour || '',
      commentaireActivite: bilan.commentaire_activite || '',
      fatigueGenerale: bilan.fatigue_generale || 0,
      commentaireFatigue: bilan.commentaire_fatigue || '',
      qualiteSommeil: bilan.qualite_sommeil || 0,
      commentaireSommeil: bilan.commentaire_sommeil || '',
    },
    error: null,
    _supabaseBilanId: bilan.id,
    dateIso,
    photos: null,
    mensurations: null,
  };
  state.nav = 'bilan-detail';
  renderSidebar();
  renderMain();
  if (bilan.id) {
    chargerBilanPhotos(bilan.id)
      .then(photos => { bilanDetailState.photos = photos; if (state.nav==='bilan-detail') renderMain(); })
      .catch(() => { bilanDetailState.photos = []; if (state.nav==='bilan-detail') renderMain(); });
  }
  fetch(`${SUPABASE_URL}/rest/v1/mensurations?client_id=eq.${encodeURIComponent(bilan.client_id)}&order=date.asc`, { headers: supaHeaders() })
    .then(r => r.ok ? r.json() : [])
    .then(rows => { bilanDetailState.mensurations = rows; if (state.nav==='bilan-detail') renderMain(); })
    .catch(() => { bilanDetailState.mensurations = []; if (state.nav==='bilan-detail') renderMain(); });
}

function openFicheBilanDetail(idx) {
  const b = (_ficheBilans || [])[idx];
  if (!b) return;
  _bilanNavList = _ficheBilans;
  _bilanNavIdx  = idx;
  _bilanNavSource = 'fiche';
  openBilanDetailSupabase(b);
}

function bilanNavGo(delta) {
  if (!_bilanNavList) return;
  const newIdx = _bilanNavIdx + delta;
  if (newIdx < 0 || newIdx >= _bilanNavList.length) return;
  _bilanNavIdx = newIdx;
  openBilanDetailSupabase(_bilanNavList[newIdx]);
}

function _weekRange(dateFr) {
  if (!dateFr) return '';
  const p = dateFr.split('/');
  if (p.length !== 3) return dateFr;
  const sun = new Date(+p[2], +p[1]-1, +p[0]);
  const mon = new Date(sun); mon.setDate(sun.getDate() - 6);
  const fmt = d => d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
  return `${fmt(mon)} → ${fmt(sun)}`;
}

// Réordonne jours[] (toujours stocké Lundi(0)…Dimanche(6) en base) selon les vraies dates
// calendaires de la semaine du bilan, et attache la date à chaque entrée pour affichage.
// dateValidationFr = date de fin de semaine (dd/mm/yyyy) ; début = fin - 6 jours — même base
// de calcul que _weekRange, pour rester cohérent avec l'entête "X → Y" affichée au-dessus.
function _bilanJoursAvecDates(joursArr, dateValidationFr) {
  if (!joursArr.length) return joursArr;
  const p = (dateValidationFr || '').split('/');
  if (p.length !== 3) return joursArr; // pas de date connue — ordre stocké tel quel
  const fin = new Date(+p[2], +p[1]-1, +p[0]);
  const debut = new Date(fin); debut.setDate(fin.getDate() - 6);
  const fmt = d => d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
  return Array.from({ length: 7 }, (_, i) => {
    const dt = new Date(debut); dt.setDate(debut.getDate() + i);
    const wIdx = (dt.getDay() + 6) % 7; // Lundi=0…Dimanche=6
    return { ...(joursArr[wIdx] || {}), _dateLabel: fmt(dt) };
  });
}

function renderBilansPage(el) {
  const pendingCount = (data.bilansAll||[]).filter(b => b.envoye_coach && !b.coach_traite).length;
  el.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Console coach</div><h1>Bilans</h1></div>
      <div class="meta">${pendingCount > 0 ? `<span style="color:var(--critical);">${pendingCount} à traiter</span>` : 'À jour'}</div>
    </div>
    <div class="fiche-tabs">
      <button class="fiche-tab${bilansTab==='recents'?' active':''}" onclick="setBilansTab('recents')">
        Récents${pendingCount > 0 ? ` <span class="nav-count" style="margin-left:6px;">${pendingCount}</span>` : ''}
      </button>
      <button class="fiche-tab${bilansTab==='historique'?' active':''}" onclick="setBilansTab('historique')">Historique</button>
    </div>
    <div id="bilansContent">${_renderBilansTabContent()}</div>`;
}

function _renderBilansTabContent() {
  return bilansTab === 'recents' ? _renderBilansRecents() : _renderBilansHistorique();
}

function _renderBilansRecents() {
  const now = Date.now();
  const all = data.bilansAll || [];
  const envoyes = all.filter(b => b.envoye_coach);
  const pending = envoyes.filter(b => !b.coach_traite).sort((a,b) => (b.created_at||'').localeCompare(a.created_at||''));
  const recentTraited = envoyes.filter(b => {
    if (!b.coach_traite) return false;
    const iso = b.coach_traite_at || b.date_validation || b.created_at;
    const t = iso ? new Date(iso).getTime() : null;
    return t && (now - t) <= 15*24*60*60*1000;
  }).sort((a,b) => ((b.coach_traite_at||b.date_validation||b.created_at||'')).localeCompare(a.coach_traite_at||a.date_validation||a.created_at||''));

  const nomOf = clientId => { const c = data.clients.find(x=>x.id===clientId); return c ? c.nom : clientId; };
  const dateFrOf = b => {
    const iso = b.date_validation || (b.created_at ? b.created_at.slice(0,10) : '');
    return iso ? iso.split('-').reverse().join('/') : '—';
  };
  const dateHeureFrOf = iso => iso ? new Date(iso).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
  const rowHtml = (b, showBtn) => `
    <tr style="cursor:pointer;" onclick="openBilanByIdFromRecents(${b.id})">
      <td><div class="cell-name"><div class="mini-avatar">${initials(nomOf(b.client_id))}</div>${esc(nomOf(b.client_id))}</div></td>
      <td style="color:var(--text-faint);font-size:12px;">${esc(b.semaine_label||'')}</td>
      <td class="mono" style="color:var(--text-faint);font-size:12px;">${dateFrOf(b)}</td>
      <td>${b.coach_traite ? `<span class="chip ok"><span class="dot"></span>Traité</span>` : `<span class="chip late"><span class="dot"></span>À traiter</span>`}</td>
      <td class="row-actions" onclick="event.stopPropagation();">${showBtn ? `<button class="btn" onclick="marquerBilanSupaTraite(${b.id})">Marquer traité</button>` : ''}</td>
    </tr>`;
  // Pas de colonne "Statut" ici : tout ce qui apparaît dans cette table est par
  // définition déjà traité — la colonne serait toujours identique et n'apporte
  // rien. À la place, "Traité le" reflète l'ordre de tri (plus récent en haut).
  const rowHtmlTraite = b => `
    <tr style="cursor:pointer;" onclick="openBilanByIdFromRecents(${b.id})">
      <td><div class="cell-name"><div class="mini-avatar">${initials(nomOf(b.client_id))}</div>${esc(nomOf(b.client_id))}</div></td>
      <td style="color:var(--text-faint);font-size:12px;">${esc(b.semaine_label||'')}</td>
      <td class="mono" style="color:var(--text-faint);font-size:12px;">${dateFrOf(b)}</td>
      <td class="mono" style="color:var(--text-faint);font-size:12px;">${dateHeureFrOf(b.coach_traite_at)}</td>
    </tr>`;

  return `
    ${pending.length ? `
    <div class="table-card" style="margin-bottom:16px;">
      <div class="table-toolbar"><div class="title">À traiter <span style="color:var(--critical);font-size:11px;margin-left:6px;">${pending.length}</span></div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Client</th><th>Semaine</th><th>Envoyé le</th><th>Statut</th><th></th></tr></thead>
        <tbody>${pending.map(b => rowHtml(b, true)).join('')}</tbody>
      </table></div>
    </div>` : `<div class="table-card" style="margin-bottom:16px;padding:20px 24px;"><span style="color:var(--success);">✓ Tous les bilans sont traités.</span></div>`}
    ${recentTraited.length ? `
    <div class="table-card">
      <div class="table-toolbar"><div class="title">Traités · 15 derniers jours</div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Client</th><th>Semaine</th><th>Envoyé le</th><th>Traité le</th></tr></thead>
        <tbody>${recentTraited.map(rowHtmlTraite).join('')}</tbody>
      </table></div>
    </div>` : ''}`;
}

function _renderBilansHistorique() {
  if (!bilansHistoClientId) {
    const all = data.bilansAll || [];
    const clientBilanCount = {}, clientLastDate = {};
    all.forEach(b => {
      clientBilanCount[b.client_id] = (clientBilanCount[b.client_id]||0) + 1;
      const d = b.date_validation || (b.created_at ? b.created_at.slice(0,10) : null);
      if (d && (!clientLastDate[b.client_id] || d > clientLastDate[b.client_id])) clientLastDate[b.client_id] = d;
    });
    const rows = data.clients.map(c => {
      const nb = clientBilanCount[c.id]||0;
      const lastFr = clientLastDate[c.id] ? clientLastDate[c.id].split('-').reverse().join('/') : '';
      return `<tr style="cursor:pointer;" onclick="openBilanHistoClient('${c.id}')">
        <td><div class="cell-name"><div class="mini-avatar">${initials(c.nom)}</div>${esc(c.nom)}</div></td>
        <td style="font-size:12px;">${nb} bilan${nb>1?'s':''}</td>
        <td class="mono" style="color:var(--text-faint);font-size:12px;">${esc(lastFr)}</td>
        <td style="color:var(--text-faint);font-size:18px;text-align:right;padding-right:16px;">›</td>
      </tr>`;
    }).join('');
    return `<div class="table-card">
      <div class="table-toolbar"><div class="title">Tous les clients</div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Client</th><th>Bilans envoyés</th><th>Dernier envoi</th><th></th></tr></thead>
        <tbody>${rows||`<tr><td colspan="4" style="text-align:center;color:var(--text-faint);padding:26px;">Aucun bilan.</td></tr>`}</tbody>
      </table></div>
    </div>`;
  }

  const c = data.clients.find(x => x.id === bilansHistoClientId);
  const nom = c ? c.nom : bilansHistoClientId;
  const backBtn = `<button class="fiche-back" style="margin-bottom:16px;" onclick="bilansHistoClientId=null;bilansHistoData={loaded:false,error:null,bilans:[]};renderMain()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    Retour à la liste
  </button>`;
  if (!bilansHistoData.loaded) return `${backBtn}<div style="display:flex;justify-content:center;padding:40px;"><div class="spin"></div></div>`;
  if (bilansHistoData.error) return `${backBtn}<div style="color:var(--critical);padding:16px;">Erreur : ${esc(bilansHistoData.error)}</div>`;
  if (!bilansHistoData.bilans.length) return `${backBtn}<div class="table-card" style="padding:20px 24px;color:var(--text-faint);">Aucun bilan validé pour ${esc(nom)}.</div>`;

  const rows = bilansHistoData.bilans.map((h, idx) => {
    const dateFr = h.date_validation ? h.date_validation.split('-').reverse().join('/') : '—';
    return `<tr style="cursor:pointer;" onclick="openBilanFromHistorique(${idx})">
      <td class="mono" style="font-size:12px;">${esc(h.semaine_label||dateFr)}</td>
      <td class="mono" style="font-size:12px;color:var(--text-faint);">${dateFr}</td>
      <td>${h.coach_traite?`<span class="chip ok"><span class="dot"></span>Traité</span>`:(h.envoye_coach?`<span class="chip late"><span class="dot"></span>À traiter</span>`:`<span class="chip off">Non envoyé</span>`)}</td>
      <td style="color:var(--text-faint);font-size:18px;text-align:right;padding-right:16px;">›</td>
    </tr>`;
  }).join('');

  return `${backBtn}
    <div class="fiche-hero" style="margin-bottom:16px;">
      <div class="fiche-avatar">${initials(nom)}</div>
      <div><div class="fiche-hero-name">${esc(nom)}</div>
        <div style="font-size:12px;color:var(--text-faint);">${bilansHistoData.bilans.length} bilan${bilansHistoData.bilans.length>1?'s':''} validés</div>
      </div>
    </div>
    <div class="table-card">
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Semaine</th><th>Validé le</th><th>Statut</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
}

// ── Détail bilan ──────────────────────────────────────────────────────
function renderBilanDetailPage(el) {
  const c = data.clients.find(x => x.id === bilanDetailState.client);
  const nom = c ? c.nom : bilanDetailState.client;
  const isFiche = _bilanNavSource === 'fiche';
  // Toujours repasser par allerFicheTab (→ openPanel) plutôt que de juste
  // basculer state.nav/ficheTab à la main : un bilan ouvert depuis le
  // dashboard d'accueil n'a jamais chargé ficheData pour ce client, un simple
  // changement d'onglet afficherait une fiche vide/périmée.
  const backAction = isFiche
    ? `allerFicheTab('${bilanDetailState.client}','bilans')`
    : `state.nav='bilans';renderSidebar();renderMain()`;
  const backLabel = isFiche ? 'Retour à la fiche client' : 'Retour aux bilans';
  const svgBack = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>`;
  const svgFwd  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>`;

  const _navDateLabel = (b) => {
    if (!b) return '';
    const iso = b.date_validation || '';
    const dateFr = iso ? iso.split('-').reverse().join('/') : '';
    return dateFr || b.semaine_label || '';
  };
  const hasPrev = _bilanNavList && _bilanNavIdx < _bilanNavList.length - 1;
  const hasNext = _bilanNavList && _bilanNavIdx > 0;
  const prevBilan = hasPrev ? _bilanNavList[_bilanNavIdx + 1] : null;
  const nextBilan = hasNext ? _bilanNavList[_bilanNavIdx - 1] : null;

  const navHtml = (hasPrev || hasNext) ? `
    <div style="display:flex;gap:8px;margin-bottom:4px;">
      ${hasPrev ? `<button class="btn" onclick="bilanNavGo(1)" style="font-size:12px;padding:5px 10px;">${svgBack} ${_navDateLabel(prevBilan)}</button>` : `<div style="flex:1;"></div>`}
      <div style="flex:1;"></div>
      ${hasNext ? `<button class="btn" onclick="bilanNavGo(-1)" style="font-size:12px;padding:5px 10px;">${_navDateLabel(nextBilan)} ${svgFwd}</button>` : ''}
    </div>` : '';

  const backHtml = `<button class="fiche-back" onclick="${backAction}">${svgBack} ${backLabel}</button>`;

  // Fil de navigation rapide : sauter directement vers un autre onglet de la
  // fiche de ce client (Profil, Mensurations, Diète…) sans repasser par
  // "Retour" puis recliquer l'onglet — seulement pertinent si on est bien
  // dans le contexte d'un client (isFiche), pas depuis la liste globale.
  const quickNavHtml = isFiche ? `
    <div class="fiche-tabs" style="border-bottom:none;padding:0;gap:4px;margin:8px 0 4px;flex-wrap:wrap;">
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','profil')">Profil</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','programmes')">Programmes</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','diete')">Diète</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','progression')">Progression</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','notes')">Suivi</button>
      <button class="fiche-tab active" onclick="allerFicheTab('${bilanDetailState.client}','bilans')">Bilans</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','mensurations')">Mensurations</button>
      <button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','roadmap')">Roadmap</button>
      ${c && c.chimieActifSupa ? `<button class="fiche-tab" onclick="allerFicheTab('${bilanDetailState.client}','protocole')">Protocole</button>` : ''}
    </div>` : '';

  if (!bilanDetailState.loaded) {
    el.innerHTML = `${backHtml}${quickNavHtml}
      <div class="fiche-hero"><div class="fiche-avatar">${initials(nom)}</div>
        <div><div class="fiche-hero-name">${esc(nom)}</div><div style="font-size:12px;color:var(--text-faint);">Chargement…</div></div>
      </div>
      <div style="display:flex;justify-content:center;padding:60px;"><div class="spin"></div></div>`;
    return;
  }
  if (bilanDetailState.error) {
    el.innerHTML = `${backHtml}${quickNavHtml}<div style="color:var(--critical);padding:24px;">Erreur : ${esc(bilanDetailState.error)}</div>`;
    return;
  }

  const d = bilanDetailState.data || {};
  const repas = d.repas || [];
  const dateValidation = d.dateValidation || '';
  const semaineLabel = d.semaineLabel || '';
  const weekRange = _weekRange(dateValidation) || semaineLabel;
  // d.jours est toujours stocké Lundi(0)…Dimanche(6) — mais la semaine du bilan se termine
  // le jour_bilan du client (dateValidation), pas forcément dimanche. Sans ça, le tableau
  // affichait toujours "Lundi…Dimanche" alors que l'entête montrait la vraie plage de dates
  // (ex: jeudi→mercredi), ce qui semblait incohérent. On réordonne selon les vraies dates
  // calendaires de la semaine (fin = dateValidation, début = fin - 6 jours) et on attache la
  // date de chaque jour pour affichage — indépendant de jour_bilan, dérivé de dateValidation.
  const jours = _bilanJoursAvecDates(d.jours || [], dateValidation);

  const poidsVals = jours.map(j=>parseFloat(j.poids)).filter(v=>!isNaN(v)&&v>0);
  const avgPoids = poidsVals.length ? (poidsVals.reduce((a,b)=>a+b,0)/poidsVals.length).toFixed(1) : null;
  const eauVals = jours.map(j=>parseFloat(j.eau)).filter(v=>!isNaN(v)&&v>0);
  const avgEau = eauVals.length ? (eauVals.reduce((a,b)=>a+b,0)/eauVals.length).toFixed(1) : null;
  const totalSteps = jours.reduce((s,j)=>s+(parseInt(j.steps)||0),0);
  const joursOkDiete = jours.filter(j=>j.diete).length;
  const joursOkTraining = jours.filter(j=>j.training).length;
  const joursOkCardio = jours.filter(j=>j.cardio).length;
  const repasAvgAdh = repas.length ? Math.round(repas.reduce((s,r)=>s+(r.adhesion||0),0)/repas.length) : null;
  const repasAvgDig = repas.length ? Math.round(repas.reduce((s,r)=>s+(r.digestion||0),0)/repas.length) : null;
  const repasAvgApp = repas.length ? Math.round(repas.reduce((s,r)=>s+(r.appetit||0),0)/repas.length) : null;

  const statCard = (label, val, unit='') => `
    <div class="table-card" style="flex:1;min-width:110px;padding:12px 16px;">
      <div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">${label}</div>
      <div style="font-size:20px;font-weight:700;color:var(--accent);">${val!==null?val+unit:'<span style="color:var(--text-faint);">—</span>'}</div>
    </div>`;
  const tick = v => v ? `<span style="color:var(--success);">✓</span>` : `<span style="color:var(--text-faint);">—</span>`;
  const score = v => { const n=parseInt(v)||0; const col=n>=4?'var(--success)':n>=2?'var(--accent)':'var(--critical)'; return `<span style="font-weight:600;color:${col};">${n}/5</span>`; };

  el.innerHTML = `
    ${backHtml}
    ${quickNavHtml}
    ${navHtml}
    <div class="fiche-hero">
      <div class="fiche-avatar">${initials(nom)}</div>
      <div style="flex:1;min-width:0;">
        <div class="fiche-hero-name">${esc(nom)}</div>
        <div class="fiche-hero-meta">
          <span class="chip off">${weekRange || _semaineFromDate(dateValidation)}</span>
          ${bilanDetailState.coachTraite?`<span class="chip ok"><span class="dot"></span>Traité</span>`:`<span class="chip late"><span class="dot"></span>À traiter</span>`}
        </div>
        ${dateValidation?`<div style="font-size:11px;color:var(--text-faint);margin-top:4px;">Validé le ${esc(dateValidation)}</div>`:''}
        ${bilanDetailState.ts?`<div style="font-size:11px;color:var(--text-faint);">Envoyé le ${esc(bilanDetailState.ts)}</div>`:''}
      </div>

let _bilanDetailPhotosUploading = false;
async function onBilanDetailPhotosSelected(e){
  const files = Array.from(e.target.files || []);

  if (!files.length) return;
  const bilanId = bilanDetailState._supabaseBilanId;
  const clientId = bilanDetailState.client;
  _bilanDetailPhotosUploading = true; renderMain();
  try {
    for (const file of files) {

      bilanDetailState.photos = (bilanDetailState.photos || []).concat([photo]);
    }
  } catch(err) { alert('Erreur envoi photo : ' + err.message); }
  finally { _bilanDetailPhotosUploading = false; if (state.nav==='bilan-detail') renderMain(); }

async function supprimerBilanDetailPhoto(photoId, url){
  if (!confirm('Supprimer cette photo ?')) return;
  try {

    bilanDetailState.photos = (bilanDetailState.photos||[]).filter(p=>p.id!==photoId);
    if (state.nav==='bilan-detail') renderMain();
  } catch(err) { alert('Erreur : ' + err.message); }
}

        <div id="importSheetsBar" style="background:var(--accent);height:100%;width:0%;transition:width .2s;"></div>

    </div>
