// Calcul de charge (formule de Brzycki) — estime le 1RM à partir de la dernière semaine
// loggée du bloc PRÉCÉDENT pour chaque exercice (série la plus lourde de cette semaine-là),
// puis en déduit la charge de départ pour la plage de reps + RIR cible du NOUVEAU bloc.
// Brzycki : 1RM = charge × 36 / (37 − reps_échec) ; reps_échec = reps réellement faites + RIR
// (le RIR = répétitions "en réserve" avant l'échec, donc reps+RIR ≈ le nombre de reps qui
// auraient été possibles à l'échec ce jour-là). Décision du coach : cible = borne HAUTE de la
// plage de reps du nouveau bloc, RIR cible = moyenne de sa plage RIR (approximatif, assumé).
function _parseRepsHaut(s) {
  if (!s) return null;
  const m = String(s).match(/(\d+)\s*-\s*(\d+)/);
  if (m) return parseInt(m[2]);
  const m2 = String(s).match(/^(\d+)$/);
  return m2 ? parseInt(m2[1]) : null; // plages en secondes (ex: "45s-60s") non applicables
}
function _parseRirMoyen(s) {
  if (!s) return 0;
  const m = String(s).match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)/);
  if (m) return (parseFloat(m[1]) + parseFloat(m[2])) / 2;
  const m2 = String(s).match(/^(\d+(?:\.\d+)?)$/);
  return m2 ? parseFloat(m2[1]) : 0;
}
async function cpCalculerCharges(bi){
  const blocPrec = clientProgEnEdition.blocs[bi-1];
  const blocNouveau = clientProgEnEdition.blocs[bi];
  if (!blocPrec) { alert('Aucun bloc précédent.'); return; }
  const prevExosByName = {};
  blocPrec.seances.forEach(s => s.exercices.forEach(ex => { if (ex.id) prevExosByName[(ex.nom||'').toLowerCase()] = ex; }));
  const exoIdsPrec = Object.values(prevExosByName).map(ex => ex.id);
  const manquants = [];
  blocNouveau.seances.forEach(s => s.exercices.forEach(ex => { if (!ex.id) manquants.push(ex.nom); }));
  if (manquants.length) { alert('Enregistre d\'abord le programme (bouton Enregistrer) avant de calculer les charges de ce bloc — certains exercices n\'ont pas encore d\'id.'); return; }
  if (!exoIdsPrec.length) { alert('Bloc précédent vide ou pas encore enregistré.'); return; }
  if (!confirm("Calculer les charges suggérées (semaine 1) de ce bloc à partir de la dernière semaine loggée du bloc précédent ?\n\nLes séries déjà remplies par le client (charge/reps/RIR/commentaire) ne seront jamais écrasées.")) return;

  // Séries déjà loguées par le client en semaine 1 série 1 du NOUVEAU bloc — à ne
  // jamais écraser (ex: le client a validé sa première séance avant que le coach
  // n'ait pensé à lancer le calcul de charges). Un exercice avec au moins un champ
  // rempli (charge, reps, rir OU commentaire) est considéré "déjà logué".
  const exoIdsNouveau = [];
  blocNouveau.seances.forEach(s => s.exercices.forEach(ex => { if (ex.id) exoIdsNouveau.push(ex.id); }));
  const existingRes = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exoIdsNouveau.join(',')})&semaine=eq.1&numero_serie=eq.1&select=client_programme_exercice_id,charge,reps,rir,commentaire`, { headers: supaHeaders() });
  const existingLogs = existingRes.ok ? await existingRes.json() : [];
  const dejaLogueSet = new Set(existingLogs.filter(l => l.charge!=null || l.reps!=null || l.rir!=null || l.commentaire).map(l => l.client_programme_exercice_id));

  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exoIdsPrec.join(',')})&charge=not.is.null&reps=not.is.null`, { headers: supaHeaders() });
  const logs = res.ok ? await res.json() : [];
  const bestLogByExoId = {};
  logs.forEach(l => {
    const cur = bestLogByExoId[l.client_programme_exercice_id];
    if (!cur || l.semaine > cur.semaine || (l.semaine === cur.semaine && (l.charge||0) > (cur.charge||0))) {
      bestLogByExoId[l.client_programme_exercice_id] = l;
    }
  });

  const payload = [];
  let ignores = 0, dejaLogue = 0;
  blocNouveau.seances.forEach(s => s.exercices.forEach(ex => {
    if (dejaLogueSet.has(ex.id)) { dejaLogue++; return; }
    const prevEx = prevExosByName[(ex.nom||'').toLowerCase()];
    const log = prevEx ? bestLogByExoId[prevEx.id] : null;
    if (!log) { ignores++; return; }
    const targetReps = _parseRepsHaut(ex.reps);
    if (!targetReps) { ignores++; return; }
    const targetRir = _parseRirMoyen(ex.rir);
    const oldRir = parseFloat(log.rir) || 0;
    const failureOld = log.reps + oldRir;
    const failureNew = targetReps + targetRir;
    if (failureOld >= 37 || failureNew >= 37) { ignores++; return; } // formule invalide au-delà
    const oneRM = log.charge * 36 / (37 - failureOld);
    const chargeSuggeree = Math.round(oneRM * (37 - failureNew) / 36 * 2) / 2; // arrondi 0.5
    payload.push({ client_programme_exercice_id: ex.id, semaine: 1, numero_serie: 1, charge: chargeSuggeree, reps: targetReps, rir: Math.round(targetRir) });
  }));

  if (!payload.length) {
    alert(dejaLogue ? `Rien à calculer : les ${dejaLogue} exercice(s) de ce bloc ont déjà une série 1 remplie par le client.` : 'Aucune correspondance exploitable avec le bloc précédent (nom identique + log avec charge et reps requis).');
    return;
  }
  await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?on_conflict=client_programme_exercice_id,semaine,numero_serie`, {
    method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }), body: JSON.stringify(payload)
  });
  alert(`${payload.length} charge(s) suggérée(s) écrite(s) en semaine 1 (série 1).`
    + (dejaLogue ? ` ${dejaLogue} déjà loguée(s) par le client, non modifiée(s).` : '')
    + (ignores ? ` ${ignores} ignoré(s) (pas de correspondance ou de log exploitable dans le bloc précédent).` : ''));
}

function cpOnDropExo(e,bi,si,ei){

  const nouveau={
    id:null, exercice_id:exerciceId, nom:ex.nom, groupe_musculaire:ex.groupe_musculaire||null, gif_url:ex.gif_url||null,
    series:null, reps:(blocType&&ex['reps_'+blocType]?ex['reps_'+blocType]:'')||(REPS_PAR_TYPE[blocType]||''),
    repos:(blocType&&ex['repos_'+blocType]?ex['repos_'+blocType]:'')||(REPOS_PAR_TYPE[blocType]||''),

    rir:(blocType&&ex['rir_'+blocType]?ex['rir_'+blocType]:'')||(RIR_PAR_TYPE[blocType]||''), notes:''
  };
  if(ei!==undefined&&ei!==null){
    // Remplacement en place (clic sur le nom) : garde le même id (préserve les logs déjà saisis par le client) + séries/note/lien superset.
    const cible=clientProgEnEdition.blocs[bi].seances[si].exercices[ei];

}

async function sauvegarderProgrammeClient(){
  const cp=clientProgEnEdition;
  if(!cp) return;
  const btn=document.getElementById('clientProgSaveBtn');
  const errEl=document.getElementById('cpErr');
  if(btn){btn.disabled=true;btn.textContent='Enregistrement…';}
  if(errEl) errEl.style.display='none';
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${cp.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({nom:cp.nom,objectif:cp.objectif||null,bloc_actif_id:cp.bloc_actif_id||null})});
    const newBlocIds=[],newSeanceIds=[],newExoIds=[];
    for(let bi=0;bi<cp.blocs.length;bi++){
      const b=cp.blocs[bi];
      if(b.id){
        await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs?id=eq.${b.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({type:b.type||null,nombre_semaines:b.nombre_semaines||null,ordre:bi})});
      } else {
        const r=await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs`,{method:'POST',headers:supaHeaders({Prefer:'return=representation'}),body:JSON.stringify({client_programme_id:cp.id,type:b.type||null,nombre_semaines:b.nombre_semaines||null,ordre:bi})});
        b.id=(await r.json())[0].id;
      }
      newBlocIds.push(b.id);
      for(let si=0;si<b.seances.length;si++){
        const s=b.seances[si];
        if(s.id){
          await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances?id=eq.${s.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({titre:s.titre,ordre:si})});
        } else {
          const r=await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances`,{method:'POST',headers:supaHeaders({Prefer:'return=representation'}),body:JSON.stringify({bloc_id:b.id,titre:s.titre,ordre:si})});
          s.id=(await r.json())[0].id;
        }
        newSeanceIds.push(s.id);
        for(let ei=0;ei<s.exercices.length;ei++){
          const ex=s.exercices[ei];
          if(ex.id){
            await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices?id=eq.${ex.id}`,{method:'PATCH',headers:supaHeaders(),body:JSON.stringify({exercice_id:ex.exercice_id,nom:ex.nom,ordre:ei,series:parseInt(ex.series)||null,reps:ex.reps||null,repos:ex.repos||null,tempo:ex.tempo||null,rir:ex.rir||null,notes:ex.notes||null,superset_groupe:ex.superset_groupe??null})});
          } else {
            const r=await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices`,{method:'POST',headers:supaHeaders({Prefer:'return=representation'}),body:JSON.stringify({seance_id:s.id,exercice_id:ex.exercice_id,nom:ex.nom,ordre:ei,series:parseInt(ex.series)||null,reps:ex.reps||null,repos:ex.repos||null,tempo:ex.tempo||null,rir:ex.rir||null,notes:ex.notes||null,superset_groupe:ex.superset_groupe??null})});
            ex.id=(await r.json())[0].id;
          }
          newExoIds.push(ex.id);
        }
      }
    }
    const removedExos=_origClientProgExoIds.filter(id=>!newExoIds.includes(id));
    for(const id of removedExos) await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices?id=eq.${id}`,{method:'DELETE',headers:supaHeaders()});
    const removedSeances=_origClientProgSeanceIds.filter(id=>!newSeanceIds.includes(id));
    for(const id of removedSeances) await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances?id=eq.${id}`,{method:'DELETE',headers:supaHeaders()});
    const removedBlocs=_origClientProgBlocIds.filter(id=>!newBlocIds.includes(id));
    for(const id of removedBlocs) await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs?id=eq.${id}`,{method:'DELETE',headers:supaHeaders()});
    ficheData.tous_programmes=await chargerTousProgrammes(cp.client_id);
    ficheData.programme=ficheData.tous_programmes.find(p=>p.actif)||null;
    state.nav='fiche-client'; state.selected=cp.client_id; ficheTab='programmes';
    renderSidebar(); renderMain();
  } catch(e){
    if(btn){btn.disabled=false;btn.textContent='Enregistrer';}
    if(errEl){errEl.textContent='Erreur : '+e.message;errEl.style.display='block';}
  }
}

// Ajout/retrait manuel d'XP par le coach — action délibérée à chaque clic,
// pas besoin de dédoublonnage (contrairement au crédit automatique à
// l'envoi d'un bilan, voir bilan.js _crediterXpBilanEnvoye).
// Recalage manuel du dénominateur séances/bilans/assiduité (client_profils
// .date_debut_suivi) — utile pour les clients migrés dont le vrai début de
// coaching (date_debut) précède largement l'historique numérique (bilans/
// logs Supabase), ce qui gonfle artificiellement le nombre de semaines
// attendues et écrase leurs pourcentages. Suggestion pré-remplie = nombre de
// bilans déjà validés (remet le compteur "Bilans" à 100% aujourd'hui), le
// coach peut ajuster le nombre de semaines avant d'appliquer.
function _ficheRecalageAssiduiteHtml(xp) {
  if (!xp) return '';
  const actif = !!xp.dateDebutSuivi;
  const suggestion = Math.max(1, xp.bilansValidies || 1);
  return `<div style="border-top:1px solid var(--hairline);padding-top:14px;margin-top:14px;">
    <div style="font-size:11px;color:var(--text-faint);margin-bottom:8px;">
      ${actif
        ? `Recalage actif depuis le ${new Date(xp.dateDebutSuivi).toLocaleDateString('fr-FR')} (au lieu du ${xp.dateDebut ? new Date(xp.dateDebut).toLocaleDateString('fr-FR') : '—'})`
        : `Dénominateur séances/bilans/assiduité basé sur le début réel du coaching (${xp.dateDebut ? new Date(xp.dateDebut).toLocaleDateString('fr-FR') : '—'}). Pour un client migré dont l'historique numérique est incomplet, recalibrer sur son niveau réel :`}
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input id="recalSemainesInput" type="number" step="1" min="1" value="${suggestion}" style="width:70px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;color:var(--text);font-size:13px;">
      <span style="font-size:12px;color:var(--text-faint);">semaines</span>
      <button class="btn" id="recalAppliquerBtn" onclick="recalibrerAssiduiteClient('${esc(ficheData.profil.client_id || '')}')">Recalibrer</button>
      ${actif ? `<button class="btn" onclick="recalibrerAssiduiteClient('${esc(ficheData.profil.client_id || '')}', true)">Réinitialiser</button>` : ''}
    </div>
  </div>`;
}

async function recalibrerAssiduiteClient(clientId, reset) {
  if (!clientId) return;
  const btn = document.getElementById('recalAppliquerBtn');
  if (!reset) {
    const input = document.getElementById('recalSemainesInput');
    const semaines = parseInt(input && input.value);
    if (isNaN(semaines) || semaines < 1) return;
    if (!confirm(`Recalibrer les compteurs séances/bilans/assiduité de ce client sur ${semaines} semaine(s) ?`)) return;
  }
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    let dateDebutSuivi = null;
    if (!reset) {
      const input = document.getElementById('recalSemainesInput');
      const semaines = parseInt(input.value);
      const d = new Date();
      d.setDate(d.getDate() - (semaines - 1) * 7);
      dateDebutSuivi = d.toISOString().slice(0, 10);
    }
    await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}`, {
      method: 'PATCH',
      headers: supaHeaders(),
      body: JSON.stringify({ date_debut_suivi: dateDebutSuivi })
    });
    ficheData.xpData = await chargerClientProgressionXP(clientId);
    if (state.nav === 'fiche-client' && state.selected === clientId) renderMain();
  } catch(e) {
    alert('Erreur : ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Recalibrer'; }
  }
}

// Version en masse du recalage ci-dessus — boucle sur tous les clients
// (hors coach) qui ont un date_debut, recalcule date_debut_suivi à partir du
// nombre de bilans déjà validés (formule identique, pas de contrôle manuel
// par client). Écrase un recalage manuel déjà posé individuellement — c'est
// un recompute global, pas une fusion. Requêtes légères (select=id / count
// exact) pour ne pas télécharger le JSONB `jours` de tous les bilans.
async function recalibrerAssiduiteTousLesClients() {
  const clients = (data.clients || []).filter(c => !c.estCoach);
  if (!clients.length) { alert('Aucun client.'); return; }
  if (!confirm(`Recalibrer les compteurs séances/bilans/assiduité de ${clients.length} client(s) sur leur nombre réel de bilans validés ? Un recalage déjà posé manuellement pour un client sera écrasé.`)) return;

  let fait = 0, ignores = 0, erreurs = 0;
  for (const c of clients) {
    try {
      const profilRes = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(c.id)}&select=date_debut`, { headers: supaHeaders() });
      const profilArr = profilRes.ok ? await profilRes.json() : [];
      if (!profilArr[0] || !profilArr[0].date_debut) { ignores++; continue; }

      const bilansRes = await fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(c.id)}&envoye_coach=eq.true&date_validation=not.is.null&select=id`, { headers: supaHeaders() });
      const bilansArr = bilansRes.ok ? await bilansRes.json() : [];
      const semaines = Math.max(1, bilansArr.length);
      const d = new Date();
      d.setDate(d.getDate() - (semaines - 1) * 7);
      const dateDebutSuivi = d.toISOString().slice(0, 10);

      const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(c.id)}`, {
        method: 'PATCH',
        headers: supaHeaders(),
        body: JSON.stringify({ date_debut_suivi: dateDebutSuivi })
      });
      if (!patchRes.ok) throw new Error('HTTP ' + patchRes.status);
      fait++;
    } catch(e) { erreurs++; }
  }
  if (ficheData.xpData && state.nav === 'fiche-client') { ficheData.xpData = await chargerClientProgressionXP(state.selected); renderMain(); }
  alert(`Recalage terminé : ${fait} client(s) recalibré(s), ${ignores} ignoré(s) (pas de date_debut), ${erreurs} erreur(s).`);
}

async function ajouterXpClient(clientId) {
  const input = document.getElementById('xpAjoutInput');
  const delta = parseInt(input && input.value);
  if (!clientId || isNaN(delta) || delta === 0) return;
  const btn = document.getElementById('xpAjoutBtn');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    const progRes = await fetch(`${SUPABASE_URL}/rest/v1/client_progression?client_id=eq.${encodeURIComponent(clientId)}&select=xp_total`, { headers: supaHeaders() });
    const progArr = progRes.ok ? await progRes.json() : [];
    const xpActuel = (progArr[0] && progArr[0].xp_total) || 0;
    const nouveauXp = Math.max(0, xpActuel + delta);
    await fetch(`${SUPABASE_URL}/rest/v1/client_progression?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),

    });
    ficheData.xpData = await chargerClientProgressionXP(clientId);
    if (state.nav === 'fiche-client' && state.selected === clientId) renderMain();
  } catch(e) {
    alert('Erreur : ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '+ Ajouter XP'; }
  }
}

async function chargerClientProgressionXP(clientId){
  const [progRes, bilansRes, profilRes, seancesRes] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/client_progression?client_id=eq.${encodeURIComponent(clientId)}`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.asc`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}&select=date_debut,date_debut_suivi,seances_cible`, { headers: supaHeaders() }),
    fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?select=client_programme_exercice_id,semaine&client_programme_exercice_id=in.(select+id+from+client_programme_exercices+where+client_programme_id+in+(select+id+from+client_programmes+where+client_id%3Deq.${encodeURIComponent(clientId)}))`, { headers: supaHeaders() }).catch(()=>({ ok:false }))
  ]);
  const [progRows, bilans, profils] = await Promise.all([
    progRes.ok ? progRes.json() : Promise.resolve([]),
    bilansRes.ok ? bilansRes.json() : Promise.resolve([]),
    profilRes.ok ? profilRes.json() : Promise.resolve([])
  ]);
  const progRow = progRows[0] || {};
  const profil  = profils[0]  || {};
  // xp_total est un compteur stocké, incrémenté uniquement côté serveur à
  // l'envoi d'un bilan (bilan.js, _crediterXpBilanEnvoye), dédoublonné via
  // bilans.xp_credite — jamais recalculé ici. Voir progression.js.
  const xpTotal = progRow.xp_total || 0;
  const bilansValidies = bilans.filter(b => b.envoye_coach && b.date_validation).length;
  let seancesValidees = 0;
  bilans.forEach(b => {
    if (!b.envoye_coach || !b.date_validation) return;
    seancesValidees += (b.jours || []).filter(j=>j.training).length;
  });
  const niveau = _niveauDepuisXp(xpTotal);
  const niveauMaxAtteint = false;
  const xpDebutNiveau = _xpPourNiveau(niveau);
  const xpFinNiveau = _xpPourNiveau(niveau + 1);
  const xpManquant = xpFinNiveau - xpTotal;
  const pct = Math.round((xpTotal - xpDebutNiveau) / (xpFinNiveau - xpDebutNiveau) * 100);
  // 4 = ancien comportement par défaut tant que le coach n'a pas encore
  // assigné d'objectif séances/semaine (client_profils.seances_cible).
  const nbSemaines = (typeof _semainesDepuisDebut === 'function' ? _semainesDepuisDebut(profil.date_debut_suivi || profil.date_debut) : 0) || bilans.length || 1;
  const seancesCible = profil.seances_cible || 4;
  const seancesAttendues = nbSemaines * seancesCible;
  const bilansAttendus = nbSemaines;
  const pctSeances = seancesAttendues > 0 ? Math.min(100, Math.round(seancesValidees / seancesAttendues * 100)) : 0;
  const pctBilans = bilansAttendus > 0 ? Math.min(100, Math.round(bilansValidies / bilansAttendus * 100)) : 0;
  const assiduiteGlobale = Math.round((pctSeances + pctBilans) / 2);
  const titreActif = progRow.titre_actif || null;
  const titreDef = titreActif && typeof TITRES_DEF !== 'undefined' ? TITRES_DEF.find(t=>t.id===titreActif) : null;
  const tier = typeof niveauToTier === 'function' ? niveauToTier(niveau) : 'debutant';
  const tc = typeof getTierColors === 'function' ? getTierColors(tier) : {c1:'#a8b0c8',c2:'#404858',bar:''};
  return { xpTotal, niveau, pct, xpManquant, niveauMaxAtteint, tier, tc, titreDef,
           seancesValidees, seancesAttendues, pctSeances,
           bilansValidies, bilansAttendus, pctBilans, assiduiteGlobale,
           dateDebut: profil.date_debut || null, dateDebutSuivi: profil.date_debut_suivi || null };
}
function progressionChart(vals, color){
  const w=560,h=100,min=Math.min(...vals),max=Math.max(...vals);
  const pts = vals.map((v,i)=>[ (i/(vals.length-1||1))*w, h - ((v-min)/((max-min)||1))*(h-10) - 4 ]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${h*f}" x2="${w}" y2="${h*f}" stroke="var(--hairline)" stroke-width="1"/>`).join('');
  return `<svg class="bigchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" opacity="0.18"/>
  </svg>`;
}
function renderProgressionTab(){

function ageDepuisDate(dateStr){
  if (!dateStr) return null;
  const naissance = new Date(dateStr);
  if (isNaN(naissance)) return null;
  const auj = new Date();
  let age = auj.getFullYear() - naissance.getFullYear();
  const m = auj.getMonth() - naissance.getMonth();
  if (m < 0 || (m === 0 && auj.getDate() < naissance.getDate())) age--;
  return age;
}
function renderFicheTab(){
  const f = panelFiche || {};
  const age = ageDepuisDate(f.date_naissance);

function toggleMenu(ev, id){
  ev.stopPropagation();
  const target = document.getElementById('menu-'+id);

  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  if (!wasOpen) target.classList.add('open');
}

// Le badge de la cloche ne doit pas rester bloqué à un chiffre qui ne baisse
// jamais tant que les bilans/retards sous-jacents ne sont pas réellement
// traités par le coach — "ouvrir la cloche" doit pouvoir la faire disparaître
// (comme n'importe quelle appli), sans pour autant modifier l'état réel des
// bilans (ça, c'est le rôle du bouton "Marquer traité" dans le détail bilan).
// On distingue donc deux choses : la liste (toujours le vrai "à traiter" actuel)
// et le badge (compte seulement les éléments jamais encore "vus" en ouvrant la
// cloche, mémorisé par clé stable dans localStorage).
function _notifSeenKeys(){
  try { return new Set(JSON.parse(localStorage.getItem('at_notif_seen_keys') || '[]')); } catch(e) { return new Set(); }
}
function _notifMarquerVues(keys){
  const seen = _notifSeenKeys();
  keys.forEach(k => seen.add(k));
  try { localStorage.setItem('at_notif_seen_keys', JSON.stringify([...seen])); } catch(e) {}
}

function renderNotifMenu(){
  const bilans = data.bilansCoach.filter(b=>!b.coachTraite).slice(0,3);
  const retards = data.clients.filter(c=>c.enRetard).slice(0,3);
  const items = [
    ...bilans.map(b => `<div class="menu-item" style="align-items:flex-start;flex-direction:column;gap:1px;"><b>${esc(b.nom)}</b><span style="color:var(--text-faint);font-size:11.5px;">bilan à traiter · semaine ${esc(b.semaine||'')}</span></div>`),
    ...retards.map(c => `<div class="menu-item" style="align-items:flex-start;flex-direction:column;gap:1px;"><b>${esc(c.nom)}</b><span style="color:var(--text-faint);font-size:11.5px;">bilan en retard</span></div>`),
  ];
  const menu = document.getElementById('menu-notif');
  menu.innerHTML = `<div class="menu-label">À traiter</div>` + (items.length ? items.join('') : `<div class="menu-item" style="color:var(--text-faint);">Rien à signaler.</div>`);
  const keys = [...bilans.map(b => 'bilan:'+b.client+'|'+b.ts), ...retards.map(c => 'retard:'+c.id)];
  menu.dataset.keys = JSON.stringify(keys);
  const seen = _notifSeenKeys();
  const nonVus = keys.filter(k => !seen.has(k)).length;
  const badge = document.getElementById('notifCount');
  if (nonVus) { badge.style.display='flex'; badge.textContent = nonVus; } else { badge.style.display='none'; }
}

function ouvrirClocheNotifConsole(ev){
  toggleMenu(ev, 'notif');
  const menu = document.getElementById('menu-notif');
  let keys = [];
  try { keys = JSON.parse(menu.dataset.keys || '[]'); } catch(e) {}
  if (keys.length) {
    _notifMarquerVues(keys);
    const badge = document.getElementById('notifCount');
    if (badge) badge.style.display = 'none';
  }
}

// Signature de contenu d'un template déjà chargé via chargerTemplateArbo (programme_blocs bruts,
// exercice_id seulement — passe par exercicesData pour retrouver le nom, comme partout ailleurs).
function _progSignatureFromTemplateBlocs(blocsArbo){
  const seances = (blocsArbo||[]).flatMap(b => (b.programme_seances||[]).map(s => ({
    exercices: (s.programme_seance_exercices||[]).map(ex => {
      const exData = (exercicesData||[]).find(e=>e.id===ex.exercice_id);
      return { nom: exData ? exData.nom : '', series: ex.series };
    }),
  })));
  return _progContentSignature(seances);
}
// Signature de contenu d'un programme client déjà chargé avec ses blocs/séances/exercices imbriqués
// (client_programme_exercices a directement `nom`, pas besoin de exercicesData ici).
function _progSignatureFromClientBlocs(blocs){
  const seances = (blocs||[]).flatMap(b => (b.client_programme_seances||[]).map(s => ({
    exercices: (s.client_programme_exercices||[]).map(ex => ({ nom: ex.nom, series: ex.series })),
  })));
  return _progContentSignature(seances);
}

// ── Voir les assignés d'un template programme ─────────────────────────
// Retrouve les clients par source_template_id (lien stable, posé à l'assignation — voir
// assignerTemplateAuClient et sql/2026-08-10_source_template_id.sql) — plus par nom en secours
// pour les assignations faites AVANT ce champ. Le lien par nom seul cassait dès qu'un programme
// était renommé côté client ou coach (bug signalé par le coach) ; source_template_id ne bouge
// jamais, même si le nom change. Un badge "modifié" s'affiche si le contenu actuel du client a
// divergé du template (comparaison de signature, mêmes exercices/ordre/séries) — le client reste
// dans la liste plutôt que d'en disparaître silencieusement.
async function ouvrirAssignesTemplate(templateId, templateNom){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal-box"><h3>Assignés — ${esc(templateNom)}</h3><div style="text-align:center;padding:20px;color:var(--text-faint);">Chargement…</div></div>`;
  document.body.appendChild(overlay);
  try {
    if (exercicesData === null) exercicesData = await chargerExercices();
    const [resRows, blocsArboTpl] = await Promise.all([
      fetch(
        `${SUPABASE_URL}/rest/v1/client_programmes?or=(source_template_id.eq.${templateId},nom.eq.${encodeURIComponent(templateNom)})&order=created_at.desc` +
        `&select=*,client_programme_blocs!client_programme_blocs_client_programme_id_fkey(id,client_programme_seances(id,client_programme_exercices(id,nom,series)))`,
        { headers: supaHeaders() }
      ).then(r => r.ok ? r.json() : []),
      chargerTemplateArbo(templateId),
    ]);
    const rows = resRows;
    const tplSignature = _progSignatureFromTemplateBlocs(blocsArboTpl);
    const box = overlay.querySelector('.modal-box');
    if (!rows.length){
      box.innerHTML = `<h3>Assignés — ${esc(templateNom)}</h3><div class="fiche-prog-empty" style="text-align:center;padding:20px;">Aucun client n'a ce programme assigné.</div><div class="modal-actions"><button class="btn" onclick="this.closest('.modal-overlay').remove()">Fermer</button></div>`;
      return;
    }
    const clientsMap = {};
    data.clients.forEach(c => { clientsMap[c.id] = c.nom; });
    box.innerHTML = `<h3>Assignés — ${esc(templateNom)}</h3>
      ${rows.map(p=>{
        const divergent = _progSignatureFromClientBlocs(p.client_programme_blocs) !== tplSignature;
        return `
        <div class="prog-row" style="cursor:default;" onclick="this.closest('.modal-overlay').remove();openPanel('${p.client_id}');setFicheTab('programmes');">
          <div class="mini-avatar">${initials(clientsMap[p.client_id]||p.client_id)}</div>
          <div style="flex:1;min-width:0;">
            <div class="p-nom">${esc(clientsMap[p.client_id]||p.client_id)}${divergent ? ' <span class="chip off" style="font-size:9.5px;padding:1px 6px;">✎ modifié</span>' : ''}</div>
            <div class="p-meta">Assigné le ${p.created_at ? new Date(p.created_at).toLocaleDateString('fr-FR') : '—'}</div>
          </div>
          ${p.actif ? '<span class="chip ok"><span class="dot"></span>Actif</span>' : '<span class="chip off">Inactif</span>'}
        </div>`;}).join('')}
      <div class="modal-actions"><button class="btn" onclick="this.closest('.modal-overlay').remove()">Fermer</button></div>`;
  } catch(e){
    overlay.querySelector('.modal-box').innerHTML = `<h3>Erreur</h3><div>${esc(e.message)}</div><div class="modal-actions"><button class="btn" onclick="this.closest('.modal-overlay').remove()">Fermer</button></div>`;
  }
}

async function chargerDieteTemplates(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?client_only=eq.false&order=nom.asc&select=*,repas(id,nom,ordre,repas_aliments(id,nom,unite,quantite_g,kcal_par_100g,prot_par_100g,glu_par_100g,lip_par_100g))`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}

// Colonnes stockées "pour 100g" (2026-08-02) — diviseur 100 pour les
// aliments au poids (unite='g', défaut), 1 pour les aliments par
// unité/portion (jamais multipliés par 100 en base).
function macrosDiete(repasArr){
  let kcal=0, prot=0, glu=0, lip=0;
  (repasArr||[]).forEach(r => (r.repas_aliments||[]).forEach(a => {
    const q = parseFloat(a.quantite_g)||0;
    const d = (a.unite||'g')==='g' ? 100 : 1;
    kcal += q * (parseFloat(a.kcal_par_100g)||0) / d;
    prot += q * (parseFloat(a.prot_par_100g)||0) / d;
    glu  += q * (parseFloat(a.glu_par_100g)||0) / d;
    lip  += q * (parseFloat(a.lip_par_100g)||0) / d;
  }));
  return { kcal:Math.round(kcal), prot:Math.round(prot), glu:Math.round(glu), lip:Math.round(lip) };
}

// ── Éditeur de template diète ─────────────────────────────────────────
// `slot` ('A'/'B') identifie quel côté on édite en mode comparaison
// (voir plus bas "Comparer 2 diètes") — undefined/null = éditeur classique
// à une seule diète (dieteTplEnEdition), comportement inchangé. Toutes les
// fonctions de mutation ci-dessous acceptent ce paramètre en dernière
// position, jamais requis par les appels déjà existants.
function _dieteEnEdition(slot){ return slot ? _dieteCompare[slot] : dieteTplEnEdition; }
function _slotSuffix(slot){ return slot ? '-'+slot : ''; }
function _reRenderDieteEditeur(slot){ _updateRepasBlocsDom(slot); }

async function ouvrirEditeurDiete(id){
  _dietNavBack = 'dietes';

// _updateAlimentsDom (édition d'un aliment) ET _updateRepasBlocsDom (ajout/suppression/
// duplication d'un repas entier) pour ne jamais dupliquer ce template.
function _updateDieteTotalsDom(slot){
  const sfx = _slotSuffix(slot);
  const tpl = _dieteEnEdition(slot);
  const totalM = macrosDiete(tpl.repas.filter(r=>(r.variante_index||0)===0).map(r=>({ repas_aliments:r.aliments })));

  if (tot) tot.innerHTML = totalM.kcal ? `
    <div><div style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--accent);">${totalM.kcal}</div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;">kcal</div></div>

// Rendu partagé des blocs "repas" d'une diète, factorisé pour être réutilisé
// à l'identique par l'éditeur classique (slot=undefined) ET par chaque
// colonne du mode "Comparer 2 diètes" (slot='A'/'B') — voir plus bas.
function _renderDieteBlocsHtml(slot){
  const tpl = _dieteEnEdition(slot);
  const slotArg = slot ? `,'${slot}'` : '';
  const slotArgFirst = slot ? `'${slot}'` : '';
  const grouped = {};
  tpl.repas.forEach((r,ri) => {
    const o = r.ordre != null ? r.ordre : ri;
    if (!grouped[o]) grouped[o] = [];
    grouped[o].push({ ...r, _ri:ri });
  });
  const ordres = Object.keys(grouped).map(Number).sort((a,b)=>a-b);

  return ordres.map((ordre, gi) => {
    // Le standard (variante_index=0) toujours en tête, puis les équivalents dans leur
    // ordre — sinon un repas promu standard après suppression du standard d'origine (cf.
    // supprimerRepas) resterait affiché à sa position d'insertion d'origine, potentiellement
    // après un autre équivalent encore marqué "≡ ÉQUIVALENT", ce qui serait déroutant.
    const variants = grouped[ordre].slice().sort((a,b) => (a.variante_index||0)-(b.variante_index||0));
    const blocksHtml = variants.map(r => {
      const ri = r._ri;
      const isVariante = (r.variante_index||0) > 0;
      return `
      <div class="repas-block" style="${isVariante ? 'margin-left:16px;border-left:3px solid #a78bfa;padding-left:4px;background:linear-gradient(90deg,#a78bfa1f,var(--surface-2) 24px);' : ''}">
        <div class="repas-head">
          ${isVariante ? `<span style="font-size:10px;font-weight:700;color:#a78bfa;background:#a78bfa26;border:1px solid #a78bfa66;border-radius:5px;padding:2px 7px;margin-right:6px;flex-shrink:0;white-space:nowrap;letter-spacing:.03em;">≡ ÉQUIVALENT</span>` : `<span class="drag-handle" draggable="true" ondragstart="repasOnDragStart(event,${gi}${slotArg})" ondragend="repasOnDragEnd()" title="Glisser pour réordonner ce repas">⠿</span>`}
          <input type="text" value="${esc(r.nom)}" onchange="_dieteEnEdition(${slotArgFirst||'null'}).repas[${ri}].nom=this.value" style="flex:1;background:var(--surface-3);border:1px solid transparent;border-radius:var(--radius-sm);padding:4px 8px;color:var(--text);font-size:${isVariante?'12':'13'}px;font-weight:700;font-family:inherit;">
          <button class="icon-btn" style="width:22px;height:22px;flex-shrink:0;" onclick="dupliquerRepas(${ri}${slotArg})" title="Dupliquer en équivalence (garde les mêmes aliments)">${iCopy()}</button>
          <button class="icon-btn" style="width:22px;height:22px;flex-shrink:0;" onclick="supprimerRepas(${ri}${slotArg})">${iTrash()}</button>
        </div>
        <div style="padding:2px 14px 6px;">
          <textarea rows="1" data-repas-comment placeholder="💬 Commentaire pour le client (ex: ajouter de la levure)" oninput="rmAutoGrow(this);_dieteEnEdition(${slotArgFirst||'null'}).repas[${ri}].commentaire=this.value" style="width:100%;background:transparent;border:1px dashed var(--hairline);border-radius:var(--radius-sm);padding:5px 8px;color:var(--text-muted);font-size:12px;font-family:inherit;box-sizing:border-box;resize:none;overflow:hidden;min-height:30px;">${esc(r.commentaire||'')}</textarea>
        </div>
        <div id="alim-list-${ri}${_slotSuffix(slot)}">${_renderAlimListHtml(ri, slot)}</div>
        <div style="padding:8px 14px;">
          <button class="btn" style="font-size:11.5px;padding:5px 10px;width:100%;" onclick="ouvrirAjoutAliment(${ri}${slotArg})">+ Ajouter des aliments</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="repas-group" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="repasOnDrop(event,${gi}${slotArg})">
      ${blocksHtml}
      <div style="padding:0 0 10px ${variants.length>1?'16':'0'}px;">
        <button class="btn" style="font-size:11px;padding:4px 10px;color:var(--accent);" onclick="ajouterVarianteRepas(${ordre}${slotArg})">≡ + Variante</button>
      </div>
    </div>`;
  }).join('');
}

// Renomme chaque repas "Repas N" (+ suffixe préservé : " (équivalent)", " (variante)"...)
// pour refléter sa position réelle après glisser-déposer/ajout/suppression — même principe
// que _renumeroterSeances côté programmes. Un repas et TOUS ses équivalents (même `ordre`)
// reçoivent le même numéro N, puisqu'ils représentent le même emplacement. Un nom qui ne
// suit pas ce motif (renommé librement par le coach) est laissé intact.
function _renumeroterRepas(tpl){
  const grouped = {};
  tpl.repas.forEach((r,ri) => { const o = r.ordre != null ? r.ordre : ri; (grouped[o]=grouped[o]||[]).push(ri); });
  const ordres = Object.keys(grouped).map(Number).sort((a,b)=>a-b);
  ordres.forEach((o, i) => {
    grouped[o].forEach(ri => {
      const r = tpl.repas[ri];
      const m = /^Repas\s+\d+(.*)$/i.exec((r.nom||'').trim());
      if (m) r.nom = 'Repas ' + (i+1) + (m[1]||'');
    });
  });
}

function ajouterRepas(slot){
  const tpl = _dieteEnEdition(slot);
  const maxOrdre = tpl.repas.reduce((m,r) => Math.max(m, r.ordre != null ? r.ordre : 0), -1);
  tpl.repas.push({ nom:`Repas ${maxOrdre+2}`, ordre:maxOrdre+1, variante_index:0, aliments:[] });
  _renumeroterRepas(tpl);
  _reRenderDieteEditeur(slot);
}

function ajouterVarianteRepas(ordre, slot){
  ordre = parseInt(ordre);
  const tpl = _dieteEnEdition(slot);
  const existing = tpl.repas.filter(r => (r.ordre != null ? r.ordre : 0) === ordre);
  const maxVariante = existing.reduce((m,r) => Math.max(m, r.variante_index||0), 0);
  const mainNom = (existing.find(r=>(r.variante_index||0)===0)||existing[0]||{}).nom || 'Repas';
  tpl.repas.push({ nom:mainNom+' (variante)', ordre, variante_index:maxVariante+1, aliments:[] });
  _reRenderDieteEditeur(slot);
}

// Duplique un repas en équivalence du même emplacement (même ordre), avec une copie
// indépendante de ses aliments — pratique pour ne remplacer qu'un aliment (ex: riz →
// pomme de terre) sans ressaisir tout le reste (poulet, huile, haricots...).
function dupliquerRepas(ri, slot){
  const tpl = _dieteEnEdition(slot);
  const src = tpl.repas[ri];
  const ordre = src.ordre != null ? src.ordre : 0;
  const existing = tpl.repas.filter(r => (r.ordre != null ? r.ordre : 0) === ordre);
  const maxVariante = existing.reduce((m,r) => Math.max(m, r.variante_index||0), 0);
  tpl.repas.push({
    nom: src.nom + ' (équivalent)',
    ordre,
    variante_index: maxVariante + 1,
    aliments: src.aliments.map(a => ({ ...a }))
  });
  _reRenderDieteEditeur(slot);
}

// Supprimer le repas STANDARD (variante_index=0) d'un emplacement qui a des équivalents ne
// supprime pas les équivalents — l'équivalent restant le plus proche (variante_index le plus
// bas) est promu standard à sa place (variante_index→0), les autres équivalents éventuels sont
// renumérotés à la suite (1, 2, 3…). Supprimer un équivalent (pas le standard) ne touche pas
// aux autres — demande explicite du coach (2026-08-09) : ne jamais perdre un repas équivalent
// par ricochet en supprimant juste le standard.
function supprimerRepas(ri, slot){
  const tpl = _dieteEnEdition(slot);
  const removed = tpl.repas[ri];
  tpl.repas.splice(ri, 1);
  if (removed && (removed.variante_index||0) === 0) {
    const ordre = removed.ordre != null ? removed.ordre : 0;
    const siblings = tpl.repas
      .filter(r => (r.ordre != null ? r.ordre : 0) === ordre)
      .sort((a,b) => (a.variante_index||0) - (b.variante_index||0));
    siblings.forEach((r, i) => { r.variante_index = i; });
  }
  _renumeroterRepas(tpl);
  _reRenderDieteEditeur(slot);
}

// Réordonner les repas (groupes ordre, variantes comprises) par glisser-déposer
// de la poignée du repas principal. gi = index dans le tableau `ordres` trié au
// moment du render — recalculé ici à l'identique pour rester valide après un drop.
// `slot` empêche un drag commencé sur une colonne de "sauter" vers l'autre en
// mode comparaison (deux diètes indépendantes, jamais mélangées).
let _dietDragRepasSource = null;
function repasOnDragStart(e, gi, slot){ _dietDragRepasSource = {gi, slot: slot||null}; e.dataTransfer.effectAllowed = 'move'; }
function repasOnDragEnd(){ _dietDragRepasSource = null; }
function repasOnDrop(e, targetGi, slot){
  e.preventDefault();
  const src = _dietDragRepasSource; _dietDragRepasSource = null;
  if (!src || src.slot !== (slot||null) || src.gi === targetGi) { _reRenderDieteEditeur(slot); return; }
  const srcGi = src.gi;
  const tpl = _dieteEnEdition(slot);
  const grouped = {};
  tpl.repas.forEach((r,ri) => { const o = r.ordre != null ? r.ordre : ri; (grouped[o]=grouped[o]||[]).push(ri); });
  const ordres = Object.keys(grouped).map(Number).sort((a,b)=>a-b);
  const [movedOrdre] = ordres.splice(srcGi, 1);
  ordres.splice(srcGi < targetGi ? targetGi - 1 : targetGi, 0, movedOrdre);
  // Renumérote 0..N-1 dans le nouvel ordre — tous les repas d'un même groupe
  // (variantes incluses) reçoivent le même nouvel ordre pour rester ensemble.
  ordres.forEach((oldOrdre, i) => { grouped[oldOrdre].forEach(ri => { tpl.repas[ri].ordre = i; }); });
  _renumeroterRepas(tpl);
  _reRenderDieteEditeur(slot);
}

function supprimerAlimentDiete(ri, ai, slot){
  _dieteEnEdition(slot).repas[ri].aliments.splice(ai,1);
  _updateAlimentsDom(ri, slot);
}

// Grammage éditable inline — parseFloat avec remplacement virgule→point (clavier
// iOS en locale FR insère une virgule comme séparateur décimal, cf. programme-client.js).
function alimChangerQuantite(ri, ai, valeur, slot){
  const q = parseFloat((valeur+'').replace(',','.'));
  const a = _dieteEnEdition(slot).repas[ri].aliments[ai];
  const ancien = a.quantite_g;
  a.quantite_g = isNaN(q) ? 0 : q;
  // Aliment déjà existant (a un id) dont le grammage change réellement : on
  // coche automatiquement "modifié" — le coach peut décocher s'il ne veut pas
  // afficher la pastille côté client.
  if (a.id != null && ancien !== a.quantite_g) a.modifie = true;
  _updateAlimentsDom(ri, slot);
}

function alimToggleModifie(ri, ai, checked, slot){
  _dieteEnEdition(slot).repas[ri].aliments[ai].modifie = checked;
}

// Décoche en masse tous les aliments "modifié" (pastille visible côté client) — demandé par le
// coach pour repartir à zéro en début de semaine plutôt que de décocher case par case les
// ajustements accumulés des semaines précédentes. Ne sauvegarde rien tant que le coach ne clique
// pas "Enregistrer" (même logique que toute autre édition en mémoire de cet éditeur).
function _reinitialiserModifieDiete(slot){
  const tpl = _dieteEnEdition(slot);
  if (!tpl) return;
  let n = 0;
  (tpl.repas||[]).forEach(r => (r.aliments||[]).forEach(a => { if (a.modifie) { a.modifie = false; n++; } }));
  if (!n) return;
  _reRenderDieteEditeur(slot);
}

// Réordonner les aliments d'un repas par glisser-déposer — même pattern que
// cpOnDragStartExo/cpOnDropExo (éditeur programme), limité à l'intérieur d'un
// même repas (pas de drag entre deux repas différents, ni entre deux colonnes
// en mode comparaison).
let _dietDragAlimSource = null;
function alimOnDragStart(e, ri, ai, slot){ _dietDragAlimSource = {ri, ai, slot: slot||null}; e.dataTransfer.effectAllowed = 'move'; }
function alimOnDragEnd(){ _dietDragAlimSource = null; }
function alimOnDrop(e, ri, ai, slot){
  e.preventDefault();
  const src = _dietDragAlimSource; _dietDragAlimSource = null;
  if (!src || src.ri !== ri || src.ai === ai || src.slot !== (slot||null)) { _updateAlimentsDom(ri, slot); return; }
  const arr = _dieteEnEdition(slot).repas[ri].aliments;
  const [moved] = arr.splice(src.ai, 1);
  arr.splice(src.ai < ai ? ai - 1 : ai, 0, moved);
  _updateAlimentsDom(ri, slot);
}

              <div class="alim-pick-macros">${Math.round(a.kcal_par_100g||0)} kcal · P${Math.round((a.prot_par_100g||0)*10)/10} G${Math.round((a.glu_par_100g||0)*10)/10} L${Math.round((a.lip_par_100g||0)*10)/10}<span style="font-size:9px;color:var(--text-faint);margin-left:3px;">${a.unite&&a.unite!=='g'?'/'+a.unite:'/100g'}</span></div>
            </div>`).join('')}
          ${baseList.length===0&&alimentsCoachData!==null?`<div style="text-align:center;padding:20px;color:var(--text-faint);">Base vide — ajoute des aliments depuis la page "Base alimentaire".</div>`:''}
        </div>
        <div id="picker-flash" style="font-size:11.5px;color:var(--success);min-height:18px;transition:opacity .4s;opacity:0;margin-top:6px;"></div>
      ` : ajoutAlimTab === 'off' ? `
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <input id="aOffSearch" type="text" placeholder="Rechercher (ex: riz complet)…" style="flex:1;font-size:16px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-family:inherit;"
            onkeydown="if(event.key==='Enter')_rechercherOFF()">
          <button class="btn primary" onclick="_rechercherOFF()">Chercher</button>
        </div>
        <div class="alim-pick-list" id="aOffList"><div style="text-align:center;padding:20px;color:var(--text-faint);">Lance une recherche pour voir les résultats.</div></div>
        <div id="picker-flash" style="font-size:11.5px;color:var(--success);min-height:18px;transition:opacity .4s;opacity:0;margin-top:6px;"></div>
      ` : `
        <div id="picker-flash" style="font-size:11.5px;color:var(--success);min-height:18px;transition:opacity .4s;opacity:0;margin-bottom:4px;"></div>
        <div class="field-row"><label>Nom</label><input id="aNom" type="text" placeholder="ex: Riz complet cuit" style="font-size:16px;"></div>
        <div class="field-row"><label>Quantité (g)</label><input id="aQte" type="number" min="1" value="100" style="font-size:16px;"></div>
        <p style="font-size:11.5px;color:var(--text-faint);margin:0 0 8px;">Valeurs pour 100g</p>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;">
          <div class="field-row" style="margin:0;"><label>Kcal</label><input id="aKcal" type="number" min="0" step="0.1" placeholder="0" style="font-size:16px;"></div>
          <div class="field-row" style="margin:0;"><label>Prot</label><input id="aProt" type="number" min="0" step="0.1" placeholder="0" style="font-size:16px;"></div>
          <div class="field-row" style="margin:0;"><label>Gluc</label><input id="aGlu" type="number" min="0" step="0.1" placeholder="0" style="font-size:16px;"></div>
          <div class="field-row" style="margin:0;"><label>Lip</label><input id="aLip" type="number" min="0" step="0.1" placeholder="0" style="font-size:16px;"></div>
        </div>
        <div id="aErr" style="display:none;color:var(--critical);font-size:12px;margin-bottom:8px;"></div>
        <button class="btn primary" style="width:100%;margin-bottom:8px;" onclick="confirmerAjoutAliment()">+ Ajouter cet aliment</button>
      `}
      <div class="modal-actions" style="margin-top:8px;border-top:1px solid var(--hairline);padding-top:10px;">
        <span style="font-size:12px;color:var(--text-faint);">${_ajoutAlimCount > 0 ? `${_ajoutAlimCount} ajouté${_ajoutAlimCount>1?'s':''}` : ''}</span>
        <button class="btn primary" onclick="document.getElementById('modal-ajout-aliment').remove()">✓ Terminer</button>
      </div>
    </div>`;

  if (ajoutAlimTab === 'base' && alimentsCoachData === null && !alimentsCoachErr){
    chargerAlimentsCoach()
      .then(d => { alimentsCoachData = d; _renderModalAjoutAliment(); })
      .catch(e => { alimentsCoachErr = e.message; _renderModalAjoutAliment(); });
  }
  if (ajoutAlimTab === 'base') setTimeout(()=>document.getElementById('aBaseSearch')?.focus(), 50);
  if (ajoutAlimTab === 'off') setTimeout(()=>document.getElementById('aOffSearch')?.focus(), 50);
  if (ajoutAlimTab === 'manuel') setTimeout(()=>document.getElementById('aNom')?.focus(), 50);
}

function _filtrerBaseAlim(q){
  const list = document.getElementById('aBaseList');
  if (!list || !alimentsCoachData) return;
  const ql = q.toLowerCase();
  const filtered = ql ? alimentsCoachData.filter(a=>a.nom.toLowerCase().includes(ql)) : alimentsCoachData;
  list.innerHTML = filtered.map(a => `
    <div class="alim-pick-row" onclick="_selectionnerAlimBase(${a.id})">
      <div>
        <div class="alim-pick-nom">${esc(a.nom)}</div>
        ${a.categorie?`<div style="font-size:10.5px;color:var(--text-faint);">${esc(a.categorie)}</div>`:''}
      </div>
      <div class="alim-pick-macros">${Math.round(a.kcal_par_100g||0)} kcal · P${Math.round((a.prot_par_100g||0)*10)/10} G${Math.round((a.glu_par_100g||0)*10)/10} L${Math.round((a.lip_par_100g||0)*10)/10}</div>
    </div>`).join('') || `<div style="text-align:center;padding:20px;color:var(--text-faint);">Aucun résultat.</div>`;
}

function _selectionnerAlimBase(id){
  const a = alimentsCoachData.find(x=>x.id===id);
  if (!a) return;
  _ouvrirSaisieQuantite(a.nom, a.kcal_par_100g, a.prot_par_100g, a.glu_par_100g, a.lip_par_100g, a.unite||'g');
}

async function _rechercherOFF(){
  const q = document.getElementById('aOffSearch').value.trim();
  if (!q) return;
  const listEl = document.getElementById('aOffList');
  listEl.innerHTML = `<div style="text-align:center;padding:20px;"><div class="spin" style="margin:auto;"></div></div>`;
  try {
    const results = await rechercherOpenFoodFacts(q);
    if (!results.length){ listEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-faint);">Aucun résultat.</div>`; return; }
    listEl.innerHTML = results.map((r,i) => `
      <div class="alim-pick-row" onclick="_selectionnerOFF(${i})" data-off-idx="${i}">
        <div class="alim-pick-nom">${esc(r.nom)}</div>
        <div class="alim-pick-macros">${Math.round((r.kcal||0)*100)} kcal · P${Math.round((r.prot||0)*100)} G${Math.round((r.glu||0)*100)} L${Math.round((r.lip||0)*100)}</div>
      </div>`).join('');
    listEl._offResults = results;
  } catch(e){ listEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--critical);">Erreur : ${esc(e.message)}</div>`; }
}

function _selectionnerOFF(idx){
  const listEl = document.getElementById('aOffList');
  const r = listEl?._offResults?.[idx];
  if (!r) return;
  _ouvrirSaisieQuantite(r.nom, r.kcal, r.prot, r.glu, r.lip);
}

// Bande de macros pour LA QUANTITÉ SAISIE (pas une référence statique "/100g"
// figée) — recalculée à chaque frappe dans le champ quantité (voir
// _majMacroBandSelection) : demande explicite du coach, "je change le
// chiffre, les calories ne bougent pas".
// kcal100/prot100/glu100/lip100 : valeurs "pour 100g" (aliment au poids) ou
// "par portion" (aliment unité) selon `unite` — jamais "par gramme" — c'est
// exactement le format stocké en base (colonnes _par_100g), donc aucune
// conversion à l'écriture (voir _confirmerAlimSelectionne).
function _macroBandSelectionHtml(kcal100, prot100, glu100, lip100, qte, diviseur, uniteLabel){
  const f = v => (v||0)*qte/diviseur;
  return `
    <div><div class="mk">Kcal</div><div class="mn">${Math.round(f(kcal100))}</div><div class="mu">${uniteLabel}</div></div>
    <div><div class="mk">Prot</div><div class="mn">${Math.round(f(prot100)*10)/10}g</div><div class="mu">${uniteLabel}</div></div>
    <div><div class="mk">Gluc</div><div class="mn">${Math.round(f(glu100)*10)/10}g</div><div class="mu">${uniteLabel}</div></div>
    <div><div class="mk">Lip</div><div class="mn">${Math.round(f(lip100)*10)/10}g</div><div class="mu">${uniteLabel}</div></div>`;
}

function _majMacroBandSelection(kcal100, prot100, glu100, lip100, diviseur, uniteLabel){
  const band = document.getElementById('aSelMacroBand');
  if (!band) return;
  const qte = parseFloat(document.getElementById('aQteSelected')?.value) || 0;
  band.innerHTML = _macroBandSelectionHtml(kcal100, prot100, glu100, lip100, qte, diviseur, uniteLabel);
}

function _ouvrirSaisieQuantite(nom, kcal100, prot100, glu100, lip100, unite){
  unite = unite || 'g';
  const isG = unite === 'g';
  const diviseur = isG ? 100 : 1;
  const qteLabel = unite === 'unite' ? "Nombre d'unités" : unite === 'portion' ? 'Nombre de portions' : (isG ? 'Quantité (g)' : 'Nombre de ' + unite + 's');
  const qteDefault = isG ? 100 : 1;
  const uniteLabel = 'pour cette quantité';
  // Nom JS-échappé (apostrophes) une seule fois — un aliment comme "Huile
  // d'olive" cassait silencieusement les boutons Ajouter/Entrée sans cet
  // échappement (l'apostrophe fermait prématurément la chaîne JS de l'attribut
  // onclick), symptôme signalé : "je ne peux rien faire, ça ne fait rien".
  const nomJs = esc(nom).replace(/'/g, "\\'");
  const modal = document.getElementById('modal-ajout-aliment');
  const box = modal.querySelector('.modal-box');
  box.innerHTML = `
    <h3 style="margin-bottom:4px;">${esc(nom)}</h3>
    ${_ajoutAlimCount > 0 ? `<div style="font-size:11px;color:var(--success);margin-bottom:10px;">✓ ${_ajoutAlimCount} aliment${_ajoutAlimCount>1?'s':''} ajouté${_ajoutAlimCount>1?'s':''} à ce repas</div>` : ''}
    <div class="macro-band" id="aSelMacroBand" style="border-radius:var(--radius-sm);margin-bottom:16px;">
      ${_macroBandSelectionHtml(kcal100, prot100, glu100, lip100, qteDefault, diviseur, uniteLabel)}
    </div>
    <div class="field-row"><label>${qteLabel}</label><input id="aQteSelected" type="number" min="1" value="${qteDefault}" style="font-size:16px;"
      oninput="_majMacroBandSelection(${kcal100},${prot100},${glu100},${lip100},${diviseur},'${uniteLabel}')"
      onkeydown="if(event.key==='Enter')_confirmerAlimSelectionne('${nomJs}',${kcal100},${prot100},${glu100},${lip100},'${unite}')"></div>
    <div class="modal-actions">
      <button class="btn" onclick="ajoutAlimTab='base';_renderModalAjoutAliment()">← Retour</button>
      <button class="btn primary" onclick="_confirmerAlimSelectionne('${nomJs}',${kcal100},${prot100},${glu100},${lip100},'${unite}')">Ajouter</button>
    </div>`;
  setTimeout(()=>document.getElementById('aQteSelected')?.select(), 50);
}

function _confirmerAlimSelectionne(nom, kcal100, prot100, glu100, lip100, unite){
  unite = unite || 'g';
  const qte = parseFloat(document.getElementById('aQteSelected').value)||0;
  _dieteEnEdition(ajoutAlimSlot).repas[ajoutAlimRI].aliments.push({ nom, unite, quantite_g:qte, kcal_par_100g:kcal100, prot_par_100g:prot100, glu_par_100g:glu100, lip_par_100g:lip100 });
  _ajoutAlimCount++;
  _updateAlimentsDom(ajoutAlimRI, ajoutAlimSlot);
  // Retour à la recherche avec flash de confirmation
  ajoutAlimTab = 'base';
  _renderModalAjoutAliment();
  setTimeout(() => {
    const flash = document.getElementById('picker-flash');
    if (flash) { flash.textContent = `✓ ${nom} ajouté`; flash.style.opacity = '1'; setTimeout(()=>{ if(flash) flash.style.opacity='0'; }, 2500); }
  }, 30);
}

function confirmerAjoutAliment(){
  const nom = document.getElementById('aNom').value.trim();
  const errEl = document.getElementById('aErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  const qte = parseFloat(document.getElementById('aQte').value)||0;
  // Saisie déjà "pour 100g" (label au-dessus des champs) — stockage direct.
  const kcal = parseFloat(document.getElementById('aKcal').value)||0;
  const prot = parseFloat(document.getElementById('aProt').value)||0;
  const glu  = parseFloat(document.getElementById('aGlu').value)||0;
  const lip  = parseFloat(document.getElementById('aLip').value)||0;
  _dieteEnEdition(ajoutAlimSlot).repas[ajoutAlimRI].aliments.push({ nom, unite:'g', quantite_g:qte, kcal_par_100g:kcal, prot_par_100g:prot, glu_par_100g:glu, lip_par_100g:lip });
  _ajoutAlimCount++;
  _updateAlimentsDom(ajoutAlimRI, ajoutAlimSlot);
  // Reset le formulaire pour un autre ajout manuel
  document.getElementById('aNom').value = '';
  document.getElementById('aQte').value = '100';
  ['aKcal','aProt','aGlu','aLip'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
  const flash = document.getElementById('picker-flash');
  if (flash) { flash.textContent = `✓ ${nom} ajouté`; flash.style.opacity = '1'; setTimeout(()=>{ if(flash) flash.style.opacity='0'; }, 2500); }
  setTimeout(()=>document.getElementById('aNom')?.focus(), 30);
}

async function sauvegarderDieteTemplate(){
  if (_ficheCreateClientId) { await sauvegarderDietePourClient(); return; }
  const nom = document.getElementById('dNom').value.trim();
  const errEl = document.getElementById('dErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  dieteTplEnEdition.nom = nom;
  dieteTplEnEdition.description = document.getElementById('dDesc').value.trim();
  try {
    const method = dieteTplEnEdition.id ? 'PATCH' : 'POST';
    const url = dieteTplEnEdition.id ? `${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${dieteTplEnEdition.id}` : `${SUPABASE_URL}/rest/v1/diete_templates`;
    const res = await fetch(url, { method, headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ nom:dieteTplEnEdition.nom, description:dieteTplEnEdition.description||null }) });
    if (!res.ok) throw new Error('supabase_'+res.status);
    const saved = (await res.json())[0];
    const tplId = saved.id;
    if (dieteTplEnEdition.id) {
      await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tplId}`, { method:'DELETE', headers:supaHeaders() });
    }
    for (let ri=0; ri<dieteTplEnEdition.repas.length; ri++){
      const r = dieteTplEnEdition.repas[ri];
      const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`, { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id:tplId, nom:r.nom, ordre:r.ordre!=null?r.ordre:ri, variante_index:r.variante_index||0, commentaire:r.commentaire||null }) });
      if (!rRes.ok) throw new Error('supabase_repas_'+rRes.status);
      const savedR = (await rRes.json())[0];
      if (r.aliments.length){
        const alimPayload = r.aliments.map((a,ai)=>({ repas_id:savedR.id, nom:a.nom, unite:a.unite||'g', quantite_g:a.quantite_g, kcal_par_100g:a.kcal_par_100g, prot_par_100g:a.prot_par_100g, glu_par_100g:a.glu_par_100g, lip_par_100g:a.lip_par_100g, ordre:ai, modifie:!!a.modifie }));
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`, { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(alimPayload) });
      }
    }
    dieteTemplatesData = null;
    dieteTemplatesData = await chargerDieteTemplates();
    if (_ficheEditClientId) {
      const cid = _ficheEditClientId;
      const cdid = _ficheEditClientDieteId;
      _ficheEditClientId = null;
      _ficheEditClientDieteId = null;
      // client_dietes.nom est une copie indépendante du nom du template au
      // moment de l'assignation (pas une référence live) — un renommage
      // depuis l'éditeur ne se répercutait jamais dessus, la fiche client
      // continuait d'afficher l'ancien nom. Resynchronise ici.
      try {
        if (cdid) {
          await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?id=eq.${cdid}`, { method:'PATCH', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify({ nom }) });
        } else {
          await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(cid)}&diete_template_id=eq.${tplId}`, { method:'PATCH', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify({ nom }) });
        }
      } catch(e) {}
      await openPanel(cid);
      setFicheTab('diete');
      setNav('fiche-client');
    } else {
      setNav('dietes');
    }
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

// Crée une COPIE indépendante (client_only:false, donc listée dans Diètes → Templates) à
// partir de la diète d'un client actuellement ouverte dans l'éditeur — jamais un lien vers
// la diète du client (même logique que _dupliquerTemplateDiete, mais destination "template
// réutilisable" au lieu de "diète client"). Ne modifie ni ne supprime rien côté client :
// simple export. Remplace la case à cocher "Enregistrer comme template réutilisable" qui
// n'avait aucun effet dans ce contexte (elle ne s'appliquait qu'à la création d'une toute
// nouvelle diète client, `sauvegarderDietePourClient` — jamais lue en édition d'une diète
// déjà assignée, `sauvegarderDieteTemplate` — bug signalé par le coach, 2026-08-11).
async function creerTemplateDepuisDieteClient(){
  const nom = document.getElementById('dNom').value.trim();
  const errEl = document.getElementById('dErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  const desc = document.getElementById('dDesc').value.trim();
  try {
    const tplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates`, {
      method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
      body: JSON.stringify({ nom, description: desc || null, client_only: false })
    });
    if (!tplRes.ok) throw new Error('supabase_'+tplRes.status);
    const newTpl = (await tplRes.json())[0];
    for (let ri=0; ri<dieteTplEnEdition.repas.length; ri++){
      const r = dieteTplEnEdition.repas[ri];
      const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`, { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id:newTpl.id, nom:r.nom, ordre:r.ordre!=null?r.ordre:ri, variante_index:r.variante_index||0, commentaire:r.commentaire||null }) });
      if (!rRes.ok) continue;
      const savedR = (await rRes.json())[0];
      if (r.aliments.length){
        const alimPayload = r.aliments.map((a,ai)=>({ repas_id:savedR.id, nom:a.nom, unite:a.unite||'g', quantite_g:a.quantite_g, kcal_par_100g:a.kcal_par_100g, prot_par_100g:a.prot_par_100g, glu_par_100g:a.glu_par_100g, lip_par_100g:a.lip_par_100g, ordre:ai, modifie:!!a.modifie }));
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`, { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(alimPayload) });
      }
    }
    dieteTemplatesData = null;
    alert(`Template "${nom}" créé — visible dans Diètes → Templates.`);
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

// ── Comparer 2 diètes côte à côte (ex: Jour On / Jour Off) ──────────────
// Demande du coach : éditer deux diètes déjà assignées en même temps, l'une
// à côté de l'autre, chacune avec son propre bandeau de macros figé en haut
// pendant le défilement, et un seul bouton qui enregistre les deux d'un coup.
// Réutilise tous les mutateurs de l'éditeur classique (généralisés avec un
// paramètre `slot` 'A'/'B' — voir _dieteEnEdition/_renderDieteBlocsHtml plus
// haut) plutôt que de dupliquer la logique d'édition.

function ouvrirComparerDietes(clientId){
  const dietes = ficheData.tous_dietes || [];
  if (dietes.length < 2) { alert('Il faut au moins 2 diètes assignées à ce client pour les comparer.'); return; }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-comparer-dietes';
  overlay.onclick = e => { if (e.target===overlay) overlay.remove(); };
  const opts = dietes.map(d => `<option value="${d.id}">${esc(d.nom||'Diète sans nom')}${d.actif?'':' (archivée)'}</option>`).join('');
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>⇄ Comparer 2 diètes</h3>
      <div class="field-row"><label>Diète A</label><select id="cmpDieteA" style="font-size:16px;">${opts}</select></div>
      <div class="field-row"><label>Diète B</label><select id="cmpDieteB" style="font-size:16px;">${opts}</select></div>
      <div id="cmpErr" style="display:none;color:var(--critical);font-size:12px;margin-bottom:8px;"></div>
      <div class="modal-actions">
        <button class="btn" onclick="document.getElementById('modal-comparer-dietes').remove()">Annuler</button>
        <button class="btn primary" id="cmpBtn" onclick="confirmerComparerDietes('${clientId}')">Comparer</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  // Pré-sélectionne 2 diètes différentes par défaut si possible (souvent Jour On / Jour Off).
  if (dietes[1]) document.getElementById('cmpDieteB').value = dietes[1].id;
}

async function confirmerComparerDietes(clientId){
  const idA = document.getElementById('cmpDieteA').value;
  const idB = document.getElementById('cmpDieteB').value;
  const errEl = document.getElementById('cmpErr');
  if (!idA || !idB) { errEl.textContent = 'Choisis 2 diètes.'; errEl.style.display = 'block'; return; }
  if (idA === idB) { errEl.textContent = 'Choisis 2 diètes différentes.'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('cmpBtn');
  btn.disabled = true; btn.textContent = 'Chargement…';
  try {
    await ouvrirEditeurDieteCompare(clientId, +idA, +idB);
    document.getElementById('modal-comparer-dietes')?.remove();
  } catch(e) {
    errEl.textContent = 'Erreur : ' + e.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Comparer';
  }
}

// Charge une diète client (par son id client_dietes) sous la même forme que
// dieteTplEnEdition — même logique de résolution que editerDieteClient
// (diete_template_id fiable en priorité, fallback par nom).
async function _chargerDieteTplPourCompare(clientDieteId){
  const cdRes = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?id=eq.${clientDieteId}&select=*`, { headers: supaHeaders() });
  const cd = cdRes.ok ? await cdRes.json() : [];
  if (!cd.length) throw new Error('diète introuvable');
  let tpl = null;
  if (cd[0].diete_template_id) {
    const tRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${cd[0].diete_template_id}&select=*`, { headers: supaHeaders() });
    if (tRes.ok) { const t = await tRes.json(); tpl = t[0] || null; }
  }
  if (!tpl) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?nom=eq.${encodeURIComponent(cd[0].nom)}&order=id.desc&limit=1&select=*`, { headers: supaHeaders() });
    const tpls = res.ok ? await res.json() : [];
    if (!tpls.length) throw new Error(`Aucun template trouvé pour "${cd[0].nom}"`);
    tpl = tpls[0];
  }
  const repasRes = await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tpl.id}&order=ordre.asc,variante_index.asc&select=*,repas_aliments(*)&repas_aliments.order=ordre.asc`, { headers: supaHeaders() });
  const repasRaw = repasRes.ok ? await repasRes.json() : [];
  const obj = {
    id: tpl.id, nom: tpl.nom, description: tpl.description||'',
    repas: repasRaw.map(r=>({ id:r.id, nom:r.nom, ordre:r.ordre||0, variante_index:r.variante_index||0, commentaire:r.commentaire||'', aliments:(r.repas_aliments||[]).map(a=>({id:a.id,nom:a.nom,unite:a.unite||'g',quantite_g:a.quantite_g,kcal_par_100g:a.kcal_par_100g,prot_par_100g:a.prot_par_100g,glu_par_100g:a.glu_par_100g,lip_par_100g:a.lip_par_100g,modifie:!!a.modifie})) }))
  };
  if (!obj.repas.length) obj.repas = [{ nom:'Repas 1', ordre:0, variante_index:0, aliments:[] }];
  return obj;
}

async function ouvrirEditeurDieteCompare(clientId, clientDieteIdA, clientDieteIdB){
  const [a, b] = await Promise.all([_chargerDieteTplPourCompare(clientDieteIdA), _chargerDieteTplPourCompare(clientDieteIdB)]);
  _dieteCompare = { A:a, B:b };

}

// Persiste UNE diète existante (schéma identique à la branche "PATCH" de
// sauvegarderDieteTemplate) — repas + aliments remplacés en bloc. Pas de
// renommage possible en mode comparaison (pas de champ nom/description
// affiché) : le focus est macros/aliments, pas la métadonnée du template.
async function _sauvegarderUneDieteComparee(tpl){
  await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tpl.id}`, { method:'DELETE', headers:supaHeaders() });
  for (let ri=0; ri<tpl.repas.length; ri++){
    const r = tpl.repas[ri];
    const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`, { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id:tpl.id, nom:r.nom, ordre:r.ordre!=null?r.ordre:ri, variante_index:r.variante_index||0, commentaire:r.commentaire||null }) });
    if (!rRes.ok) throw new Error('supabase_repas_'+rRes.status);
    const savedR = (await rRes.json())[0];
    if (r.aliments.length){
      const alimPayload = r.aliments.map((a,ai)=>({ repas_id:savedR.id, nom:a.nom, unite:a.unite||'g', quantite_g:a.quantite_g, kcal_par_100g:a.kcal_par_100g, prot_par_100g:a.prot_par_100g, glu_par_100g:a.glu_par_100g, lip_par_100g:a.lip_par_100g, ordre:ai, modifie:!!a.modifie }));
      await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`, { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(alimPayload) });
    }
  }
}

async function sauvegarderDieteComparee(){

}

async function assignerDieteAuClient(templateId, templateNom, clientId){
  // Chaque assignation doit être une COPIE indépendante du template, jamais un
  // lien direct dessus — sinon éditer la diète de CE client (editerDieteClient,
  // qui écrit sur repas/repas_aliments via diete_template_id) modifierait
  // silencieusement le template partagé, donc la diète de tous les autres
  // clients assignés au même template. Bug vécu 2026-08-01. Voir aussi le
  // même principe côté migration GAS (migrerDieteGAS) : jamais de repas
  // partagé entre deux clients différents, sauf template explicitement coché
  // "réutilisable" au moment de sa création dans la bibliothèque.
  const dieteTemplateId = await _dupliquerTemplateDiete(templateId, templateNom);
  // Plusieurs diètes simultanées autorisées — pas de désactivation des autres
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes`, {
    method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
    body:JSON.stringify({ client_id:clientId, nom:templateNom, diete_template_id:dieteTemplateId, actif:true, brouillon:true })
  });
  if (!res.ok) throw new Error('supabase_'+res.status);
  return (await res.json())[0];
}

// Duplique un template diète (+ ses repas/variantes + leurs aliments) dans un
// nouveau template dédié (client_only=true) — jamais réutilisé, jamais partagé.
async function _dupliquerTemplateDiete(sourceTemplateId, nom){
  const tplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${sourceTemplateId}&select=description`, { headers: supaHeaders() });
  const tplArr = tplRes.ok ? await tplRes.json() : [];
  const description = (tplArr[0] && tplArr[0].description) || null;

  const newTplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates`, {
    method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
    body: JSON.stringify({ nom, description, client_only: true })
  });
  if (!newTplRes.ok) throw new Error('duplication_template_' + newTplRes.status);
  const newTpl = (await newTplRes.json())[0];

  const repasRes = await fetch(
    `${SUPABASE_URL}/rest/v1/repas?template_id=eq.${sourceTemplateId}&order=ordre.asc,variante_index.asc&select=*,repas_aliments(*)&repas_aliments.order=ordre.asc`,
    { headers: supaHeaders() });
  const repasArr = repasRes.ok ? await repasRes.json() : [];
  for (const r of repasArr) {
    const newRepasRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`, {
      method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
      body: JSON.stringify({ template_id: newTpl.id, nom: r.nom, ordre: r.ordre || 0, variante_index: r.variante_index || 0, commentaire: r.commentaire || null })
    });
    if (!newRepasRes.ok) continue;
    const newRepas = (await newRepasRes.json())[0];
    const aliments = r.repas_aliments || [];
    if (aliments.length) {
      const payload = aliments.map((a, ai) => ({
        repas_id: newRepas.id, nom: a.nom, unite: a.unite || 'g', quantite_g: a.quantite_g, ordre: a.ordre != null ? a.ordre : ai,
        kcal_par_100g: a.kcal_par_100g, prot_par_100g: a.prot_par_100g,
        glu_par_100g: a.glu_par_100g, lip_par_100g: a.lip_par_100g,
      }));
      await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`, {
        method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify(payload)
      });
    }
  }
  return newTpl.id;
}

// Duplique une diète déjà assignée à un client → nouvelle copie indépendante
// (client_only, jamais partagée) assignée au même client, sous le nom
// "X (copie)". Réutilise _dupliquerTemplateDiete (même mécanique que
// l'assignation d'un template depuis la bibliothèque).
async function dupliquerDieteClient(clientDieteId, clientId){
  const d = (ficheData.tous_dietes||[]).find(x=>x.id===clientDieteId);
  if (!d) return;
  if (!confirm(`Dupliquer la diète "${d.nom}" pour ce client ?`)) return;
  try {
    let tplId = d.diete_template_id;
    if (!tplId) {
      // Fallback par nom pour les diètes assignées avant l'ajout de la colonne
      // diete_template_id — même limite documentée qu'ailleurs (editerDieteClient).
      const res = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?nom=eq.${encodeURIComponent(d.nom)}&order=id.desc&limit=1&select=id`, { headers: supaHeaders() });
      const tpls = res.ok ? await res.json() : [];
      if (!tpls.length) { alert('Template introuvable pour cette diète.'); return; }
      tplId = tpls[0].id;
    }
    const nomCopie = d.nom + ' (copie)';
    const newTplId = await _dupliquerTemplateDiete(tplId, nomCopie);
    await fetch(`${SUPABASE_URL}/rest/v1/client_dietes`, {
      method:'POST', headers: supaHeaders({ Prefer:'return=minimal' }),
      body: JSON.stringify({ client_id: clientId, nom: nomCopie, diete_template_id: newTplId, actif: true })
    });
    ficheData.tous_dietes = await chargerTousDietes(clientId);
    setFicheTab('diete');
  } catch(e){ alert('Erreur : '+e.message); }
}

    glu_par_100g:  r.glu_par_portion  || 0,

  };

async function sauverRecette() {
  const r = recetteEnEdition;
  const payload = {
    nom: document.getElementById('rNom').value.trim(),
    description: document.getElementById('rDesc').value.trim()||null,
    categorie: document.getElementById('rCat').value.trim()||null,
    emoji: document.getElementById('rEmoji').value.trim()||'🍽️',
    temps_prep_min: parseInt(document.getElementById('rTemps').value)||null,
    portions: parseInt(document.getElementById('rPortions').value)||1,
    kcal_par_portion: parseFloat(document.getElementById('rKcal').value)||null,
    prot_par_portion: parseFloat(document.getElementById('rProt').value)||null,
    glu_par_portion: parseFloat(document.getElementById('rGlu').value)||null,
    lip_par_portion: parseFloat(document.getElementById('rLip').value)||null,
    ingredients: r.ingredients.filter(x=>(typeof x==='string'?x:(x.nom||'')).trim()),
    etapes: r.etapes.filter(x=>(typeof x==='string'?x:(x.texte||'')).trim())
  };
  if (!payload.nom) { alert('Le nom est obligatoire.'); return; }
  try {
    let res;
    if (r.id) {
      res = await fetch(`${SUPABASE_URL}/rest/v1/recettes?id=eq.${r.id}`,
        { method:'PATCH', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(payload) });
    } else {
      res = await fetch(`${SUPABASE_URL}/rest/v1/recettes`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(payload) });
    }
    if (!res.ok) throw new Error('Supabase ' + res.status + ' : ' + await res.text());
    const saved = (await res.json())[0];
    if (r.id) {
      recettesCoachData = recettesCoachData.map(x=>x.id===r.id?saved:x);
    } else {
      recettesCoachData = [...(recettesCoachData||[]), saved];
    }
    document.getElementById('modal-editeur-recette').remove();
    renderRecettesCoachSub();
  } catch(e){ alert('Erreur : ' + e.message); }
}
