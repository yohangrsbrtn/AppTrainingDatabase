// ── Migration helpers ───────────────────────────────────────────────────
// URL du GAS de production (indépendant du sandbox)
const GAS_PROD_URL = 'https://script.google.com/macros/s/AKfycbwQiM6ixf-CTIWwcuNHoosFbvrDzWmC056yRUGhTaWv0Nwxbm0dLeK3d5QVgqmS7P9G7A/exec';

// Mapping ID Supabase → ID GAS quand ils diffèrent
// (ex: compte test "yohanp" utilise la feuille réelle "yohan")
const GAS_ID_MAP = { 'yohanp': 'yohan' };
function _gasId(clientId) { return GAS_ID_MAP[clientId] || clientId; }

// Le token coach GAS (10 caractères, stocké côté GAS dans la feuille Clients) est
// distinct du `at_token` Supabase Auth (JWT) utilisé par le reste de l'app depuis le
// passage à Supabase Auth — GAS ne connaît rien de ce JWT. On maintient donc un token
// GAS séparé, obtenu une seule fois via le code coach (action 'login' GAS, qui accepte
// coachMode indépendamment du `client` fourni), mis en cache dans 'at_gas_token'.
async function _getGasCoachToken(force) {
  if (!force) {
    const cached = localStorage.getItem('at_gas_token');
    if (cached) return cached;
  }
  const mdp = prompt('Code coach (accès migration GAS) :');
  if (!mdp) throw new Error('code_coach_requis');
  const res = await fetch(GAS_PROD_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'login', client: 'coach', mdp }),
  });
  const json = await res.json();
  if (!json.ok || !json.token) throw new Error(json.error || 'login_gas_echoue');
  localStorage.setItem('at_gas_token', json.token);
  return json.token;
}

// Le endpoint GAS répond via une redirection interne (script.googleusercontent.com)
// qui échoue parfois côté livraison (page HTML générique Google) même quand
// l'exécution elle-même a fini vite et sans erreur (vérifié dans le journal
// Apps Script "Exécutions" : 3.1s, "Terminée" — mais réponse HTML côté client).
// Ce n'est pas un vrai timeout ni un bug du script — juste une flakiness de
// livraison. Un simple retry après une courte pause suffit dans la pratique.
async function _fetchGasJson(body, ctrl, _jsonRetryLeft) {
  const res = await fetch(GAS_PROD_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body),
    signal: ctrl.signal,
  });
  const raw = await res.text();
  try { return JSON.parse(raw); }
  catch (e) {
    if (_jsonRetryLeft > 0) {
      await new Promise(r => setTimeout(r, 1500));
      return _fetchGasJson(body, ctrl, _jsonRetryLeft - 1);
    }
    throw new Error('reponse_gas_invalide (Google a renvoyé une page au lieu du résultat — réessaie)');
  }
}

async function apiGasProd(action, clientId, params = {}, _retry) {
  const token = await _getGasCoachToken(!!_retry);
  const body = { action, token, client: _gasId(clientId), params };
  const ctrl = new AbortController();
  // 60s : certaines exécutions GAS (ouverture d'un spreadsheet client lourd) ont été
  // mesurées jusqu'à ~36s dans le journal Apps Script (Exécutions) sans jamais échouer
  // côté serveur — 30s coupait la requête en plein milieu d'un run par ailleurs sain.
  const tid  = setTimeout(() => ctrl.abort(), 60000);
  try {
    const json = await _fetchGasJson(body, ctrl, 2);
    if (!json.ok) {
      if (json.error === 'token_invalide' && !_retry) {
        localStorage.removeItem('at_gas_token');
        return apiGasProd(action, clientId, params, true);
      }
      throw new Error(json.error || 'erreur_gas');
    }
    return json.data;
  } finally {
    clearTimeout(tid);
  }
}

const _MOIS_EN = { Jan:'01', Feb:'02', Mar:'03', Apr:'04', May:'05', Jun:'06', Jul:'07', Aug:'08', Sep:'09', Oct:'10', Nov:'11', Dec:'12' };

function _parseDateFr(s) {
  s = (s||'').toString().trim();
  if (!s) return null;
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  // Format Date.toString() natif JS renvoyé par le GAS historique bilans,
  // ex: "Sun Jul 26 2026 09:00:00 GMT+0200 (heure d'été d'Europe centrale)"
  // — on extrait le jour/mois/année en texte, pas de conversion de fuseau.
  const en = s.match(/^\w{3} (\w{3}) (\d{1,2}) (\d{4})/);
  if (en && _MOIS_EN[en[1]]) return `${en[3]}-${_MOIS_EN[en[1]]}-${en[2].padStart(2,'0')}`;
  return null;
}

// La date lue sur une feuille GAS historique correspond au jour où le client a
// rempli son bilan (souvent le dimanche, mais dépend de jour_bilan) — c'est donc
// exactement la date de fin de semaine SOUS L'ANCIENNE convention GAS (semaine se
// terminant PILE le jour_bilan, jamais la veille — cette vieille donnée reflète un
// comportement déjà arrivé, pas la nouvelle règle "veille de jour_bilan" appliquée
// aux bilans Supabase live depuis le 2026-08-03). Calcul volontairement local, sans
// passer par _bilanWeekBounds (qui applique désormais le décalage -1 jour) : `iso`
// est déjà, par définition, le dernier jour de la semaine migrée.
function _semaineLabelFromSheetDate(iso, jourBilanNom) {
  if (!iso) return null;
  const fin = new Date(iso + 'T12:00:00');
  const debut = new Date(fin); debut.setDate(fin.getDate() - 6);
  const MOIS = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
  const fmt = d => d.getDate() + ' ' + MOIS[d.getMonth()];
  return 'Du ' + fmt(debut) + ' au ' + fmt(fin);
}

async function migrerMensurations(clientId, rafraichirPage) {
  const statusEl = document.getElementById('migStatus_' + clientId) || document.getElementById('mensurationsContent');
  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;"><div class="spin"></div> Lecture GAS prod (${_gasId(clientId)})…</div>`;
  try {
    const raw = await apiGasProd('chargerMensurations', clientId);
    const releves = (typeof raw === 'string' ? JSON.parse(raw) : raw) || [];
    if (!releves.length) {
      if (statusEl) statusEl.innerHTML = `<span style="color:var(--text-muted);">Aucune mensuration dans GAS.</span>`;
      return;
    }
    const rowsRaw = releves
      .map(r => ({
        client_id: clientId,
        date: _parseDateFr(r.date),
        phase: r.phase || null,
        poids: r.poids != null ? r.poids : null,
        mesure: r.taille != null ? r.taille : null,
        fessiers: r.fessiers != null ? r.fessiers : null,
        cuisses: r.cuisses != null ? r.cuisses : null,
        mollets: r.mollets != null ? r.mollets : null,
        poitrine: r.poitrine != null ? r.poitrine : null,
        epaules: r.epaules != null ? r.epaules : null,
        bras: r.bras != null ? r.bras : null,
      }))
      .filter(r => r.date);
    // Dédoublonnage par date — voir commentaire dans migrerSelectionMensu
    // (même bug : deux lignes GAS sur la même date font planter l'upsert en 500).
    const rowsByDate = new Map();
    rowsRaw.forEach(r => rowsByDate.set(r.date, r));
    const rows = [...rowsByDate.values()];

    const res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?on_conflict=client_id,date`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify(rows),
    });
    if (!res.ok && res.status !== 409) {
      const errBody = await res.text().catch(() => '');
      throw new Error('supabase_' + res.status + (errBody ? ' — ' + errBody.slice(0, 300) : ''));
    }
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--success,#4caf50);">✓ ${rows.length} relevés importés.</span>`;
    if (rafraichirPage) setTimeout(() => chargerMensurationsSupabase(clientId), 600);
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--critical);">Erreur : ${esc(e.message)}</span>`;
  }
}

    ]);
    const profRows        = profRes.ok        ? await profRes.json()        : [];
    const supaMensurations = supaMenuRes.ok   ? await supaMenuRes.json()    : [];
    const supaClientDietes = supaCliDietesRes.ok ? await supaCliDietesRes.json() : [];
    const supaClientProgs  = supaCliProgsRes.ok  ? await supaCliProgsRes.json()  : [];
    const gasMensurations       = (typeof gasMenuRaw    === 'string' ? JSON.parse(gasMenuRaw)    : gasMenuRaw)    || [];
    const gasSaisiesMensurations = (typeof gasSaisiesRaw === 'string' ? JSON.parse(gasSaisiesRaw) : gasSaisiesRaw) || [];
    const gasDietes              = (typeof gasDietesRaw  === 'string' ? JSON.parse(gasDietesRaw)  : gasDietesRaw)  || [];
    const _gasBilansUnwrap = (typeof gasBilansRaw === 'string') ? (() => { try { return JSON.parse(gasBilansRaw); } catch { return []; } })() : gasBilansRaw;
    const gasBilans        = Array.isArray(_gasBilansUnwrap) ? _gasBilansUnwrap : [];
    const supaBilansRows   = supaBilansRes?.ok ? (await supaBilansRes.json().catch(() => [])) : [];
    const supaBilanLignes  = new Set(supaBilansRows.map(r => r.gas_ligne_titre));
    let supaProfile = profRows[0] || null;
    // Auto-crée une fiche minimale (prénom/nom depuis le nom affiché du dashboard) plutôt
    // que d'afficher "Aucun profil Supabase" à chaque ouverture pour chaque nouveau client —
    // le coach peut compléter le reste (email, jour bilan…) depuis la fiche client ensuite.
    if (!supaProfile) supaProfile = await _autoCreerProfilMinimal(clientId);

    const supaDateSet = new Set(supaMensurations.map(r => r.date));
    migPreviewSel = new Set(gasMensurations.map(r => _parseDateFr(r.date)).filter(d => d && !supaDateSet.has(d)));
    migBilanSel = new Set(gasBilans.filter(b => !supaBilanLignes.has(b.ligneTitre)).map(b => b.ligneTitre));
    const gasProgression = gasProgressionRaw ? (typeof gasProgressionRaw === 'string' ? (() => { try { return JSON.parse(gasProgressionRaw); } catch { return null; } })() : gasProgressionRaw) : null;
    const supaProgRows   = supaProgRes?.ok ? (await supaProgRes.json().catch(() => [])) : [];
    const supaProgression = supaProgRows[0] || null;
    migPreviewData = { loaded: true, error: null, supaProfile, gasMensurations, gasSaisiesMensurations, gasMensurationsDetail: {}, supaMensurations, gasDietes, gasFeuilles, supaClientDietes, supaClientProgs, gasBilans, supaBilanLignes, gasProgression, supaProgression };
    if (state.nav === 'migration-preview' && migPreviewClientId === clientId) renderMain();

    // Charger les détails complets (fessiers, cuisses, etc.) en arrière-plan
    if (gasSaisiesMensurations.length) {
      const details = {};
      await Promise.all(gasSaisiesMensurations.map(async s => {
        if (s.ligne == null) return;
        try {
          const raw = await apiGasProd('chargerSaisieMensuration', clientId, { ligne: s.ligne });
          const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
          if (d && s.date) details[s.date] = d;
        } catch(e) {}
      }));
      if (migPreviewClientId === clientId) {
        migPreviewData.gasMensurationsDetail = details;
        if (state.nav === 'migration-preview' && migPreviewTab === 'mensurations') {
          const content = document.getElementById('migPreviewContent');
          if (content) content.innerHTML = _renderMigPreviewTabContent();
        }
      }
    }
  } catch(e) {
    migPreviewData = { loaded: true, error: e.message, supaProfile: null, gasMensurations: [], supaMensurations: [], gasDietes: [], gasFeuilles: [], supaClientDietes: [], supaClientProgs: [] };
    if (state.nav === 'migration-preview' && migPreviewClientId === clientId) renderMain();
  }
}

function toggleMigPreviewSel(isoDate, checked) {
  if (checked) migPreviewSel.add(isoDate);
  else migPreviewSel.delete(isoDate);
  // Met à jour le compteur et le bouton sans re-render toute la page
  const countEl = document.querySelector('#migPreviewContent span[style*="text-faint"]');
  document.querySelectorAll('#migPreviewContent .btn.primary').forEach(b => {
    b.disabled = migPreviewSel.size === 0;
    b.textContent = `⬇ Migrer ${migPreviewSel.size > 0 ? migPreviewSel.size + ' ligne' + (migPreviewSel.size > 1 ? 's' : '') : ''}`;
  });
  // Met à jour "tout sélectionner"
  const gasRows = migPreviewData.gasMensurations || [];
  const allSelectable = gasRows.map(r => _parseDateFr(r.date)).filter(Boolean);
  const allSelected = allSelectable.length > 0 && allSelectable.every(d => migPreviewSel.has(d));
  document.querySelectorAll('#migPreviewContent input[type=checkbox][onchange*="SelAll"]').forEach(cb => cb.checked = allSelected);
}

function toggleMigPreviewSelAll(checked) {
  const gasRows = migPreviewData.gasMensurations || [];
  gasRows.forEach(r => {
    const d = _parseDateFr(r.date);
    if (!d) return;
    if (checked) migPreviewSel.add(d);
    else migPreviewSel.delete(d);
  });
  // Re-render l'onglet pour mettre à jour toutes les checkboxes
  const content = document.getElementById('migPreviewContent');
  if (content) content.innerHTML = _renderMigPreviewTabContent();
}

async function migrerSelectionMensu() {
  const statusEl = document.getElementById('migMenuStatus');
  if (!migPreviewSel.size) return;
  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;"><div class="spin"></div> Migration en cours…</div>`;
  document.querySelectorAll('#migPreviewContent .btn.primary').forEach(b => b.disabled = true);
  try {
    const gasRows = migPreviewData.gasMensurations || [];
    const saisies = migPreviewData.gasSaisiesMensurations || [];
    // Index saisies par date FR pour retrouver la ligne GAS
    const saisieByDate = {};
    saisies.forEach(s => { if (s.date) saisieByDate[s.date] = s; });

    const selected = gasRows
      .map(r => ({ isoDate: _parseDateFr(r.date), raw: r }))
      .filter(({ isoDate }) => isoDate && migPreviewSel.has(isoDate));

    // Charger le détail complet pour chaque entrée sélectionnée (fessiers, cuisses, etc.)
    const detailResults = await Promise.all(selected.map(async ({ raw }) => {
      const saisie = saisieByDate[raw.date];
      if (saisie && saisie.ligne != null) {
        try {
          const detail = await apiGasProd('chargerSaisieMensuration', migPreviewClientId, { ligne: saisie.ligne });
          return typeof detail === 'string' ? JSON.parse(detail) : detail;
        } catch(e) { return null; }
      }
      return null;
    }));

    // Convertit string FR ("65,5") ou number → float ou null
    const _num = v => {
      if (v == null || v === '') return null;
      const n = parseFloat(String(v).replace(',', '.'));
      return isNaN(n) ? null : n;
    };

    const rowsRaw = selected.map(({ isoDate, raw }, i) => {
      const d = detailResults[i] || {};
      return {
        client_id: migPreviewClientId,
        date: isoDate,
        phase: raw.phase || d.phase || null,
        poids:    _num(raw.poids   ?? d.poids),
        mesure:   _num(raw.taille  ?? d.taille),
        fessiers: _num(d.fessiers  ?? raw.fessiers),
        cuisses:  _num(d.cuisses   ?? raw.cuisses),
        mollets:  _num(d.mollets   ?? raw.mollets),
        poitrine: _num(d.poitrine  ?? raw.poitrine),
        epaules:  _num(d.epaules   ?? raw.epaules),
        bras:     _num(d.bras      ?? raw.bras),
      };
    });
    // Deux lignes GAS peuvent tomber sur la même date (double saisie) — un
    // upsert avec deux lignes de même (client_id,date) dans le même batch
    // fait planter Postgres ("ON CONFLICT DO UPDATE command cannot affect
    // row a second time", HTTP 500). On dédoublonne par date, la dernière
    // ligne du sheet gagne (généralement la plus à jour).
    const rowsByDate = new Map();
    rowsRaw.forEach(r => rowsByDate.set(r.date, r));
    const rows = [...rowsByDate.values()];
    const res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?on_conflict=client_id,date`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify(rows),
    });
    if (!res.ok && res.status !== 409) {
      const errBody = await res.text().catch(() => '');
      throw new Error('supabase_' + res.status + (errBody ? ' — ' + errBody.slice(0, 300) : ''));
    }
    // Recharger les données Supabase et re-render
    const supaRes = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?client_id=eq.${encodeURIComponent(migPreviewClientId)}&order=date.desc`, { headers: supaHeaders() });
    migPreviewData.supaMensurations = supaRes.ok ? await supaRes.json() : migPreviewData.supaMensurations;
    // Vider la sélection des dates maintenant migrées
    rows.forEach(r => migPreviewSel.delete(r.date));
    const content = document.getElementById('migPreviewContent');
    if (content) content.innerHTML = _renderMigPreviewTabContent();
    // Mettre à jour les compteurs dans le hero
    const supaCount = migPreviewData.supaMensurations.length;
    document.querySelectorAll('.table-card .fiche-hero-name').forEach(() => {});
    // Re-render complet pour mettre à jour les chips stats
    renderMain();
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--critical);padding:8px 0;display:block;">Erreur : ${esc(e.message)}</span>`;
    document.querySelectorAll('#migPreviewContent .btn.primary').forEach(b => b.disabled = false);
  }
}

// ── Migration Preview : Diète ──────────────────────────────────────────

function _renderMigPreviewDiete() {
  const dietes = migPreviewData.gasDietes || [];
  const supaDietes = migPreviewData.supaClientDietes || [];

  if (!dietes.length) return `<div style="color:var(--text-faint);padding:24px;">Aucune diète trouvée dans GAS pour ce client.</div>`;

  const listHtml = dietes.map(d => {
    const selected = migPreviewDieteSel && migPreviewDieteSel.ligne === d.ligne && migPreviewDieteSel.col === d.col;
    return `<div onclick="migSelectDiete(${d.ligne},${d.col},'${esc(d.nom)}')"
      style="padding:12px 16px;background:${selected?'var(--accent-soft)':'var(--surface)'};border-radius:var(--radius);margin-bottom:8px;cursor:pointer;border:1.5px solid ${selected?'var(--accent)':'var(--hairline)'};display:flex;align-items:center;gap:12px;">
      <div style="flex:1;font-size:13px;font-weight:600;">${esc(d.nom)}</div>
      ${selected ? `<span style="font-size:11px;color:var(--accent);font-weight:700;">Sélectionnée</span>` : ''}
    </div>`;
  }).join('');

  const detailHtml = migPreviewDieteLoading
    ? `<div style="display:flex;align-items:center;gap:10px;padding:20px;"><div class="spin"></div> Chargement depuis GAS…</div>`
    : migPreviewDieteDetail ? _renderDieteGASDetail(migPreviewDieteDetail, supaDietes)
    : `<div style="color:var(--text-faint);font-size:13px;padding:20px;">Sélectionne une diète pour voir son contenu avant import.</div>`;

  return `
    <div style="display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;">
      <div class="table-card" style="padding:16px;">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:12px;">Diètes GAS (${dietes.length})</div>
        ${listHtml}
      </div>
      <div id="migDieteDetail">${detailHtml}</div>
    </div>`;
}

function _renderDieteGASDetail(detail, supaClientDietes) {
  const nom = migPreviewDieteSel ? migPreviewDieteSel.nom : (detail.nom||'');
  const repas = detail.repas || [];

  const dejaMigree = supaClientDietes.some(d => d.nom === nom);

  let kcalTotal = 0, protTotal = 0, gluTotal = 0, lipTotal = 0;
  repas.forEach(r => (r.aliments||[]).forEach(a => {
    kcalTotal += a.cals||0; protTotal += a.prot||0; gluTotal += a.glu||0; lipTotal += a.lip||0;
  }));

  const renderAlims = aliments => (aliments||[]).map(a =>
    `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--hairline);">
      <span style="color:var(--text);">${esc(a.nom)}</span>
      <span style="color:var(--text-faint);font-family:var(--font-mono);">${a.qte}g · ${Math.round(a.cals)}kcal · P${Math.round(a.prot)}g</span>
    </div>`).join('');

  const repasHtml = repas.map(r => {
    const equivs = r.equivalences || [];
    const equivsHtml = equivs.map(eq => `
      <div style="margin-left:12px;margin-top:6px;padding:6px 8px;border-left:2px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;">
        <div style="font-size:10px;font-weight:700;color:var(--accent);margin-bottom:4px;">≡ ${esc(eq.nom)}</div>
        ${renderAlims(eq.aliments) || '<div style="font-size:11px;color:var(--text-faint);">Aucun aliment</div>'}
      </div>`).join('');
    return `<div style="margin-bottom:12px;">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--accent);margin-bottom:6px;">${esc(r.nom)}${equivs.length ? ` <span style="font-weight:400;color:var(--text-faint);">(${equivs.length} équiv.)</span>` : ''}</div>
      ${renderAlims(r.aliments) || '<div style="font-size:12px;color:var(--text-faint);">Aucun aliment</div>'}
      ${equivsHtml}
    </div>`;
  }).join('');

  return `
    <div class="table-card" style="padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px;">
        <div style="flex:1;min-width:220px;">
          <label style="display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:4px;">Nom dans Supabase</label>
          <input id="migDieteNomInput" type="text" value="${esc(nom)}" style="font-size:14px;font-weight:700;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);width:100%;max-width:320px;margin-bottom:6px;">
          <div style="font-size:11px;color:var(--text-faint);">${repas.length} repas · ${Math.round(kcalTotal)} kcal · P ${Math.round(protTotal)}g · G ${Math.round(gluTotal)}g · L ${Math.round(lipTotal)}g</div>
        </div>
        ${dejaMigree
          ? `<span style="font-size:11px;color:var(--text-faint);white-space:nowrap;">Déjà une diète "${esc(nom)}" dans Supabase</span>`
          : ''}
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;">
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);cursor:pointer;white-space:nowrap;">
            <input type="checkbox" id="cbMigAsTemplate"> Créer un template réutilisable
          </label>
          <button class="btn primary" style="width:100%;" onclick="migrerDieteGAS()">⬇ Importer cette diète</button>
        </div>
      </div>
      <div id="migDieteStatus" style="margin-bottom:8px;"></div>
      ${repasHtml}
    </div>`;
}

async function migSelectDiete(ligne, col, nom) {
  migPreviewDieteSel = { ligne, col, nom };
  migPreviewDieteDetail = null;
  migPreviewDieteLoading = true;
  const content = document.getElementById('migPreviewContent');
  if (content) content.innerHTML = _renderMigPreviewTabContent();
  try {
    const raw = await apiGasProd('chargerDieteParPosition', migPreviewClientId, { ligneTitre: ligne, colTitre: col });
    migPreviewDieteDetail = typeof raw === 'string' ? JSON.parse(raw) : raw;
  } catch(e) {
    migPreviewDieteDetail = { repas: [], erreur: e.message };
  }
  migPreviewDieteLoading = false;
  const c2 = document.getElementById('migPreviewContent');
  if (c2) c2.innerHTML = _renderMigPreviewTabContent();
}

async function migrerDieteGAS() {
  const statusEl = document.getElementById('migDieteStatus');
  if (!migPreviewDieteDetail || !migPreviewDieteSel) return;
  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-size:12px;"><div class="spin"></div> Import en cours…</div>`;
  document.querySelectorAll('#migDieteDetail .btn.primary').forEach(b => b.disabled = true);
  try {
    const nom = document.getElementById('migDieteNomInput')?.value.trim() || migPreviewDieteSel.nom;
    const repasGAS = migPreviewDieteDetail.repas || [];

    // 1. Réutiliser ou créer le template diète.
    //
    // PIÈGE CORRIGÉ (2026-08-01, bug vécu — 5 clients affectés : hugosaubusse,
    // ericdelorenzo, matthieuesnouf, mathisleray, perrineayot) : la recherche
    // de template existant se faisait par NOM SEUL, sur TOUTE la base, sans
    // filtrer par client. Beaucoup de clients ont, chacun de leur côté dans
    // leur propre feuille GAS, une diète personnelle nommée de façon générique
    // ("DIETE JOUR ON", "DIETE JOUR OFF TRAINING"...) — la recherche globale
    // retombait donc sur LE TEMPLATE D'UN AUTRE CLIENT, dont le contenu était
    // silencieusement supprimé et remplacé par celui du client en cours de
    // migration. Résultat : migrer N'IMPORTE LEQUEL de ces clients cassait la
    // diète de tous les autres partageant le même nom, sans toucher à leur
    // propre fiche — d'où le bug qui "revenait" après chaque nouvelle
    // migration, même pour des clients qu'on ne pensait pas avoir touchés.
    //
    // Fix : ne réutiliser un template existant que dans deux cas précis —
    // (a) CE client a déjà cette diète (réimport idempotent de SA PROPRE
    //     diète, jamais celle d'un autre) ;
    // (b) le coach a explicitement coché "template réutilisable" ET un
    //     template PUBLIC (client_only=false) de ce nom existe déjà.
    // Dans tous les autres cas (diète privée, nom pas encore utilisé par ce
    // client) : toujours créer un NOUVEAU template dédié, jamais de partage
    // par coïncidence de nom.
    const commeTemplate = document.getElementById('cbMigAsTemplate')?.checked;
    const existCdPourClientRes = await fetch(
      `${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(migPreviewClientId)}&nom=eq.${encodeURIComponent(nom)}&select=diete_template_id`,
      { headers: supaHeaders() });
    const existCdPourClient = existCdPourClientRes.ok ? await existCdPourClientRes.json() : [];
    const tplDejaLieAuClient = existCdPourClient[0] && existCdPourClient[0].diete_template_id;

    let tpl = null;
    if (tplDejaLieAuClient) {
      tpl = { id: tplDejaLieAuClient };
    } else if (commeTemplate) {
      const existTplRes = await fetch(
        `${SUPABASE_URL}/rest/v1/diete_templates?nom=eq.${encodeURIComponent(nom)}&client_only=eq.false&order=id.desc&limit=1&select=id`,
        { headers: supaHeaders() });
      const existTpls = existTplRes.ok ? await existTplRes.json() : [];
      tpl = existTpls[0] || null;
    }

    if (tpl) {
      // Réécriture du contenu — soit le propre template de ce client (réimport),
      // soit un template public volontairement partagé (case cochée par le coach).
      const oldRepasRes = await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tpl.id}&select=id`, { headers: supaHeaders() });
      const oldRepas = oldRepasRes.ok ? await oldRepasRes.json() : [];
      if (oldRepas.length) {
        const ids = oldRepas.map(r => r.id).join(',');
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments?repas_id=in.(${ids})`, { method:'DELETE', headers: supaHeaders() });
        await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tpl.id}`, { method:'DELETE', headers: supaHeaders() });
      }
      await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${tpl.id}`,
        { method:'PATCH', headers: supaHeaders(), body: JSON.stringify({ nom, client_only: !commeTemplate }) });
    } else {
      const tplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ nom, client_only: !commeTemplate }) });
      if (!tplRes.ok) throw new Error('template ' + tplRes.status);
      tpl = (await tplRes.json())[0];
    }

    // 2. Créer les repas + aliments (+ équivalences comme variantes)
    const saveAliments = async (repasId, aliments) => {
      if (!aliments || !aliments.length) return;
      const payload = aliments.map((a, ai) => {
        const q = a.qte || 1;
        return {
          repas_id: repasId, nom: a.nom, quantite_g: q, ordre: ai,
          kcal_par_100g: q > 0 ? (a.cals||0)/q*100 : 0,
          prot_par_100g: q > 0 ? (a.prot||0)/q*100 : 0,
          glu_par_100g:  q > 0 ? (a.glu||0)/q*100  : 0,
          lip_par_100g:  q > 0 ? (a.lip||0)/q*100  : 0,
        };
      });
      await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(payload) });
    };
    for (let ri = 0; ri < repasGAS.length; ri++) {
      const r = repasGAS[ri];
      const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id: tpl.id, nom: r.nom, ordre: ri, variante_index: 0 }) });
      if (!rRes.ok) throw new Error('repas ' + rRes.status);
      const savedR = (await rRes.json())[0];
      await saveAliments(savedR.id, r.aliments);
      // Équivalences → variantes du même repas (variante_index 1, 2, …)
      const equivs = r.equivalences || [];
      for (let vi = 0; vi < equivs.length; vi++) {
        const eq = equivs[vi];
        const eqRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
          { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id: tpl.id, nom: eq.nom, ordre: ri, variante_index: vi + 1 }) });
        if (!eqRes.ok) continue;
        const savedEq = (await eqRes.json())[0];
        await saveAliments(savedEq.id, eq.aliments);
      }
    }

    // 3. Assigner / mettre à jour diete_template_id (idempotent)
    const existCdRes = await fetch(
      `${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(migPreviewClientId)}&nom=eq.${encodeURIComponent(nom)}&select=id,diete_template_id`,
      { headers: supaHeaders() });
    const existCd = existCdRes.ok ? await existCdRes.json() : [];
    if (!existCd.length) {
      const assignRes = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify({ client_id: migPreviewClientId, nom, diete_template_id: tpl.id, actif: true }) });
      if (!assignRes.ok) throw new Error('assign ' + assignRes.status);
    } else if (!existCd[0].diete_template_id || existCd[0].diete_template_id !== tpl.id) {
      // Mettre à jour diete_template_id si null ou incorrect (migration initiale avant ce fix)
      await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?id=eq.${existCd[0].id}`,
        { method:'PATCH', headers:supaHeaders(), body:JSON.stringify({ diete_template_id: tpl.id }) });
    }

    // 4. Invalider le cache templates
    dieteTemplatesData = null;

    // 5. Recharger supaClientDietes
    const r2 = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(migPreviewClientId)}&order=created_at.desc`, { headers: supaHeaders() });
    migPreviewData.supaClientDietes = r2.ok ? await r2.json() : migPreviewData.supaClientDietes;

    migPreviewDieteSel.nom = nom; // garde le nom personnalisé affiché après import
    if (statusEl) statusEl.innerHTML = `<div style="color:var(--success);font-size:12px;padding:6px 0;">✓ Diète importée et assignée au client.</div>`;
    document.querySelectorAll('#migDieteDetail .btn.primary').forEach(b => b.disabled = false);
    const c = document.getElementById('migDieteDetail');
    if (c && migPreviewDieteDetail) c.innerHTML = _renderDieteGASDetail(migPreviewDieteDetail, migPreviewData.supaClientDietes);
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<div style="color:var(--critical);font-size:12px;">Erreur : ${esc(e.message)}</div>`;
    document.querySelectorAll('#migDieteDetail .btn.primary').forEach(b => b.disabled = false);
  }
}

  const supaProgs = migPreviewData.supaClientProgs || [];

  if (!feuilles.length) return `<div style="color:var(--text-faint);padding:24px;">Aucun programme trouvé dans GAS pour ce client.</div>`;

  const listHtml = feuilles.map(f => {
    const selected = migPreviewFeuilleSelected === f;
    const dejaMigre = supaProgs.some(p => p.nom === f);
    return `<div onclick="migSelectFeuille('${esc(f)}')"
      style="padding:12px 16px;background:${selected?'var(--accent-soft)':'var(--surface)'};border-radius:var(--radius);margin-bottom:8px;cursor:pointer;border:1.5px solid ${selected?'var(--accent)':'var(--hairline)'};display:flex;align-items:center;gap:12px;">
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:600;">${esc(f)}</div>
        ${dejaMigre ? `<div style="font-size:11px;color:var(--text-faint);">Déjà dans Supabase</div>` : ''}
      </div>

    </div>`;
  }).join('');

    ? `<div style="display:flex;align-items:center;gap:10px;padding:20px;"><div class="spin"></div> Chargement depuis GAS…</div>`
    : migPreviewFeuilleData ? _renderProgGASDetail(migPreviewFeuilleData, supaProgs)
    : `<div style="color:var(--text-faint);font-size:13px;padding:20px;">Sélectionne un programme pour voir son contenu avant import.</div>`;

  return `
    <div style="display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;">
      <div class="table-card" style="padding:16px;">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:12px;">Programmes GAS (${feuilles.length})</div>
        ${listHtml}

      <div id="migProgDetail">${detailHtml}</div>
    </div>`;
}

function _renderProgGASDetail(feuilleData, supaProgs) {
  const nom = migPreviewFeuilleSelected || '';
  const seances = feuilleData.seances || [];
  const semaines = feuilleData.semaines || [];
  const dejaMigre = (supaProgs||[]).some(p => p.nom === nom);
  const sem = semaines[migPreviewSemaineIdx] ?? semaines[0];
  const seancesData = migPreviewSeancesCache[sem]; // null si pas encore chargé

  // Compte total de logs pour cette semaine
  let totalLogs = 0;
  if (seancesData) {
    seancesData.forEach(sd => (sd.exercices||[]).forEach(ex =>
      (ex.sets||[]).forEach(set => { if (set.charge !== '' || set.reps !== '') totalLogs++; })
    ));
  }

  const seancesHtml = seances.map((s, si) => {
    const sd = seancesData ? seancesData[si] : null;
    const exercices = sd ? (sd.exercices || []) : null;
    return `
      <div style="background:var(--surface-2);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;">
        <div style="padding:9px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--hairline);">
          ${esc(s.nom)}${s.type ? ` <span style="font-weight:400;color:var(--text-faint);font-size:11px;">— ${esc(s.type)}</span>` : ''}
        </div>
        ${exercices === null
          ? `<div style="padding:10px 14px;font-size:12px;color:var(--text-faint);">Chargement…</div>`
          : exercices.length === 0
            ? `<div style="padding:10px 14px;font-size:12px;color:var(--text-faint);">Aucun exercice.</div>`
            : exercices.map(ex => {
                const sets = ex.sets || [];
                const hasLog = sets.some(set => set.charge !== '' || set.reps !== '');
                return `<div style="padding:8px 14px;border-top:1px solid var(--hairline);">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <div style="font-size:12.5px;font-weight:600;">${esc(ex.nom)}</div>
                    <div style="font-size:11px;color:var(--text-faint);">${ex.series||'?'}×${esc(ex.repsCible||ex.reps||'?')}${ex.repos?' · ⏱ '+esc(ex.repos):''}${ex.tempo?' · tempo '+esc(ex.tempo):''}${ex.rirCible||ex.rir?' · RIR '+(ex.rirCible||ex.rir):''}</div>
                  </div>
                  ${hasLog ? sets.filter(set=>set.charge!==''||set.reps!=='').map(set=>`
                    <div style="display:flex;gap:8px;font-size:11.5px;padding:1px 0;color:var(--text-muted);">
                      <span style="color:var(--text-faint);width:20px;font-family:var(--font-mono);">#${set.serie}</span>
                      <span style="font-weight:600;color:var(--text);">${[set.charge!==''?set.charge+'kg':'',set.reps!==''?set.reps+' reps':'',set.rir!==''?'RIR '+set.rir:''].filter(Boolean).join(' · ')}</span>
                    </div>`).join('')
                  : `<div style="font-size:11px;color:var(--text-faint);font-style:italic;">Pas de log cette semaine</div>`}
                  ${ex.note ? `<div style="font-size:11px;color:var(--text-muted);margin-top:3px;font-style:italic;">"${esc(ex.note)}"</div>` : ''}
                </div>`;
              }).join('')}
      </div>`;
  }).join('');

  const supaProgsOpts = (supaProgs||[]).map(p => `<option value="${p.id}">${esc(p.nom)}</option>`).join('');
  const ajoutBlocHtml = (supaProgs||[]).length === 0 ? '' : `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0 4px;border-top:1px solid var(--hairline);margin-top:4px;">
      <span style="font-size:11px;color:var(--text-faint);">ou ajouter comme bloc à</span>
      <select id="migBlocProgSel" style="font-size:12px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:4px 8px;color:var(--text);">${supaProgsOpts}</select>
      <select id="migBlocTypeSel" style="font-size:12px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:4px 8px;color:var(--text);">
        ${BLOCS_TYPES.map(o => `<option value="${o.value}">${o.label}</option>`).join('')}
      </select>
      <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);cursor:pointer;white-space:nowrap;">
        <input type="checkbox" id="migBlocActifCb" checked> Définir actif
      </label>
      <button class="btn" style="font-size:12px;padding:4px 12px;" onclick="migrerFeuilleCommeBloc()">+ Ajouter comme bloc</button>
    </div>`;

  return `
    <div class="table-card" style="padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px;flex-wrap:wrap;">
        <div style="flex:1;min-width:220px;">
          <label style="display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:4px;">Nom dans Supabase</label>
          <input id="migProgNomInput" type="text" value="${esc(nom)}" style="font-size:14px;font-weight:700;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);width:100%;max-width:320px;margin-bottom:8px;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <div style="font-size:11px;color:var(--text-faint);">${seances.length} séances · ${semaines.length} semaines</div>
            <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);cursor:pointer;">Bloc :
              <select id="migProgBlocTypeSel" style="font-size:12px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:3px 6px;color:var(--text);">
                ${BLOCS_TYPES.map(o => `<option value="${o.value}">${o.label}</option>`).join('')}
              </select>
            </label>
          </div>
          ${dejaMigre ? `<div style="font-size:11px;color:var(--warning,#f59e0b);margin-top:6px;">⚠ Un programme "${esc(nom)}" existe déjà dans Supabase</div>` : ''}
          ${ajoutBlocHtml}
        </div>
        <button class="btn primary" style="flex-shrink:0;" onclick="migrerProgrammeGAS()">⬇ Importer ce programme</button>
      </div>
      <div id="migProgStatus" style="margin-bottom:8px;"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
        <button class="btn" style="padding:4px 12px;" onclick="migChangerSemaine(-1)" ${migPreviewSemaineIdx===0?'disabled':''}>‹</button>
        <span style="font-size:13px;font-weight:700;min-width:100px;text-align:center;">Semaine ${sem ?? '—'} <span style="font-size:11px;font-weight:400;color:var(--text-faint);">(${migPreviewSemaineIdx+1}/${semaines.length})</span></span>
        <button class="btn" style="padding:4px 12px;" onclick="migChangerSemaine(1)" ${migPreviewSemaineIdx>=semaines.length-1?'disabled':''}>›</button>
        ${seancesData ? `<span style="font-size:11.5px;color:var(--text-faint);">${totalLogs} log${totalLogs>1?'s':''} renseigné${totalLogs>1?'s':''}</span>` : `<span style="font-size:11.5px;color:var(--text-faint);">Chargement…</span>`}
      </div>
      ${seancesHtml || '<div style="color:var(--text-faint);font-size:13px;">Aucune séance.</div>'}
    </div>`;
}

async function migSelectFeuille(nom) {
  migPreviewFeuilleSelected = nom;
  migPreviewFeuilleData = null;
  migPreviewFeuilleLoading = true;
  migPreviewSemaineIdx = 0;
  migPreviewSeancesCache = {};
  migPreviewSeancesLoading = false;
  const content = document.getElementById('migPreviewContent');
  if (content) content.innerHTML = _renderMigPreviewTabContent();
  try {
    const [seancesRaw, semainesRaw] = await Promise.all([
      apiGasProd('listerSeances', migPreviewClientId, { nomFeuille: nom }),
      apiGasProd('listerSemaines', migPreviewClientId, { nomFeuille: nom }),
    ]);
    const seances  = typeof seancesRaw  === 'string' ? JSON.parse(seancesRaw)  : (seancesRaw  || []);
    const semaines = typeof semainesRaw === 'string' ? JSON.parse(semainesRaw) : (semainesRaw || []);
    migPreviewFeuilleData = { seances, semaines };
  } catch(e) {
    migPreviewFeuilleData = { seances: [], semaines: [], erreur: e.message };
  }
  migPreviewFeuilleLoading = false;
  const c2 = document.getElementById('migPreviewContent');
  if (c2) c2.innerHTML = _renderMigPreviewTabContent();
  // Charger sem1 en arrière-plan pour afficher les exercices
  if (migPreviewFeuilleData && migPreviewFeuilleData.semaines.length) {
    const sem0 = migPreviewFeuilleData.semaines[0];
    await _migLoadSemaineSeances(nom, migPreviewFeuilleData.seances, sem0);
    const c3 = document.getElementById('migProgDetail');
    if (c3) c3.innerHTML = _renderProgGASDetail(migPreviewFeuilleData, migPreviewData.supaClientProgs);
  }
}

async function _migLoadSemaineSeances(nom, seances, sem) {
  if (migPreviewSeancesCache[sem]) return;
  migPreviewSeancesLoading = true;
  const results = await Promise.all((seances||[]).map(async seance => {
    try {
      const raw = await apiGasProd('chargerSeance', migPreviewClientId, { nomFeuille: nom, ligneSeance: seance.ligne, semaine: sem });
      const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
      return d || { exercices: [] };
    } catch(e) { return { exercices: [] }; }
  }));
  migPreviewSeancesCache[sem] = results;
  migPreviewSeancesLoading = false;
}

async function migChangerSemaine(delta) {
  if (!migPreviewFeuilleData) return;
  const semaines = migPreviewFeuilleData.semaines || [];
  const newIdx = Math.max(0, Math.min(semaines.length - 1, migPreviewSemaineIdx + delta));
  if (newIdx === migPreviewSemaineIdx) return;
  migPreviewSemaineIdx = newIdx;
  const sem = semaines[newIdx];
  const c = document.getElementById('migProgDetail');
  if (!migPreviewSeancesCache[sem]) {
    if (c) c.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:20px;"><div class="spin"></div> Chargement semaine ${sem}…</div>`;
    await _migLoadSemaineSeances(migPreviewFeuilleSelected, migPreviewFeuilleData.seances, sem);
  }
  if (c) c.innerHTML = _renderProgGASDetail(migPreviewFeuilleData, migPreviewData.supaClientProgs);
}

async function migrerProgrammeGAS() {
  const statusEl = document.getElementById('migProgStatus');
  if (!migPreviewFeuilleData || !migPreviewFeuilleSelected) return;
  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-size:12px;"><div class="spin"></div> Chargement des exercices et import…</div>`;
  document.querySelectorAll('#migProgDetail .btn.primary').forEach(b => b.disabled = true);
  try {
    const nom = migPreviewFeuilleSelected; // nom de la feuille GAS — sert aux appels apiGasProd ci-dessous, ne pas renommer
    const nomCible = document.getElementById('migProgNomInput')?.value.trim() || nom; // nom voulu côté Supabase
    const blocType = document.getElementById('migProgBlocTypeSel')?.value || null;
    const seances = migPreviewFeuilleData.seances || [];
    const semaines = migPreviewFeuilleData.semaines || [];
    const totalSemaines = semaines.length || 8;
    const semaine1 = semaines[0] || 1;

    // 1. Créer le client_programme
    await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(migPreviewClientId)}`,
      { method:'PATCH', headers:supaHeaders(), body:JSON.stringify({ actif: false }) });
    const cpRes = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes`,
      { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ client_id: migPreviewClientId, nom: nomCible, actif: true }) });
    if (!cpRes.ok) throw new Error('programme ' + cpRes.status);
    const cp = (await cpRes.json())[0];

    // 2. Créer un bloc unique, typé, et le définir comme bloc actif
    const bRes = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs`,
      { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ client_programme_id: cp.id, ordre: 0, type: blocType || null, nombre_semaines: totalSemaines }) });
    if (!bRes.ok) throw new Error('bloc ' + bRes.status);
    const bloc = (await bRes.json())[0];
    await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${cp.id}`,
      { method:'PATCH', headers:supaHeaders(), body:JSON.stringify({ bloc_actif_id: bloc.id }) });

    // 3. Pour chaque séance, créer la séance + charger les exercices depuis sem1
    for (let si = 0; si < seances.length; si++) {
      const seance = seances[si];
      const sRes = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ bloc_id: bloc.id, titre: seance.nom + (seance.type ? ' — ' + seance.type : ''), ordre: si }) });
      if (!sRes.ok) throw new Error('seance ' + sRes.status);
      const savedSeance = (await sRes.json())[0];

      // Charger les exercices (sem1) + logs toutes semaines
      try {
        const seanceData = await apiGasProd('chargerSeance', migPreviewClientId, { nomFeuille: nom, ligneSeance: seance.ligne, semaine: semaine1 });
        const sd = typeof seanceData === 'string' ? JSON.parse(seanceData) : seanceData;
        const exercices = (sd && sd.exercices) || [];
        let savedExercices = [];
        if (exercices.length) {
          const exPayload = exercices.map((ex, ei) => ({
            seance_id: savedSeance.id, nom: ex.nom||'Exercice', ordre: ei,
            series: ex.series || null, reps: ex.repsCible || ex.reps || null,
            repos: ex.repos || null, tempo: ex.tempo || null, rir: ex.rirCible || null,
          }));
          const exRes = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices`,
            { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(exPayload) });
          if (exRes.ok) savedExercices = await exRes.json();
        }
        // Logs : charger toutes les semaines en parallèle
        if (savedExercices.length && semaines.length) {
          const semLogsData = await Promise.all(semaines.map(async sem => {
            try {
              const raw = await apiGasProd('chargerSeance', migPreviewClientId, { nomFeuille: nom, ligneSeance: seance.ligne, semaine: sem });
              const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
              return { sem, exercices: (d && d.exercices) || [] };
            } catch(e) { return { sem, exercices: [] }; }
          }));
          const logsPayload = [];
          semLogsData.forEach(({ sem, exercices: exsSem }) => {
            exsSem.forEach((ex, ei) => {
              const exId = savedExercices[ei]?.id;
              if (!exId) return;
              (ex.sets || []).forEach((set, si) => {
                if (set.charge === '' && set.reps === '' && set.rir === '') return;
                logsPayload.push({
                  client_programme_exercice_id: exId,
                  semaine: sem,
                  numero_serie: set.serie,
                  charge: parseFloat(set.charge) || null,
                  reps: parseInt(set.reps) || null,
                  rir: set.rir !== '' ? (parseInt(set.rir) ?? null) : null,
                  commentaire: si === 0 && ex.note ? ex.note : null,
                });
              });
            });
          });
          if (logsPayload.length) {
            await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?on_conflict=client_programme_exercice_id,semaine,numero_serie`,
              { method:'POST', headers:supaHeaders({ Prefer:'return=minimal,resolution=merge-duplicates' }), body:JSON.stringify(logsPayload) });
          }
        }
      } catch(e2) { /* non critique */ }
    }

    // 4. Recharger supaClientProgs
    const r2 = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(migPreviewClientId)}&order=created_at.desc`, { headers: supaHeaders() });
    migPreviewData.supaClientProgs = r2.ok ? await r2.json() : migPreviewData.supaClientProgs;

    if (statusEl) statusEl.innerHTML = `<div style="color:var(--success);font-size:12px;padding:6px 0;">✓ Programme importé. ${seances.length} séances · ${semaines.length} semaines de logs.</div>`;
    document.querySelectorAll('#migProgDetail .btn.primary').forEach(b => b.disabled = false);
    const c = document.getElementById('migProgDetail');
    if (c) c.innerHTML = _renderProgGASDetail(migPreviewFeuilleData, migPreviewData.supaClientProgs);
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<div style="color:var(--critical);font-size:12px;">Erreur : ${esc(e.message)}</div>`;
    document.querySelectorAll('#migProgDetail .btn.primary').forEach(b => b.disabled = false);
  }
}

async function migrerFeuilleCommeBloc() {
  const progSel = document.getElementById('migBlocProgSel');
  const typeSel = document.getElementById('migBlocTypeSel');
  const statusEl = document.getElementById('migProgStatus');
  if (!progSel || !migPreviewFeuilleData || !migPreviewFeuilleSelected) return;

  const progId = parseInt(progSel.value);
  const type = typeSel?.value || null;
  const definirActif = document.getElementById('migBlocActifCb')?.checked;
  const nom = migPreviewFeuilleSelected;
  const seances = migPreviewFeuilleData.seances || [];
  const semaines = migPreviewFeuilleData.semaines || [];
  const totalSemaines = semaines.length || 8;
  const semaine1 = semaines[0] || 1;

  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-size:12px;"><div class="spin"></div> Import du bloc en cours…</div>`;
  document.querySelectorAll('#migProgDetail .btn').forEach(b => b.disabled = true);

  try {
    // Ordre du prochain bloc
    const blocsRes = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs?client_programme_id=eq.${progId}&select=ordre&order=ordre.desc&limit=1`, { headers: supaHeaders() });
    const blocsExist = blocsRes.ok ? await blocsRes.json() : [];
    const nextOrdre = blocsExist.length > 0 ? (blocsExist[0].ordre + 1) : 0;

    // Créer le bloc
    const bRes = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs`,
      { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ client_programme_id: progId, ordre: nextOrdre, type: type || null, nombre_semaines: totalSemaines }) });
    if (!bRes.ok) throw new Error('bloc ' + bRes.status);
    const bloc = (await bRes.json())[0];
    if (definirActif) {
      await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${progId}`,
        { method:'PATCH', headers:supaHeaders(), body:JSON.stringify({ bloc_actif_id: bloc.id }) });
    }

    // Séances + exercices + logs
    for (let si = 0; si < seances.length; si++) {
      const seance = seances[si];
      const sRes = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ bloc_id: bloc.id, titre: seance.nom + (seance.type ? ' — ' + seance.type : ''), ordre: si }) });
      if (!sRes.ok) throw new Error('seance ' + sRes.status);
      const savedSeance = (await sRes.json())[0];

      try {
        const seanceData = await apiGasProd('chargerSeance', migPreviewClientId, { nomFeuille: nom, ligneSeance: seance.ligne, semaine: semaine1 });
        const sd = typeof seanceData === 'string' ? JSON.parse(seanceData) : seanceData;
        const exercices = (sd && sd.exercices) || [];
        let savedExercices = [];
        if (exercices.length) {
          const exPayload = exercices.map((ex, ei) => ({
            seance_id: savedSeance.id, nom: ex.nom||'Exercice', ordre: ei,
            series: ex.series || null, reps: ex.repsCible || ex.reps || null,
            repos: ex.repos || null, tempo: ex.tempo || null, rir: ex.rirCible || null,
          }));
          const exRes = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices`,
            { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(exPayload) });
          if (exRes.ok) savedExercices = await exRes.json();
        }
        if (savedExercices.length && semaines.length) {
          const semLogsData = await Promise.all(semaines.map(async sem => {
            try {
              const raw = await apiGasProd('chargerSeance', migPreviewClientId, { nomFeuille: nom, ligneSeance: seance.ligne, semaine: sem });
              const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
              return { sem, exercices: (d && d.exercices) || [] };
            } catch(e) { return { sem, exercices: [] }; }
          }));
          const logsPayload = [];
          semLogsData.forEach(({ sem, exercices: exsSem }) => {
            exsSem.forEach((ex, ei) => {
              const exId = savedExercices[ei]?.id;
              if (!exId) return;
              (ex.sets || []).forEach((set, si2) => {
                if (set.charge === '' && set.reps === '' && set.rir === '') return;
                logsPayload.push({
                  client_programme_exercice_id: exId, semaine: sem, numero_serie: set.serie,
                  charge: parseFloat(set.charge) || null, reps: parseInt(set.reps) || null,
                  rir: set.rir !== '' ? (parseInt(set.rir) ?? null) : null,
                  commentaire: si2 === 0 && ex.note ? ex.note : null,
                });
              });
            });
          });
          if (logsPayload.length) {
            await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?on_conflict=client_programme_exercice_id,semaine,numero_serie`,
              { method:'POST', headers:supaHeaders({ Prefer:'return=minimal,resolution=merge-duplicates' }), body:JSON.stringify(logsPayload) });
          }
        }
      } catch(e2) { /* non critique */ }
    }

    if (statusEl) statusEl.innerHTML = `<div style="color:var(--success);font-size:12px;padding:6px 0;">✓ Bloc ajouté (${seances.length} séances · ${semaines.length} semaines de logs).</div>`;
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<div style="color:var(--critical);font-size:12px;">Erreur : ${esc(e.message)}</div>`;
  }
  document.querySelectorAll('#migProgDetail .btn').forEach(b => b.disabled = false);
}

function toggleBilanSel(ligneTitre, checked) {
  if (checked) migBilanSel.add(ligneTitre);
  else migBilanSel.delete(ligneTitre);
  const content = document.getElementById('migPreviewContent');
  if (content) content.innerHTML = _renderMigPreviewBilans();
}

function toggleAllBilanSel(checked) {
  const bilans = migPreviewData.gasBilans || [];
  if (checked) bilans.forEach(b => migBilanSel.add(b.ligneTitre));
  else bilans.forEach(b => migBilanSel.delete(b.ligneTitre));
  const content = document.getElementById('migPreviewContent');
  if (content) content.innerHTML = _renderMigPreviewBilans();
}

async function migrerBilansGas(clientId) {
  const sel = [...migBilanSel];
  if (!sel.length) return;
  const gasId = _gasId(clientId);
  const errors = [];
  let ok = 0;

  const content = document.getElementById('migPreviewContent');
  if (content) content.innerHTML = `<div style="display:flex;align-items:center;gap:12px;padding:32px;"><div class="spin"></div> Import en cours… (0 / ${sel.length})</div>`;

  for (let i = 0; i < sel.length; i++) {
    const ligneTitre = sel[i];
    if (content) content.querySelector('div > div:last-child')?.remove();
    if (content) {
      const msg = content.querySelector('div');
      if (msg) msg.innerHTML = `<div class="spin"></div> Import en cours… (${i} / ${sel.length})`;
    }
    try {
      const raw = await apiGasProd('chargerBilanParLigne', gasId, { ligneTitre });
      const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
      const bilanHisto = (migPreviewData.gasBilans || []).find(b => b.ligneTitre === ligneTitre);
      const dateStr = d.dateValidation || bilanHisto?.date || null;
      const dateIso = _parseDateFr(dateStr);
      const jourBilanNom = migPreviewData.supaProfile?.jour_bilan || null;
      const payload = {
        client_id: clientId,
        date_validation: dateIso || null,
        semaine_label: _semaineLabelFromSheetDate(dateIso, jourBilanNom) || bilanHisto?.semaine || null,
        jours: d.jours || [],
        repas_eval: d.repas || [],
        commentaire_alim: d.commentaireAlim || null,
        commentaire_jour: d.commentaireJour || null,
        commentaire_activite: d.commentaireActivite || null,
        envoye_coach: true,
        coach_traite: !!(bilanHisto?.dejaEnvoye),
        gas_ligne_titre: ligneTitre,
        archive: false,
      };
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/bilans?on_conflict=client_id,gas_ligne_titre`,
        { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }), body: JSON.stringify(payload) }
      );
      if (!res.ok) { const t = await res.text(); errors.push(`${bilanHisto?.semaine||ligneTitre}: ${res.status} — ${t}`); }
      else ok++;
    } catch(e) { errors.push(`${ligneTitre}: ${e.message}`); }
  }

  // Reload supaBilans pour mettre à jour l'UI
  const supaBilansRes = await fetch(
    `${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(clientId)}&select=gas_ligne_titre`,
    { headers: supaHeaders() }
  ).catch(() => null);
  const supaBilansRows = supaBilansRes?.ok ? await supaBilansRes.json() : [];
  const supaBilanLignes = new Set(supaBilansRows.map(r => r.gas_ligne_titre));
  migPreviewData.supaBilanLignes = supaBilanLignes;
  migBilanSel = new Set((migPreviewData.gasBilans || []).filter(b => !supaBilanLignes.has(b.ligneTitre)).map(b => b.ligneTitre));

  if (content) content.innerHTML = _renderMigPreviewBilans();
  if (errors.length) alert(`${ok} bilans importés, ${errors.length} erreur(s) :\n${errors.slice(0, 5).join('\n')}`);
}

// ── Migration Progression ──────────────────────────────────────────────

function _renderMigPreviewProgression() {
  const gas = migPreviewData.gasProgression;
  const supa = migPreviewData.supaProgression;
  const dejaImporte = !!supa;

  const row = (label, gasVal, supaVal) =>
    `<tr><td style="padding:6px 12px;color:var(--text-faint)">${label}</td><td style="padding:6px 12px">${gasVal ?? '—'}</td><td style="padding:6px 12px">${supaVal ?? '—'}</td></tr>`;

  return `<div style="padding:16px">
    <h3 style="margin:0 0 12px">Progression GAS → Supabase</h3>
    ${!gas ? `<div style="color:var(--text-faint);padding:12px 0">Données GAS non disponibles pour ce client.</div>` : `
    <div style="background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--text-muted);">
      L'XP total GAS est importé comme <strong>point de départ</strong> — l'activité future (bilans envoyés dans Supabase) s'ajoute par-dessus normalement, plus rien ne l'écrase ensuite. Niveau/pas cumulés restent recalculés automatiquement à partir de ce total et des bilans importés.
    </div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:16px">
      <thead><tr style="text-align:left;border-bottom:1px solid var(--border)">
        <th style="padding:6px 12px;color:var(--text-faint)">Champ</th>
        <th style="padding:6px 12px">GAS</th>
        <th style="padding:6px 12px">Supabase actuel</th>
      </tr></thead>
      <tbody>
        ${row('XP total', gas.xpTotal ?? gas.xp, supa?.xp_total ?? '—')}
        ${row('Titre actif', gas.titreActif ?? gas.titre_actif, supa?.titre_actif ?? '—')}
        ${row('Titres vus', gas.seenTitres ?? gas.seen_titres, supa?.seen_titres ?? '—')}
      </tbody>
    </table>
    ${dejaImporte ? `<div style="color:var(--success);margin-bottom:12px">✓ Données déjà présentes dans Supabase</div>` : ''}
    <button class="btn-primary" onclick="migrerProgressionGAS('${migPreviewClientId}')">
      ${dejaImporte ? '↻ Ré-importer la progression' : '⬇ Importer la progression'}
    </button>`}
  </div>`;
}

async function migrerProgressionGAS(clientId) {
  const gas = migPreviewData.gasProgression;
  if (!gas) return;
  try {
    // xp_total est importé une fois comme point de départ — ensuite,
    // seul _crediterXpBilanEnvoye (bilan.js) l'incrémente, jamais recalculé
    // ni écrasé ici. Le niveau/pas cumulés restent dérivés automatiquement.
    const body = {
      client_id: clientId,
      xp_total: gas.xpTotal ?? gas.xp_total ?? 0,
      titre_actif: gas.titreActif ?? gas.titre_actif ?? null,
      seen_titres: gas.seenTitres ?? gas.seen_titres ?? 0,
      updated_at: new Date().toISOString()
    };
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_progression?on_conflict=client_id`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=representation,resolution=merge-duplicates' }),
      body: JSON.stringify(body)
    });
    if (!res.ok) { alert('Erreur : ' + await res.text()); return; }
    const rows = await res.json();
    migPreviewData.supaProgression = rows[0] || body;
    const content = document.getElementById('migPreviewContent');
    if (content) content.innerHTML = _renderMigPreviewProgression();
  } catch(e) { alert('Erreur : ' + e.message); }
}

let _ficheCreateClientId = null; // clientId en cours de création
let _ficheEditClientId = null;   // clientId en cours d'édition diète
let _ficheEditClientDieteId = null; // client_dietes.id en cours d'édition — pour resynchroniser son nom après renommage du template

function ouvrirCreerDietePourClient(clientId) {
  _ficheCreateClientId = clientId;
  _dietNavBack = 'fiche-client';
  dieteTplEnEdition = { id:null, nom:'', description:'', repas:[{ nom:'Repas 1', ordre:0, variante_index:0, aliments:[] }] };
  setNav('editeur-diete');
}

async function sauvegarderDietePourClient() {
  // Override de sauvegarderDieteTemplate pour le mode fiche client
  const nom = document.getElementById('dNom').value.trim();
  const errEl = document.getElementById('dErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  dieteTplEnEdition.nom = nom;
  dieteTplEnEdition.description = document.getElementById('dDesc').value.trim();
  const commeTemplate = document.getElementById('cbDieteCommeTemplate')?.checked !== false;
  try {
    // Créer le template
    const tplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates`,
      { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ nom:dieteTplEnEdition.nom, description:dieteTplEnEdition.description||null, client_only: !commeTemplate }) });
    if (!tplRes.ok) throw new Error('template ' + tplRes.status);
    const tpl = (await tplRes.json())[0];
    // Sauver repas + aliments
    for (let ri=0; ri<dieteTplEnEdition.repas.length; ri++){
      const r = dieteTplEnEdition.repas[ri];
      const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id:tpl.id, nom:r.nom, ordre:ri }) });
      if (!rRes.ok) throw new Error('repas ' + rRes.status);
      const savedR = (await rRes.json())[0];
      if (r.aliments.length){
        const alimPayload = r.aliments.map((a,ai)=>({ repas_id:savedR.id, nom:a.nom, unite:a.unite||'g', quantite_g:a.quantite_g, kcal_par_100g:a.kcal_par_100g, prot_par_100g:a.prot_par_100g, glu_par_100g:a.glu_par_100g, lip_par_100g:a.lip_par_100g, ordre:ai, modifie:!!a.modifie }));
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`, { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(alimPayload) });
      }
    }
    // Assigner au client
    await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(_ficheCreateClientId)}`,
      { method:'PATCH', headers:supaHeaders(), body:JSON.stringify({ actif: false }) });
    await fetch(`${SUPABASE_URL}/rest/v1/client_dietes`,
      { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify({ client_id: _ficheCreateClientId, nom: tpl.nom, diete_template_id: tpl.id, actif: true, brouillon: true }) });
    dieteTemplatesData = null;
    const cid = _ficheCreateClientId;
    _ficheCreateClientId = null;
    await openPanel(cid);
    setFicheTab('diete');
    setNav('fiche-client');
    setFicheTab('diete');
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

async function editerDieteClient(nomDiete, clientId, clientDieteId) {
  _ficheEditClientId = clientId;
  _ficheEditClientDieteId = clientDieteId || null;
  _dietNavBack = 'fiche-client';
  // Résout via client_dietes.diete_template_id quand disponible (fiable) — sinon fallback
  // par nom (diètes assignées avant l'ajout de cette colonne). Le fallback par nom peut
  // ramener le mauvais template si deux clients ont une diète du même nom.
  let tpl = null;
  if (clientDieteId) {
    const cdRes = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?id=eq.${clientDieteId}&select=diete_template_id`, { headers: supaHeaders() });
    const cd = cdRes.ok ? await cdRes.json() : [];
    if (cd.length && cd[0].diete_template_id) {
      const tRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${cd[0].diete_template_id}&select=*`, { headers: supaHeaders() });
      if (tRes.ok) { const t = await tRes.json(); tpl = t[0] || null; }
    }
  }
  if (!tpl) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?nom=eq.${encodeURIComponent(nomDiete)}&order=id.desc&limit=1&select=*`, { headers: supaHeaders() });
    if (!res.ok) { alert('Erreur chargement template'); _ficheEditClientId = null; _ficheEditClientDieteId = null; return; }
    const tpls = await res.json();
    if (!tpls.length) { alert(`Aucun template trouvé pour la diète "${nomDiete}"`); _ficheEditClientId = null; _ficheEditClientDieteId = null; return; }
    tpl = tpls[0];
  }
  const repasRes = await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tpl.id}&order=ordre.asc,variante_index.asc&select=*,repas_aliments(*)&repas_aliments.order=ordre.asc`, { headers: supaHeaders() });
  const repasRaw = repasRes.ok ? await repasRes.json() : [];
  dieteTplEnEdition = {
    id: tpl.id, nom: tpl.nom, description: tpl.description||'',
    repas: repasRaw.map(r=>({ id:r.id, nom:r.nom, ordre:r.ordre||0, variante_index:r.variante_index||0, commentaire:r.commentaire||'', aliments:(r.repas_aliments||[]).map(a=>({id:a.id,nom:a.nom,unite:a.unite||'g',quantite_g:a.quantite_g,kcal_par_100g:a.kcal_par_100g,prot_par_100g:a.prot_par_100g,glu_par_100g:a.glu_par_100g,lip_par_100g:a.lip_par_100g,modifie:!!a.modifie})) }))
  };
  if (!dieteTplEnEdition.repas.length) dieteTplEnEdition.repas = [{ nom:'Repas 1', ordre:0, variante_index:0, aliments:[] }];
  setNav('editeur-diete');
}

function ouvrirCreerProgrammePourClient(clientId) {
  _ficheCreateClientId = clientId;
  ouvrirEditeurTemplate(null);
  setTimeout(() => {

      cb.innerHTML = `<input type="checkbox" id="cbProgCommeTemplate"> Enregistrer aussi comme template`;

async function confirmerSauvegardeTemplatePourClient() {
  const errEl = document.getElementById('tplErr');
  if (!tplEnEdition.nom.trim()) { errEl.textContent = 'Le nom est obligatoire.'; errEl.style.display = 'block'; return; }
  const commeTemplate = document.getElementById('cbProgCommeTemplate')?.checked === true;
  try {
