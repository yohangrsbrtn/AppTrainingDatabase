// ── Boot ───────────────────────────────────────────────────────────────
function _showShell() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('shell').style.display   = 'grid';
  const saved = localStorage.getItem('console_sidebar_collapsed');
  _sidebarCollapsed = saved !== null ? saved === '1' : window.innerWidth < 700;
  document.getElementById('shell').classList.toggle('sidebar-collapsed', _sidebarCollapsed);
  if (_todos === null) chargerTodos();
}

// ── Pense-bête (📌, accès rapide depuis toute la console) ────────────────
// Widget flottant hors du routeur setNav/renderMain — vit dans le shell HTML
// statique (jamais réécrit par un changement de page), donc reste ouvert/
// disponible peu importe l'onglet consulté. Chaque ajout/coche/suppression
// s'enregistre immédiatement dans Supabase (table coach_todos, pas de bouton
// "sauvegarder" séparé).
let _todos = null;
let _todoPanelOuvert = false;
let _todoEditingId = null;
let _todoVue = 'liste'; // 'liste' | 'corbeille'
let _todosCorbeille = null;

async function chargerTodos(){
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/coach_todos?archive=eq.false&order=fait.asc,created_at.desc`, { headers: supaHeaders() });
    _todos = res.ok ? await res.json() : [];
  } catch(e) { _todos = []; }
  if (_todoPanelOuvert) renderTodoList();
}

function toggleTodoPanel(){
  _todoPanelOuvert = !_todoPanelOuvert;
  document.getElementById('todoPanel').style.display = _todoPanelOuvert ? 'flex' : 'none';
  if (!_todoPanelOuvert) _todoVue = 'liste';
  if (_todoPanelOuvert) {
    renderTodoList(); // affiche tout de suite ce qu'on a déjà en mémoire
    chargerTodos();   // puis resynchronise avec la base à CHAQUE ouverture — le
                       // chargement fait une seule fois au démarrage de la page
                       // (_showShell) pouvait laisser le panneau affiché avec un
                       // contenu périmé si l'utilisateur rouvrait la console
                       // après un moment (ex: juste après un refresh, quand le
                       // fetch de boot n'a pas eu le temps de finir avant le clic).
    document.getElementById('todoNewInput').focus();
  }
}

function renderTodoList(){
  const el = document.getElementById('todoListEl');
  if (!el) return;
  const titreEl = document.getElementById('todoPanelTitre');
  const inputRow = document.getElementById('todoInputRow');
  const corbeilleBtn = document.getElementById('todoCorbeilleBtn');
  if (titreEl) titreEl.textContent = _todoVue === 'corbeille' ? '🗑 Corbeille' : '📌 Pense-bête';
  if (inputRow) inputRow.style.display = _todoVue === 'corbeille' ? 'none' : '';
  if (corbeilleBtn) corbeilleBtn.style.opacity = _todoVue === 'corbeille' ? '1' : '.6';
  if (_todoVue === 'corbeille') { renderTodoCorbeilleListe(el); return; }
  // Distingue "pas encore chargé" de "chargé et vraiment vide" — sans ça les
  // deux affichaient le même texte "Rien pour l'instant.", donnant l'impression
  // que la note qu'on venait d'ajouter avait disparu si le premier fetch de
  // boot (_showShell) n'avait pas encore fini au moment où on ouvre le panneau.
  if (_todos === null) { el.innerHTML = `<div style="text-align:center;color:var(--text-faint);font-size:12.5px;padding:20px 6px;">Chargement…</div>`; return; }
  const todos = _todos;
  el.innerHTML = todos.length ? todos.map(t => t.id === _todoEditingId ? `
    <div style="padding:6px 2px;border-bottom:1px solid var(--hairline);">
      <textarea id="todoEditArea-${t.id}" rows="3" style="font-size:13px;width:100%;padding:6px 7px;border-radius:var(--radius-sm);border:1px solid var(--hairline);background:var(--surface-2);color:var(--text);resize:vertical;line-height:1.4;" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sauverTodoTexte(${t.id});}if(event.key==='Escape'){_todoEditingId=null;renderTodoList();}">${esc(t.texte)}</textarea>
      <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:5px;">
        <button class="btn" style="font-size:11.5px;padding:3px 9px;" onclick="_todoEditingId=null;renderTodoList();">Annuler</button>
        <button class="btn primary" style="font-size:11.5px;padding:3px 9px;" onclick="sauverTodoTexte(${t.id})">Enregistrer</button>
      </div>
    </div>` : `
    <div style="display:flex;align-items:flex-start;gap:7px;padding:6px 2px;border-bottom:1px solid var(--hairline);">
      <input type="checkbox" ${t.fait?'checked':''} onchange="toggleTodo(${t.id},this.checked)" style="margin-top:2px;flex-shrink:0;">
      <div style="flex:1;font-size:13px;line-height:1.4;word-break:break-word;white-space:pre-wrap;cursor:text;${t.fait?'text-decoration:line-through;color:var(--text-faint);':''}" onclick="_todoEditingId=${t.id};renderTodoList();" title="Cliquer pour éditer">${esc(t.texte)}</div>
      <button class="icon-btn del" style="width:20px;height:20px;flex-shrink:0;" onclick="supprimerTodo(${t.id})" title="Supprimer">${iTrash()}</button>
    </div>`).join('')
    : `<div style="text-align:center;color:var(--text-faint);font-size:12.5px;padding:20px 6px;">Rien pour l'instant.</div>`;
  if (_todoEditingId !== null) {
    const ta = document.getElementById(`todoEditArea-${_todoEditingId}`);
    if (ta) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }
  }
}

async function sauverTodoTexte(id){
  const ta = document.getElementById(`todoEditArea-${id}`);
  if (!ta) return;
  const texte = ta.value.trim();
  if (!texte) return;
  const t = (_todos || []).find(x => x.id === id);
  if (t) t.texte = texte;
  _todoEditingId = null;
  renderTodoList();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/coach_todos?id=eq.${id}`, {
      method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ texte })
    });
  } catch(e) {}
}

async function ajouterTodo(){
  const input = document.getElementById('todoNewInput');
  const texte = input.value.trim();
  if (!texte) return;
  input.value = '';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/coach_todos`, {
      method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }),
      body: JSON.stringify({ texte, fait: false })
    });
    if (!res.ok) throw new Error();
    const saved = (await res.json())[0];
    _todos = [saved, ...(_todos || [])];
    renderTodoList();
  } catch(e) { input.value = texte; alert("Erreur : la note n'a pas pu être enregistrée."); }
}

async function toggleTodo(id, fait){
  const t = (_todos || []).find(x => x.id === id);
  if (t) t.fait = fait;
  renderTodoList();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/coach_todos?id=eq.${id}`, {
      method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ fait })
    });
    // Réordonne (fait passe en bas) sans tout recharger.
    _todos.sort((a,b) => (a.fait===b.fait ? 0 : a.fait ? 1 : -1));
    renderTodoList();
  } catch(e) {}
}

// "Supprimer" archive (réversible, via la corbeille) au lieu d'un DELETE définitif —
// suite à une note supprimée par erreur sans aucun moyen de la retrouver.
async function supprimerTodo(id){
  _todos = (_todos || []).filter(x => x.id !== id);
  renderTodoList();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/coach_todos?id=eq.${id}`, { method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ archive: true }) });
  } catch(e) {}
}

function toggleTodoCorbeille(){
  _todoVue = _todoVue === 'corbeille' ? 'liste' : 'corbeille';
  if (_todoVue === 'corbeille') chargerTodosCorbeille();
  renderTodoList();
}

async function chargerTodosCorbeille(){
  const el = document.getElementById('todoListEl');
  if (el && _todosCorbeille === null) el.innerHTML = `<div style="text-align:center;color:var(--text-faint);font-size:12.5px;padding:20px 6px;">Chargement…</div>`;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/coach_todos?archive=eq.true&order=created_at.desc`, { headers: supaHeaders() });
    _todosCorbeille = res.ok ? await res.json() : [];
  } catch(e) { _todosCorbeille = []; }
  if (_todoVue === 'corbeille') renderTodoList();
}

function renderTodoCorbeilleListe(el){
  if (_todosCorbeille === null) { el.innerHTML = `<div style="text-align:center;color:var(--text-faint);font-size:12.5px;padding:20px 6px;">Chargement…</div>`; return; }
  el.innerHTML = _todosCorbeille.length ? _todosCorbeille.map(t => `
    <div style="display:flex;align-items:flex-start;gap:7px;padding:6px 2px;border-bottom:1px solid var(--hairline);">
      <div style="flex:1;font-size:13px;line-height:1.4;word-break:break-word;white-space:pre-wrap;color:var(--text-faint);">${esc(t.texte)}</div>
      <button class="btn" style="font-size:11px;padding:3px 8px;flex-shrink:0;" onclick="restaurerTodo(${t.id})" title="Restaurer">↺</button>
      <button class="icon-btn del" style="width:20px;height:20px;flex-shrink:0;" onclick="supprimerTodoDefinitivement(${t.id})" title="Supprimer définitivement">${iTrash()}</button>
    </div>`).join('')
    : `<div style="text-align:center;color:var(--text-faint);font-size:12.5px;padding:20px 6px;">Corbeille vide.</div>`;
}

async function restaurerTodo(id){
  _todosCorbeille = (_todosCorbeille || []).filter(x => x.id !== id);
  renderTodoList();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/coach_todos?id=eq.${id}`, { method: 'PATCH', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify({ archive: false }) });
  } catch(e) {}
  _todos = null; // force la resynchronisation de la liste principale à la prochaine ouverture
}

async function supprimerTodoDefinitivement(id){
  if (!confirm('Supprimer définitivement cette note ? Action irréversible.')) return;
  _todosCorbeille = (_todosCorbeille || []).filter(x => x.id !== id);
  renderTodoList();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/coach_todos?id=eq.${id}`, { method: 'DELETE', headers: supaHeaders({ Prefer: 'return=minimal' }) });
  } catch(e) {}
}
let _sidebarCollapsed = false;
function toggleSidebar(){
  _sidebarCollapsed = !_sidebarCollapsed;
  document.getElementById('shell').classList.toggle('sidebar-collapsed', _sidebarCollapsed);
  localStorage.setItem('console_sidebar_collapsed', _sidebarCollapsed ? '1' : '0');
}
// Restaure la page mémorisée par _saveNavState au dernier refresh. Renvoie
// true si elle a déjà déclenché son propre rendu (fiche-client passe par
// openPanel, qui fait renderSidebar+renderMain + charge les données) — dans
// ce cas l'appelant ne doit pas re-render par-dessus.
function _restoreNavState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('at_console_lastnav_v1') || 'null'); } catch(e) {}
  if (!saved || !saved.nav) return false;
  if (saved.nav === 'fiche-client' && saved.selected) { openPanel(saved.selected); return true; }
  if (saved.nav === 'mensurations' && saved.clientId) { mensurationsClientId = saved.clientId; state.nav = 'mensurations'; return false; }
  if (NAV_RESTORE_SIMPLE.has(saved.nav)) { state.nav = saved.nav; return false; }
  return false;
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// Deep-link depuis une notification push (sw.js, notificationclick) : ?openPage=chat en
// premier chargement, ou postMessage {type:'openPage'} si la fenêtre console était déjà
// ouverte (sw.js fait focus()+postMessage plutôt que rouvrir). Absent avant ce fix : la
// console ignorait totalement ?openPage, une notif de chat se contentait de refocus/
// recharger la console sans jamais amener le coach sur la page Chat.
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'openPage' && e.data.page) setNav(e.data.page);
});
function _applyDeepLinkNav(){
  const page = new URLSearchParams(location.search).get('openPage');
  if (!page) return;
  history.replaceState(null, '', location.pathname);
  setNav(page);
}

(async function boot(){
  // Le bouton flottant 📌 (#todoFab) vit hors du shell (#shell reste caché
  // derrière #loading jusqu'à _showShell) mais reste cliquable dès le premier
  // instant — sur un chargement à froid, chargerDonnees() peut prendre
  // plusieurs secondes (jusqu'au timeout de 15s ci-dessous) avant que
  // _showShell() soit atteint. Sans cet appel précoce, ouvrir le pense-bête
  // pendant ce délai le laissait affiché "vide" bien plus longtemps que
  // nécessaire (corrigé : renderTodoList distingue maintenant "Chargement…"
  // de "Rien pour l'instant.", mais autant réduire le délai à la source).
  chargerTodos();
  // Même logique que le pense-bête : souscription + badge de non-lus dès le boot, pas
  // seulement à l'ouverture du panneau/de la page Chat — sinon le badge du bouton
  // flottant ne reflèterait jamais les messages arrivés pendant que le coach navigue
  // ailleurs dans la console.
  _chatCoachSubscribe();
  _chatCoachInitNonLus();
  const cached = localStorage.getItem('at_console_cache_v2');
  if (cached) {
    try { data = JSON.parse(cached).data; } catch(e) {}
    _showShell();
    if (!_restoreNavState()) { renderSidebar(); renderMain(); }
    renderNotifMenu();
    _applyDeepLinkNav();
    // Mise à jour silencieuse en fond — ne bloque jamais l'UI. Timeout de secours :
    // chargerDonnees() fait des dizaines d'appels GAS en parallèle (un par client pour
    // verifierRetardBilan) sans AbortController côté api.js — si un seul reste bloqué
    // (GAS lent/muet), le Promise.all ne se résout ni ne rejette jamais et le spinner
    // "Mise à jour…" tournait indéfiniment. Le timeout ne annule pas l'appel réseau
    // sous-jacent (juste ignoré), mais garantit que l'UI se débloque toujours.
    _dataRefreshing = true; renderSidebar();
    const bgTimeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout_refresh_fond')), 20000));
    Promise.race([chargerDonnees(), bgTimeout])
      .catch(() => {})
      .finally(() => { _dataRefreshing = false; renderSidebar(); renderMain(); });
    return;
  }
  // Pas de cache : premier chargement — on attend avec un timeout de 15 s
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000));
    await Promise.race([chargerDonnees(), timeout]);
  } catch(e) {
    // Timeout ou erreur réseau : on affiche quand même ce qu'on a (data peut être partiel)
    if (!data || !data.clients) {
      _showShell();
      renderNotifMenu();
      document.getElementById('main').innerHTML =
        `<div class="empty-panel"><strong>Chargement lent ou erreur réseau.</strong><br><button class="btn primary" onclick="location.reload()" style="margin-top:10px;">Réessayer</button></div>`;
      return;
    }
  }
  _showShell();
  if (!_restoreNavState()) { renderSidebar(); renderMain(); }
  renderNotifMenu();
  _applyDeepLinkNav();
})();
</script>
