<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppTraining — Console Coach</title>
<style>
  :root {
    --bg: #0b0b0c;
    --surface: #151514;
    --surface-2: #1c1c1a;
    --surface-3: #262524;
    --hairline: rgba(255,255,255,0.055);
    --text: #f5f2ec;
    --text-muted: #9d968a;
    --text-faint: #656055;
    --accent: #f2ba3e;
    --accent-soft: #f2ba3e17;
    --accent-2: #f5a83c;
    --accent-2-soft: #f5a83c14;
    --success: #3ecf8e;
    --success-soft: #3ecf8e17;
    --warning: #e08a3c;
    --warning-soft: #e08a3c17;
    --critical: #e2615c;
    --critical-soft: #e2615c17;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg: 0 20px 44px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body);
    font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  ::selection { background: var(--accent-soft); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .shell { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 58px 1fr; height: 100vh; background: var(--bg); }

  .gate { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 20px; }
  .gate .mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .gate h1 { font-family: var(--font-display); font-size: 18px; margin: 0; }
  .gate p { color: var(--text-muted); font-size: 13px; margin: 0; max-width: 320px; }
  .gate a.btn { text-decoration: none; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface-3); border-top-color: var(--accent); animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Topbar ── */
  .topbar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 20px;
    border-bottom: 1px solid var(--hairline); background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.02em; width: 212px; flex-shrink: 0; }
  .brand .mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); flex-shrink: 0; }
  .brand .sub { color: var(--text-faint); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin-left: 2px; }

  .search { position: relative; flex: 1; max-width: 420px; }
  .search input {
    width: 100%; background: var(--surface); border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 8px 12px 8px 32px; color: var(--text); font-size: 12.5px; font-family: inherit;
  }
  .search input:focus { border-color: var(--hairline); }
  .search input::placeholder { color: var(--text-faint); }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }

  .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: var(--surface);
    color: var(--text); font-size: 12px; font-weight: 600; padding: 8px 13px; border-radius: var(--radius-sm); cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: #1a1408; }
  .btn.primary:hover { filter: brightness(1.08); }
  .icon-btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    border: none; background: var(--surface); border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .badge-dot { position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--critical); color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); }

  .avatar {
    width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--text);
  }

  /* ── Dropdowns ── */
  .dropdown { position: relative; }
  .menu {
    position: absolute; top: calc(100% + 8px); right: 0; min-width: 210px; background: var(--surface-2);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 6px;
    display: none; z-index: 60;
  }
  .menu.open { display: block; }
  .menu-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 9px; border-radius: 7px;
    border: none; background: none; color: var(--text); font-size: 12.5px; cursor: pointer;
  }
  .menu-item:hover { background: var(--surface-3); }
  .menu-item.danger { color: var(--critical); }
  .menu-item svg { color: var(--text-faint); flex-shrink: 0; }
  .menu-item.danger svg { color: var(--critical); }
  .menu-sep { height: 1px; background: var(--hairline); margin: 5px 4px; }
  .menu-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); padding: 6px 9px 3px; font-weight: 600; }

  /* ── Sidebar ── */
  .sidebar { border-right: 1px solid var(--hairline); background: var(--bg); display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto; }
  .nav-group { margin-bottom: 4px; }
  .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); font-weight: 700; padding: 14px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; text-align: left;
    padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .nav-item svg { flex-shrink: 0; color: var(--text-faint); }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); }
  .nav-item.active svg { color: var(--accent); }
  .nav-count { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; background: var(--surface-2); color: var(--text-muted); padding: 1px 6px; border-radius: 999px; }
  .sidebar-footer { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--hairline); display: flex; align-items: center; gap: 9px; }
  .sidebar-footer .name { font-size: 12px; font-weight: 700; }
  .sidebar-footer .role { font-size: 10.5px; color: var(--text-faint); }

  /* ── Main ── */
  .main { overflow-y: auto; padding: 24px 28px 40px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  .page-head .eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); font-weight: 700; margin-bottom: 4px; }
  .page-head h1 { font-family: var(--font-display); font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .page-head .meta { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

  /* ── Dashboard grid ── */
  .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: min-content; gap: 14px; }
  .card { background: var(--surface); border-radius: var(--radius); display: flex; flex-direction: column; box-shadow: var(--shadow-sm); }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 15px 16px 12px; }
  .card-head svg { color: var(--accent); flex-shrink: 0; }
  .card-head .t { font-weight: 700; font-size: 12.5px; margin-right: auto; }
  .card-head .link { font-size: 11.5px; color: var(--text-faint); cursor: pointer; font-weight: 600; }
  .card-head .link:hover { color: var(--accent); }
  .card-list { padding: 2px 8px 10px; overflow-y: auto; }
  .card-list-row { display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: 10px; cursor: pointer; }
  .card-list-row:hover { background: var(--surface-2); }
  .card-list-row .t { font-size: 12.5px; font-weight: 600; }
  .card-list-row .s { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .card-list-row .time { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); white-space: nowrap; }
  .card-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 12px; flex: 1; }
  .card-empty svg { color: var(--success); }

  .chart-card .chart-top { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px; }
  .chart-card .big-value { font-family: var(--font-mono); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .chart-card .period { font-size: 11.5px; color: var(--text-faint); border-radius: 999px; padding: 4px 10px; background: var(--surface-2); }
  .chart-card svg.bigchart { width: 100%; height: 108px; display: block; padding: 10px 8px 6px; }

  .timeline-card .card-list { padding: 4px 16px 14px; }
  .tl-row { display: flex; gap: 10px; padding: 9px 0; cursor: default; border-radius: 0; }
  .tl-row.clickable { cursor: pointer; }
  .tl-row.clickable:hover { background: var(--surface-2); }
  .tl-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: var(--accent); }
  .tl-row .t { font-size: 12.5px; }
  .tl-row .t b { font-weight: 700; }
  .tl-row .d { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); margin-top: 1px; }

  .table-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
  .table-toolbar { display: flex; align-items: center; gap: 8px; padding: 14px 16px; }
  .table-toolbar .title { font-weight: 700; font-size: 13px; margin-right: auto; }
  .chip-filter { display: flex; gap: 6px; }
  .chip-filter button {
    border: none; background: var(--surface-2); color: var(--text-muted); font-size: 11.5px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .chip-filter button.active { background: var(--accent); color: #1a1408; }

  .table-scroll { overflow-x: auto; }
  table.clients { width: 100%; border-collapse: collapse; min-width: 780px; }
  table.clients thead th {
    position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; padding: 8px 16px 12px;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  table.clients thead th:hover { color: var(--text); }
  table.clients thead th .sort-arrow { margin-left: 3px; opacity: 0.5; font-size: 9px; }
  table.clients thead th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  table.clients tbody tr { cursor: pointer; }
  table.clients tbody tr:hover td { background: var(--surface-2); }
  table.clients tbody tr.selected td { background: var(--accent-soft); }
  table.clients td { padding: 11px 16px; font-size: 12.5px; vertical-align: middle; border-top: 1px solid var(--hairline); }
  table.clients tbody tr:first-child td { border-top: none; }
  .cell-name { display: flex; align-items: center; gap: 9px; font-weight: 600; }
  .mini-avatar { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .level-pill { display: inline-flex; align-items: center; gap: 3px; background: var(--accent-2-soft); color: var(--accent-2); font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; }
  .chip.ok { background: var(--success-soft); color: var(--success); }
  .chip.ok .dot { background: var(--success); }
  .chip.late { background: var(--warning-soft); color: var(--warning); }
  .chip.late .dot { background: var(--warning); }
  .chip.off { background: var(--surface-3); color: var(--text-faint); }
  .chip.off .dot { background: var(--text-faint); }

  .row-actions { display: flex; justify-content: flex-end; }
  .row-actions .icon-btn { width: 28px; height: 28px; }

  .empty-panel { background: var(--surface); border-radius: var(--radius); padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 12.5px; }
  .empty-panel strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 6px; font-family: var(--font-display); }

  /* ── Detail slide-over ── */
  .overlay { position: fixed; inset: 58px 0 0 0; background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.16s ease; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 58px; right: 0; bottom: 0; width: 400px; background: var(--surface);
    box-shadow: var(--shadow-lg); z-index: 50; transform: translateX(100%); transition: transform 0.18s ease; display: flex; flex-direction: column;
    border-radius: 20px 0 0 0;
  }
  .panel.open { transform: translateX(0); }
  .panel-head { padding: 20px 20px 0; }
  .panel-head-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .panel-avatar { width: 46px; height: 46px; border-radius: var(--radius-sm); background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .panel-close { border: none; background: var(--surface-2); width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-muted); }
  .panel-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 10px 0 2px; }
  .panel-sub { font-size: 12px; color: var(--text-muted); }
  .panel-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .panel-stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 9px 10px; }
  .panel-stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; }
  .panel-stat .v { font-family: var(--font-mono); font-size: 15px; font-weight: 700; margin-top: 2px; }
  .panel-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--hairline); padding: 0 20px; }
  .panel-tab { border: none; background: none; padding: 9px 4px; margin-right: 16px; font-size: 12px; font-weight: 600; color: var(--text-faint); cursor: pointer; border-bottom: 2px solid transparent; }
  .panel-tab:hover { color: var(--text); }
  .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .note-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
  .note-item .txt { font-size: 12.5px; white-space: pre-wrap; }
  .note-item .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .note-item .date { font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono); }
  .note-item .del { border: none; background: none; color: var(--text-faint); cursor: pointer; font-size: 11px; }
  .note-item .del:hover { color: var(--critical); }
  .note-form textarea { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-size: 12.5px; font-family: inherit; resize: vertical; min-height: 64px; }
  .note-form textarea:focus { border-color: var(--hairline); }
  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .field-row input, .field-row select, .field-row textarea {
    width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 9px 11px; color: var(--text); font-size: 13px; font-family: inherit; box-sizing: border-box;
  }
  .field-row input:focus, .field-row select:focus, .field-row textarea:focus { border-color: var(--hairline); }
  .field-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-box { background: var(--surface); border-radius: var(--radius); padding: 22px; width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-box h3 { margin: 0 0 16px; font-family: var(--font-display); font-size: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; justify-content: center; }
  .day-block { background: var(--surface); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .day-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-weight: 700; font-size: 13px; }
  .day-head .del { margin-left: auto; }
  .exo-row { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-top: 1px solid var(--hairline); font-size: 12.5px; overflow-x: auto; }
  .exo-row .nom { flex: 1 1 110px; min-width: 90px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exo-row .stat { color: var(--text-muted); font-family: var(--font-mono); font-size: 11.5px; white-space: nowrap; }
  .exo-row .mini-btn { border: none; background: var(--surface-2); color: var(--text-muted); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; font-size: 11px; flex-shrink: 0; }
  .exo-row .mini-btn:hover { color: var(--text); }
  .exo-champ { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .exo-champ label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); }
  .exo-champ input { width: 52px; background: var(--surface-2); border: 1px solid transparent; border-radius: 6px; padding: 5px 7px; color: var(--text); font-size: 12px; font-family: inherit; box-sizing: border-box; }
  .exo-champ input:focus { border-color: var(--hairline); }
  .drag-handle { cursor: grab; color: var(--text-faint); font-size: 14px; padding: 0 2px; flex-shrink: 0; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .exo-row.drag-over { box-shadow: inset 0 2px 0 var(--accent); }
  .tpl-card { background: var(--surface); border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: var(--shadow-sm); }
  .tpl-card .nom { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .tpl-card .meta { font-size: 11.5px; color: var(--text-faint); }
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .panel-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  .panel-row:last-child { border-bottom: none; }

  /* ── Fiche client — page dédiée ── */
  .fiche-back { display:inline-flex; align-items:center; gap:7px; color:var(--text-muted); font-size:12.5px; font-weight:600; background:none; border:none; cursor:pointer; padding:0; margin-bottom:18px; }
  .fiche-back:hover { color:var(--text); }
  .fiche-hero { display:flex; align-items:center; gap:16px; padding:0 0 20px; border-bottom:1px solid var(--hairline); margin-bottom:22px; }
  .fiche-avatar { width:54px; height:54px; border-radius:14px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; flex-shrink:0; }
  .fiche-hero-name { font-family:var(--font-display); font-size:20px; font-weight:700; }
  .fiche-hero-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .fiche-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media(max-width:960px){ .fiche-grid { grid-template-columns:1fr; } }
  .fiche-card { background:var(--surface); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow-sm); }
  .fiche-card h3 { font-family:var(--font-display); font-size:14px; font-weight:700; margin:0 0 14px; }
  .fiche-field { margin-bottom:12px; }

// ── getTierColors (progression.js non chargé en console) ────────────────
function getTierColors(tier) {
  switch(tier) {
    case 'bronze':     return {c1:'#d08040', c2:'#6a3010', bar:'linear-gradient(90deg,#6a3010,#d08040,#e8b060)'};
    case 'argent':     return {c1:'#c0c0c0', c2:'#585858', bar:'linear-gradient(90deg,#606060,#d0d0d0,#b0b0b0)'};
    case 'or':         return {c1:'#d4a820', c2:'#7a5000', bar:'linear-gradient(90deg,#7a5000,#d4a820,#f0d040)'};
    case 'platine':    return {c1:'#9090e8', c2:'#282870', bar:'linear-gradient(90deg,#282870,#9090e8,#b0b0ff)'};
    case 'diamant':    return {c1:'#00c8e8', c2:'#004860', bar:'linear-gradient(90deg,#004860,#00c8e8,#60e0ff)'};
    case 'legendaire': return {c1:'#c040e0', c2:'#500080', bar:'linear-gradient(90deg,#500080,#c040e0,#e060ff)'};
    default:           return {c1:'#a8b0c8', c2:'#404858', bar:'linear-gradient(90deg,#808898,#c0c8d8,#a8b0c8)'};
  }
}
// Semaines écoulées depuis le début du coaching — sert de dénominateur aux
// jauges séances/bilans dans chargerClientProgressionXP (voir progression.js
// pour la version client, identique).
function _semainesDepuisDebut(dateDebutStr) {
  if (!dateDebutStr) return 0;
  const debut = new Date(dateDebutStr);
  if (isNaN(debut)) return 0;
  const jours = Math.floor((new Date() - debut) / 86400000);
  return Math.max(1, Math.ceil((jours + 1) / 7));
}

function bigChart(data, color){
  const w=560,h=100,max=Math.max(1,...data),min=Math.min(...data,0);
  const pts = data.map((v,i)=>[ (i/(data.length-1||1))*w, h - ((v-min)/((max-min)||1))*(h-10) - 4 ]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${h*f}" x2="${w}" y2="${h*f}" stroke="var(--hairline)" stroke-width="1"/>`).join('');
  return `<svg class="bigchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" opacity="0.18"/>
  </svg>`;
}

async function chargerProgrammeById(progId){
  const res1 = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${progId}`, { headers: supaHeaders() });
  if (!res1.ok) throw new Error('supabase_' + res1.status);
  const rows = await res1.json();
  if (!rows.length) return null;
  const cp = rows[0];
  const resArbo = await fetch(
    `${SUPABASE_URL}/rest/v1/client_programme_blocs?client_programme_id=eq.${cp.id}&order=ordre.asc` +
    `&select=*,client_programme_seances(*,client_programme_exercices(*))` +
    `&client_programme_seances.order=ordre.asc&client_programme_seances.client_programme_exercices.order=ordre.asc`,
    { headers: supaHeaders() }
  );
  const blocs = resArbo.ok ? await resArbo.json() : [];
  const exIds = [];
  blocs.forEach(b => (b.client_programme_seances||[]).forEach(s => (s.client_programme_exercices||[]).forEach(ex => exIds.push(ex.id))));
  let logs = {};
  if (exIds.length) {
    const resLogs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exIds.join(',')})&order=semaine.asc,numero_serie.asc`, { headers: supaHeaders() });
    if (resLogs.ok) (await resLogs.json()).forEach(l => { logs[l.client_programme_exercice_id+'|'+l.semaine+'|'+l.numero_serie] = l; });
  }
  return Object.assign({}, cp, { blocs, logs });
}

function setSort(key){
  if (state.sortKey === key) state.sortDir *= -1; else { state.sortKey = key; state.sortDir = 1; }
  renderTable();
}

function filteredSortedClients(){
  let list = data.clients.filter(c => (c.nom||'').toLowerCase().includes(state.search.toLowerCase()));
  // Filtre par onglet statut (actif / pause / ancien)
  list = list.filter(c => (c.statut || 'actif') === state.clientTab);
  if (state.statusFilter === 'late') list = list.filter(c => c.enRetard);
  if (state.statusFilter === 'locked') list = list.filter(c => c.verrouile);
  list = list.slice().sort((a,b) => {
    let av=a[state.sortKey], bv=b[state.sortKey];
    if (typeof av === 'string') return (av||'').localeCompare(bv||'','fr') * state.sortDir;
    return ((av||0)-(bv||0)) * state.sortDir;
  });
  return list;
}

// ── Chargement des données réelles ────────────────────────────────────
async function chargerDonnees(){
  const [clientsRaw, bilansCoach, logsRes, aValider] = await Promise.all([
    api('listerClientsAvecNiveaux').catch(()=>[]),
    api('listerBilansCoach').catch(()=>[]),
    api('chargerTousLesLogs').catch(()=>({logs:[]})),
    api('listerAlimentsCommunauteAValider').catch(()=>[]),
  ]);
  const clients = (typeof clientsRaw === 'string' ? JSON.parse(clientsRaw) : clientsRaw).filter(c => c.id !== 'yohan');
  const retards = await Promise.all(
    clients.map(c => apiAs('verifierRetardBilan', c.id).catch(()=>({enRetard:false})))
  );
  // verifierRetardBilan() répond "si j'envoyais MAINTENANT, serait-ce en retard ?" — utile au moment
  // de l'envoi côté client (bilan.js), mais ça dit "en retard" pour tout le monde une fois la fenêtre
  // de la semaine passée, MÊME si le client a déjà envoyé son bilan à temps. On corrige ici en
  // vérifiant si un envoi (listerBilansCoach) existe déjà dans les ~6 derniers jours pour ce client.
  const parseTsFr = s => { const m = (s||'').match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/); return m ? new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]) : null; };
  const dernierEnvoi = {};
  bilansCoach.forEach(b => { const d = parseTsFr(b.ts); if (d && (!dernierEnvoi[b.client] || d > dernierEnvoi[b.client])) dernierEnvoi[b.client] = d; });
  const maintenant = new Date();
  clients.forEach((c,i) => {
    const raw = !!(retards[i] && retards[i].enRetard);
    const dernier = dernierEnvoi[c.id];
    const soumisRecemment = dernier && (maintenant - dernier) < 6*24*60*60*1000;
    c.enRetard = raw && !soumisRecemment;
  });

  // Fusionne les fiches Supabase (client_profils) — un client peut n'exister que dans Supabase
  // (créé depuis la console, pas encore dans la feuille Clients) : on l'ajoute comme entrée
  // synthétique pour qu'il apparaisse dans le tableau/panneau, avec un badge "pas de connexion possible".
  let profils = [];
  try {
    const resProfils = await fetch(`${SUPABASE_URL}/rest/v1/client_profils`, { headers: supaHeaders() });
    if (resProfils.ok) profils = await resProfils.json();
  } catch(e) {}
  const idsExistants = new Set(clients.map(c=>c.id));
  profils.forEach(p => {
    if (!idsExistants.has(p.client_id)) {
      clients.push({
        id: p.client_id,
        nom: [p.prenom, p.nom].filter(Boolean).join(' ') || p.client_id,
        niveau: null, enRetard: false, chimieActif: false, verrouile: false,
        dernConnexion: null, titreActif: null,
        _supabaseOnly: true,
        supabaseOnlyActif: !!p.supabase_only,
      });
    }
  });

  // Pour les clients supabase_only, le retard GAS (verifierRetardBilan) n'a pas de sens —
  // on le recalcule directement sur les données Supabase, avec la même logique de
  // ponctualité que côté client (_bilanEstPonctuel, api.js) plutôt qu'un badge figé à false.
  const clientsSupaOnly = profils.filter(p => p.supabase_only);
  const retardsSupa = await Promise.all(clientsSupaOnly.map(p => _supaCalculerRetard(p.client_id)));
  clientsSupaOnly.forEach((p, i) => {
    const c = clients.find(cl => cl.id === p.client_id);
    if (c) c.enRetard = retardsSupa[i];
  });

  // Protocole chimie Supabase — distinct du chimieActif GAS legacy (c.chimieActif) :
  // tout client ayant une fiche client_profils peut avoir un protocole créé depuis la
  // console (indépendamment de supabase_only), donc _hasSupaProfil couvre tout le monde.
  profils.forEach(p => {
    const c = clients.find(cl => cl.id === p.client_id);
    if (c) { c._hasSupaProfil = true; c.chimieActifSupa = !!p.chimie_actif; c.supabaseOnlyActif = !!p.supabase_only; c.statut = p.statut || 'actif'; }
  });

  // Bilans Supabase en attente de traitement par le coach (soumis par clients supabase_only)
  let bilansSupa = [];
  try {
    const bsRes = await fetch(`${SUPABASE_URL}/rest/v1/bilans?envoye_coach=eq.true&coach_traite=eq.false&select=id,client_id,created_at,semaine_label&order=created_at.desc`, { headers: supaHeaders() });
    if (bsRes.ok) bilansSupa = await bsRes.json();
  } catch(e) {}

  data = { clients, bilansCoach, bilansSupa, logs: (logsRes && logsRes.logs) || [], aValider };
  // Persist pour stale-while-revalidate au prochain chargement
  try {
    localStorage.setItem('at_console_cache_v2', JSON.stringify({ ts: Date.now(), data }));
  } catch(e) {
    // QuotaExceeded : réessayer sans les logs (potentiellement volumineux)
    try {
      localStorage.setItem('at_console_cache_v2', JSON.stringify({ ts: Date.now(), data: { ...data, logs: data.logs.slice(0, 50) } }));
    } catch(e2) {}
  }
}

// Même sémantique que _bilanEstPonctuel côté client : "si ce bilan était envoyé
// maintenant, serait-ce en retard ?" — vérifie TOUS les bilans non-envoyés (pas
// seulement le plus récent) : un client qui a sauté une semaine peut avoir un
// vieux bilan resté ouvert et non-envoyé pendant qu'un nouveau a démarré pour
// la semaine en cours (cf. _supaGetOrCreateBilanCourant, bilan.js) — le plus
// récent n'est alors pas encore en retard, mais l'ancien l'est toujours.
async function _supaCalculerRetard(clientId) {
  try {
    const profilRes = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}&select=jour_bilan`, { headers: supaHeaders() });
    const profilArr = profilRes.ok ? await profilRes.json() : [];
    const jourBilan = profilArr[0] && profilArr[0].jour_bilan;
    const bilanRes = await fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(clientId)}&envoye_coach=eq.false&order=created_at.desc&select=created_at`, { headers: supaHeaders() });
    const bilanArr = bilanRes.ok ? await bilanRes.json() : [];
    if (!bilanArr.length) return false;
    return bilanArr.some(b => !_bilanEstPonctuel(b.created_at, new Date().toISOString(), jourBilan));
  } catch(e) { return false; }
}

let bilansTab = 'recents';
let bilansHistoClientId = null;
let bilansHistoData = { loaded: false, error: null, bilans: [] };
let bilanDetailState = { loaded: false, client: null, ligneTitre: null, ts: null, coachTraite: false, data: null, error: null };

function _parseTsMs(ts) {
  const m = (ts||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]).getTime() : null;
}
function _semaineFromDate(dateStr) {
  const m = (dateStr||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (!m) return dateStr;
  const sunMs = new Date(+m[3], +m[2]-1, +m[1]).getTime();
  const monMs = sunMs - 6*86400000;
  const mon = new Date(monMs), sun = new Date(sunMs);
  const p = n => ('0'+n).slice(-2);
  return `${p(mon.getDate())}/${p(mon.getMonth()+1)} → ${p(sun.getDate())}/${p(sun.getMonth()+1)}/${sun.getFullYear()}`;
}

function setBilansTab(tab) {
  bilansTab = tab;
  bilansHistoClientId = null;
  bilansHistoData = { loaded: false, error: null, bilans: [] };
  renderMain();
}

function openBilanHistoClient(clientId) {
  bilansHistoClientId = clientId;
  bilansHistoData = { loaded: false, error: null, bilans: [] };
  renderMain();
  apiAs('chargerHistoriqueBilans', clientId).then(raw => {
    if (bilansHistoClientId !== clientId) return;
    bilansHistoData = { loaded: true, error: null, bilans: raw || [] };
    if (state.nav === 'bilans') renderMain();
  }).catch(e => {
    if (bilansHistoClientId !== clientId) return;
    bilansHistoData = { loaded: true, error: e.message, bilans: [] };
    if (state.nav === 'bilans') renderMain();
  });
}

async function openBilanDetail(client, ligneTitre, ts, coachTraite) {
  _bilanNavSource = 'bilans'; _bilanNavList = null; _bilanNavIdx = -1;
  bilanDetailState = { loaded: false, client, ligneTitre, ts: ts||null, coachTraite: !!coachTraite, data: null, error: null };
  state.nav = 'bilan-detail';
  renderSidebar();
  renderMain();
  try {
    const raw = await apiAs('chargerBilanParLigne', client, { ligneTitre });
    bilanDetailState = { ...bilanDetailState, loaded: true, data: typeof raw === 'string' ? JSON.parse(raw) : raw };
  } catch(e) {
    bilanDetailState = { ...bilanDetailState, loaded: true, error: e.message };
  }
  if (state.nav === 'bilan-detail') renderMain();
}

async function openBilanDetailFromLog(client, ts, coachTraite) {
  _bilanNavSource = 'bilans'; _bilanNavList = null; _bilanNavIdx = -1;
  bilanDetailState = { loaded: false, client, ligneTitre: null, ts, coachTraite: !!coachTraite, data: null, error: null };
  state.nav = 'bilan-detail';
  renderSidebar();
  renderMain();

  // 1. Essai GAS sandbox
  try {
    const historique = await apiAs('chargerHistoriqueBilans', client);
    const tsMs = _parseTsMs(ts);
    const match = Array.isArray(historique) ? historique.find(h => {
      const hMs = _parseTsMs(h.date);
      return hMs && tsMs && Math.abs(hMs - tsMs) <= 3*86400000;
    }) : null;
    if (match) {
      bilanDetailState.ligneTitre = match.ligneTitre;
      const raw = await apiAs('chargerBilanParLigne', client, { ligneTitre: match.ligneTitre });
      bilanDetailState = { ...bilanDetailState, loaded: true, data: typeof raw === 'string' ? JSON.parse(raw) : raw };
      if (state.nav === 'bilan-detail') renderMain();
      return;
    }
  } catch(e) { /* GAS indisponible ou bilan absent — fallback Supabase */ }

  // 2. Fallback Supabase
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(client)}&order=date_validation.desc`,
      { headers: supaHeaders() }
    );
    const supaBilans = res.ok ? await res.json() : [];
    const tsMs = _parseTsMs(ts);
    const supMatch = supaBilans.find(b => {
      if (!b.date_validation) return false;
      const bMs = new Date(b.date_validation).getTime();
      return tsMs && Math.abs(bMs - tsMs) <= 7*86400000;
    });
    if (supMatch) {
      _bilanNavList = supaBilans;
      _bilanNavIdx  = supaBilans.indexOf(supMatch);
      _bilanNavSource = 'bilans';
      openBilanDetailSupabase(supMatch);
      return;
    }
    throw new Error('Bilan introuvable dans GAS et dans Supabase.');
  } catch(e) {
    bilanDetailState = { ...bilanDetailState, loaded: true, error: e.message };
  }
  if (state.nav === 'bilan-detail') renderMain();
}

function openBilanDetailSupabase(bilan) {
  const dateIso = bilan.date_validation || '';
  const dateFr  = dateIso ? dateIso.split('-').reverse().join('/') : '';
  bilanDetailState = {
    loaded: true,
    client: bilan.client_id,
    ligneTitre: bilan.gas_ligne_titre || null,
    ts: null,
    coachTraite: !!bilan.coach_traite,
    data: {
      dateValidation: dateFr,
      semaineLabel: bilan.semaine_label || '',
      jours: bilan.jours || [],
      repas: bilan.repas_eval || [],
      commentaireAlim: bilan.commentaire_alim || '',
      commentaireJour: bilan.commentaire_jour || '',
      commentaireActivite: bilan.commentaire_activite || '',
    },
    error: null,
    _supabaseBilanId: bilan.id,
  };
  state.nav = 'bilan-detail';
  renderSidebar();
  renderMain();
}

function openFicheBilanDetail(idx) {
  const b = (_ficheBilans || [])[idx];
  if (!b) return;
  _bilanNavList = _ficheBilans;
  _bilanNavIdx  = idx;
  _bilanNavSource = 'fiche';
  openBilanDetailSupabase(b);
}

function bilanNavGo(delta) {
  if (!_bilanNavList) return;
  const newIdx = _bilanNavIdx + delta;
  if (newIdx < 0 || newIdx >= _bilanNavList.length) return;
  _bilanNavIdx = newIdx;
  const b = _bilanNavList[newIdx];
  if (b._supabaseBilan !== false) openBilanDetailSupabase(b);
  else openBilanDetail(b.client_id, b.gas_ligne_titre, b.ts, b.coach_traite);
}

function _weekRange(dateFr) {
  if (!dateFr) return '';
  const p = dateFr.split('/');
  if (p.length !== 3) return dateFr;
  const sun = new Date(+p[2], +p[1]-1, +p[0]);
  const mon = new Date(sun); mon.setDate(sun.getDate() - 6);
  const fmt = d => d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
  return `${fmt(mon)} → ${fmt(sun)}`;
}

function _renderBilansTabContent() {

function _renderBilansRecents() {
  const now = Date.now();
  const pending = data.bilansCoach.filter(b => !b.coachTraite).sort((a,b) => (b.ts||'').localeCompare(a.ts||''));
  const recentTraited = data.bilansCoach.filter(b => {
    if (!b.coachTraite) return false;
    const ms = _parseTsMs(b.ts);
    return ms && (now - ms) <= 15*24*60*60*1000;
  }).sort((a,b) => (b.ts||'').localeCompare(a.ts||''));

  const rowHtml = (b, showBtn) => `
    <tr style="cursor:pointer;" onclick="openBilanDetailFromLog('${b.client}','${esc(b.ts)}',${!!b.coachTraite})">
      <td><div class="cell-name"><div class="mini-avatar">${initials(b.nom)}</div>${esc(b.nom)}</div></td>
      <td style="color:var(--text-faint);font-size:12px;">${esc(b.semaine||'')}</td>

      <td class="row-actions" onclick="event.stopPropagation();">${showBtn ? `<button class="btn" onclick="marquerTraite('${b.client}','${esc(b.ts)}')">Marquer traité</button>` : ''}</td>
    </tr>`;

  return `
    ${pending.length ? `
    <div class="table-card" style="margin-bottom:16px;">
      <div class="table-toolbar"><div class="title">À traiter <span style="color:var(--critical);font-size:11px;margin-left:6px;">${pending.length}</span></div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Client</th><th>Semaine</th><th>Envoyé le</th><th>Statut</th><th></th></tr></thead>
        <tbody>${pending.map(b => rowHtml(b, true)).join('')}</tbody>
      </table></div>
    </div>` : `<div class="table-card" style="margin-bottom:16px;padding:20px 24px;"><span style="color:var(--success);">✓ Tous les bilans sont traités.</span></div>`}
    ${recentTraited.length ? `
    <div class="table-card">
      <div class="table-toolbar"><div class="title">Traités · 15 derniers jours</div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Client</th><th>Semaine</th><th>Envoyé le</th><th>Statut</th><th></th></tr></thead>
        <tbody>${recentTraited.map(b => rowHtml(b, false)).join('')}</tbody>
      </table></div>
    </div>` : ''}`;
}

function _renderBilansHistorique() {
  if (!bilansHistoClientId) {
    const clientBilanCount = {}, clientLastTs = {};
    data.bilansCoach.forEach(b => {
      clientBilanCount[b.client] = (clientBilanCount[b.client]||0) + 1;
      if (!clientLastTs[b.client] || b.ts > clientLastTs[b.client]) clientLastTs[b.client] = b.ts;
    });
    const rows = data.clients.map(c => {
      const nb = clientBilanCount[c.id]||0;
      return `<tr style="cursor:pointer;" onclick="openBilanHistoClient('${c.id}')">
        <td><div class="cell-name"><div class="mini-avatar">${initials(c.nom)}</div>${esc(c.nom)}</div></td>
        <td style="font-size:12px;">${nb} bilan${nb>1?'s':''}</td>
        <td class="mono" style="color:var(--text-faint);font-size:12px;">${esc(clientLastTs[c.id]||'')}</td>
        <td style="color:var(--text-faint);font-size:18px;text-align:right;padding-right:16px;">›</td>
      </tr>`;
    }).join('');
    return `<div class="table-card">
      <div class="table-toolbar"><div class="title">Tous les clients</div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Client</th><th>Bilans envoyés</th><th>Dernier envoi</th><th></th></tr></thead>
        <tbody>${rows||`<tr><td colspan="4" style="text-align:center;color:var(--text-faint);padding:26px;">Aucun bilan.</td></tr>`}</tbody>
      </table></div>
    </div>`;
  }

  const c = data.clients.find(x => x.id === bilansHistoClientId);
  const nom = c ? c.nom : bilansHistoClientId;
  const backBtn = `<button class="fiche-back" style="margin-bottom:16px;" onclick="bilansHistoClientId=null;bilansHistoData={loaded:false,error:null,bilans:[]};renderMain()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    Retour à la liste
  </button>`;
  if (!bilansHistoData.loaded) return `${backBtn}<div style="display:flex;justify-content:center;padding:40px;"><div class="spin"></div></div>`;
  if (bilansHistoData.error) return `${backBtn}<div style="color:var(--critical);padding:16px;">Erreur : ${esc(bilansHistoData.error)}</div>`;
  if (!bilansHistoData.bilans.length) return `${backBtn}<div class="table-card" style="padding:20px 24px;color:var(--text-faint);">Aucun bilan validé pour ${esc(nom)}.</div>`;

  const rows = bilansHistoData.bilans.map(h => {
    const dateMs = _parseTsMs(h.date);
    const logEntry = dateMs ? data.bilansCoach.find(b => b.client===bilansHistoClientId && Math.abs((_parseTsMs(b.ts)||0)-dateMs)<=3*86400000) : null;
    const coachTraite = logEntry ? logEntry.coachTraite : false;
    const ts = logEntry ? logEntry.ts : null;
    return `<tr style="cursor:pointer;" onclick="openBilanDetail('${bilansHistoClientId}',${h.ligneTitre},'${esc(ts||'')}',${coachTraite})">
      <td class="mono" style="font-size:12px;">${esc(_semaineFromDate(h.date))}</td>
      <td class="mono" style="font-size:12px;color:var(--text-faint);">${esc(h.date||'')}</td>
      <td>${coachTraite?`<span class="chip ok"><span class="dot"></span>Traité</span>`:(ts?`<span class="chip late"><span class="dot"></span>À traiter</span>`:`<span class="chip off">Non envoyé</span>`)}</td>
      <td style="color:var(--text-faint);font-size:18px;text-align:right;padding-right:16px;">›</td>
    </tr>`;
  }).join('');

  return `${backBtn}
    <div class="fiche-hero" style="margin-bottom:16px;">
      <div class="fiche-avatar">${initials(nom)}</div>
      <div><div class="fiche-hero-name">${esc(nom)}</div>
        <div style="font-size:12px;color:var(--text-faint);">${bilansHistoData.bilans.length} bilan${bilansHistoData.bilans.length>1?'s':''} validés</div>
      </div>
    </div>
    <div class="table-card">
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Semaine</th><th>Validé le</th><th>Statut</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
}

// ── Détail bilan ──────────────────────────────────────────────────────
function renderBilanDetailPage(el) {
  const c = data.clients.find(x => x.id === bilanDetailState.client);
  const nom = c ? c.nom : bilanDetailState.client;
  const isFiche = _bilanNavSource === 'fiche';
  const backAction = isFiche
    ? `state.nav='fiche-client';ficheTab='bilans';renderSidebar();renderMain()`
    : `state.nav='bilans';renderSidebar();renderMain()`;
  const backLabel = isFiche ? 'Retour à la fiche client' : 'Retour aux bilans';
  const svgBack = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>`;
  const svgFwd  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>`;

  const _navDateLabel = (b) => {
    if (!b) return '';
    const iso = b.date_validation || '';
    const dateFr = iso ? iso.split('-').reverse().join('/') : '';
    return dateFr || b.semaine_label || '';
  };
  const hasPrev = _bilanNavList && _bilanNavIdx < _bilanNavList.length - 1;
  const hasNext = _bilanNavList && _bilanNavIdx > 0;
  const prevBilan = hasPrev ? _bilanNavList[_bilanNavIdx + 1] : null;
  const nextBilan = hasNext ? _bilanNavList[_bilanNavIdx - 1] : null;

  const navHtml = (hasPrev || hasNext) ? `
    <div style="display:flex;gap:8px;margin-bottom:4px;">
      ${hasPrev ? `<button class="btn" onclick="bilanNavGo(1)" style="font-size:12px;padding:5px 10px;">${svgBack} ${_navDateLabel(prevBilan)}</button>` : `<div style="flex:1;"></div>`}
      <div style="flex:1;"></div>
      ${hasNext ? `<button class="btn" onclick="bilanNavGo(-1)" style="font-size:12px;padding:5px 10px;">${_navDateLabel(nextBilan)} ${svgFwd}</button>` : ''}
    </div>` : '';

  const backHtml = `<button class="fiche-back" onclick="${backAction}">${svgBack} ${backLabel}</button>`;

  if (!bilanDetailState.loaded) {
    el.innerHTML = `${backHtml}
      <div class="fiche-hero"><div class="fiche-avatar">${initials(nom)}</div>
        <div><div class="fiche-hero-name">${esc(nom)}</div><div style="font-size:12px;color:var(--text-faint);">Chargement…</div></div>
      </div>
      <div style="display:flex;justify-content:center;padding:60px;"><div class="spin"></div></div>`;
    return;
  }
  if (bilanDetailState.error) {
    el.innerHTML = `${backHtml}<div style="color:var(--critical);padding:24px;">Erreur : ${esc(bilanDetailState.error)}</div>`;
    return;
  }

  const d = bilanDetailState.data || {};
  const jours = d.jours || [];
  const repas = d.repas || [];
  const dateValidation = d.dateValidation || '';
  const semaineLabel = d.semaineLabel || '';
  const weekRange = _weekRange(dateValidation) || semaineLabel;

  const poidsVals = jours.map(j=>parseFloat(j.poids)).filter(v=>!isNaN(v)&&v>0);
  const avgPoids = poidsVals.length ? (poidsVals.reduce((a,b)=>a+b,0)/poidsVals.length).toFixed(1) : null;
  const eauVals = jours.map(j=>parseFloat(j.eau)).filter(v=>!isNaN(v)&&v>0);
  const avgEau = eauVals.length ? (eauVals.reduce((a,b)=>a+b,0)/eauVals.length).toFixed(1) : null;
  const totalSteps = jours.reduce((s,j)=>s+(parseInt(j.steps)||0),0);
  const joursOkDiete = jours.filter(j=>j.diete).length;
  const joursOkTraining = jours.filter(j=>j.training).length;
  const joursOkCardio = jours.filter(j=>j.cardio).length;
  const repasAvgAdh = repas.length ? Math.round(repas.reduce((s,r)=>s+(r.adhesion||0),0)/repas.length) : null;
  const repasAvgDig = repas.length ? Math.round(repas.reduce((s,r)=>s+(r.digestion||0),0)/repas.length) : null;
  const repasAvgApp = repas.length ? Math.round(repas.reduce((s,r)=>s+(r.appetit||0),0)/repas.length) : null;

  const statCard = (label, val, unit='') => `
    <div class="table-card" style="flex:1;min-width:110px;padding:12px 16px;">
      <div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">${label}</div>
      <div style="font-size:20px;font-weight:700;color:var(--accent);">${val!==null?val+unit:'<span style="color:var(--text-faint);">—</span>'}</div>
    </div>`;
  const tick = v => v ? `<span style="color:var(--success);">✓</span>` : `<span style="color:var(--text-faint);">—</span>`;
  const score = v => { const n=parseInt(v)||0; const col=n>=4?'var(--success)':n>=2?'var(--accent)':'var(--critical)'; return `<span style="font-weight:600;color:${col};">${n}/5</span>`; };

  el.innerHTML = `
    ${backHtml}
    ${navHtml}
    <div class="fiche-hero">
      <div class="fiche-avatar">${initials(nom)}</div>
      <div style="flex:1;min-width:0;">
        <div class="fiche-hero-name">${esc(nom)}</div>
        <div class="fiche-hero-meta">
          <span class="chip off">${weekRange || _semaineFromDate(dateValidation)}</span>
          ${bilanDetailState.coachTraite?`<span class="chip ok"><span class="dot"></span>Traité</span>`:`<span class="chip late"><span class="dot"></span>À traiter</span>`}
        </div>
        ${dateValidation?`<div style="font-size:11px;color:var(--text-faint);margin-top:4px;">Validé le ${esc(dateValidation)}</div>`:''}
        ${bilanDetailState.ts?`<div style="font-size:11px;color:var(--text-faint);">Envoyé le ${esc(bilanDetailState.ts)}</div>`:''}
      </div>
      ${!bilanDetailState.coachTraite&&(bilanDetailState.ts||bilanDetailState._supabaseBilanId)?`<button class="btn primary" style="flex-shrink:0;" onclick="marquerTraite('${bilanDetailState.client}','${esc(bilanDetailState.ts||'')}')">Marquer traité</button>`:''}
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">
      ${statCard('Poids moy.', avgPoids, ' kg')}
      ${statCard('Eau moy.', avgEau, ' L')}
      ${statCard('Diète OK', joursOkDiete, '/7j')}
      ${statCard('Training', joursOkTraining, '/7j')}
      ${statCard('Cardio', joursOkCardio, '/7j')}
      ${totalSteps>0?statCard('Pas total',(totalSteps/1000).toFixed(1),'k'):''}
    </div>

    <div class="table-card" style="margin-bottom:16px;">
      <div class="table-toolbar"><div class="title">Suivi journalier</div></div>
      <div class="table-scroll"><table class="alim-table" style="width:100%;">
        <thead><tr><th>Jour</th><th>Poids</th><th>Eau</th><th>Diète</th><th>Steps</th><th>Training</th><th>Cardio</th></tr></thead>
        <tbody>
          ${jours.map(j=>`<tr>
            <td style="font-weight:600;font-size:12px;">${esc(j.nom||'')}</td>
            <td style="font-size:12px;">${j.poids!==''&&j.poids!=null?j.poids+' kg':'—'}</td>
            <td style="font-size:12px;">${j.eau!==''&&j.eau!=null?j.eau+' L':'—'}</td>
            <td>${tick(j.diete)}</td>
            <td style="font-size:12px;">${j.steps!==''&&j.steps!=null?(parseInt(j.steps)||0).toLocaleString('fr-FR'):'—'}</td>
            <td>${tick(j.training)}</td>
            <td>${tick(j.cardio)}</td>
          </tr>`).join('')||`<tr><td colspan="7" style="text-align:center;color:var(--text-faint);padding:16px;">Aucune donnée.</td></tr>`}
          ${poidsVals.length>1?`<tr style="background:var(--surface-2);font-style:italic;">
            <td style="font-size:11px;color:var(--text-faint);">Moyenne</td>
            <td style="font-size:12px;">${avgPoids} kg</td>
            <td style="font-size:12px;">${avgEau?avgEau+' L':'—'}</td>
            <td style="font-size:12px;">${joursOkDiete}/7</td>
            <td style="font-size:12px;">${totalSteps>0?totalSteps.toLocaleString('fr-FR')+' total':'—'}</td>
            <td style="font-size:12px;">${joursOkTraining}/7</td>
            <td style="font-size:12px;">${joursOkCardio}/7</td>
          </tr>`:''}
        </tbody>
      </table></div>
    </div>

    ${repas.length?`<div class="table-card" style="margin-bottom:16px;">
      <div class="table-toolbar"><div class="title">Nutrition · Évaluations repas</div></div>
      <div class="table-scroll"><table class="alim-table" style="width:100%;">
        <thead><tr><th>Repas</th><th>Adhésion</th><th>Digestion</th><th>Appétit</th></tr></thead>
        <tbody>
          ${repas.map(r=>`<tr>
            <td style="font-weight:600;font-size:12px;">Repas ${r.num}</td>
            <td>${score(r.adhesion)}</td><td>${score(r.digestion)}</td><td>${score(r.appetit)}</td>
          </tr>`).join('')}
          ${repasAvgAdh!==null?`<tr style="background:var(--surface-2);font-style:italic;">
            <td style="font-size:11px;color:var(--text-faint);">Moyenne</td>
            <td>${score(repasAvgAdh)}</td><td>${score(repasAvgDig)}</td><td>${score(repasAvgApp)}</td>
          </tr>`:''}
        </tbody>
      </table></div>
    </div>`:''}

    ${(d.commentaireAlim||d.commentaireJour||d.commentaireActivite)?`<div class="table-card">
      <div class="table-toolbar"><div class="title">Commentaires client</div></div>
      <div style="padding:0 20px 16px;display:flex;flex-direction:column;gap:12px;">
        ${d.commentaireAlim?`<div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Nutrition</div><div style="font-size:13px;white-space:pre-wrap;">${esc(d.commentaireAlim)}</div></div>`:''}
        ${d.commentaireJour?`<div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Journée</div><div style="font-size:13px;white-space:pre-wrap;">${esc(d.commentaireJour)}</div></div>`:''}
        ${d.commentaireActivite?`<div><div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Activité</div><div style="font-size:13px;white-space:pre-wrap;">${esc(d.commentaireActivite)}</div></div>`:''}
      </div>
    </div>`:''}`;
}

const ALIM_CATEGORIES = ['Viandes & poissons','Produits laitiers','Céréales & féculents','Légumes','Fruits','Légumineuses','Matières grasses','Boissons','Autres'];

async function chargerAlimentsCoach(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/aliments_coach?order=nom.asc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}

async function renderBasePage(el){
  el.innerHTML = `<div class="page-head"><div><div class="eyebrow">Console coach</div><h1>Base alimentaire</h1></div></div><div style="display:flex;justify-content:center;padding:40px;"><div class="spin"></div></div>`;

    try {

      alimentsCoachErr = e.message;

async function executerImportSheets(coach, communaute){
  document.getElementById('btnLancerImport').disabled = true;
  const prog = document.getElementById('importSheetsProgress');
  const bar  = document.getElementById('importSheetsBar');
  const msg  = document.getElementById('importSheetsMsg');
  const errEl= document.getElementById('importSheetsErr');
  prog.style.display = 'block';

  const tous = [
    ...coach.map(a => ({
      nom: a.nom,
      categorie: null,
      kcal_par_gramme: (a.kcal||0) / 100,
      prot_par_gramme: (a.prot||0) / 100,
      glu_par_gramme:  (a.glu||0)  / 100,
      lip_par_gramme:  (a.lip||0)  / 100,
    })),
    ...communaute.map(a => ({
      nom: a.nom,
      categorie: null,
      kcal_par_gramme: (a.kcal||0) / 100,
      prot_par_gramme: (a.prot||0) / 100,
      glu_par_gramme:  (a.glu||0)  / 100,
      lip_par_gramme:  (a.lip||0)  / 100,
    })),
  ];

  const BATCH = 50;
  let importes = 0;
  let erreurs = 0;

  for (let i = 0; i < tous.length; i += BATCH) {
    const chunk = tous.slice(i, i + BATCH);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/aliments_coach`, {
        method: 'POST',
        headers: supaHeaders({ Prefer: 'return=minimal,resolution=ignore-duplicates' }),
        body: JSON.stringify(chunk),
      });
      if (!res.ok && res.status !== 409) throw new Error('supabase_' + res.status);
      importes += chunk.length;
    } catch(e) {
      erreurs += chunk.length;
    }
    const pct = Math.round(((i + chunk.length) / tous.length) * 100);
    bar.style.width = pct + '%';
    msg.textContent = `${Math.min(i + BATCH, tous.length)} / ${tous.length} traités…`;
  }

  bar.style.width = '100%';
  msg.textContent = `Import terminé : ${importes} ajoutés${erreurs ? `, ${erreurs} erreurs` : ''}.`;

  if (erreurs) { errEl.textContent = `${erreurs} aliments n'ont pas pu être insérés.`; errEl.style.display='block'; }

  // Recharger la base locale
  alimentsCoachData = null;
  alimentsCoachErr = null;
  try { alimentsCoachData = await chargerAlimentsCoach(); } catch(e) { alimentsCoachErr = e.message; }

  document.getElementById('btnLancerImport').textContent = 'Fermer';
  document.getElementById('btnLancerImport').onclick = () => { document.getElementById('modal-import-sheets').remove(); renderBaseSub(); };
  document.getElementById('btnLancerImport').disabled = false;
}

      method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),

async function sauvegarderAlimentCoach(id){
  const nom = document.getElementById('afNom').value.trim();
  const errEl = document.getElementById('afErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  const categorie = document.getElementById('afCat').value || null;
  const unite = document.getElementById('afUnite').value || 'g';
  const div = unite === 'g' ? 100 : 1;
  const kcal = (parseFloat(document.getElementById('afKcal').value)||0) / div;
  const prot = (parseFloat(document.getElementById('afProt').value)||0) / div;
  const glu  = (parseFloat(document.getElementById('afGlu').value)||0) / div;
  const lip  = (parseFloat(document.getElementById('afLip').value)||0) / div;
  const payload = { nom, categorie, unite, kcal_par_gramme:kcal, prot_par_gramme:prot, glu_par_gramme:glu, lip_par_gramme:lip };
  try {
    const method = id ? 'PATCH' : 'POST';
    const url = id ? `${SUPABASE_URL}/rest/v1/aliments_coach?id=eq.${id}` : `${SUPABASE_URL}/rest/v1/aliments_coach`;
    const res = await fetch(url, { method, headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(payload) });
    if (!res.ok) throw new Error('supabase_' + res.status);
    const saved = (await res.json())[0];
    if (id) {
      alimentsCoachData = alimentsCoachData.map(a => a.id===id ? saved : a);
    } else {
      alimentsCoachData = [...alimentsCoachData, saved].sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
    }
    document.getElementById('modal-alim-form').remove();
    renderBaseSub();
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

async function supprimerAlimentCoach(id){
  if (!confirm('Supprimer cet aliment ?')) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/aliments_coach?id=eq.${id}`, { method:'DELETE', headers:supaHeaders() });
    if (!res.ok) throw new Error('supabase_' + res.status);
    alimentsCoachData = alimentsCoachData.filter(a=>a.id!==id);
    renderBaseSub();
  } catch(e){ alert('Erreur : ' + e.message); }
}

async function rechercherOpenFoodFacts(query){
  const params = new URLSearchParams({
    search_terms: query,
    action: 'process',
    json: '1',
    page_size: '30',
    sort_by: 'unique_scans_n',
    fields: 'product_name,nutriments',
    lc: 'fr',
  });
  const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?${params}`);
  if (!res.ok) throw new Error('OFF ' + res.status);
  const json = await res.json();
  const seen = new Set();
  return (json.products||[])
    .map(p => {
      const nom = (p.product_name||'').trim();
      const kcal = (p.nutriments?.['energy-kcal_100g'] ?? p.nutriments?.['energy-kcal_serving'] ?? null);
      const prot = (p.nutriments?.proteins_100g ?? null);
      const glu  = (p.nutriments?.carbohydrates_100g ?? null);
      const lip  = (p.nutriments?.fat_100g ?? null);
      return { nom, kcal: kcal!=null?kcal/100:null, prot: prot!=null?prot/100:null, glu: glu!=null?glu/100:null, lip: lip!=null?lip/100:null };
    })
    .filter(p => {
      if (!p.nom || p.nom.length < 2) return false;       // pas de nom
      if (p.kcal == null && p.prot == null) return false;  // pas de macros du tout
      const key = p.nom.toLowerCase();
      if (seen.has(key)) return false;                     // dédoublonnage
      seen.add(key);
      return true;
    })
    .slice(0, 20);
}

// Réplique les fonctions de création de cycle/molécules de la feuille Google
// Sheets "Protocol" (genererProtocole/genererPlanning) — même logique de
// calcul (_protocoleCalculer, api.js), partagée avec le rendu côté client
// (protocole.js).
let protocoleEnEdition = null; // { id, client_id, clientNom, date_debut, duree_semaines, objectif, molecules:[...] }
let _protocolePreview  = null; // résultat de _protocoleCalculer après génération/enregistrement

async function ouvrirEditeurProtocole(clientId, clientNom){
  // protocoleEnEdition doit être assigné AVANT setNav : setNav déclenche renderMain()
  // synchronement, et renderEditeurProtocolePage rebondit vers 'protocole' si l'état
  // est encore vide (garde anti-crash) — l'inverser cassait l'ouverture de l'éditeur.
  protocoleEnEdition = { id: null, client_id: clientId, clientNom: clientNom || clientId, date_debut: new Date().toISOString().slice(0,10), duree_semaines: 12, objectif: '', molecules: [] };
  _protocolePreview = null;
  setNav('editeur-protocole');
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/client_protocoles?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc&limit=1&select=*,client_protocole_molecules(*)`,
      { headers: supaHeaders() }
    );
    const arr = res.ok ? await res.json() : [];
    if (arr.length > 0) {
      const row = arr[0];
      protocoleEnEdition = {
        id: row.id, client_id: clientId, clientNom: clientNom || clientId,
        date_debut: row.date_debut, duree_semaines: row.duree_semaines, objectif: row.objectif || '',
        molecules: (row.client_protocole_molecules || []).slice().sort((a,b)=>(a.ordre||0)-(b.ordre||0)),
      };
      _protocolePreview = _protocoleCalculer(row, protocoleEnEdition.molecules);
    }
  } catch(e) {}
  renderMain();
}

function ajouterMoleculeProtocole(){
  const p = protocoleEnEdition;
  p.molecules.push({ nom:'', categorie:'Injectable', unite:'mg/ml', par_jour_semaine:'Semaine', dosage_produit:'', dosage_prise:'', semaine_debut:1, semaine_fin: p.duree_semaines || 12, intervalle:3.5, ordre: p.molecules.length });
  renderMain();
}
function retirerMoleculeProtocole(idx){
  protocoleEnEdition.molecules.splice(idx,1);
  renderMain();
}

async function sauvegarderProtocole(){
  const p = protocoleEnEdition;
  if (!p.date_debut || !p.duree_semaines) { alert('Date de début et durée du cycle requises.'); return; }
  if (p.molecules.some(m => !(m.nom||'').trim())) { alert('Chaque molécule doit avoir un nom.'); return; }
  try {
    const body = { client_id: p.client_id, date_debut: p.date_debut, duree_semaines: parseInt(p.duree_semaines)||12, objectif: p.objectif || null };
    let protocoleId = p.id;
    if (protocoleId) {
      await fetch(`${SUPABASE_URL}/rest/v1/client_protocoles?id=eq.${protocoleId}`, { method:'PATCH', headers: supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify(body) });
    } else {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_protocoles`, { method:'POST', headers: supaHeaders({ Prefer:'return=representation' }), body: JSON.stringify(body) });
      const arr = await res.json();
      protocoleId = arr[0].id;
      p.id = protocoleId;
    }

    // Delete-all puis recreate (même pattern que sauvegarderDieteTemplate) —
    // plus simple qu'un diff ligne par ligne pour une poignée de molécules.
    await fetch(`${SUPABASE_URL}/rest/v1/client_protocole_molecules?protocole_id=eq.${protocoleId}`, { method:'DELETE', headers: supaHeaders() });
    const dureeSemaines = parseInt(p.duree_semaines) || 12;
    const molsBody = p.molecules.map((m,i) => ({
      protocole_id: protocoleId, nom: m.nom.trim(), categorie: m.categorie, unite: m.unite || null,
      par_jour_semaine: m.par_jour_semaine,
      dosage_produit: m.dosage_produit !== '' && m.dosage_produit != null ? Number(m.dosage_produit) : null,
      dosage_prise: m.dosage_prise !== '' && m.dosage_prise != null ? Number(m.dosage_prise) : null,
      semaine_debut: m.categorie === 'GH' ? 1 : (parseInt(m.semaine_debut) || 1),
      semaine_fin: m.categorie === 'GH' ? dureeSemaines : (parseInt(m.semaine_fin) || parseInt(m.semaine_debut) || 1),
      intervalle: m.intervalle !== '' && m.intervalle != null ? Number(m.intervalle) : 1,
      ordre: i,
    }));
    if (molsBody.length > 0) {
      await fetch(`${SUPABASE_URL}/rest/v1/client_protocole_molecules`, { method:'POST', headers: supaHeaders({ Prefer:'return=minimal' }), body: JSON.stringify(molsBody) });
    }

    _protocolePreview = _protocoleCalculer(body, molsBody);
    renderMain();
  } catch(e) { alert('Erreur : ' + e.message); }
}

// Dernier jour du cycle = date début + (durée en semaines × 7 − 1) jours,
// même convention que la feuille Google Sheets (C8 "Date de fin du cycle").
function _protocoleDateFinFmt(dateDebut, dureeSemaines){
  if (!dateDebut || !dureeSemaines) return '—';
  const [y, m, j] = dateDebut.split('-').map(Number);
  if (!y || !m || !j) return '—';
  const d = new Date(y, m - 1, j); // évite le décalage de fuseau horaire d'un new Date("YYYY-MM-DD")
  d.setDate(d.getDate() + (parseInt(dureeSemaines) * 7 - 1));
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function renderProtocolePreviewHtml(preview){
  const catColor = c => c==='Injectable' ? '#e05c5c' : c==='Oral' ? '#4f8ef7' : '#a78bfa';

  const totalsHtml = preview.molecules.map(m => `
    <div class="panel-row">
      <span class="l" style="color:${catColor(m.categorie)};font-weight:600;">${esc(m.nom)}</span>
      <span class="v">${Math.round(m.totalMg*10)/10} mg · ${esc(m.totalConverti||'')}${m.quantiteRequise ? ' · ' + esc(m.quantiteRequise) : ''}</span>
    </div>`).join('');

  const fmtDate = d => new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' });
  const rowStyle = s => s==='passee' ? 'opacity:.4;text-decoration:line-through;' : s==='encours' ? 'background:#0d1a13;color:#3ddc84;font-weight:600;' : '';

  const rows = preview.semaines.map(s => `
    <tr style="${rowStyle(s.statut)}">
      <td style="padding:6px 10px;font-weight:600;white-space:nowrap;">S${s.numero}</td>
      <td style="padding:6px 10px;font-family:var(--font-mono);font-size:11px;white-space:nowrap;">${fmtDate(s.date)}</td>
      ${s.doses.map(d => `<td style="padding:6px 10px;font-size:12px;white-space:nowrap;">${esc(d.texte)}</td>`).join('')}
    </tr>`).join('');

  return `
    <div class="table-card" style="margin-top:14px;">
      <div class="table-toolbar"><div class="title">Totaux du cycle</div></div>
      ${totalsHtml || '<div style="padding:16px;color:var(--text-faint);">Aucune molécule.</div>'}
    </div>
    <div class="table-card" style="margin-top:14px;">
      <div class="table-toolbar"><div class="title">Planning hebdomadaire</div></div>
      <div class="table-scroll"><table class="clients">
        <thead><tr><th>Sem.</th><th>Date</th>${preview.molecules.map(m=>`<th>${esc(m.nom)}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
}

// ── Programmes : bibliothèque d'exercices + templates (Supabase) ──────────
// Portage depuis AppTrainingPWA/console.html (code identique, même Supabase) — cf. CLAUDE.md du bac à sable.
const GROUPES_MUSCULAIRES = ['Pectoraux','Dos (dorsaux)','Dos (trapèzes)','Dos (global)','Epaules (anterieur)','Epaules (latéral)','Epaules (posterieur)','Biceps','Triceps','Abdos','Lombaires','Quadriceps','Ischios','Fessiers','Adducteurs','Abducteurs','Mollets','Cardio'];
let progTab = 'exercices'; // 'exercices' | 'templates'
let exercicesData = null;  // null = pas encore chargé
let templatesData = null;
let exoGroupeFiltre = 'all';
let exoRecherche = '';
let tplCategorieFiltre = 'all';

async function chargerExercices(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/exercices?order=nom.asc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function sauvegarderExercice(ex){
  const method = ex.id ? 'PATCH' : 'POST';
  const url = ex.id ? `${SUPABASE_URL}/rest/v1/exercices?id=eq.${ex.id}` : `${SUPABASE_URL}/rest/v1/exercices`;
  const body = { nom: ex.nom, groupe_musculaire: ex.groupe_musculaire || null, groupe_secondaire: ex.groupe_secondaire || null, equipement: ex.equipement || null, video_url: ex.video_url || null, notes: ex.notes || null,
    reps_metabolique: ex.reps_metabolique || null, repos_metabolique: ex.repos_metabolique || null,
    reps_mecanique: ex.reps_mecanique || null, repos_mecanique: ex.repos_mecanique || null,
    reps_force: ex.reps_force || null, repos_force: ex.repos_force || null };
  const res = await fetch(url, { method, headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(body) });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return (await res.json())[0];
}
async function supprimerExercice(id){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/exercices?id=eq.${id}`, { method: 'DELETE', headers: supaHeaders() });
  if (!res.ok) {
    if (res.status === 409) throw new Error("Cet exercice est utilisé dans un template — retire-le du template d'abord.");
    throw new Error('supabase_' + res.status);
  }
}

async function chargerTemplates(){
  // Compte imbriqué léger (ids seulement) pour afficher séances/exercices sur les cartes sans requête séparée.
  const res = await fetch(`${SUPABASE_URL}/rest/v1/programme_templates?order=nom.asc&select=*,programme_blocs(id,programme_seances(id,programme_seance_exercices(id)))`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function chargerTemplateArbo(templateId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs?template_id=eq.${templateId}&order=ordre.asc&select=*,programme_seances(*,programme_seance_exercices(*))&programme_seances.order=ordre.asc&programme_seances.programme_seance_exercices.order=ordre.asc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function sauvegarderTemplateComplet(tpl){
  const method = tpl.id ? 'PATCH' : 'POST';
  const url = tpl.id ? `${SUPABASE_URL}/rest/v1/programme_templates?id=eq.${tpl.id}` : `${SUPABASE_URL}/rest/v1/programme_templates`;
  const res = await fetch(url, { method, headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify({ nom: tpl.nom, categorie: tpl.categorie || null, description: tpl.description || null }) });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const saved = (await res.json())[0];
  const templateId = saved.id;
  if (tpl.id) {
    // Remplacement complet de l'arborescence (comme modifierMenu côté GAS) plutôt qu'un diff fin —
    // cascade sur programme_seances puis programme_seance_exercices.
    await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs?template_id=eq.${templateId}`, { method: 'DELETE', headers: supaHeaders() });
  }
  const blocsPayload = tpl.blocs.map((b, bi) => ({ template_id: templateId, type: b.type || null, nombre_semaines: b.nombre_semaines || null, ordre: bi }));
  const resBlocs = await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(blocsPayload) });
  if (!resBlocs.ok) throw new Error('supabase_' + resBlocs.status);
  const blocsSaved = await resBlocs.json();
  // Lookup par 'ordre' (qu'on a nous-même assigné = bi) plutôt que par position du tableau retourné —
  // l'ordre de retour d'un insert multi-lignes n'est pas garanti par Postgres.
  const blocIdByOrdre = {};
  blocsSaved.forEach(b => { blocIdByOrdre[b.ordre] = b.id; });

  const seancesPayload = [];
  tpl.blocs.forEach((b, bi) => {
    b.seances.forEach((s, si) => {
      seancesPayload.push({ bloc_id: blocIdByOrdre[bi], titre: s.titre || ('Séance ' + (si + 1)), ordre: si });
    });
  });
  let seancesSaved = [];
  if (seancesPayload.length) {
    const resSeances = await fetch(`${SUPABASE_URL}/rest/v1/programme_seances`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(seancesPayload) });
    if (!resSeances.ok) throw new Error('supabase_' + resSeances.status);
    seancesSaved = await resSeances.json();
  }
  const seanceIdByBlocOrdre = {};
  seancesSaved.forEach(s => { seanceIdByBlocOrdre[s.bloc_id + '|' + s.ordre] = s.id; });

  const exercicesPayload = [];
  tpl.blocs.forEach((b, bi) => {
    const blocId = blocIdByOrdre[bi];
    b.seances.forEach((s, si) => {
      const seanceId = seanceIdByBlocOrdre[blocId + '|' + si];
      s.exercices.forEach((ex, ei) => {
        exercicesPayload.push({ seance_id: seanceId, exercice_id: ex.exercice_id, ordre: ei, series: parseInt(ex.series) || null, reps: ex.reps || '', repos: ex.repos || '', tempo: ex.tempo || '', rir: ex.rir || '', notes: ex.notes || '' });
      });
    });
  });
  if (exercicesPayload.length) {
    const resExo = await fetch(`${SUPABASE_URL}/rest/v1/programme_seance_exercices`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(exercicesPayload) });
    if (!resExo.ok) throw new Error('supabase_' + resExo.status);
  }
  return saved;
}

}

async function confirmerFormExercice(id){
  const nom = document.getElementById('fExoNom').value.trim();
  const errEl = document.getElementById('fExoErr');
  if (!nom) { errEl.textContent = 'Le nom est obligatoire.'; errEl.style.display = 'block'; return; }
  const payload = {
    id: id || null,
    nom,
    groupe_musculaire: document.getElementById('fExoGroupe').value,
    groupe_secondaire: document.getElementById('fExoGroupeSec').value,
    equipement: document.getElementById('fExoEquip').value.trim(),
    video_url: document.getElementById('fExoVideo').value.trim(),
    notes: document.getElementById('fExoNotes').value.trim(),
    reps_metabolique: document.getElementById('fExoRepsMeta').value.trim(),
    repos_metabolique: document.getElementById('fExoReposMeta').value.trim(),
    reps_mecanique: document.getElementById('fExoRepsMeca').value.trim(),
    repos_mecanique: document.getElementById('fExoReposMeca').value.trim(),
    reps_force: document.getElementById('fExoRepsForce').value.trim(),
    repos_force: document.getElementById('fExoReposForce').value.trim(),
  };
  try {
    const saved = await sauvegarderExercice(payload);
    if (id) { const i = exercicesData.findIndex(e=>e.id===id); if (i>=0) exercicesData[i] = saved; }
    else exercicesData.push(saved);
    document.getElementById('modal-exercice').remove();
    renderExercicesSub();
  } catch(e) { errEl.textContent = 'Erreur : ' + e.message; errEl.style.display = 'block'; }
}

async function retirerExercice(id){
  if (!confirm('Supprimer cet exercice ?')) return;
  try {
    await supprimerExercice(id);
    exercicesData = exercicesData.filter(e => e.id !== id);
    renderExercicesSub();
  } catch(e) { alert(e.message); }
}

let tplEnEdition = null;
let tplPickerCible = null; // { bi, si }
const BLOCS_TYPES = [{value:'',label:'Générique'},{value:'metabolique',label:'Métabolique'},{value:'mecanique',label:'Mécanique'},{value:'force',label:'Force'}];
const RIR_PAR_TYPE  = { metabolique:'0-1',  mecanique:'1-2',  force:'2-3' };
const REPS_PAR_TYPE = { metabolique:'15-20', mecanique:'10-15', force:'6-10' };
const REPOS_PAR_TYPE= { metabolique:"1'",   mecanique:"1'30",  force:"2'" };

function blocVide(){ return { type: null, nombre_semaines: null, seances: [{ titre: 'Séance 1', exercices: [] }] }; }

// Applique reps/repos (depuis la bibliothèque d'exercices, selon le type) + RIR (défaut par type)
// à tous les exercices déjà présents dans un bloc — appelé quand on change le type du bloc,
// pour que le contenu déjà rempli reste cohérent avec Métabolique/Mécanique/Force.
function _appliquerTypeAuxExercicesDuBloc(bloc, exercicesLib){
  const type = bloc.type;
  if (!type) return;
  bloc.seances.forEach(seance => {
    seance.exercices.forEach(ex => {
      const lib = ex.exercice_id != null ? (exercicesLib||[]).find(e => e.id === ex.exercice_id) : null;
      ex.reps  = (lib && lib['reps_'+type])  ? lib['reps_'+type]  : (REPS_PAR_TYPE[type]  || ex.reps);
      ex.repos = (lib && lib['repos_'+type]) ? lib['repos_'+type] : (REPOS_PAR_TYPE[type] || ex.repos);
      ex.rir   = RIR_PAR_TYPE[type] || ex.rir;
    });
  });
}

async function ouvrirEditeurTemplate(id){
  if (exercicesData === null) { try { exercicesData = await chargerExercices(); } catch(e) { exercicesData = []; } }
  if (id) {
    const tpl = templatesData.find(t => t.id === id);
    const blocsRaw = await chargerTemplateArbo(id);
    tplEnEdition = {
      id: tpl.id, nom: tpl.nom, categorie: tpl.categorie || '', description: tpl.description || '',
      blocs: blocsRaw.map(b => ({
        type: b.type || null,
        nombre_semaines: b.nombre_semaines || null,
        seances: (b.programme_seances || []).map(s => ({
          titre: s.titre,
          exercices: (s.programme_seance_exercices || []).map(l => {
            const ex = exercicesData.find(e=>e.id===l.exercice_id);
            return { exercice_id: l.exercice_id, nom: ex ? ex.nom : '(exercice supprimé)', groupe_musculaire: ex ? (ex.groupe_musculaire||null) : null, series: l.series, reps: l.reps, repos: l.repos, tempo: l.tempo, rir: l.rir, notes: l.notes || '' };
          })
        }))
      }))
    };
    if (!tplEnEdition.blocs.length) tplEnEdition.blocs = [blocVide()];
    tplEnEdition.blocs.forEach(b => { if (!b.seances.length) b.seances.push({ titre: 'Séance 1', exercices: [] }); });
  } else {
    tplEnEdition = { id: null, nom: '', categorie: '', description: '', blocs: [blocVide()] };
  }
  renderEditeurTemplate();
}
