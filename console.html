<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppTraining — Console Coach</title>
<style>
  :root {
    --bg: #0b0b0c;
    --surface: #151514;
    --surface-2: #1c1c1a;
    --surface-3: #262524;
    --hairline: rgba(255,255,255,0.055);
    --text: #f5f2ec;
    --text-muted: #9d968a;
    --text-faint: #656055;
    --accent: #f2ba3e;
    --accent-soft: #f2ba3e17;
    --accent-2: #f5a83c;
    --accent-2-soft: #f5a83c14;
    --success: #3ecf8e;
    --success-soft: #3ecf8e17;
    --warning: #e08a3c;
    --warning-soft: #e08a3c17;
    --critical: #e2615c;
    --critical-soft: #e2615c17;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg: 0 20px 44px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body);
    font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  ::selection { background: var(--accent-soft); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .shell { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 58px 1fr; height: 100vh; background: var(--bg); }

  .gate { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 20px; }
  .gate .mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .gate h1 { font-family: var(--font-display); font-size: 18px; margin: 0; }
  .gate p { color: var(--text-muted); font-size: 13px; margin: 0; max-width: 320px; }
  .gate a.btn { text-decoration: none; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface-3); border-top-color: var(--accent); animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Topbar ── */
  .topbar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 20px;
    border-bottom: 1px solid var(--hairline); background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.02em; width: 212px; flex-shrink: 0; }
  .brand .mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); flex-shrink: 0; }
  .brand .sub { color: var(--text-faint); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin-left: 2px; }

  .search { position: relative; flex: 1; max-width: 420px; }
  .search input {
    width: 100%; background: var(--surface); border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 8px 12px 8px 32px; color: var(--text); font-size: 12.5px; font-family: inherit;
  }
  .search input:focus { border-color: var(--hairline); }
  .search input::placeholder { color: var(--text-faint); }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }

  .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: var(--surface);
    color: var(--text); font-size: 12px; font-weight: 600; padding: 8px 13px; border-radius: var(--radius-sm); cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: #1a1408; }
  .btn.primary:hover { filter: brightness(1.08); }
  .icon-btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    border: none; background: var(--surface); border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .badge-dot { position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--critical); color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); }

  .avatar {
    width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--text);
  }

  /* ── Dropdowns ── */
  .dropdown { position: relative; }
  .menu {
    position: absolute; top: calc(100% + 8px); right: 0; min-width: 210px; background: var(--surface-2);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 6px;
    display: none; z-index: 60;
  }
  .menu.open { display: block; }
  .menu-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 9px; border-radius: 7px;
    border: none; background: none; color: var(--text); font-size: 12.5px; cursor: pointer;
  }
  .menu-item:hover { background: var(--surface-3); }
  .menu-item.danger { color: var(--critical); }
  .menu-item svg { color: var(--text-faint); flex-shrink: 0; }
  .menu-item.danger svg { color: var(--critical); }
  .menu-sep { height: 1px; background: var(--hairline); margin: 5px 4px; }
  .menu-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); padding: 6px 9px 3px; font-weight: 600; }

  /* ── Sidebar ── */
  .sidebar { border-right: 1px solid var(--hairline); background: var(--bg); display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto; }
  .nav-group { margin-bottom: 4px; }
  .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); font-weight: 700; padding: 14px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; text-align: left;
    padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .nav-item svg { flex-shrink: 0; color: var(--text-faint); }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); }
  .nav-item.active svg { color: var(--accent); }
  .nav-count { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; background: var(--surface-2); color: var(--text-muted); padding: 1px 6px; border-radius: 999px; }
  .sidebar-footer { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--hairline); display: flex; align-items: center; gap: 9px; }
  .sidebar-footer .name { font-size: 12px; font-weight: 700; }
  .sidebar-footer .role { font-size: 10.5px; color: var(--text-faint); }

  /* ── Main ── */
  .main { overflow-y: auto; padding: 24px 28px 40px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  .page-head .eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); font-weight: 700; margin-bottom: 4px; }
  .page-head h1 { font-family: var(--font-display); font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .page-head .meta { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

  /* ── Dashboard grid ── */
  .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: min-content; gap: 14px; }
  .card { background: var(--surface); border-radius: var(--radius); display: flex; flex-direction: column; box-shadow: var(--shadow-sm); }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 15px 16px 12px; }
  .card-head svg { color: var(--accent); flex-shrink: 0; }
  .card-head .t { font-weight: 700; font-size: 12.5px; margin-right: auto; }
  .card-head .link { font-size: 11.5px; color: var(--text-faint); cursor: pointer; font-weight: 600; }
  .card-head .link:hover { color: var(--accent); }
  .card-list { padding: 2px 8px 10px; overflow-y: auto; }
  .card-list-row { display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: 10px; cursor: pointer; }
  .card-list-row:hover { background: var(--surface-2); }
  .card-list-row .t { font-size: 12.5px; font-weight: 600; }
  .card-list-row .s { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .card-list-row .time { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); white-space: nowrap; }
  .card-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 12px; flex: 1; }
  .card-empty svg { color: var(--success); }

  .chart-card .chart-top { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px; }
  .chart-card .big-value { font-family: var(--font-mono); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .chart-card .period { font-size: 11.5px; color: var(--text-faint); border-radius: 999px; padding: 4px 10px; background: var(--surface-2); }
  .chart-card svg.bigchart { width: 100%; height: 108px; display: block; padding: 10px 8px 6px; }

  .timeline-card .card-list { padding: 4px 16px 14px; }
  .tl-row { display: flex; gap: 10px; padding: 9px 0; cursor: default; border-radius: 0; }
  .tl-row.clickable { cursor: pointer; }
  .tl-row.clickable:hover { background: var(--surface-2); }
  .tl-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: var(--accent); }
  .tl-row .t { font-size: 12.5px; }
  .tl-row .t b { font-weight: 700; }
  .tl-row .d { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); margin-top: 1px; }

  .table-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
  .table-toolbar { display: flex; align-items: center; gap: 8px; padding: 14px 16px; }
  .table-toolbar .title { font-weight: 700; font-size: 13px; margin-right: auto; }
  .chip-filter { display: flex; gap: 6px; }
  .chip-filter button {
    border: none; background: var(--surface-2); color: var(--text-muted); font-size: 11.5px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .chip-filter button.active { background: var(--accent); color: #1a1408; }

  .table-scroll { overflow-x: auto; }
  table.clients { width: 100%; border-collapse: collapse; min-width: 780px; }
  table.clients thead th {
    position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; padding: 8px 16px 12px;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  table.clients thead th:hover { color: var(--text); }
  table.clients thead th .sort-arrow { margin-left: 3px; opacity: 0.5; font-size: 9px; }
  table.clients thead th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  table.clients tbody tr { cursor: pointer; }
  table.clients tbody tr:hover td { background: var(--surface-2); }
  table.clients tbody tr.selected td { background: var(--accent-soft); }
  table.clients td { padding: 11px 16px; font-size: 12.5px; vertical-align: middle; border-top: 1px solid var(--hairline); }
  table.clients tbody tr:first-child td { border-top: none; }
  .cell-name { display: flex; align-items: center; gap: 9px; font-weight: 600; }
  .mini-avatar { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .level-pill { display: inline-flex; align-items: center; gap: 3px; background: var(--accent-2-soft); color: var(--accent-2); font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; }
  .chip.ok { background: var(--success-soft); color: var(--success); }
  .chip.ok .dot { background: var(--success); }
  .chip.late { background: var(--warning-soft); color: var(--warning); }
  .chip.late .dot { background: var(--warning); }
  .chip.off { background: var(--surface-3); color: var(--text-faint); }
  .chip.off .dot { background: var(--text-faint); }

  .row-actions { display: flex; justify-content: flex-end; }
  .row-actions .icon-btn { width: 28px; height: 28px; }

  .empty-panel { background: var(--surface); border-radius: var(--radius); padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 12.5px; }
  .empty-panel strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 6px; font-family: var(--font-display); }

  /* ── Detail slide-over ── */
  .overlay { position: fixed; inset: 58px 0 0 0; background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.16s ease; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 58px; right: 0; bottom: 0; width: 400px; background: var(--surface);
    box-shadow: var(--shadow-lg); z-index: 50; transform: translateX(100%); transition: transform 0.18s ease; display: flex; flex-direction: column;
    border-radius: 20px 0 0 0;
  }
  .panel.open { transform: translateX(0); }
  .panel-head { padding: 20px 20px 0; }
  .panel-head-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .panel-avatar { width: 46px; height: 46px; border-radius: var(--radius-sm); background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .panel-close { border: none; background: var(--surface-2); width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-muted); }
  .panel-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 10px 0 2px; }
  .panel-sub { font-size: 12px; color: var(--text-muted); }
  .panel-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .panel-stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 9px 10px; }
  .panel-stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; }
  .panel-stat .v { font-family: var(--font-mono); font-size: 15px; font-weight: 700; margin-top: 2px; }
  .panel-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--hairline); padding: 0 20px; }
  .panel-tab { border: none; background: none; padding: 9px 4px; margin-right: 16px; font-size: 12px; font-weight: 600; color: var(--text-faint); cursor: pointer; border-bottom: 2px solid transparent; }
  .panel-tab:hover { color: var(--text); }
  .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .note-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
  .note-item .txt { font-size: 12.5px; white-space: pre-wrap; }
  .note-item .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .note-item .date { font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono); }
  .note-item .del { border: none; background: none; color: var(--text-faint); cursor: pointer; font-size: 11px; }
  .note-item .del:hover { color: var(--critical); }
  .note-form textarea { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-size: 12.5px; font-family: inherit; resize: vertical; min-height: 64px; }
  .note-form textarea:focus { border-color: var(--hairline); }
  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .field-row input, .field-row select, .field-row textarea {
    width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 9px 11px; color: var(--text); font-size: 13px; font-family: inherit; box-sizing: border-box;
  }
  .field-row input:focus, .field-row select:focus, .field-row textarea:focus { border-color: var(--hairline); }
  .field-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-box { background: var(--surface); border-radius: var(--radius); padding: 22px; width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-box h3 { margin: 0 0 16px; font-family: var(--font-display); font-size: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; justify-content: center; }
  .day-block { background: var(--surface); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .day-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-weight: 700; font-size: 13px; }
  .day-head .del { margin-left: auto; }
  .exo-row { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-top: 1px solid var(--hairline); font-size: 12.5px; overflow-x: auto; }
  .exo-row .nom { flex: 1 1 110px; min-width: 90px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exo-row .stat { color: var(--text-muted); font-family: var(--font-mono); font-size: 11.5px; white-space: nowrap; }
  .exo-row .mini-btn { border: none; background: var(--surface-2); color: var(--text-muted); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; font-size: 11px; flex-shrink: 0; }
  .exo-row .mini-btn:hover { color: var(--text); }
  .exo-champ { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .exo-champ label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); }
  .exo-champ input { width: 52px; background: var(--surface-2); border: 1px solid transparent; border-radius: 6px; padding: 5px 7px; color: var(--text); font-size: 12px; font-family: inherit; box-sizing: border-box; }
  .exo-champ input:focus { border-color: var(--hairline); }
  .drag-handle { cursor: grab; color: var(--text-faint); font-size: 14px; padding: 0 2px; flex-shrink: 0; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .exo-row.drag-over { box-shadow: inset 0 2px 0 var(--accent); }
  .tpl-card { background: var(--surface); border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: var(--shadow-sm); }
  .tpl-card .nom { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .tpl-card .meta { font-size: 11.5px; color: var(--text-faint); }
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .panel-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  .panel-row:last-child { border-bottom: none; }

  /* ── Fiche client — page dédiée ── */
  .fiche-back { display:inline-flex; align-items:center; gap:7px; color:var(--text-muted); font-size:12.5px; font-weight:600; background:none; border:none; cursor:pointer; padding:0; margin-bottom:18px; }
  .fiche-back:hover { color:var(--text); }
  .fiche-hero { display:flex; align-items:center; gap:16px; padding:0 0 20px; border-bottom:1px solid var(--hairline); margin-bottom:22px; }
  .fiche-avatar { width:54px; height:54px; border-radius:14px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; flex-shrink:0; }
  .fiche-hero-name { font-family:var(--font-display); font-size:20px; font-weight:700; }
  .fiche-hero-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .fiche-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media(max-width:960px){ .fiche-grid { grid-template-columns:1fr; } }
  .fiche-card { background:var(--surface); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow-sm); }
  .fiche-card h3 { font-family:var(--font-display); font-size:14px; font-weight:700; margin:0 0 14px; }
  .fiche-field { margin-bottom:12px; }

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function initials(nom){ return (nom||'?').split(" ").map(w=>w[0]).filter(Boolean).join("").slice(0,2).toUpperCase(); }

// Même mapping que renderNotificationsCoach() (coach.js) — à garder synchro si un type est ajouté là-bas.
function libelleLog(l){
  if (l.type === 'bilan') return { icon:'📋', txt:'Bilan clôturé', sub: l.semaine ? 'Semaine ' + l.semaine : '' };
  if (l.type === 'journee') return { icon:'✅', txt:'Journée validée', sub: l.semaine || '' };
  if (l.type === 'bilanEnvoye') return { icon:'📤', txt:'Bilan envoyé au coach', sub: l.semaine ? 'Semaine ' + l.semaine : '' };
  if (l.type === 'bonus_ponctualite') return { icon:'🎯', txt:'Bonus de ponctualité du bilan', sub: l.semaine ? 'Semaine ' + l.semaine : '' };
  if (l.type === 'bonus_streak') return { icon:'🔥', txt:'Bonus série de bilans', sub: l.semaine ? 'Semaine ' + l.semaine : '' };
  if (l.type === 'bonus_pas') return { icon:'🦶', txt:'Objectif pas atteint', sub: l.semaine || '' };
  const progParts = (l.programme || '').split('|');
  return { icon:'✅', txt: (l.semaine ? 'S' + l.semaine : '') + (progParts[1] ? ' · ' + progParts[1] : ' · Séance validée'), sub: progParts[0] || '' };
}

function bigChart(data, color){
  const w=560,h=100,max=Math.max(1,...data),min=Math.min(...data,0);
  const pts = data.map((v,i)=>[ (i/(data.length-1||1))*w, h - ((v-min)/((max-min)||1))*(h-10) - 4 ]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${h*f}" x2="${w}" y2="${h*f}" stroke="var(--hairline)" stroke-width="1"/>`).join('');
  return `<svg class="bigchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" opacity="0.18"/>
  </svg>`;
}

// ── Notes de coaching (Supabase) ──────────────────────────────────────
// SUPABASE_URL, SUPABASE_ANON_KEY et supaHeaders() viennent de api.js
async function chargerNotes(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/notes_coach?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function ajouterNote(clientId, contenu){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/notes_coach`, {
    method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }),
    body: JSON.stringify({ client_id: clientId, contenu })
  });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
async function supprimerNoteApi(id){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/notes_coach?id=eq.${id}`, { method: 'DELETE', headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
}

async function chargerTousProgrammes(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc`, { headers: supaHeaders() });
  if (!res.ok) return [];
  return res.json();
}

async function chargerTousDietes(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc`, { headers: supaHeaders() });
  if (!res.ok) return [];
  return res.json();
}

async function chargerProgrammeById(progId){
  const res1 = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?id=eq.${progId}`, { headers: supaHeaders() });
  if (!res1.ok) throw new Error('supabase_' + res1.status);
  const rows = await res1.json();
  if (!rows.length) return null;
  const cp = rows[0];
  const resArbo = await fetch(
    `${SUPABASE_URL}/rest/v1/client_programme_blocs?client_programme_id=eq.${cp.id}&order=ordre.asc` +
    `&select=*,client_programme_seances(*,client_programme_exercices(*))` +
    `&client_programme_seances.order=ordre.asc&client_programme_seances.client_programme_exercices.order=ordre.asc`,
    { headers: supaHeaders() }
  );
  const blocs = resArbo.ok ? await resArbo.json() : [];
  const exIds = [];
  blocs.forEach(b => (b.client_programme_seances||[]).forEach(s => (s.client_programme_exercices||[]).forEach(ex => exIds.push(ex.id))));
  let logs = {};
  if (exIds.length) {
    const resLogs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exIds.join(',')})&order=semaine.asc,numero_serie.asc`, { headers: supaHeaders() });
    if (resLogs.ok) (await resLogs.json()).forEach(l => { logs[l.client_programme_exercice_id+'|'+l.semaine+'|'+l.numero_serie] = l; });
  }
  return Object.assign({}, cp, { blocs, logs });
}

}

// ── Chargement des données réelles ────────────────────────────────────
async function chargerDonnees(){
  const [clientsRaw, bilansCoach, logsRes, aValider] = await Promise.all([
    api('listerClientsAvecNiveaux').catch(()=>[]),
    api('listerBilansCoach').catch(()=>[]),
    api('chargerTousLesLogs').catch(()=>({logs:[]})),
    api('listerAlimentsCommunauteAValider').catch(()=>[]),
  ]);
  const clients = (typeof clientsRaw === 'string' ? JSON.parse(clientsRaw) : clientsRaw).filter(c => c.id !== 'yohan');
  const retards = await Promise.all(
    clients.map(c => apiAs('verifierRetardBilan', c.id).catch(()=>({enRetard:false})))
  );
  // verifierRetardBilan() répond "si j'envoyais MAINTENANT, serait-ce en retard ?" — utile au moment
  // de l'envoi côté client (bilan.js), mais ça dit "en retard" pour tout le monde une fois la fenêtre
  // de la semaine passée, MÊME si le client a déjà envoyé son bilan à temps. On corrige ici en
  // vérifiant si un envoi (listerBilansCoach) existe déjà dans les ~6 derniers jours pour ce client.
  const parseTsFr = s => { const m = (s||'').match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/); return m ? new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]) : null; };
  const dernierEnvoi = {};
  bilansCoach.forEach(b => { const d = parseTsFr(b.ts); if (d && (!dernierEnvoi[b.client] || d > dernierEnvoi[b.client])) dernierEnvoi[b.client] = d; });
  const maintenant = new Date();
  clients.forEach((c,i) => {
    const raw = !!(retards[i] && retards[i].enRetard);
    const dernier = dernierEnvoi[c.id];
    const soumisRecemment = dernier && (maintenant - dernier) < 6*24*60*60*1000;
    c.enRetard = raw && !soumisRecemment;
  });

  // Fusionne les fiches Supabase (client_profils) — un client peut n'exister que dans Supabase
  // (créé depuis la console, pas encore dans la feuille Clients) : on l'ajoute comme entrée
  // synthétique pour qu'il apparaisse dans le tableau/panneau, avec un badge "pas de connexion possible".
  let profils = [];
  try {
    const resProfils = await fetch(`${SUPABASE_URL}/rest/v1/client_profils`, { headers: supaHeaders() });
    if (resProfils.ok) profils = await resProfils.json();
  } catch(e) {}
  const idsExistants = new Set(clients.map(c=>c.id));
  profils.forEach(p => {
    if (!idsExistants.has(p.client_id)) {
      clients.push({
        id: p.client_id,
        nom: [p.prenom, p.nom].filter(Boolean).join(' ') || p.client_id,
        niveau: null, enRetard: false, chimieActif: false, verrouile: false,
        dernConnexion: null, titreActif: null,
        _supabaseOnly: true,
      });
    }
  });

  data = { clients, bilansCoach, logs: (logsRes && logsRes.logs) || [], aValider };
}

async function rafraichir(){
  try {
    await chargerDonnees();
    renderSidebar();
    renderMain();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="empty-panel"><strong>Erreur de chargement</strong>${esc(e.message)}<br><br><button class="btn primary" onclick="rafraichir()" style="margin-top:10px;">Réessayer</button></div>`;
  }
}

function _parseTsMs(ts) {
  const m = (ts||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]).getTime() : null;
}
function _semaineFromDate(dateStr) {
  const m = (dateStr||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (!m) return dateStr;
  const sunMs = new Date(+m[3], +m[2]-1, +m[1]).getTime();
  const monMs = sunMs - 6*86400000;
  const mon = new Date(monMs), sun = new Date(sunMs);
  const p = n => ('0'+n).slice(-2);
  return `${p(mon.getDate())}/${p(mon.getMonth()+1)} → ${p(sun.getDate())}/${p(sun.getMonth()+1)}/${sun.getFullYear()}`;
}

function setBilansTab(tab) {
  bilansTab = tab;
  bilansHistoClientId = null;
  bilansHistoData = { loaded: false, error: null, bilans: [] };
  renderMain();
}

function openBilanHistoClient(clientId) {

    bilansHistoData = { loaded: true, error: null, bilans: raw || [] };

    if (bilansHistoClientId !== clientId) return;

}

}

async function openBilanDetailFromLog(client, ts, coachTraite) {
  bilanDetailState = { loaded: false, client, ligneTitre: null, ts, coachTraite: !!coachTraite, data: null, error: null };
  state.nav = 'bilan-detail';
  renderSidebar();
  renderMain();
  try {
    const historique = await apiAs('chargerHistoriqueBilans', client);
    const tsMs = _parseTsMs(ts);
    const match = historique.find(h => {
      const hMs = _parseTsMs(h.date);
      return hMs && tsMs && Math.abs(hMs - tsMs) <= 3*86400000;
    });
    if (!match) throw new Error('Bilan introuvable dans la feuille Sheets — semaine non retrouvée.');
    bilanDetailState.ligneTitre = match.ligneTitre;
    const raw = await apiAs('chargerBilanParLigne', client, { ligneTitre: match.ligneTitre });
    bilanDetailState = { ...bilanDetailState, loaded: true, data: typeof raw === 'string' ? JSON.parse(raw) : raw };
  } catch(e) {
    bilanDetailState = { ...bilanDetailState, loaded: true, error: e.message };
  }
  if (state.nav === 'bilan-detail') renderMain();
}

  if (!bilansHistoClientId) {
    const clientBilanCount = {}, clientLastTs = {};
    data.bilansCoach.forEach(b => {
      clientBilanCount[b.client] = (clientBilanCount[b.client]||0) + 1;

    modal.innerHTML = `<div class="modal-box" style="max-width:480px;">

    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('modal-import-sheets').remove()">Annuler</button>

    </div>
  </div>`;

async function executerImportSheets(coach, communaute){
  document.getElementById('btnLancerImport').disabled = true;
  const prog = document.getElementById('importSheetsProgress');
  const bar  = document.getElementById('importSheetsBar');
  const msg  = document.getElementById('importSheetsMsg');
  const errEl= document.getElementById('importSheetsErr');
  prog.style.display = 'block';

  const tous = [
    ...coach.map(a => ({
      nom: a.nom,
      categorie: null,
      kcal_par_gramme: (a.kcal||0) / 100,
      prot_par_gramme: (a.prot||0) / 100,
      glu_par_gramme:  (a.glu||0)  / 100,
      lip_par_gramme:  (a.lip||0)  / 100,
    })),
    ...communaute.map(a => ({
      nom: a.nom,
      categorie: null,
      kcal_par_gramme: (a.kcal||0) / 100,
      prot_par_gramme: (a.prot||0) / 100,
      glu_par_gramme:  (a.glu||0)  / 100,
      lip_par_gramme:  (a.lip||0)  / 100,
    })),
  ];

  const BATCH = 50;
  let importes = 0;
  let erreurs = 0;

  for (let i = 0; i < tous.length; i += BATCH) {
    const chunk = tous.slice(i, i + BATCH);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/aliments_coach`, {
        method: 'POST',
        headers: supaHeaders({ Prefer: 'return=minimal,resolution=ignore-duplicates' }),
        body: JSON.stringify(chunk),
      });
      if (!res.ok && res.status !== 409) throw new Error('supabase_' + res.status);
      importes += chunk.length;
    } catch(e) {
      erreurs += chunk.length;
    }
    const pct = Math.round(((i + chunk.length) / tous.length) * 100);
    bar.style.width = pct + '%';
    msg.textContent = `${Math.min(i + BATCH, tous.length)} / ${tous.length} traités…`;
  }

  bar.style.width = '100%';
  msg.textContent = `Import terminé : ${importes} ajoutés${erreurs ? `, ${erreurs} erreurs` : ''}.`;

  if (erreurs) { errEl.textContent = `${erreurs} aliments n'ont pas pu être insérés.`; errEl.style.display='block'; }

  // Recharger la base locale
  alimentsCoachData = null;
  alimentsCoachErr = null;
  try { alimentsCoachData = await chargerAlimentsCoach(); } catch(e) { alimentsCoachErr = e.message; }

  document.getElementById('btnLancerImport').textContent = 'Fermer';
  document.getElementById('btnLancerImport').onclick = () => { document.getElementById('modal-import-sheets').remove(); renderBaseSub(); };
  document.getElementById('btnLancerImport').disabled = false;
}

async function _confirmerImportOFF(idx){
  const r = alimOffResults[idx];
  const nom = document.getElementById('offNom').value.trim();
  const categorie = document.getElementById('offCat').value || null;
  const errEl = document.getElementById('offErr');
  if (!nom){ errEl.textContent='Nom obligatoire.'; errEl.style.display='block'; return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/aliments_coach`, {
      method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
      body:JSON.stringify({ nom, categorie, kcal_par_gramme:r.kcal, prot_par_gramme:r.prot, glu_par_gramme:r.glu, lip_par_gramme:r.lip })
    });

async function rechercherOpenFoodFacts(query){
  const params = new URLSearchParams({
    search_terms: query,
    action: 'process',
    json: '1',
    page_size: '30',
    sort_by: 'unique_scans_n',
    fields: 'product_name,nutriments',
    lc: 'fr',
  });
  const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?${params}`);
  if (!res.ok) throw new Error('OFF ' + res.status);
  const json = await res.json();
  const seen = new Set();
  return (json.products||[])
    .map(p => {
      const nom = (p.product_name||'').trim();
      const kcal = (p.nutriments?.['energy-kcal_100g'] ?? p.nutriments?.['energy-kcal_serving'] ?? null);
      const prot = (p.nutriments?.proteins_100g ?? null);
      const glu  = (p.nutriments?.carbohydrates_100g ?? null);
      const lip  = (p.nutriments?.fat_100g ?? null);
      return { nom, kcal: kcal!=null?kcal/100:null, prot: prot!=null?prot/100:null, glu: glu!=null?glu/100:null, lip: lip!=null?lip/100:null };
    })
    .filter(p => {
      if (!p.nom || p.nom.length < 2) return false;       // pas de nom
      if (p.kcal == null && p.prot == null) return false;  // pas de macros du tout
      const key = p.nom.toLowerCase();
      if (seen.has(key)) return false;                     // dédoublonnage
      seen.add(key);
      return true;
    })
    .slice(0, 20);
}

async function sauvegarderTemplateComplet(tpl){
  const method = tpl.id ? 'PATCH' : 'POST';
  const url = tpl.id ? `${SUPABASE_URL}/rest/v1/programme_templates?id=eq.${tpl.id}` : `${SUPABASE_URL}/rest/v1/programme_templates`;
  const res = await fetch(url, { method, headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify({ nom: tpl.nom, categorie: tpl.categorie || null, description: tpl.description || null }) });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const saved = (await res.json())[0];
  const templateId = saved.id;
  if (tpl.id) {
    // Remplacement complet de l'arborescence (comme modifierMenu côté GAS) plutôt qu'un diff fin —
    // cascade sur programme_seances puis programme_seance_exercices.
    await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs?template_id=eq.${templateId}`, { method: 'DELETE', headers: supaHeaders() });
  }
  const blocsPayload = tpl.blocs.map((b, bi) => ({ template_id: templateId, type: b.type || null, nombre_semaines: b.nombre_semaines || null, ordre: bi }));
  const resBlocs = await fetch(`${SUPABASE_URL}/rest/v1/programme_blocs`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(blocsPayload) });
  if (!resBlocs.ok) throw new Error('supabase_' + resBlocs.status);
  const blocsSaved = await resBlocs.json();
  // Lookup par 'ordre' (qu'on a nous-même assigné = bi) plutôt que par position du tableau retourné —
  // l'ordre de retour d'un insert multi-lignes n'est pas garanti par Postgres.
  const blocIdByOrdre = {};
  blocsSaved.forEach(b => { blocIdByOrdre[b.ordre] = b.id; });

  const seancesPayload = [];
  tpl.blocs.forEach((b, bi) => {
    b.seances.forEach((s, si) => {
      seancesPayload.push({ bloc_id: blocIdByOrdre[bi], titre: s.titre || ('Séance ' + (si + 1)), ordre: si });
    });
  });
  let seancesSaved = [];
  if (seancesPayload.length) {
    const resSeances = await fetch(`${SUPABASE_URL}/rest/v1/programme_seances`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(seancesPayload) });
    if (!resSeances.ok) throw new Error('supabase_' + resSeances.status);
    seancesSaved = await resSeances.json();
  }
  const seanceIdByBlocOrdre = {};
  seancesSaved.forEach(s => { seanceIdByBlocOrdre[s.bloc_id + '|' + s.ordre] = s.id; });

  const exercicesPayload = [];
  tpl.blocs.forEach((b, bi) => {
    const blocId = blocIdByOrdre[bi];
    b.seances.forEach((s, si) => {
      const seanceId = seanceIdByBlocOrdre[blocId + '|' + si];
      s.exercices.forEach((ex, ei) => {
        exercicesPayload.push({ seance_id: seanceId, exercice_id: ex.exercice_id, ordre: ei, series: parseInt(ex.series) || null, reps: ex.reps || '', repos: ex.repos || '', tempo: ex.tempo || '', rir: ex.rir || '', notes: ex.notes || '' });
      });
    });
  });
  if (exercicesPayload.length) {
    const resExo = await fetch(`${SUPABASE_URL}/rest/v1/programme_seance_exercices`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(exercicesPayload) });
    if (!resExo.ok) throw new Error('supabase_' + resExo.status);
  }
  return saved;
}

}

    tplEnEdition = {
      id: tpl.id, nom: tpl.nom, categorie: tpl.categorie || '', description: tpl.description || '',

          exercices: (s.programme_seance_exercices || []).map(l => {

let dragExoSource = null;
function onDragStartExo(e, bi, si, ei){
  dragExoSource = { bi, si, ei };
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEndExo(){
  dragExoSource = null;
}
function onDropExo(e, bi, si, ei){
  e.preventDefault();
  const src = dragExoSource;
  dragExoSource = null;
  if (!src || src.bi !== bi || src.si !== si || src.ei === ei) { renderBlocsTemplate(); return; }
  const arr = tplEnEdition.blocs[bi].seances[si].exercices;
  const [moved] = arr.splice(src.ei, 1);
  const cible = src.ei < ei ? ei - 1 : ei;
  arr.splice(cible, 0, moved);
  renderBlocsTemplate();
}

async function assignerTemplateAuClient(templateId, clientId){
  if (exercicesData === null) exercicesData = await chargerExercices();
  if (templatesData === null) templatesData = await chargerTemplates();
  const tpl = templatesData.find(t => t.id === templateId);
  const blocsArbo = await chargerTemplateArbo(templateId);

  // Un seul programme actif à la fois pour ce client — on désactive les précédents plutôt que les supprimer
  // (garde l'historique de logs des anciens programmes accessible).
  await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true`, {
    method: 'PATCH', headers: supaHeaders(), body: JSON.stringify({ actif: false })
  });

  const resCp = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes`, {
    method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }),
    body: JSON.stringify({ client_id: clientId, nom: tpl.nom, actif: true })
  });
  if (!resCp.ok) throw new Error('supabase_' + resCp.status);
  const cp = (await resCp.json())[0];

  const blocsPayload = blocsArbo.map((b, bi) => ({ client_programme_id: cp.id, type: b.type || null, nombre_semaines: b.nombre_semaines || null, ordre: bi }));
  const resBlocs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_blocs`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(blocsPayload) });
  if (!resBlocs.ok) throw new Error('supabase_' + resBlocs.status);
  const blocsSaved = await resBlocs.json();
  const blocIdByOrdre = {};
  blocsSaved.forEach(b => { blocIdByOrdre[b.ordre] = b.id; });

  const seancesPayload = [];
  blocsArbo.forEach((b, bi) => {
    (b.programme_seances||[]).forEach((s, si) => {
      seancesPayload.push({ bloc_id: blocIdByOrdre[bi], titre: s.titre, ordre: si });
    });
  });
  let seancesSaved = [];
  if (seancesPayload.length) {
    const resSeances = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_seances`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=representation' }), body: JSON.stringify(seancesPayload) });
    if (!resSeances.ok) throw new Error('supabase_' + resSeances.status);
    seancesSaved = await resSeances.json();
  }
  const seanceIdByBlocOrdre = {};
  seancesSaved.forEach(s => { seanceIdByBlocOrdre[s.bloc_id + '|' + s.ordre] = s.id; });

  const exercicesPayload = [];
  blocsArbo.forEach((b, bi) => {
    const blocId = blocIdByOrdre[bi];
    (b.programme_seances||[]).forEach((s, si) => {
      const seanceId = seanceIdByBlocOrdre[blocId + '|' + si];
      (s.programme_seance_exercices||[]).forEach((ex, ei) => {
        const source = exercicesData.find(e => e.id === ex.exercice_id);
        exercicesPayload.push({
          seance_id: seanceId, exercice_id: ex.exercice_id, nom: source ? source.nom : '(exercice supprimé)',
          ordre: ei, series: ex.series, reps: ex.reps, repos: ex.repos, tempo: ex.tempo, rir: ex.rir,
        });
      });
    });
  });
  if (exercicesPayload.length) {
    const resExo = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_exercices`, { method: 'POST', headers: supaHeaders({ Prefer: 'return=minimal' }), body: JSON.stringify(exercicesPayload) });
    if (!resExo.ok) throw new Error('supabase_' + resExo.status);
  }
  return cp;
}

  const totalActivite = data.logs.length;

  el.innerHTML = `

async function chargerProgrammeActif(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&actif=eq.true&order=created_at.desc&limit=1`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const rows = await res.json();
  if (!rows.length) return null;
  const cp = rows[0];
  const resArbo = await fetch(
    `${SUPABASE_URL}/rest/v1/client_programme_blocs?client_programme_id=eq.${cp.id}&order=ordre.asc` +
    `&select=*,client_programme_seances(*,client_programme_exercices(*))` +
    `&client_programme_seances.order=ordre.asc&client_programme_seances.client_programme_exercices.order=ordre.asc`,
    { headers: supaHeaders() }
  );
  const blocs = resArbo.ok ? await resArbo.json() : [];
  const exIds = [];
  blocs.forEach(b => (b.client_programme_seances||[]).forEach(s => (s.client_programme_exercices||[]).forEach(ex => exIds.push(ex.id))));
  let logs = {};
  if (exIds.length) {
    const resLogs = await fetch(`${SUPABASE_URL}/rest/v1/client_programme_logs?client_programme_exercice_id=in.(${exIds.join(',')})&order=semaine.asc,numero_serie.asc`, { headers: supaHeaders() });
    if (resLogs.ok) (await resLogs.json()).forEach(l => { logs[l.client_programme_exercice_id+'|'+l.semaine+'|'+l.numero_serie] = l; });
  }
  return Object.assign({}, cp, { blocs, logs });
}

let panelProgression = null;
async function chargerProgression(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/bilan_snapshots?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.asc`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}
function progressionChart(vals, color){
  const w=560,h=100,min=Math.min(...vals),max=Math.max(...vals);
  const pts = vals.map((v,i)=>[ (i/(vals.length-1||1))*w, h - ((v-min)/((max-min)||1))*(h-10) - 4 ]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="0" y1="${h*f}" x2="${w}" y2="${h*f}" stroke="var(--hairline)" stroke-width="1"/>`).join('');
  return `<svg class="bigchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="${color}" opacity="0.18"/>
  </svg>`;
}
function renderProgressionTab(){
  const list = panelProgression || [];
  const poids = list.map(s => parseFloat(s.poids_moyen)).filter(v => !isNaN(v));
  return `
    ${poids.length >= 2 ? `
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-faint);margin-bottom:6px;">Poids moyen par bilan</div>
      ${progressionChart(poids, 'var(--accent)')}
    ` : `<div class="empty-panel" style="padding:20px 12px;margin-bottom:12px;">Pas assez de bilans validés pour tracer un graphique (minimum 2).</div>`}
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-faint);margin:14px 0 6px;">Historique</div>
    ${list.length ? list.slice().reverse().map(s => `

async function chargerFiche(clientId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  const rows = await res.json();

}
function ageDepuisDate(dateStr){
  if (!dateStr) return null;
  const naissance = new Date(dateStr);
  if (isNaN(naissance)) return null;
  const auj = new Date();
  let age = auj.getFullYear() - naissance.getFullYear();
  const m = auj.getMonth() - naissance.getMonth();
  if (m < 0 || (m === 0 && auj.getDate() < naissance.getDate())) age--;

async function chargerDieteTemplates(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?client_only=eq.false&order=nom.asc&select=*,repas(id,nom,ordre,repas_aliments(id,nom,quantite_g,kcal_par_gramme,prot_par_gramme,glu_par_gramme,lip_par_gramme))`, { headers: supaHeaders() });
  if (!res.ok) throw new Error('supabase_' + res.status);
  return res.json();
}

function macrosDiete(repasArr){
  let kcal=0, prot=0, glu=0, lip=0;
  (repasArr||[]).forEach(r => (r.repas_aliments||[]).forEach(a => {
    const q = parseFloat(a.quantite_g)||0;
    kcal += q * (parseFloat(a.kcal_par_gramme)||0);
    prot += q * (parseFloat(a.prot_par_gramme)||0);
    glu  += q * (parseFloat(a.glu_par_gramme)||0);
    lip  += q * (parseFloat(a.lip_par_gramme)||0);
  }));
  return { kcal:Math.round(kcal), prot:Math.round(prot), glu:Math.round(glu), lip:Math.round(lip) };
}

function retourDepuisEditeurDiete() {
  if (_ficheEditClientId) { _ficheEditClientId = null; setNav('fiche-client'); }

  else { setNav(_dietNavBack || 'dietes'); }
}

function ajouterRepas(){
  const maxOrdre = dieteTplEnEdition.repas.reduce((m,r) => Math.max(m, r.ordre != null ? r.ordre : 0), -1);
  dieteTplEnEdition.repas.push({ nom:`Repas ${maxOrdre+2}`, ordre:maxOrdre+1, variante_index:0, aliments:[] });
  setNav('editeur-diete');
}

function ajouterVarianteRepas(ordre){
  ordre = parseInt(ordre);
  const existing = dieteTplEnEdition.repas.filter(r => (r.ordre != null ? r.ordre : 0) === ordre);
  const maxVariante = existing.reduce((m,r) => Math.max(m, r.variante_index||0), 0);
  const mainNom = (existing.find(r=>(r.variante_index||0)===0)||existing[0]||{}).nom || 'Repas';
  dieteTplEnEdition.repas.push({ nom:mainNom+' (variante)', ordre, variante_index:maxVariante+1, aliments:[] });
  setNav('editeur-diete');
}

function supprimerRepas(ri){
  dieteTplEnEdition.repas.splice(ri,1);
  setNav('editeur-diete');
}

function supprimerAlimentDiete(ri, ai){
  dieteTplEnEdition.repas[ri].aliments.splice(ai,1);

function _confirmerAlimSelectionne(nom, kcal_pg, prot_pg, glu_pg, lip_pg){

function confirmerAjoutAliment(){
  const nom = document.getElementById('aNom').value.trim();
  const errEl = document.getElementById('aErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  const qte = parseFloat(document.getElementById('aQte').value)||0;
  const kcal = (parseFloat(document.getElementById('aKcal').value)||0) / 100;
  const prot = (parseFloat(document.getElementById('aProt').value)||0) / 100;
  const glu  = (parseFloat(document.getElementById('aGlu').value)||0) / 100;
  const lip  = (parseFloat(document.getElementById('aLip').value)||0) / 100;
  dieteTplEnEdition.repas[ajoutAlimRI].aliments.push({ nom, quantite_g:qte, kcal_par_gramme:kcal, prot_par_gramme:prot, glu_par_gramme:glu, lip_par_gramme:lip });
  _ajoutAlimCount++;
  _updateAlimentsDom(ajoutAlimRI);
  // Reset le formulaire pour un autre ajout manuel
  document.getElementById('aNom').value = '';
  document.getElementById('aQte').value = '100';
  ['aKcal','aProt','aGlu','aLip'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
  const flash = document.getElementById('picker-flash');
  if (flash) { flash.textContent = `✓ ${nom} ajouté`; flash.style.opacity = '1'; setTimeout(()=>{ if(flash) flash.style.opacity='0'; }, 2500); }
  setTimeout(()=>document.getElementById('aNom')?.focus(), 30);
}

async function sauvegarderDieteTemplate(){
  if (_ficheCreateClientId) { await sauvegarderDietePourClient(); return; }
  const nom = document.getElementById('dNom').value.trim();
  const errEl = document.getElementById('dErr');
  if (!nom){ errEl.textContent='Le nom est obligatoire.'; errEl.style.display='block'; return; }
  dieteTplEnEdition.nom = nom;
  dieteTplEnEdition.description = document.getElementById('dDesc').value.trim();
  try {
    const method = dieteTplEnEdition.id ? 'PATCH' : 'POST';
    const url = dieteTplEnEdition.id ? `${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${dieteTplEnEdition.id}` : `${SUPABASE_URL}/rest/v1/diete_templates`;
    const res = await fetch(url, { method, headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ nom:dieteTplEnEdition.nom, description:dieteTplEnEdition.description||null }) });
    if (!res.ok) throw new Error('supabase_'+res.status);
    const saved = (await res.json())[0];
    const tplId = saved.id;
    if (dieteTplEnEdition.id) {
      await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tplId}`, { method:'DELETE', headers:supaHeaders() });
    }
    for (let ri=0; ri<dieteTplEnEdition.repas.length; ri++){
      const r = dieteTplEnEdition.repas[ri];
      const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`, { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id:tplId, nom:r.nom, ordre:r.ordre!=null?r.ordre:ri, variante_index:r.variante_index||0 }) });
      if (!rRes.ok) throw new Error('supabase_repas_'+rRes.status);
      const savedR = (await rRes.json())[0];
      if (r.aliments.length){
        const alimPayload = r.aliments.map((a,ai)=>({ repas_id:savedR.id, nom:a.nom, quantite_g:a.quantite_g, kcal_par_gramme:a.kcal_par_gramme, prot_par_gramme:a.prot_par_gramme, glu_par_gramme:a.glu_par_gramme, lip_par_gramme:a.lip_par_gramme, ordre:ai }));
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`, { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(alimPayload) });
      }
    }
    dieteTemplatesData = null;
    dieteTemplatesData = await chargerDieteTemplates();
    if (_ficheEditClientId) {
      const cid = _ficheEditClientId;
      _ficheEditClientId = null;
      await openPanel(cid);
      setFicheTab('diete');
      setNav('fiche-client');
    } else {
      setNav('dietes');
    }
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

  const clientOpts = ['<option value="">— Choisir un client —</option>',

async function ouvrirAssignerDiete(clientId){
  if (dieteTemplatesData === null){
    try { dieteTemplatesData = await chargerDieteTemplates(); } catch(e){ alert('Erreur chargement diètes : '+e.message); return; }
  }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-assigner-diete';
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  const tplOpts = ['<option value="">— Choisir un template —</option>',

  ].join('');

async function confirmerAssignerDiete(templateId, templateNom){
  const clientId = document.getElementById('fAssignDieteClient').value;
  const errEl = document.getElementById('assignDieteErr');
  if (!clientId){ errEl.textContent='Sélectionne un client.'; errEl.style.display='block'; return; }
  try {
    await assignerDieteAuClient(templateId, templateNom, clientId);
    document.getElementById('modal-assigner-diete').remove();
    alert('Diète assignée.');
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

async function confirmerAssignerDieteDepuisFiche(clientId){
  const val = document.getElementById('fAssignDieteTpl').value;
  const errEl = document.getElementById('assignDieteErr');
  if (!val){ errEl.textContent='Sélectionne un template.'; errEl.style.display='block'; return; }
  const [tplId, tplNom] = val.split('|');
  try {
    await assignerDieteAuClient(parseInt(tplId), tplNom, clientId);
    document.getElementById('modal-assigner-diete').remove();
    ficheData.tous_dietes = await chargerTousDietes(clientId);
    ficheData.diete = ficheData.tous_dietes.find(d=>d.actif) || null;
    setFicheTab('diete');
  } catch(e){ errEl.textContent='Erreur : '+e.message; errEl.style.display='block'; }
}

async function assignerDieteAuClient(templateId, templateNom, clientId){
  // Plusieurs diètes simultanées autorisées — pas de désactivation des autres
  const res = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes`, {
    method:'POST', headers:supaHeaders({ Prefer:'return=representation' }),
    body:JSON.stringify({ client_id:clientId, nom:templateNom, actif:true })
  });
  if (!res.ok) throw new Error('supabase_'+res.status);
  return (await res.json())[0];
}

async function retirerDieteClient(dieteId, clientId){
  if (!confirm('Retirer cette diète du client ?')) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?id=eq.${dieteId}`, { method:'DELETE', headers:supaHeaders() });
    ficheData.tous_dietes = await chargerTousDietes(clientId);
    ficheData.diete = ficheData.tous_dietes.find(d=>d.actif) || null;
    setFicheTab('diete');
  } catch(e){ alert('Erreur : '+e.message); }
}

async function sauverRecette() {
  const r = recetteEnEdition;
  const payload = {
    nom: document.getElementById('rNom').value.trim(),
    description: document.getElementById('rDesc').value.trim()||null,
    categorie: document.getElementById('rCat').value.trim()||null,
    emoji: document.getElementById('rEmoji').value.trim()||'🍽️',
    temps_prep_min: parseInt(document.getElementById('rTemps').value)||null,
    portions: parseInt(document.getElementById('rPortions').value)||1,
    kcal_par_portion: parseFloat(document.getElementById('rKcal').value)||null,
    prot_par_portion: parseFloat(document.getElementById('rProt').value)||null,
    glu_par_portion: parseFloat(document.getElementById('rGlu').value)||null,
    lip_par_portion: parseFloat(document.getElementById('rLip').value)||null,
    ingredients: r.ingredients.filter(x=>(typeof x==='string'?x:(x.nom||'')).trim()),
    etapes: r.etapes.filter(x=>(typeof x==='string'?x:(x.texte||'')).trim())
  };
  if (!payload.nom) { alert('Le nom est obligatoire.'); return; }
  try {
    let res;
    if (r.id) {
      res = await fetch(`${SUPABASE_URL}/rest/v1/recettes?id=eq.${r.id}`,
        { method:'PATCH', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(payload) });
    } else {
      res = await fetch(`${SUPABASE_URL}/rest/v1/recettes`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify(payload) });
    }
    if (!res.ok) throw new Error('Supabase ' + res.status + ' : ' + await res.text());
    const saved = (await res.json())[0];
    if (r.id) {
      recettesCoachData = recettesCoachData.map(x=>x.id===r.id?saved:x);
    } else {
      recettesCoachData = [...(recettesCoachData||[]), saved];
    }
    document.getElementById('modal-editeur-recette').remove();
    renderRecettesCoachSub();
  } catch(e){ alert('Erreur : ' + e.message); }
}

// URL du GAS de production (indépendant du sandbox)
const GAS_PROD_URL = 'https://script.google.com/macros/s/AKfycbwQiM6ixf-CTIWwcuNHoosFbvrDzWmC056yRUGhTaWv0Nwxbm0dLeK3d5QVgqmS7P9G7A/exec';

// Mapping ID Supabase → ID GAS quand ils diffèrent
// (ex: compte test "yohanp" utilise la feuille réelle "yohan")
const GAS_ID_MAP = { 'yohanp': 'yohan' };
function _gasId(clientId) { return GAS_ID_MAP[clientId] || clientId; }

async function apiGasProd(action, clientId, params = {}) {
  const body = { action, token: getToken(), client: _gasId(clientId), params };
  const res = await fetch(GAS_PROD_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'erreur_gas');
  return json.data;
}

function _parseDateFr(s) {
  const m = (s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : null;
}

      el.innerHTML = `<div class="card-empty" style="padding:24px 0;">Aucune mensuration — clique sur <strong>⬇ Migrer depuis GAS</strong> pour importer.</div>`;

    }
    el.innerHTML = `<div class="table-scroll"><table class="alim-table">
      <thead><tr><th>Date</th><th>Phase</th><th>Poids (kg)</th><th>Mesure (cm)</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td class="mono">${esc(r.date||'')}</td>
        <td>${esc(r.phase||'—')}</td>

        <td>${r.mesure!=null?r.mesure:'—'}</td>
      </tr>`).join('')}</tbody>

async function migrerMensurations(clientId, rafraichirPage) {
  const statusEl = document.getElementById('migStatus_' + clientId) || document.getElementById('mensurationsContent');
  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;"><div class="spin"></div> Lecture GAS prod (${_gasId(clientId)})…</div>`;
  try {
    const raw = await apiGasProd('chargerMensurations', clientId);
    const releves = (typeof raw === 'string' ? JSON.parse(raw) : raw) || [];
    if (!releves.length) {
      if (statusEl) statusEl.innerHTML = `<span style="color:var(--text-muted);">Aucune mensuration dans GAS.</span>`;
      return;
    }
    const rows = releves
      .map(r => ({
        client_id: clientId,
        date: _parseDateFr(r.date),
        phase: r.phase || null,
        poids: r.poids != null ? r.poids : null,
        mesure: r.taille != null ? r.taille : null,
      }))
      .filter(r => r.date);

    const res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?on_conflict=client_id,date`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify(rows),
    });
    if (!res.ok && res.status !== 409) throw new Error('supabase_' + res.status);
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--success,#4caf50);">✓ ${rows.length} relevés importés.</span>`;
    if (rafraichirPage) setTimeout(() => chargerMensurationsSupabase(clientId), 600);
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--critical);">Erreur : ${esc(e.message)}</span>`;
  }
}

async function _chargerMigPreviewData(clientId) {
  try {
    const [profRes, supaMenuRes, supaCliDietesRes, supaCliProgsRes, gasMenuRaw, gasDietesRaw, gasFeuilles, gasBilansRaw, supaBilansRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/client_profils?client_id=eq.${encodeURIComponent(clientId)}`, { headers: supaHeaders() }),
      fetch(`${SUPABASE_URL}/rest/v1/mensurations?client_id=eq.${encodeURIComponent(clientId)}&order=date.desc`, { headers: supaHeaders() }),
      fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc`, { headers: supaHeaders() }),
      fetch(`${SUPABASE_URL}/rest/v1/client_programmes?client_id=eq.${encodeURIComponent(clientId)}&order=created_at.desc`, { headers: supaHeaders() }),
      apiGasProd('chargerMensurations', clientId).catch(() => []),
      apiGasProd('listerDietes', clientId).catch(() => []),
      apiGasProd('listerFeuilles', clientId).catch(() => []),
      apiGasProd('chargerHistoriqueBilans', clientId).catch(() => []),
      fetch(`${SUPABASE_URL}/rest/v1/bilans?client_id=eq.${encodeURIComponent(clientId)}&select=gas_ligne_titre`, { headers: supaHeaders() }).catch(() => null),
    ]);
    const profRows        = profRes.ok        ? await profRes.json()        : [];
    const supaMensurations = supaMenuRes.ok   ? await supaMenuRes.json()    : [];
    const supaClientDietes = supaCliDietesRes.ok ? await supaCliDietesRes.json() : [];
    const supaClientProgs  = supaCliProgsRes.ok  ? await supaCliProgsRes.json()  : [];
    const gasMensurations  = (typeof gasMenuRaw === 'string' ? JSON.parse(gasMenuRaw) : gasMenuRaw) || [];
    const gasDietes        = (typeof gasDietesRaw === 'string' ? JSON.parse(gasDietesRaw) : gasDietesRaw) || [];
    const gasBilans        = (typeof gasBilansRaw === 'string' ? JSON.parse(gasBilansRaw) : gasBilansRaw) || [];
    const supaBilansRows   = supaBilansRes?.ok ? await supaBilansRes.json() : [];
    const supaBilanLignes  = new Set(supaBilansRows.map(r => r.gas_ligne_titre));
    const supaProfile = profRows[0] || null;

    const supaDateSet = new Set(supaMensurations.map(r => r.date));
    migPreviewSel = new Set(gasMensurations.map(r => _parseDateFr(r.date)).filter(d => d && !supaDateSet.has(d)));
    migBilanSel = new Set(gasBilans.filter(b => !supaBilanLignes.has(b.ligneTitre)).map(b => b.ligneTitre));
    migPreviewData = { loaded: true, error: null, supaProfile, gasMensurations, supaMensurations, gasDietes, gasFeuilles, supaClientDietes, supaClientProgs, gasBilans, supaBilanLignes };
    if (state.nav === 'migration-preview' && migPreviewClientId === clientId) renderMain();
  } catch(e) {
    migPreviewData = { loaded: true, error: e.message, supaProfile: null, gasMensurations: [], supaMensurations: [], gasDietes: [], gasFeuilles: [], supaClientDietes: [], supaClientProgs: [] };
    if (state.nav === 'migration-preview' && migPreviewClientId === clientId) renderMain();
  }
}

  const countEl = document.querySelector('#migPreviewContent span[style*="text-faint"]');
  document.querySelectorAll('#migPreviewContent .btn.primary').forEach(b => {
    b.disabled = migPreviewSel.size === 0;
    b.textContent = `⬇ Migrer ${migPreviewSel.size > 0 ? migPreviewSel.size + ' ligne' + (migPreviewSel.size > 1 ? 's' : '') : ''}`;
  });
  // Met à jour "tout sélectionner"
  const gasRows = migPreviewData.gasMensurations || [];
  const allSelectable = gasRows.map(r => _parseDateFr(r.date)).filter(Boolean);
  const allSelected = allSelectable.length > 0 && allSelectable.every(d => migPreviewSel.has(d));
  document.querySelectorAll('#migPreviewContent input[type=checkbox][onchange*="SelAll"]').forEach(cb => cb.checked = allSelected);

async function migrerSelectionMensu() {

    const gasRows = migPreviewData.gasMensurations || [];

      .map(r => ({ isoDate: _parseDateFr(r.date), raw: r }))

        phase: raw.phase || null,
        poids: raw.poids != null ? raw.poids : null,
        mesure: raw.taille != null ? raw.taille : null,
      }));
    const res = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?on_conflict=client_id,date`, {
      method: 'POST',
      headers: supaHeaders({ Prefer: 'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify(rows),
    });
    if (!res.ok && res.status !== 409) throw new Error('supabase_' + res.status);
    // Recharger les données Supabase et re-render
    const supaRes = await fetch(`${SUPABASE_URL}/rest/v1/mensurations?client_id=eq.${encodeURIComponent(migPreviewClientId)}&order=date.desc`, { headers: supaHeaders() });
    migPreviewData.supaMensurations = supaRes.ok ? await supaRes.json() : migPreviewData.supaMensurations;

    rows.forEach(r => migPreviewSel.delete(r.date));
    const content = document.getElementById('migPreviewContent');
    if (content) content.innerHTML = _renderMigPreviewTabContent();
    // Mettre à jour les compteurs dans le hero
    const supaCount = migPreviewData.supaMensurations.length;
    document.querySelectorAll('.table-card .fiche-hero-name').forEach(() => {});
    // Re-render complet pour mettre à jour les chips stats
    renderMain();

    document.querySelectorAll('#migPreviewContent .btn.primary').forEach(b => b.disabled = false);
  }
}

function _renderDieteGASDetail(detail, supaClientDietes) {
  const nom = migPreviewDieteSel ? migPreviewDieteSel.nom : (detail.nom||'');
  const repas = detail.repas || [];

  const dejaMigree = supaClientDietes.some(d => d.nom === nom);

  let kcalTotal = 0, protTotal = 0, gluTotal = 0, lipTotal = 0;
  repas.forEach(r => (r.aliments||[]).forEach(a => {
    kcalTotal += a.cals||0; protTotal += a.prot||0; gluTotal += a.glu||0; lipTotal += a.lip||0;
  }));

  const renderAlims = aliments => (aliments||[]).map(a =>
    `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--hairline);">
      <span style="color:var(--text);">${esc(a.nom)}</span>
      <span style="color:var(--text-faint);font-family:var(--font-mono);">${a.qte}g · ${Math.round(a.cals)}kcal · P${Math.round(a.prot)}g</span>
    </div>`).join('');

  const repasHtml = repas.map(r => {
    const equivs = r.equivalences || [];
    const equivsHtml = equivs.map(eq => `
      <div style="margin-left:12px;margin-top:6px;padding:6px 8px;border-left:2px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;">
        <div style="font-size:10px;font-weight:700;color:var(--accent);margin-bottom:4px;">≡ ${esc(eq.nom)}</div>
        ${renderAlims(eq.aliments) || '<div style="font-size:11px;color:var(--text-faint);">Aucun aliment</div>'}
      </div>`).join('');
    return `<div style="margin-bottom:12px;">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--accent);margin-bottom:6px;">${esc(r.nom)}${equivs.length ? ` <span style="font-weight:400;color:var(--text-faint);">(${equivs.length} équiv.)</span>` : ''}</div>
      ${renderAlims(r.aliments) || '<div style="font-size:12px;color:var(--text-faint);">Aucun aliment</div>'}
      ${equivsHtml}
    </div>`;
  }).join('');

  return `
    <div class="table-card" style="padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px;">
        <div>
          <div style="font-weight:700;font-size:15px;">${esc(nom)}</div>
          <div style="font-size:11px;color:var(--text-faint);margin-top:2px;">${repas.length} repas · ${Math.round(kcalTotal)} kcal · P ${Math.round(protTotal)}g · G ${Math.round(gluTotal)}g · L ${Math.round(lipTotal)}g</div>
        </div>
        ${dejaMigree
          ? `<span style="font-size:11px;color:var(--text-faint);white-space:nowrap;">Déjà une diète "${esc(nom)}" dans Supabase</span>`
          : ''}
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;">
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);cursor:pointer;white-space:nowrap;">
            <input type="checkbox" id="cbMigAsTemplate"> Créer un template réutilisable
          </label>
          <button class="btn primary" style="width:100%;" onclick="migrerDieteGAS()">⬇ Importer cette diète</button>
        </div>
      </div>
      <div id="migDieteStatus" style="margin-bottom:8px;"></div>
      ${repasHtml}
    </div>`;
}

async function migrerDieteGAS() {
  const statusEl = document.getElementById('migDieteStatus');
  if (!migPreviewDieteDetail || !migPreviewDieteSel) return;
  if (statusEl) statusEl.innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-size:12px;"><div class="spin"></div> Import en cours…</div>`;
  document.querySelectorAll('#migDieteDetail .btn.primary').forEach(b => b.disabled = true);
  try {
    const nom = migPreviewDieteSel.nom;
    const repasGAS = migPreviewDieteDetail.repas || [];

    // 1. Réutiliser ou créer le template diète
    const commeTemplate = document.getElementById('cbMigAsTemplate')?.checked;
    const existTplRes = await fetch(
      `${SUPABASE_URL}/rest/v1/diete_templates?nom=eq.${encodeURIComponent(nom)}&order=id.desc&limit=1&select=id`,
      { headers: supaHeaders() });
    const existTpls = existTplRes.ok ? await existTplRes.json() : [];
    let tpl;
    if (existTpls.length) {
      tpl = existTpls[0];
      // Supprimer les repas existants (aliments d'abord si pas de cascade)
      const oldRepasRes = await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tpl.id}&select=id`, { headers: supaHeaders() });
      const oldRepas = oldRepasRes.ok ? await oldRepasRes.json() : [];
      if (oldRepas.length) {
        const ids = oldRepas.map(r => r.id).join(',');
        await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments?repas_id=in.(${ids})`, { method:'DELETE', headers: supaHeaders() });
        await fetch(`${SUPABASE_URL}/rest/v1/repas?template_id=eq.${tpl.id}`, { method:'DELETE', headers: supaHeaders() });
      }
      // Mettre à jour client_only si besoin
      await fetch(`${SUPABASE_URL}/rest/v1/diete_templates?id=eq.${tpl.id}`,
        { method:'PATCH', headers: supaHeaders(), body: JSON.stringify({ client_only: !commeTemplate }) });
    } else {
      const tplRes = await fetch(`${SUPABASE_URL}/rest/v1/diete_templates`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ nom, client_only: !commeTemplate }) });
      if (!tplRes.ok) throw new Error('template ' + tplRes.status);
      tpl = (await tplRes.json())[0];
    }

    // 2. Créer les repas + aliments (+ équivalences comme variantes)
    const saveAliments = async (repasId, aliments) => {
      if (!aliments || !aliments.length) return;
      const payload = aliments.map((a, ai) => {
        const q = a.qte || 1;
        return {
          repas_id: repasId, nom: a.nom, quantite_g: q, ordre: ai,
          kcal_par_gramme: q > 0 ? (a.cals||0)/q : 0,
          prot_par_gramme: q > 0 ? (a.prot||0)/q : 0,
          glu_par_gramme:  q > 0 ? (a.glu||0)/q  : 0,
          lip_par_gramme:  q > 0 ? (a.lip||0)/q  : 0,
        };
      });
      await fetch(`${SUPABASE_URL}/rest/v1/repas_aliments`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify(payload) });
    };
    for (let ri = 0; ri < repasGAS.length; ri++) {
      const r = repasGAS[ri];
      const rRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id: tpl.id, nom: r.nom, ordre: ri, variante_index: 0 }) });
      if (!rRes.ok) throw new Error('repas ' + rRes.status);
      const savedR = (await rRes.json())[0];
      await saveAliments(savedR.id, r.aliments);
      // Équivalences → variantes du même repas (variante_index 1, 2, …)
      const equivs = r.equivalences || [];
      for (let vi = 0; vi < equivs.length; vi++) {
        const eq = equivs[vi];
        const eqRes = await fetch(`${SUPABASE_URL}/rest/v1/repas`,
          { method:'POST', headers:supaHeaders({ Prefer:'return=representation' }), body:JSON.stringify({ template_id: tpl.id, nom: eq.nom, ordre: ri, variante_index: vi + 1 }) });
        if (!eqRes.ok) continue;
        const savedEq = (await eqRes.json())[0];
        await saveAliments(savedEq.id, eq.aliments);
      }
    }

    // 3. Assigner seulement si pas déjà assignée (évite les doublons à la re-migration)
    const existCdRes = await fetch(
      `${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(migPreviewClientId)}&nom=eq.${encodeURIComponent(nom)}&select=id`,
      { headers: supaHeaders() });
    const existCd = existCdRes.ok ? await existCdRes.json() : [];
    if (!existCd.length) {
      const assignRes = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes`,
        { method:'POST', headers:supaHeaders({ Prefer:'return=minimal' }), body:JSON.stringify({ client_id: migPreviewClientId, nom, actif: true }) });
      if (!assignRes.ok) throw new Error('assign ' + assignRes.status);
    }

    // 4. Invalider le cache templates
    dieteTemplatesData = null;

    // 5. Recharger supaClientDietes
    const r2 = await fetch(`${SUPABASE_URL}/rest/v1/client_dietes?client_id=eq.${encodeURIComponent(migPreviewClientId)}&order=created_at.desc`, { headers: supaHeaders() });
    migPreviewData.supaClientDietes = r2.ok ? await r2.json() : migPreviewData.supaClientDietes;

    if (statusEl) statusEl.innerHTML = `<div style="color:var(--success);font-size:12px;padding:6px 0;">✓ Diète importée et assignée au client.</div>`;
    document.querySelectorAll('#migDieteDetail .btn.primary').forEach(b => b.disabled = false);
    const c = document.getElementById('migDieteDetail');
    if (c && migPreviewDieteDetail) c.innerHTML = _renderDieteGASDetail(migPreviewDieteDetail, migPreviewData.supaClientDietes);
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<div style="color:var(--critical);font-size:12px;">Erreur : ${esc(e.message)}</div>`;
    document.querySelectorAll('#migDieteDetail .btn.primary').forEach(b => b.disabled = false);
  }
}

        </div>

    </div>`;
}
